/* A escolha da fase acerta a idade para dentro do escalão, para os cálculos
   e os limites de esforço passarem logo a ser os certos. */
function setFase(mid,f){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(f==='bebe'){ if(!Number.isFinite(m.meses)) m.meses=12; m.idade=m.meses/12; m.gravida=false; }
  else { delete m.meses;
    const a=idadeAnos(m);
    if(f==='crianca' && !(a>=2&&a<13)) m.idade=8;
    if(f==='adolescente' && !(a>=13&&a<19)) m.idade=15;
    if(f==='adulto' && a<19) m.idade=30;
  }
  normalizaIdadeMeses(m);
  save(); render();
}
/* O aviso que acompanha cada fase. Não impede nada, mas também não deixa a
   app fingir autoridade clínica que não tem. */
function avisoFase(m){
  const meses=idadeMeses(m), fase=faseDe(m), av=[];
  if(gravida(m)){
    av.push(fetos(m)>=3
      ? '<b>Gestação de trigémeos ou mais:</b> não há valores de referência publicados para as necessidades energéticas, por isso a app não apresenta uma estimativa. O acompanhamento tem de ser da equipa de obstetrícia e nutrição.'
      : fetos(m)===2
        ? 'Numa gestação gemelar não existe recomendação oficial de energia: o acréscimo mostrado é uma aproximação e as necessidades reais costumam ser maiores. Confirma com quem te segue.'
        : 'Os valores seguem as referências para gravidez de feto único e usam o peso pré-gestacional. Não substituem o acompanhamento obstétrico e nutricional.');
  }
  if(meses<6) av.push('<b>Até aos 6 meses</b> a alimentação é leite materno ou fórmula. A app não gera plano alimentar nesta idade — a orientação é do pediatra.');
  else if(meses<24) av.push('Entre os 6 e os 24 meses o plano serve de apoio à diversificação alimentar, não de prescrição. Segue as indicações do pediatra ou do enfermeiro de família.');
  else if(fase==='crianca'||fase==='adolescente') av.push('Em idade de crescimento os valores são referências populacionais e não dispensam o acompanhamento em consulta. Restringir calorias nesta fase pode comprometer o crescimento.');
  if(!av.length) return '';
  return `<div class="msg warn-msg" style="margin:12px 0 0">${av.join('<br><br>')}</div>`;
}
/* Arrasto dos sliders de perfil: estado + espelho no campo numérico (nunca o
   focado) + atualização ao vivo de IMC, banda, basal, gasto e alvo do cartão. */
function slidePerfil(mid,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m[campo]=parseFloat(el.value)||0; pintaRange(el);
  const inp=document.getElementById('in-'+mid+'-'+campo);
  if(inp && document.activeElement!==inp) inp.value=el.value;
  aoVivo('fam:'+mid, ()=>atualizarFamilia(mid));
}
/* Slider de idade em meses (0-24): durante o gesto só se mexe em m.meses —
   a troca de controlo (para o slider em anos) só acontece no commit, para o
   dedo nunca perder o slider a meio do arrasto. */
function slideIdadeMeses(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.meses=clampNum(Math.round(parseFloat(el.value)||0),0,24);
  m.idade=m.meses/12;
  pintaRange(el);
  const inp=document.getElementById('in-'+mid+'-idade');
  if(inp && document.activeElement!==inp) inp.value=m.meses;
  aoVivo('fam:'+mid, ()=>atualizarFamilia(mid));
}
/* Ao soltar, se o valor chegou aos 24 meses (dois anos), converte-se para a
   representação em anos — dois anos é o valor mínimo medido em anos. */
function commitIdadeMeses(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  normalizaIdadeMeses(m);
  if(m.bebe){ delete m.bebe.pctLeite; m.bebe.ml=null; }
  save('idade de '+m.nome); render();
}
function atualizarFamilia(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const v=bmi(m), [cls,tone]=bmiClass(v);
  põe('f-'+mid+'-o-peso', nPT(m.peso,1)+' kg');
  põe('f-'+mid+'-o-altura', Math.round(m.altura)+' cm');
  põe('f-'+mid+'-o-idade', idadeAnos(m)<2? Math.round(idadeMeses(m))+' meses' : Math.round(m.idade)+' anos');
  põe('f-'+mid+'-imc', nPT(v,1)); põe('f-'+mid+'-imcv', nPT(v,1));
  põe('f-'+mid+'-bmr', Math.round(bmr(m)));
  põe('f-'+mid+'-tdee', Math.round(tdee(m)));
  põeAttr('f-'+mid+'-mk','transform','translate('+sx(v,15,40,8,332).toFixed(1)+',0)');
  /* o texto anda à parte do triângulo, preso dentro do viewBox para não ser
     cortado nos extremos da escala */
  põeAttr('f-'+mid+'-imcv','x', clampNum(sx(v,15,40,8,332),22,318).toFixed(1));
  const adulto=faseDe(m)==='adulto';
  const pill=document.getElementById('f-'+mid+'-cls');
  /* As classes de IMC do adulto não se aplicam a crianças, cuja leitura é
     por percentil para a idade e o sexo — mostra-se a fase em vez disso. */
  if(pill){ pill.textContent=adulto?cls:nomeFase(m); pill.setAttribute('class','pill '+(adulto?tone:'')); }
  põe('f-'+mid+'-alvo', semEstimativa(m)?'—':Math.round(targetKcal(m)));
  const h2=(m.altura/100)*(m.altura/100);
  const zmin=Math.round(18.5*h2), zmax=Math.round(25*h2), dentro=m.peso>=zmin&&m.peso<=zmax;
  const zel=document.getElementById('f-'+mid+'-zona');
  if(zel && adulto){ zel.textContent=(dentro?'✓ ':'')+'Peso saudável para '+Math.round(m.altura)+' cm: '+zmin+'–'+zmax+' kg';
    zel.setAttribute('class', dentro?'sub f-ok-txt':'sub'); }
}

/* ================= ATIVIDADE ================= */
function addSport(mid){ const m=S.members.find(x=>x.id===mid);
  m.desportos.push(normalizaDesporto({s:'caminhada',h:2,per:'semana',i:'moderado'})); save(); render(); }
function opcoesDesporto(sel){
  return CATS_SPORT.map(([c,rot])=>{
    const lista=SPORTS.filter(s=>s.cat===c);
    if(!lista.length) return '';
    return `<optgroup label="${(ICO_SPORT[c]||'')+' '+rot}">`+lista.map(s=>
      `<option value="${s.id}" ${sel===s.id?'selected':''}>${s.nome}</option>`).join('')+`</optgroup>`;
  }).join('');
}
function updSport(mid,i,f,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const s=m.desportos[i]; if(!s) return;
  if(f==='s'){
    /* Ao trocar de desporto guardam-se as horas e convertem-se para a forma
       que o novo desporto usa, para não se perder o que já estava escrito. */
    const horas=horasPeriodo(s), novo=SPORT[val];
    if(novo && novo.dist){ m.desportos[i]={s:val, per:s.per, v:novo.dist.vdef,
      km:Math.round(Math.max(horas,0.25)*novo.dist.vdef*10)/10}; }
    else { m.desportos[i]={s:val, per:s.per, h:Math.round(Math.max(horas,0.25)*10)/10,
      i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'}; }
  } else if(f==='per'){
    s.per=val;
    const sp=SPORT[s.s];
    if(sp && sp.dist) s.km=Math.min(parseFloat(s.km)||0, faixaDist(sp,val).max);
  } else if(f==='h'||f==='km'||f==='v'){ s[f]=parseFloat(val)||0; }
  else { s[f]=val; }
  save(); render();
}
function pintaRange(el){ const mn=parseFloat(el.min), mx=parseFloat(el.max), v=parseFloat(el.value);
  el.style.setProperty('--pct', (mx>mn? Math.round((clampNum(v,mn,mx)-mn)/(mx-mn)*100):0)+'%'); }
/* Contrato tátil de toda a app: oninput muta o estado e reescreve SÓ os alvos
   com id (nunca render), onchange grava. O coalescedor prende as escritas de
   DOM ao ritmo dos frames — em aparelhos lentos o input dispara mais depressa. */
/* Coalesce por chave: com dois dedos em cartões diferentes, guardar só o
   último callback deixava um deles por pintar — aqui cada alvo tem a sua
   entrada e todos correm no mesmo frame. */
let _raf=0; const _pend={};
function aoVivo(chave,fn){
  _pend[chave]=fn;
  if(_raf) return;
  _raf=requestAnimationFrame(()=>{ _raf=0;
    const fns=Object.keys(_pend).map(k=>{ const f=_pend[k]; delete _pend[k]; return f; });
    fns.forEach(f=>f());
  });
}
function põe(id,txt){ const el=document.getElementById(id); if(el) el.textContent=txt; }
function põeAttr(id,attr,val){ const el=document.getElementById(id); if(el) el.setAttribute(attr,val); }
function slideSport(mid,i,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m||!m.desportos[i]) return;
  m.desportos[i][campo]=parseFloat(el.value)||0;
  pintaRange(el);
  aoVivo('atv', atualizarAtividade);
}
function atualizarAtividade(){
  const m=curM(); if(!m) return;
  (m.desportos||[]).forEach((s,i)=>{
    const sp=SPORT[s.s]; if(!sp) return;
    const met=metDe(s), kd=met*m.peso*sportWeeklyH(s)/7;
    if(sp.dist){
      põe('sp'+i+'-km', nPT(parseFloat(s.km)||0, faixaDist(sp,s.per).step<1?1:0)+' km');
      põe('sp'+i+'-v', textoVelocidade(sp, velocidade(s)));
      põe('sp'+i+'-t', hmm(horasPeriodo(s))+' por '+porLabel(s.per));
      põe('sp'+i+'-nivel', NIVEIS[nivelPorMet(sp,met)][1]);
      /* o ponto na curva move-se só com a velocidade (o MET não depende da distância) */
      const d=sp.dist, y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
      const cx=sx(velocidade(s),d.vmin,d.vmax,36,330).toFixed(1);
      const cy=sx(met,y0,y1,104,10).toFixed(1);
      põeAttr('sp'+i+'-dot','cx',cx); põeAttr('sp'+i+'-dot','cy',cy);
      const drop=document.getElementById('sp'+i+'-drop');
      if(drop){ drop.setAttribute('x1',cx); drop.setAttribute('x2',cx);
        drop.setAttribute('y1',cy); drop.setAttribute('y2','104'); }
    }
    põe('sp'+i+'-kcal','~'+Math.round(kd)+' kcal/dia');
    põe('sp'+i+'-met', nPT(met,1)+' MET · '+Math.round(met*m.peso)+' kcal/h');
  });
  põe('tot-desporto','+'+Math.round(sportsKcalDay(m)));
  põe('tot-total', Math.round(tdee(m)));
  /* barra empilhada do gasto + linha do alvo — a mesma assinatura da Nutrição e do Plano */
  const gp=gastoPartes(m), alvo=targetKcal(m);
  const barra=document.getElementById('ga-basal');
  if(barra){
    const K=Math.max(gp.total,alvo)*1.05||1, w=x=>Math.max(0,x/K*100);
    barra.style.width=w(gp.basal)+'%';
    document.getElementById('ga-dia').style.width=w(gp.dia)+'%';
    document.getElementById('ga-desloc').style.width=w(gp.desloc)+'%';
    document.getElementById('ga-desp').style.width=w(gp.desp)+'%';
    const X=w(alvo), linha=document.getElementById('ga-alvo'), txt=document.getElementById('ga-alvo-txt');
    if(linha) linha.style.left=X+'%';
    if(txt){ txt.style.left=X+'%'; txt.style.transform=X>78?'translateX(-100%)':'none';
      txt.textContent='alvo '+Math.round(alvo); }
    põe('ga-alvostat', Math.round(alvo));
  }
}
function delSport(mid,i){ const m=S.members.find(x=>x.id===mid); m.desportos.splice(i,1); save(); render(); }

/* Curva velocidade→MET com o ponto do slider. A interpolação da app é linear,
   por isso a polyline pelos pontos tabelados É a curva exata, não uma amostra. */
function curvaMetSvg(sp,s,i){
  const d=sp.dist, c=CURVAS[d.curva];
  const y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
  const X=v=>sx(v,d.vmin,d.vmax,36,330), Y=met=>sx(met,y0,y1,104,10);
  const pts=[[d.vmin,metPorVelocidade(d.curva,d.vmin)]]
    .concat(c.filter(p=>p[0]>d.vmin&&p[0]<d.vmax))
    .concat([[d.vmax,metPorVelocidade(d.curva,d.vmax)]]);
  const poly=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const area=poly+' '+X(d.vmax).toFixed(1)+',104 '+X(d.vmin).toFixed(1)+',104';
  /* divisórias de nível derivadas dos mesmos limiares de nivelPorMet */
  const v1=velocidadeParaMet(d,(sp.mets[0]+sp.mets[1])/2), v2=velocidadeParaMet(d,(sp.mets[1]+sp.mets[2])/2);
  const zonas=[[d.vmin,v1,'leve'],[v1,v2,'moderado'],[v2,d.vmax,'intenso']];
  const rotZonas=zonas.map(z=>{ const w=X(z[1])-X(z[0]);
    return w>=44? `<text x="${((X(z[0])+X(z[1]))/2).toFixed(1)}" y="20" font-size="9.5" text-anchor="middle" class="f-mut">${z[2]}</text>`:''; }).join('');
  const divisorias=[v1,v2].map(v=>`<line x1="${X(v).toFixed(1)}" y1="10" x2="${X(v).toFixed(1)}" y2="104" class="s-line" stroke-dasharray="2 4"/>`).join('');
  const meio=Math.round((d.vmin+d.vmax)/2);
  /* a natação vai de 1,5 a 4,5 km/h: arredondar o rótulo a inteiro punha «2» e
     «5» por baixo dos extremos reais */
  const rotV=v=>nPT(v, Number.isInteger(v)?0:1);
  const ticksX=[d.vmin,meio,d.vmax].map(v=>`<text x="${X(v).toFixed(1)}" y="116" font-size="10" text-anchor="middle" class="f-mut" style="font-variant-numeric:tabular-nums">${rotV(v)}</text>`).join('');
  const m1=Math.ceil(y0), m2=Math.floor(y1);
  /* A unidade vai colada ao valor de cima em vez de num rótulo no canto: o
     canto ficava exatamente onde o traço do topo cai quando a escala aperta,
     e «MET» passava por cima do número. */
  const ticksY=`<text x="32" y="${(Y(m1)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m1} MET</text>
    <text x="32" y="${(Y(m2)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m2}</text>`;
  const vA=velocidade(s), cx=X(vA).toFixed(1), cy=Y(metDe(s)).toFixed(1);
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 136" preserveAspectRatio="none" aria-hidden="true">
    <line x1="36" y1="104" x2="330" y2="104" class="s-line"/>
    <polygon points="${area}" class="f-acc" fill-opacity=".07"/>
    <polyline points="${poly}" class="s-acc" fill="none" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${divisorias}${rotZonas}${ticksX}${ticksY}
    <text x="330" y="133" font-size="9.5" text-anchor="end" class="f-mut">km/h</text>
    <line id="sp${i}-drop" x1="${cx}" y1="${cy}" x2="${cx}" y2="104" class="s-energy" stroke-dasharray="3 3" opacity=".5"/>
    <circle id="sp${i}-dot" cx="${cx}" cy="${cy}" r="5.5" style="fill:var(--energy);stroke:var(--card);stroke-width:2"/>
  </svg>`;
}
/* Desportos por níveis: escala fixa 2–16 MET, comparável entre desportos —
   vê-se que o «intenso» do ténis de mesa fica abaixo do «leve» da corrida. */
function escalaMet3(sp,s){
  const x=met=>sx(clampNum(met,2,16),2,16,12,328);
  const ni=nivelIndice(s.i);
  return `<svg class="svgfx" viewBox="0 0 340 40" aria-hidden="true">
    <line x1="12" y1="22" x2="328" y2="22" class="s-line"/>
    ${sp.mets.map((met,idx)=>`
      <circle cx="${x(met).toFixed(1)}" cy="22" r="${idx===ni?6:4}" style="${idx===ni?'fill:var(--accent);stroke:var(--card);stroke-width:2':'fill:var(--card);stroke:var(--mut);stroke-width:1.5'}"/>
      <text x="${x(met).toFixed(1)}" y="38" font-size="9.5" text-anchor="middle" class="${idx===ni?'f-ink':'f-mut'}" style="font-variant-numeric:tabular-nums"${idx===ni?' font-weight="700"':''}>${nPT(met,1)}</text>`).join('')}
    <text x="328" y="10" font-size="9.5" text-anchor="end" class="f-mut">escala 2–16 MET</text>
  </svg>`;
}
function blocoDesporto(m,s,i){
  const sp=SPORT[s.s], met=metDe(s);
  const kd=Math.round(met*m.peso*sportWeeklyH(s)/7), kh=Math.round(met*m.peso);
  const periodo=`<select onchange="updSport('${m.id}',${i},'per',this.value)" aria-label="Período">
      <option value="dia" ${s.per==='dia'?'selected':''}>por dia</option>
      <option value="semana" ${s.per==='semana'?'selected':''}>por semana</option>
      <option value="mes" ${s.per==='mes'?'selected':''}>por mês</option></select>`;
  const gasto=`<span class="kcal" id="sp${i}-kcal">~${kd} kcal/dia</span>
    <span class="sub" id="sp${i}-met">${nPT(met,1)} MET · ${kh} kcal/h</span>`;
  let miolo;
  if(sp.dist){
    const f=faixaDist(sp,s.per), km=parseFloat(s.km)||0, v=velocidade(s);
    const pctKm=f.max>0? Math.round(km/f.max*100):0;
    const pctV=Math.round((v-sp.dist.vmin)/(sp.dist.vmax-sp.dist.vmin)*100);
    miolo=`<div class="spgrid">
      <div>
        <div class="splabel"><span>Distância por ${porLabel(s.per)} ${dica('distancia')}</span>
          <output id="sp${i}-km">${nPT(km,f.step<1?1:0)} km</output></div>
        <input type="range" min="0" max="${f.max}" step="${f.step}" value="${km}" style="--pct:${pctKm}%"
          aria-label="Distância por ${porLabel(s.per)}, em quilómetros"
          oninput="slideSport('${m.id}',${i},'km',this)" onchange="save()">
      </div>
      <div class="splabel" style="margin:2px 0 0"><span>Esforço em função da velocidade ${dica('curvaMet')}</span></div>
      ${curvaMetSvg(sp,s,i)}
      <div>
        <div class="splabel"><span>Velocidade</span>
          <output id="sp${i}-v">${textoVelocidade(sp,v)}</output></div>
        <input type="range" min="${sp.dist.vmin}" max="${sp.dist.vmax}" step="${sp.dist.vStep}" value="${v}" style="--pct:${pctV}%"
          aria-label="Velocidade média em quilómetros por hora"
          oninput="slideSport('${m.id}',${i},'v',this)" onchange="save()">
      </div>
    </div>
    <div class="spfoot">${periodo}
      <span class="pill nivel" id="sp${i}-nivel">${NIVEIS[nivelPorMet(sp,met)][1]}</span>
      <span class="sub" id="sp${i}-t">${hmm(horasPeriodo(s))} por ${porLabel(s.per)}</span>
      <span class="spgasto">${gasto}</span></div>`;
  } else {
    miolo=`<div class="splabel" style="margin:2px 0 0"><span>Intensidade ${dica('intensidade')}</span></div>
      ${escalaMet3(sp,s)}<div class="spfoot">
      <select onchange="updSport('${m.id}',${i},'i',this.value)" aria-label="Intensidade">${NIVEIS.map(([k],ni)=>
        `<option value="${k}" ${nivelIndice(s.i)===ni?'selected':''}>${rotuloNivel(sp,ni)}</option>`).join('')}</select>
      <span class="sphoras"><input type="number" min="0" step="0.5" inputmode="decimal" value="${s.h}"
        aria-label="Horas" onchange="updSport('${m.id}',${i},'h',this.value)"> <span class="sub">h</span></span>
      ${periodo}<span class="spgasto">${gasto}</span></div>`;
  }
  return `<div class="spline">
    <div class="sptop">
      <select onchange="updSport('${m.id}',${i},'s',this.value)" aria-label="Desporto">${opcoesDesporto(s.s)}</select>
      <button class="btn danger small" onclick="delSport('${m.id}',${i})" aria-label="Remover desporto">✕</button>
    </div>${miolo}</div>`;
}
/* Recomendação e limites de esforço da fase, com o que está registado a ser
   comparado com o que é recomendado — e a lista concreta do que evitar. */
function cartaoEsforco(m){
  const L=limitesEsforco(m), min=Math.round(minutosSemana(m));
  const registados=(m.desportos||[]).map(s=>s.s);
  const conflitos=registados.filter(id=>L.evitar.indexOf(id)>=0)
    .map(id=>SPORT[id]&&SPORT[id].nome).filter(Boolean);
  const acimaNivel=L.nivelMax? (m.desportos||[]).filter(s=>{
    const sp=SPORT[s.s]; if(!sp) return false;
    const idx=sp.dist? nivelPorMet(sp,metDe(s)) : nivelIndice(s.i);
    return idx>NIVEIS.findIndex(n=>n[0]===L.nivelMax);
  }).map(s=>SPORT[s.s].nome) : [];
  const alvoSemana = L.fase==='adulto'&&!gravida(m)? 150 : gravida(m)? 150 : 420;
  const pctA=Math.min(100, alvoSemana? min/alvoSemana*100 : 0);
  return `<div class="card" style="margin-top:16px;border-left:4px solid var(--accent)">
    <h3>Esforço recomendado — ${nomeFase(m)} ${dica('esforco')}</h3>
    <p class="sub" style="margin-top:6px">${L.recomendacao}</p>
    <div style="margin:12px 0 6px">
      <div class="splabel"><span>Registado por semana</span><output style="min-width:12ch;text-align:right">${hmm(min/60)}</output></div>
      <div class="mbar" style="height:10px"><div style="width:${pctA.toFixed(1)}%;background:var(--accent)"></div></div>
      <p class="sub" style="margin-top:4px">Referência para esta fase: cerca de ${hmm(alvoSemana/60)} por semana de atividade moderada${L.fase!=='adulto'&&!gravida(m)?' a vigorosa':''}.</p>
    </div>
    ${L.horasMax&&min/60>L.horasMax? `<div class="msg warn-msg" style="margin:8px 0 0">O desporto organizado ultrapassa as ${L.horasMax} h por semana que se costumam apontar como teto nesta idade. Em crescimento, o excesso de volume está associado a lesões por sobreuso.</div>`:''}
    ${gravida(m)&&min>300? `<div class="msg warn-msg" style="margin:8px 0 0">Mais de 300 minutos por semana na gravidez merece confirmação com quem te segue.</div>`:''}
    ${conflitos.length? `<div class="msg warn-msg" style="margin:8px 0 0">Modalidades registadas desaconselhadas nesta fase: <b>${conflitos.join(', ')}</b>. ${gravida(m)?'Na gravidez evitam-se desportos de contacto, com risco de queda ou de trauma abdominal.':'Nesta idade estas modalidades não são as indicadas.'}</div>`:''}
    ${acimaNivel.length? `<div class="msg warn-msg" style="margin:8px 0 0">Intensidade acima do recomendado em: <b>${acimaNivel.join(', ')}</b>. O limite sugerido nesta fase é «${L.nivelMax}».</div>`:''}
    ${L.notas.length? `<ul class="sub" style="margin:10px 0 0;padding-left:18px">${L.notas.map(n=>`<li style="margin-bottom:4px">${n}</li>`).join('')}</ul>`:''}
    ${idadeAnos(m)<19? `<p class="sub" style="margin-top:10px">Nota de cálculo: as calorias por METs foram medidas em adultos. Em crianças o custo relativo do mesmo movimento é diferente, pelo que estes valores servem de ordem de grandeza e não de medição.</p>`:''}
  </div>`;
}
function renderAtividade(){
  if(!S.members.length) return noMembers();
  const m=curM();
  const sK=Math.round(sportsKcalDay(m)), cK=Math.round(commuteKcalDay(m));
  return memberPicker()+`
  <div class="grid" style="grid-template-columns:1fr;max-width:760px">
    <div class="card">
      <h2>Dia-a-dia de ${esc(m.nome)}</h2>
      <div class="frow" style="grid-template-columns:1fr 1fr">
        <div><label class="lbl">Nível de atividade diária ${dica('nivelAtiv')}</label>
          <select onchange="upd('${m.id}','atividade',this.value)">${Object.entries(BASE_ACT).map(([k,v])=>
            `<option value="${k}" ${m.atividade===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
        <div><label class="lbl">Deslocação para o trabalho/escola ${dica('desloc','dica-e')}</label>
          <select onchange="upd('${m.id}','desloc',this.value)">${Object.entries(COMMUTE).map(([k,v])=>
            `<option value="${k}" ${m.desloc===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>Desporto praticado</h2>
        <button class="btn small" onclick="addSport('${m.id}')">+ Adicionar desporto</button></div>
      ${m.desportos.length? `<div class="splist">${m.desportos.map((s,i)=>blocoDesporto(m,s,i)).join('')}</div>`
        : `<p class="sub" style="margin-top:8px">Sem desportos registados — adiciona os treinos para contarem no gasto calórico.</p>`}
      ${cartaoEsforco(m)}
      <p class="sub" style="margin-top:12px">Na corrida, no ciclismo, na natação, no remo e na patinagem é a velocidade

        </div>
        <div id="ga-alvo" style="position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink);left:${X}%"></div>
      </div>
      <div class="mleg"><span><i class="dot" style="background:var(--mut);opacity:.5"></i>Basal</span>
        <span><i class="dot" style="background:var(--accent)"></i>Dia-a-dia</span>
        <span><i class="dot" style="background:var(--ok)"></i>Deslocações</span>
        <span><i class="dot" style="background:var(--energy)"></i>Desporto</span></div>
      <div class="row" style="margin-top:12px">
        <div class="stat"><b>${Math.round(gp.basal)}</b><span>Basal</span></div>

        <div class="stat"><b>+${cK}</b><span>Deslocações</span></div>

      <div class="row" style="margin-top:12px;justify-content:space-between">
        <p class="sub" style="margin:0">A distância entre o fim da barra e a linha tracejada é o défice (ou superavit) do plano alimentar. Estimativa por METs sobre a fórmula de Mifflin-St Jeor.</p>
        <button class="chip" onclick="go('nutricao')">Ajustar alvo na Nutrição →</button>
      </div>
    </div>`; })()}
  </div>`;
}

/* ================= NUTRIÇÃO ================= */
function setCuis(v){ S.ui.cuis=(v==='todas'||temChave(CUIS,v))? v:'todas'; saveMeta(); render(); }
function setDietaF(v){ S.ui.dietaF=(v==='todas'||temChave(DIETS,v))? v:'todas'; saveMeta(); render(); }
function setAlergF(v){ S.ui.alergF=ehAlergenio(v)? v:''; saveMeta(); render(); }
function limparFiltros(){ S.ui.cuis='todas'; S.ui.dietaF='todas'; S.ui.mealF='todas'; S.ui.busca=''; S.ui.alergF=''; saveMeta(); render(); }
/* Pesquisa por nome: sem acentos e sem maiúsculas dos dois lados, porque
   ninguém escreve «Bacalhau à Brás» com o à certo numa caixa de pesquisa. E
   procura também nos ingredientes — «quem tem couve na despensa» é uma
   pergunta tão legítima como «onde está a receita do polvo». */
function semAcentos(s){
  return String(s||'').normalize? String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    : String(s||'').toLowerCase();
}
function correspondeBusca(r,q){
  if(!q) return true;
  if(semAcentos(r.n).indexOf(q)>=0) return true;
  return r.i.some(x=>semAcentos(x[0]).indexOf(q)>=0);
}
/* A escrever não se redesenha a página: filtra-se a grelha que já está no
   ecrã, para o cursor não saltar da caixa a cada tecla. */
function setBusca(v,el){
  S.ui.busca=String(v||'').slice(0,60);
  saveMeta();
  const q=semAcentos(S.ui.busca).trim();
  const grelha=document.getElementById('rec-grelha');
  if(!grelha){ render(); return; }
  let visiveis=0;
  grelha.querySelectorAll('.rc[data-rid]').forEach(c=>{
    const r=RECIPES.find(x=>x.id===c.getAttribute('data-rid'));
    const mostra=!!r && correspondeBusca(r,q);
    c.style.display=mostra? '':'none';
    if(mostra) visiveis++;
  });
  põe('rec-conta', visiveis+' de '+RECIPES.length+' receitas');
  const vazio=document.getElementById('rec-vazio');
  if(vazio) vazio.style.display=visiveis? 'none':'';
}
function setMealF(v){ S.ui.mealF=(v==='todas'||v==='ac'||MEALK.indexOf(v)>=0)? v:'todas'; saveMeta(); render(); }
function toggleComp(){ S.ui.soComp=!S.ui.soComp; saveMeta(); render(); }

function macroBar(pct){ return `<div class="mbar">
    <div id="nu-bar-c" style="width:${pct.c}%;background:var(--mc)"></div>
    <div id="nu-bar-p" style="width:${pct.p}%;background:var(--mp)"></div>
    <div id="nu-bar-f" style="width:${pct.f}%;background:var(--mf)"></div></div>
  <div class="mleg"><span><i class="dot" style="background:var(--mc)"></i><span id="nu-leg-c">Hidratos ${pct.c}%</span></span>
    <span><i class="dot" style="background:var(--mp)"></i><span id="nu-leg-p">Proteína ${pct.p}%</span></span>
    <span><i class="dot" style="background:var(--mf)"></i><span id="nu-leg-f">Gordura ${pct.f}%</span></span></div>`; }

/* O que uma pessoa não come vale tanto como a dieta que faz: filtra as mesmas
   receitas e entra nas mesmas contas. Fica ao lado do tipo de dieta porque é
   a mesma decisão vista de outro lado — uma diz o que se procura, a outra diz
   o que não entra em casa. */

/* ================= RECEITAS DA CASA =================
   Uma receita escrita por quem usa a app é uma receita como as outras: entra
   nas sugestões, no plano, na despensa e na lista de compras pela mesma
   porta. A diferença é que os macros não vêm escritos — saem dos ingredientes
   e do número de doses, pela mesma função que recalcula a biblioteca inteira.

   Os ingredientes só podem sair do catálogo. Não é uma limitação por
   preguiça: é o que garante que o nome bate certo, byte a byte, com a
   despensa e com a lista de compras, e que existe composição para calcular. */
/* A unidade de cada ingrediente vem primeiro do que as receitas da biblioteca
   já usam — é o que garante que a lista de compras soma peras com peras — e
   só depois da tabela de composição, para os ingredientes que ainda não
   apareceram em receita nenhuma. */
const UNID_ING={};
RECIPES.forEach(r=>r.i.forEach(([n,q,u])=>{ if(!temChave(UNID_ING,n)) UNID_ING[n]=u; }));
function unidadeDe(nome){
  if(temChave(UNID_ING,nome)) return UNID_ING[nome];
  return (temChave(NUTRI,nome) && NUTRI[nome].u)? NUTRI[nome].u : 'g';
}

function limparReceita(x){
  x=x||{};
  const coz=temChave(CUIS,x.coz)? x.coz : 'portuguesa';
  const mt=Array.isArray(x.mt)? x.mt.filter((k,i,a)=>MEALK.indexOf(k)>=0&&a.indexOf(k)===i) : [];
  const cat=catalogoIngredientes();
  const i=(Array.isArray(x.i)? x.i : [])
    .filter(l=>Array.isArray(l)&&cat.indexOf(l[0])>=0&&(parseFloat(l[1])||0)>0)
    .map(l=>[l[0], Math.round((parseFloat(l[1])||0)*100)/100, unidadeDe(l[0])])
    .slice(0,40);
  if(!i.length) return null;
  return {id:'u_'+limparId(String(x.id||'').replace(/^u_/,'')),
    n:String(x.n||'Receita sem nome').slice(0,80),
    coz, mt: mt.length? mt : ['a','j'],
    doses: clampNum(Math.round(parseFloat(x.doses)||1),1,12), i};
}
/* A biblioteca é uma só: as receitas da casa são acrescentadas ao mesmo array
   que todo o resto lê. Sincronizar é tirar as antigas e voltar a pô-las com
   os macros e os atributos recalculados — nunca há duas versões da mesma. */
function sincronizaReceitas(){
  for(let i=RECIPES.length-1;i>=0;i--) if(RECIPES[i].u) RECIPES.splice(i,1);
  if(!Array.isArray(S.receitas)) S.receitas=[];
  S.receitas.forEach(x=>{
    const m=macrosDeIngredientes(x.i,x.doses);
    const r={id:x.id, n:x.n, coz:x.coz, d:[], k:m.k, c:Math.round(m.c), p:Math.round(m.p),
      f:Math.round(m.f), fib:Math.round(m.fib), i:x.i.map(l=>[l[0], Math.round(l[1]/Math.max(1,x.doses)*100)/100, l[2]]),
      mt:x.mt, u:true, doses:x.doses};
    const s=[]; r.i.forEach(l=>atributosIng(l[0]).forEach(t=>{ if(s.indexOf(t)<0) s.push(t); }));
    r.at=s;
    /* nada se declara numa receita da casa: vegetariana, vegan e paleo saem
       do que ela leva dentro, dentro de dietasDaReceita, tal como na
       biblioteca — não há aqui duas regras diferentes */
    r.dc=dietasDaReceita(r);
    RECIPES.push(r);
  });
}
function receitaPorId(id){ return RECIPES.find(r=>r.id===id); }

/* ---- Editor ---- */
function edCfg(){
  if(!S.ui.editor||typeof S.ui.editor!=='object') S.ui.editor=null;
  return S.ui.editor;
}
function abrirEditor(rid){
  const base=rid? receitaPorId(rid) : null;
  if(base && base.u){
    const orig=S.receitas.find(x=>x.id===base.id);
    S.ui.editor={id:base.id, n:base.n, coz:base.coz, mt:base.mt.slice(), doses:orig? orig.doses:1,
      i:(orig? orig.i : base.i).map(l=>l.slice())};
  } else if(base){
    /* uma receita da biblioteca copia-se para editar: o original fica intacto
       para quem quiser voltar a ele, e a cópia é da casa */
    S.ui.editor={id:null, n:base.n+' (a meu gosto)', coz:base.coz, mt:base.mt.slice(), doses:1,
      i:base.i.map(l=>l.slice())};
  } else {
    S.ui.editor={id:null, n:'', coz:'portuguesa', mt:['a','j'], doses:2, i:[]};
  }
  S.ui.tab='receitas'; saveMeta(); render();
  const el=document.getElementById('editor'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function fecharEditor(){ S.ui.editor=null; saveMeta(); render(); }
function edSet(campo,valor){
  const e=edCfg(); if(!e) return;
  if(campo==='n') e.n=String(valor).slice(0,80);
  else if(campo==='coz') e.coz=temChave(CUIS,valor)? valor : e.coz;
  else if(campo==='doses') e.doses=clampNum(Math.round(parseFloat(valor)||1),1,12);
  saveMeta();
  if(campo==='doses') atualizarEditor();
}
function edToggleRef(k){
  const e=edCfg(); if(!e||MEALK.indexOf(k)<0) return;
  const i=e.mt.indexOf(k); i>=0? e.mt.splice(i,1) : e.mt.push(k);
  saveMeta(); render();
}
function edAddIng(){
  const e=edCfg(); if(!e||e.i.length>=40) return;
  const cat=catalogoIngredientes();
  const nome=cat.find(n=>!e.i.some(l=>l[0]===n))||cat[0];
  e.i.push([nome, unidadeDe(nome)==='un'?1:100, unidadeDe(nome)]);
  saveMeta(); render();
}
function edDelIng(idx){ const e=edCfg(); if(!e) return; e.i.splice(idx,1); saveMeta(); render(); }
function edSetIng(idx,campo,valor){
  const e=edCfg(); if(!e||!e.i[idx]) return;
  if(campo==='nome'){
    if(catalogoIngredientes().indexOf(valor)<0) return;
    e.i[idx][0]=valor; e.i[idx][2]=unidadeDe(valor);
    saveMeta(); render(); return;
  }
  e.i[idx][1]=Math.max(0,Math.round((parseFloat(valor)||0)*100)/100);
  saveMeta(); atualizarEditor();
}
/* O painel de macros muda a cada tecla, mas o resto do editor não: escrever
   uma quantidade não pode redesenhar a página por baixo do dedo. */
function atualizarEditor(){
  const alvo=document.getElementById('ed-macros'); if(!alvo) return;
  alvo.innerHTML=painelMacrosEditor();
}
function edValido(){
  const e=edCfg(); if(!e) return null;
  if(!e.n.trim()) return 'Falta o nome da receita.';
  if(!e.i.length) return 'Uma receita precisa de pelo menos um ingrediente.';
  if(e.i.some(l=>!(l[1]>0))) return 'Há ingredientes com quantidade a zero.';
  if(!e.mt.length) return 'Escolhe pelo menos uma refeição onde esta receita encaixa.';
  return null;
}
function guardarReceita(){
  const e=edCfg(); if(!e) return;
  const erro=edValido();
  if(erro){ flash('bad',erro); return; }
  if(!Array.isArray(S.receitas)) S.receitas=[];
  const limpa=limparReceita({id:e.id||uid(), n:e.n.trim(), coz:e.coz, mt:e.mt, doses:e.doses, i:e.i});
  if(!limpa){ flash('bad','Não foi possível guardar: os ingredientes não são válidos.'); return; }
  const idx=e.id? S.receitas.findIndex(x=>x.id===e.id) : -1;
  if(idx>=0) S.receitas[idx]=limpa; else S.receitas.push(limpa);
  sincronizaReceitas();
  S.ui.editor=null;
  save(idx>=0? 'edição da receita '+limpa.n : 'nova receita '+limpa.n);
  flash('ok',(idx>=0?'Receita atualizada: ':'Receita guardada: ')+limpa.n+' — '+receitaPorId(limpa.id).k+' kcal por dose.');
}
function apagarReceita(id){
  const r=receitaPorId(id); if(!r) return;
  if(!confirm('Apagar a receita «'+r.n+'»? As refeições já planeadas com ela ficam por escolher.')) return;
  S.receitas=(S.receitas||[]).filter(x=>x.id!==id);
  /* uma receita apagada não pode continuar planeada: ficaria um id órfão que
     o plano lê como refeição vazia sem dizer porquê */
  Object.values(S.plans).forEach(w=>Object.values(w).forEach(d=>MEALK.forEach(k=>{
    if(d[k]&&d[k].r===id){ d[k].r=''; d[k].ac=''; }
    if(d[k]&&d[k].ac===id) d[k].ac=''; })));
  sincronizaReceitas();
  if(S.ui.editor&&S.ui.editor.id===id) S.ui.editor=null;
  save('receita apagada'); render();
}
function painelMacrosEditor(){
  const e=edCfg(); if(!e) return '';
  const m=macrosDeIngredientes(e.i,e.doses);
  const total=macrosDeIngredientes(e.i,1);
  const liq=Math.max(0,m.c-m.fib);
  const dietas=[];
  if(liq<=HC_TETO.keto) dietas.push('Keto');
  if(liq<=HC_TETO.lowcarb) dietas.push('Low carb');
  if(m.f*9<=m.k*GORD_TETO_LOWFAT) dietas.push('Low fat');
  const at=[]; e.i.forEach(l=>atributosIng(l[0]).forEach(t=>{ if(at.indexOf(t)<0) at.push(t); }));
  if(!DIETA_VETA.vegetariana.some(t=>at.indexOf(t)>=0)) dietas.push('Vegetariana');
  if(!DIETA_VETA.vegan.some(t=>at.indexOf(t)>=0)) dietas.push('Vegan');
  if(!DIETA_VETA.paleo.some(t=>at.indexOf(t)>=0)) dietas.push('Paleo');
  const pct=m.k>0? {c:Math.round(m.c*4/m.k*100), p:Math.round(m.p*4/m.k*100), f:Math.round(m.f*9/m.k*100)} : {c:0,p:0,f:0};
  return `<div class="row" style="justify-content:space-between;align-items:baseline">
      <b>Por dose</b><span class="kcal">${m.k} kcal</span></div>
    <div class="mbar" style="margin-top:6px">
      <div style="width:${pct.c}%;background:var(--mc)"></div>
      <div style="width:${pct.p}%;background:var(--mp)"></div>
      <div style="width:${pct.f}%;background:var(--mf)"></div></div>
    <div class="mleg"><span><i class="dot" style="background:var(--mc)"></i>Hidratos ${nPT(m.c,1)} g</span>
      <span><i class="dot" style="background:var(--mp)"></i>Proteína ${nPT(m.p,1)} g</span>
      <span><i class="dot" style="background:var(--mf)"></i>Gordura ${nPT(m.f,1)} g</span></div>
    <div class="sub" style="margin-top:6px">Fibra ${nPT(m.fib,1)} g · hidrato líquido ${nPT(liq,1)} g
      · receita inteira ${total.k} kcal para ${e.doses} dose${e.doses===1?'':'s'}</div>
    <div style="margin-top:6px">${dietas.length? dietas.map(d=>`<span class="tag">${d}</span>`).join('')
      : '<span class="sub">Sem etiquetas de dieta: serve quem come de tudo.</span>'}</div>
    ${m.semDados.length? `<p class="sub" style="color:var(--warn);margin-top:6px">⚠ Sem composição para: ${m.semDados.map(esc).join(', ')} — estes ingredientes não entram na conta.</p>`:''}`;
}
function cartaoEditor(){
  const e=edCfg(); if(!e) return '';
  const cat=catalogoIngredientes();
  const erro=edValido();
  return `<div class="card" id="editor" style="margin-bottom:16px;border-color:var(--accent)">
    <div class="row" style="justify-content:space-between">
      <h2>${e.id? '✏️ Editar receita' : '🍳 Nova receita'} ${dica('editorReceitas')}</h2>
      <button class="chip" onclick="fecharEditor()">Fechar</button>
    </div>
    <div class="frow">
      <div style="grid-column:span 2"><label class="lbl">Nome</label>
        <input type="text" value="${esc(e.n)}" placeholder="Ex.: Arroz de forno da avó" onchange="edSet('n',this.value)"></div>
      <div><label class="lbl">Cozinha</label><select onchange="edSet('coz',this.value)">
        ${Object.entries(CUIS).map(([k,v])=>`<option value="${k}" ${e.coz===k?'selected':''}>${(ICO_COZ[k]||'')+' '+v}</option>`).join('')}</select></div>
      <div><label class="lbl">Doses que rende</label>

    </div>
    <div style="margin-top:14px">
      <div class="row" style="justify-content:space-between">
        <label class="lbl" style="margin:0">Ingredientes — quantidades da receita inteira</label>
        <button class="btn ghost small" onclick="edAddIng()">+ Ingrediente</button>
      </div>
      ${e.i.length? `<div class="ed-lista">${e.i.map((l,idx)=>`<div class="ed-linha">
        <select onchange="edSetIng(${idx},'nome',this.value)" aria-label="Ingrediente ${idx+1}">
          ${cat.map(n=>`<option value="${esc(n)}" ${l[0]===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
        <input type="number" min="0" step="${l[2]==='un'||l[2]==='dente'?'0.25':'5'}" value="${l[1]}"
          oninput="edSetIng(${idx},'q',this.value)" aria-label="Quantidade">
        <span class="sub">${l[2]}</span>
        <button class="btn danger small" onclick="edDelIng(${idx})" aria-label="Remover">✕</button>
      </div>`).join('')}</div>`
      : `<p class="sub" style="margin-top:8px">Ainda sem ingredientes. Só entram nomes do catálogo — é isso que faz a receita falar com a despensa e com a lista de compras.</p>`}
    </div>
    <div class="card" id="ed-macros" style="margin-top:14px;background:var(--bg)">${painelMacrosEditor()}</div>
    <div class="row" style="margin-top:14px">

      ${e.id? `<button class="btn danger small" onclick="apagarReceita('${e.id}')">Apagar</button>`:''}
      <button class="chip" onclick="fecharEditor()">Cancelar</button>
      ${erro? `<span class="sub" style="color:var(--warn)">${erro}</span>`:''}
    </div>
  </div>`;
}

/* Alergias e exclusões são a mesma mecânica com pesos diferentes: uma alergia
   tem consequências de saúde, uma exclusão é uma escolha. Por isso vivem em
   sítios diferentes — as alergias no perfil, à vista de quem cria o membro; as
   exclusões ao lado da dieta — e falam com vozes diferentes. */
function grupoRestricoes(m,lista,alerta){
  const at=Array.isArray(m.restricoes)? m.restricoes : [];
  const implicitas=(DIETA_VETA[chaveDieta(m)]||[]).filter(k=>temChave(RESTR,k));
  return `<div class="row restr">
      ${lista.map(([k,nome,ico,desc])=>{
        const impl=implicitas.indexOf(k)>=0, on=at.indexOf(k)>=0||impl;
        return `<button class="chip ${on?'on':''} ${on&&alerta?'perigo':''}"
          ${impl?'disabled ':''}title="${esc(impl? 'Implícito na dieta '+dietaDe(m).n+'. ' : '')}${esc(desc||'')}"
          onclick="toggleRestricao('${m.id}','${k}')">${ico} ${nome}</button>`;}).join('')}
    </div>`;
}
function blocoAlergias(m){
  const at=(Array.isArray(m.restricoes)? m.restricoes : []).filter(ehAlergenio);
  const afetadas=RECIPES.filter(r=>r.at.some(t=>at.indexOf(t)>=0)).length;
  return `<div class="card-alergia" style="margin-top:10px">
    <label class="lbl" style="margin:0">🚨 Alergias e intolerâncias ${dica('alergias')}</label>
    ${grupoRestricoes(m,ALERGENIOS,true)}
    <p class="sub" style="margin-top:6px">${at.length
      ? '<b class="f-bad-txt">'+afetadas+' das '+RECIPES.length+' receitas contêm um destes alergénios</b> e deixam de ser sugeridas a '+esc(m.nome.split(' ')[0])+'. Isto ajuda a planear, mas não dispensa ler o rótulo de cada embalagem nem perguntar num restaurante.'
      : 'As catorze categorias de declaração obrigatória na União Europeia (anexo II do Regulamento 1169/2011). Marca as que se aplicam.'}</p>
  </div>`;
}
function blocoRestricoes(m){

  return `<div style="margin-top:14px">

    <p class="sub" style="margin-top:6px">${afetadas? afetadas+' das '+RECIPES.length+' receitas deixam de ser sugeridas a esta pessoa, contando alergias e dieta.'

      As alergias marcam-se no perfil, no separador <a href="#" onclick="go('familia');return false">Família</a>.</p>

}
function setPorcoes(v){
  const n=parseInt(v,10);
  S.ui.porcoes=Number.isFinite(n)? clampNum(n,1,12) : null;
  saveMeta(); render();
}
function porcoesAtuais(){
  const n=parseInt(S.ui.porcoes,10);
  if(Number.isFinite(n)) return clampNum(n,1,12);
  return Math.max(1,S.members.length);
}

function recipeCard(r,n){
  /* Compatível = a dieta serve e não leva nada que a pessoa tenha excluído.
     São duas perguntas diferentes e a segunda é a que magoa, por isso a
     resposta é o ingrediente concreto, não um aviso genérico. */
  const comp=S.members.filter(m=>compat(r,chaveDieta(m))&&!ingredientesVetados(r,m).length);
  /* o que é alergia sai no aviso vermelho; aqui fica só o resto, para não se
     dizer a mesma coisa duas vezes com dois pesos diferentes */
  const vetados=S.members.map(m=>{
    const al=alergenicosDe(r,m).reduce((s,a)=>s.concat(a.itens),[]);
    return {m, itens:ingredientesVetados(r,m).filter(x=>al.indexOf(x)<0)};
  }).filter(x=>x.itens.length);
  const disp=disponibilidadeReceita(r);
  return `<div class="rc" data-rid="${r.id}">
    <div class="row" style="justify-content:space-between"><h3>${esc(r.n)}</h3><span class="kcal">${r.k} kcal</span></div>
    <div><span class="tag" style="border-color:var(--accent);color:var(--accent)">${r.mt.map(nomeRefeicao).join(' / ')}</span>
      <span class="tag">${ICO_COZ[r.coz]||''} ${CUIS[r.coz]}</span>${r.dc.filter(d=>d!==r.coz).map(d=>`<span class="tag">${DIETS[d].n}</span>`).join('')}</div>
    <div class="sub" style="font-variant-numeric:tabular-nums">H ${r.c} g · P ${r.p} g · G ${r.f} g</div>
    <span class="pill ${disp.pronta?'ok':disp.tem?'warn':''}" style="align-self:flex-start">${disp.pronta?'Pronta a cozinhar':disp.tem+'/'+disp.total+' na despensa'}</span>
    <div class="ingr-lista">${listaIngredientesComEstado(r,n)}</div>
    ${S.members.length? `<div class="row" style="margin-top:2px"><span class="sub">Compatível:</span>
      ${comp.length? comp.map(m=>avatar(m,22)).join('') : '<span class="sub">— só como refeição livre</span>'}</div>`:''}
    ${avisoAlergia(r,S.members)}
    ${vetados.length? `<div class="sub" style="color:var(--warn)">⚠ ${vetados.map(x=>nomeCurto(x.m)+' não come '+x.itens.map(esc).join(', ')).join(' · ')}</div>`:''}
    <div class="row" style="margin-top:2px">
      ${r.u? `<span class="tag" style="border-color:var(--accent);color:var(--accent)">da casa</span>
        <button class="chip" onclick="abrirEditor('${r.id}')">✏️ Editar</button>
        <button class="chip" onclick="apagarReceita('${r.id}')">Apagar</button>`
      : `<button class="chip" onclick="abrirEditor('${r.id}')">✏️ Copiar para editar</button>`}
    </div>
  </div>`;
}

function textoObjetivo(m){
  const p=objetivoPct(m), delta=Math.round(Math.abs(targetKcal(m)-tdee(m)));
  const sinal=(p>0?'+':p<0?'−':'')+Math.abs(p)+'%';   /* menos tipográfico, como no resto da app */
  return sinal+' · '+(p<0? 'défice de '+delta+' kcal/dia' : p>0? 'superavit de '+delta+' kcal/dia' : 'manutenção');
}
function sincronizaObjetivo(m){ const p=objetivoPct(m);
  m.objetivo = p<=-8? 'perder' : p>=5? 'ganhar' : 'manter'; }
function slideObjetivo(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.objetivoPct=clampNum(Math.round(parseFloat(el.value)||0),-25,20);
  pintaRange(el);
  aoVivo('nut', atualizarNutricao);
}
function commitObjetivo(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  sincronizaObjetivo(m); save();
  const p=objetivoPct(m);
  el.setAttribute('aria-valuetext',(p<0?'défice de ':p>0?'superavit de ':'')+Math.abs(p)
    +' por cento, alvo '+Math.round(targetKcal(m))+' quilocalorias por dia');
}
function presetObjetivo(mid,p){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.objetivoPct=p; sincronizaObjetivo(m); save(); render();
}
/* Sliders C/P/F interligados: floats durante o gesto, maior-resto na pintura e
   no commit — a soma é sempre 100 e os polegares irmãos não tremem ±1. */
let macroLive=null;
function slideMacro(mid,k,el){
  const m=S.members.find(x=>x.id===mid); if(!m||m.dieta!=='personalizada') return;
  /* O estado do gesto é carimbado com o membro: um arrasto que acaba no mesmo
     valor não dispara change, e sem isto os macros desse membro contaminavam
     o gesto seguinte noutro perfil. */
  if(!macroLive || macroLive.mid!==mid){ const d=dietaDe(m); macroLive={mid,c:d.c,p:d.p,f:d.f}; }
  const v=clampNum(parseFloat(el.value)||0,0,100);
  const outros=['c','p','f'].filter(x=>x!==k);
  const resto=100-v, a=macroLive[outros[0]], b=macroLive[outros[1]];
  if(a+b<0.5){ macroLive[outros[0]]=resto/2; macroLive[outros[1]]=resto/2; }
  else { macroLive[outros[0]]=resto*a/(a+b); macroLive[outros[1]]=resto-macroLive[outros[0]]; }
  macroLive[k]=v;
  m.macros=normaliza100(macroLive);
  pintaRange(el);
  outros.forEach(x=>{ const s=document.getElementById('nu-sl-'+x);
    if(s){ s.value=m.macros[x]; pintaRange(s); } });   /* atribuir .value não dispara eventos — sem cascata */
  aoVivo('nut', atualizarNutricao);
}
function commitMacro(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  macroLive=null; save();
  if(el&&m.macros) el.setAttribute('aria-valuetext',
    m.macros.c+' por cento de hidratos, '+m.macros.p+' de proteína, '+m.macros.f+' de gordura');
}
function presetMacro(mid,c,p,f){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.macros={c,p,f}; macroLive=null; save();
  ['c','p','f'].forEach(k=>{ const s=document.getElementById('nu-sl-'+k);
    if(s){ s.value=m.macros[k]; pintaRange(s); } });
  atualizarNutricao();
}
const ABREV_REF={p:'PA',a:'Almoço',l:'Lanche',j:'Jantar'};
function barraRefeicoes(k){
  let x=4;
  const segs=MEALS.map(([kk,rot,fr],idx)=>{
    const w=fr*332;
    const s=`<rect x="${x.toFixed(1)}" y="4" width="${(w-2).toFixed(1)}" height="14" rx="2" class="f-acc" fill-opacity="${[.85,.6,.4,.72][idx]}"/>
      <text id="nu-meal-${kk}" x="${(x+w/2).toFixed(1)}" y="35" font-size="10" text-anchor="middle" class="f-mut" style="font-variant-numeric:tabular-nums">${ABREV_REF[kk]} ${Math.round(k*fr)}</text>`;
    x+=w; return s;
  }).join('');
  return `<svg class="svgfx" viewBox="0 0 340 44" aria-hidden="true" style="margin-top:10px">${segs}</svg>`;
}
/* Projeção iterativa a 12 semanas. O domínio Y é fixo por render e dimensionado
   para o pior caso do slider (−25%) — o eixo nunca reescala durante o arrasto. */
function geomProjecao(m){
  const meia=Math.max(2.5, Math.ceil(tdee(m)*0.25*7*12/7700));
  const yMin=m.peso-meia, yMax=m.peso+meia;
  return {yMin,yMax, X:i=>sx(i,0,12,40,330), Y:v=>sx(v,yMin,yMax,130,12)};
}
function cartaoProjecao(m){
  const g=geomProjecao(m), proj=projecaoPeso(m,12), fim=proj[proj.length-1];
  const h2=(m.altura/100)*(m.altura/100);
  const zTop=clampNum(g.Y(25*h2),12,130), zBot=clampNum(g.Y(18.5*h2),12,130);
  const pts=proj.map((v,i)=>g.X(i).toFixed(1)+','+clampNum(g.Y(v),12,130).toFixed(1)).join(' ');
  const dentro=fim>=18.5*h2*1&&fim<=25*h2;
  const sobe=fim>m.peso;
  const yFim=clampNum(clampNum(g.Y(fim),12,130)+(sobe?16:-8),12,126);
  const delta=Math.round((fim-m.peso)*10)/10;
  /* O rótulo da zona saudável e a linha do peso de hoje partilham a margem
     esquerda, e quando o peso atual calha no topo da zona os dois textos
     escreviam-se um por cima do outro. O rótulo escolhe o lado onde há
     espaço; se a faixa for estreita de mais para qualquer um dos lados,
     desaparece — a faixa verde já se percebe sozinha. */
  const yHoje=g.Y(m.peso)-5, faixa=zBot-zTop;
  const cabeTopo=Math.abs((zTop+11)-yHoje)>=13, cabeBase=Math.abs((zBot-4)-yHoje)>=13;
  const yZona=faixa>=26 && (cabeTopo||cabeBase) ? (cabeTopo? zTop+11 : zBot-4) : null;
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 160" preserveAspectRatio="none" role="img" style="margin-top:8px">
    <title>Projeção de peso a doze semanas</title>
    ${zBot>zTop+1? `<rect x="40" y="${zTop.toFixed(1)}" width="290" height="${(zBot-zTop).toFixed(1)}" class="f-ok" fill-opacity=".08"/>
    ${yZona!==null? `<text x="44" y="${yZona.toFixed(1)}" font-size="9.5" class="f-mut">zona de IMC saudável</text>`:''}`:''}
    <line x1="40" y1="${g.Y(m.peso).toFixed(1)}" x2="330" y2="${g.Y(m.peso).toFixed(1)}" class="s-mut" stroke-dasharray="2 3"/>
    <text x="40" y="${(g.Y(m.peso)-5).toFixed(1)}" font-size="10" class="f-mut" style="font-variant-numeric:tabular-nums">hoje ${nPT(m.peso,1)}</text>
    ${[0,4,8].map(i=>`<text x="${g.X(i).toFixed(1)}" y="146" font-size="10" text-anchor="middle" class="f-mut">${i}</text>`).join('')}
    <text x="330" y="146" font-size="10" text-anchor="end" class="f-mut">12 semanas</text>
    <polyline id="nu-plinha" points="${pts}" class="s-acc" stroke-width="2.5" fill="none" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle id="nu-pdot" cx="330" cy="${clampNum(g.Y(fim),12,130).toFixed(1)}" r="4.5" class="${dentro?'f-ok':'f-acc'}"/>
    <text id="nu-pfim" x="326" y="${yFim.toFixed(1)}" font-size="13" font-weight="700" text-anchor="end" class="f-ink" style="font-variant-numeric:tabular-nums">${nPT(fim,1)} kg</text>
  </svg>
  <div class="row" style="justify-content:space-between;margin-top:6px">
    <b id="nu-pdelta" style="font-variant-numeric:tabular-nums">${delta===0?'peso estável':(delta>0?'+':'−')+nPT(Math.abs(delta),1)+' kg em 12 semanas'}</b>
  </div>
  <p class="sub" style="margin-top:6px">Estimativa: 7 700 kcal ≈ 1 kg, com o gasto recalculado semana a semana — não substitui aconselhamento médico ou nutricional.</p>`;
}
function atualizarProjecao(m){
  const pl=document.getElementById('nu-plinha'); if(!pl) return;
  const g=geomProjecao(m), proj=projecaoPeso(m,12), fim=proj[proj.length-1];
  pl.setAttribute('points', proj.map((v,i)=>g.X(i).toFixed(1)+','+clampNum(g.Y(v),12,130).toFixed(1)).join(' '));
  const h2=(m.altura/100)*(m.altura/100);
  const dentro=fim>=18.5*h2&&fim<=25*h2, sobe=fim>m.peso;
  const dot=document.getElementById('nu-pdot');
  if(dot){ dot.setAttribute('cy',clampNum(g.Y(fim),12,130).toFixed(1));
    dot.setAttribute('class',dentro?'f-ok':'f-acc'); }
  const lbl=document.getElementById('nu-pfim');
  if(lbl){ lbl.textContent=nPT(fim,1)+' kg';
    lbl.setAttribute('y',clampNum(clampNum(g.Y(fim),12,130)+(sobe?16:-8),12,126).toFixed(1)); }
  const delta=Math.round((fim-m.peso)*10)/10;
  põe('nu-pdelta', delta===0?'peso estável':(delta>0?'+':'−')+nPT(Math.abs(delta),1)+' kg em 12 semanas');
}
function atualizarNutricao(){
  const m=curM(); if(!m) return;
  const alvo=targetKcal(m), gasto=tdee(m), p=objetivoPct(m), mk=macros(m);
  põe('nu-obj', textoObjetivo(m));
  põe('nu-alvo', Math.round(alvo)); põe('nu-gasto', Math.round(gasto));
  const rp=document.getElementById('nu-ritmo');
  if(rp){
    if(alvo<bmr(m)){ rp.textContent='abaixo do basal — não recomendado'; rp.setAttribute('class','pill bad'); }
    else { const kg=ritmoSemanal(m), a=Math.abs(kg);
      rp.textContent=(a<0.005?'peso estável':(kg>0?'−':'+')+nPT(a,2)+' kg/semana');
      rp.setAttribute('class','pill '+(a<=0.75?'ok':a<=1?'warn':'bad')); }
  }
  const av=document.getElementById('nu-aviso'); if(av) av.style.visibility=p<=-20?'visible':'hidden';
  const d=mk.pct;
  const bc=document.getElementById('nu-bar-c');
  if(bc){ bc.style.width=d.c+'%';
    document.getElementById('nu-bar-p').style.width=d.p+'%';
    document.getElementById('nu-bar-f').style.width=d.f+'%';
    põe('nu-leg-c','Hidratos '+d.c+'%'); põe('nu-leg-p','Proteína '+d.p+'%'); põe('nu-leg-f','Gordura '+d.f+'%'); }
  põe('nu-g-c',mk.c+' g'); põe('nu-g-p',mk.p+' g'); põe('nu-g-f',mk.f+' g');
  ['c','p','f'].forEach(kk=>{ const o=document.getElementById('nu-out-'+kk);
    if(o) o.textContent=d[kk]+'% · '+mk[kk]+' g'; });
  const gk=document.getElementById('nu-gkg');
  if(gk){ const gkg=m.peso>0? mk.p/m.peso:0;
    gk.textContent=nPT(gkg,1)+' g de proteína por kg de peso';
    gk.setAttribute('class','pill '+(gkg>=1.2&&gkg<=2.2?'ok':'warn')); }
  const da=document.getElementById('nu-diet-aviso');
  if(da) da.style.visibility=(d.p<10||d.f<15)?'visible':'hidden';
  MEALS.forEach(mm=>põe('nu-meal-'+mm[0], ABREV_REF[mm[0]]+' '+Math.round(alvo*mm[2])));
  atualizarProjecao(m);
}
/* O cartão que explica de onde vêm os números desta fase e o que a faixa
   AMDR permite — é aqui que a criança e a grávida deixam de ser um adulto
   pequeno nas contas. */
/* ---- suplementos: interface ---- */
function dosesDe(m,id){ const s=(m.suplementos||[]).find(x=>x.s===id); return s? (parseFloat(s.doses)||0) : 0; }
function setDoses(mid,id,valor){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!Array.isArray(m.suplementos)) m.suplementos=[];
  const v=clampNum(Math.round((parseFloat(valor)||0)*2)/2,0,20);
  const i=m.suplementos.findIndex(x=>x.s===id);
  if(v<=0){ if(i>=0) m.suplementos.splice(i,1); }
  else if(i>=0) m.suplementos[i].doses=v;
  else m.suplementos.push({s:id,doses:v});
  /* tomar um suplemento implica tê-lo em casa — a despensa acompanha */
  if(v>0 && SUPL[id]) S.despensa[SUPL[id].nome]=true;
  save('suplementos de '+m.nome); render();
}
function slideDoses(mid,id,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!Array.isArray(m.suplementos)) m.suplementos=[];
  const v=clampNum(parseFloat(el.value)||0,0,20);
  const i=m.suplementos.findIndex(x=>x.s===id);
  if(v<=0){ if(i>=0) m.suplementos.splice(i,1); }
  else if(i>=0) m.suplementos[i].doses=v; else m.suplementos.push({s:id,doses:v});
  pintaRange(el);
  aoVivo('supl', ()=>{
    põe('sup-o-'+id, v>0? nPT(v,1).replace(',0','')+(v===1?' dose/dia':' doses/dia') : 'não toma');
    const bloco=document.getElementById('nu-supl-macros'); if(bloco) bloco.innerHTML=blocoSuplNosMacros(m);
    const mic=document.getElementById('sup-micros'); if(mic) mic.innerHTML=tabelaMicros(m);
    const res=document.getElementById('sup-resumo'); if(res) res.innerHTML=resumoSupl(m);
  });
}
function blocoSuplNosMacros(m){
  const sup=totalSuplementos(m);
  if(!suplementosDe(m).length) return '';
  const rest=macrosRestantes(m), alvo=macros(m);
  return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
    <div class="splabel"><span>Dos suplementos ${dica('suplMacros')}</span>
      <output style="min-width:10ch;text-align:right">${Math.round(sup.kcal)} kcal</output></div>
    <div class="kv"><span>Hidratos</span><b>${Math.round(sup.c)} g de ${alvo.c} g → faltam ${rest.c} g na comida</b></div>
    <div class="kv"><span>Proteína</span><b>${Math.round(sup.p)} g de ${alvo.p} g → faltam ${rest.p} g na comida</b></div>
    <div class="kv"><span>Gordura</span><b>${Math.round(sup.f)} g de ${alvo.f} g → faltam ${rest.f} g na comida</b></div>
    ${(sup.c>alvo.c||sup.p>alvo.p||sup.f>alvo.f)? '<p class="sub" style="color:var(--warn);margin-top:6px">Os suplementos já ultrapassam o alvo de pelo menos um macronutriente — vale a pena rever as doses.</p>':''}
  </div>`;
}
function tabelaMicros(m){
  const t=totalSuplementos(m).micros, ddr=ddrMicro(m), ul=ulMicro(m);
  const linhas=MICROS.filter(([k])=>t[k]>0).map(([k,nome,un])=>{
    const v=t[k], alvo=ddr[k], lim=ul[k];
    const pct= alvo? Math.round(v/alvo*100) : null;
    const excede = lim!=null && v>lim;
    const tone = excede? 'bad' : (pct!=null&&pct>=100? 'ok':'');
    return `<div class="kv"><span>${nome}</span><b>${nPT(v,v<10?1:0)} ${un}
      ${pct!=null? `<span class="pill ${tone}" style="margin-left:6px">${pct}% da referência</span>`:''}
      ${excede? `<span class="pill bad" style="margin-left:4px">acima do limite (${lim} ${un})</span>`:''}</b></div>`;
  }).join('');
  return linhas || '<p class="sub">Os suplementos escolhidos não declaram micronutrientes — só macros.</p>';
}
function resumoSupl(m){
  const lista=suplementosDe(m);
  if(!lista.length) return '<p class="sub">Sem suplementos registados.</p>';
  const sup=totalSuplementos(m);
  return `<div class="row" style="margin-bottom:8px">
    <div class="stat"><b>${lista.length}</b><span>Suplementos</span></div>
    <div class="stat"><b>${Math.round(sup.kcal)}</b><span>kcal/dia</span></div>
    <div class="stat"><b>${Math.round(sup.p)} g</b><span>Proteína/dia</span></div>
    <div class="stat"><b>${lista.reduce((t,s)=>t+s.doses*7,0)}</b><span>Doses/semana</span></div>
  </div>`;
}
function avisosSupl(m){
  const av=[], excessos=excessosMicro(m), fase=faseDe(m);
  excessos.forEach(e=>av.push(`<b>${e.nome}:</b> ${nPT(e.valor,e.valor<10?1:0)} ${e.un} por dia está acima do limite superior tolerável para esta fase (${e.ul} ${e.un}). Acima deste valor a suplementação deixa de ser inócua — confirma as doses com quem te segue.`));
  if(gravida(m)){
    if(!dosesDe(m,'folico') && !dosesDe(m,'multivit'))
      av.push('Na gravidez recomenda-se <b>ácido fólico</b> desde antes da conceção e durante o 1.º trimestre, para reduzir o risco de defeitos do tubo neural. Fala com quem te segue.');
    av.push('Evita suplementos com <b>vitamina A na forma de retinol</b> em doses altas durante a gravidez, e confirma sempre o rótulo — o excesso é teratogénico.');
  }
  if(fase!=='adulto')

/* ===== MÓDULO DO BEBÉ ===== */
function updBebe(mid,campo,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!m.bebe) m.bebe=bebeCfg(m);
  m.bebe[campo] = campo==='modo'? val : parseFloat(val)||0;
  if(campo==='tomadas'||campo==='pctLeite') m.bebe.ml=null;   /* volume volta a ser calculado */
  save('alimentação de '+m.nome); render();
}
function slideBebe(mid,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!m.bebe) m.bebe=bebeCfg(m);
  m.bebe[campo]=parseFloat(el.value)||0;
  if(campo==='tomadas'||campo==='pctLeite') m.bebe.ml=null;
  pintaRange(el);
  aoVivo('bebe', ()=>atualizarBebe(mid));
}
function slidePeso(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.peso=parseFloat(el.value)||0; pintaRange(el);
  aoVivo('bebe', ()=>atualizarBebe(mid));
}

  const curvas=PERCENTIS.map((p,k)=>{

    return `<polyline points="${pts}" fill="none" stroke-width="${k===2?2:1}" class="${k===2?'s-acc':'s-line'}"

      <text x="332" y="${(Y(WHO_PESO[sexo][8][k])+3).toFixed(1)}" font-size="9" class="${cores[k]}">P${p}</text>`;

/* ================= OBJETIVOS =================
   Estratégias de peso: um alvo concreto (quilos e prazo) repartido entre
   dieta e exercício, aplicado diretamente ao objetivoPct e aos desportos do
   membro — o objetivo não é um número isolado, é o mesmo motor da Nutrição
   e da Atividade a apontar para uma meta. Progresso lido do peso atual do
   membro desde a criação, sem precisar de um histórico à parte. */
function membrosElegiveisObjetivo(){
  return S.members.filter(m=>faseDe(m)!=='bebe' && !semEstimativa(m));
}
/* Quantas semanas faltam a partir de AGORA — não das semanas totais da
   criação — para a estratégia se adaptar ao que já foi feito (ou não). */
function semanasRestantesDe(o){
  const decorridas=Math.max(0,(Date.now()-new Date(o.dataInicio).getTime())/(7*24*3600*1000));
  return Math.max(0.5, o.semanas-decorridas);
}
function progressoObjetivo(o){
  const m=S.members.find(x=>x.id===o.membroId);
  if(!m) return {pct:0, atingido:false, semMembro:true, tone:'warn'};
  const semanasDecorridas=Math.max(0,(Date.now()-new Date(o.dataInicio).getTime())/(7*24*3600*1000));
  const pctTempo=clampNum(semanasDecorridas/Math.max(o.semanas,0.001)*100,0,100);
  if(o.tipo==='manter'){
    const bandaKg=o.pesoInicial*o.bandaManter/100;
    const dentro=Math.abs(m.peso-o.pesoInicial)<=bandaKg;
    const terminou=semanasDecorridas>=o.semanas;
    return {pct:pctTempo, dentroBanda:dentro, atingido:terminou&&dentro, terminouFora:terminou&&!dentro,
      semanasDecorridas, bandaKg, tone:dentro?'ok':'warn', pctTempo};
  }
  const total=Math.abs(o.pesoInicial-o.pesoAlvo);
  const atingido = o.tipo==='perder'? m.peso<=o.pesoAlvo+0.05 : m.peso>=o.pesoAlvo-0.05;
  if(total<0.05) return {pct:100, atingido:true, tone:'ok', pctTempo, semanasDecorridas};
  const feito = o.tipo==='ganhar'? (m.peso-o.pesoInicial) : (o.pesoInicial-m.peso);
  const pct=clampNum(feito/total*100,0,100);
  /* pctTempo<1: objetivo acabado de criar, sem tempo real decorrido — mostra-se
     "no bom caminho" em vez de julgar um ritmo que ainda não existe. */
  const tone = atingido||pctTempo<1? 'ok' : pct>=pctTempo*0.85? 'ok' : pct>=pctTempo*0.5? 'warn' : 'bad';
  return {pct, atingido, feito, total, kgRestante:o.pesoAlvo-m.peso, tone, pctTempo, semanasDecorridas};
}
/* MET de referência para um desporto ainda não registado: a velocidade por
   omissão do catálogo, ou intensidade moderada. Se o membro já o pratica,
   usa-se o MET real dele em vez de um valor genérico. */
function metParaSugestao(m,sportId){
  const sp=SPORT[sportId]; if(!sp) return 0;
  const existente=(m.desportos||[]).find(s=>s.s===sportId);
  if(existente) return metDe(existente);
  return sp.dist? metPorVelocidade(sp.dist.curva,sp.dist.vdef) : sp.mets[1];
}
/* O cálculo puro da estratégia: quanto do ajuste diário vem da dieta e
   quanto do exercício, e o que isso implica em objetivoPct e em minutos de
   desporto extra. Usado tanto na criação como no reajuste de um objetivo
   já existente — nunca diverge entre os dois. */
function calcEstrategia(m,pesoAlvo,semanasRestantes,tipo,splitDieta,desportoId){
  const kgRestante=pesoAlvo-m.peso;
  const kcalTotal=Math.abs(kgRestante)*7700;
  const dias=Math.max(1,semanasRestantes*7);
  const deficitDiario=kcalTotal/dias;
  const sinal=tipo==='ganhar'?1:-1;
  const tdeeAtual=tdee(m);
  let viaDieta=deficitDiario, viaExercicio=0, horasExtraSemana=0;
  if(tipo==='perder'){
    viaDieta=deficitDiario*splitDieta/100;
    viaExercicio=deficitDiario*(100-splitDieta)/100;
    const met=desportoId? metParaSugestao(m,desportoId) : 0;
    horasExtraSemana = met>0? (viaExercicio*7)/(met*m.peso) : 0;
  }
  let objetivoPctSugerido = tipo==='manter'? 0 : Math.round(sinal*viaDieta/tdeeAtual*100);
  objetivoPctSugerido = tipo==='manter'?0 : clampNum(objetivoPctSugerido, tipo==='perder'?-25:0, tipo==='ganhar'?20:0);
  const targetKcalNovo=tdeeAtual*(1+objetivoPctSugerido/100);
  const ritmoKgSemana=Math.abs(kgRestante)/Math.max(semanasRestantes,0.001);
  return {kgRestante, deficitDiario, viaDieta, viaExercicio, horasExtraSemana, minutosExtraSemana:horasExtraSemana*60,
    objetivoPctSugerido, abaixoBasal: targetKcalNovo<bmr(m), ritmoKgSemana,
    toneRitmo: ritmoKgSemana<=0.75?'ok':ritmoKgSemana<=1?'warn':'bad', tdeeAtual, targetKcalNovo};
}
/* Acrescenta o exercício extra ao desporto escolhido — a um que já pratica
   (soma às horas semanais existentes) ou, se não tiver nenhum, cria um
   registo novo. Sempre em base semanal, para o cálculo não se perder entre
   unidades diferentes. */
function aplicarExercicio(m,sportId,horasExtraSemana){
  if(!sportId || horasExtraSemana<=0.01) return;
  const sp=SPORT[sportId]; if(!sp) return;
  if(!Array.isArray(m.desportos)) m.desportos=[];
  const entrada=m.desportos.find(s=>s.s===sportId);
  if(entrada){
    const semanaNova=sportWeeklyH(entrada)+horasExtraSemana;
    entrada.per='semana';
    if(sp.dist){ entrada.v=velocidade(entrada); entrada.km=Math.round(semanaNova*entrada.v*10)/10; }
    else entrada.h=Math.round(semanaNova*10)/10;
  } else if(sp.dist){
    m.desportos.push(normalizaDesporto({s:sportId, km:Math.round(horasExtraSemana*sp.dist.vdef*10)/10, v:sp.dist.vdef, per:'semana'}));
  } else {
    m.desportos.push(normalizaDesporto({s:sportId, h:Math.round(horasExtraSemana*10)/10, i:'moderado', per:'semana'}));
  }
}
function aplicarEstrategia(mid,calc,o){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(o.tipo==='manter'){ m.objetivoPct=0; sincronizaObjetivo(m); return; }
  m.objetivoPct=calc.objetivoPctSugerido; sincronizaObjetivo(m);
  if(o.tipo==='perder') aplicarExercicio(m,o.desportoEscolhido,calc.horasExtraSemana);
}

function opcoesDesportoForm(){

  ['caminhada','corrida','ciclismo','natacao'].forEach(id=>uniao.add(id));
  return [...uniao].filter(id=>SPORT[id]);
}

  aoVivo('objform', ()=>{
    const f=S.ui.objForm;

    põe('obj-o-semanas', f.semanas+(f.semanas===1?' semana':' semanas'));
    põe('obj-o-banda', '±'+nPT(f.banda,1)+'%');
    põe('obj-o-split', f.split+'% dieta · '+(100-f.split)+'% exercício');
    const pv=document.getElementById('obj-preview'); if(pv) pv.innerHTML=gerarPreviewHtml();
  });
}
function gerarPreviewHtml(){
  const f=S.ui.objForm;
  if(!f.membros.length) return '<p class="sub">Escolhe pelo menos um membro da família para veres a estratégia.</p>';
  return f.membros.map(mid=>{
    const m=S.members.find(x=>x.id===mid); if(!m) return '';
    if(f.tipo==='perder' && !permiteDefice(m))
      return `<div class="kv"><span>${esc(m.nome)}</span><b style="color:var(--warn)">sem défice nesta fase</b></div>`;
    if(f.tipo==='manter')
      return `<div class="kv"><span>${esc(m.nome)}</span><b>manter ${nPT(m.peso,1)} kg ± ${nPT(m.peso*f.banda/100,1)} kg</b></div>`;
    const pesoAlvo = f.tipo==='ganhar'? Math.round((m.peso+f.delta)*10)/10 : Math.max(1,Math.round((m.peso-f.delta)*10)/10);
    const calc=calcEstrategia(m,pesoAlvo,f.semanas,f.tipo,f.split,f.desporto);
    return `<div class="kv"><span>${esc(m.nome)} · alvo ${nPT(pesoAlvo,1)} kg</span>
      <b><span class="pill ${calc.toneRitmo}" style="margin-right:6px">${nPT(calc.ritmoKgSemana,2)} kg/sem</span>
      ${calc.objetivoPctSugerido>0?'+':''}${calc.objetivoPctSugerido}%${f.tipo==='perder'&&calc.minutosExtraSemana>1?' · +'+Math.round(calc.minutosExtraSemana)+' min/sem':''}</b></div>
      ${calc.abaixoBasal?'<div class="sub" style="color:var(--bad)">o alvo diário ficaria abaixo do metabolismo basal — reduz os quilos ou alarga o prazo</div>':''}`;
  }).join('');
}
function criarObjetivo(){
  const f=S.ui.objForm;
  if(!f.membros.length) return flash('bad','Escolhe pelo menos um membro da família.');
  let criados=0; const ignorados=[];
  f.membros.forEach(mid=>{
    const m=S.members.find(x=>x.id===mid); if(!m) return;
    if(f.tipo==='perder' && !permiteDefice(m)){ ignorados.push(m.nome); return; }
    const pesoAlvo = f.tipo==='ganhar'? Math.round((m.peso+f.delta)*10)/10
      : f.tipo==='perder'? Math.max(1,Math.round((m.peso-f.delta)*10)/10) : m.peso;
    const o={id:uid(), membroId:mid, tipo:f.tipo, pesoInicial:m.peso, pesoAlvo,
      semanas:f.semanas, dataInicio:new Date().toISOString(),
      splitDieta:f.split, desportoEscolhido:f.tipo==='perder'?f.desporto:null,
      bandaManter:f.banda||2, concluido:false, celebrado:false, dataConclusao:null};
    const calc=calcEstrategia(m,pesoAlvo,f.semanas,f.tipo,f.split,o.desportoEscolhido);
    aplicarEstrategia(mid,calc,o);
    S.objetivos.push(o); criados++;
  });
  if(!criados) return flash('bad','Não foi possível criar objetivo'+(ignorados.length>1?'s':'')+' para '
    +ignorados.join(', ')+': em crescimento ou gravidez não se recomenda défice calórico.');
  S.ui.objForm={membros:[],tipo:'perder',delta:5,semanas:12,split:50,desporto:f.desporto,banda:2};
  save(plural(criados,'novo objetivo','novos objetivos'));
  flash('ok', plural(criados,'Objetivo criado','Objetivos criados')
    +(ignorados.length? '. Sem défice para '+ignorados.join(', ')+', por estarem em crescimento ou gravidez.':'.'));
}
function removerObjetivo(oid){
  const o=S.objetivos.find(x=>x.id===oid); if(!o) return;
  const m=S.members.find(x=>x.id===o.membroId);
  if(!confirm('Remover este objetivo'+(m?' de '+m.nome:'')+'? A dieta e o desporto já aplicados mantêm-se como estão.')) return;
  S.objetivos=S.objetivos.filter(x=>x.id!==oid);
  if(S.ui.objExpandido===oid) S.ui.objExpandido=null;
  save('remoção de objetivo'); render();
}
/* ---- reajuste de um objetivo já ativo (estado transitório em S.ui.objAdj) ---- */
function toggleObjExpandido(oid){
  if(S.ui.objExpandido===oid) S.ui.objExpandido=null;
  else { const o=S.objetivos.find(x=>x.id===oid); S.ui.objExpandido=oid;
    S.ui.objAdj = o? {split:o.splitDieta, desporto:o.desportoEscolhido} : {split:50,desporto:null}; }
  saveMeta(); render();
}
function previewAjusteHtml(calc){
  return `<div class="row" style="margin-top:6px">
    <div class="stat"><b>${Math.round(calc.viaDieta)} kcal/dia</b><span>Via dieta</span></div>
    <div class="stat"><b>${Math.round(calc.viaExercicio)} kcal/dia</b><span>Via exercício</span></div>
    <div class="stat"><b>${Math.round(calc.minutosExtraSemana)} min/sem</b><span>Exercício extra</span></div>
    <div class="stat" style="background:var(--accent-soft)"><b style="color:var(--accent)">${calc.objetivoPctSugerido>0?'+':''}${calc.objetivoPctSugerido}%</b><span>Novo objetivo</span></div>
  </div>
  <div class="row" style="margin-top:8px"><span class="pill ${calc.toneRitmo}">${nPT(calc.ritmoKgSemana,2)} kg/semana</span>

function slideObjAdj(oid,campo,el){
  if(!S.ui.objAdj) S.ui.objAdj={split:50,desporto:null};
  S.ui.objAdj[campo]=parseFloat(el.value)||0; pintaRange(el);
  aoVivo('objadj', ()=>{
    const o=S.objetivos.find(x=>x.id===oid), m=o&&S.members.find(x=>x.id===o.membroId);
    if(!o||!m) return;
    const calc=calcEstrategia(m,o.pesoAlvo,semanasRestantesDe(o),o.tipo,S.ui.objAdj.split,S.ui.objAdj.desporto);
    const el2=document.getElementById('obj-adj-preview-'+oid); if(el2) el2.innerHTML=previewAjusteHtml(calc);
    põe('obj-adj-split-o-'+oid, S.ui.objAdj.split+'% dieta · '+(100-S.ui.objAdj.split)+'% exercício');
  });
}
function setObjAdj(oid,campo,val){
  if(!S.ui.objAdj) S.ui.objAdj={split:50,desporto:null};
  S.ui.objAdj[campo]=campo==='split'? parseFloat(val)||0 : val;
  saveMeta(); render();
}
function reajustarObjetivo(oid){
  const o=S.objetivos.find(x=>x.id===oid); if(!o) return;
  const m=S.members.find(x=>x.id===o.membroId); if(!m) return;
  const adj=S.ui.objAdj||{split:o.splitDieta,desporto:o.desportoEscolhido};
  o.splitDieta=clampNum(Math.round(adj.split),0,100); o.desportoEscolhido=adj.desporto;
  const calc=calcEstrategia(m,o.pesoAlvo,semanasRestantesDe(o),o.tipo,o.splitDieta,o.desportoEscolhido);
  aplicarEstrategia(o.membroId,calc,o);
  S.ui.objExpandido=null;
  save('ajuste de estratégia de '+m.nome);
  flash('ok','Estratégia atualizada — a dieta e o exercício de '+m.nome+' foram ajustados.');
}
function painelAjuste(o,m){
  if(o.tipo!=='perder') return `<div class="msg" style="margin-top:10px;background:var(--bg);color:var(--mut)">

  const calc=calcEstrategia(m,o.pesoAlvo,semanasRestantesDe(o),o.tipo,adj.split,adj.desporto);

    <div class="row" style="margin:10px 0">

    </div>

    <div class="row" style="margin:6px 0 10px">${opcoes.map(id=>
      `<button class="chip ${adj.desporto===id?'on':''}" onclick="setObjAdj('${o.id}','desporto','${id}')">${SPORT[id].nome}</button>`).join('')}</div>
    <div id="obj-adj-preview-${o.id}">${previewAjusteHtml(calc)}</div>
    <button class="btn small" style="margin-top:10px" onclick="reajustarObjetivo('${o.id}')">Guardar novo equilíbrio</button>
  </div>`;

/* ---- anel de progresso e cartões ---- */
function anelSvg(pct,tone,tamanho,espessura){
  tamanho=tamanho||84; espessura=espessura||9;
  const r=(tamanho-espessura)/2, c=tamanho/2, circ=2*Math.PI*r;
  const p=clampNum(pct,0,100), off=circ*(1-p/100);
  const cls= tone==='ok'?'s-ok': tone==='warn'?'s-warn': tone==='bad'?'s-bad':'s-acc';
  return `<svg class="svgfx anel" viewBox="0 0 ${tamanho} ${tamanho}" width="${tamanho}" height="${tamanho}"
      role="img" aria-label="${Math.round(p)} por cento concluído" style="width:${tamanho}px;height:${tamanho}px;flex:none">
    <circle cx="${c}" cy="${c}" r="${r}" class="s-line" stroke-width="${espessura}" fill="none"/>
    <circle cx="${c}" cy="${c}" r="${r}" class="anel-arco ${cls}" stroke-width="${espessura}" fill="none"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c+5}" text-anchor="middle" font-size="${Math.round(tamanho*0.22)}" font-weight="700"
      class="f-ink" style="font-variant-numeric:tabular-nums">${Math.round(p)}%</text>
  </svg>`;
}
function cartaoConquista(o){
  const m=S.members.find(x=>x.id===o.membroId);
  const texto = o.tipo==='perder'? '−'+nPT(Math.abs(o.pesoInicial-o.pesoAlvo),1)+' kg'
    : o.tipo==='ganhar'? '+'+nPT(Math.abs(o.pesoAlvo-o.pesoInicial),1)+' kg' : 'manteve o peso';
  return `<div class="card" style="display:flex;align-items:center;gap:14px">
    <span style="font-size:28px" aria-hidden="true">🏆</span>
    <div style="flex:1"><b>${m?esc(m.nome):'Membro removido'}</b> — ${texto}
      <div class="sub">Concluído ${o.dataConclusao? fmtShort(iso(new Date(o.dataConclusao))) : ''}</div></div>
    <button class="btn danger small" onclick="removerObjetivo('${o.id}')">Remover</button>
  </div>`;
}
function cartaoObjetivo(o){
  const m=S.members.find(x=>x.id===o.membroId); if(!m) return '';
  const p=progressoObjetivo(o);

  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div class="row" style="gap:12px;align-items:center">
        ${anelSvg(p.pct,p.tone)}
        <div>
          <div class="row" style="gap:8px">${avatar(m,26)}<b>${esc(m.nome)}</b></div>
          <div class="sub">${rotuloTipo}${o.tipo==='manter'?'':' · '+nPT(o.pesoInicial,1)+' → '+nPT(o.pesoAlvo,1)+' kg'}</div>
          ${o.tipo!=='manter'
            ? `<div class="sub" style="font-variant-numeric:tabular-nums">peso atual ${nPT(m.peso,1)} kg${p.atingido?'':' · faltam '+nPT(Math.abs(p.kgRestante),1)+' kg'}</div>`
            : `<div class="sub">dentro da banda: ${p.dentroBanda?'sim':'não, atenção'}</div>`}
          <div class="sub">${restantes<=0.05?'prazo terminado':Math.ceil(restantes)+(Math.ceil(restantes)===1?' semana restante':' semanas restantes')}</div>
        </div>
      </div>
      <button class="chip" onclick="toggleObjExpandido('${o.id}')" aria-expanded="${expandido}">${expandido?'Fechar':'Ajustar'}</button>
    </div>
    ${expandido? painelAjuste(o,m) : ''}
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn danger small" onclick="removerObjetivo('${o.id}')">Remover objetivo</button>
    </div>
  </div>`;
}
function celebracaoHtml(o){
