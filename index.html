function addMember(){
  const m={id:uid(),nome:'Novo membro',sexo:'m',idade:35,altura:172,peso:75,atividade:'sedentario',desloc:'nenhum',desportos:[],dieta:'equilibrada',objetivo:'manter',objetivoPct:0};
  S.members.push(m); S.ui.mid=m.id; save('novo perfil'); render();
}
function delMember(id){
  const m=S.members.find(x=>x.id===id);
  if(!confirm(`Remover o perfil de ${m.nome}?`)) return;
  S.members=S.members.filter(x=>x.id!==id); delete S.cheats[id];
  Object.values(S.plans).forEach(w=>Object.values(w).forEach(d=>MEALK.forEach(k=>{ if(d[k]) d[k].m=d[k].m.filter(x=>x!==id); })));
  /* o histórico da pessoa sai com ela: pesagens, treinos e refeições ficariam
     órfãos, a somar em gráficos de quem já cá não está */
  delete S.medicoes[id];
  S.regAtiv=(S.regAtiv||[]).filter(r=>r.mid!==id);
  S.regRef=(S.regRef||[]).filter(r=>r.mid!==id);
  if(S.ui.histAtiv===id) S.ui.histAtiv=null;
  if(S.ui.histRef===id) S.ui.histRef=null;
  save('remoção de '+m.nome); render();
}
function upd(id,field,val,num){ const m=S.members.find(x=>x.id===id); if(!m) return;
  /* ao entrar na dieta personalizada, semeiam-se os macros com os da dieta
     anterior — a barra de macros não salta */
  if(field==='dieta' && val==='personalizada' && m.dieta!=='personalizada' && !m.macros){
    const d=dietaDe(m); m.macros={c:d.c,p:d.p,f:d.f};
  }
  m[field]=num?parseFloat(val)||0:val;
  if(field==='idade'||field==='meses'){
    normalizaIdadeMeses(m);   /* decide meses vs anos e ajusta a fronteira dos 2 anos */
    /* mudar de idade repõe a fatia de leite e o volume nos padrões do escalão */
    if(m.bebe){ delete m.bebe.pctLeite; m.bebe.ml=null; }
  }
  const rot={peso:'peso',altura:'altura',idade:'idade',dieta:'dieta',sexo:'sexo',nome:'nome',
    atividade:'nível de atividade',desloc:'deslocação',gravida:'gravidez',meses:'idade'}[field];
  save(rot? rot+' de '+m.nome : null); render(); }

/* ===== RESUMO MENSAL NARRADO =====
   Um retrato dos últimos 30 dias escrito em prosa, a partir do que está
   registado. Só afirma o que os dados sustentam: a variação de peso, por
   exemplo, só existe para quem tem um objetivo a decorrer, porque é aí que
   há um peso inicial guardado — a app não tem histórico de pesagens. */
function dadosMes(){
  const hoje=new Date(), semanas=[];
  for(let i=0;i<5;i++){ const d=new Date(hoje); d.setDate(d.getDate()-7*i); semanas.push(mondayISO(d)); }
  let refs=0, diasCompletos=0, diasComAlgo=0, cheats=0;
  const porReceita={};
  semanas.forEach(wk=>{
    const sem=S.plans[wk]; if(!sem) return;
    for(let di=0;di<7;di++){
      const dia=sem[di]; if(!dia) continue;
      let n=0;
      MEALK.forEach(mk=>{ const r=dia[mk]; if(r&&r.r){ n++; refs++;
        porReceita[r.r]=(porReceita[r.r]||0)+1; } });
      if(n) diasComAlgo++;
      if(n===MEALK.length) diasCompletos++;
    }
  });
  const limite=new Date(hoje); limite.setDate(limite.getDate()-30);
  Object.values(S.cheats||{}).forEach(arr=>(arr||[]).forEach(d=>{
    const dt=new Date(d+'T12:00:00'); if(dt>=limite&&dt<=hoje) cheats++; }));
  const topo=Object.entries(porReceita).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([id,n])=>{ const r=RECIPES.find(x=>x.id===id); return r? {nome:r.n,n}:null; }).filter(Boolean);
  const concluidos=(S.objetivos||[]).filter(o=>o.concluido&&o.dataConclusao
    && new Date(o.dataConclusao)>=limite);
  const ativos=(S.objetivos||[]).filter(o=>!o.concluido);
  return {refs,diasCompletos,diasComAlgo,cheats,topo,concluidos,ativos,semanas:semanas.length};
}
function narrativaMes(){
  const d=dadosMes(), n=S.members.length, frases=[];
  const nomes=S.members.map(m=>m.nome.split(' ')[0]);
  const lista=a=>a.length<=1? (a[0]||'') : a.slice(0,-1).join(', ')+' e '+a[a.length-1];
  frases.push(`Nas últimas cinco semanas a casa foi de <b>${lista(nomes)}</b>${n>1?', '+plural(n,'pessoa','pessoas')+' a planear juntas':''}.`);
  if(d.refs){
    frases.push(`Foram planeadas <span class="destaque">${plural(d.refs,'refeição','refeições')}</span> em ${plural(d.diasComAlgo,'dia','dias')}`
      + (d.diasCompletos? `, ${plural(d.diasCompletos,'deles com o dia completo','deles com o dia completo')}.` : ', ainda nenhum com as quatro refeições preenchidas.'));
  } else {
    frases.push('Ainda não há refeições planeadas neste período — o plano semanal está à espera.');
  }
  if(d.topo.length){
    frases.push(`À mesa repetiu-se sobretudo <b>${esc(d.topo[0].nome)}</b>`
      + (d.topo.length>1? `, seguida de ${lista(d.topo.slice(1).map(t=>esc(t.nome)))}.` : '.'));
  }
  if(d.cheats) frases.push(`Houve ${plural(d.cheats,'dia livre','dias livres')} marcados — aniversários e festas contam-se, não se escondem.`);
  /* atividade: soma dos minutos semanais registados, que é o que a app sabe */
  const minutos=S.members.map(m=>({nome:m.nome.split(' ')[0], min:Math.round(minutosSemana(m))})).filter(x=>x.min>0);
  if(minutos.length){
    const total=minutos.reduce((t,x)=>t+x.min,0);
    const mais=minutos.slice().sort((a,b)=>b.min-a.min)[0];
    frases.push(`Em movimento, a família tem <span class="destaque">${hmm(total/60)} por semana</span> registados, com <b>${mais.nome}</b> à frente (${hmm(mais.min/60)}).`);
  } else {
    frases.push('Não há desporto registado — vale a pena inscrever o que já se faz, nem que seja a caminhada até ao trabalho.');
  }
  /* peso: só para quem tem objetivo, porque é o único sítio com peso inicial */
  const evol=d.ativos.map(o=>{ const m=S.members.find(x=>x.id===o.membroId); if(!m) return null;
    const dif=Math.round((m.peso-o.pesoInicial)*10)/10;
    return {nome:m.nome.split(' ')[0], dif, tipo:o.tipo}; }).filter(Boolean);
  evol.forEach(e=>{
    if(Math.abs(e.dif)<0.2) frases.push(`<b>${e.nome}</b> está no mesmo peso desde que começou o objetivo.`);
    else if((e.tipo==='perder'&&e.dif<0)||(e.tipo==='ganhar'&&e.dif>0))
      frases.push(`<b>${e.nome}</b> vai no bom caminho: <span class="destaque">${e.dif>0?'+':'−'}${nPT(Math.abs(e.dif),1)} kg</span> desde o início do objetivo.`);
    else frases.push(`<b>${e.nome}</b> está ${e.dif>0?'+':'−'}${nPT(Math.abs(e.dif),1)} kg face ao início — o rumo ainda não é o pretendido, e isso também é informação.`);
  });
  if(d.concluidos.length){
    const q=d.concluidos.map(o=>{ const m=S.members.find(x=>x.id===o.membroId); return m? m.nome.split(' ')[0]:null; }).filter(Boolean);
    frases.push(`🏆 ${plural(d.concluidos.length,'Um objetivo foi atingido','Objetivos atingidos')} neste período${q.length?', por '+lista(q):''}. Fica registado nas Conquistas.`);
  }
  const semDespensa=Object.keys(S.despensa||{}).length;
  if(semDespensa) frases.push(`Na despensa há <b>${plural(semDespensa,'item marcado','itens marcados')}</b> como disponíveis, o que já poupa passos na lista de compras.`);
  return frases.join(' ');
}
/* Prosa com prova no mesmo parágrafo: uma frase por perfil com o traço do peso
   e da atividade do próprio mês, do tamanho de uma palavra. Só para quem tem
   pesagens que cheguem — uma linha com dois pontos não é uma tendência. */
function sparklinesDoMes(){
  const h=hojeISO(), ini=addDias(h,-30);
  const frases=S.members.map(m=>{
    const pts=medicoesDe(m.id).filter(x=>x.d>=ini);
    const treinos=[];
    for(let i=29;i>=0;i--){ const d=addDias(h,-i);
      treinos.push(regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita').reduce((t,r)=>t+kcalRegAtiv(r),0)); }
    const temTreino=treinos.some(x=>x>0);
    if(pts.length<3 && !temTreino) return '';
    const partes=[];
    if(pts.length>=3){
      const dif=pts[pts.length-1].p-pts[0].p;
      partes.push(sparkSvg(pts.map(x=>x.p), 'peso de '+m.nome+' no mês')
        +' o peso '+(Math.abs(dif)<0.25? 'esteve quieto' : dif<0? 'desceu '+nPT(Math.abs(dif),1)+' kg' : 'subiu '+nPT(dif,1)+' kg'));
    }
    if(temTreino) partes.push(sparkSvg(treinos,'atividade de '+m.nome+' no mês')
      +' e o movimento fez '+Math.round(treinos.reduce((t,x)=>t+x,0))+' kcal');
    if(!partes.length) return '';
    return '<b>'+nomeCurto(m)+':</b>'+partes.join(',');
  }).filter(Boolean);
  if(!frases.length) return '';
  return ' '+frases.join('. ')+'.';
}

    <p class="sub" style="margin-top:6px">Prepara-se hoje à noite. As doses já vêm escaladas a cada pessoa.</p>

function cartaoHoje(){
  const hoje=new Date(), wk=mondayISO(hoje), di=(hoje.getDay()+6)%7, dataISO=iso(hoje);
  const w=S.plans[wk]||{};
  const dias=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const rot='Hoje · '+dias[hoje.getDay()]+', '+hoje.getDate()+' de '+meses[hoje.getMonth()];
  const linhas=[], alertas=[];
  MEALK.forEach(mk=>{
    const meal=w[di]&&w[di][mk]; if(!meal||!meal.r) return;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) return;
    const comem=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dataISO));
    const acs=acompsDe(meal);
    /* o acompanhamento vai para a mesa como o prato: o alergénio dele é tão
       do dia de hoje como o do bife */
    [r].concat(acs).forEach(rec=>comem.forEach(m=>{ const al=alergenicosDe(rec,m);
      if(al.length) alertas.push(nomeCurto(m)+': '+al.map(a=>a.nome.toLowerCase()).join(', ')+' em '+esc(rec.n)); }));
    const v=estadoValidacaoRef(comem,dataISO,mk);
    linhas.push(`<button class="hoje-linha ${v.alguma?'a-tinta':''}" style="width:100%;text-align:left;border:none;background:none;cursor:pointer;font:inherit;color:inherit"
      onclick="abrirFolhaMesa('${dataISO}','${mk}')"
      aria-label="Registar quem comeu o ${nomeRefeicao(mk).toLowerCase()} de hoje">
      <span class="hoje-ico" aria-hidden="true">${ICO_REF[mk]||''}</span>
      <div style="flex:1;min-width:0"><b>${esc(r.n)}</b>${acs.length? ` <span class="sub">+ ${acs.map(x=>esc(x.n)).join(' + ')}</span>`:''}
        <span class="sub" style="display:block">${nomeRefeicao(mk)} · ${r.k+somaAc(acs,'k')} kcal/dose${
          v.alguma? ' · '+(v.cheia? 'mesa cheia' : v.n+' de '+v.total+' confirmados') : ''}</span></div>
      ${v.alguma? carimbo('ref:'+dataISO+':'+mk) : ''}
      <span style="display:inline-flex;gap:2px;flex:none">${comem.map(m=>avatar(m,20)).join('')}</span></button>`);
  });
  const fecho=podeFecharDia();
  /* o que falta comprar conta-se na semana de HOJE, que pode não ser a que
     está aberta no plano — daí não se usar shoppingItems() diretamente */
  const guarda=S.week; S.week=wk;
  const pend=itensEmFalta(shoppingItems().items).filter(i=>!((S.bought[wk]||{})[i.n+'|'+i.u])).length;
  S.week=guarda;
  return `<section class="card card--capa" id="hoje" style="margin-bottom:16px">
    <span class="lbl">${rot}</span>
    <h2 style="margin-top:2px">${linhas.length? 'À mesa hoje' : 'Hoje ainda sem plano'}</h2>
    ${alertas.length? `<div class="alerta forte" style="margin:8px 0"><span aria-hidden="true">🚨</span><span>${alertas.join(' · ')}</span></div>`:''}
    ${fecho? `<div class="row" style="margin:10px 0 2px">
      <button class="btn" onclick="fecharDiaComoPlaneado()">✓ Correu como planeado</button>
      <span class="sub">${plural(fecho.total,'coisa por confirmar','coisas por confirmar')} — um toque fecha o dia. Desfaz-se num passo.</span>
    </div>`:''}
    ${blocoSobrasHoje()}
    ${blocoMarmitasHoje()}
    ${blocoFestas()}
    ${(function(){ const mem=memoriaDoDia();
      return mem? `<p class="sub" style="margin-top:10px;font-style:italic">🕰 ${esc(mem)}</p>`:''; })()}
    ${(function(){ const seq=sequenciaCasa();
      const eu=S.members.map(m=>({m, n:sequenciaDe(m)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
      if(!seq && !eu.length) return '';
      const wkAnt=mondayISO(addDias(hojeISO(),-7));
      const emPausa=(S.pausas||[]).some(p=>p.wk===wkAnt);
      return `<p class="sub" style="margin-top:8px">🔁 ${seq? '<b>A casa leva '+textoSequencia(seq)+'</b> a cumprir o que planeou. '
        : ''}${eu.length? eu.slice(0,3).map(x=>nomeCurto(x.m)+' '+textoSequencia(x.n)).join(' · ') : ''} ${dica('sequencia')}
        <button class="chip" style="margin-left:6px;padding:1px 9px" onclick="pausaDeclarada('casa','${wkAnt}')"
          aria-pressed="${emPausa}">${emPausa? '✓ semana passada em pausa' : 'declarar pausa na semana passada'}</button></p>`; })()}
    ${linhas.length? `<div class="hoje-lista">${linhas.join('')}</div>`
      : `<p class="sub" style="margin-top:4px">O dia de hoje está por planear — duas escolhas no Plano e a cozinha sabe o que a espera.</p>`}
    <div class="row" style="margin-top:12px">
      <button class="btn small" onclick="irHojePlano()">${linhas.length? 'Ver o plano de hoje':'Abrir o plano'}</button>
      ${pend? `<button class="pill warn hoje-pend" onclick="abrirMercado()">🛒 ${pend} ${pend===1?'item':'itens'} por comprar</button>`:''}
    </div>

/* A idade deixou de ser um slider: ou vem da data de nascimento e envelhece
   sozinha, ou se escreve à mão enquanto essa data não existir. */
function blocoIdade(m){
  const mid=m.id, bebe=faseDe(m)==='bebe';
  const aberto=S.ui.nascAberto===mid;
  if(m.nasc && !aberto) return `<div><label class="lbl">Idade</label>
    <div class="row" style="flex-wrap:nowrap;gap:6px;min-height:38px;align-items:center">
      <span class="pill" style="flex:1;justify-content:center">${textoIdade(m)}</span>
      <button class="btn ghost small" style="flex:none" aria-label="Editar a data de nascimento de ${esc(m.nome)}"
        title="Nasceu em ${fmtLongo(m.nasc)}" onclick="abrirNasc('${mid}')">✎</button>
    </div></div>`;
  if(aberto || m.nasc) return `<div><label class="lbl">Data de nascimento</label>
    <input type="date" id="in-${mid}-nasc" max="${hojeISO()}" min="1900-01-01" value="${m.nasc||''}"
      aria-label="Data de nascimento de ${esc(m.nome)}" onchange="setNascimento('${mid}',this.value)"></div>`;
  return `<div><label class="lbl">${bebe?'Idade (meses)':'Idade (anos)'}</label>
    <div class="row" style="flex-wrap:nowrap;gap:6px">
      ${bebe? `<input type="number" style="min-width:64px" id="in-${mid}-idade" min="0" max="24" step="1" value="${Math.round(idadeMeses(m))}"
          aria-label="Idade em meses" onchange="upd('${mid}','meses',this.value,1)">`
        : `<input type="number" style="min-width:64px" id="in-${mid}-idade" min="2" max="120" value="${Math.round(m.idade)}"
          aria-label="Idade em anos" onchange="upd('${mid}','idade',this.value,1)">`}
      <button class="btn ghost small" style="flex:none" title="Usar a data de nascimento"
        aria-label="Definir a data de nascimento de ${esc(m.nome)}" onclick="abrirNasc('${mid}')">📅</button>
    </div></div>`;
}
function textoIdade(m){
  return faseDe(m)==='bebe'? plural(Math.round(idadeMeses(m)),'mês','meses')
    : plural(Math.round(idadeAnos(m)),'ano','anos');
}
function abrirNasc(mid){ S.ui.nascAberto = S.ui.nascAberto===mid? null : mid; saveMeta(); render(); }
function setNascimento(mid,v){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!v){ delete m.nasc; S.ui.nascAberto=null; save('data de nascimento de '+m.nome); return render(); }
  if(!nascValida(v)) return flash('bad','Data de nascimento inválida — tem de ser uma data passada.');
  m.nasc=v; aplicaNascimento(m); normalizaIdadeMeses(m);
  if(m.bebe){ delete m.bebe.pctLeite; m.bebe.ml=null; }
  if(faseDe(m)!=='bebe') m.gravida = m.gravida && m.sexo==='f' && idadeAnos(m)>=12;
  S.ui.nascAberto=null;
  save('data de nascimento de '+m.nome); render();
}
/* Mexer no peso é pesar-se: o valor fica com a data de hoje, e a evolução do
   peso ganha o ponto sem ninguém ter de o escrever duas vezes. */
function commitPesoCampo(mid,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!registarMedicao(mid,hojeISO(),val)) return flash('bad','Peso fora do que é possível — entre 1 e 400 kg.');
  save('peso de '+m.nome); render();
}
function commitPesoSlider(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  registarMedicao(mid,hojeISO(),el.value);
  save('peso de '+m.nome);
}
/* A escolha da fase acerta a idade para dentro do escalão, para os cálculos
   e os limites de esforço passarem logo a ser os certos. */
function setFase(mid,f){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(f==='bebe'){ if(!Number.isFinite(m.meses)) m.meses=12; m.idade=m.meses/12; m.gravida=false; }
  else { delete m.meses;
    const a=idadeAnos(m);
    if(f==='crianca' && !(a>=2&&a<13)) m.idade=8;
    if(f==='adolescente' && !(a>=13&&a<19)) m.idade=15;
    if(f==='adulto' && a<19) m.idade=30;
  }
  normalizaIdadeMeses(m);
  save(); render();
}
/* O aviso que acompanha cada fase. Não impede nada, mas também não deixa a
   app fingir autoridade clínica que não tem. */
function avisoFase(m){
  const meses=idadeMeses(m), fase=faseDe(m), av=[];
  if(gravida(m)){
    av.push(fetos(m)>=3
      ? '<b>Gestação de trigémeos ou mais:</b> não há valores de referência publicados para as necessidades energéticas, por isso a app não apresenta uma estimativa. O acompanhamento tem de ser da equipa de obstetrícia e nutrição.'
      : fetos(m)===2
        ? 'Numa gestação gemelar não existe recomendação oficial de energia: o acréscimo mostrado é uma aproximação e as necessidades reais costumam ser maiores. Confirma com quem te segue.'
        : 'Os valores seguem as referências para gravidez de feto único e usam o peso pré-gestacional. Não substituem o acompanhamento obstétrico e nutricional.');
  }
  if(meses<6) av.push('<b>Até aos 6 meses</b> a alimentação é leite materno ou fórmula. A app não gera plano alimentar nesta idade — a orientação é do pediatra.');
  else if(meses<24) av.push('Entre os 6 e os 24 meses o plano serve de apoio à diversificação alimentar, não de prescrição. Segue as indicações do pediatra ou do enfermeiro de família.');
  else if(fase==='crianca'||fase==='adolescente') av.push('Em idade de crescimento os valores são referências populacionais e não dispensam o acompanhamento em consulta. Restringir calorias nesta fase pode comprometer o crescimento.');
  if(!av.length) return '';
  return `<div class="msg warn-msg" style="margin:12px 0 0">${av.join('<br><br>')}</div>`;
}
/* Arrasto dos sliders de perfil: estado + espelho no campo numérico (nunca o
   focado) + atualização ao vivo de IMC, banda, basal, gasto e alvo do cartão. */
function slidePerfil(mid,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m[campo]=parseFloat(el.value)||0; pintaRange(el);
  const inp=document.getElementById('in-'+mid+'-'+campo);
  if(inp && document.activeElement!==inp) inp.value=el.value;
  aoVivo('fam:'+mid, ()=>atualizarFamilia(mid));
}
/* O único slider que sobrou no perfil é o do peso: a idade vem da data de
   nascimento e a altura escreve-se uma vez, num campo. */
function atualizarFamilia(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const v=bmi(m), [cls,tone]=bmiClass(v);
  põe('f-'+mid+'-o-peso', nPT(m.peso,1)+' kg');
  põe('f-'+mid+'-imc', nPT(v,1)); põe('f-'+mid+'-imcv', nPT(v,1));
  põe('f-'+mid+'-bmr', Math.round(bmr(m)));
  põe('f-'+mid+'-tdee', Math.round(tdee(m)));
  põeAttr('f-'+mid+'-mk','transform','translate('+sx(v,15,40,8,332).toFixed(1)+',0)');
  /* o texto anda à parte do triângulo, preso dentro do viewBox para não ser
     cortado nos extremos da escala */
  põeAttr('f-'+mid+'-imcv','x', clampNum(sx(v,15,40,8,332),22,318).toFixed(1));
  const adulto=faseDe(m)==='adulto';
  const pill=document.getElementById('f-'+mid+'-cls');
  /* As classes de IMC do adulto não se aplicam a crianças, cuja leitura é
     por percentil para a idade e o sexo — mostra-se a fase em vez disso. */
  if(pill){ pill.textContent=adulto?cls:nomeFase(m); pill.setAttribute('class','pill '+(adulto?tone:'')); }
  põe('f-'+mid+'-alvo', semEstimativa(m)?'—':Math.round(targetKcal(m)));
  const h2=(m.altura/100)*(m.altura/100);
  const zmin=Math.round(18.5*h2), zmax=Math.round(25*h2), dentro=m.peso>=zmin&&m.peso<=zmax;
  const zel=document.getElementById('f-'+mid+'-zona');
  if(zel && adulto){ zel.textContent=(dentro?'✓ ':'')+'Peso saudável para '+Math.round(m.altura)+' cm: '+zmin+'–'+zmax+' kg';
    zel.setAttribute('class', dentro?'sub f-ok-txt':'sub'); }
}

/* ================= ATIVIDADE ================= */
function addSport(mid){ const m=S.members.find(x=>x.id===mid);
  m.desportos.push(normalizaDesporto({s:'caminhada',h:2,per:'semana',i:'moderado'})); save(); render(); }
function opcoesDesporto(sel){
  return CATS_SPORT.map(([c,rot])=>{
    const lista=SPORTS.filter(s=>s.cat===c);
    if(!lista.length) return '';
    return `<optgroup label="${(ICO_SPORT[c]||'')+' '+rot}">`+lista.map(s=>
      `<option value="${s.id}" ${sel===s.id?'selected':''}>${s.nome}</option>`).join('')+`</optgroup>`;
  }).join('');
}
function updSport(mid,i,f,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const s=m.desportos[i]; if(!s) return;
  if(f==='s'){
    /* Ao trocar de desporto guardam-se as horas e convertem-se para a forma
       que o novo desporto usa, para não se perder o que já estava escrito. */
    const horas=horasPeriodo(s), novo=SPORT[val];
    /* o id e os dias são do lugar no plano, não do desporto: trocar a
       modalidade não desmarca os dias nem quebra os registos já ligados */
    if(novo && novo.dist){ m.desportos[i]=normalizaDesporto({id:s.id, dias:s.dias, s:val, per:s.per, v:novo.dist.vdef,
      km:Math.round(Math.max(horas,0.25)*novo.dist.vdef*10)/10}); }
    else { m.desportos[i]=normalizaDesporto({id:s.id, dias:s.dias, s:val, per:s.per, h:Math.round(Math.max(horas,0.25)*10)/10,
      i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'}); }
  } else if(f==='per'){
    s.per=val;
    const sp=SPORT[s.s];
    if(sp && sp.dist) s.km=Math.min(parseFloat(s.km)||0, faixaDist(sp,val).max);
  } else if(f==='h'||f==='km'||f==='v'){ s[f]=parseFloat(val)||0; }
  else { s[f]=val; }
  save(); render();
}
function pintaRange(el){ const mn=parseFloat(el.min), mx=parseFloat(el.max), v=parseFloat(el.value);
  el.style.setProperty('--pct', (mx>mn? Math.round((clampNum(v,mn,mx)-mn)/(mx-mn)*100):0)+'%'); }
/* Contrato tátil de toda a app: oninput muta o estado e reescreve SÓ os alvos
   com id (nunca render), onchange grava. O coalescedor prende as escritas de
   DOM ao ritmo dos frames — em aparelhos lentos o input dispara mais depressa. */
/* Coalesce por chave: com dois dedos em cartões diferentes, guardar só o
   último callback deixava um deles por pintar — aqui cada alvo tem a sua
   entrada e todos correm no mesmo frame. */
let _raf=0; const _pend={};
function aoVivo(chave,fn){
  _pend[chave]=fn;
  if(_raf) return;
  _raf=requestAnimationFrame(()=>{ _raf=0;
    const fns=Object.keys(_pend).map(k=>{ const f=_pend[k]; delete _pend[k]; return f; });
    fns.forEach(f=>f());
  });
}
function põe(id,txt){ const el=document.getElementById(id); if(el) el.textContent=txt; }
function põeAttr(id,attr,val){ const el=document.getElementById(id); if(el) el.setAttribute(attr,val); }
function slideSport(mid,i,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m||!m.desportos[i]) return;
  m.desportos[i][campo]=parseFloat(el.value)||0;
  pintaRange(el);
  aoVivo('atv', atualizarAtividade);
}
function atualizarAtividade(){
  const m=curM(); if(!m) return;
  (m.desportos||[]).forEach((s,i)=>{
    const sp=SPORT[s.s]; if(!sp) return;
    const met=metDe(s), kd=met*m.peso*sportWeeklyH(s)/7;
    if(sp.dist){
      põe('sp'+i+'-km', nPT(parseFloat(s.km)||0, faixaDist(sp,s.per).step<1?1:0)+' km');
      põe('sp'+i+'-v', textoVelocidade(sp, velocidade(s)));
      põe('sp'+i+'-t', hmm(horasPeriodo(s))+' por '+porLabel(s.per));
      põe('sp'+i+'-nivel', NIVEIS[nivelPorMet(sp,met)][1]);
      /* o ponto na curva move-se só com a velocidade (o MET não depende da distância) */
      const d=sp.dist, y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
      const cx=sx(velocidade(s),d.vmin,d.vmax,36,330).toFixed(1);
      const cy=sx(met,y0,y1,104,10).toFixed(1);
      põeAttr('sp'+i+'-dot','cx',cx); põeAttr('sp'+i+'-dot','cy',cy);
      const drop=document.getElementById('sp'+i+'-drop');
      if(drop){ drop.setAttribute('x1',cx); drop.setAttribute('x2',cx);
        drop.setAttribute('y1',cy); drop.setAttribute('y2','104'); }
    }
    põe('sp'+i+'-kcal','~'+Math.round(kd)+' kcal/dia');
    põe('sp'+i+'-met', nPT(met,1)+' MET · '+Math.round(met*m.peso)+' kcal/h');
  });
  põe('tot-desporto','+'+Math.round(sportsKcalDay(m)));
  põe('tot-total', Math.round(tdee(m)));
  /* barra empilhada do gasto + linha do alvo — a mesma assinatura da Nutrição e do Plano */
  const gp=gastoPartes(m), alvo=targetKcal(m);
  const barra=document.getElementById('ga-basal');
  if(barra){
    const K=Math.max(gp.total,alvo)*1.05||1, w=x=>Math.max(0,x/K*100);
    barra.style.width=w(gp.basal)+'%';
    document.getElementById('ga-dia').style.width=w(gp.dia)+'%';
    document.getElementById('ga-desloc').style.width=w(gp.desloc)+'%';
    document.getElementById('ga-desp').style.width=w(gp.desp)+'%';
    const X=w(alvo), linha=document.getElementById('ga-alvo'), txt=document.getElementById('ga-alvo-txt');
    if(linha) linha.style.left=X+'%';
    if(txt){ txt.style.left=X+'%'; txt.style.transform=X>78?'translateX(-100%)':'none';
      txt.textContent='alvo '+Math.round(alvo); }
    põe('ga-alvostat', Math.round(alvo));
  }
}
function delSport(mid,i){ const m=S.members.find(x=>x.id===mid); m.desportos.splice(i,1); save(); render(); }

/* Curva velocidade→MET com o ponto do slider. A interpolação da app é linear,
   por isso a polyline pelos pontos tabelados É a curva exata, não uma amostra. */
function curvaMetSvg(sp,s,i){
  const d=sp.dist, c=CURVAS[d.curva];
  const y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
  const X=v=>sx(v,d.vmin,d.vmax,36,330), Y=met=>sx(met,y0,y1,104,10);
  const pts=[[d.vmin,metPorVelocidade(d.curva,d.vmin)]]
    .concat(c.filter(p=>p[0]>d.vmin&&p[0]<d.vmax))
    .concat([[d.vmax,metPorVelocidade(d.curva,d.vmax)]]);
  const poly=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const area=poly+' '+X(d.vmax).toFixed(1)+',104 '+X(d.vmin).toFixed(1)+',104';
  /* divisórias de nível derivadas dos mesmos limiares de nivelPorMet */
  const v1=velocidadeParaMet(d,(sp.mets[0]+sp.mets[1])/2), v2=velocidadeParaMet(d,(sp.mets[1]+sp.mets[2])/2);
  const zonas=[[d.vmin,v1,'leve'],[v1,v2,'moderado'],[v2,d.vmax,'intenso']];
  const rotZonas=zonas.map(z=>{ const w=X(z[1])-X(z[0]);
    return w>=44? `<text x="${((X(z[0])+X(z[1]))/2).toFixed(1)}" y="20" font-size="9.5" text-anchor="middle" class="f-mut">${z[2]}</text>`:''; }).join('');
  const divisorias=[v1,v2].map(v=>`<line x1="${X(v).toFixed(1)}" y1="10" x2="${X(v).toFixed(1)}" y2="104" class="s-line" stroke-dasharray="2 4"/>`).join('');
  const meio=Math.round((d.vmin+d.vmax)/2);
  /* a natação vai de 1,5 a 4,5 km/h: arredondar o rótulo a inteiro punha «2» e
     «5» por baixo dos extremos reais */
  const rotV=v=>nPT(v, Number.isInteger(v)?0:1);
  const ticksX=[d.vmin,meio,d.vmax].map(v=>`<text x="${X(v).toFixed(1)}" y="116" font-size="10" text-anchor="middle" class="f-mut" style="font-variant-numeric:tabular-nums">${rotV(v)}</text>`).join('');
  const m1=Math.ceil(y0), m2=Math.floor(y1);
  /* A unidade vai colada ao valor de cima em vez de num rótulo no canto: o
     canto ficava exatamente onde o traço do topo cai quando a escala aperta,
     e «MET» passava por cima do número. */
  const ticksY=`<text x="32" y="${(Y(m1)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m1} MET</text>
    <text x="32" y="${(Y(m2)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m2}</text>`;
  const vA=velocidade(s), cx=X(vA).toFixed(1), cy=Y(metDe(s)).toFixed(1);
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 136" preserveAspectRatio="none" aria-hidden="true">
    <line x1="36" y1="104" x2="330" y2="104" class="s-line"/>
    <polygon points="${area}" class="f-acc" fill-opacity=".07"/>
    <polyline points="${poly}" class="s-acc" fill="none" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${divisorias}${rotZonas}${ticksX}${ticksY}
    <text x="330" y="133" font-size="9.5" text-anchor="end" class="f-mut">km/h</text>
    <line id="sp${i}-drop" x1="${cx}" y1="${cy}" x2="${cx}" y2="104" class="s-energy" stroke-dasharray="3 3" opacity=".5"/>
    <circle id="sp${i}-dot" cx="${cx}" cy="${cy}" r="5.5" style="fill:var(--energy);stroke:var(--card);stroke-width:2"/>
  </svg>`;
}
/* Desportos por níveis: escala fixa 2–16 MET, comparável entre desportos —
   vê-se que o «intenso» do ténis de mesa fica abaixo do «leve» da corrida. */
function escalaMet3(sp,s){
  const x=met=>sx(clampNum(met,2,16),2,16,12,328);
  const ni=nivelIndice(s.i);
  return `<svg class="svgfx" viewBox="0 0 340 40" aria-hidden="true">
    <line x1="12" y1="22" x2="328" y2="22" class="s-line"/>
    ${sp.mets.map((met,idx)=>`
      <circle cx="${x(met).toFixed(1)}" cy="22" r="${idx===ni?6:4}" style="${idx===ni?'fill:var(--accent);stroke:var(--card);stroke-width:2':'fill:var(--card);stroke:var(--mut);stroke-width:1.5'}"/>
      <text x="${x(met).toFixed(1)}" y="38" font-size="9.5" text-anchor="middle" class="${idx===ni?'f-ink':'f-mut'}" style="font-variant-numeric:tabular-nums"${idx===ni?' font-weight="700"':''}>${nPT(met,1)}</text>`).join('')}
    <text x="328" y="10" font-size="9.5" text-anchor="end" class="f-mut">escala 2–16 MET</text>
  </svg>`;
}
function blocoDesporto(m,s,i){
  const sp=SPORT[s.s], met=metDe(s);
  const kd=Math.round(met*m.peso*sportWeeklyH(s)/7), kh=Math.round(met*m.peso);
  const periodo=`<select onchange="updSport('${m.id}',${i},'per',this.value)" aria-label="Período">
      <option value="dia" ${s.per==='dia'?'selected':''}>por dia</option>
      <option value="semana" ${s.per==='semana'?'selected':''}>por semana</option>
      <option value="mes" ${s.per==='mes'?'selected':''}>por mês</option></select>`;
  const gasto=`<span class="kcal" id="sp${i}-kcal">~${kd} kcal/dia</span>
    <span class="sub" id="sp${i}-met">${nPT(met,1)} MET · ${kh} kcal/h</span>`;
  let miolo;

    const f=faixaDist(sp,s.per), km=parseFloat(s.km)||0, v=velocidade(s);
    const pctKm=f.max>0? Math.round(km/f.max*100):0;

    miolo=`<div class="spgrid">
      <div>
        <div class="splabel"><span>Distância por ${porLabel(s.per)} ${dica('distancia')}</span>
          <output id="sp${i}-km">${nPT(km,f.step<1?1:0)} km</output></div>
        <input type="range" min="0" max="${f.max}" step="${f.step}" value="${km}" style="--pct:${pctKm}%"
          aria-label="Distância por ${porLabel(s.per)}, em quilómetros"
          oninput="slideSport('${m.id}',${i},'km',this)" onchange="save()">
      </div>
      <div class="splabel" style="margin:2px 0 0"><span>Esforço em função da velocidade ${dica('curvaMet')}</span></div>
      ${curvaMetSvg(sp,s,i)}
      <div>
        <div class="splabel"><span>Velocidade</span>
          <output id="sp${i}-v">${textoVelocidade(sp,v)}</output></div>
        <input type="range" min="${sp.dist.vmin}" max="${sp.dist.vmax}" step="${sp.dist.vStep}" value="${v}" style="--pct:${pctV}%"
          aria-label="Velocidade média em quilómetros por hora"
          oninput="slideSport('${m.id}',${i},'v',this)" onchange="save()">
      </div>
    </div>
    <div class="spfoot">${periodo}
      <span class="pill nivel" id="sp${i}-nivel">${NIVEIS[nivelPorMet(sp,met)][1]}</span>
      <span class="sub" id="sp${i}-t">${hmm(horasPeriodo(s))} por ${porLabel(s.per)}</span>
      <span class="spgasto">${gasto}</span></div>`;
  } else {
    miolo=`<div class="splabel" style="margin:2px 0 0"><span>Intensidade ${dica('intensidade')}</span></div>
      ${escalaMet3(sp,s)}<div class="spfoot">
      <select onchange="updSport('${m.id}',${i},'i',this.value)" aria-label="Intensidade">${NIVEIS.map(([k],ni)=>
        `<option value="${k}" ${nivelIndice(s.i)===ni?'selected':''}>${rotuloNivel(sp,ni)}</option>`).join('')}</select>
      <span class="sphoras"><input type="number" min="0" step="0.5" inputmode="decimal" value="${s.h}"
        aria-label="Horas" onchange="updSport('${m.id}',${i},'h',this.value)"> <span class="sub">h</span></span>
      ${periodo}<span class="spgasto">${gasto}</span></div>`;
  }
  return `<div class="spline">
    <div class="sptop">
      <select onchange="updSport('${m.id}',${i},'s',this.value)" aria-label="Desporto">${opcoesDesporto(s.s)}</select>
      <button class="btn danger small" onclick="delSport('${m.id}',${i})" aria-label="Remover desporto">✕</button>
    </div>${miolo}
    ${linhaDiasPlano(m,s,i)}</div>`;
}
/* Em que dias da semana este treino acontece. Os dias só repartem o volume que
   já estava no plano — o total semanal, e portanto o gasto calórico, não muda
   com esta escolha. O que muda é passar a haver treinos com data, e por isso
   passar a haver alguma coisa para confirmar no fim do dia. */
const INI_DIAS=['S','T','Q','Q','S','S','D'];
const NOME_DIAS=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
function linhaDiasPlano(m,s,i){
  const dias=diasPlano(s), sess=minutosSessao(s);
  const proprios=Array.isArray(s.dias)&&s.dias.length;
  return `<div class="dias-plano">
    <span class="lbl" style="margin:0">Dias</span>
    ${INI_DIAS.map((ini,d)=>`<button class="dia-op ${dias.indexOf(d)>=0?'on':''}"
      onclick="toggleDiaPlano('${m.id}',${i},${d})" aria-pressed="${dias.indexOf(d)>=0}"
      aria-label="${NOME_DIAS[d]}">${ini}</button>`).join('')}
    <span class="sub" style="margin-left:auto">${dias.length}× ${hmm(sess/60)}${proprios?'':' · sugestão'}</span>
  </div>`;
}
function toggleDiaPlano(mid,i,d){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const s=m.desportos[i]; if(!s) return;
  const dias=diasPlano(s).slice();
  const j=dias.indexOf(d);
  if(j>=0){ if(dias.length===1) return flash('warn','Um treino do plano precisa de pelo menos um dia. Para o tirar do plano, remove-o.');
    dias.splice(j,1); }
  else dias.push(d);
  s.dias=dias.sort((a,b)=>a-b);
  save('dias de treino'); render();
}
/* Recomendação e limites de esforço da fase, com o que está registado a ser
   comparado com o que é recomendado — e a lista concreta do que evitar. */
function cartaoEsforco(m){
  const L=limitesEsforco(m), min=Math.round(minutosSemana(m));
  const registados=(m.desportos||[]).map(s=>s.s);
  const conflitos=registados.filter(id=>L.evitar.indexOf(id)>=0)
    .map(id=>SPORT[id]&&SPORT[id].nome).filter(Boolean);
  const acimaNivel=L.nivelMax? (m.desportos||[]).filter(s=>{
    const sp=SPORT[s.s]; if(!sp) return false;
    const idx=sp.dist? nivelPorMet(sp,metDe(s)) : nivelIndice(s.i);
    return idx>NIVEIS.findIndex(n=>n[0]===L.nivelMax);
  }).map(s=>SPORT[s.s].nome) : [];
  const alvoSemana = L.fase==='adulto'&&!gravida(m)? 150 : gravida(m)? 150 : 420;
  const pctA=Math.min(100, alvoSemana? min/alvoSemana*100 : 0);
  return `<div class="card" style="margin-top:16px;border-left:4px solid var(--accent)">
    <h3>Esforço recomendado — ${nomeFase(m)} ${dica('esforco')}</h3>
    <p class="sub" style="margin-top:6px">${L.recomendacao}</p>
    <div style="margin:12px 0 6px">
      <div class="splabel"><span>Registado por semana</span><output style="min-width:12ch;text-align:right">${hmm(min/60)}</output></div>
      <div class="mbar" style="height:10px"><div style="width:${pctA.toFixed(1)}%;background:var(--accent)"></div></div>
      <p class="sub" style="margin-top:4px">Referência para esta fase: cerca de ${hmm(alvoSemana/60)} por semana de atividade moderada${L.fase!=='adulto'&&!gravida(m)?' a vigorosa':''}.</p>
    </div>
    ${L.horasMax&&min/60>L.horasMax? `<div class="msg warn-msg" style="margin:8px 0 0">O desporto organizado ultrapassa as ${L.horasMax} h por semana que se costumam apontar como teto nesta idade. Em crescimento, o excesso de volume está associado a lesões por sobreuso.</div>`:''}
    ${gravida(m)&&min>300? `<div class="msg warn-msg" style="margin:8px 0 0">Mais de 300 minutos por semana na gravidez merece confirmação com quem te segue.</div>`:''}
    ${conflitos.length? `<div class="msg warn-msg" style="margin:8px 0 0">Modalidades registadas desaconselhadas nesta fase: <b>${conflitos.join(', ')}</b>. ${gravida(m)?'Na gravidez evitam-se desportos de contacto, com risco de queda ou de trauma abdominal.':'Nesta idade estas modalidades não são as indicadas.'}</div>`:''}
    ${acimaNivel.length? `<div class="msg warn-msg" style="margin:8px 0 0">Intensidade acima do recomendado em: <b>${acimaNivel.join(', ')}</b>. O limite sugerido nesta fase é «${L.nivelMax}».</div>`:''}
    ${L.notas.length? `<ul class="sub" style="margin:10px 0 0;padding-left:18px">${L.notas.map(n=>`<li style="margin-bottom:4px">${n}</li>`).join('')}</ul>`:''}
    ${idadeAnos(m)<19? `<p class="sub" style="margin-top:10px">Nota de cálculo: as calorias por METs foram medidas em adultos. Em crianças o custo relativo do mesmo movimento é diferente, pelo que estes valores servem de ordem de grandeza e não de medição.</p>`:''}
  </div>`;
}
/* ================= REGISTAR, VALIDAR E REVER ATIVIDADE =================
   O plano diz o que se tenciona fazer; o registo diz o que se fez. São coisas
   diferentes e a app deixou de as misturar: enquanto não há plano, é o plano
   que ocupa o lugar de destaque; a partir do momento em que existe, o que
   interessa todos os dias é registar o que aconteceu. */
function formAtiv(){ return S.ui.formAtiv&&typeof S.ui.formAtiv==='object'? S.ui.formAtiv : null; }
function fecharFormAtiv(){ S.ui.formAtiv=null; saveMeta(); render(); }
function abrirFormAtiv(mid,pre){
  const m=S.members.find(x=>x.id===mid)||curM(); if(!m) return;
  pre=pre||{};
  const base=(m.desportos||[])[0];
  const sid=temChave(SPORT,pre.s)? pre.s : (base? base.s : 'caminhada');
  const sp=SPORT[sid];
  const f={mid:m.id, editar:pre.editar||null, d:pre.d||hojeISO(), s:sid,
    min:Math.round(pre.min|| (base? minutosSessao(base) : 45)) || 45,
    i:NIVEIS.some(n=>n[0]===pre.i)? pre.i : 'moderado',
    plano:pre.plano||null, mids:Array.isArray(pre.mids)&&pre.mids.length? pre.mids.slice() : [m.id]};
  if(sp.dist){ f.v=clampNum(parseFloat(pre.v)||sp.dist.vdef, sp.dist.vmin, sp.dist.vmax);
    f.km=Math.round((parseFloat(pre.km)|| f.v*f.min/60)*10)/10; }
  S.ui.formAtiv=f; saveMeta(); render();
  setTimeout(()=>{ const el=document.getElementById('fa-cartao'); if(el) scrollSuave(el); },0);
}
function setFormAtiv(campo,val){
  const f=formAtiv(); if(!f) return;
  const sp=SPORT[f.s];
  if(campo==='s'){
    if(!temChave(SPORT,val)) return;
    f.s=val; const novo=SPORT[val];
    if(novo.dist){ f.v=novo.dist.vdef; f.km=Math.round(f.v*f.min/60*10)/10; }
    else { delete f.v; delete f.km; }
    f.plano=null;   /* trocar de modalidade deixa de cumprir aquele treino do plano */
  }
  else if(campo==='d'){ if(dataValida(val) && val<=hojeISO()) f.d=val; }
  else if(campo==='min'){ f.min=clampNum(Math.round(parseFloat(val)||0),1,1440);
    if(sp.dist) f.km=Math.round(f.v*f.min/60*10)/10; }
  else if(campo==='v'){ if(!sp.dist) return;
    f.v=clampNum(parseFloat(val)||sp.dist.vdef, sp.dist.vmin, sp.dist.vmax);
    f.min=clampNum(Math.round(f.km/f.v*60)||1,1,1440); }
  else if(campo==='km'){ if(!sp.dist) return;
    f.km=clampNum(Math.round((parseFloat(val)||0)*10)/10, 0.1, sp.dist.maxSemana*2);
    f.min=clampNum(Math.round(f.km/f.v*60)||1,1,1440); }
  else if(campo==='i'){ if(NIVEIS.some(n=>n[0]===val)) f.i=val; }
  saveMeta(); render();
}
function toggleFormAtivMembro(mid){
  const f=formAtiv(); if(!f) return;
  const i=f.mids.indexOf(mid);
  if(i>=0){ if(f.mids.length===1) return flash('warn','Tem de haver pelo menos uma pessoa a fazer a atividade.');
    f.mids.splice(i,1); }
  else f.mids.push(mid);
  saveMeta(); render();
}
function guardarFormAtiv(){
  const f=formAtiv(); if(!f) return;
  const base={d:f.d, s:f.s, min:f.min, i:f.i, v:f.v, km:f.km, plano:f.plano, estado:'feita'};
  if(f.editar){
    const r=(S.regAtiv||[]).find(x=>x.id===f.editar);
    if(!r) return fecharFormAtiv();
    const irmaos=irmaosDe(S.regAtiv,r);
    const aplicarATodos=irmaos.length? confirmaPartilha(irmaos,'aplicar a alteração') : false;
    const limpo=limparRegAtiv(Object.assign({},r,base,{id:r.id,mid:r.mid,grupo:r.grupo}),S.members.map(x=>x.id));
    if(!limpo) return flash('bad','Não foi possível guardar esta atividade.');
    Object.assign(r,limpo);
    if(aplicarATodos) irmaos.forEach(x=>{
      const l=limparRegAtiv(Object.assign({},x,base,{id:x.id,mid:x.mid,grupo:x.grupo}),S.members.map(y=>y.id));
      if(l) Object.assign(x,l); });
    S.ui.formAtiv=null;
    save('atividade editada');
    flash('ok','Atividade atualizada'+(aplicarATodos?' para todos os que a partilharam.':'.'));
    return render();
  }
  /* uma remarcação que se cumpre deixa de estar agendada: se ficasse, o mesmo
     treino aparecia por confirmar depois de já ter sido confirmado */
  S.regAtiv=(S.regAtiv||[]).filter(r=>!(r.estado==='agendada'&&r.d===f.d&&f.mids.indexOf(r.mid)>=0&&r.plano===f.plano&&f.plano));
  const criados=registarAtividade(base,f.mids,'feita');
  if(!criados.length) return flash('bad','Não foi possível registar esta atividade.');
  S.ui.formAtiv=null;
  save('atividade registada');
  flash('ok', criados.length>1
    ? 'Atividade registada para '+criados.length+' pessoas — '+Math.round(criados.reduce((t,r)=>t+kcalRegAtiv(r),0))+' kcal no total.'
    : 'Atividade registada — '+Math.round(kcalRegAtiv(criados[0]))+' kcal.');
  render();
}
function apagarRegAtiv(id){
  const r=(S.regAtiv||[]).find(x=>x.id===id); if(!r) return;
  const irmaos=irmaosDe(S.regAtiv,r);
  const m=S.members.find(x=>x.id===r.mid);
  if(!confirm('Apagar esta atividade do registo'+(m?' de '+m.nome:'')+'?')) return;
  const todos=irmaos.length? confirmaPartilha(irmaos,'apagar') : false;
  const fora=[r.id].concat(todos? irmaos.map(x=>x.id) : []);
  S.regAtiv=S.regAtiv.filter(x=>fora.indexOf(x.id)<0);
  save('atividade apagada'); render();
}
/* ---- Validação do que ficou por confirmar ---- */
function validarAtivFeita(mid,d,sid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const s=(m.desportos||[]).find(x=>x.id===sid); if(!s) return;
  /* quem partilha o mesmo treino no mesmo dia valida junto: uma caminhada em
     família não se confirma três vezes */
  const juntos=S.members.filter(x=>x.id!==mid && (x.desportos||[]).some(y=>y.s===s.s && diasPlano(y).indexOf(diaSemana(d))>=0
    && !(S.regAtiv||[]).some(r=>r.mid===x.id&&r.d===d&&r.plano===y.id&&r.estado!=='agendada')));
  const mids=[mid].concat(juntos.map(x=>x.id));
  const porMembro={};
  mids.forEach(id=>{ const mm=S.members.find(x=>x.id===id);
    const ss=(mm.desportos||[]).find(y=>y.s===s.s&&diasPlano(y).indexOf(diaSemana(d))>=0)||s;
    porMembro[id]={min:Math.round(minutosSessao(ss)), plano:ss.id,
      i:ss.i, v:ss.v, km:ss.km? Math.round(ss.km/ (diasPlano(ss).length||1) *10)/10 : undefined}; });
  S.regAtiv=(S.regAtiv||[]).filter(r=>!(r.estado==='agendada'&&r.d===d&&mids.indexOf(r.mid)>=0&&r.plano===sid));
  registarAtividade({d, s:s.s, min:Math.round(minutosSessao(s)), i:s.i, v:s.v, plano:sid, porMembro}, mids, 'feita');
  carimboAlvo='ativ:'+d+':'+sid;
  save('treino confirmado');
  flash('ok', mids.length>1? 'Confirmado para '+mids.length+' pessoas.' : 'Treino confirmado.');
  render();
}
function validarAtivFalhou(mid,d,sid,modo,novaData){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const s=(m.desportos||[]).find(x=>x.id===sid);
  S.regAtiv=(S.regAtiv||[]).filter(r=>!(r.estado==='agendada'&&r.d===d&&r.mid===mid&&r.plano===sid));
  registarAtividade({d, s:s? s.s : 'caminhada', min:s? Math.round(minutosSessao(s)) : 30,
    i:s? s.i : 'moderado', v:s? s.v : undefined, plano:sid}, [mid], 'falhada');
  if(modo==='remarcar'){
    const alvo=novaData||addDias(hojeISO(),1);
    registarAtividade({d:alvo, s:s? s.s : 'caminhada', min:s? Math.round(minutosSessao(s)) : 30,
      i:s? s.i : 'moderado', v:s? s.v : undefined, plano:sid}, [mid], 'agendada');
  }
  carimboAlvo='ativ:'+d+':'+sid;
  save('treino não realizado');
  if(modo==='remarcar') flash('ok','Remarcado para '+rotuloData(novaData||addDias(hojeISO(),1))+'.');
  else if(modo==='rever'){ S.ui.tab='atividade'; flash('warn','Marcado como não realizado. Ajusta os dias ou o volume no plano, aqui em baixo.'); }
  else flash('ok','Marcado como não realizado.');
  render();
}
function ignorarTodasAtiv(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const pend=pendentesAtiv(m);
  if(!pend.length) return;
  if(!confirm('Marcar '+plural(pend.length,'treino','treinos')+' por confirmar como não realizados?')) return;
  pend.forEach(p=>{
    S.regAtiv=(S.regAtiv||[]).filter(r=>!(r.estado==='agendada'&&r.d===p.d&&r.mid===mid&&r.plano===p.sid));
    registarAtividade({d:p.d, s:p.s.s||p.s, min:p.min, i:p.s.i, v:p.s.v, plano:p.sid}, [mid], 'falhada');
  });
  save('treinos por confirmar'); render();
}
function confirmarTodasAtiv(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const pend=pendentesAtiv(m).slice();
  pend.forEach(p=>{
    if((S.regAtiv||[]).some(r=>r.mid===mid&&r.d===p.d&&r.plano===p.sid&&r.estado!=='agendada')) return;
    validarAtivSilenciosa(mid,p);
  });
  save('treinos confirmados');
  flash('ok', plural(pend.length,'treino confirmado','treinos confirmados')+'.');
  render();
}
function validarAtivSilenciosa(mid,p){
  const m=S.members.find(x=>x.id===mid);
  const s=(m.desportos||[]).find(x=>x.id===p.sid);
  S.regAtiv=(S.regAtiv||[]).filter(r=>!(r.estado==='agendada'&&r.d===p.d&&r.mid===mid&&r.plano===p.sid));
  registarAtividade({d:p.d, s:s? s.s : (p.s.s||p.s), min:p.min, i:s? s.i : 'moderado',
    v:s? s.v : undefined, plano:p.sid}, [mid], 'feita');
}

function abrirValAtiv(chave){ S.ui.valAberto = S.ui.valAberto===chave? null : chave; saveMeta(); render(); }

/* ---- Cartão de registo ---- */

  const kcalHoje=Math.round(hojeFeitas.reduce((t,r)=>t+kcalRegAtiv(r),0));
  if(!aberto) return `<div class="card ${destaque?'card--capa energia':''}" id="fa-cartao">

    <h2 style="margin-top:2px">Registar atividade física</h2>
    <p class="sub" style="margin-top:4px">${hojeFeitas.length
      ? plural(hojeFeitas.length,'atividade registada hoje','atividades registadas hoje')+' · '+kcalHoje+' kcal'
      : 'Ainda nada registado hoje. O que se regista entra logo no gasto do dia, no alvo de calorias e nos objetivos.'}</p>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="abrirFormAtiv('${m.id}')">+ Registar atividade</button>
      ${planeadasNoDia(m,hojeISO()).filter(p=>!(S.regAtiv||[]).some(r=>r.mid===m.id&&r.d===hojeISO()&&r.plano===p.s.id&&r.estado!=='agendada'))
        .slice(0,2).map(p=>`<button class="chip" onclick="validarAtivFeita('${m.id}','${hojeISO()}','${p.s.id}')">✓ ${esc(SPORT[p.s.s].nome)} de hoje</button>`).join('')}
    </div>
  </div>`;
  const sp=SPORT[f.s];
  const kcalPrev=Math.round(metDoForm(f)*pesoNaData(m.id,f.d)*f.min/60);
  return `<div class="card card--capa energia" id="fa-cartao">
    <span class="lbl">${f.editar?'Editar registo':'Registo'}</span>
    <h2 style="margin-top:2px">${f.editar?'Editar atividade':'Registar atividade física'}</h2>
    <div class="frow" style="margin-top:10px">
      <div><label class="lbl">Dia</label><input type="date" value="${f.d}" max="${hojeISO()}"
        aria-label="Dia da atividade" onchange="setFormAtiv('d',this.value)"></div>
      <div><label class="lbl">Modalidade</label><select aria-label="Modalidade" onchange="setFormAtiv('s',this.value)">${opcoesDesporto(f.s)}</select></div>
    </div>
    ${sp.dist? `<div class="frow">
      <div><label class="lbl">Distância km</label><input type="number" min="0.1" step="0.1" value="${nPT(f.km,1).replace(',','.')}"
        aria-label="Distância em quilómetros" onchange="setFormAtiv('km',this.value)"></div>
      <div><label class="lbl">Velocidade km/h</label><input type="number" min="${sp.dist.vmin}" max="${sp.dist.vmax}" step="${sp.dist.vStep}"
        value="${f.v}" aria-label="Velocidade média" onchange="setFormAtiv('v',this.value)"></div>
      <div><label class="lbl">Tempo min</label><input type="number" min="1" step="1" value="${f.min}"
        aria-label="Duração em minutos" onchange="setFormAtiv('min',this.value)"></div>
    </div>`
    : `<div class="frow">
      <div><label class="lbl">Tempo min</label><input type="number" min="1" step="1" value="${f.min}"
        aria-label="Duração em minutos" onchange="setFormAtiv('min',this.value)"></div>
      <div><label class="lbl">Intensidade</label><select aria-label="Intensidade" onchange="setFormAtiv('i',this.value)">${NIVEIS.map(([k],ni)=>
        `<option value="${k}" ${nivelIndice(f.i)===ni?'selected':''}>${rotuloNivel(sp,ni)}</option>`).join('')}</select></div>
    </div>`}
    ${S.members.length>1 && !f.editar? `<div style="margin-top:12px">
      <label class="lbl">Quem fez ${dica('partilhada')}</label>
      <div class="row">${S.members.map(x=>`<button class="chip ${f.mids.indexOf(x.id)>=0?'on':''}"
        onclick="toggleFormAtivMembro('${x.id}')">${avatar(x,20)} ${esc(x.nome.split(' ')[0])}</button>`).join('')}</div>
      ${f.mids.length>1? `<p class="sub" style="margin-top:6px">Fica registada para ${f.mids.length} pessoas com o mesmo tempo e a mesma intensidade. Depois, no histórico, cada uma pode ajustar o que fez de facto — quem foi mais devagar não gastou o mesmo.</p>`:''}
    </div>`:''}
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <span class="pill">${kcalPrev} kcal${f.mids.length>1? ' cada':''}</span>
      <div class="row">
        <button class="btn ghost small" onclick="fecharFormAtiv()">Cancelar</button>
        <button class="btn" onclick="guardarFormAtiv()">${f.editar?'Guardar alterações':'Registar'}</button>

}
function metDoForm(f){
  const sp=SPORT[f.s]; if(!sp) return 0;
  return sp.dist? metPorVelocidade(sp.dist.curva, clampNum(f.v,sp.dist.vmin,sp.dist.vmax))
    : sp.mets[nivelIndice(f.i)];
}

/* ---- Gráfico de atividade passada ---- */
/* Barras por dia com o que foi mesmo feito, e a linha tracejada do que o plano
   marcava. A distância entre as duas é a única coisa que interessa ver aqui. */
function graficoAtivSvg(m,dias){
  const h=hojeISO(), W=340, H=110, X0=8, X1=332;
  const barras=[];
  for(let i=dias-1;i>=0;i--){
    const d=addDias(h,-i);
    const feito=regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita').reduce((t,r)=>t+kcalRegAtiv(r),0);
    const prev=planeadasNoDia(m,d).reduce((t,p)=>t+p.kcal,0);
    barras.push({d,feito,prev});
  }
  const max=Math.max(1,...barras.map(b=>Math.max(b.feito,b.prev)))*1.1;
  const bw=(X1-X0)/barras.length;
  const Y=v=>H-6-(v/max)*(H-24);
  const linhaPrev=barras.map((b,i)=>(X0+bw*i+bw/2).toFixed(1)+','+Y(b.prev).toFixed(1)).join(' ');
  return `<svg class="svgfx" viewBox="0 0 ${W} ${H+16}" role="img"
      aria-label="Calorias gastas em atividade nos últimos ${dias} dias, comparadas com o plano">
    ${barras.map((b,i)=>{ const x=X0+bw*i+bw*0.15, w=Math.max(1.5,bw*0.7);
      return `<rect x="${x.toFixed(1)}" y="${Y(b.feito).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(0,H-6-Y(b.feito)).toFixed(1)}" rx="1.5" class="f-energy"
        fill-opacity="${b.d===h?1:0.8}"><title>${rotuloData(b.d)}: ${Math.round(b.feito)} kcal (plano ${Math.round(b.prev)})</title></rect>`;}).join('')}
    <polyline points="${linhaPrev}" fill="none" class="s-ink" stroke-width="1.4" stroke-dasharray="3 3" opacity=".65"/>
    <line x1="${X0}" y1="${H-6}" x2="${X1}" y2="${H-6}" class="s-line"/>
    <text x="${X0}" y="${H+10}" font-size="9.5" class="f-mut">${fmtShort(barras[0].d)}</text>
    <text x="${X1}" y="${H+10}" font-size="9.5" text-anchor="end" class="f-mut">hoje</text>
    <text x="${X0}" y="10" font-size="9.5" class="f-mut">${Math.round(max)} kcal</text>
  </svg>`;
}
function resumoAtiv(m,dias){
  const h=hojeISO();
  let feito=0, prev=0, sessoes=0, minutos=0;
  for(let i=0;i<dias;i++){ const d=addDias(h,-i);
    regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita').forEach(r=>{ feito+=kcalRegAtiv(r); sessoes++; minutos+=parseFloat(r.min)||0; });
    prev+=planeadasNoDia(m,d).reduce((t,p)=>t+p.kcal,0);
  }
  return {feito:Math.round(feito), prev:Math.round(prev), sessoes, minutos:Math.round(minutos),
    cumprimento: prev>0? Math.round(feito/prev*100) : null};
}
function cartaoGraficoAtiv(m){
  const r=resumoAtiv(m,30);
  if(!regAtivDe(m.id).length) return `<div class="card" data-col="atv-historico">
    <h2>Atividade passada</h2>
    ${estadoVazio('grafico','Ainda sem histórico de treinos',
      'Assim que registares a primeira atividade, aparece aqui o gráfico dos últimos 30 dias com o que fizeste ao lado do que o plano marcava.',
      `<button class="btn" onclick="abrirFormAtiv('${m.id}')">+ Registar a primeira</button>`)}
  </div>`;
  return `<div class="card" data-col="atv-historico">
    <div class="row" style="justify-content:space-between">
      <h2>Atividade passada — 30 dias</h2>
      <button class="chip" onclick="abrirHistAtiv('${m.id}')">Ver histórico completo →</button></div>
    ${graficoAtivSvg(m,30)}
    <div class="mleg"><span><i class="dot" style="background:var(--energy)"></i>Feito</span>
      <span><i class="dot" style="background:var(--ink);opacity:.6"></i>Plano</span></div>
    <div class="row" style="margin-top:12px">
      <div class="stat"><b>${r.sessoes}</b><span>Sessões</span></div>
      <div class="stat"><b>${hmm(r.minutos/60)}</b><span>Tempo</span></div>
      <div class="stat" style="background:var(--energy-soft)"><b style="color:var(--energy)">${r.feito}</b><span>kcal feitas</span></div>
      <div class="stat"><b>${r.prev}</b><span>kcal do plano</span></div>
      ${r.cumprimento!==null? `<div class="stat" style="background:${r.cumprimento>=90?'var(--accent-soft)':'var(--bg)'}"><b style="color:${r.cumprimento>=90?'var(--ok)':r.cumprimento>=60?'var(--warn)':'var(--bad)'}">${r.cumprimento}%</b><span>Do plano</span></div>`:''}
    </div>
    ${r.cumprimento!==null&&r.cumprimento<60? `<div class="msg warn-msg" style="margin-top:10px">Nos últimos 30 dias fez-se pouco mais de metade do que o plano marcava. Ou o plano é ambicioso a mais, ou os dias escolhidos não são os melhores — vale a pena ajustá-lo em vez de o arrastar.</div>`:''}
  </div>`;
}
function abrirHistAtiv(mid){ S.ui.histAtiv=mid; S.ui.mid=mid; saveMeta(); render(); window.scrollTo(0,0); }
function fecharHistAtiv(){ S.ui.histAtiv=null; saveMeta(); render(); }

/* ---- Histórico completo ---- */
function renderHistAtiv(){
  const m=S.members.find(x=>x.id===S.ui.histAtiv);
  if(!m){ S.ui.histAtiv=null; return renderAtividade(); }
  const regs=regAtivDe(m.id).slice().sort(porData);
  const feitas=regs.filter(r=>r.estado==='feita');
  const porDia={};
  regs.forEach(r=>{ (porDia[r.d]=porDia[r.d]||[]).push(r); });
  const dias=Object.keys(porDia).sort().reverse();
  const total=feitas.reduce((t,r)=>t+kcalRegAtiv(r),0);
  const minutos=feitas.reduce((t,r)=>t+(parseFloat(r.min)||0),0);
  const porDesporto={};
  feitas.forEach(r=>{ porDesporto[r.s]=(porDesporto[r.s]||0)+kcalRegAtiv(r); });
  const topo=Object.entries(porDesporto).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxT=topo.length? topo[0][1] : 1;
  return `<div class="row" style="margin-bottom:12px">
      <button class="btn ghost small" onclick="fecharHistAtiv()">← Voltar à Atividade Física</button></div>
    <div class="card card--capa">
      <span class="lbl">Histórico de ${esc(m.nome)}</span>
      <h2 style="margin-top:2px">${plural(feitas.length,'atividade registada','atividades registadas')}</h2>
      <div class="row" style="margin-top:12px">
        <div class="stat"><b>${hmm(minutos/60)}</b><span>Tempo total</span></div>
        <div class="stat" style="background:var(--energy-soft)"><b style="color:var(--energy)">${Math.round(total)}</b><span>kcal no total</span></div>
        <div class="stat"><b>${regs.filter(r=>r.estado==='falhada').length}</b><span>Falhados</span></div>
        <div class="stat"><b>${dias.length}</b><span>Dias com registo</span></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="abrirFormAtiv('${m.id}')">+ Acrescentar ao registo</button>
      </div>
    </div>
    ${formAtiv()&&formAtiv().mid===m.id? cartaoRegistarAtiv(m,true) : ''}
    ${feitas.length? `<div class="grid g2" style="margin-top:16px">
      <div class="card">
        <h3>Últimos 90 dias</h3>
        ${graficoAtivSvg(m,90)}
        <p class="sub" style="margin-top:6px">Barras: o que ficou registado. Tracejado: o que o plano marcava para cada dia.</p>
      </div>
      <div class="card">
        <h3>Onde foi o esforço</h3>
        ${topo.map(([sid,k])=>`<div style="margin-top:8px">
          <div class="splabel"><span>${esc(SPORT[sid]?SPORT[sid].nome:sid)}</span><output>${Math.round(k)} kcal</output></div>
          <div class="mbar" style="height:9px"><div style="width:${(k/maxT*100).toFixed(1)}%;background:var(--energy)"></div></div>
        </div>`).join('')}
      </div>
    </div>`:''}
    <div class="card" style="margin-top:16px">
      <h3>Fita do tempo</h3>
      <p class="sub" style="margin-top:4px">Tudo o que está registado, do mais recente para trás. Cada linha pode ser editada ou apagada — e as contas do gasto, do alvo de calorias e dos objetivos acertam-se logo a seguir.</p>
      ${!dias.length? estadoVazio('grafico','Nada registado ainda','Regista a primeira atividade e ela aparece aqui.','')
      : `<div class="fita">${dias.map(d=>{
        const lista=porDia[d];
        const k=Math.round(lista.filter(r=>r.estado==='feita').reduce((t,r)=>t+kcalRegAtiv(r),0));
        return `<div class="fita-dia ${lista.some(r=>r.estado==='feita')?'':'vazio'}">
          <div class="fita-data">${fmtLongo(d)} <span class="sub">· ${nomeDiaCurto(d)}${k?' · '+k+' kcal':''}</span></div>
          ${lista.map(r=>linhaRegAtiv(m,r)).join('')}
        </div>`;}).join('')}</div>`}
    </div>`;
}
function linhaRegAtiv(m,r){
  const sp=SPORT[r.s];
  const irm=irmaosDe(S.regAtiv,r);
  const nomes=irm.map(x=>{ const mm=S.members.find(y=>y.id===x.mid); return mm? mm.nome.split(' ')[0] : null; }).filter(Boolean);
  const et=r.estado==='feita'? '' : r.estado==='falhada'? '<span class="pill bad">não feito</span>' : '<span class="pill warn">remarcado</span>';
  return `<div class="reg-linha">
    <div class="rl-corpo">
      <b>${esc(sp? sp.nome : r.s)}</b> ${et}
      <span class="sub" style="display:block">${r.min} min${sp&&sp.dist&&r.km? ' · '+nPT(r.km,1)+' km · '+nPT(r.v,1)+' km/h':''}${r.estado==='feita'? ' · '+Math.round(kcalRegAtiv(r))+' kcal':''}${r.plano?' · do plano':' · extra'}${nomes.length? ' · com '+nomes.join(', '):''}</span>
    </div>
    <div class="reg-acoes">
      ${r.estado!=='falhada'? `<button class="btn ghost small" aria-label="Editar ${esc(sp?sp.nome:r.s)} de ${fmtShort(r.d)}"
        onclick="abrirFormAtiv('${m.id}',{editar:'${r.id}',d:'${r.d}',s:'${r.s}',min:${r.min},i:'${r.i||'moderado'}',v:${r.v||'null'},km:${r.km||'null'},plano:${r.plano?"'"+r.plano+"'":'null'}})">✎</button>`:''}
      <button class="btn danger small" aria-label="Apagar ${esc(sp?sp.nome:r.s)} de ${fmtShort(r.d)}" onclick="apagarRegAtiv('${r.id}')">✕</button>
    </div>
  </div>`;
}

/* ================= ATIVIDADES PARTILHADAS =================
   Duas pessoas da casa que já têm o mesmo desporto no plano e querem o peso a
   ir para o mesmo lado estão a treinar sozinhas por falta de combinação, não
   por falta de vontade. A app junta-as — e adapta o tempo e a intensidade de
   cada uma ao que o plano de cada uma já dizia, porque correr juntos não é
   correr ao mesmo ritmo. */
function direcaoObjetivo(m){ const p=objetivoPct(m); return p<=-3? 'perder' : p>=3? 'ganhar' : 'manter'; }
function sugestoesPartilhaAtiv(){
  const out=[];
  const elegiveis=S.members.filter(m=>faseDe(m)!=='bebe' && (m.desportos||[]).length);
  elegiveis.forEach((a,ia)=>elegiveis.slice(ia+1).forEach(b=>{
    if(direcaoObjetivo(a)!==direcaoObjetivo(b)) return;
    (a.desportos||[]).forEach(sa=>{
      const sb=(b.desportos||[]).find(x=>x.s===sa.s); if(!sb) return;
      const La=limitesEsforco(a), Lb=limitesEsforco(b);
      if(La.evitar.indexOf(sa.s)>=0 || Lb.evitar.indexOf(sa.s)>=0) return;
      const comuns=diasPlano(sa).filter(d=>diasPlano(sb).indexOf(d)>=0);
      const dia=comuns.length? comuns[0] : diasPlano(sa)[0];
      out.push({sid:sa.s, membros:[a,b], planos:[sa,sb], dia, comum:!!comuns.length});
    });
  }));
  /* junta pares que são afinal o mesmo grupo: se três pessoas correm, a
     sugestão é correrem os três, não três pares a correr aos bocados */
  const juntos={};
  out.forEach(o=>{ const k=o.sid+'|'+o.dia;
    if(!juntos[k]) juntos[k]={sid:o.sid, dia:o.dia, comum:o.comum, membros:[], planos:[]};
    o.membros.forEach((m,i)=>{ if(!juntos[k].membros.some(x=>x.id===m.id)){ juntos[k].membros.push(m); juntos[k].planos.push(o.planos[i]); } });
    juntos[k].comum=juntos[k].comum||o.comum;
  });
  return Object.values(juntos).sort((a,b)=> b.membros.length-a.membros.length || (a.comum===b.comum?0:a.comum?-1:1));
}
function cartaoPartilhaAtiv(){
  const sug=sugestoesPartilhaAtiv();
  if(!sug.length) return '';
  return `<div class="card" data-col="atv-partilha" id="atv-partilha">
    <h2>Para fazer em conjunto ${dica('partilhada')}</h2>
    <p class="sub" style="margin-top:4px">Modalidades que mais do que uma pessoa cá de casa já tem no plano, com o objetivo a apontar para o mesmo lado. Cada um mantém o seu tempo e a sua intensidade — o que se partilha é a hora e o caminho.</p>
    ${sug.slice(0,4).map(g=>{
      const sp=SPORT[g.sid];
      return `<div class="val-item">
        <div class="row" style="justify-content:space-between;gap:8px">
          <div style="min-width:0">
            <b>${esc(sp.nome)}</b> <span class="sub">· ${g.comum? NOME_DIAS[g.dia]+', dia que já é comum aos dois planos' : 'sem dia comum — '+NOME_DIAS[g.dia]+' serve'}</span>
            <div class="row" style="margin-top:6px">${g.membros.map((m,i)=>{
              const s=g.planos[i], min=Math.round(minutosSessao(s));
              const met=metDe(s);
              return `<span class="chip">${avatar(m,18)} ${esc(m.nome.split(' ')[0])} · ${min} min · ${nPT(met,1)} MET</span>`;}).join('')}</div>
            ${(()=>{ const mins=g.planos.map(s=>Math.round(minutosSessao(s)));
              const mets=g.planos.map(s=>metDe(s));
              const difT=Math.max(...mins)-Math.min(...mins), difI=Math.max(...mets)-Math.min(...mets);
              return (difT>=5||difI>=0.5)? `<p class="sub" style="margin-top:6px">Saem juntos e cada um faz o seu: ${g.membros.map((m,i)=>nomeCurto(m)+' '+mins[i]+' min').join(', ')}. Quem acabar primeiro espera, e ninguém treina fora da sua condição.</p>`:''; })()}
          </div>
          <button class="btn small" style="flex:none" onclick="registarPartilhaAtiv('${g.sid}',${g.dia})">Registar em conjunto</button>
        </div>
      </div>`;}).join('')}
  </div>`;
}
function registarPartilhaAtiv(sid,dia){
  const g=sugestoesPartilhaAtiv().find(x=>x.sid===sid&&x.dia===dia);
  if(!g) return;
  const f={mid:g.membros[0].id, editar:null, d:hojeISO(), s:sid,
    min:Math.round(minutosSessao(g.planos[0])), i:g.planos[0].i||'moderado', plano:null,
    mids:g.membros.map(m=>m.id)};
  const sp=SPORT[sid];
  if(sp.dist){ f.v=g.planos[0].v||sp.dist.vdef; f.km=Math.round(f.v*f.min/60*10)/10; }
  S.ui.formAtiv=f; saveMeta(); render();
  setTimeout(()=>{ const el=document.getElementById('fa-cartao'); if(el) scrollSuave(el); },0);
}

/* A semana que vem aí, lida do plano: sete dias com o que está marcado, mais
   o que foi remarcado para a frente. É o lado futuro da mesma moeda de que o
   gráfico da atividade passada é o lado de trás. */
function cartaoProximosTreinos(m){
  if(!(m.desportos||[]).length) return '';
  const h=hojeISO();
  const dias=[];
  for(let i=0;i<7;i++){
    const d=addDias(h,i);
    const plano=planeadasNoDia(m,d);
    const extra=agendadasFuturas(m.id).filter(r=>r.d===d);
    dias.push({d, plano, extra});
  }
  const totalSemana=dias.reduce((t,x)=>t+x.plano.reduce((u,p)=>u+p.kcal,0)
    +x.extra.reduce((u,r)=>u+kcalRegAtiv(r),0),0);
  return `<div class="card" data-col="atv-proximos">
    <div class="row" style="justify-content:space-between">
      <div><span class="lbl">Próximos sete dias</span><h3 style="margin-top:2px">O que está marcado</h3></div>
      <span class="pill">${Math.round(totalSemana)} kcal na semana</span></div>
    <div class="grid gdias" style="margin-top:10px">${dias.map(x=>{
      const n=x.plano.length+x.extra.length;
      return `<div class="val-item" style="margin-top:0;${x.d===h?'border-color:var(--accent)':''}">
        <div class="fita-data">${x.d===h? 'Hoje' : nomeDiaCurto(x.d)} <span class="sub">${fmtShort(x.d)}</span></div>
        ${n? x.plano.map(p=>`<div class="sub" style="margin-top:4px">${esc(SPORT[p.s.s].nome)} · ${p.min} min</div>`).join('')
             +x.extra.map(r=>`<div class="sub" style="margin-top:4px">${esc(SPORT[r.s]?SPORT[r.s].nome:r.s)} · ${r.min} min · <span style="color:var(--warn)">remarcado</span></div>`).join('')
          : `<div class="sub" style="margin-top:4px;font-style:italic">descanso</div>`}
      </div>`;}).join('')}</div>
    <p class="sub" style="margin-top:10px">Os dias saem do plano aqui em baixo — cada desporto diz em que dias acontece, e o tempo de cada sessão é o volume semanal dividido por eles.</p>
  </div>`;
}

        o nível pelo teste da conversa — <b>leve</b> se falas à vontade, <b>moderado</b> se falas com a respiração
