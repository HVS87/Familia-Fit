/* ================= NUTRIÇÃO ================= */
/* Mudar de filtro recomeça a contagem do lote: se se estava na terceira
   fornada de peixe e se salta para vegan, o utilizador quer o princípio. */
function setCuis(v){ S.ui.cuis=(v==='todas'||temChave(CUIS,v))? v:'todas'; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }
function setDietaF(v){ S.ui.dietaF=(v==='todas'||temChave(DIETS,v))? v:'todas'; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }
function setAlergF(v){ S.ui.alergF=ehAlergenio(v)? v:''; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }
function limparFiltros(){ S.ui.cuis='todas'; S.ui.dietaF='todas'; S.ui.mealF='todas'; S.ui.busca='';
  S.ui.alergF=''; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }
/* Pesquisa por nome: sem acentos e sem maiúsculas dos dois lados, porque
   ninguém escreve «Bacalhau à Brás» com o à certo numa caixa de pesquisa. E
   procura também nos ingredientes — «quem tem couve na despensa» é uma
   pergunta tão legítima como «onde está a receita do polvo». */
function semAcentos(s){
  return String(s||'').normalize? String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    : String(s||'').toLowerCase();
}
function correspondeBusca(r,q){
  if(!q) return true;
  if(semAcentos(r.n).indexOf(q)>=0) return true;
  return r.i.some(x=>semAcentos(x[0]).indexOf(q)>=0);
}
/* Trezentas e tal receitas de uma vez são um quarto de segundo de trabalho
   para mostrar cartões que ninguém percorre até ao fim. Mostram-se aos lotes,
   e o lote cresce a pedido. Com pesquisa ativa não há limite: quem procura
   quer ver tudo o que corresponde, e a busca já estreita a lista. */
const LOTE_RECEITAS=48;
function maisReceitas(){ S.ui.recLimite=(S.ui.recLimite||LOTE_RECEITAS)+LOTE_RECEITAS; saveMeta(); render(); }
/* A escrever não se redesenha a página: filtra-se a grelha que já está no
   ecrã, para o cursor não saltar da caixa a cada tecla. Só há um redesenho —
   o da primeira tecla, quando é preciso trazer as receitas que o lote deixou
   de fora — e mesmo esse repõe o foco e a posição do cursor. */
function setBusca(v,el){
  S.ui.busca=String(v||'').slice(0,60);
  saveMeta();
  const q=semAcentos(S.ui.busca).trim();
  if(!!q !== !!S.ui.recTodas){
    const pos=el? el.selectionStart : null;
    render();
    const novo=document.getElementById('rec-busca');
    if(novo){ novo.focus(); if(pos!=null){ try{ novo.setSelectionRange(pos,pos); }catch(e){} } }
    return;
  }
  const grelha=document.getElementById('rec-grelha');
  if(!grelha){ render(); return; }
  let visiveis=0;
  grelha.querySelectorAll('.rc[data-rid]').forEach(c=>{
    const r=RECIPES.find(x=>x.id===c.getAttribute('data-rid'));
    const mostra=!!r && correspondeBusca(r,q);
    c.style.display=mostra? '':'none';
    if(mostra) visiveis++;
  });
  põe('rec-conta', visiveis+' de '+RECIPES.length+' receitas');
  const vazio=document.getElementById('rec-vazio');
  if(vazio) vazio.style.display=visiveis? 'none':'';
}
function setMealF(v){ S.ui.mealF=(v==='todas'||v==='ac'||MEALK.indexOf(v)>=0)? v:'todas'; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }
function toggleComp(){ S.ui.soComp=!S.ui.soComp; saveMeta(); render(); }
function toggleEpoca(){ S.ui.soEpoca=!S.ui.soEpoca; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }
function setCatF(k){ S.ui.catF=temChave(CATEG,k)? k:''; S.ui.recLimite=LOTE_RECEITAS; saveMeta(); render(); }

function macroBar(pct){ return `<div class="mbar">
    <div id="nu-bar-c" style="width:${pct.c}%;background:var(--mc)"></div>
    <div id="nu-bar-p" style="width:${pct.p}%;background:var(--mp)"></div>
    <div id="nu-bar-f" style="width:${pct.f}%;background:var(--mf)"></div></div>
  <div class="mleg"><span><i class="dot" style="background:var(--mc)"></i><span id="nu-leg-c">Hidratos ${pct.c}%</span></span>
    <span><i class="dot" style="background:var(--mp)"></i><span id="nu-leg-p">Proteína ${pct.p}%</span></span>
    <span><i class="dot" style="background:var(--mf)"></i><span id="nu-leg-f">Gordura ${pct.f}%</span></span></div>`; }

/* O que uma pessoa não come vale tanto como a dieta que faz: filtra as mesmas
   receitas e entra nas mesmas contas. Fica ao lado do tipo de dieta porque é
   a mesma decisão vista de outro lado — uma diz o que se procura, a outra diz
   o que não entra em casa. */

/* ================= RECEITAS DA CASA =================
   Uma receita escrita por quem usa a app é uma receita como as outras: entra
   nas sugestões, no plano, na despensa e na lista de compras pela mesma
   porta. A diferença é que os macros não vêm escritos — saem dos ingredientes
   e do número de doses, pela mesma função que recalcula a biblioteca inteira.

   Os ingredientes só podem sair do catálogo. Não é uma limitação por
   preguiça: é o que garante que o nome bate certo, byte a byte, com a
   despensa e com a lista de compras, e que existe composição para calcular. */
/* A unidade de cada ingrediente vem primeiro do que as receitas da biblioteca
   já usam — é o que garante que a lista de compras soma peras com peras — e
   só depois da tabela de composição, para os ingredientes que ainda não
   apareceram em receita nenhuma. */
const UNID_ING={};
RECIPES.forEach(r=>r.i.forEach(([n,q,u])=>{ if(!temChave(UNID_ING,n)) UNID_ING[n]=u; }));
function unidadeDe(nome){
  if(temChave(UNID_ING,nome)) return UNID_ING[nome];
  return (temChave(NUTRI,nome) && NUTRI[nome].u)? NUTRI[nome].u : 'g';
}

function limparReceita(x){
  x=x||{};
  const coz=temChave(CUIS,x.coz)? x.coz : 'portuguesa';
  /* «Acompanhamento» é exclusivo: quem é acompanhamento não é prato, senão
     aparecia nas duas listas e podia ir a acompanhar-se a si próprio. */
  const bruto=Array.isArray(x.mt)? x.mt.filter((k,i,a)=>(MEALK.indexOf(k)>=0||k==='ac')&&a.indexOf(k)===i) : [];
  const mt=bruto.indexOf('ac')>=0? ['ac'] : bruto;
  const cat=catalogoIngredientes();
  const i=(Array.isArray(x.i)? x.i : [])
    .filter(l=>Array.isArray(l)&&cat.indexOf(l[0])>=0&&(parseFloat(l[1])||0)>0)
    .map(l=>[l[0], Math.round((parseFloat(l[1])||0)*100)/100, unidadeDe(l[0])])
    .slice(0,40);
  if(!i.length) return null;
  return {id:'u_'+limparId(String(x.id||'').replace(/^u_/,'')),
    n:String(x.n||'Receita sem nome').slice(0,80),
    coz, mt: mt.length? mt : ['a','j'],
    doses: clampNum(Math.round(parseFloat(x.doses)||1),1,12), i};
}
/* A biblioteca é uma só: as receitas da casa são acrescentadas ao mesmo array
   que todo o resto lê. Sincronizar é tirar as antigas e voltar a pô-las com
   os macros e os atributos recalculados — nunca há duas versões da mesma. */
function sincronizaReceitas(){
  for(let i=RECIPES.length-1;i>=0;i--) if(RECIPES[i].u) RECIPES.splice(i,1);
  if(!Array.isArray(S.receitas)) S.receitas=[];
  S.receitas.forEach(x=>{
    const m=macrosDeIngredientes(x.i,x.doses);
    const r={id:x.id, n:x.n, coz:x.coz, d:[], k:m.k, c:Math.round(m.c), p:Math.round(m.p),
      f:Math.round(m.f), fib:Math.round(m.fib), i:x.i.map(l=>[l[0], Math.round(l[1]/Math.max(1,x.doses)*100)/100, l[2]]),
      mt:x.mt, u:true, doses:x.doses};
    const s=[]; r.i.forEach(l=>atributosIng(l[0]).forEach(t=>{ if(s.indexOf(t)<0) s.push(t); }));
    r.at=s;
    /* nada se declara numa receita da casa: vegetariana, vegan e paleo saem
       do que ela leva dentro, dentro de dietasDaReceita, tal como na
       biblioteca — não há aqui duas regras diferentes */
    r.dc=dietasDaReceita(r);
    RECIPES.push(r);
  });
}
function receitaPorId(id){ return RECIPES.find(r=>r.id===id); }

/* ---- Editor ---- */
function edCfg(){
  if(!S.ui.editor||typeof S.ui.editor!=='object') S.ui.editor=null;
  return S.ui.editor;
}
function abrirEditor(rid){
  const base=rid? receitaPorId(rid) : null;
  if(base && base.u){
    const orig=S.receitas.find(x=>x.id===base.id);
    S.ui.editor={id:base.id, n:base.n, coz:base.coz, mt:base.mt.slice(), doses:orig? orig.doses:1,
      i:(orig? orig.i : base.i).map(l=>l.slice())};
  } else if(base){
    /* uma receita da biblioteca copia-se para editar: o original fica intacto
       para quem quiser voltar a ele, e a cópia é da casa */
    S.ui.editor={id:null, n:base.n+' (a meu gosto)', coz:base.coz, mt:base.mt.slice(), doses:1,
      i:base.i.map(l=>l.slice())};
  } else {
    S.ui.editor={id:null, n:'', coz:'portuguesa', mt:['a','j'], doses:2, i:[]};
  }
  S.ui.tab='receitas'; saveMeta(); render();
  const el=document.getElementById('editor'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function fecharEditor(){ S.ui.editor=null; saveMeta(); render(); }
function edSet(campo,valor){
  const e=edCfg(); if(!e) return;
  if(campo==='n') e.n=String(valor).slice(0,80);
  else if(campo==='coz') e.coz=temChave(CUIS,valor)? valor : e.coz;
  else if(campo==='doses') e.doses=clampNum(Math.round(parseFloat(valor)||1),1,12);
  saveMeta();
  if(campo==='doses') atualizarEditor();
}
function edToggleRef(k){
  const e=edCfg(); if(!e||(MEALK.indexOf(k)<0&&k!=='ac')) return;
  const i=e.mt.indexOf(k);
  if(i>=0) e.mt.splice(i,1);
  /* marcar acompanhamento tira as refeições, e marcar uma refeição tira o
     acompanhamento — as duas coisas excluem-se */
  else if(k==='ac') e.mt=['ac'];
  else e.mt=e.mt.filter(x=>x!=='ac').concat(k);
  saveMeta(); render();
}
function edAddIng(){
  const e=edCfg(); if(!e||e.i.length>=40) return;
  const cat=catalogoIngredientes();
  const nome=cat.find(n=>!e.i.some(l=>l[0]===n))||cat[0];
  e.i.push([nome, unidadeDe(nome)==='un'?1:100, unidadeDe(nome)]);
  saveMeta(); render();
}
function edDelIng(idx){ const e=edCfg(); if(!e) return; e.i.splice(idx,1); saveMeta(); render(); }
function edSetIng(idx,campo,valor){
  const e=edCfg(); if(!e||!e.i[idx]) return;
  if(campo==='nome'){
    if(catalogoIngredientes().indexOf(valor)<0) return;
    e.i[idx][0]=valor; e.i[idx][2]=unidadeDe(valor);
    saveMeta(); render(); return;
  }
  e.i[idx][1]=Math.max(0,Math.round((parseFloat(valor)||0)*100)/100);
  saveMeta(); atualizarEditor();
}
/* O painel de macros muda a cada tecla, mas o resto do editor não: escrever
   uma quantidade não pode redesenhar a página por baixo do dedo. */
function atualizarEditor(){
  const alvo=document.getElementById('ed-macros'); if(!alvo) return;
  alvo.innerHTML=painelMacrosEditor();
}
function edValido(){
  const e=edCfg(); if(!e) return null;
  if(!e.n.trim()) return 'Falta o nome da receita.';
  if(!e.i.length) return 'Uma receita precisa de pelo menos um ingrediente.';
  if(e.i.some(l=>!(l[1]>0))) return 'Há ingredientes com quantidade a zero.';
  if(!e.mt.length) return 'Escolhe pelo menos uma refeição onde esta receita encaixa.';
  return null;
}
function guardarReceita(){
  const e=edCfg(); if(!e) return;
  const erro=edValido();
  if(erro){ flash('bad',erro); return; }
  if(!Array.isArray(S.receitas)) S.receitas=[];
  const limpa=limparReceita({id:e.id||uid(), n:e.n.trim(), coz:e.coz, mt:e.mt, doses:e.doses, i:e.i});
  if(!limpa){ flash('bad','Não foi possível guardar: os ingredientes não são válidos.'); return; }
  const idx=e.id? S.receitas.findIndex(x=>x.id===e.id) : -1;
  if(idx>=0) S.receitas[idx]=limpa; else S.receitas.push(limpa);
  sincronizaReceitas();
  S.ui.editor=null;
  save(idx>=0? 'edição da receita '+limpa.n : 'nova receita '+limpa.n);
  flash('ok',(idx>=0?'Receita atualizada: ':'Receita guardada: ')+limpa.n+' — '+receitaPorId(limpa.id).k+' kcal por dose.');
}
function apagarReceita(id){
  const r=receitaPorId(id); if(!r) return;
  if(!confirm('Apagar a receita «'+r.n+'»? As refeições já planeadas com ela ficam por escolher.')) return;
  S.receitas=(S.receitas||[]).filter(x=>x.id!==id);
  /* uma receita apagada não pode continuar planeada: ficaria um id órfão que
     o plano lê como refeição vazia sem dizer porquê */
  Object.values(S.plans).forEach(w=>Object.values(w).forEach(d=>MEALK.forEach(k=>{
    if(!d[k]) return;
    if(d[k].r===id){ d[k].r=''; d[k].ac=[]; }
    else d[k].ac=acIds(d[k]).filter(x=>x!==id); })));
  sincronizaReceitas();
  if(S.ui.editor&&S.ui.editor.id===id) S.ui.editor=null;
  save('receita apagada'); render();
}
function painelMacrosEditor(){
  const e=edCfg(); if(!e) return '';
  const m=macrosDeIngredientes(e.i,e.doses);
  const total=macrosDeIngredientes(e.i,1);
  /* As etiquetas passam pela MESMA função que decide as da biblioteca. Ter
     duas contas paralelas dava previsões que não batiam certo com o que a
     receita mostrava depois de guardada. */
  const at=[]; e.i.forEach(l=>atributosIng(l[0]).forEach(t=>{ if(at.indexOf(t)<0) at.push(t); }));
  const provisoria={c:Math.round(m.c),p:Math.round(m.p),f:Math.round(m.f),fib:Math.round(m.fib),k:m.k,d:[],at};
  const liq=hcLiq(provisoria);
  const dietas=dietasDaReceita(provisoria).map(d=>DIETS[d]? DIETS[d].n : d);
  const pct=m.k>0? {c:Math.round(m.c*4/m.k*100), p:Math.round(m.p*4/m.k*100), f:Math.round(m.f*9/m.k*100)} : {c:0,p:0,f:0};
  return `<div class="row" style="justify-content:space-between;align-items:baseline">
      <b>Por dose</b><span class="kcal">${m.k} kcal</span></div>
    <div class="mbar" style="margin-top:6px">
      <div style="width:${pct.c}%;background:var(--mc)"></div>
      <div style="width:${pct.p}%;background:var(--mp)"></div>
      <div style="width:${pct.f}%;background:var(--mf)"></div></div>
    <div class="mleg"><span><i class="dot" style="background:var(--mc)"></i>Hidratos ${nPT(m.c,1)} g</span>
      <span><i class="dot" style="background:var(--mp)"></i>Proteína ${nPT(m.p,1)} g</span>
      <span><i class="dot" style="background:var(--mf)"></i>Gordura ${nPT(m.f,1)} g</span></div>
    <div class="sub" style="margin-top:6px">Fibra ${nPT(m.fib,1)} g · hidrato líquido ${nPT(liq,1)} g
      · receita inteira ${total.k} kcal para ${e.doses} dose${e.doses===1?'':'s'}</div>
    <div style="margin-top:6px">${dietas.length? dietas.map(d=>`<span class="tag">${d}</span>`).join('')
      : '<span class="sub">Sem etiquetas de dieta: serve quem come de tudo.</span>'}</div>
    ${m.semDados.length? `<p class="sub" style="color:var(--warn);margin-top:6px">⚠ Sem composição para: ${m.semDados.map(esc).join(', ')} — estes ingredientes não entram na conta.</p>`:''}`;
}

  return `<div class="card" id="editor" style="margin-bottom:16px;border-color:var(--accent)">
    <div class="row" style="justify-content:space-between">
      <h2>${e.id? '✏️ Editar receita' : '🍳 Nova receita'} ${dica('editorReceitas')}</h2>
      <button class="chip" onclick="fecharEditor()">Fechar</button>
    </div>
    <div class="frow">
      <div style="grid-column:span 2"><label class="lbl">Nome</label>

      <div><label class="lbl">Cozinha</label><select onchange="edSet('coz',this.value)">
        ${Object.entries(CUIS).map(([k,v])=>`<option value="${k}" ${e.coz===k?'selected':''}>${(ICO_COZ[k]||'')+' '+v}</option>`).join('')}</select></div>
      <div><label class="lbl">Doses que rende</label>

    </div>
    <div style="margin-top:12px"><label class="lbl">Encaixa em</label>
      <div class="row">${MEALS.concat([['ac','Acompanhamento']]).map(([k,rot])=>`<button class="chip ${e.mt.indexOf(k)>=0?'on':''}" onclick="edToggleRef('${k}')">${ICO_REF[k]||''} ${rot}</button>`).join('')}</div>
      ${e.mt.indexOf('ac')>=0? `<p class="sub" style="margin-top:6px">Vai ao lado do prato, ao almoço e ao jantar — não é uma refeição por si. Se lá estiver mais do que um acompanhamento, repartem a dose entre si.</p>`:''}
    </div>
    <div style="margin-top:14px">
      <div class="row" style="justify-content:space-between">
        <label class="lbl" style="margin:0">Ingredientes — quantidades da receita inteira</label>
        <button class="btn ghost small" onclick="edAddIng()">+ Ingrediente</button>
      </div>
      ${e.i.length? `<div class="ed-lista">${e.i.map((l,idx)=>`<div class="ed-linha">
        <select onchange="edSetIng(${idx},'nome',this.value)" aria-label="Ingrediente ${idx+1}">
          ${cat.map(n=>`<option value="${esc(n)}" ${l[0]===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
        <input type="number" min="0" step="${l[2]==='un'||l[2]==='dente'?'0.25':'5'}" value="${l[1]}"
          oninput="edSetIng(${idx},'q',this.value)" aria-label="Quantidade">

    <div class="card" id="ed-macros" style="margin-top:14px;background:var(--bg)">${painelMacrosEditor()}</div>
    <div class="row" style="margin-top:14px">

      <button class="chip" onclick="fecharEditor()">Cancelar</button>
      ${erro? `<span class="sub" style="color:var(--warn)">${erro}</span>`:''}
    </div>
  </div>`;
}

/* Alergias e exclusões são a mesma mecânica com pesos diferentes: uma alergia
   tem consequências de saúde, uma exclusão é uma escolha. Por isso vivem em
   sítios diferentes — as alergias no perfil, à vista de quem cria o membro; as
   exclusões ao lado da dieta — e falam com vozes diferentes. */
function grupoRestricoes(m,lista,alerta){
  const at=Array.isArray(m.restricoes)? m.restricoes : [];
  const implicitas=(DIETA_VETA[chaveDieta(m)]||[]).filter(k=>temChave(RESTR,k));
  return `<div class="row restr">
      ${lista.map(([k,nome,ico,desc])=>{
        const impl=implicitas.indexOf(k)>=0, on=at.indexOf(k)>=0||impl;
        return `<button class="chip ${on?'on':''} ${on&&alerta?'perigo':''}"
          ${impl?'disabled ':''}title="${esc(impl? 'Implícito na dieta '+dietaDe(m).n+'. ' : '')}${esc(desc||'')}"
          onclick="toggleRestricao('${m.id}','${k}')">${ico} ${nome}</button>`;}).join('')}
    </div>`;
}
function blocoAlergias(m){
  const at=(Array.isArray(m.restricoes)? m.restricoes : []).filter(ehAlergenio);
  const afetadas=RECIPES.filter(r=>r.at.some(t=>at.indexOf(t)>=0)).length;
  return `<div class="card card-alergia" data-col="alerg-${m.id}" style="margin-top:10px">
    <h3 class="lbl" style="margin:0">🚨 Alergias e intolerâncias ${dica('alergias')}</h3>
    ${grupoRestricoes(m,ALERGENIOS,true)}
    <p class="sub" style="margin-top:6px">${at.length
      ? '<b class="f-bad-txt">'+afetadas+' das '+RECIPES.length+' receitas contêm um destes alergénios</b> e deixam de ser sugeridas a '+esc(m.nome.split(' ')[0])+'. Isto ajuda a planear, mas não dispensa ler o rótulo de cada embalagem nem perguntar num restaurante.'
      : 'As catorze categorias de declaração obrigatória na União Europeia (anexo II do Regulamento 1169/2011). Marca as que se aplicam.'}</p>
  </div>`;
}
function blocoRestricoes(m){
  const afetadas=RECIPES.filter(r=>ingredientesVetados(r,m).length).length;
  return `<div style="margin-top:14px">
    <label class="lbl">Outras exclusões de ${esc(m.nome.split(' ')[0])} ${dica('restricoes')}</label>
    ${grupoRestricoes(m,EXCLUSOES,false)}
    <p class="sub" style="margin-top:6px">${afetadas? afetadas+' das '+RECIPES.length+' receitas deixam de ser sugeridas a esta pessoa, contando alergias e dieta.'
      : 'Sem exclusões: todas as '+RECIPES.length+' receitas continuam disponíveis.'}
      As alergias marcam-se no perfil, no separador <a href="#" onclick="go('familia');return false">Família</a>.</p>
  </div>`;
}
function setPorcoes(v){
  const n=parseInt(v,10);
  S.ui.porcoes=Number.isFinite(n)? clampNum(n,1,12) : null;
  saveMeta(); render();
}
function porcoesAtuais(){
  const n=parseInt(S.ui.porcoes,10);
  if(Number.isFinite(n)) return clampNum(n,1,12);
  return Math.max(1,S.members.length);
}

function recipeCard(r,n){
  /* Compatível = a dieta serve e não leva nada que a pessoa tenha excluído.
     São duas perguntas diferentes e a segunda é a que magoa, por isso a
     resposta é o ingrediente concreto, não um aviso genérico. */
  const comp=S.members.filter(m=>compat(r,chaveDieta(m))&&!ingredientesVetados(r,m).length);
  /* o que é alergia sai no aviso vermelho; aqui fica só o resto, para não se
     dizer a mesma coisa duas vezes com dois pesos diferentes */
  const vetados=S.members.map(m=>{
    const al=alergenicosDe(r,m).reduce((s,a)=>s.concat(a.itens),[]);
    return {m, itens:ingredientesVetados(r,m).filter(x=>al.indexOf(x)<0)};
  }).filter(x=>x.itens.length);
  const disp=disponibilidadeReceita(r);
  return `<div class="rc rc-tocavel" data-rid="${r.id}" role="button" tabindex="0"
      aria-label="Abrir a ficha de ${esc(r.n)}, com os passos de preparação"
      onclick="if(!event.target.closest('button,select,a,summary,details')) abrirFicha('${r.id}',${n||1})"
      onkeydown="if((event.key==='Enter'||event.key===' ')&&!event.target.closest('button,select,a,summary,details')){event.preventDefault();abrirFicha('${r.id}',${n||1});}">
    <div class="row" style="justify-content:space-between"><h3>${esc(r.n)}</h3><span class="kcal">${r.k} kcal</span></div>
    <div><span class="tag" style="border-color:var(--accent);color:var(--accent)">${r.mt.map(nomeRefeicao).join(' / ')}</span>
      <span class="tag">${ICO_COZ[r.coz]||''} ${cozinhasDe(r).map(k=>CUIS[k]).join(' · ')}</span>${selosCategoria(r)}${r.dc.filter(d=>d!==r.coz).map(d=>`<span class="tag">${DIETS[d].n}</span>`).join('')}${selosEpoca(r)}${seloGenero(r)}${seloSaborNovo(r,S.members)}</div>
    <div class="sub" style="font-variant-numeric:tabular-nums">H ${r.c} g · P ${r.p} g · G ${r.f} g${
      (function(){ const c=custoReceita(r,n||1); return c.com? ' · ~'+nPT(c.total,2)+' €'+(c.sem?'*':'') : ''; })()}</div>
    <span class="pill ${disp.pronta?'ok':disp.tem?'warn':''}" style="align-self:flex-start">${disp.pronta?'Pronta a cozinhar':disp.tem+'/'+disp.total+' na despensa'}</span>
    <div class="ingr-lista">${listaIngredientesComEstado(r,n)}</div>
    <div class="row" style="margin-top:2px">${seloGenero(r)? '<span class="sub">Género do prato '+dica('genero')+'</span>':''}</div>
    <details class="quant"><summary>Guardar e reaquecer ${dica('conserva')}</summary>
      <div class="sub">${esc(textoConservacao(r))}<br><i>Prazos genéricos e conservadores para sobras refrigeradas, no frigorífico a 4 °C ou menos. Não substituem o cheiro, o aspeto e o bom senso.</i></div></details>
    ${S.members.length? `<div class="row" style="margin-top:2px"><span class="sub">Compatível:</span>
      ${comp.length? comp.map(m=>avatar(m,22)).join('') : '<span class="sub">— só como refeição livre</span>'}</div>`:''}
    ${avisoAlergia(r,S.members)}
    ${vetados.length? `<div class="sub" style="color:var(--warn)">⚠ ${vetados.map(x=>nomeCurto(x.m)+' não come '+x.itens.map(esc).join(', ')).join(' · ')}</div>`:''}
    <div class="row" style="margin-top:2px">
      <button class="chip" onclick="abrirCozinha('${r.id}',${n||1})">👨‍🍳 Cozinhar</button>
      ${r.u? `<span class="tag" style="border-color:var(--accent);color:var(--accent)">da casa</span>
        <button class="chip" onclick="abrirEditor('${r.id}')">✏️ Editar</button>
        <button class="chip" onclick="apagarReceita('${r.id}')">Apagar</button>`
      : `<button class="chip" onclick="abrirEditor('${r.id}')">✏️ Copiar para editar</button>`}
    </div>
    ${r.u? '<span class="fita-cola" aria-hidden="true"></span>':''}
  </div>`;
}

function textoObjetivo(m){
  const p=objetivoPct(m), delta=Math.round(Math.abs(targetKcal(m)-tdee(m)));
  const sinal=(p>0?'+':p<0?'−':'')+Math.abs(p)+'%';   /* menos tipográfico, como no resto da app */
  return sinal+' · '+(p<0? 'défice de '+delta+' kcal/dia' : p>0? 'superavit de '+delta+' kcal/dia' : 'manutenção');
}
function sincronizaObjetivo(m){ const p=objetivoPct(m);
  m.objetivo = p<=-8? 'perder' : p>=5? 'ganhar' : 'manter'; }
function slideObjetivo(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.objetivoPct=clampNum(Math.round(parseFloat(el.value)||0),-25,20);
  pintaRange(el);
  aoVivo('nut', atualizarNutricao);
}
function commitObjetivo(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  sincronizaObjetivo(m); save();
  const p=objetivoPct(m);
  el.setAttribute('aria-valuetext',(p<0?'défice de ':p>0?'superavit de ':'')+Math.abs(p)
    +' por cento, alvo '+Math.round(targetKcal(m))+' quilocalorias por dia');
}
function presetObjetivo(mid,p){

/* Sliders C/P/F interligados: floats durante o gesto, maior-resto na pintura e
   no commit — a soma é sempre 100 e os polegares irmãos não tremem ±1. */
let macroLive=null;
function slideMacro(mid,k,el){
  const m=S.members.find(x=>x.id===mid); if(!m||m.dieta!=='personalizada') return;
  /* O estado do gesto é carimbado com o membro: um arrasto que acaba no mesmo
     valor não dispara change, e sem isto os macros desse membro contaminavam
     o gesto seguinte noutro perfil. */
  if(!macroLive || macroLive.mid!==mid){ const d=dietaDe(m); macroLive={mid,c:d.c,p:d.p,f:d.f}; }
  const v=clampNum(parseFloat(el.value)||0,0,100);
  const outros=['c','p','f'].filter(x=>x!==k);
  const resto=100-v, a=macroLive[outros[0]], b=macroLive[outros[1]];
  if(a+b<0.5){ macroLive[outros[0]]=resto/2; macroLive[outros[1]]=resto/2; }
  else { macroLive[outros[0]]=resto*a/(a+b); macroLive[outros[1]]=resto-macroLive[outros[0]]; }
  macroLive[k]=v;
  m.macros=normaliza100(macroLive);
  pintaRange(el);
  outros.forEach(x=>{ const s=document.getElementById('nu-sl-'+x);
    if(s){ s.value=m.macros[x]; pintaRange(s); } });   /* atribuir .value não dispara eventos — sem cascata */
  aoVivo('nut', atualizarNutricao);
}
function commitMacro(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  macroLive=null; save();

}
function presetMacro(mid,c,p,f){

    if(s){ s.value=m.macros[k]; pintaRange(s); } });

/* Projeção iterativa a 12 semanas. O domínio Y é fixo por render e dimensionado
   para o pior caso do slider (−25%) — o eixo nunca reescala durante o arrasto. */
function geomProjecao(m){
  const meia=Math.max(2.5, Math.ceil(tdee(m)*0.25*7*12/7700));
  const yMin=m.peso-meia, yMax=m.peso+meia;
  return {yMin,yMax, X:i=>sx(i,0,12,40,330), Y:v=>sx(v,yMin,yMax,130,12)};
}
function cartaoProjecao(m){
  const g=geomProjecao(m), proj=projecaoPeso(m,12), fim=proj[proj.length-1];
  const h2=(m.altura/100)*(m.altura/100);
  const zTop=clampNum(g.Y(25*h2),12,130), zBot=clampNum(g.Y(18.5*h2),12,130);
  const pts=proj.map((v,i)=>g.X(i).toFixed(1)+','+clampNum(g.Y(v),12,130).toFixed(1)).join(' ');
  const dentro=fim>=18.5*h2*1&&fim<=25*h2;
  const sobe=fim>m.peso;
  const yFim=clampNum(clampNum(g.Y(fim),12,130)+(sobe?16:-8),12,126);
  const delta=Math.round((fim-m.peso)*10)/10;
  /* O rótulo da zona saudável e a linha do peso de hoje partilham a margem
     esquerda, e quando o peso atual calha no topo da zona os dois textos
     escreviam-se um por cima do outro. O rótulo escolhe o lado onde há
     espaço; se a faixa for estreita de mais para qualquer um dos lados,
     desaparece — a faixa verde já se percebe sozinha. */
  const yHoje=g.Y(m.peso)-5, faixa=zBot-zTop;
  const cabeTopo=Math.abs((zTop+11)-yHoje)>=13, cabeBase=Math.abs((zBot-4)-yHoje)>=13;
  const yZona=faixa>=26 && (cabeTopo||cabeBase) ? (cabeTopo? zTop+11 : zBot-4) : null;
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 160" preserveAspectRatio="none" role="img" style="margin-top:8px">
    <title>Projeção de peso a doze semanas</title>
    ${zBot>zTop+1? `<rect x="40" y="${zTop.toFixed(1)}" width="290" height="${(zBot-zTop).toFixed(1)}" class="f-ok" fill-opacity=".08"/>
    ${yZona!==null? `<text x="44" y="${yZona.toFixed(1)}" font-size="9.5" class="f-mut">zona de IMC saudável</text>`:''}`:''}
    <line x1="40" y1="${g.Y(m.peso).toFixed(1)}" x2="330" y2="${g.Y(m.peso).toFixed(1)}" class="s-mut" stroke-dasharray="2 3"/>
    <text x="40" y="${(g.Y(m.peso)-5).toFixed(1)}" font-size="10" class="f-mut" style="font-variant-numeric:tabular-nums">hoje ${nPT(m.peso,1)}</text>
    ${[0,4,8].map(i=>`<text x="${g.X(i).toFixed(1)}" y="146" font-size="10" text-anchor="middle" class="f-mut">${i}</text>`).join('')}
    <text x="330" y="146" font-size="10" text-anchor="end" class="f-mut">12 semanas</text>
    <polyline id="nu-plinha" points="${pts}" class="s-acc" stroke-width="2.5" fill="none" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle id="nu-pdot" cx="330" cy="${clampNum(g.Y(fim),12,130).toFixed(1)}" r="4.5" class="${dentro?'f-ok':'f-acc'}"/>
    <text id="nu-pfim" x="326" y="${yFim.toFixed(1)}" font-size="13" font-weight="700" text-anchor="end" class="f-ink" style="font-variant-numeric:tabular-nums">${nPT(fim,1)} kg</text>
  </svg>
  <div class="row" style="justify-content:space-between;margin-top:6px">
    <b id="nu-pdelta" style="font-variant-numeric:tabular-nums">${delta===0?'peso estável':(delta>0?'+':'−')+nPT(Math.abs(delta),1)+' kg em 12 semanas'}</b>
  </div>
  <p class="sub" style="margin-top:6px">Estimativa: 7 700 kcal ≈ 1 kg, com o gasto recalculado semana a semana — não substitui aconselhamento médico ou nutricional.</p>`;
}
function atualizarProjecao(m){
  const pl=document.getElementById('nu-plinha'); if(!pl) return;
  const g=geomProjecao(m), proj=projecaoPeso(m,12), fim=proj[proj.length-1];
  pl.setAttribute('points', proj.map((v,i)=>g.X(i).toFixed(1)+','+clampNum(g.Y(v),12,130).toFixed(1)).join(' '));
  const h2=(m.altura/100)*(m.altura/100);
  const dentro=fim>=18.5*h2&&fim<=25*h2, sobe=fim>m.peso;
  const dot=document.getElementById('nu-pdot');
  if(dot){ dot.setAttribute('cy',clampNum(g.Y(fim),12,130).toFixed(1));
    dot.setAttribute('class',dentro?'f-ok':'f-acc'); }
  const lbl=document.getElementById('nu-pfim');
  if(lbl){ lbl.textContent=nPT(fim,1)+' kg';
    lbl.setAttribute('y',clampNum(clampNum(g.Y(fim),12,130)+(sobe?16:-8),12,126).toFixed(1)); }
  const delta=Math.round((fim-m.peso)*10)/10;
  põe('nu-pdelta', delta===0?'peso estável':(delta>0?'+':'−')+nPT(Math.abs(delta),1)+' kg em 12 semanas');
}
function atualizarNutricao(){
  const m=curM(); if(!m) return;
  const alvo=targetKcal(m), gasto=tdee(m), p=objetivoPct(m), mk=macros(m);
  põe('nu-obj', textoObjetivo(m));
  põe('nu-alvo', Math.round(alvo)); põe('nu-gasto', Math.round(gasto));
  const rp=document.getElementById('nu-ritmo');
  if(rp){
    if(alvo<bmr(m)){ rp.textContent='abaixo do basal — não recomendado'; rp.setAttribute('class','pill bad'); }
    else { const kg=ritmoSemanal(m), a=Math.abs(kg);
      rp.textContent=(a<0.005?'peso estável':(kg>0?'−':'+')+nPT(a,2)+' kg/semana');
      rp.setAttribute('class','pill '+(a<=0.75?'ok':a<=1?'warn':'bad')); }
  }
  const av=document.getElementById('nu-aviso'); if(av) av.style.visibility=p<=-20?'visible':'hidden';
  const d=mk.pct;
  const bc=document.getElementById('nu-bar-c');
  if(bc){ bc.style.width=d.c+'%';
    document.getElementById('nu-bar-p').style.width=d.p+'%';
    document.getElementById('nu-bar-f').style.width=d.f+'%';
    põe('nu-leg-c','Hidratos '+d.c+'%'); põe('nu-leg-p','Proteína '+d.p+'%'); põe('nu-leg-f','Gordura '+d.f+'%'); }
  põe('nu-g-c',mk.c+' g'); põe('nu-g-p',mk.p+' g'); põe('nu-g-f',mk.f+' g');
  ['c','p','f'].forEach(kk=>{ const o=document.getElementById('nu-out-'+kk);
    if(o) o.textContent=d[kk]+'% · '+mk[kk]+' g'; });
  const gk=document.getElementById('nu-gkg');
  if(gk){ const gkg=m.peso>0? mk.p/m.peso:0;
    gk.textContent=nPT(gkg,1)+' g de proteína por kg de peso';
    gk.setAttribute('class','pill '+(gkg>=1.2&&gkg<=2.2?'ok':'warn')); }
  const da=document.getElementById('nu-diet-aviso');
  if(da) da.style.visibility=(d.p<10||d.f<15)?'visible':'hidden';
  MEALS.forEach(mm=>põe('nu-meal-'+mm[0], ABREV_REF[mm[0]]+' '+Math.round(alvo*mm[2])));
  atualizarProjecao(m);
}
/* O cartão que explica de onde vêm os números desta fase e o que a faixa

/* ---- suplementos: interface ---- */
function dosesDe(m,id){ const s=(m.suplementos||[]).find(x=>x.s===id); return s? (parseFloat(s.doses)||0) : 0; }
function setDoses(mid,id,valor){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!Array.isArray(m.suplementos)) m.suplementos=[];
  const v=clampNum(Math.round((parseFloat(valor)||0)*2)/2,0,20);
  const i=m.suplementos.findIndex(x=>x.s===id);
  if(v<=0){ if(i>=0) m.suplementos.splice(i,1); }
  else if(i>=0) m.suplementos[i].doses=v;
  else m.suplementos.push({s:id,doses:v});
  /* tomar um suplemento implica tê-lo em casa — a despensa acompanha */
  if(v>0 && SUPL[id]) S.despensa[SUPL[id].nome]=true;
  save('suplementos de '+m.nome); render();
}
function slideDoses(mid,id,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!Array.isArray(m.suplementos)) m.suplementos=[];
  const v=clampNum(parseFloat(el.value)||0,0,20);
  const i=m.suplementos.findIndex(x=>x.s===id);
  if(v<=0){ if(i>=0) m.suplementos.splice(i,1); }
  else if(i>=0) m.suplementos[i].doses=v; else m.suplementos.push({s:id,doses:v});
  pintaRange(el);
  aoVivo('supl', ()=>{
    põe('sup-o-'+id, v>0? nPT(v,1).replace(',0','')+(v===1?' dose/dia':' doses/dia') : 'não toma');
    const bloco=document.getElementById('nu-supl-macros'); if(bloco) bloco.innerHTML=blocoSuplNosMacros(m);
    const mic=document.getElementById('sup-micros'); if(mic) mic.innerHTML=tabelaMicros(m);
    const res=document.getElementById('sup-resumo'); if(res) res.innerHTML=resumoSupl(m);
  });
}

function tabelaMicros(m){

    : `<p class="sub" style="margin-top:12px">Abaixo de 1 ano não estão definidas faixas de distribuição de macronutrientes: a referência é o leite materno ou a fórmula, e a diversificação alimentar segue a orientação do pediatra.</p>`}
    <p class="sub" style="margin-top:12px">Referências: valores de ingestão dietética de referência do Institute of Medicine, equações de Schofield e orientações da Organização Mundial de Saúde. São referências populacionais para planeamento familiar — não substituem consulta.</p>
  </div>`;
}
/* ===== MÓDULO DO BEBÉ ===== */
function updBebe(mid,campo,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!m.bebe) m.bebe=bebeCfg(m);
  m.bebe[campo] = campo==='modo'? val : parseFloat(val)||0;
  if(campo==='tomadas'||campo==='pctLeite') m.bebe.ml=null;   /* volume volta a ser calculado */
  save('alimentação de '+m.nome); render();
}
function slideBebe(mid,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!m.bebe) m.bebe=bebeCfg(m);
  m.bebe[campo]=parseFloat(el.value)||0;
  if(campo==='tomadas'||campo==='pctLeite') m.bebe.ml=null;
  pintaRange(el);
  aoVivo('bebe', ()=>atualizarBebe(mid));
}
function slidePeso(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.peso=parseFloat(el.value)||0; pintaRange(el);
  aoVivo('bebe', ()=>atualizarBebe(mid));
}
/* Curvas de peso da OMS com o bebé assinalado. */
function graficoPercentil(m){
  const sexo=m.sexo==='f'?'f':'m', meses=idadeMeses(m);
  const X=x=>sx(x,0,24,34,330), Y=w=>sx(w,2,16,150,14);
  const cores=['f-mut','f-mut','f-acc','f-mut','f-mut'];
  const curvas=PERCENTIS.map((p,k)=>{
    const pts=WHO_MESES.map((mm,i)=>X(mm).toFixed(1)+','+Y(WHO_PESO[sexo][i][k]).toFixed(1)).join(' ');
    return `<polyline points="${pts}" fill="none" stroke-width="${k===2?2:1}" class="${k===2?'s-acc':'s-line'}"
      ${k===2?'':'stroke-dasharray="3 3"'} vector-effect="non-scaling-stroke"/>
      <text x="332" y="${(Y(WHO_PESO[sexo][8][k])+3).toFixed(1)}" font-size="9" class="${cores[k]}">P${p}</text>`;
  }).join('');
  const cx=X(meses), cy=Y(m.peso);
  return `<svg class="svgfx" viewBox="0 0 348 168" role="img" aria-label="Peso para a idade nas curvas da Organização Mundial de Saúde">
    ${[4,8,12,16].map(w=>`<line x1="34" y1="${Y(w).toFixed(1)}" x2="330" y2="${Y(w).toFixed(1)}" class="s-line" opacity=".4"/>
      <text x="30" y="${(Y(w)+3.5).toFixed(1)}" font-size="9.5" text-anchor="end" class="f-mut">${w}</text>`).join('')}
    ${[0,6,12,18,24].map(mm=>`<text x="${X(mm).toFixed(1)}" y="164" font-size="9.5" text-anchor="middle" class="f-mut">${mm}</text>`).join('')}
    <text x="30" y="12" font-size="9" text-anchor="end" class="f-mut">kg</text>
    <text x="330" y="164" font-size="9" text-anchor="end" class="f-mut">meses</text>
    ${curvas}
    <line id="bb-vl" x1="${cx.toFixed(1)}" y1="14" x2="${cx.toFixed(1)}" y2="150" class="s-energy" stroke-dasharray="2 3" opacity=".5"/>
    <circle id="bb-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5.5" style="fill:var(--energy);stroke:var(--card);stroke-width:2"/>
  </svg>`;
}
/* Linha do dia com as tomadas marcadas. */
function graficoHorario(m){

function atualizarBebe(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const L=leiteBebe(m), c=L.cfg, d=L.ddr, q=percentilDe(m);
  põe('bb-o-peso', nPT(m.peso,2)+' kg');
  põe('bb-percentil', textoPercentil(m));

  põeAttr('bb-dot','cx', sx(idadeMeses(m),0,24,34,330).toFixed(1));
  põeAttr('bb-dot','cy', sx(m.peso,2,16,150,14).toFixed(1));
  põe('bb-o-tomadas', c.tomadas+(c.tomadas===1?' tomada':' tomadas'));
  põe('bb-o-ml', L.mlPorTomada+' ml por tomada');

  põe('bb-o-inicio', 'primeira às '+hhmm24(c.inicio));

  põe('bb-mlkg', L.mlPorKg+' ml/kg');

  /* quando as tomadas ou a fatia de leite mudam, o volume por tomada volta a

  põe('bb-ddr-kcal', d.kcal); põe('bb-ddr-prot', nPT(d.prot,1)); põe('bb-ddr-hc', d.hc); põe('bb-ddr-gord', d.gord);
  const g=document.getElementById('bb-marcas');
  if(g) g.innerHTML=horasTomadas(m).map(h=>`<circle cx="${sx(h,0,24,20,328).toFixed(1)}" cy="25" r="5" style="fill:var(--accent);stroke:var(--card);stroke-width:1.5"/>`).join('');

  const av=document.getElementById('bb-aviso-vol'), ref=volumeRefMlKg(idadeMeses(m));

function listaHoras(m){

}
function moduloBebe(m){

    Em Portugal, a Direção-Geral da Saúde (Norma n.º 004/2019) recomenda a suplementação de 400 UI/dia de vitamina D a todos os bebés saudáveis até aos 12 meses, independentemente do tipo de alimentação — confirma sempre a dose e a duração com o pediatra ou o enfermeiro de família.</p>

  ${meses>=6? `<div class="card">
    <h2>Refeições ao longo do dia ${dica('bebeRef')}</h2>
    <p class="sub" style="margin-top:6px">Repartição das ${d.kcal} kcal do dia: ${100-c.pctLeite}% em sólidos, o resto em leite.</p>
    ${(()=>{ const kcalSol=d.kcal*(100-c.pctLeite)/100;
      const refs = meses<9? [['Papa ou fruta a meio da manhã',0.35],['Sopa e prato ao almoço',0.65]]
        : meses<13? [['Papa ou fruta a meio da manhã',0.25],['Sopa e prato ao almoço',0.40],['Sopa e prato ao jantar',0.35]]

        <div class="kv"><span>Leite (${c.tomadas} tomadas)</span><b>${L.kcalTotal} kcal</b></div></div>`; })()}
    <p class="sub" style="margin-top:10px">Sem sal e sem açúcar adicionados durante todo o primeiro ano, e sem mel antes dos 12 meses. O leite de vaca não deve ser a bebida principal antes do ano.</p>
  </div>`:''}

  <div class="card">
    <div class="msg warn-msg" style="margin:0">Esta ferramenta ajuda a organizar e a perceber ordens de grandeza. <b>Não é uma prescrição.</b>

      alergias, refluxo ou qualquer doença. A Organização Mundial de Saúde recomenda leite materno exclusivo até aos 6 meses e a sua continuação,

/* ================= REGISTAR, VALIDAR E REVER REFEIÇÕES =================
   O mesmo princípio da atividade: o plano diz o que se tenciona comer, o
   registo diz o que se comeu. Uma refeição partilhada guarda-se uma vez por
   pessoa — cada uma com a sua dose e os seus acompanhamentos, porque à mesma
   mesa nem todos comem a mesma quantidade nem o mesmo ao lado do prato. */
function temPlanoNut(m){
  if(!m) return false;
  if(objetivoPct(m)!==0) return true;
  if(regRefDe(m.id).length) return true;
  const w=S.plans[S.week]||{};
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=(w[di]||{})[mk];
    if(meal && meal.r && Array.isArray(meal.m) && meal.m.indexOf(m.id)>=0) return true;
  }
  return false;
}
function formRef(){ return S.ui.formRef&&typeof S.ui.formRef==='object'? S.ui.formRef : null; }
function fecharFormRef(){ S.ui.formRef=null; saveMeta(); render(); }
function abrirFormRef(mid,pre){
  const m=S.members.find(x=>x.id===mid)||curM(); if(!m) return;
  pre=pre||{};
  const mk=MEALK.indexOf(pre.mk)>=0? pre.mk : 'a';
  const lista=receitasDe(mk);
  const rid=RECIPES.some(x=>x.id===pre.r)? pre.r : (lista[0]? lista[0].id : '');
  S.ui.formRef={mid:m.id, editar:pre.editar||null, d:pre.d||hojeISO(), mk, r:rid,
    ac:Array.isArray(pre.ac)? pre.ac.slice(0,MAX_AC) : [],
    dose:clampNum(parseFloat(pre.dose)||1,0.25,4), subst:!!pre.subst,
    mids:Array.isArray(pre.mids)&&pre.mids.length? pre.mids.slice() : [m.id]};
  saveMeta(); render();
  setTimeout(()=>{ const el=document.getElementById('fr-cartao'); if(el) scrollSuave(el); },0);
}
function setFormRef(campo,val){
  const f=formRef(); if(!f) return;
  if(campo==='d'){ if(dataValida(val) && val<=hojeISO()) f.d=val; }
  else if(campo==='mk'){ if(MEALK.indexOf(val)<0) return;
    f.mk=val;
    if(!receitasDe(val).some(x=>x.id===f.r)){ const l=receitasDe(val); f.r=l[0]? l[0].id : ''; }
    if(val!=='a'&&val!=='j') f.ac=[];
  }
  else if(campo==='r'){ if(RECIPES.some(x=>x.id===val)) f.r=val; }
  else if(campo==='dose'){ f.dose=clampNum(Math.round((parseFloat(val)||1)*100)/100,0.25,4); }
  saveMeta(); render();
}
function setFormRefAc(i,val){
  const f=formRef(); if(!f) return;
  const ac=f.ac.slice();
  if(val){ if(ac.indexOf(val)>=0 && ac[i]!==val) return flash('warn','Esse acompanhamento já está nesta refeição.');
    ac[i]=val; }
  else ac.splice(i,1);
  f.ac=ac.filter(Boolean).slice(0,MAX_AC);
  saveMeta(); render();
}
function juntarFormRefAc(){
  const f=formRef(); if(!f) return;
  if(f.ac.length>=MAX_AC) return flash('warn','Mais do que '+MAX_AC+' acompanhamentos deixam de ser acompanhamento.');
  const nova=acompanhamentos().find(x=>f.ac.indexOf(x.id)<0);
  if(!nova) return;
  f.ac=f.ac.concat(nova.id); saveMeta(); render();
}
function toggleFormRefMembro(mid){
  const f=formRef(); if(!f) return;
  const i=f.mids.indexOf(mid);
  if(i>=0){ if(f.mids.length===1) return flash('warn','Tem de haver pelo menos uma pessoa a comer.');
    f.mids.splice(i,1); }
  else f.mids.push(mid);
  saveMeta(); render();
}
function guardarFormRef(){
  const f=formRef(); if(!f) return;
  if(!f.r) return flash('bad','Escolhe a receita.');
  const base={d:f.d, mk:f.mk, r:f.r, ac:f.ac, dose:f.dose, subst:f.subst, estado:'feita'};
  if(f.editar){
    const r=(S.regRef||[]).find(x=>x.id===f.editar);
    if(!r) return fecharFormRef();
    const irmaos=irmaosDe(S.regRef,r);
    const todos=irmaos.length? confirmaPartilha(irmaos,'aplicar a alteração') : false;
    const limpo=limparRegRef(Object.assign({},r,base,{id:r.id,mid:r.mid,grupo:r.grupo}),S.members.map(x=>x.id));
    if(!limpo) return flash('bad','Não foi possível guardar esta refeição.');
    Object.assign(r,limpo);
    if(todos) irmaos.forEach(x=>{
      /* a dose e os acompanhamentos são de cada um: aplicar a alteração a
         todos muda o prato e o dia, não a quantidade que cada um comeu */
      const l=limparRegRef(Object.assign({},x,base,{id:x.id,mid:x.mid,grupo:x.grupo,dose:x.dose,ac:x.ac}),S.members.map(y=>y.id));
      if(l) Object.assign(x,l); });
    S.ui.formRef=null;
    save('refeição editada');
    flash('ok','Refeição atualizada'+(todos?' para todos os que a partilharam.':'.'));
    return render();
  }
  const criados=registarRefeicao(base,f.mids,'feita');
  if(!criados.length) return flash('bad','Não foi possível registar esta refeição.');
  S.ui.formRef=null;
  save('refeição registada');
  flash('ok', criados.length>1
    ? 'Refeição registada para '+criados.length+' pessoas.'
    : 'Refeição registada — '+Math.round(kcalRegRef(criados[0]))+' kcal.');
  render();
}
function apagarRegRef(id){
  const r=(S.regRef||[]).find(x=>x.id===id); if(!r) return;
  const irmaos=irmaosDe(S.regRef,r);
  const m=S.members.find(x=>x.id===r.mid);
  if(!confirm('Apagar esta refeição do registo'+(m?' de '+m.nome:'')+'?')) return;
  const todos=irmaos.length? confirmaPartilha(irmaos,'apagar') : false;
  const fora=[r.id].concat(todos? irmaos.map(x=>x.id) : []);
  S.regRef=S.regRef.filter(x=>fora.indexOf(x.id)<0);
  save('refeição apagada'); render();
}
/* ---- Validação ---- */
function validarRefFeita(mid,d,mk){
  const dia=(S.plans[mondayISO(d)]||{})[diaSemana(d)]||{};
  const meal=dia[mk]; if(!meal||!meal.r) return;
  /* quem estava à mesa naquele dia valida junto: uma refeição em família não
     se confirma pessoa a pessoa */
  const mids=(meal.m||[]).filter(id=>S.members.some(x=>x.id===id) && !isCheat(id,d)
    && !(S.regRef||[]).some(r=>r.mid===id&&r.d===d&&r.mk===mk));
  if(mids.indexOf(mid)<0) mids.push(mid);
  const porMembro={};
  mids.forEach(id=>{ const mm=S.members.find(x=>x.id===id);
    const rec=RECIPES.find(x=>x.id===meal.r);
    porMembro[id]={dose: mm&&rec? doseSugerida(mm,rec,mk) : 1}; });
  registarRefeicao({d, mk, r:meal.r, ac:acIds(meal), dose:1, porMembro}, mids, 'feita');
  carimboAlvo='ref:'+d+':'+mk;
  save('refeição confirmada');
  flash('ok', mids.length>1? 'Confirmada para '+mids.length+' pessoas.' : 'Refeição confirmada.');
  render();
}
function validarRefFalhou(mid,d,mk,modo){
  const dia=(S.plans[mondayISO(d)]||{})[diaSemana(d)]||{};
  const meal=dia[mk]||{};
  registarRefeicao({d, mk, r:meal.r, ac:acIds(meal), dose:1}, [mid], 'falhada');
  carimboAlvo='ref:'+d+':'+mk;
  save('refeição não realizada');
  if(modo==='substituir'){
    render();
    abrirFormRef(mid,{d, mk, subst:true});
    return flash('ok','Marcada como não feita. Escolhe agora o que foi comido em vez dela.');
  }
  if(modo==='rever'){ S.week=mondayISO(d); S.ui.tab='plano'; saveMeta();
    flash('warn','Marcada como não feita. Revê a semana no plano — se um prato nunca se cumpre, o problema é do plano.'); }
  render();
}
function confirmarTodasRef(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const pend=pendentesRef(m).slice();
  pend.forEach(p=>{
    if((S.regRef||[]).some(r=>r.mid===mid&&r.d===p.d&&r.mk===p.mk)) return;
    const rec=RECIPES.find(x=>x.id===p.meal.r);
    registarRefeicao({d:p.d, mk:p.mk, r:p.meal.r, ac:acIds(p.meal),
      dose: rec? doseSugerida(m,rec,p.mk) : 1}, [mid], 'feita');
  });
  save('refeições confirmadas');
  flash('ok', plural(pend.length,'refeição confirmada','refeições confirmadas')+'.');
  render();
}
function ignorarTodasRef(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const pend=pendentesRef(m);
  if(!pend.length) return;
  if(!confirm('Marcar '+plural(pend.length,'refeição','refeições')+' por confirmar como não realizadas?')) return;
  pend.forEach(p=>registarRefeicao({d:p.d, mk:p.mk, r:p.meal.r, ac:acIds(p.meal), dose:1},[mid],'falhada'));
  save('refeições por confirmar'); render();
}
function abrirValRef(chave){ S.ui.valRefAberto = S.ui.valRefAberto===chave? null : chave; saveMeta(); render(); }

            <span class="sub" style="display:block">${rotuloData(p.d)} · ${nomeRefeicao(p.mk)} · ${rec? rec.k+somaAc(acs,'k') : 0} kcal${acs.length? ' · com '+acs.map(x=>esc(x.n)).join(' + '):''}</span></div>

    </div>

}
/* ---- Cartão de registo ---- */

    ${podeAc? `<div style="margin-top:10px"><label class="lbl">Acompanhamentos ${dica('acompanhamento')}</label>
      ${f.ac.map((id,i)=>`<div class="ac-linha"><select class="acomp cheio" aria-label="Acompanhamento ${i+1}"
          onchange="setFormRefAc(${i},this.value)">
          <option value="">🍚 — tirar —</option>
          ${acompanhamentos().filter(x=>x.id===id||f.ac.indexOf(x.id)<0).map(x=>
            `<option value="${x.id}" ${id===x.id?'selected':''}>🍚 ${esc(x.n)} · ${x.k} kcal</option>`).join('')}
        </select></div>`).join('')}
      ${f.ac.length<MAX_AC? `<button class="chip" style="margin-top:6px" onclick="juntarFormRefAc()">＋ juntar acompanhamento</button>`:''}
      ${f.ac.length>1? `<span class="ac-divide">⚖ ${notaDivisao(f.ac.length)}</span>`:''}
    </div>`:''}
    <div style="margin-top:10px">
      <div class="splabel"><span>Quantidade ${dica('partilhada')}</span><output>${nPT(f.dose,2).replace(',00','')}× dose</output></div>

      ${f.mids.length>1? `<p class="sub" style="margin-top:6px">Fica registada para ${f.mids.length} pessoas. Depois, no histórico, cada uma pode ajustar a sua dose e os seus acompanhamentos — à mesma mesa nem todos comem o mesmo.</p>`:''}

    <div class="row" style="margin-top:12px;justify-content:space-between">
      <span class="pill">${kcal} kcal${f.mids.length>1? ' cada':''}</span>

        <button class="btn ghost small" onclick="fecharFormRef()">Cancelar</button>

}
function planeadasHojeSemRegisto(m){
  const d=hojeISO(), dia=(S.plans[mondayISO(d)]||{})[diaSemana(d)]||{}, out=[];
  MEALK.forEach(mk=>{ const meal=dia[mk];
    if(!meal||!meal.r||(meal.m||[]).indexOf(m.id)<0) return;
    if((S.regRef||[]).some(r=>r.mid===m.id&&r.d===d&&r.mk===mk)) return;
    out.push({mk, meal}); });
  return out;
}
/* ---- Gráfico da alimentação passada ---- */
function graficoRefSvg(m,dias){
  const h=hojeISO(), W=340, H=110, X0=8, X1=332;
  const barras=[];
  for(let i=dias-1;i>=0;i--){ const d=addDias(h,-i);
    barras.push({d, k:ingeridoRealDia(m.id,d).k, alvo:alvoDoDia(m,d)}); }
  const max=Math.max(1,...barras.map(b=>Math.max(b.k,b.alvo)))*1.1;
  const bw=(X1-X0)/barras.length, Y=v=>H-6-(v/max)*(H-24);
  const linha=barras.map((b,i)=>(X0+bw*i+bw/2).toFixed(1)+','+Y(b.alvo).toFixed(1)).join(' ');
  return `<svg class="svgfx" viewBox="0 0 ${W} ${H+16}" role="img"
      aria-label="Calorias registadas nos últimos ${dias} dias, comparadas com o alvo de cada dia">
    ${barras.map((b,i)=>{ const x=X0+bw*i+bw*0.15, w=Math.max(1.5,bw*0.7);
      const cor=!b.k? 'f-mut' : b.k>b.alvo*1.1? 'f-warn' : b.k<b.alvo*0.75? 'f-warn' : 'f-ok';
      return `<rect x="${x.toFixed(1)}" y="${Y(b.k).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(0,H-6-Y(b.k)).toFixed(1)}" rx="1.5" class="${cor}"
        ><title>${rotuloData(b.d)}: ${Math.round(b.k)} kcal (alvo ${Math.round(b.alvo)})</title></rect>`;}).join('')}
    <polyline points="${linha}" fill="none" class="s-acc" stroke-width="1.4" stroke-dasharray="3 3"/>
    <line x1="${X0}" y1="${H-6}" x2="${X1}" y2="${H-6}" class="s-line"/>
    <text x="${X0}" y="${H+10}" font-size="9.5" class="f-mut">${fmtShort(barras[0].d)}</text>
    <text x="${X1}" y="${H+10}" font-size="9.5" text-anchor="end" class="f-mut">hoje</text>
    <text x="${X0}" y="10" font-size="9.5" class="f-mut">${Math.round(max)} kcal</text>
  </svg>`;
}
function resumoRef(m,dias){
  const h=hojeISO(); let k=0, alvo=0, n=0, comDados=0, c=0,p=0,fg=0;
  for(let i=0;i<dias;i++){ const d=addDias(h,-i);
    const ing=ingeridoRealDia(m.id,d);
    const regs=regRefDe(m.id).filter(r=>r.d===d&&r.estado==='feita');
    if(regs.length){ comDados++; k+=ing.k; alvo+=alvoDoDia(m,d); c+=ing.c; p+=ing.p; fg+=ing.f; }
    n+=regs.length;
  }
  return {kcal:Math.round(k), alvo:Math.round(alvo), refs:n, dias:comDados,
    media: comDados? Math.round(k/comDados) : 0, mediaAlvo: comDados? Math.round(alvo/comDados) : 0,
    c:Math.round(c), p:Math.round(p), f:Math.round(fg)};
}

      <div class="stat"><b>${r.mediaAlvo}</b><span>Alvo médio</span></div>
      <div class="stat"><b style="color:${Math.abs(dif)<=100?'var(--ok)':Math.abs(dif)<=250?'var(--warn)':'var(--bad)'}">${dif>0?'+':''}${dif}</b><span>Diferença</span></div>

  </div>`;
}
function abrirHistRef(mid){ S.ui.histRef=mid; S.ui.mid=mid; saveMeta(); render(); window.scrollTo(0,0); }
function fecharHistRef(){ S.ui.histRef=null; saveMeta(); render(); }

      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="abrirFormRef('${m.id}')">+ Acrescentar ao registo</button>
      </div>
    </div>
    ${formRef()&&formRef().mid===m.id? cartaoRegistarRef(m,true) : ''}
    ${feitas.length? `<div class="grid g2" style="margin-top:16px">
      <div class="card">
        <h3>Últimos 90 dias</h3>
        ${graficoRefSvg(m,90)}
        <p class="sub" style="margin-top:6px">Barras: o que ficou registado. Tracejado: o alvo de cada dia, já com o ajuste do que se gastou a mais em atividade.</p>
      </div>
      <div class="card">
        <h3>Macros de tudo o que se registou</h3>

/* ================= OBJETIVOS =================
   Estratégias de peso: um alvo concreto (quilos e prazo) repartido entre
   dieta e exercício, aplicado diretamente ao objetivoPct e aos desportos do
   membro — o objetivo não é um número isolado, é o mesmo motor da Nutrição
   e da Atividade a apontar para uma meta. Progresso lido do peso atual do
   membro desde a criação, sem precisar de um histórico à parte. */
function membrosElegiveisObjetivo(){
  return S.members.filter(m=>faseDe(m)!=='bebe' && !semEstimativa(m));
}
/* Quantas semanas faltam a partir de AGORA — não das semanas totais da
   criação — para a estratégia se adaptar ao que já foi feito (ou não). */
function semanasRestantesDe(o){
  const decorridas=Math.max(0,(Date.now()-new Date(o.dataInicio).getTime())/(7*24*3600*1000));
  return Math.max(0.5, o.semanas-decorridas);
}
function progressoObjetivo(o){
  const m=S.members.find(x=>x.id===o.membroId);
  if(!m) return {pct:0, atingido:false, semMembro:true, tone:'warn'};
  const semanasDecorridas=Math.max(0,(Date.now()-new Date(o.dataInicio).getTime())/(7*24*3600*1000));
  const pctTempo=clampNum(semanasDecorridas/Math.max(o.semanas,0.001)*100,0,100);
  if(o.tipo==='manter'){
    const bandaKg=o.pesoInicial*o.bandaManter/100;
    const dentro=Math.abs(m.peso-o.pesoInicial)<=bandaKg;
    const terminou=semanasDecorridas>=o.semanas;
    return {pct:pctTempo, dentroBanda:dentro, atingido:terminou&&dentro, terminouFora:terminou&&!dentro,
      semanasDecorridas, bandaKg, tone:dentro?'ok':'warn', pctTempo};
  }
  const total=Math.abs(o.pesoInicial-o.pesoAlvo);
  const atingido = o.tipo==='perder'? m.peso<=o.pesoAlvo+0.05 : m.peso>=o.pesoAlvo-0.05;
  if(total<0.05) return {pct:100, atingido:true, tone:'ok', pctTempo, semanasDecorridas};
  const feito = o.tipo==='ganhar'? (m.peso-o.pesoInicial) : (o.pesoInicial-m.peso);
  const pct=clampNum(feito/total*100,0,100);
  /* pctTempo<1: objetivo acabado de criar, sem tempo real decorrido — mostra-se
     "no bom caminho" em vez de julgar um ritmo que ainda não existe. */
  const tone = atingido||pctTempo<1? 'ok' : pct>=pctTempo*0.85? 'ok' : pct>=pctTempo*0.5? 'warn' : 'bad';
  return {pct, atingido, feito, total, kgRestante:o.pesoAlvo-m.peso, tone, pctTempo, semanasDecorridas};
}
/* MET de referência para um desporto ainda não registado: a velocidade por
   omissão do catálogo, ou intensidade moderada. Se o membro já o pratica,
   usa-se o MET real dele em vez de um valor genérico. */
function metParaSugestao(m,sportId){
  const sp=SPORT[sportId]; if(!sp) return 0;
  const existente=(m.desportos||[]).find(s=>s.s===sportId);
  if(existente) return metDe(existente);
  return sp.dist? metPorVelocidade(sp.dist.curva,sp.dist.vdef) : sp.mets[1];
}
/* O cálculo puro da estratégia: quanto do ajuste diário vem da dieta e
   quanto do exercício, e o que isso implica em objetivoPct e em minutos de
   desporto extra. Usado tanto na criação como no reajuste de um objetivo
   já existente — nunca diverge entre os dois. */
function calcEstrategia(m,pesoAlvo,semanasRestantes,tipo,splitDieta,desportoId){
  const kgRestante=pesoAlvo-m.peso;
  const kcalTotal=Math.abs(kgRestante)*7700;
  const dias=Math.max(1,semanasRestantes*7);
  const deficitDiario=kcalTotal/dias;
  const sinal=tipo==='ganhar'?1:-1;
  const tdeeAtual=tdee(m);
  let viaDieta=deficitDiario, viaExercicio=0, horasExtraSemana=0;
  if(tipo==='perder'){
    viaDieta=deficitDiario*splitDieta/100;
    viaExercicio=deficitDiario*(100-splitDieta)/100;
    const met=desportoId? metParaSugestao(m,desportoId) : 0;
    horasExtraSemana = met>0? (viaExercicio*7)/(met*m.peso) : 0;
  }
  let objetivoPctSugerido = tipo==='manter'? 0 : Math.round(sinal*viaDieta/tdeeAtual*100);
  objetivoPctSugerido = tipo==='manter'?0 : clampNum(objetivoPctSugerido, tipo==='perder'?-25:0, tipo==='ganhar'?20:0);
  const targetKcalNovo=tdeeAtual*(1+objetivoPctSugerido/100);
  const ritmoKgSemana=Math.abs(kgRestante)/Math.max(semanasRestantes,0.001);
  return {kgRestante, deficitDiario, viaDieta, viaExercicio, horasExtraSemana, minutosExtraSemana:horasExtraSemana*60,
    objetivoPctSugerido, abaixoBasal: targetKcalNovo<bmr(m), ritmoKgSemana,
    toneRitmo: ritmoKgSemana<=0.75?'ok':ritmoKgSemana<=1?'warn':'bad', tdeeAtual, targetKcalNovo};
}
/* Acrescenta o exercício extra ao desporto escolhido — a um que já pratica
   (soma às horas semanais existentes) ou, se não tiver nenhum, cria um
   registo novo. Sempre em base semanal, para o cálculo não se perder entre
   unidades diferentes. */
function aplicarExercicio(m,sportId,horasExtraSemana){
  if(!sportId || horasExtraSemana<=0.01) return;
  const sp=SPORT[sportId]; if(!sp) return;
  if(!Array.isArray(m.desportos)) m.desportos=[];
  const entrada=m.desportos.find(s=>s.s===sportId);
  if(entrada){
    const semanaNova=sportWeeklyH(entrada)+horasExtraSemana;
    entrada.per='semana';
    if(sp.dist){ entrada.v=velocidade(entrada); entrada.km=Math.round(semanaNova*entrada.v*10)/10; }
    else entrada.h=Math.round(semanaNova*10)/10;
  } else if(sp.dist){
    m.desportos.push(normalizaDesporto({s:sportId, km:Math.round(horasExtraSemana*sp.dist.vdef*10)/10, v:sp.dist.vdef, per:'semana'}));
  } else {
    m.desportos.push(normalizaDesporto({s:sportId, h:Math.round(horasExtraSemana*10)/10, i:'moderado', per:'semana'}));
  }
}
function aplicarEstrategia(mid,calc,o){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(o.tipo==='manter'){ m.objetivoPct=0; sincronizaObjetivo(m); return; }
  m.objetivoPct=calc.objetivoPctSugerido; sincronizaObjetivo(m);
  if(o.tipo==='perder') aplicarExercicio(m,o.desportoEscolhido,calc.horasExtraSemana);
}

function criarObjetivo(){
  const f=S.ui.objForm;
  if(!f.membros.length) return flash('bad','Escolhe pelo menos um membro da família.');
  let criados=0; const ignorados=[];
  f.membros.forEach(mid=>{
    const m=S.members.find(x=>x.id===mid); if(!m) return;
    if(f.tipo==='perder' && !permiteDefice(m)){ ignorados.push(m.nome); return; }
    const pesoAlvo = f.tipo==='ganhar'? Math.round((m.peso+f.delta)*10)/10
      : f.tipo==='perder'? Math.max(1,Math.round((m.peso-f.delta)*10)/10) : m.peso;
    const o={id:uid(), membroId:mid, tipo:f.tipo, pesoInicial:m.peso, pesoAlvo,
      semanas:f.semanas, dataInicio:new Date().toISOString(),
      splitDieta:f.split, desportoEscolhido:f.tipo==='perder'?f.desporto:null,
      bandaManter:f.banda||2, concluido:false, celebrado:false, dataConclusao:null};
    const calc=calcEstrategia(m,pesoAlvo,f.semanas,f.tipo,f.split,o.desportoEscolhido);
    aplicarEstrategia(mid,calc,o);
    S.objetivos.push(o); criados++;
  });
  if(!criados) return flash('bad','Não foi possível criar objetivo'+(ignorados.length>1?'s':'')+' para '
    +ignorados.join(', ')+': em crescimento ou gravidez não se recomenda défice calórico.');
  S.ui.objForm={membros:[],tipo:'perder',delta:5,semanas:12,split:50,desporto:f.desporto,banda:2};
  save(plural(criados,'novo objetivo','novos objetivos'));
  flash('ok', plural(criados,'Objetivo criado','Objetivos criados')
    +(ignorados.length? '. Sem défice para '+ignorados.join(', ')+', por estarem em crescimento ou gravidez.':'.'));
}

/* ===== A BALANÇA DO OBJETIVO =====
   Num prato o défice que veio da mesa, no outro o que veio do movimento; o
   braço inclina com o que ficou REGISTADO, não com o que o plano previa. Sem
   registos, a balança aparece pousada e diz que não tem o que pesar — um
   desenho não pode afirmar um equilíbrio que os dados não sustentam. */
function pesosDaBalanca(m){
  const h=hojeISO(); let dieta=0, exercicio=0, dias=0;
  for(let i=1;i<=14;i++){
    const d=addDias(h,-i);
    const regs=regRefDe(m.id).filter(r=>r.d===d&&r.estado==='feita');
    const treinos=regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita');
    if(!regs.length && !treinos.length) continue;
    dias++;
    if(regs.length){ const ing=ingeridoRealDia(m.id,d);
      /* o que se deixou de comer face à manutenção é o défice da mesa */
      dieta+=Math.max(0, tdee(m)-ing.k); }
    exercicio+=treinos.reduce((t,r)=>t+kcalRegAtiv(r),0);
  }
  return {dieta:Math.round(dieta), exercicio:Math.round(exercicio), dias};
}
function balancaObjetivo(o,m){
  if(o.tipo==='manter') return '';
  const p=pesosDaBalanca(m);
  const alvo=clampNum(parseFloat(o.splitDieta)||50,0,100);
  const temDados=p.dias>=3 && (p.dieta+p.exercicio)>0;
  const pctDieta=temDados? p.dieta/(p.dieta+p.exercicio)*100 : 50;
  /* o braço inclina no máximo 12°, para a leitura ser de proporção e não de drama */
  const ang=temDados? clampNum((pctDieta-50)/50*12,-12,12) : 0;
  const rad=ang*Math.PI/180, cx=160, cy=44, br=104;
  const x1=cx-Math.cos(rad)*br, y1=cy+Math.sin(rad)*br;
  const x2=cx+Math.cos(rad)*br, y2=cy-Math.sin(rad)*br;
  const prato=(x,y,rot)=>`<path d="M${(x-22).toFixed(1)} ${y.toFixed(1)} q22 15 44 0" class="s-ink" fill="none"/>
    <line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y-9).toFixed(1)}" class="s-line"/>`;
  const xAlvo=cx-Math.cos(0)*br*((alvo-50)/50)*0;
  return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
    <div class="splabel"><span>De onde veio o esforço ${dica('balanca')}</span>
      <output>${temDados? 'plano: '+alvo+'% da mesa' : 'sem dados'}</output></div>
    <svg class="balanca" viewBox="0 0 320 118" role="img"
        aria-label="${temDados? 'Balança do esforço: '+Math.round(pctDieta)+' por cento veio da alimentação e '+Math.round(100-pctDieta)+' por cento do exercício, nos últimos '+p.dias+' dias com registo' : 'Balança pousada: ainda sem registos suficientes para pesar'}">
      <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="s-ink" stroke-width="2" stroke-linecap="round"/>
      ${prato(x1,y1+22)}${prato(x2,y2+22)}
