/* ================= OBJETIVOS =================
   Estratégias de peso: um alvo concreto (quilos e prazo) repartido entre
   dieta e exercício, aplicado diretamente ao objetivoPct e aos desportos do
   membro — o objetivo não é um número isolado, é o mesmo motor da Nutrição
   e da Atividade a apontar para uma meta. Progresso lido do peso atual do
   membro desde a criação, sem precisar de um histórico à parte. */
function membrosElegiveisObjetivo(){
  return S.members.filter(m=>faseDe(m)!=='bebe' && !semEstimativa(m));
}
/* Quantas semanas faltam a partir de AGORA — não das semanas totais da
   criação — para a estratégia se adaptar ao que já foi feito (ou não). */
function semanasRestantesDe(o){
  const decorridas=Math.max(0,(Date.now()-new Date(o.dataInicio).getTime())/(7*24*3600*1000));
  return Math.max(0.5, o.semanas-decorridas);
}
function progressoObjetivo(o){
  const m=S.members.find(x=>x.id===o.membroId);
  if(!m) return {pct:0, atingido:false, semMembro:true, tone:'warn'};
  const semanasDecorridas=Math.max(0,(Date.now()-new Date(o.dataInicio).getTime())/(7*24*3600*1000));
  const pctTempo=clampNum(semanasDecorridas/Math.max(o.semanas,0.001)*100,0,100);
  if(o.tipo==='manter'){
    const bandaKg=o.pesoInicial*o.bandaManter/100;
    const dentro=Math.abs(m.peso-o.pesoInicial)<=bandaKg;
    const terminou=semanasDecorridas>=o.semanas;
    return {pct:pctTempo, dentroBanda:dentro, atingido:terminou&&dentro, terminouFora:terminou&&!dentro,
      semanasDecorridas, bandaKg, tone:dentro?'ok':'warn', pctTempo};
  }
  const total=Math.abs(o.pesoInicial-o.pesoAlvo);
  const atingido = o.tipo==='perder'? m.peso<=o.pesoAlvo+0.05 : m.peso>=o.pesoAlvo-0.05;
  if(total<0.05) return {pct:100, atingido:true, tone:'ok', pctTempo, semanasDecorridas};
  const feito = o.tipo==='ganhar'? (m.peso-o.pesoInicial) : (o.pesoInicial-m.peso);
  const pct=clampNum(feito/total*100,0,100);
  /* pctTempo<1: objetivo acabado de criar, sem tempo real decorrido — mostra-se
     "no bom caminho" em vez de julgar um ritmo que ainda não existe. */
  const tone = atingido||pctTempo<1? 'ok' : pct>=pctTempo*0.85? 'ok' : pct>=pctTempo*0.5? 'warn' : 'bad';
  return {pct, atingido, feito, total, kgRestante:o.pesoAlvo-m.peso, tone, pctTempo, semanasDecorridas};
}
/* MET de referência para um desporto ainda não registado: a velocidade por
   omissão do catálogo, ou intensidade moderada. Se o membro já o pratica,
   usa-se o MET real dele em vez de um valor genérico. */
function metParaSugestao(m,sportId){
  const sp=SPORT[sportId]; if(!sp) return 0;
  const existente=(m.desportos||[]).find(s=>s.s===sportId);
  if(existente) return metDe(existente);
  return sp.dist? metPorVelocidade(sp.dist.curva,sp.dist.vdef) : sp.mets[1];
}
/* O cálculo puro da estratégia: quanto do ajuste diário vem da dieta e
   quanto do exercício, e o que isso implica em objetivoPct e em minutos de
   desporto extra. Usado tanto na criação como no reajuste de um objetivo
   já existente — nunca diverge entre os dois. */
function calcEstrategia(m,pesoAlvo,semanasRestantes,tipo,splitDieta,desportoId){
  const kgRestante=pesoAlvo-m.peso;
  const kcalTotal=Math.abs(kgRestante)*7700;
  const dias=Math.max(1,semanasRestantes*7);
  const deficitDiario=kcalTotal/dias;
  const sinal=tipo==='ganhar'?1:-1;
  const tdeeAtual=tdee(m);
  let viaDieta=deficitDiario, viaExercicio=0, horasExtraSemana=0;
  if(tipo==='perder'){
    viaDieta=deficitDiario*splitDieta/100;
    viaExercicio=deficitDiario*(100-splitDieta)/100;
    const met=desportoId? metParaSugestao(m,desportoId) : 0;
    horasExtraSemana = met>0? (viaExercicio*7)/(met*m.peso) : 0;
  }
  let objetivoPctSugerido = tipo==='manter'? 0 : Math.round(sinal*viaDieta/tdeeAtual*100);
  objetivoPctSugerido = tipo==='manter'?0 : clampNum(objetivoPctSugerido, tipo==='perder'?-25:0, tipo==='ganhar'?20:0);
  const targetKcalNovo=tdeeAtual*(1+objetivoPctSugerido/100);
  const ritmoKgSemana=Math.abs(kgRestante)/Math.max(semanasRestantes,0.001);
  return {kgRestante, deficitDiario, viaDieta, viaExercicio, horasExtraSemana, minutosExtraSemana:horasExtraSemana*60,
    objetivoPctSugerido, abaixoBasal: targetKcalNovo<bmr(m), ritmoKgSemana,
    toneRitmo: ritmoKgSemana<=0.75?'ok':ritmoKgSemana<=1?'warn':'bad', tdeeAtual, targetKcalNovo};
}
/* Acrescenta o exercício extra ao desporto escolhido — a um que já pratica
   (soma às horas semanais existentes) ou, se não tiver nenhum, cria um
   registo novo. Sempre em base semanal, para o cálculo não se perder entre
   unidades diferentes. */
function aplicarExercicio(m,sportId,horasExtraSemana){
  if(!sportId || horasExtraSemana<=0.01) return;
  const sp=SPORT[sportId]; if(!sp) return;
  if(!Array.isArray(m.desportos)) m.desportos=[];
  const entrada=m.desportos.find(s=>s.s===sportId);
  if(entrada){
    const semanaNova=sportWeeklyH(entrada)+horasExtraSemana;
    entrada.per='semana';
    if(sp.dist){ entrada.v=velocidade(entrada); entrada.km=Math.round(semanaNova*entrada.v*10)/10; }
    else entrada.h=Math.round(semanaNova*10)/10;
  } else if(sp.dist){
    m.desportos.push(normalizaDesporto({s:sportId, km:Math.round(horasExtraSemana*sp.dist.vdef*10)/10, v:sp.dist.vdef, per:'semana'}));
  } else {
    m.desportos.push(normalizaDesporto({s:sportId, h:Math.round(horasExtraSemana*10)/10, i:'moderado', per:'semana'}));
  }
}
function aplicarEstrategia(mid,calc,o){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(o.tipo==='manter'){ m.objetivoPct=0; sincronizaObjetivo(m); return; }
  m.objetivoPct=calc.objetivoPctSugerido; sincronizaObjetivo(m);
  if(o.tipo==='perder') aplicarExercicio(m,o.desportoEscolhido,calc.horasExtraSemana);
}

/* ---- formulário de criação (estado transitório em S.ui.objForm) ---- */
function opcoesDesportoForm(){
  const f=S.ui.objForm, uniao=new Set();
  f.membros.forEach(mid=>{ const m=S.members.find(x=>x.id===mid); if(m) (m.desportos||[]).forEach(s=>uniao.add(s.s)); });
  ['caminhada','corrida','ciclismo','natacao'].forEach(id=>uniao.add(id));
  return [...uniao].filter(id=>SPORT[id]);
}
function toggleObjMembro(mid){
  const arr=S.ui.objForm.membros, i=arr.indexOf(mid);
  i>=0? arr.splice(i,1) : arr.push(mid);
  if(!f_desportoValido()) S.ui.objForm.desporto=opcoesDesportoForm()[0]||null;
  saveMeta(); render();
}
function f_desportoValido(){ return opcoesDesportoForm().indexOf(S.ui.objForm.desporto)>=0; }
function setObjForm(campo,val){
  S.ui.objForm[campo]= campo==='delta'||campo==='semanas'||campo==='split'||campo==='banda'? parseFloat(val)||0 : val;
  if(campo==='membros'||campo==='tipo') { /* nada extra */ }
  saveMeta(); render();
}
function slideObjForm(campo,el){
  S.ui.objForm[campo]=parseFloat(el.value)||0; pintaRange(el);
  aoVivo('objform', ()=>{
    const f=S.ui.objForm;
    põe('obj-o-delta', nPT(f.delta,1)+' kg');
    põe('obj-o-semanas', f.semanas+(f.semanas===1?' semana':' semanas'));
    põe('obj-o-banda', '±'+nPT(f.banda,1)+'%');
    põe('obj-o-split', f.split+'% dieta · '+(100-f.split)+'% exercício');
    const pv=document.getElementById('obj-preview'); if(pv) pv.innerHTML=gerarPreviewHtml();
  });
}
function gerarPreviewHtml(){
  const f=S.ui.objForm;
  if(!f.membros.length) return '<p class="sub">Escolhe pelo menos um membro da família para veres a estratégia.</p>';
  return f.membros.map(mid=>{
    const m=S.members.find(x=>x.id===mid); if(!m) return '';
    if(f.tipo==='perder' && !permiteDefice(m))
      return `<div class="kv"><span>${esc(m.nome)}</span><b style="color:var(--warn)">sem défice nesta fase</b></div>`;
    if(f.tipo==='manter')
      return `<div class="kv"><span>${esc(m.nome)}</span><b>manter ${nPT(m.peso,1)} kg ± ${nPT(m.peso*f.banda/100,1)} kg</b></div>`;
    const pesoAlvo = f.tipo==='ganhar'? Math.round((m.peso+f.delta)*10)/10 : Math.max(1,Math.round((m.peso-f.delta)*10)/10);
    const calc=calcEstrategia(m,pesoAlvo,f.semanas,f.tipo,f.split,f.desporto);
    return `<div class="kv"><span>${esc(m.nome)} · alvo ${nPT(pesoAlvo,1)} kg</span>
      <b><span class="pill ${calc.toneRitmo}" style="margin-right:6px">${nPT(calc.ritmoKgSemana,2)} kg/sem</span>
      ${calc.objetivoPctSugerido>0?'+':''}${calc.objetivoPctSugerido}%${f.tipo==='perder'&&calc.minutosExtraSemana>1?' · +'+Math.round(calc.minutosExtraSemana)+' min/sem':''}</b></div>
      ${calc.abaixoBasal?'<div class="sub" style="color:var(--bad)">o alvo diário ficaria abaixo do metabolismo basal — reduz os quilos ou alarga o prazo</div>':''}`;
  }).join('');
}
function criarObjetivo(){
  const f=S.ui.objForm;
  if(!f.membros.length) return flash('bad','Escolhe pelo menos um membro da família.');
  let criados=0; const ignorados=[];
  f.membros.forEach(mid=>{
    const m=S.members.find(x=>x.id===mid); if(!m) return;
    if(f.tipo==='perder' && !permiteDefice(m)){ ignorados.push(m.nome); return; }
    const pesoAlvo = f.tipo==='ganhar'? Math.round((m.peso+f.delta)*10)/10
      : f.tipo==='perder'? Math.max(1,Math.round((m.peso-f.delta)*10)/10) : m.peso;
    const o={id:uid(), membroId:mid, tipo:f.tipo, pesoInicial:m.peso, pesoAlvo,
      semanas:f.semanas, dataInicio:new Date().toISOString(),
      splitDieta:f.split, desportoEscolhido:f.tipo==='perder'?f.desporto:null,
      bandaManter:f.banda||2, concluido:false, celebrado:false, dataConclusao:null};
    const calc=calcEstrategia(m,pesoAlvo,f.semanas,f.tipo,f.split,o.desportoEscolhido);
    aplicarEstrategia(mid,calc,o);
    S.objetivos.push(o); criados++;
  });
  if(!criados) return flash('bad','Não foi possível criar objetivo'+(ignorados.length>1?'s':'')+' para '
    +ignorados.join(', ')+': em crescimento ou gravidez não se recomenda défice calórico.');
  S.ui.objForm={membros:[],tipo:'perder',delta:5,semanas:12,split:50,desporto:f.desporto,banda:2};
  save(plural(criados,'novo objetivo','novos objetivos'));
  flash('ok', plural(criados,'Objetivo criado','Objetivos criados')
    +(ignorados.length? '. Sem défice para '+ignorados.join(', ')+', por estarem em crescimento ou gravidez.':'.'));
}
function removerObjetivo(oid){
  const o=S.objetivos.find(x=>x.id===oid); if(!o) return;
  const m=S.members.find(x=>x.id===o.membroId);
  if(!confirm('Remover este objetivo'+(m?' de '+m.nome:'')+'? A dieta e o desporto já aplicados mantêm-se como estão.')) return;
  S.objetivos=S.objetivos.filter(x=>x.id!==oid);
  if(S.ui.objExpandido===oid) S.ui.objExpandido=null;
  save('remoção de objetivo'); render();
}
/* ---- reajuste de um objetivo já ativo (estado transitório em S.ui.objAdj) ---- */
function toggleObjExpandido(oid){
  if(S.ui.objExpandido===oid) S.ui.objExpandido=null;
  else { const o=S.objetivos.find(x=>x.id===oid); S.ui.objExpandido=oid;
    S.ui.objAdj = o? {split:o.splitDieta, desporto:o.desportoEscolhido} : {split:50,desporto:null}; }
  saveMeta(); render();
}
function previewAjusteHtml(calc){
  return `<div class="row" style="margin-top:6px">
    <div class="stat"><b>${Math.round(calc.viaDieta)} kcal/dia</b><span>Via dieta</span></div>
    <div class="stat"><b>${Math.round(calc.viaExercicio)} kcal/dia</b><span>Via exercício</span></div>
    <div class="stat"><b>${Math.round(calc.minutosExtraSemana)} min/sem</b><span>Exercício extra</span></div>
    <div class="stat" style="background:var(--accent-soft)"><b style="color:var(--accent)">${calc.objetivoPctSugerido>0?'+':''}${calc.objetivoPctSugerido}%</b><span>Novo objetivo</span></div>
  </div>
  <div class="row" style="margin-top:8px"><span class="pill ${calc.toneRitmo}">${nPT(calc.ritmoKgSemana,2)} kg/semana</span>
    ${calc.abaixoBasal?'<span class="pill bad">alvo abaixo do basal</span>':''}</div>`;
}
function slideObjAdj(oid,campo,el){
  if(!S.ui.objAdj) S.ui.objAdj={split:50,desporto:null};
  S.ui.objAdj[campo]=parseFloat(el.value)||0; pintaRange(el);
  aoVivo('objadj', ()=>{
    const o=S.objetivos.find(x=>x.id===oid), m=o&&S.members.find(x=>x.id===o.membroId);
    if(!o||!m) return;
    const calc=calcEstrategia(m,o.pesoAlvo,semanasRestantesDe(o),o.tipo,S.ui.objAdj.split,S.ui.objAdj.desporto);
    const el2=document.getElementById('obj-adj-preview-'+oid); if(el2) el2.innerHTML=previewAjusteHtml(calc);
    põe('obj-adj-split-o-'+oid, S.ui.objAdj.split+'% dieta · '+(100-S.ui.objAdj.split)+'% exercício');
  });
}
function setObjAdj(oid,campo,val){
  if(!S.ui.objAdj) S.ui.objAdj={split:50,desporto:null};
  S.ui.objAdj[campo]=campo==='split'? parseFloat(val)||0 : val;
  saveMeta(); render();
}
function reajustarObjetivo(oid){
  const o=S.objetivos.find(x=>x.id===oid); if(!o) return;
  const m=S.members.find(x=>x.id===o.membroId); if(!m) return;
  const adj=S.ui.objAdj||{split:o.splitDieta,desporto:o.desportoEscolhido};
  o.splitDieta=clampNum(Math.round(adj.split),0,100); o.desportoEscolhido=adj.desporto;
  const calc=calcEstrategia(m,o.pesoAlvo,semanasRestantesDe(o),o.tipo,o.splitDieta,o.desportoEscolhido);
  aplicarEstrategia(o.membroId,calc,o);
  S.ui.objExpandido=null;
  save('ajuste de estratégia de '+m.nome);
  flash('ok','Estratégia atualizada — a dieta e o exercício de '+m.nome+' foram ajustados.');
}
function painelAjuste(o,m){
  if(o.tipo!=='perder') return `<div class="msg" style="margin-top:10px;background:var(--bg);color:var(--mut)">
    Este tipo de objetivo não tem estratégia mista para ajustar. Para mudar o alvo ou o prazo, remove e cria um objetivo novo.</div>`;
  const adj=S.ui.objAdj||{split:o.splitDieta,desporto:o.desportoEscolhido};
  const calc=calcEstrategia(m,o.pesoAlvo,semanasRestantesDe(o),o.tipo,adj.split,adj.desporto);
  const desportosMembro=(m.desportos||[]).map(s=>s.s);
  const opcoes=[...new Set(desportosMembro.concat(['caminhada','corrida','ciclismo','natacao','musculacao','calistenia']))].filter(id=>SPORT[id]);
  return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
    <div class="splabel"><span>Dieta ⟷ Exercício ${dica('objEstrategia')}</span>
      <output id="obj-adj-split-o-${o.id}" style="min-width:16ch;text-align:right">${adj.split}% dieta · ${100-adj.split}% exercício</output></div>
    <input type="range" min="0" max="100" step="5" value="${adj.split}" style="--pct:${adj.split}%"
      aria-label="Percentagem do ajuste que vem da dieta" oninput="slideObjAdj('${o.id}','split',this)" onchange="saveMeta()">
    <div class="row" style="margin:10px 0">
      <button class="chip ${adj.split===80?'on':''}" onclick="setObjAdj('${o.id}','split',80)">Mais dieta</button>
      <button class="chip ${adj.split===50?'on':''}" onclick="setObjAdj('${o.id}','split',50)">Equilibrado</button>
      <button class="chip ${adj.split===20?'on':''}" onclick="setObjAdj('${o.id}','split',20)">Mais exercício</button>
    </div>
    <div class="splabel"><span>Desporto para o exercício extra</span></div>
    <div class="row" style="margin:6px 0 10px">${opcoes.map(id=>
      `<button class="chip ${adj.desporto===id?'on':''}" onclick="setObjAdj('${o.id}','desporto','${id}')">${SPORT[id].nome}</button>`).join('')}</div>
    <div id="obj-adj-preview-${o.id}">${previewAjusteHtml(calc)}</div>
    <button class="btn small" style="margin-top:10px" onclick="reajustarObjetivo('${o.id}')">Guardar novo equilíbrio</button>
  </div>`;
}

/* ---- anel de progresso e cartões ---- */
function anelSvg(pct,tone,tamanho,espessura){
  tamanho=tamanho||84; espessura=espessura||9;
  const r=(tamanho-espessura)/2, c=tamanho/2, circ=2*Math.PI*r;
  const p=clampNum(pct,0,100), off=circ*(1-p/100);
  const cls= tone==='ok'?'s-ok': tone==='warn'?'s-warn': tone==='bad'?'s-bad':'s-acc';
  return `<svg class="svgfx anel" viewBox="0 0 ${tamanho} ${tamanho}" width="${tamanho}" height="${tamanho}"
      role="img" aria-label="${Math.round(p)} por cento concluído" style="width:${tamanho}px;height:${tamanho}px;flex:none">
    <circle cx="${c}" cy="${c}" r="${r}" class="s-line" stroke-width="${espessura}" fill="none"/>
    <circle cx="${c}" cy="${c}" r="${r}" class="anel-arco ${cls}" stroke-width="${espessura}" fill="none"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${c} ${c})"/>
    <text x="${c}" y="${c+5}" text-anchor="middle" font-size="${Math.round(tamanho*0.22)}" font-weight="700"
      class="f-ink" style="font-variant-numeric:tabular-nums">${Math.round(p)}%</text>
  </svg>`;
}
function cartaoConquista(o){
  const m=S.members.find(x=>x.id===o.membroId);
  const texto = o.tipo==='perder'? '−'+nPT(Math.abs(o.pesoInicial-o.pesoAlvo),1)+' kg'
    : o.tipo==='ganhar'? '+'+nPT(Math.abs(o.pesoAlvo-o.pesoInicial),1)+' kg' : 'manteve o peso';
  return `<div class="card" style="display:flex;align-items:center;gap:14px">
    <span style="font-size:28px" aria-hidden="true">🏆</span>
    <div style="flex:1"><b>${m?esc(m.nome):'Membro removido'}</b> — ${texto}
      <div class="sub">Concluído ${o.dataConclusao? fmtShort(iso(new Date(o.dataConclusao))) : ''}</div></div>
    <button class="btn danger small" onclick="removerObjetivo('${o.id}')">Remover</button>
  </div>`;
}
function cartaoObjetivo(o){
  const m=S.members.find(x=>x.id===o.membroId); if(!m) return '';
  const p=progressoObjetivo(o);
  const restantes=Math.max(0,o.semanas-(p.semanasDecorridas||0));
  const expandido=S.ui.objExpandido===o.id;
  const rotuloTipo = o.tipo==='perder'?'Perder peso': o.tipo==='ganhar'?'Ganhar peso':'Manter peso';
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div class="row" style="gap:12px;align-items:center">
        ${anelSvg(p.pct,p.tone)}
        <div>
          <div class="row" style="gap:8px">${avatar(m,26)}<b>${esc(m.nome)}</b></div>
          <div class="sub">${rotuloTipo}${o.tipo==='manter'?'':' · '+nPT(o.pesoInicial,1)+' → '+nPT(o.pesoAlvo,1)+' kg'}</div>
          ${o.tipo!=='manter'
            ? `<div class="sub" style="font-variant-numeric:tabular-nums">peso atual ${nPT(m.peso,1)} kg${p.atingido?'':' · faltam '+nPT(Math.abs(p.kgRestante),1)+' kg'}</div>`
            : `<div class="sub">dentro da banda: ${p.dentroBanda?'sim':'não, atenção'}</div>`}
          <div class="sub">${restantes<=0.05?'prazo terminado':Math.ceil(restantes)+(Math.ceil(restantes)===1?' semana restante':' semanas restantes')}</div>
        </div>
      </div>
      <button class="chip" onclick="toggleObjExpandido('${o.id}')" aria-expanded="${expandido}">${expandido?'Fechar':'Ajustar'}</button>
    </div>
    ${expandido? painelAjuste(o,m) : ''}
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn danger small" onclick="removerObjetivo('${o.id}')">Remover objetivo</button>
    </div>
  </div>`;
}
function celebracaoHtml(o){
  const m=S.members.find(x=>x.id===o.membroId);
  const texto = o.tipo==='perder'? 'perdeu '+nPT(Math.abs(o.pesoInicial-o.pesoAlvo),1)+' kg'
    : o.tipo==='ganhar'? 'ganhou '+nPT(Math.abs(o.pesoAlvo-o.pesoInicial),1)+' kg'
    : 'manteve o peso durante '+Math.round(o.semanas)+' semanas';
  return `<div class="card celebracao" role="status">
    <div class="confete" aria-hidden="true">${['🎉','✨','🎊','⭐','🎉','✨'].map((e,i)=>`<span style="--i:${i}">${e}</span>`).join('')}</div>
    <h2>Objetivo atingido! 🏆</h2>
    <p class="sub" style="margin-top:6px">${m?esc(m.nome):'Este membro'} ${texto}.</p>
    <button class="btn" onclick="fecharCelebracao()">Boa! Continuar</button>
  </div>`;
}
function fecharCelebracao(){ S.ui.celebrando=null; saveMeta(); render(); }

  const f=S.ui.objForm, elegiveis=membrosElegiveisObjetivo();
  if(!elegiveis.length) return `<div class="card"><p class="sub">Ainda não há membros elegíveis para objetivos de peso —
    bebés acompanham-se pelo percentil, no separador Nutrição, e gestações de trigémeos não têm alvo calórico estimado.</p></div>`;
  const podePerder = f.membros.some(mid=>{ const m=S.members.find(x=>x.id===mid); return m&&permiteDefice(m); });
  return `<div class="card">
    <h2>Criar objetivo ${dica('objCriar')}</h2>
    <div class="splabel" style="margin-top:8px"><span>Para quem</span></div>
    <div class="row">${elegiveis.map(m=>`<button class="chip ${f.membros.includes(m.id)?'on':''}" onclick="toggleObjMembro('${m.id}')">${avatar(m,20)} ${esc(m.nome.split(' ')[0])}</button>`).join('')}</div>

    <div class="splabel" style="margin-top:14px"><span>Tipo de objetivo</span></div>
    <div class="row">
      <button class="chip ${f.tipo==='perder'?'on':''}" onclick="setObjForm('tipo','perder')">Perder peso</button>
      <button class="chip ${f.tipo==='manter'?'on':''}" onclick="setObjForm('tipo','manter')">Manter peso</button>
      <button class="chip ${f.tipo==='ganhar'?'on':''}" onclick="setObjForm('tipo','ganhar')">Ganhar peso</button>
    </div>
    ${f.tipo==='perder'&&f.membros.length&&!podePerder?'<p class="sub" style="color:var(--warn);margin-top:6px">Nenhum dos membros escolhidos pode ter um objetivo de perda — em crescimento ou gravidez não se recomenda défice calórico.</p>':''}

    ${f.tipo!=='manter'? `<div class="spgrid" style="margin-top:14px">
      <div><div class="splabel"><span>Quantos quilos</span><output id="obj-o-delta" style="min-width:8ch;text-align:right">${nPT(f.delta,1)} kg</output></div>
        <input type="range" min="0.5" max="30" step="0.5" value="${f.delta}" style="--pct:${Math.round((f.delta-0.5)/29.5*100)}%"
          aria-label="Quantos quilos" oninput="slideObjForm('delta',this)" onchange="saveMeta()"></div>
      <div><div class="splabel"><span>Prazo</span><output id="obj-o-semanas" style="min-width:10ch;text-align:right">${f.semanas} semanas</output></div>
        <input type="range" min="2" max="52" step="1" value="${f.semanas}" style="--pct:${Math.round((f.semanas-2)/50*100)}%"
          aria-label="Prazo em semanas" oninput="slideObjForm('semanas',this)" onchange="saveMeta()"></div>
    </div>` : `<div class="spgrid" style="margin-top:14px">
      <div><div class="splabel"><span>Durante quanto tempo</span><output id="obj-o-semanas" style="min-width:10ch;text-align:right">${f.semanas} semanas</output></div>
        <input type="range" min="1" max="52" step="1" value="${f.semanas}" style="--pct:${Math.round((f.semanas-1)/51*100)}%"
          aria-label="Duração em semanas" oninput="slideObjForm('semanas',this)" onchange="saveMeta()"></div>
      <div><div class="splabel"><span>Margem tolerada</span><output id="obj-o-banda" style="min-width:6ch;text-align:right">±${nPT(f.banda,1)}%</output></div>
        <input type="range" min="0.5" max="5" step="0.5" value="${f.banda}" style="--pct:${Math.round((f.banda-0.5)/4.5*100)}%"
          aria-label="Margem de tolerância em percentagem" oninput="slideObjForm('banda',this)" onchange="saveMeta()"></div>
    </div>`}

    ${f.tipo==='perder'? `
    <div class="splabel" style="margin-top:14px"><span>Estratégia mista ${dica('objEstrategia')}</span>
      <output id="obj-o-split" style="min-width:16ch;text-align:right">${f.split}% dieta · ${100-f.split}% exercício</output></div>
    <input type="range" min="0" max="100" step="5" value="${f.split}" style="--pct:${f.split}%"
      aria-label="Percentagem do objetivo que vem da dieta" oninput="slideObjForm('split',this)" onchange="saveMeta()">
    <div class="row" style="margin:8px 0">
      <button class="chip ${f.split===80?'on':''}" onclick="setObjForm('split',80)">Mais dieta</button>
      <button class="chip ${f.split===50?'on':''}" onclick="setObjForm('split',50)">Equilibrado</button>
      <button class="chip ${f.split===20?'on':''}" onclick="setObjForm('split',20)">Mais exercício</button>
    </div>
    <div class="splabel"><span>Desporto para o exercício extra</span></div>
    <div class="row" style="margin:6px 0">${opcoesDesportoForm().map(id=>
      `<button class="chip ${f.desporto===id?'on':''}" onclick="setObjForm('desporto','${id}')">${SPORT[id].nome}</button>`).join('')}</div>`
    : f.tipo==='ganhar'? `<p class="sub" style="margin-top:10px">Para orientar o ganho para massa muscular, considera reforçar treino de força — ${['musculacao','calistenia','funcional'].map(id=>SPORT[id].nome).join(', ')}.</p>` : ''}

    <div id="obj-preview" style="margin-top:14px">${gerarPreviewHtml()}</div>
    <button class="btn" style="margin-top:12px" onclick="criarObjetivo()">Criar objetivo${f.membros.length>1?'s':''}</button>
  </div>`;
}
function renderObjetivos(){
  if(!S.members.length) return noMembers();
  S.objetivos.forEach(o=>{
    if(o.concluido) return;
    const p=progressoObjetivo(o);
    if(p.atingido){ o.concluido=true; o.dataConclusao=new Date().toISOString();
      if(!S.ui.celebrando) S.ui.celebrando=o.id; writeLS(); }
  });
  const ativos=S.objetivos.filter(o=>!o.concluido && S.members.some(m=>m.id===o.membroId));
  const concluidos=S.objetivos.filter(o=>o.concluido).sort((a,b)=>new Date(b.dataConclusao||0)-new Date(a.dataConclusao||0));
  const celebrarObj = S.ui.celebrando? S.objetivos.find(x=>x.id===S.ui.celebrando) : null;
  return (celebrarObj? celebracaoHtml(celebrarObj) : '')
    + formCriacaoHtml()
    + `<div class="secgap"><h2>Objetivos ativos</h2>`
    + (ativos.length? `<div class="grid g2" style="margin-top:10px">${ativos.map(cartaoObjetivo).join('')}</div>`

/* ================= PLANO SEMANAL ================= */
function shiftWeek(n){ const d=new Date(S.week+'T12:00:00'); d.setDate(d.getDate()+7*n); S.week=mondayISO(d); saveMeta(); render(); }
function planWeek(){ if(!S.plans[S.week]) S.plans[S.week]={}; return S.plans[S.week]; }
function planMeal(di,mk){ const w=planWeek(); if(!w[di]) w[di]={}; if(!w[di][mk]) w[di][mk]={r:'',m:S.members.map(x=>x.id)}; return w[di][mk]; }
function setMeal(di,mk,rid){ planMeal(di,mk).r=rid; save('escolha de refeição'); render(); }
function toggleEater(di,mk,mid){ const meal=planMeal(di,mk);
  meal.m = meal.m.includes(mid)? meal.m.filter(x=>x!==mid) : [...meal.m,mid]; save(); render(); }
function toggleCheat(mid,date){ if(!S.cheats[mid]) S.cheats[mid]=[];
  const i=S.cheats[mid].indexOf(date); i>=0? S.cheats[mid].splice(i,1) : S.cheats[mid].push(date);
  save('cheat day'); render(); }
function clearWeek(){ if(confirm('Limpar todas as refeições desta semana?')){ delete S.plans[S.week]; delete S.bought[S.week]; save('limpeza da semana'); render(); } }
function receitasDe(mk){ return RECIPES.filter(r=>r.mt.indexOf(mk)>=0); }
function autoFill(){
  const dates=weekDates(S.week); const used=new Set();
  Object.values(planWeek()).forEach(d=>MEALK.forEach(k=>d[k]?.r&&used.add(d[k].r)));
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=planMeal(di,mk); if(meal.r) continue;
    const eaters=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di]));
    if(!eaters.length) continue;
    const doTipo=receitasDe(mk);
    /* Estreita-se o mais possível e vai-se alargando: cozinha preferida e dieta
       de todos os comensais, depois só a dieta, depois qualquer coisa do tipo. */
    let pool=doTipo.filter(r=>(S.prefCuisine==='todas'||r.coz===S.prefCuisine)&&compatAll(r,eaters));
    if(!pool.length) pool=doTipo.filter(r=>compatAll(r,eaters));
    if(!pool.length) pool=doTipo;
    if(!pool.length) continue;
    const fresh=pool.filter(r=>!used.has(r.id));
    const alvo=fresh.length? fresh : pool;
    meal.r=alvo[Math.floor(Math.random()*alvo.length)].id; used.add(meal.r);
  }
  save('preenchimento automático da semana'); render();
}
function mealBlock(di,mk,label,date){
  const meal=planWeek()[di]?.[mk]; const r=meal&&RECIPES.find(x=>x.id===meal.r);
  const members=S.members;
  return `<div class="meal">
    <div class="mtitle">${label}</div>
    <select onchange="setMeal(${di},'${mk}',this.value)">
      <option value="">— escolher receita —</option>
      ${receitasDe(mk).map(x=>`<option value="${x.id}" ${r&&r.id===x.id?'selected':''}>${x.n} · ${x.k} kcal (${CUIS[x.coz]})</option>`).join('')}
    </select>
    ${r?`<div class="sub" style="margin-top:4px">H ${r.c} · P ${r.p} · G ${r.f} g/pessoa
      ${!compatAll(r,members.filter(m=>(meal.m||[]).includes(m.id)&&!isCheat(m.id,date)))?' · <b style="color:var(--warn)">⚠ nem todos compatíveis</b>':''}</div>`:''}
    <div class="row" style="margin-top:7px">${members.map(m=>{
      const on=meal? meal.m.includes(m.id) : true, cheat=isCheat(m.id,date);
      return `<button class="chip ${on&&!cheat?'on':''}" ${cheat?'style="opacity:.45" title="Cheat day"':''}
        onclick="toggleEater(${di},'${mk}','${m.id}')">${avatar(m,20)} ${esc(m.nome.split(' ')[0])}${cheat?' 🎉':''}</button>`;}).join('')}
    </div>
  </div>`;
}

/* Resumo «semana em números»: uma linha por membro, kcal planeadas por dia vs
   a linha do alvo — a mesma assinatura tracejada da barra da Atividade. */
function cartaoSemana(dates){
  const INICIAIS=['S','T','Q','Q','S','S','D'];
  return `<div class="card" id="pla-resumo" style="margin-bottom:16px">
    <h2>Semana em números ${dica('semana')}</h2>
    ${S.members.map(m=>{
      const alvo=targetKcal(m);
      const dias=dates.map((_,di)=>estadoDia(m,di,dates));
      const teto=Math.max(alvo*1.3, 1, ...dias.map(x=>x.kcal));
      const yDe=k=>48-sx(k,0,teto,0,40);
      const yAlvo=yDe(alvo);
      const barras=dias.map((x,di)=>{
        const bx=30+di*44;
        if(x.st==='cheat') return `<rect x="${bx}" y="20" width="30" height="28" rx="3" class="f-party" fill-opacity=".35"/><circle cx="${bx+15}" cy="15" r="2.5" class="f-party"/>`;
        if(x.st==='vazio') return `<rect x="${bx}" y="46" width="30" height="2" class="f-line"/>`;
        const h=Math.max(2,sx(x.kcal,0,teto,0,40)), by=48-h;
        if(x.st==='incompleto') return `<rect x="${bx}" y="${by.toFixed(1)}" width="30" height="${h.toFixed(1)}" rx="3" class="f-line" opacity=".6"/>
          <text x="${bx+15}" y="${Math.max(8,by-4).toFixed(1)}" font-size="9.5" text-anchor="middle" class="f-mut">${x.refs}/4</text>`;
        const cls=x.st==='ok'?'f-ok':x.st==='warn'?'f-warn':'f-bad';
        const val=h>=18? `<text x="${bx+15}" y="${Math.max(8,by-4).toFixed(1)}" font-size="9.5" text-anchor="middle" class="f-ink" style="font-variant-numeric:tabular-nums">${x.kcal}</text>`:'';
        return `<rect x="${bx}" y="${by.toFixed(1)}" width="30" height="${h.toFixed(1)}" rx="3" class="${cls}"/>`+val;
      }).join('');
      const taps=dates.map((_,di)=>`<rect x="${23+di*44}" y="0" width="44" height="64" fill="transparent"
        style="pointer-events:all;touch-action:manipulation;cursor:pointer" onclick="irParaDia(${di})"><title>Ir para ${DAYN[di]}</title></rect>`).join('');
      const iniciais=INICIAIS.map((c,di)=>`<text x="${45+di*44}" y="62" font-size="9.5" text-anchor="middle" class="f-mut">${c}</text>`).join('');
      const completos=dias.filter(x=>x.st==='ok'||x.st==='warn'||x.st==='bad');
      const media=completos.length? Math.round(completos.reduce((t,x)=>t+x.kcal,0)/completos.length):0;
      const dvm=completos.length&&alvo>0? Math.abs(media-alvo)/alvo:0;
      const tone=dvm<=0.10?'ok':dvm<=0.25?'warn':'bad';
      const cheats=dates.map((_,di)=>dias[di].st==='cheat'? DAYN[di].slice(0,3)+'. 🎉':null).filter(Boolean);
      return `<div style="margin-top:12px">
        <div class="row" style="gap:8px">${avatar(m,22)}<b>${esc(m.nome.split(' ')[0])}</b>
          ${completos.length? `<span class="pill ${tone}">média ${media} / alvo ${Math.round(alvo)}</span>`
            : '<span class="sub">ainda sem dias completos</span>'}
          ${cheats.length? `<span class="sub">${cheats.join(' · ')}</span>`:''}</div>
        <svg class="svgfx" viewBox="0 0 340 64" role="img" aria-label="Calorias planeadas por dia para ${esc(m.nome)}" style="margin-top:4px;max-width:560px">
          ${barras}
          <line x1="24" y1="${yAlvo.toFixed(1)}" x2="330" y2="${yAlvo.toFixed(1)}" class="s-ink" stroke-dasharray="4 3" stroke-width="1.5" opacity=".8"/>
          <text x="330" y="${(yAlvo-4).toFixed(1)}" font-size="10" text-anchor="end" class="f-ink" style="font-variant-numeric:tabular-nums">alvo ${Math.round(alvo)}</text>
          ${iniciais}${taps}
        </svg>
      </div>`;
    }).join('')}
    <p class="sub" style="margin-top:10px">Toca numa coluna para saltar para o dia. Cinzento = dia incompleto (n/4 refeições planeadas), rosa = cheat day. Verde, amarelo e vermelho só em dias completos: até ±10%, até ±25% e além disso do alvo.</p>
  </div>`;
}

/* ================= COMPRAS ================= */
function shoppingItems(){
  const dates=weekDates(S.week), w=S.plans[S.week]||{}, agg={};
  let meals=0;
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=w[di]?.[mk]; if(!meal||!meal.r) continue;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) continue;
    const n=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di])).length;
    if(!n) continue; meals++;
    r.i.forEach(([nome,q,u])=>{ const key=nome+'|'+u;
      if(!agg[key]) agg[key]={n:nome,u,q:0}; agg[key].q+=q*n; });
  }
  return {items:Object.values(agg),meals};
}
/* Marcar um item não redesenha a lista: no supermercado, com o telemóvel numa
   mão, o scroll e o foco ficam onde estavam. Se faltar algum id, cai no render
   completo — nunca dessincroniza. */
function toggleBought(key,el){ if(!S.bought[S.week]) S.bought[S.week]={};
  S.bought[S.week][key]=!S.bought[S.week][key]; save();
  const li=el&&el.closest? el.closest('li'):null;
  if(!li||!document.getElementById('co-bar')){ render(); return; }
  li.classList.toggle('done',!!S.bought[S.week][key]);
  atualizarCompras();
}
function atualizarCompras(){
  const bar=document.getElementById('co-bar'); if(!bar) return;
  const {items}=shoppingItems(); const bought=S.bought[S.week]||{};
  const done=items.filter(i=>bought[i.n+'|'+i.u]).length, total=items.length;
  bar.style.width=(total? done/total*100:0)+'%';
  bar.style.background=(done===total&&total)? 'var(--ok)':'var(--accent)';
  const num=document.getElementById('co-num');
  if(num){ if(done===total&&total){ num.textContent='tudo comprado ✓'; num.setAttribute('class','f-ok-txt'); }
    else { num.textContent=done+'/'+total+' comprados'; num.removeAttribute('class'); } }
  CATS.forEach((c,i)=>{ const el=document.getElementById('co-sec-'+i); if(!el) return;
    const lis=[].slice.call(document.querySelectorAll('li[data-sec="'+i+'"]'));
    const dn=lis.filter(li=>li.classList.contains('done')).length;
    const completo=lis.length&&dn===lis.length;
    el.textContent=(completo?'✓ ':'')+dn+'/'+lis.length;
    el.setAttribute('class', completo?'sub f-ok-txt':'sub');
  });
}
function fmtQ(it){ const q=Math.round(it.q*100)/100;
  if(it.u==='g'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' kg';
  if(it.u==='ml'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' L';
  return nPT(q, Number.isInteger(q)?0:(Number.isInteger(q*10)?1:2))+' '+it.u; }
/* Sem a guarda, em http simples (rede local) navigator.clipboard é undefined e
   o botão atirava um TypeError sem dizer nada a ninguém. */
function copyList(){
  const {items}=shoppingItems();
  const txt='Lista de compras — semana de '+fmtShort(S.week)+'\n'+items.map(i=>`• ${i.n}: ${fmtQ(i)}`).join('\n');
  const ok=()=>alert('Lista copiada! Cola-a numa mensagem ou nota.');
  const manual=()=>{ const ta=document.getElementById('co-txt');
    if(!ta){ alert('O browser não deixou copiar. Abre o separador Dados para exportares.'); return; }
    ta.style.display='block'; ta.value=txt; ta.focus(); ta.select();
    try{ ta.setSelectionRange(0,txt.length); }catch(e){}
    let feito=false; try{ feito=document.execCommand('copy'); }catch(e){}
    alert(feito? 'Lista copiada! Cola-a numa mensagem ou nota.'
      : 'Seleciona o texto da caixa abaixo e copia à mão (Ctrl+C).');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, manual);
  } else manual();
}

          <span>${esc(it.n)}</span><span class="q">${fmtQ(it)}</span></label></li>`;}).join('')}</ul>`;}).join('')}
  </div>
  <textarea id="co-txt" style="display:none;max-width:640px;margin-top:12px" readonly aria-label="Lista de compras em texto"></textarea>

/* ================= ORIENTAÇÃO E TIPO DE ECRÃ =================
   Marca <html> com data-orient (retrato/paisagem) e data-dispositivo
   (telefone/tablet/desktop). O CSS agarra-se a estes atributos para
   distinguir um telemóvel deitado de um tablet deitado, que têm larguras
   parecidas mas necessidades opostas. */
let ecra={orient:null,disp:null};
function ehToque(){
  try{ return matchMedia('(hover:none) and (pointer:coarse)').matches; }
  catch(e){ return 'ontouchstart' in window || navigator.maxTouchPoints>0; }
}
function orientacao(){
  try{
    if(matchMedia('(orientation:portrait)').matches) return 'retrato';
    if(matchMedia('(orientation:landscape)').matches) return 'paisagem';
  }catch(e){}
  return innerHeight>=innerWidth ? 'retrato' : 'paisagem';   // reserva para Safari antigo
}
function tipoDispositivo(){
  if(!ehToque()) return 'desktop';
  /* O lado menor não muda quando se roda, por isso classifica melhor do que a
     largura: um iPhone deitado continua a ser um telemóvel. */
  const menor=Math.min(innerWidth,innerHeight), maior=Math.max(innerWidth,innerHeight);
  return (menor>=600 || maior>=1000) ? 'tablet' : 'telefone';
}
function nomeEcra(){
  const d={telefone:'Telemóvel',tablet:'Tablet',desktop:'Computador'}[ecra.disp]||'—';
  return ecra.disp==='desktop' ? d : d+' · '+(ecra.orient==='retrato'?'vertical':'horizontal');
}
function aplicarEcra(){
  const o=orientacao(), d=tipoDispositivo();
  const mudou = (o!==ecra.orient || d!==ecra.disp);
  ecra={orient:o,disp:d};
  const r=document.documentElement;
  r.setAttribute('data-orient',o);
  r.setAttribute('data-dispositivo',d);
  const info=document.getElementById('ecraInfo');
  if(info) info.textContent=nomeEcra();
  return mudou;
}
/* Ao rodar, o iOS mantém a posição de scroll em pixéis: como a página fica com
   outra altura, o utilizador aterra num ponto diferente do que estava a ler.
   Guarda-se a posição relativa antes do reflow e repõe-se depois. */
function aoRodar(prop){
  if(!aplicarEcra()) return;
  if(typeof prop!=='number') return;
  requestAnimationFrame(()=>{
    const alt=Math.max(1, document.documentElement.scrollHeight - innerHeight);
    if(alt>1) window.scrollTo(0, Math.round(prop*alt));
  });
}
function ligarOrientacao(){
  const reagir=()=>{
    const alt=Math.max(1, document.documentElement.scrollHeight - innerHeight);
    const prop=alt>1 ? Math.min(1, scrollY/alt) : 0;
    /* Duas passagens: o Safari só publica as medidas certas depois do reflow. */
    requestAnimationFrame(()=>requestAnimationFrame(()=>aoRodar(prop)));
    setTimeout(()=>aoRodar(prop), 320);
  };
  try{
    const mq=matchMedia('(orientation:portrait)');
    if(mq.addEventListener) mq.addEventListener('change',reagir);
    else if(mq.addListener) mq.addListener(reagir);              // Safari 13 e anteriores
  }catch(e){}
  if(screen.orientation && screen.orientation.addEventListener)
    screen.orientation.addEventListener('change',reagir);         // Android / Chrome
  window.addEventListener('orientationchange',reagir);            // iOS Safari
  let t=null;
  const adiado=()=>{ clearTimeout(t); t=setTimeout(()=>aoRodar(),150); };
  window.addEventListener('resize',adiado);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',adiado);
}

function nomeFicheiro(){ return 'familia-fit-'+iso(new Date())+'.json'; }

function descarregar(){
  if(!S.members.length) return flash('bad','Ainda não há dados para exportar.');
  try{
    const blob=new Blob([textoCopia()],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=nomeFicheiro(); a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    marcarExportado();
    flash('ok','Ficheiro '+nomeFicheiro()+' criado — guarda-o na nuvem ou numa pasta de cópias, é com ele que '
      +'recuperas tudo. Se o browser não mostrar nenhuma transferência, usa «Mostrar e copiar dados».');
  }catch(e){
    flash('bad','O browser não deixou descarregar o ficheiro. Usa «Mostrar e copiar dados» e cola o texto num ficheiro à parte.');
  }
}
/* No iPhone e no Android a forma natural de guardar é a folha de partilha do
   sistema (Ficheiros, iCloud, Drive, WhatsApp), não uma transferência. */
function podePartilhar(){
  try{ return !!(navigator.canShare && navigator.share
    && navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]})); }
  catch(e){ return false; }
}
function partilhar(){
  if(!S.members.length) return flash('bad','Ainda não há dados para exportar.');
  const f=new File([textoCopia()], nomeFicheiro(), {type:'application/json'});
  navigator.share({files:[f], title:'Cópia do Família Fit'}).then(()=>{
    marcarExportado();
    flash('ok','Cópia enviada para a app que escolheste. Guarda-a nos Ficheiros ou na nuvem para a poderes restaurar.');
  }, e=>{
    if(e && (e.name==='AbortError' || e.name==='NotAllowedError')) return;   // o utilizador cancelou
    flash('bad','A partilha não ficou concluída. Usa «Transferir ficheiro» ou «Mostrar e copiar dados».');
  });
}
/* O Safari do iOS só copia de um campo editável e com seleção explícita. */
function copiarDaCaixa(ta){
  const eraReadonly=ta.hasAttribute('readonly');
  ta.removeAttribute('readonly');
  ta.focus(); ta.setSelectionRange(0, ta.value.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  if(eraReadonly) ta.setAttribute('readonly','');
  return ok;
}
function mostrarCopia(){
  if(!S.members.length) return flash('bad','Ainda não há dados para exportar.');
  const ta=document.getElementById('bkOut'); if(!ta) return;
  ta.value=textoCopia();
  const fim=()=>{ marcarExportado(); flash('ok','Dados copiados. Cola-os numa nota, email ou ficheiro de texto para os guardares.'); };
  const manual=()=>flash('ok','Dados prontos na caixa abaixo — seleciona tudo e copia à mão para os guardares.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(fim, ()=>{ copiarDaCaixa(ta)? fim() : manual(); });
  } else {
    copiarDaCaixa(ta)? fim() : manual();
  }
}
function num(v,d){ const n=parseFloat(v); return isFinite(n)&&n>0? n : d; }
function plural(n,um,muitos){ return n+' '+(n===1? um : muitos); }
/* Os ids são interpolados em atributos id= e em handlers inline, por isso um id
   vindo de um ficheiro de cópia tem de ser tão validado como tudo o resto: um
   apóstrofo partiria os onclick, e algo pior podia lá ser injetado. */
function limparId(v){ const s=String(v==null?'':v); return /^[A-Za-z0-9_-]{1,32}$/.test(s)? s : uid(); }
function limparMembro(m){
  m=m||{};
  const dieta = m.dieta==='personalizada' ? 'personalizada' : (temChave(DIETS,m.dieta)? m.dieta:'equilibrada');
  const objetivo = temChave(GOALS,m.objetivo)? m.objetivo:'manter';
  /* objetivoPct NUNCA passa por num(): 0 e negativos são valores legítimos */
  const pctBruto = parseFloat(m.objetivoPct);
  const out = {id:limparId(m.id), nome:String(m.nome||'Sem nome').slice(0,60),
    sexo: m.sexo==='f'?'f':'m', idade:num(m.idade,35), altura:num(m.altura,170), peso:num(m.peso,70),
    atividade: temChave(BASE_ACT,m.atividade)? m.atividade:'sedentario',
    desloc: temChave(COMMUTE,m.desloc)? m.desloc:'nenhum',
    dieta, objetivo,
    objetivoPct: Number.isFinite(pctBruto)? clampNum(Math.round(pctBruto),-25,20) : Math.round((GOALS[objetivo][1])*100),
    meses: Number.isFinite(parseFloat(m.meses))? clampNum(Math.round(parseFloat(m.meses)),0,24) : undefined,
    gravida: !!m.gravida && (m.sexo==='f'),
    trimestre: clampNum(Math.round(parseFloat(m.trimestre)||1),1,3),
    fetos: clampNum(Math.round(parseFloat(m.fetos)||1),1,3),
    pesoPre: num(m.pesoPre,0)||undefined,
    desportos: Array.isArray(m.desportos) ? m.desportos.map(normalizaDesporto).filter(Boolean) : []};
  /* idade:num(m.idade,35) acima não sabe nada de meses — sem isto, um bebé
     importado com só "meses" ficava com idade=35 (o valor de recurso) em vez
     de derivada dos meses, e um meses fora de [0,24] não convertia para anos. */
  normalizaIdadeMeses(out);
  if(dieta==='personalizada'){
    const mc=m.macros||{};
    const s=(parseFloat(mc.c)||0)+(parseFloat(mc.p)||0)+(parseFloat(mc.f)||0);
    out.macros = s>0? normaliza100(mc) : {c:50,p:20,f:30};   /* validar pela soma: 0 g de hidratos é legítimo */
  }
  /* a configuração do bebé passa pelo mesmo saneamento que usa em runtime */
  if(m.bebe && typeof m.bebe==='object') out.bebe=bebeCfg(Object.assign({},out,{bebe:m.bebe}));
  return out;
}
function lerPacote(txt){
  let p; try{ p=JSON.parse(txt); }catch(e){ return {erro:'O texto não é uma cópia válida (não foi possível interpretar o JSON).'}; }
  if(p && p.app && p.app!==APPID) return {erro:'Este ficheiro é de outra aplicação, não do Família Fit.'};
  const d = p && p.dados ? p.dados : p;
  if(!d || !Array.isArray(d.members)) return {erro:'Este ficheiro não contém perfis do Família Fit.'};
  /* Os perfis eram validados à lupa mas os planos entravam em bruto: uma
     refeição sem a lista de comensais rebentava o Plano e as Compras depois
     de importar. Tudo o que vem do ficheiro é agora saneado em profundidade,
     e os ids saneados são remapeados nos cheats e nos planos. */
  const mapa={}, vistos={};
  const members=d.members.map(mm=>{
    const antigo=String(mm.id==null?'':mm.id);
    const lm=limparMembro(mm);
    if(vistos[lm.id]) lm.id=uid();
    vistos[lm.id]=1; mapa[antigo]=lm.id;
    return lm;
  });
  const idOk=x=>{ const n=mapa[String(x)]||String(x); return vistos[n]? n : null; };
  const cheats={};
  if(d.cheats && typeof d.cheats==='object') Object.keys(d.cheats).forEach(mid=>{
    const alvo=idOk(mid); const arr=d.cheats[mid];
    if(!alvo || !Array.isArray(arr)) return;
    const dias=arr.filter(dataValida);
    if(dias.length) cheats[alvo]=(cheats[alvo]||[]).concat(dias);
  });
  const plans={};
  if(d.plans && typeof d.plans==='object') Object.keys(d.plans).forEach(wk=>{
    if(!dataValida(wk)) return;
    const dias=d.plans[wk]; if(!dias || typeof dias!=='object') return;
    const od={};
    Object.keys(dias).forEach(di=>{
      if(!/^[0-6]$/.test(String(di))) return;
      const refs=dias[di]; if(!refs || typeof refs!=='object') return;
      const or={};
      MEALK.forEach(mk=>{ const r=refs[mk]; if(!r || typeof r!=='object') return;
        or[mk]={ r: RECIPES.some(x=>x.id===r.r)? String(r.r):'',
                 m: Array.isArray(r.m)? r.m.map(idOk).filter(Boolean) : [] }; });
      if(Object.keys(or).length) od[di]=or;
    });
    if(Object.keys(od).length) plans[wk]=od;
  });
  const bought={};
  if(d.bought && typeof d.bought==='object') Object.keys(d.bought).forEach(wk=>{
    const o=d.bought[wk]; if(!o || typeof o!=='object') return;
    const oo={}; Object.keys(o).forEach(kk=>{ if(o[kk]) oo[kk]=true; }); bought[wk]=oo;
  });
  const objetivos=[], vistosObj={};
  if(Array.isArray(d.objetivos)) d.objetivos.forEach(o=>{
    if(!o || typeof o!=='object') return;
    const mid=idOk(o.membroId); if(!mid) return;
    const pesoInicial=num(o.pesoInicial,0), pesoAlvo=num(o.pesoAlvo,0);
    if(!pesoInicial || !pesoAlvo) return;
    const dt=new Date(o.dataInicio);
    let id=limparId(o.id); if(vistosObj[id]) id=uid(); vistosObj[id]=1;
    objetivos.push({
      id, membroId:mid,
      tipo: ['perder','manter','ganhar'].indexOf(o.tipo)>=0? o.tipo : 'perder',
      pesoInicial, pesoAlvo,
      semanas: clampNum(Math.round(parseFloat(o.semanas)||12),1,104),
      dataInicio: !isNaN(dt.getTime())? o.dataInicio : new Date().toISOString(),
      splitDieta: Number.isFinite(parseFloat(o.splitDieta))? clampNum(Math.round(parseFloat(o.splitDieta)),0,100) : 50,
      desportoEscolhido: temChave(SPORT,o.desportoEscolhido)? o.desportoEscolhido : null,
      bandaManter: clampNum(parseFloat(o.bandaManter)||2,0.5,10),
      concluido: !!o.concluido, celebrado: !!o.celebrado,
      dataConclusao: (o.dataConclusao && !isNaN(new Date(o.dataConclusao).getTime()))? o.dataConclusao : null
    });
  });
  return {d:{ members, cheats, plans, bought, objetivos,
              prefCuisine:temChave(CUIS,d.prefCuisine)?d.prefCuisine:'todas',
              week:dataValida(d.week)? mondayISO(new Date(d.week+'T12:00:00')) : mondayISO(new Date()) }};
}
function substituir(txt){
  const {d,erro}=lerPacote(txt); if(erro) return flash('bad',erro);
  if(S.members.length && !confirm('Substituir os dados atuais ('+S.members.length+' perfis) pelos da cópia ('
    +d.members.length+' perfis)?\n\nOs dados que estão neste dispositivo perdem-se.')) return;
  const antigo=S.meta;
  S=Object.assign(blank(), d);
  S.meta=Object.assign(S.meta,{avisarAoSair:antigo.avisarAoSair, exportadoEm:antigo.exportadoEm});
  S.ui.tab='dados'; S.ui.mid=S.members[0]? S.members[0].id : null;
  S.meta.semCopia=false; saveMeta();
  flash('ok','Dados restaurados: '+plural(d.members.length,'perfil','perfis')+' e '
    +plural(Object.keys(d.plans).length,'semana','semanas')+' de plano.');
}
function juntar(txt){
  const {d,erro}=lerPacote(txt); if(erro) return flash('bad',erro);
  const mapa={}; let novos=0, refeicoes=0;
  d.members.forEach(im=>{
    const igual=S.members.find(m=>m.id===im.id
      || m.nome.trim().toLowerCase()===im.nome.trim().toLowerCase());
    if(igual){ mapa[im.id]=igual.id; return; }
    const nid = S.members.some(m=>m.id===im.id)? uid() : im.id;
    mapa[im.id]=nid; S.members.push(Object.assign({},im,{id:nid})); novos++;
  });
  Object.keys(d.cheats).forEach(mid=>{
    const alvo=mapa[mid]||mid; if(!S.cheats[alvo]) S.cheats[alvo]=[];
    (d.cheats[mid]||[]).forEach(dia=>{ if(!S.cheats[alvo].includes(dia)) S.cheats[alvo].push(dia); });
  });
  Object.keys(d.plans).forEach(wk=>{
    if(!S.plans[wk]) S.plans[wk]={};
    Object.keys(d.plans[wk]).forEach(di=>{
      if(!S.plans[wk][di]) S.plans[wk][di]={};
      Object.keys(d.plans[wk][di]).forEach(mk=>{
        if(S.plans[wk][di][mk] && S.plans[wk][di][mk].r) return;   // não mexe no que já está marcado
        const ref=d.plans[wk][di][mk]||{};
        S.plans[wk][di][mk]={r:ref.r||'', m:(ref.m||[]).map(x=>mapa[x]||x)};
        if(ref.r) refeicoes++;
      });
    });
  });
  Object.keys(d.bought).forEach(wk=>{ S.bought[wk]=Object.assign({}, d.bought[wk], S.bought[wk]||{}); });
  let objetivosNovos=0;
  (d.objetivos||[]).forEach(o=>{
    const mid=mapa[o.membroId]||o.membroId;
    if(!S.members.some(m=>m.id===mid)) return;   // o membro pode não ter sido trazido (nome repetido descartado, etc.)
    if(S.objetivos.some(x=>x.id===o.id)) return;   // já existe — não duplica
    S.objetivos.push(Object.assign({},o,{membroId:mid})); objetivosNovos++;
  });
  if(!S.ui.mid && S.members[0]) S.ui.mid=S.members[0].id;
  save();
  flash('ok','Cópia integrada: '+plural(novos,'perfil novo','perfis novos')+', '
    +plural(refeicoes,'refeição acrescentada','refeições acrescentadas')+' e '
    +plural(objetivosNovos,'objetivo novo','objetivos novos')+'. Perfis com o mesmo nome foram '
    +'tratados como a mesma pessoa e as refeições e objetivos já existentes ficaram intactos.');
}
function importarFicheiro(input,modo){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ modo==='juntar'? juntar(String(r.result)) : substituir(String(r.result)); };
  r.onerror=()=>flash('bad','Não foi possível ler o ficheiro «'+f.name+'».');
  r.readAsText(f); input.value='';
}
function importarCaixa(modo){
  const ta=document.getElementById('bkIn'); const txt=(ta&&ta.value||'').trim();
  if(!txt) return flash('bad','Cola primeiro o texto da cópia na caixa.');
  modo==='juntar'? juntar(txt) : substituir(txt);
}
function toggleAviso(v){ S.meta.avisarAoSair=v; saveMeta(); render(); }
function apagarTudo(){
  if(!confirm('Apagar TODOS os dados deste dispositivo — perfis, planos e compras?\n\nSó consegues recuperar se tiveres um ficheiro de cópia.')) return;
  if(!confirm('Confirmas mesmo? Esta ação não pode ser anulada.')) return;
  const avisar=S.meta.avisarAoSair;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=blank(); S.meta.avisarAoSair=avisar; S.ui.tab='dados'; saveMeta();
  flash('ok','Dados apagados. Podes recomeçar ou restaurar uma cópia.');
}
function tamanho(){
  const n=new Blob([JSON.stringify(S)]).size;
  return n<1024? n+' B' : (n/1024).toFixed(1)+' kB';
}

function noMembers(){ return `<div class="card empty">Cria primeiro os perfis da família.<br><br><button class="btn" onclick="go('familia')">Ir para Família</button></div>`; }
function render(){
  document.getElementById('nav').innerHTML = TABS.map(([k,v])=>
    `<button class="${S.ui.tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
  const el=document.getElementById('main');
  el.innerHTML = S.ui.tab==='atividade'? renderAtividade()
    : S.ui.tab==='nutricao'? renderNutricao()
    : S.ui.tab==='objetivos'? renderObjetivos()
    : S.ui.tab==='plano'? renderPlano()
    : S.ui.tab==='compras'? renderCompras()
    : S.ui.tab==='dados'? renderDados()
    : renderFamilia();
  /* semeia os valores que só o atualizador escreve (pill de ritmo, etc.) */
  if(S.ui.tab==='nutricao' && S.members.length) atualizarNutricao();
  paintSave(); pintaHist();
}
/* Ctrl+Z / Ctrl+Shift+Z (ou ⌘ no Mac). Dentro de um campo de texto não se
   intercepta nada — aí o desfazer que faz sentido é o do próprio campo. */
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey) || e.altKey) return;
  const t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'&&['text','number','date'].indexOf(t.type)>=0) return;
  if(tag==='TEXTAREA') return;
  const k=(e.key||'').toLowerCase();
  if(k==='z' && !e.shiftKey){ e.preventDefault(); desfazer(); }
  else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); refazer(); }
});
/* A bolha nasce alinhada ao marcador; se isso a puser fora da janela, desliza
   o necessário para caber. A seta fica onde está, a apontar ao marcador. */
function posicionaDica(d){
  d.style.setProperty('--dx','0px');
  /* clientWidth e não innerWidth: este último inclui a barra de deslocação,
     e a bolha acabava 13 px fora do que a página realmente mostra. */
  const W=document.documentElement.clientWidth;
  const r=d.getBoundingClientRect();
  const larg=Math.min(270, W-24);
  const esq=r.left-4;
  let dx=0;
  if(esq+larg > W-12) dx=(W-12)-(esq+larg);
  if(esq+dx < 12) dx=12-esq;
  d.style.setProperty('--dx', Math.round(dx)+'px');
}
document.addEventListener('mouseover', e=>{ const d=e.target.closest&&e.target.closest('.dica'); if(d) posicionaDica(d); });
document.addEventListener('focusin', e=>{ const d=e.target.closest&&e.target.closest('.dica'); if(d) posicionaDica(d); });
/* Ao toque não há hover: o marcador de explicação alterna com um toque. */
document.addEventListener('click', e=>{
  const d=e.target.closest && e.target.closest('.dica');
  document.querySelectorAll('.dica.on').forEach(x=>{ if(x!==d) x.classList.remove('on'); });
  if(d){ e.preventDefault(); posicionaDica(d); d.classList.toggle('on'); }
});
aplicarEcra();
ligarOrientacao();
estadoAnterior=instantaneo();   /* base do histórico: o estado tal como foi carregado */
render();

/* Instalável no ecrã principal e utilizável sem rede (útil para a lista de
   compras no supermercado). Só corre em http/https — via file:// é ignorado. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
