<title>Família Fit — Alimentação & Movimento</title>
<style>
/* ===== TEMAS =====
   O modo (claro/escuro) é resolvido em JavaScript e escrito em data-modo,
   em vez de depender da media query. Assim as paletas precisam de metade
   das regras: cada uma declara só as suas cores em claro e em escuro, sem
   ter de repetir tudo por causa de prefers-color-scheme. O data-theme
   antigo continua a funcionar como sinónimo, para não partir nada. */
/* Os tons de texto foram todos passados pelo cálculo de contraste da WCAG: no
   modo claro, cada cor que serve de TEXTO chega aos 4,5:1 contra o fundo onde
   assenta — a pill de aviso contra o seu próprio tom a 16%, o número de
   calorias contra o cartão, a etiqueta cinzenta contra o fundo. Eram
   diferenças de 2 a 9% de luminosidade, invisíveis ao lado, decisivas para
   quem lê. */
:root, html[data-modo="claro"]{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#232930; --mut:#68717B; --line:#E4E1D8;
  --accent:#2456A6; --accent-soft:#E8EEF8; --energy:#AF571B; --energy-soft:#F8EDE2;
  --party:#BC4578; --party-soft:#FCF2F7;
  --ok:#2C774B; --warn:#86610F; --bad:#B83D31;
  --mc:#8E6020; --mp:#2456A6; --mf:#7C5CB0;
  /* A tinta que assenta POR CIMA do acento. Em claro o acento é escuro e pede
     branco; em escuro é claro e pede tinta escura. Sem este token, a regra do
     texto do botão tinha de olhar para o modo — e era isso que fazia o botão
     fantasma e o botão de perigo, que não têm fundo nenhum, herdarem a tinta
     do botão cheio e desaparecerem contra o cartão. */
  --on-accent:#FFFFFF;
  --shadow:0 1px 3px rgba(35,41,48,.07),0 4px 14px rgba(35,41,48,.05);
  --r:14px;
}
html[data-modo="escuro"], :root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2229; --ink:#E8EAED; --mut:#96A0AA; --line:#2A323B;
  --accent:#7BA7E8; --accent-soft:#22304A; --energy:#E09550; --energy-soft:#3A2C1D;
  --party:#E38AA8; --party-soft:#3D2430;
  --ok:#5FBF8A; --warn:#D9B04A; --bad:#E88C7D;
  --mc:#DCA84F; --mp:#7BA7E8; --mf:#A98BD8;
  --on-accent:#10151B;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
/* --- Alecrim: verdes de horta, neutros com um travo de azeitona --- */
html[data-paleta="alecrim"]{
  --bg:#F4F5F0; --card:#FFFFFF; --ink:#23291F; --mut:#687269; --line:#E0E4D8;
  --accent:#3E7845; --accent-soft:#E7F0E6; --energy:#996424; --energy-soft:#F6EEE0;
  --party:#9D5A81; --party-soft:#FAF2F7; --mp:#3E7845;
}
html[data-paleta="alecrim"][data-modo="escuro"]{
  --bg:#151A15; --card:#1D241D; --ink:#E7EAE4; --mut:#98A497; --line:#2C352C;
  --accent:#79C083; --accent-soft:#23331F; --energy:#D9A05C; --energy-soft:#352A1B;
  --party:#D493B6; --party-soft:#372631; --mp:#79C083;
}
/* --- Figo: roxos e magentas, neutros levemente ameixa --- */
html[data-paleta="figo"]{
  --bg:#F6F3F6; --card:#FFFFFF; --ink:#28222C; --mut:#6F6874; --line:#E5DEE6;
  --accent:#6B4396; --accent-soft:#EDE6F6; --energy:#AC503D; --energy-soft:#F8E9E5;
  --party:#B23D74; --party-soft:#F8E6EE; --mp:#6B4396; --mf:#B23D74;
}
html[data-paleta="figo"][data-modo="escuro"]{
  --bg:#17141A; --card:#211C25; --ink:#EAE5EC; --mut:#9F97A6; --line:#332C38;
  --accent:#B392E0; --accent-soft:#2C2140; --energy:#E08A72; --energy-soft:#3A2823;
  --party:#DE86AF; --party-soft:#3C2432; --mp:#B392E0; --mf:#DE86AF;
}
/* --- Maré: azuis-esverdeados de água, neutros frios --- */
html[data-paleta="mare"]{
  --bg:#F1F5F5; --card:#FFFFFF; --ink:#1F2A2C; --mut:#637375; --line:#DBE4E4;
  --accent:#0F6E78; --accent-soft:#E0F0F1; --energy:#AD5727; --energy-soft:#F7ECE2;
  --party:#9A4E8C; --party-soft:#F3E7F1; --mp:#0F6E78;
}
html[data-paleta="mare"][data-modo="escuro"]{
  --bg:#101819; --card:#182123; --ink:#E3EBEC; --mut:#8FA1A3; --line:#263234;
  --accent:#5FC2CC; --accent-soft:#123336; --energy:#DE9560; --energy-soft:#372A1F;
  --party:#CE8CC2; --party-soft:#332431; --mp:#5FC2CC;
}
/* --- Brasa: laranjas e vermelhos quentes, neutros de barro --- */
html[data-paleta="brasa"]{
  --bg:#F7F3F0; --card:#FFFFFF; --ink:#2B2320; --mut:#75695F; --line:#E8DED6;
  --accent:#B04E1E; --accent-soft:#FAEAE0; --energy:#8A6A1C; --energy-soft:#F5F0DE;
  --party:#B03F5C; --party-soft:#F9E7EA; --mp:#B04E1E; --mc:#8A6A1C;
}
html[data-paleta="brasa"][data-modo="escuro"]{
  --bg:#1A1512; --card:#241D19; --ink:#EDE6E1; --mut:#A6968A; --line:#352B25;
  --accent:#E8895A; --accent-soft:#3B2418; --energy:#D4B45E; --energy-soft:#332C18;
  --party:#DE8298; --party-soft:#3A242A; --mp:#E8895A; --mc:#D4B45E;
}
/* --- Tinta: monocromático de alto contraste, para quem quer sossego --- */
html[data-paleta="tinta"]{
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#1A1A1A; --mut:#666666; --line:#DEDEDE;
  --accent:#2B2B2B; --accent-soft:#E6E6E6; --energy:#5C5C5C; --energy-soft:#EDEDED;
  --party:#6F6F6F; --party-soft:#F6F6F6; --mc:#707070; --mp:#2B2B2B; --mf:#5C5C5C;
}
html[data-paleta="tinta"][data-modo="escuro"]{
  --bg:#121212; --card:#1C1C1C; --ink:#F0F0F0; --mut:#9A9A9A; --line:#2E2E2E;
  --accent:#E4E4E4; --accent-soft:#2E2E2E; --energy:#B0B0B0; --energy-soft:#282828;
  --party:#9A9A9A; --party-soft:#262626; --mc:#9A9A9A; --mp:#E4E4E4; --mf:#B0B0B0;
}
*{box-sizing:border-box;margin:0}
/* overflow-x:clip (e não hidden) impede que uma bolha de explicação ponha a
   página a deslizar na horizontal, sem criar um contentor de scroll — o
   cabeçalho fixo continua a colar-se ao topo. */
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
  padding-bottom:60px;overflow-x:clip}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px;margin-bottom:4px} h3{font-size:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
  position:sticky;isolation:isolate}
/* Aura: as cores dos membros da família esbatidas no topo do cabeçalho, para
   a app ter a cara de quem a usa. O gradiente é montado em JS a partir das
   cores escolhidas; sem membros, não aparece nada. */
.aura{position:absolute;inset:0 0 auto 0;height:100%;pointer-events:none;z-index:-1;opacity:.5}
html[data-modo="escuro"] .aura{opacity:.34}
.hwrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand small{color:var(--mut);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:24px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sub{color:var(--mut);font-size:13.5px}
.lbl{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:10px}
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.party{border-color:var(--party);color:var(--party)}
.chip.party.on{background:var(--party-soft)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--bg);border-radius:10px;min-width:100px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 6px}
.mbar div{height:100%}
.mleg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
table{border-collapse:collapse;width:100%}
.splist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.spline{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg);
  display:flex;flex-direction:column;gap:10px}
.sptop{display:flex;gap:10px;align-items:center}
.sptop select{flex:1 1 auto;min-width:0}
.spgrid{display:flex;flex-direction:column;gap:11px}
/* O valor não encolhe nem parte: num ecrã estreito é o rótulo que cede a
   linha, em vez de o «50% dieta · 50% exercício» ficar com o último carácter
   cortado contra a margem. */
.splabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px;
  flex-wrap:wrap;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.splabel>span{min-width:0}
.splabel output{flex:0 0 auto;margin-left:auto}
.splabel output{font-size:14.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.spfoot{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-top:9px;border-top:1px solid var(--line)}
.spfoot select{width:auto;min-width:0;flex:0 1 auto}
.sphoras{display:flex;align-items:center;gap:5px}
.sphoras input{width:70px}
.spgasto{margin-left:auto;text-align:right;white-space:nowrap}
.spgasto .sub{display:block;font-size:11.5px}
.pill.nivel{background:var(--accent-soft);color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;padding:0;
  background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--accent);border:3px solid var(--card);margin-top:-7px;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:3px solid var(--card);border-radius:50%;
  background:var(--accent)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
/* Sliders de macros com a cor do próprio macro. */
.rgC::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mc) var(--pct,0%),var(--line) var(--pct,0%))}
.rgC::-webkit-slider-thumb{background:var(--mc)}
.rgC::-moz-range-progress{background:var(--mc)} .rgC::-moz-range-thumb{background:var(--mc)}
.rgP::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mp) var(--pct,0%),var(--line) var(--pct,0%))}
.rgP::-webkit-slider-thumb{background:var(--mp)}
.rgP::-moz-range-progress{background:var(--mp)} .rgP::-moz-range-thumb{background:var(--mp)}
.rgF::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mf) var(--pct,0%),var(--line) var(--pct,0%))}
.rgF::-webkit-slider-thumb{background:var(--mf)}
.rgF::-moz-range-progress{background:var(--mf)} .rgF::-moz-range-thumb{background:var(--mf)}
/* Gráficos: espelho, não controlo — nunca roubam o scroll nem o toque.
   Cores SEMPRE por classe (var() em atributos SVG não é fiável). */
/* Explicadores: bolha ancorada à esquerda do marcador (as dicas vivem sempre
   no lado esquerdo dos cartões, por isso crescer para a direita não transborda).
   Aparecem com o rato, com o teclado e — onde não há rato — ao toque. */
.dica{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;padding:0;margin-left:6px;border:1px solid var(--line);border-radius:50%;
  background:var(--bg);color:var(--mut);font:700 11px/1 inherit;cursor:help;vertical-align:middle;flex:none}
.dica:hover,.dica:focus-visible,.dica.on{border-color:var(--accent);color:var(--accent)}
.dica::after{content:attr(data-dica);position:absolute;left:calc(-4px + var(--dx,0px));top:calc(100% + 8px);
  width:max-content;max-width:min(270px,calc(100vw - 24px));
  background:var(--ink);color:var(--card);padding:9px 12px;border-radius:9px;
  font:400 12.5px/1.45 inherit;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;
  z-index:30;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
.dica::before{content:'';position:absolute;left:5px;top:calc(100% + 2px);
  border:6px solid transparent;border-bottom-color:var(--ink);z-index:31;display:none}
/* display em vez de visibility: uma bolha só escondida continuaria a contar
   para a largura do documento e punha a página a deslizar na horizontal. */
.dica:hover::after,.dica:hover::before,.dica:focus-visible::after,.dica:focus-visible::before,
.dica.on::after,.dica.on::before{display:block}
@media (hover:none) and (pointer:coarse){ .dica{width:30px;height:30px;font-size:14px;margin-left:8px} }
/* Barra de desfazer */
.hist{display:flex;gap:4px}
.hist button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);
  cursor:pointer;padding:5px 9px;font-size:14px;line-height:1;min-width:34px}
.hist button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.hist button:disabled{opacity:.35;cursor:default}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));
  background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13.5px;
  font-weight:600;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.28);max-width:90vw;text-align:center}
@media (prefers-reduced-motion: no-preference){ #toast{transition:opacity .18s} }
.svgfx{display:block;width:100%;height:auto;pointer-events:none}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-bad{fill:var(--bad)}
.f-mut{fill:var(--mut)} .f-line{fill:var(--line)} .f-ink{fill:var(--ink)}
.f-acc{fill:var(--accent)} .f-energy{fill:var(--energy)} .f-party{fill:var(--party)}
.s-ok{stroke:var(--ok)} .s-line{stroke:var(--line)} .s-ink{stroke:var(--ink)}
.s-acc{stroke:var(--accent)} .s-energy{stroke:var(--energy)} .s-mut{stroke:var(--mut)}
.s-warn{stroke:var(--warn)} .s-bad{stroke:var(--bad)}
.f-ok-txt{color:var(--ok)}
.dt-ok{background:var(--ok)} .dt-warn{background:var(--warn)} .dt-bad{background:var(--bad)}
.dt-line{background:var(--line)} .dt-party{background:var(--party)}
.day{scroll-margin-top:130px}
.shop label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  #co-bar{transition:width .2s,background-color .2s}
  .anel-arco{transition:stroke-dashoffset .6s ease, stroke .3s ease}
}
/* Visita guiada: cartão fixo no fundo, fora do #main para sobreviver aos
   redesenhos, e um halo à volta do elemento que está a ser explicado. */
.tour-cartao{position:fixed;left:50%;transform:translateX(-50%);
  bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,calc(100vw - 24px));
  background:var(--card);border:1px solid var(--accent);border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);padding:16px 18px;z-index:80}
.tour-cartao h3{font-size:16.5px;margin-bottom:4px}
.tour-cartao .sub{line-height:1.5}
.tour-progresso{display:flex;gap:4px;margin:10px 0 12px}
.tour-progresso i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.tour-progresso i.feito{background:var(--accent)}
.tour-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tour-acoes .btn{min-width:96px;justify-content:center}
.tour-alvo{position:relative;z-index:70;outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion: no-preference){
  .tour-alvo{transition:outline-color .2s}
  .tour-cartao{animation:tour-entra .25s ease-out}
  @keyframes tour-entra{ from{ opacity:0; transform:translate(-50%,12px);} }
}
.tour-destaque{border:2px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),transparent 70%)}
/* Cartões colapsáveis: o título ganha um botão que dobra o corpo, e o estado
   fica guardado por cartão — quem fecha a projeção de peso não a quer ver
   aberta outra vez amanhã. */
.card[data-col] > .card-cab{display:flex;align-items:center;gap:8px;cursor:pointer;
  margin:-2px 0 0;user-select:none}
.card[data-col] > .card-cab > :first-child{flex:1;min-width:0}
.col-btn{background:none;border:none;color:var(--mut);cursor:pointer;padding:4px 6px;border-radius:8px;
  font-size:13px;line-height:1;flex:none}
.col-btn:hover{color:var(--accent);background:var(--bg)}
.col-btn .chev{display:inline-block;transition:transform .18s}
.card.col-fechado .col-btn .chev{transform:rotate(-90deg)}
.card.col-fechado > .card-corpo{display:none}
@media (prefers-reduced-motion: reduce){ .col-btn .chev{transition:none} }

/* ============ TOQUE, TELEMÓVEL E TABLET ============ */

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* O select nativo do iOS ignora o desenho da página; uniformiza-se a seta. */

  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.6 6 6.4 11 1.6' fill='none' stroke='%238A929B' stroke-width='1.7' stroke-linecap='round'/></svg>");

/* ============ ORIENTAÇÃO ============ */
/* Grelha dos dias do plano, para poder mudar com a orientação. */
.gdias{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* Reserva sem JavaScript: qualquer ecrã muito baixo é um telemóvel deitado. */

  header{position:static}

/* O detetor de orientação marca <html> com data-orient e data-dispositivo,
   o que permite distinguir um telemóvel deitado de um tablet deitado —
   coisa que as media queries de largura, por si só, não conseguem. */

/* Telemóvel deitado: a altura passa a ser o recurso escasso. O cabeçalho
   deixa de ser fixo e encolhe, para a lista não ficar a espiar por uma frincha. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .svg-linha{height:80px}

/* Ao deitar, a largura dá para duas colunas de cartões. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .g2,

/* Telemóvel de pé: uma coluna, sem cartões a partir em duas metades estreitas. */
html[data-orient="retrato"][data-dispositivo="telefone"] .g2,
html[data-orient="retrato"][data-dispositivo="telefone"] .g3,
html[data-orient="retrato"][data-dispositivo="telefone"] .gdias{grid-template-columns:1fr}

/* Tablet de pé: duas colunas largas e mais respiro nas margens. */
html[data-orient="retrato"][data-dispositivo="tablet"] main{padding-left:24px;padding-right:24px}
html[data-orient="retrato"][data-dispositivo="tablet"] .g3,
html[data-orient="retrato"][data-dispositivo="tablet"] .gdias{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

/* Tablet deitado: aproveita a largura toda, mais dias e receitas por linha. */
html[data-orient="paisagem"][data-dispositivo="tablet"] main{max-width:1280px}
html[data-orient="paisagem"][data-dispositivo="tablet"] .g3{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
html[data-orient="paisagem"][data-dispositivo="tablet"] .gdias{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
</style>

<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <h1>Família Fit</h1>
      <small>alimentação &amp; movimento</small>
    </div>
    <nav id="nav"></nav>
    <div class="hist">
      <button id="btn-undo" onclick="desfazer()" aria-label="Desfazer" disabled>↶</button>
      <button id="btn-redo" onclick="refazer()" aria-label="Refazer" disabled>↷</button>
      <button type="button" class="dica dica-e" id="dica-desfazer" aria-label="Explicação">i</button>
    </div>
    <button class="savest" id="savest" onclick="go('dados')" title="Ver dados e cópias de segurança"></button>
  </div>
</header>
<main id="main"></main>

<script>
/* ================= DADOS BASE ================= */
/* Desportos com três níveis de intensidade. Os valores são METs (equivalentes
   metabólicos) do Compendium of Physical Activities, na ordem leve / moderado /
   intenso. Onde a velocidade ou o terreno mandam mais do que o esforço sentido
   — ciclismo, corrida, caminhada — a dica indica o que cada nível representa. */
const NIVEIS=[['leve','Leve'],['moderado','Moderado'],['intenso','Intenso']];

/* Nos desportos em que a velocidade é que manda no esforço, o MET não se
   escolhe por níveis: lê-se de uma curva velocidade → MET, interpolada entre
   os pontos tabelados do Compendium. É isso que permite trocar os três níveis
   fixos por um slider contínuo de distância e velocidade. */
const CURVAS={
  andar:      [[3,2.3],[4,2.9],[4.8,3.3],[5.6,4.3],[6.4,5.0],[7.2,7.0],[8,8.3]],
  correr:     [[6.4,6.0],[8,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8],[16.1,14.5],[17.5,16.0],[19.3,19.0]],
  trail:      [[5,6.5],[7,8.5],[9,10.5],[11,12.5],[13,14.0],[15,16.0]],
  estrada:    [[10,4.0],[16,6.8],[19,8.0],[22.5,10.0],[26,12.0],[31,15.8],[35,17.0]],
  subida:     [[6,6.0],[9,8.0],[12,10.0],[15,12.0],[18,14.0],[22,16.0]],
  btt:        [[8,5.5],[12,7.5],[16,9.0],[20,11.0],[24,13.0],[28,15.0]],
  passeio:    [[8,3.5],[12,4.5],[16,6.8],[19,8.0],[22,9.5]],
  nadar:      [[1.5,5.3],[2,6.5],[2.5,8.0],[3,9.5],[3.5,10.5],[4.5,11.8]],
  remar:      [[4,4.0],[6,6.0],[8,8.5],[10,11.0],[12,12.5],[14,13.5]],
  patinar:    [[6,4.8],[8,5.5],[12,7.0],[16,9.0],[20,11.0],[26,12.5]]
};
/* Interpolação linear, com os extremos fixos fora da tabela. */
function metPorVelocidade(nome,v){
  const c=CURVAS[nome]; if(!c) return 0;
  if(v<=c[0][0]) return c[0][1];
  if(v>=c[c.length-1][0]) return c[c.length-1][1];
  for(let i=1;i<c.length;i++){
    if(v<=c[i][0]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
      return m0+(m1-m0)*(v-v0)/(v1-v0); }
  }
  return c[c.length-1][1];
}
/* O inverso: a que velocidade se atinge um dado MET. Serve para converter os
   registos antigos (horas + nível) sem lhes mudar as calorias. */
function velocidadeParaMet(dist,met){
  const c=CURVAS[dist.curva];
  let v=c[0][0];
  if(met>=c[c.length-1][1]) v=c[c.length-1][0];
  else if(met>c[0][1]){
    for(let i=1;i<c.length;i++){
      if(met<=c[i][1]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
        v = m1===m0 ? v0 : v0+(v1-v0)*(met-m0)/(m1-m0); break; }
    }
  }
  return Math.min(Math.max(v,dist.vmin),dist.vmax);
}
/* Definição da parte de distância: curva, limites do slider de velocidade,
   distância máxima semanal de referência e a unidade em que se diz o ritmo. */
function D(curva,vmin,vmax,vdef,vStep,maxSemana,ritmo){
  return {curva,vmin,vmax,vdef,vStep,maxSemana,ritmo:ritmo||null}; }
const CATS_SPORT=[['corrida','Corrida e caminhada'],['ciclismo','Ciclismo'],['agua','Água'],
  ['forca','Força e ginásio'],['corpo','Corpo e mente'],['bola','Bola'],['raquete','Raquete'],
  ['combate','Combate'],['natureza','Ar livre'],['danca','Dança']];
/* Ícones por categoria, usados nos títulos de secção em toda a app. */
const ICO_SPORT={corrida:'🏃',ciclismo:'🚴',agua:'🏊',forca:'🏋️',corpo:'🧘',bola:'⚽',
  raquete:'🎾',combate:'🥊',natureza:'⛰️',danca:'💃'};

const SPORT={}; SPORTS.forEach(s=>{ SPORT[s.id]=s; });
function nivelIndice(i){ const n=NIVEIS.findIndex(x=>x[0]===i); return n<0? 1 : n; }
function velocidade(s){ const sp=SPORT[s.s]; if(!sp||!sp.dist) return 0;
  const v=parseFloat(s.v); return isFinite(v)&&v>0 ? Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax) : sp.dist.vdef; }
/* Horas dentro do período escolhido: nos desportos de distância vêm de km ÷ velocidade. */
function horasPeriodo(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  if(sp.dist){ const v=velocidade(s); return v>0? (parseFloat(s.km)||0)/v : 0; }
  return parseFloat(s.h)||0; }
function metDe(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  return sp.dist ? metPorVelocidade(sp.dist.curva, velocidade(s)) : sp.mets[nivelIndice(s.i)]; }
/* Nos desportos de distância o nível deixa de se escolher: lê-se do MET. */
function nivelPorMet(sp,met){ return met < (sp.mets[0]+sp.mets[1])/2 ? 0
  : met < (sp.mets[1]+sp.mets[2])/2 ? 1 : 2; }
function rotuloNivel(sp,idx){ return NIVEIS[idx][1]+(sp && sp.dicas? ' ('+sp.dicas[idx]+')' : ''); }
/* Um registo válido para cada tipo de desporto. Os registos antigos de um
   desporto de distância (horas + nível) convertem-se para a velocidade que dá
   exatamente o mesmo MET, de modo que as calorias já calculadas não mudem. */
function normalizaDesporto(s){
  if(!s) return null;
  if(!temChave(SPORT,s.s)) return null;
  const sp=SPORT[s.s];
  const per=['dia','semana','mes'].indexOf(s.per)>=0 ? s.per : 'semana';
  if(sp.dist){
    let v=parseFloat(s.v), km=parseFloat(s.km), converter=false;
    if(!(isFinite(v)&&v>0) || !isFinite(km)){ v=velocidadeParaMet(sp.dist, sp.mets[nivelIndice(s.i)]); converter=true; }
    v=Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax);
    /* A velocidade assenta num passo do slider antes de gerar a distância,
       para as horas do registo antigo se manterem exatas. */
    v=Math.round(Math.round(v/sp.dist.vStep)*sp.dist.vStep*100)/100;
    if(converter) km=(parseFloat(s.h)||0)*v;
    return {s:sp.id, per, v, km:Math.max(0,Math.round(km*10)/10)};
  }
  return {s:sp.id, per, h:Math.max(0,parseFloat(s.h)||0),
    i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'};
}
function normalizaMembro(m){
  if(m && Array.isArray(m.desportos)) m.desportos=m.desportos.map(normalizaDesporto).filter(Boolean);
  /* migração: deriva o objetivo contínuo do antigo — o alvo kcal não muda */
  if(m && !Number.isFinite(m.objetivoPct)) m.objetivoPct=Math.round((GOALS[m.objetivo]?.[1]||0)*100);
  else if(m) sincronizaObjetivo(m);   /* e mantém o campo legado coerente */
  if(m) normalizaIdadeMeses(m);   /* corrige qualquer meses/idade que tenha ficado do lado errado da fronteira dos 2 anos */
  return m;
}
/* Faixa do slider de distância: depende do período, para não haver 400 km/dia. */
function faixaDist(sp,per){
  const sem=sp.dist.maxSemana;
  const max = per==='dia'? Math.ceil(sem/3) : per==='mes'? Math.round(sem*4.5) : sem;
  const step = max<=10? 0.25 : max<=60? 0.5 : max<=200? 1 : 5;
  return {max,step};
}
function nPT(v,casas){ return (Math.round(v*Math.pow(10,casas))/Math.pow(10,casas))
  .toFixed(casas).replace('.',','); }
function mmss(min){ if(!isFinite(min)||min<=0) return '—';
  let m=Math.floor(min), s=Math.round((min-m)*60); if(s===60){ m++; s=0; }
  return m+':'+String(s).padStart(2,'0'); }
function hmm(h){ const t=Math.round(h*60); if(!t) return '0 min';
  const H=Math.floor(t/60), M=t%60; return H? H+' h'+(M? ' '+String(M).padStart(2,'0')+' min':'') : M+' min'; }
function porLabel(per){ return per==='dia'?'dia': per==='mes'?'mês':'semana'; }
/* Velocidade com o ritmo correspondente, que é como corredores e nadadores pensam. */
function textoVelocidade(sp,v){
  const casas = sp.dist.vStep<0.5 ? 1 : 1;
  let t=nPT(v,casas)+' km/h';
  const r=sp.dist.ritmo;
  if(r && v>0){
    const porUnidade = r==='min/100m'? 60/v/10 : r==='min/500m'? 60/v/2 : 60/v;
    t+=' · '+mmss(porUnidade)+' '+r;
  }
  return t;
}

/* ================= COMPOSIÇÃO DOS INGREDIENTES =================
   Valores por 100 g ou 100 ml de parte edível. A fonte principal é a Tabela
   da Composição de Alimentos do Instituto Nacional de Saúde Doutor Ricardo
   Jorge (INSA/PortFIR, versão 7.1, 2026), descarregada da própria base e
   transcrita campo a campo — energia, hidratos de carbono, proteína, lípidos
   e fibra. Os ingredientes que a tabela portuguesa não cobre, por serem de
   uso recente ou importado (quinoa, couscous, tortilhas, granola, pesto,
   tahini, edamame, xarope de ácer, entre outros), ficam com valores do
   FoodData Central do USDA e estão assinalados.

   Uma convenção importa e é a portuguesa: os hidratos de carbono são os
   DISPONÍVEIS, sem a fibra, exatamente como num rótulo europeu, onde a fibra
   se declara à parte. Por isso o hidrato que conta para keto e low carb é o
   próprio valor, sem subtrair nada.

   Campos: k kcal, c hidratos, p proteína, f gordura, fib fibra, un gramas de
   uma unidade (um ovo, um dente de alho — 0 quando não se conta às unidades),
   s a secção do supermercado (índice de CATS, −1 quando não vem do INSA), u a
   unidade em que se mede.

   Duas limitações ditas em voz alta: são ingredientes crus, e cozinhar muda o
   peso (a massa absorve água, a carne perde-a); e não há aqui perdas nem
   ganhos de confeção. Para planear uma semana chega bem; para uma prescrição
   clínica, não. */
const NUTRI={};
function NI(nome,k,c,p,f,fib,un,sec,u){
  NUTRI[nome]={k,c,p,f,fib:fib||0,un:un||0,s:(sec===undefined?-1:sec),u:u||'g'};
}

/* Parte edível. Compram-se 350 g de mexilhões e comem-se cerca de 100: o
   resto é concha. A lista de compras precisa do peso que se paga na peixaria,
   os macros precisam do peso que entra no prato, e é só aqui que os dois se
   separam. Fatias na linha do que as tabelas de composição publicam como
   parte edível — peixe inteiro pouco mais de metade, bivalves um terço,
   frango com osso três quartos. Tudo o que não está aqui vale 1. */
const PC_EDIVEL={
  'Mexilhões':0.30, 'Amêijoas':0.30, 'Camarão':0.55,
  'Sardinhas':0.55, 'Carapau':0.55, 'Cavala':0.55, 'Truta':0.58,
  'Dourada':0.52, 'Robalo':0.52,
  'Coxas de frango':0.75, 'Asas de frango':0.65, 'Costeletas de borrego':0.68
};
/* Converte uma linha de receita em gramas comestíveis. Devolve null quando não
   sabe — e quem chama tem de dizer isso a quem está a escrever a receita, em
   vez de somar zero e apresentar um total que parece completo. */
function gramasDe(nome,q,u){
  const n=NUTRI[nome]; if(!n) return null;
  const quant=parseFloat(q)||0;
  const pc=temChave(PC_EDIVEL,nome)? PC_EDIVEL[nome] : 1;
  if(u==='g'||u==='ml') return quant*pc;
  return n.un? quant*n.un*pc : null;
}
function macrosDeIngredientes(lista,doses){
  const d=Math.max(1,parseFloat(doses)||1);
  let k=0,c=0,p=0,f=0,fib=0; const semDados=[];
  (lista||[]).forEach(x=>{
    const nome=x[0], g=gramasDe(nome,x[1],x[2]), n=NUTRI[nome];
    if(g===null||!n){ semDados.push(nome); return; }
    k+=n.k*g/100; c+=n.c*g/100; p+=n.p*g/100; f+=n.f*g/100; fib+=n.fib*g/100;
  });
  const r1=v=>Math.round(v/d*10)/10;
  return {k:Math.round(k/d), c:r1(c), p:r1(p), f:r1(f), fib:r1(fib), semDados};
}

   Isto não é uma preferência alimentar: é uma questão de saúde, e por isso a

   declaração obrigatória do anexo II do Regulamento (UE) n.º 1169/2011, na

   não existe lista nacional própria — aplica-se diretamente o anexo II do

   portuguesa e o pinhão não estão lá — e o amendoim é categoria à parte,
   porque é uma leguminosa.

   Isto ajuda a planear; não substitui ler o rótulo de cada embalagem, nem

/* AVISO A QUEM EDITAR ESTA TABELA: uma chave repetida num literal de objeto
   não dá erro — a última cala a primeira, e um alergénio desaparece em
   silêncio. Já aconteceu aqui: 'Picles de pepino' ficou declarado duas vezes
   e os sulfitos evaporaram-se. A bateria de testes verifica as repetições
   sobre o próprio ficheiro; ao acrescentar um nome, procura-o primeiro. */
const _atribIng=Object.create(null);
function atributosIng(nome){
  if(nome in _atribIng) return _atribIng[nome];
  let t;
  if(temChave(ING_EXCECAO,nome)) t=ING_EXCECAO[nome].slice();
  else { t=[]; ING_REGRAS.forEach(([tag,re])=>{ if(re.test(nome)) t.push(tag); }); }
  _atribIng[nome]=t; return t;
}

/* ================= DIETAS DE CADA RECEITA =================
   Keto, low carb e low fat não se etiquetam à mão: são contas, e uma conta
   feita à mão desalinha-se do prato mais cedo ou mais tarde. Derivam-se dos
   próprios números da receita, e por isso não podem mentir. Mediterrânica,
   paleo e vegetariana continuam declaradas — são critérios de composição, não
   de aritmética — mas a vegetariana é verificada contra os ingredientes: uma
   receita com carne perde a etiqueta mesmo que a tenha escrita. */
const GORD_TETO_LOWFAT=0.30;
const DIETA_VETA={ vegetariana:['carne','peixe','crustaceos','moluscos'],
                   vegan:['carne','peixe','crustaceos','moluscos','lacticinio','ovo','mel'],
                   paleo:['gluten','lacticinio','leguminosa','cereal'] };
const DIETAS_NUM=['keto','lowcarb','lowfat'];
function dietasDaReceita(r){
  /* Vegetariana, vegan e paleo derivam-se SÓ dos ingredientes — nem sequer se
     aceita a declaração, porque a declaração pode mentir e os ingredientes
     não. Sobra a mediterrânica, que é um estilo e não uma exclusão, e por
     isso continua a ser declarada em cada receita. */
  const DERIVADAS=['vegetariana','vegan','paleo'];
  const d=r.d.filter(x=>DIETAS_NUM.indexOf(x)<0 && DERIVADAS.indexOf(x)<0
    && !(DIETA_VETA[x]||[]).some(t=>r.at.indexOf(t)>=0));
  DERIVADAS.forEach(x=>{ if(!DIETA_VETA[x].some(t=>r.at.indexOf(t)>=0)) d.push(x); });
  if(hcLiq(r)<=HC_TETO.keto) d.push('keto');
  if(hcLiq(r)<=HC_TETO.lowcarb) d.push('lowcarb');
  if(r.f*9<=r.k*GORD_TETO_LOWFAT) d.push('lowfat');
  return d;
}
/* Os macros de cada receita são recalculados a partir dos ingredientes, com a
   mesma função que serve as receitas escritas por quem usa a app. Os números
   que estão escritos em cada R() eram estimativas à mão, e estavam
   sistematicamente baixos — uma quiche com 80 g de massa quebrada e 80 ml de
   natas não são 510 kcal, são perto do dobro. Ficam como recurso: se algum
   ingrediente perder a composição, é melhor um valor aproximado do que um
   total incompleto que parece exato. */
RECIPES.forEach(r=>{
  const m=macrosDeIngredientes(r.i,1);
  if(!m.semDados.length){
    r.k=m.k; r.c=Math.round(m.c); r.p=Math.round(m.p); r.f=Math.round(m.f); r.fib=Math.round(m.fib);
  }
  const s=[]; r.i.forEach(x=>atributosIng(x[0]).forEach(t=>{ if(s.indexOf(t)<0) s.push(t); }));
  r.at=s;
});
RECIPES.forEach(r=>{ r.dc=dietasDaReceita(r); });

/* ================= O QUE UM MEMBRO NÃO COME =================
   Duas origens, uma lista: o que a pessoa declarou (alergia, intolerância,
   escolha) e o que a dieta implica — quem come vegetariano não come carne
   nem peixe, esteja isso escrito ou não. */
/* dietaDe() devolve o objeto com as percentagens; para procurar por chave é
   preciso a chave, saneada — um valor estragado numa cópia importada não pode
   fazer com que nada seja compatível com ninguém. */
function chaveDieta(m){
  if(!m) return 'equilibrada';
  return m.dieta==='personalizada'? 'personalizada' : (temChave(DIETS,m.dieta)? m.dieta : 'equilibrada');
}
function restricoesDe(m){
  const base=Array.isArray(m.restricoes)? m.restricoes.filter(k=>temChave(RESTR,k)) : [];
  const dieta=DIETA_VETA[chaveDieta(m)]||[];
  return base.concat(dieta.filter(t=>base.indexOf(t)<0));
}
function ingredientesVetados(r,m){
  const veta=restricoesDe(m); if(!veta.length) return [];
  return r.i.filter(x=>atributosIng(x[0]).some(t=>veta.indexOf(t)>=0)).map(x=>x[0]);
}
/* Separa o que é alergia do que é escolha: a mensagem, a cor e a insistência
   não podem ser as mesmas. Devolve, por alergénio, os ingredientes que o
   trazem — dizer «contém glúten: Pão rústico» é mais útil, e mais verificável,
   do que dizer «não compatível». */
function alergenicosDe(r,m){
  const veta=restricoesDe(m).filter(ehAlergenio);
  const out=[];
  veta.forEach(t=>{
    const itens=r.i.filter(x=>atributosIng(x[0]).indexOf(t)>=0).map(x=>x[0]);
    if(itens.length) out.push({tag:t, nome:RESTR[t].n, itens});
  });
  return out;
}
function avisoAlergia(r,membros){
  const linhas=[];
  (membros||[]).forEach(m=>{
    const al=alergenicosDe(r,m);
    if(al.length) linhas.push(esc(m.nome.split(' ')[0])+': '+al.map(a=>a.nome.toLowerCase()+' ('+a.itens.map(esc).join(', ')+')').join('; '));
  });
  if(!linhas.length) return '';
  return `<div class="alerta"><span aria-hidden="true">🚨</span><span>Alergénio — ${linhas.join(' · ')}</span></div>`;
}
function toggleRestricao(mid,k){
  const m=S.members.find(x=>x.id===mid); if(!m||!temChave(RESTR,k)) return;
  if(!Array.isArray(m.restricoes)) m.restricoes=[];
  const i=m.restricoes.indexOf(k);
  i>=0? m.restricoes.splice(i,1) : m.restricoes.push(k);
  save('restrições de '+m.nome); render();
}

/* ================= ESCALA DAS QUANTIDADES =================
   A receita é escrita para uma pessoa. Tudo o que a mostra a uma mesa —
   sugestão, plano, lista de compras — multiplica pelo número de comensais,
   e este é o único sítio onde essa multiplicação acontece. */
function escalaIngredientes(r,n){
  const q=Math.max(1,n||1);
  return r.i.map(([nome,quant,un])=>({n:nome, q:quant*q, u:un}));
}
function fmtQtd(quant,un){
  const q=Math.round(quant*100)/100;
  if(un==='g'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' kg';
  if(un==='ml'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' L';
  return nPT(q, Number.isInteger(q)?0:(Number.isInteger(q*10)?1:2))+' '+un;
}
function textoEscala(r,n){
  return escalaIngredientes(r,n).map(x=>esc(x.n)+' '+fmtQtd(x.q,x.u)).join(' · ');
}

/* ================= TETO CALÓRICO POR REFEIÇÃO =================
   Cada refeição tem a sua fatia do dia (25% ao pequeno-almoço, 35% ao almoço,
   e por aí). Uma receita que sozinha ultrapasse essa fatia com folga não serve
   àquela pessoa naquele lugar do dia — é comida a mais, não é uma questão de
   gosto. A folga de 10% existe porque uma dose não é um instrumento de
   medida. Bebés não entram: comem do módulo de alimentação infantil. */
const FOLGA_TETO=1.10;
function fatiaRefeicao(mk){ const m=MEALS.find(x=>x[0]===mk); return m? m[2] : 0.30; }
function tetoRefeicao(m,mk){ return targetKcal(m)*fatiaRefeicao(mk)*FOLGA_TETO; }
function contaTeto(m){ return faseDe(m)!=='bebe' && !semEstimativa(m); }
/* Dose sugerida para quem tem um teto abaixo da receita: a criança não come a
   mesma quantidade que o pai, e dizer isso é mais honesto do que esconder a
   receita toda. */
function doseSugerida(m,r,mk){
  if(!contaTeto(m)||!r.k) return 1;
  return clampNum(Math.round(tetoRefeicao(m,mk)/r.k*10)/10, 0.3, 1.5);
}

/* ================= AVALIAÇÃO DE UMA RECEITA PARA UMA MESA =================
   Devolve sempre o porquê, nunca só um sim ou não: a lista de sugestões
   mostra quantas receitas caíram por cada motivo, e sem isso ninguém percebe
   porque é que uma família de quatro só tem três jantares possíveis. */
function avaliaReceita(r,membros,mk,comTeto){
  const fora={dieta:[],ingredientes:[],calorias:[]};
  membros.forEach(m=>{
    if(!compat(r,chaveDieta(m))) fora.dieta.push(m);
    const veto=ingredientesVetados(r,m);
    if(veto.length) fora.ingredientes.push({m,itens:veto});
    if(comTeto && contaTeto(m) && r.k>tetoRefeicao(m,mk)) fora.calorias.push({m,teto:Math.round(tetoRefeicao(m,mk))});
  });
  const motivo = fora.dieta.length? 'dieta' : fora.ingredientes.length? 'ingredientes'
    : fora.calorias.length? 'calorias' : null;
  return {ok:!motivo, motivo, fora};
}


/* ================= DESPENSA =================
   O catálogo é sempre derivado das 84 receitas — nunca texto livre. Isso
   garante que um nome na despensa bate sempre certo, byte a byte, com um
   nome de ingrediente de receita: sem correspondência aproximada, sem
   "Azeite" a não bater com "azeite". */
/* O catálogo é a tabela de composição inteira, não só o que as receitas da
   biblioteca usam: quem escreve uma receita em casa precisa de escolher entre
   tudo o que existe, e tudo o que existe tem composição para calcular. */
let _catalogo=null;
function catalogoIngredientes(){
  if(!_catalogo) _catalogo=Object.keys(NUTRI).sort((a,b)=>a.localeCompare(b,'pt'));
  return _catalogo;
}
/* A despensa guarda ingredientes e suplementos com a mesma chave — o nome —
   por isso o catálogo que a valida tem de conhecer os dois. Os suplementos
   são declarados depois, daí a leitura preguiçosa. */
function catalogoDespensa(){
  const s=typeof SUPLEMENTOS!=='undefined'? SUPLEMENTOS.map(x=>x.nome) : [];
  return catalogoIngredientes().concat(s);
}
function temNaDespensa(nome){ return !!S.despensa[nome]; }
function disponibilidadeReceita(r){
  const total=r.i.length, tem=r.i.filter(x=>temNaDespensa(x[0])).length;
  return {tem, total, pronta: total>0 && tem===total};
}
/* Lista de ingredientes com o estado da despensa — usada em qualquer sítio
   que mostre uma receita, não só no separador Receitas. */
function listaIngredientesComEstado(r,n){
  const q=Math.max(1,parseInt(n,10)||1);
  return r.i.map(([nome,quant,u])=>{
    const tem=temNaDespensa(nome);
    return `<span class="ingr ${tem?'tem':'falta'}"><i aria-hidden="true">${tem?'✓':'✗'}</i>${esc(nome)}
      <b>${fmtQtd(quant*q,u)}</b></span>`;
  }).join('');
}

   O instantâneo guarda só os dados; a navegação e as preferências de ecrã
   ficam de fora, para desfazer nunca saltar de separador sozinho. Como o
   save() corre depois da alteração, o que se empilha é o estado anterior —

const UNDO_MAX=30;

function instantaneo(){ return JSON.stringify({members:S.members, cheats:S.cheats, plans:S.plans,

function desfazer(){

}

let _toastT=null;

/* ================= CÁLCULOS ================= */
function bmi(m){ const h=m.altura/100; return h>0? m.peso/(h*h) : 0; }
function bmiClass(v){ return v<18.5?['Abaixo do peso','warn']: v<25?['Peso normal','ok']: v<30?['Excesso de peso','warn']:['Obesidade','bad']; }

/* ===== FASES DA VIDA =====
   As fórmulas de adulto não servem para crianças nem para a gravidez. Cada
   fase traz a sua equação, a sua faixa de macros e os seus limites de esforço.
   Referências: IOM/DRI (2002/2005), Schofield (1985), IOM/NRC (2009),
   OMS (2020) e ACOG (Practice Bulletin 804/231). São valores de referência
   populacional, não prescrição — a app di-lo em cada ecrã onde importa. */
function idadeMeses(m){ return Number.isFinite(m.meses)? m.meses : (parseFloat(m.idade)||0)*12; }
function idadeAnos(m){ return idadeMeses(m)/12; }
/* Dois anos é o valor mínimo medido em anos; abaixo disso mede-se sempre em
   meses (0-24). Esta função é o único sítio que decide a fronteira e mantém
   m.meses/m.idade coerentes entre si — chamada em qualquer caminho que mude
   a idade (edição direta, sliders, escolha de fase, importação), para a
   representação nunca ficar presa no lado errado da fronteira. */
function normalizaIdadeMeses(m){
  if(Number.isFinite(m.meses)){
    m.meses=clampNum(Math.round(m.meses),0,24);
    if(m.meses>=24){ m.idade=2; delete m.meses; }
    else m.idade=m.meses/12;
  } else if((parseFloat(m.idade)||0)<2){
    m.meses=clampNum(Math.round((parseFloat(m.idade)||0)*12),0,24);
    m.idade=m.meses/12;
  }
}
function gravida(m){ return m.sexo==='f' && !!m.gravida && idadeAnos(m)>=12; }
function fetos(m){ return clampNum(Math.round(parseFloat(m.fetos)||1),1,3); }
function trimestre(m){ return clampNum(Math.round(parseFloat(m.trimestre)||1),1,3); }
function faseDe(m){
  const a=idadeAnos(m);
  if(a<2) return 'bebe';
  if(a<13) return 'crianca';
  if(a<19) return 'adolescente';
  return 'adulto';
}
const FASES={bebe:'Bebé',crianca:'Criança',adolescente:'Adolescente',adulto:'Adulto'};
function nomeFase(m){ return gravida(m)? (FASES[faseDe(m)]+' · grávida') : FASES[faseDe(m)]; }
/* O peso de referência da grávida é o pré-gestacional: é sobre ele que as
   recomendações são construídas. O peso atual serve para acompanhar o ganho. */
function pesoRef(m){ const p=parseFloat(m.pesoPre);
  return gravida(m) && isFinite(p) && p>0 ? p : m.peso; }
/* Metabolismo basal: Schofield abaixo dos 19 anos, Mifflin-St Jeor a partir
   daí — os perfis adultos que já existiam mantêm o valor exato. */
function bmr(m){
  const a=idadeAnos(m), p=pesoRef(m), f=m.sexo==='f';
  if(a<19){
    if(a<3)  return f? 58.317*p-31.1 : 59.512*p-30.4;
    if(a<10) return f? 20.315*p+485.9 : 22.706*p+504.3;
    return   f? 13.384*p+692.6 : 17.686*p+658.2;
  }
  /* pesoRef é o peso do próprio, exceto na gravidez, onde é o pré-gestacional */
  return f ? 10*p+6.25*m.altura-5*m.idade-161 : 10*p+6.25*m.altura-5*m.idade+5;
}
/* Energia de crescimento, que só existe enquanto o corpo está a crescer. */
function crescimentoKcal(m){
  const meses=idadeMeses(m), a=meses/12;
  if(meses<4) return 175;
  if(meses<7) return 56;
  if(meses<13) return 22;
  if(a<3) return 20;
  if(a<9) return 20;
  if(a<19) return 25;
  return 0;
}
/* Incremento da gravidez (IOM/DRI): nada no 1.º trimestre, +340 no 2.º,
   +452 no 3.º. Para gémeos não há DRI — usa-se um acréscimo declarado como
   aproximação. Para trigémeos não existe valor defensável e a app recusa-se
   a inventar um. */
function gravidezKcal(m){
  if(!gravida(m)) return 0;
  const t=trimestre(m), n=fetos(m);
  const base = t===1? 0 : t===2? 340 : 452;
  if(n===1) return base;
  if(n===2) return base===0? 0 : base+350;
  return 0;   /* trigémeos: sem estimativa — ver avisoGravidez() */
}
function semEstimativa(m){ return gravida(m) && fetos(m)>=3; }
function tdee(m){ return bmr(m)*(temChave(BASE_ACT,m.atividade)?BASE_ACT[m.atividade][1]:1.2)
  + sportsKcalDay(m) + commuteKcalDay(m) + crescimentoKcal(m) + gravidezKcal(m); }
/* Faixas de distribuição de macronutrientes aceitáveis (AMDR, IOM/DRI).
   Abaixo dos 12 meses não estão definidas — não se aplicam percentagens. */
function amdrDe(m){
  const a=idadeAnos(m);
  if(a<1) return null;
  if(a<4)  return {c:[45,65],p:[5,20], f:[30,40]};
  if(a<19) return {c:[45,65],p:[10,30],f:[25,35]};
  return {c:[45,65],p:[10,35],f:[20,35]};
}
/* Proteína de referência em g por kg de peso e por dia. */

  if(gravida(m)) return 1.1;

function ulMicro(m){
  const a=idadeAnos(m), meses=idadeMeses(m);
  if(gravida(m)) return {vitD:100,ferro:45,calcio:2500,magnesio:350,folato:1000,vitC:2000,zinco:40,b12:null,omega3:null};
  if(meses<7)  return {vitD:25,ferro:40,calcio:1000,magnesio:null,folato:null,vitC:null,zinco:4,b12:null,omega3:null};
  if(meses<13) return {vitD:38,ferro:40,calcio:1500,magnesio:null,folato:null,vitC:null,zinco:5,b12:null,omega3:null};
  if(a<4)  return {vitD:63,ferro:40,calcio:2500,magnesio:65,folato:300,vitC:400,zinco:7,b12:null,omega3:null};
  if(a<9)  return {vitD:75,ferro:40,calcio:2500,magnesio:110,folato:400,vitC:650,zinco:12,b12:null,omega3:null};
  if(a<14) return {vitD:100,ferro:40,calcio:3000,magnesio:350,folato:600,vitC:1200,zinco:23,b12:null,omega3:null};
  if(a<19) return {vitD:100,ferro:45,calcio:3000,magnesio:350,folato:800,vitC:1800,zinco:34,b12:null,omega3:null};
  return {vitD:100,ferro:45,calcio:2500,magnesio:350,folato:1000,vitC:2000,zinco:40,b12:null,omega3:null};
}
function suplementosDe(m){
  return (m.suplementos||[]).filter(s=>s&&temChave(SUPL,s.s)&&(parseFloat(s.doses)||0)>0);
}
/* O que os suplementos acrescentam por dia — macros e micronutrientes. */
function totalSuplementos(m){
  const t={kcal:0,c:0,p:0,f:0,micros:{}};
  suplementosDe(m).forEach(s=>{
    const sp=SUPL[s.s], d=parseFloat(s.doses)||0;
    t.kcal+=sp.kcal*d; t.c+=sp.c*d; t.p+=sp.p*d; t.f+=sp.f*d;
    Object.keys(sp.micros).forEach(k=>{ t.micros[k]=(t.micros[k]||0)+sp.micros[k]*d; });
  });
  return t;
}
/* Quanto de cada macro fica a cargo da comida, depois de descontar os
   suplementos: é este o número que interessa a quem vai cozinhar. */
function macrosRestantes(m){
  const alvo=macros(m), sup=totalSuplementos(m);
  return {c:Math.max(0,Math.round(alvo.c-sup.c)), p:Math.max(0,Math.round(alvo.p-sup.p)),
    f:Math.max(0,Math.round(alvo.f-sup.f)), kcal:Math.max(0,Math.round(targetKcal(m)-sup.kcal))};
}
/* Micronutrientes acima do limite superior tolerável — o aviso que justifica
   a existência desta tabela. */
function excessosMicro(m){
  const t=totalSuplementos(m).micros, ul=ulMicro(m), fora=[];
  MICROS.forEach(([k,nome,un])=>{
    if(ul[k]!=null && t[k]!=null && t[k]>ul[k]) fora.push({k,nome,un,valor:t[k],ul:ul[k]});
  });
  return fora;
}

/* ===== NUTRIÇÃO DO BEBÉ =====
   Peso para a idade, percentis 3/15/50/85/97, em quilogramas. Valores
   transcritos das "Simplified field tables — Weight-for-age" oficiais da
   OMS (WHO Child Growth Standards, 2006) — cdn.who.int/.../sft-wfa-boys-p-0-5.pdf
   e .../sft-wfa-girls-p-0-5.pdf. Entre os meses tabelados interpola-se. */
const WHO_MESES=[0,3,6,9,12,15,18,21,24];
const WHO_PESO={
  m:[[2.5,2.9,3.3,3.9,4.3],[5.1,5.6,6.4,7.2,7.9],[6.4,7.1,7.9,8.9,9.7],[7.2,7.9,8.9,10.0,10.9],
     [7.8,8.6,9.6,10.8,11.8],[8.4,9.2,10.3,11.6,12.7],[8.9,9.7,10.9,12.3,13.5],
     [9.3,10.3,11.5,13.0,14.3],[9.8,10.8,12.2,13.7,15.1]],
  f:[[2.4,2.8,3.2,3.7,4.2],[4.6,5.1,5.8,6.7,7.4],[5.8,6.4,7.3,8.3,9.2],[6.6,7.3,8.2,9.3,10.4],
     [7.1,7.9,8.9,10.2,11.3],[7.7,8.5,9.6,10.9,12.2],[8.2,9.0,10.2,11.6,13.0],
     [8.7,9.6,10.9,12.4,13.8],[9.2,10.1,11.5,13.1,14.6]]
};
const PERCENTIS=[3,15,50,85,97];
function pesosPercentis(sexo,meses){
  const t=WHO_PESO[sexo==='f'?'f':'m'], x=clampNum(meses,0,24);
  let i=0; while(i<WHO_MESES.length-2 && x>WHO_MESES[i+1]) i++;
  const a=WHO_MESES[i], b=WHO_MESES[i+1], r=(b>a)?(x-a)/(b-a):0;
  return t[i].map((v,k)=>v+(t[i+1][k]-v)*r);
}
/* Percentil aproximado do peso atual, por interpolação entre as curvas. */
function percentilDe(m){
  const v=pesosPercentis(m.sexo,idadeMeses(m)), p=m.peso;
  if(p<=v[0]) return {p:3,abaixo:true};
  if(p>=v[4]) return {p:97,acima:true};
  for(let i=1;i<v.length;i++) if(p<=v[i]){
    const r=(v[i]-v[i-1])>0? (p-v[i-1])/(v[i]-v[i-1]) : 0;
    return {p: PERCENTIS[i-1]+(PERCENTIS[i]-PERCENTIS[i-1])*r}; }
  return {p:97};
}
function textoPercentil(m){
  const q=percentilDe(m);
  if(q.abaixo) return 'abaixo do percentil 3';
  if(q.acima) return 'acima do percentil 97';
  return 'percentil '+Math.round(q.p);
}
/* Doses diárias de referência para bebés e crianças pequenas. Fontes:
   energia — IOM, "Dietary Reference Intakes for Energy, Carbohydrate,
   Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino Acids" (2002/
   2005), equação de EER para lactentes/1-3 anos; proteína, hidratos,
   gordura e água — mesmo relatório; ferro — IOM (2001), "...Iron...";
   cálcio e vitamina D — IOM, "Dietary Reference Intakes for Calcium and
   Vitamin D" (2011). A vitamina D SOBE de 10 para 15 µg (400→600 UI)
   exatamente na transição de lactente (AI, 0-12 meses) para 1-3 anos
   (RDA) — não é um valor único para toda a primeira infância. */
function ddrBebe(m){
  const meses=idadeMeses(m), p=m.peso;
  const kcal=(89*p-100)+crescimentoKcal(m);
  let prot,hc,gord,agua,ferro,calcio,vitD;
  if(meses<7){ prot=1.52*p; hc=60; gord=31; agua=700; ferro=0.27; calcio=200; vitD=10; }
  else if(meses<13){ prot=1.2*p; hc=95; gord=30; agua=800; ferro=11; calcio=260; vitD=10; }
  else { prot=1.05*p; hc=130; gord=kcal*0.35/9; agua=1300; ferro=7; calcio=700; vitD=15; }
  return {kcal:Math.round(kcal), prot:Math.round(prot*10)/10, hc:Math.round(hc),
    gord:Math.round(gord), agua, ferro, calcio, vitD};
}
/* Leite: 67 kcal por 100 mL — o padrão clássico de 20 kcal/oz (AAP), dentro
   do intervalo regulatório do Codex Alimentarius CXS 72-1981 e do consenso
   ESPGHAN (Koletzko et al., 2005) de 60-70 kcal/100 mL para fórmulas de
   início; valor médio de referência, não um número exato — a composição
   real varia por marca e, no leite materno, por fase da lactação. */
const KCAL_100ML=67;
/* Volume de referência em ml por kg e por dia: não é um patamar único, e
   decresce com a idade à medida que entram os sólidos. Âncoras a partir de
   HealthyChildren.org/AAP (150-180 ml/kg/dia nos primeiros 2 meses,
   decrescendo) e de dados de ingestão real de leite materno (IABLE/
   lacted.org: ~135 ml/kg/dia ao 1.º mês, ~126 aos 3, ~107 aos 6 meses).
   Interpola-se entre âncoras; o aviso soa a 35% de desvio do valor central,
   para não gerar falsos alarmes numa referência que já é aproximada. */
const ANCORAS_MLKG=[[0,160],[1,150],[3,125],[6,108],[9,98],[12,90],[24,90]];
function volumeRefMlKg(meses){
  const a=ANCORAS_MLKG; let i=0; while(i<a.length-2 && meses>a[i+1][0]) i++;
  const [m0,v0]=a[i], [m1,v1]=a[i+1], r=(m1>m0)?(meses-m0)/(m1-m0):0;
  return v0+(v1-v0)*r;
}
const MODOS_LEITE={materno:'Leite materno',formula:'Fórmula',misto:'Misto',solidos:'Leite + sólidos'};
function bebeCfg(m){
  const meses=idadeMeses(m);
  const d=m.bebe||{};
  const modo = MODOS_LEITE[d.modo]? d.modo : (meses<6?'materno':'solidos');
  const tomadasPad = meses<1?8 : meses<3?7 : meses<6?6 : meses<9?5 : 4;
  const pctPad = meses<6?100 : meses<9?70 : meses<13?55 : 35;
  return {
    modo,
    tomadas: clampNum(Math.round(parseFloat(d.tomadas)||tomadasPad),1,12),
    intervalo: clampNum(parseFloat(d.intervalo)||3,2,6),
    inicio: clampNum(parseFloat(d.inicio)||7,0,11.5),
    pctLeite: clampNum(Math.round(parseFloat(d.pctLeite)||pctPad),0,100),
    ml: Number.isFinite(parseFloat(d.ml))? clampNum(Math.round(parseFloat(d.ml)),20,300) : null
  };
}
/* Volume de leite: por omissão parte das 150 mL por kg e por dia, referência
   habitual para lactentes de termo, ajustada pela fatia de energia que ainda
   vem do leite quando já há sólidos. */
function leiteBebe(m){
  const c=bebeCfg(m), ddr=ddrBebe(m);
  const kcalLeite=ddr.kcal*c.pctLeite/100;
  const mlAlvo=Math.round(kcalLeite/KCAL_100ML*100);
  const mlPorTomada = c.ml!=null? c.ml : Math.round(mlAlvo/c.tomadas/5)*5;
  const mlTotal=mlPorTomada*c.tomadas;
  return {cfg:c, ddr, mlAlvo, mlPorTomada, mlTotal,
    kcalTotal:Math.round(mlTotal*KCAL_100ML/100),
    pctDDR: ddr.kcal>0? Math.round(mlTotal*KCAL_100ML/100/ddr.kcal*100) : 0,
    mlPorKg: m.peso>0? Math.round(mlTotal/m.peso) : 0 };
}
function horasTomadas(m){
  const c=bebeCfg(m), out=[];
  for(let i=0;i<c.tomadas;i++) out.push((c.inicio + i*c.intervalo) % 24);
  return out;
}
function hhmm24(h){ const t=Math.round(h*60), H=Math.floor(t/60)%24, M=t%60;
  return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'); }
function sportWeeklyH(s){ const h=horasPeriodo(s);
  return s.per==='dia'? h*7 : s.per==='mes'? h/4.345 : h; }
function sportsKcalDay(m){ return (m.desportos||[]).reduce((t,s)=> t + metDe(s)*m.peso*sportWeeklyH(s), 0)/7; }
function commuteKcalDay(m){ return (COMMUTE[m.desloc]?.[1]||0)*m.peso*(5/7); }
function clampNum(v,a,b){ return Math.min(Math.max(v,a),b); }
/* Validar com OBJ[chave] deixava passar nomes herdados do Object.prototype:
   uma dieta chamada "constructor" passava a lista branca e dava macros NaN. */
function temChave(o,k){ return typeof k==='string' && Object.prototype.hasOwnProperty.call(o,k); }
/* E o regex de data aceitava 2026-99-99, que gerava uma semana «NaN-NaN-NaN»
   de onde não se saía. Só passa uma data que exista mesmo. */
function dataValida(s){
  if(typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d=new Date(s+'T12:00:00');
  return !isNaN(d.getTime()) && iso(d)===s;
}
/* Objetivo em percentagem contínua do gasto (−25…+20). Para dados antigos,
   deriva-se dos fatores de GOALS — perder=−15, manter=0, ganhar=+10 — pelo
   que o alvo calórico migrado fica bit a bit igual ao anterior. */
function objetivoPct(m){ return Number.isFinite(m.objetivoPct)? clampNum(Math.round(m.objetivoPct),-25,20)
  : Math.round((GOALS[m.objetivo]?.[1]||0)*100); }
function rotuloObjetivo(m){ const p=objetivoPct(m);
  if(p===0) return 'Manter peso';
  const sinal=(p>0?'+':'−')+Math.abs(p)+' %';
  return (p<=-8? 'Perder peso (' : p>=5? 'Ganhar massa (' : 'Manter peso (')+sinal+')'; }
function targetKcal(m){
  let p=objetivoPct(m);
  if(!permiteDefice(m) && p<0) p=0;   /* sem défice em crianças e na gravidez */
  return tdee(m)*(1+p/100); }
/* A dieta lida SEMPRE por aqui: para presets devolve o objeto de DIETS
   (gramas inalteradas); «personalizada» usa os macros do próprio membro. */
function dietaDe(m){
  if(m.dieta==='personalizada'){ const mc=m.macros;
    const ok=mc && [mc.c,mc.p,mc.f].every(v=>Number.isFinite(v)&&v>=0) && Math.round(mc.c+mc.p+mc.f)===100;
    return Object.assign({n:'Personalizada'}, ok? {c:mc.c,p:mc.p,f:mc.f} : {c:50,p:20,f:30}); }
  return temChave(DIETS,m.dieta)? DIETS[m.dieta] : DIETS.equilibrada; }
/* A dieta escolhida é ajustada à faixa AMDR da fase antes de virar gramas:
   uma dieta cetogénica a 5 % de hidratos não se aplica a uma criança de 7
   anos, e em vez de a app fingir que sim, encosta à faixa e diz que o fez. */
function exigeAmdr(m){ return faseDe(m)!=='adulto' || gravida(m); }
function macrosAjustados(m){
  const d=dietaDe(m), faixa=amdrDe(m);
  /* Num adulto que não está grávido, a faixa é informação e a escolha é dele —
     uma dieta cetogénica continua a ser cetogénica. Só se encosta à faixa onde
     o plano é para outra pessoa em crescimento, ou para uma gravidez. */
  if(!faixa || !exigeAmdr(m)) return {c:d.c,p:d.p,f:d.f,n:d.n,ajustado:false};
  const c0=clampNum(d.c,faixa.c[0],faixa.c[1]);
  const p0=clampNum(d.p,faixa.p[0],faixa.p[1]);
  const f0=clampNum(d.f,faixa.f[0],faixa.f[1]);
  const ajustado = c0!==d.c || p0!==d.p || f0!==d.f;
  if(!ajustado) return {c:d.c,p:d.p,f:d.f,n:d.n,ajustado:false};
  /* Encostar cada macro à faixa deixa a soma fora dos 100; a diferença é
     distribuída pelos macros que ainda têm folga dentro da própria faixa,
     em vez de reescalar tudo — assim o resultado continua dentro da faixa. */
  const v={c:c0,p:p0,f:f0};
  for(let it=0; it<12; it++){
    const dif=100-(v.c+v.p+v.f);
    if(Math.abs(dif)<0.005) break;
    const folga=k=> dif>0 ? faixa[k][1]-v[k] : v[k]-faixa[k][0];
    const total=['c','p','f'].reduce((t,k)=>t+Math.max(0,folga(k)),0);
    if(total<=0) break;
    ['c','p','f'].forEach(k=>{ const fl=Math.max(0,folga(k)); if(fl>0) v[k]+=dif*fl/total; });
  }
  const r=normaliza100(v);
  return {c:r.c,p:r.p,f:r.f,n:d.n,ajustado:true};
}
function macros(m){ const d=macrosAjustados(m), k=targetKcal(m);
  return {c:Math.round(k*d.c/100/4), p:Math.round(k*d.p/100/4), f:Math.round(k*d.f/100/9), pct:d}; }
function compat(r,dieta){ return dieta==='equilibrada' || dieta==='personalizada' || r.dc.includes(dieta); }
function compatAll(r,ms){ return ms.every(m=>compat(r,chaveDieta(m)) && !ingredientesVetados(r,m).length); }
/* Limites e recomendações de esforço por fase. Não existe teto de MET
   reconhecido para crianças, por isso não se inventa nenhum: o que se limita
   é o que a evidência sustenta — a intensidade na gravidez, o volume semanal
   em idade pediátrica e as modalidades de risco. */
const RISCO_QUEDA=['esqui','patinagem','escalada','btt','ciclismoMontanha','ciclismo','ciclismoPasseio','surf','trail'];
const RISCO_CONTACTO=['futebol','futsal','basquete','andebol','artes','boxe','volei'];
function limitesEsforco(m){
  const a=idadeAnos(m), meses=idadeMeses(m), g=gravida(m), fase=faseDe(m);
  const out={fase, nivelMax:null, evitar:[], notas:[], recomendacao:''};
  if(g){
    out.nivelMax='moderado';
    out.evitar=RISCO_QUEDA.concat(RISCO_CONTACTO).concat(['funcional']);
    out.recomendacao='Pelo menos 150 minutos por semana de atividade moderada, repartidos por 3 ou mais dias.';
    out.notas.push('Intensidade pelo teste da conversa: se não consegues falar, abranda.');
    if(trimestre(m)>=2) out.notas.push('A partir do 2.º trimestre, evita exercícios deitada de costas.');
    if(fetos(m)===2 && trimestre(m)===3) out.notas.push('Numa gestação gemelar, a partir das 28 semanas o exercício moderado passa a exigir aval médico.');
    if(fetos(m)>=3) { out.nivelMax='leve';
      out.notas.push('Numa gestação de trigémeos, o exercício moderado a vigoroso é desaconselhado — só com indicação da equipa que te segue.'); }
    return out;
  }
  if(meses<12){ out.recomendacao='Várias vezes ao dia, brincadeira ativa no chão — nada de desporto estruturado.';
    out.evitar=SPORTS.map(s=>s.id); return out; }
  if(a<3){ out.recomendacao='Pelo menos 180 minutos por dia de atividade de qualquer intensidade, espalhados pelo dia.';
    out.evitar=SPORTS.map(s=>s.id).filter(id=>['caminhada','danca','natacao'].indexOf(id)<0); return out; }
  if(a<5){ out.recomendacao='Pelo menos 180 minutos por dia, dos quais 60 de atividade moderada a vigorosa.';
    out.evitar=['boxe','musculacao','funcional','intervalos','squash']; return out; }
  if(a<13){ out.recomendacao='Uma média de 60 minutos por dia de atividade moderada a vigorosa, com reforço muscular e ósseo em 3 ou mais dias por semana.';
    out.evitar=['boxe'];
    out.horasMax=Math.round(a);   /* horas de desporto organizado por semana ≤ idade */
    out.notas.push('Como referência, as horas de desporto organizado por semana não deviam passar a idade em anos ('+Math.round(a)+' h), com 1 a 2 dias de descanso.');
    out.notas.push('Treino de força só com supervisão e cargas leves: séries de 6 a 15 repetições, nunca levantamentos máximos.');
    return out; }
  if(a<19){ out.recomendacao='Uma média de 60 minutos por dia de atividade moderada a vigorosa, com reforço muscular e ósseo em 3 ou mais dias por semana.';
    out.evitar=['boxe'];
    out.notas.push('Levantamentos máximos só depois de completado o crescimento; até lá, técnica antes de carga.');
    return out; }
  out.recomendacao='150 a 300 minutos por semana de atividade moderada, ou 75 a 150 de atividade vigorosa, mais reforço muscular em 2 ou mais dias.';
  return out;
}
function minutosSemana(m){ return (m.desportos||[]).reduce((t,s)=>t+sportWeeklyH(s)*60,0); }
function gastoPartes(m){ const b=bmr(m);
  return {basal:b, dia:b*((temChave(BASE_ACT,m.atividade)?BASE_ACT[m.atividade][1]:1.2)-1),
    desloc:commuteKcalDay(m), desp:sportsKcalDay(m),
    extra:crescimentoKcal(m)+gravidezKcal(m), total:tdee(m)}; }
/* kg por semana implicados pelo objetivo (positivo = a perder), a 7700 kcal/kg. */
function ritmoSemanal(m){ return (tdee(m)-targetKcal(m))*7/7700; }
/* Projeção iterativa: o gasto recalcula-se com o peso de cada semana, pelo que
   a curva achata à medida que o corpo muda — mais honesta do que uma reta. */
function projecaoPeso(m,sem){ sem=sem||12; const out=[Math.round(m.peso*10)/10]; const c=Object.assign({},m);
  for(let i=0;i<sem;i++){ c.peso=Math.max(30, c.peso+(targetKcal(c)-tdee(c))*7/7700); out.push(Math.round(c.peso*10)/10); }
  return out; }
/* Escala linear com clamp — o utilitário de todos os gráficos. */
function sx(v,d0,d1,x0,x1){ if(d1===d0) return x0; const t=clampNum((v-d0)/(d1-d0),0,1); return x0+t*(x1-x0); }
/* Reparte {c,p,f} por 100 inteiros pelo método do maior resto — determinístico,
   a soma nunca dá 99 nem 101. */
function normaliza100(o){
  const brutos=['c','p','f'].map(k=>Math.max(0,parseFloat(o&&o[k])||0));
  const soma=brutos[0]+brutos[1]+brutos[2]||1;
  const exatos=brutos.map(v=>v/soma*100), base=exatos.map(v=>Math.floor(v));
  let falta=100-(base[0]+base[1]+base[2]);
  const ordem=[0,1,2].sort((a,b)=>(exatos[b]-base[b])-(exatos[a]-base[a]));
  for(let i=0;i<falta;i++) base[ordem[i%3]]++;
  return {c:base[0],p:base[1],f:base[2]};
}

/* ================= DATAS ================= */
function mondayISO(d){ d=new Date(d); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekDates(wk){ const out=[]; const d=new Date(wk+'T12:00:00'); for(let i=0;i<7;i++){ out.push(iso(d)); d.setDate(d.getDate()+1);} return out; }
const DAYN=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
/* kcal planeadas de um membro num dia da semana atual + estado qualitativo.
   A MESMA função alimenta o gráfico do resumo e os pontos dos cartões-dia,
   para os dois nunca divergirem. Dias incompletos nunca são julgados. */
function kcalPlaneadasDia(m,di,dates){
  if(isCheat(m.id,dates[di])) return {cheat:true,kcal:0,refs:0};
  const w=S.plans[S.week]||{}; let kcal=0,refs=0;
  MEALK.forEach(mk=>{ const meal=w[di]&&w[di][mk]; if(!meal||!meal.r||meal.m.indexOf(m.id)<0) return;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) return; kcal+=r.k; refs++;
    /* o acompanhamento come-se com o prato: as calorias dele contam no dia,
       mas não conta como refeição — um arroz de tomate não é um jantar */
    const ac=meal.ac && RECIPES.find(x=>x.id===meal.ac); if(ac) kcal+=ac.k; });
  return {cheat:false,kcal,refs};
}
function estadoDia(m,di,dates){
  const d=kcalPlaneadasDia(m,di,dates);
  if(d.cheat) return Object.assign({st:'cheat'},d);
  if(!d.refs) return Object.assign({st:'vazio'},d);
  if(d.refs<MEALK.length) return Object.assign({st:'incompleto'},d);
  const alvo=targetKcal(m), dv=alvo>0? Math.abs(d.kcal-alvo)/alvo : 1;
  return Object.assign({st: dv<=0.10?'ok': dv<=0.25?'warn':'bad'},d);
}

function isCheat(mid,date){ return (S.cheats[mid]||[]).includes(date); }

function aplicarTema(){
  const r=document.documentElement, modo=modoEfetivo();

  r.setAttribute('data-modo',modo);

     não vem da media query, as metas estáticas deixariam de bater certo */

  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',bg));

function pintaAura(){
  let a=document.getElementById('aura');
  const cores=S.members.slice(0,5).map(avColor);
  if(!a){ a=document.createElement('div'); a.id='aura'; a.className='aura'; a.setAttribute('aria-hidden','true');
    const h=document.querySelector('header'); if(h) h.insertBefore(a,h.firstChild); }
  if(!cores.length){ a.style.background='none'; return; }
  const paradas=cores.map((c,i)=>{
    const x=cores.length===1? 50 : Math.round(i/(cores.length-1)*100);
    return `radial-gradient(circle at ${x}% 0%, ${c}55, transparent 62%)`;
  });
  a.style.background=paradas.join(',');
}
/* Cartões colapsáveis: o template só marca data-col="chave"; a estrutura do
   cabeçalho e o corpo dobrável são montados aqui, depois de cada render. */
function montaColapsaveis(){
  document.querySelectorAll('#main .card[data-col]').forEach(card=>{
    const chave=card.getAttribute('data-col');
    if(card.querySelector(':scope > .card-cab')) return;
    const tit=card.querySelector(':scope > h2, :scope > h3');
    if(!tit) return;
    const cab=document.createElement('div'); cab.className='card-cab';
    card.insertBefore(cab,tit); cab.appendChild(tit);
    const corpo=document.createElement('div'); corpo.className='card-corpo';
    while(cab.nextSibling) corpo.appendChild(cab.nextSibling);
    card.appendChild(corpo);
    const fechado=!!(S.ui.colapsados||{})[chave];
    const b=document.createElement('button');
    b.type='button'; b.className='col-btn';
    b.setAttribute('aria-expanded', String(!fechado));
    b.setAttribute('aria-label', fechado?'Abrir secção':'Fechar secção');
    b.innerHTML='<span class="chev">▾</span>';
    cab.appendChild(b);
    if(fechado) card.classList.add('col-fechado');
    const alterna=e=>{ e.preventDefault(); e.stopPropagation();
      if(!S.ui.colapsados) S.ui.colapsados={};
      const agora=!card.classList.contains('col-fechado');
      card.classList.toggle('col-fechado',agora);
      if(agora) S.ui.colapsados[chave]=true; else delete S.ui.colapsados[chave];
      b.setAttribute('aria-expanded',String(!agora));
      b.setAttribute('aria-label', agora?'Abrir secção':'Fechar secção');
      saveMeta();
    };
    b.addEventListener('click',alterna);
    /* clicar no título também dobra, mas não se o clique foi num explicador */
    cab.addEventListener('click',e=>{ if(e.target.closest('.dica')||e.target.closest('.col-btn')) return; alterna(e); });
  });
}

function upd(id,field,val,num){ const m=S.members.find(x=>x.id===id); if(!m) return;
  /* ao entrar na dieta personalizada, semeiam-se os macros com os da dieta
     anterior — a barra de macros não salta */
  if(field==='dieta' && val==='personalizada' && m.dieta!=='personalizada' && !m.macros){
    const d=dietaDe(m); m.macros={c:d.c,p:d.p,f:d.f};
  }
  m[field]=num?parseFloat(val)||0:val;
  if(field==='idade'||field==='meses'){
    normalizaIdadeMeses(m);   /* decide meses vs anos e ajusta a fronteira dos 2 anos */
    /* mudar de idade repõe a fatia de leite e o volume nos padrões do escalão */
    if(m.bebe){ delete m.bebe.pctLeite; m.bebe.ml=null; }
  }
  const rot={peso:'peso',altura:'altura',idade:'idade',dieta:'dieta',sexo:'sexo',nome:'nome',
    atividade:'nível de atividade',desloc:'deslocação',gravida:'gravidez',meses:'idade'}[field];
  save(rot? rot+' de '+m.nome : null); render(); }

/* ===== RESUMO MENSAL NARRADO =====
   Um retrato dos últimos 30 dias escrito em prosa, a partir do que está
   registado. Só afirma o que os dados sustentam: a variação de peso, por
   exemplo, só existe para quem tem um objetivo a decorrer, porque é aí que
   há um peso inicial guardado — a app não tem histórico de pesagens. */
function dadosMes(){
  const hoje=new Date(), semanas=[];
  for(let i=0;i<5;i++){ const d=new Date(hoje); d.setDate(d.getDate()-7*i); semanas.push(mondayISO(d)); }
  let refs=0, diasCompletos=0, diasComAlgo=0, cheats=0;
  const porReceita={};
  semanas.forEach(wk=>{
    const sem=S.plans[wk]; if(!sem) return;
    for(let di=0;di<7;di++){
      const dia=sem[di]; if(!dia) continue;
      let n=0;
      MEALK.forEach(mk=>{ const r=dia[mk]; if(r&&r.r){ n++; refs++;
        porReceita[r.r]=(porReceita[r.r]||0)+1; } });
      if(n) diasComAlgo++;
      if(n===MEALK.length) diasCompletos++;
    }
  });
  const limite=new Date(hoje); limite.setDate(limite.getDate()-30);
  Object.values(S.cheats||{}).forEach(arr=>(arr||[]).forEach(d=>{
    const dt=new Date(d+'T12:00:00'); if(dt>=limite&&dt<=hoje) cheats++; }));
  const topo=Object.entries(porReceita).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([id,n])=>{ const r=RECIPES.find(x=>x.id===id); return r? {nome:r.n,n}:null; }).filter(Boolean);
  const concluidos=(S.objetivos||[]).filter(o=>o.concluido&&o.dataConclusao
    && new Date(o.dataConclusao)>=limite);
  const ativos=(S.objetivos||[]).filter(o=>!o.concluido);
  return {refs,diasCompletos,diasComAlgo,cheats,topo,concluidos,ativos,semanas:semanas.length};
}
function narrativaMes(){
  const d=dadosMes(), n=S.members.length, frases=[];
  const nomes=S.members.map(m=>m.nome.split(' ')[0]);
  const lista=a=>a.length<=1? (a[0]||'') : a.slice(0,-1).join(', ')+' e '+a[a.length-1];
  frases.push(`Nas últimas cinco semanas a casa foi de <b>${lista(nomes)}</b>${n>1?', '+plural(n,'pessoa','pessoas')+' a planear juntas':''}.`);
  if(d.refs){
    frases.push(`Foram planeadas <span class="destaque">${plural(d.refs,'refeição','refeições')}</span> em ${plural(d.diasComAlgo,'dia','dias')}`
      + (d.diasCompletos? `, ${plural(d.diasCompletos,'deles com o dia completo','deles com o dia completo')}.` : ', ainda nenhum com as quatro refeições preenchidas.'));
  } else {
    frases.push('Ainda não há refeições planeadas neste período — o plano semanal está à espera.');
  }
  if(d.topo.length){
    frases.push(`À mesa repetiu-se sobretudo <b>${esc(d.topo[0].nome)}</b>`
      + (d.topo.length>1? `, seguida de ${lista(d.topo.slice(1).map(t=>esc(t.nome)))}.` : '.'));
  }
  if(d.cheats) frases.push(`Houve ${plural(d.cheats,'dia livre','dias livres')} marcados — aniversários e festas contam-se, não se escondem.`);
  /* atividade: soma dos minutos semanais registados, que é o que a app sabe */
  const minutos=S.members.map(m=>({nome:m.nome.split(' ')[0], min:Math.round(minutosSemana(m))})).filter(x=>x.min>0);
  if(minutos.length){
    const total=minutos.reduce((t,x)=>t+x.min,0);
    const mais=minutos.slice().sort((a,b)=>b.min-a.min)[0];
    frases.push(`Em movimento, a família tem <span class="destaque">${hmm(total/60)} por semana</span> registados, com <b>${mais.nome}</b> à frente (${hmm(mais.min/60)}).`);
  } else {
    frases.push('Não há desporto registado — vale a pena inscrever o que já se faz, nem que seja a caminhada até ao trabalho.');
  }
  /* peso: só para quem tem objetivo, porque é o único sítio com peso inicial */
  const evol=d.ativos.map(o=>{ const m=S.members.find(x=>x.id===o.membroId); if(!m) return null;
    const dif=Math.round((m.peso-o.pesoInicial)*10)/10;
    return {nome:m.nome.split(' ')[0], dif, tipo:o.tipo}; }).filter(Boolean);
  evol.forEach(e=>{
    if(Math.abs(e.dif)<0.2) frases.push(`<b>${e.nome}</b> está no mesmo peso desde que começou o objetivo.`);
    else if((e.tipo==='perder'&&e.dif<0)||(e.tipo==='ganhar'&&e.dif>0))
      frases.push(`<b>${e.nome}</b> vai no bom caminho: <span class="destaque">${e.dif>0?'+':'−'}${nPT(Math.abs(e.dif),1)} kg</span> desde o início do objetivo.`);
    else frases.push(`<b>${e.nome}</b> está ${e.dif>0?'+':'−'}${nPT(Math.abs(e.dif),1)} kg face ao início — o rumo ainda não é o pretendido, e isso também é informação.`);
  });
  if(d.concluidos.length){
    const q=d.concluidos.map(o=>{ const m=S.members.find(x=>x.id===o.membroId); return m? m.nome.split(' ')[0]:null; }).filter(Boolean);
    frases.push(`🏆 ${plural(d.concluidos.length,'Um objetivo foi atingido','Objetivos atingidos')} neste período${q.length?', por '+lista(q):''}. Fica registado nas Conquistas.`);
  }
  const semDespensa=Object.keys(S.despensa||{}).length;
  if(semDespensa) frases.push(`Na despensa há <b>${plural(semDespensa,'item marcado','itens marcados')}</b> como disponíveis, o que já poupa passos na lista de compras.`);
  return frases.join(' ');
}
