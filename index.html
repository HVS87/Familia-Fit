<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestão de alimentação e fitness para toda a família — perfis, calorias, macros por dieta, receitas, plano semanal com cheat days e lista de compras.">
<meta name="color-scheme" content="light dark">
<meta name="author" content="Família Fit">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Família Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Família Fit — Alimentação & Movimento</title>
<style>
/* ===== TEMAS =====
   O modo (claro/escuro) é resolvido em JavaScript e escrito em data-modo,
   em vez de depender da media query. Assim as paletas precisam de metade
   das regras: cada uma declara só as suas cores em claro e em escuro, sem
   ter de repetir tudo por causa de prefers-color-scheme. O data-theme
   antigo continua a funcionar como sinónimo, para não partir nada. */
/* Os tons de texto foram todos passados pelo cálculo de contraste da WCAG: no
   modo claro, cada cor que serve de TEXTO chega aos 4,5:1 contra o fundo onde
   assenta — a pill de aviso contra o seu próprio tom a 16%, o número de
   calorias contra o cartão, a etiqueta cinzenta contra o fundo. Eram
   diferenças de 2 a 9% de luminosidade, invisíveis ao lado, decisivas para
   quem lê. */
:root, html[data-modo="claro"]{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#232930; --mut:#646C76; --line:#E4E1D8;
  --accent:#2456A6; --accent-soft:#E8EEF8; --energy:#AA541A; --energy-soft:#F8EDE2;
  --party:#BC4578; --party-soft:#FCF2F7;
  --ok:#297047; --warn:#7F5C0E; --bad:#AD392E;
  --mc:#8E6020; --mp:#2456A6; --mf:#7C5CB0;
  /* A tinta que assenta POR CIMA do acento. Em claro o acento é escuro e pede
     branco; em escuro é claro e pede tinta escura. Sem este token, a regra do
     texto do botão tinha de olhar para o modo — e era isso que fazia o botão
     fantasma e o botão de perigo, que não têm fundo nenhum, herdarem a tinta
     do botão cheio e desaparecerem contra o cartão. */
  --on-accent:#FFFFFF;
  --shadow:0 1px 3px rgba(35,41,48,.07),0 4px 14px rgba(35,41,48,.05);
  --r:14px;
  /* A identidade tipográfica: serifa editorial nos títulos e nos números de
     destaque, UI de sistema disciplinada em todo o resto. Sem fontes
     externas — o CSP não deixa e o offline agradece. */
  --fonte-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --fonte-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  /* Superfícies: --inset é o rebaixo onde vivem campos e estatísticas,
     --elev a folha que flutua. Derivam da tinta e do fundo, por isso vestem
     as seis paletas sem uma regra que seja por paleta. */
  --hh:58px; --r-sm:10px; --inset:var(--bg); --elev:var(--card);
  /* Sem isto, o browser desenha o que não está estilizado — links, barras de
     deslocamento, campos nativos — com os tons do modo do SISTEMA, que pode
     ser o oposto do modo escolhido na app. Era o que punha links azuis-claros
     de modo escuro sobre o fundo claro da paleta Brasa. */
  color-scheme:light;
}
@supports (background:color-mix(in srgb,red 50%,blue)){
  :root{ --inset:color-mix(in srgb,var(--ink) 4%,var(--bg));
         --elev:color-mix(in srgb,var(--card) 92%,var(--ink)); }
}
html[data-modo="escuro"], :root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2229; --ink:#E8EAED; --mut:#96A0AA; --line:#2A323B;
  --accent:#7BA7E8; --accent-soft:#22304A; --energy:#E09550; --energy-soft:#3A2C1D;
  --party:#E38AA8; --party-soft:#3D2430;
  --ok:#5FBF8A; --warn:#D9B04A; --bad:#E88C7D;
  --mc:#DCA84F; --mp:#7BA7E8; --mf:#A98BD8;
  --on-accent:#10151B;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
/* --- Alecrim: verdes de horta, neutros com um travo de azeitona --- */
html[data-paleta="alecrim"]{
  --bg:#F4F5F0; --card:#FFFFFF; --ink:#23291F; --mut:#626C63; --line:#E0E4D8;
  --accent:#3E7845; --accent-soft:#E7F0E6; --energy:#946123; --energy-soft:#F6EEE0;
  --party:#9D5A81; --party-soft:#FAF2F7; --mp:#3E7845;
}
html[data-paleta="alecrim"][data-modo="escuro"]{
  --bg:#151A15; --card:#1D241D; --ink:#E7EAE4; --mut:#98A497; --line:#2C352C;
  --accent:#79C083; --accent-soft:#23331F; --energy:#D9A05C; --energy-soft:#352A1B;
  --party:#D493B6; --party-soft:#372631; --mp:#79C083;
}
/* --- Figo: roxos e magentas, neutros levemente ameixa --- */
html[data-paleta="figo"]{
  --bg:#F6F3F6; --card:#FFFFFF; --ink:#28222C; --mut:#6D6672; --line:#E5DEE6;
  --accent:#6B4396; --accent-soft:#EDE6F6; --energy:#AA4F3C; --energy-soft:#F8E9E5;
  --party:#B23D74; --party-soft:#F8E6EE; --mp:#6B4396; --mf:#B23D74;
}
html[data-paleta="figo"][data-modo="escuro"]{
  --bg:#17141A; --card:#211C25; --ink:#EAE5EC; --mut:#9F97A6; --line:#332C38;
  --accent:#B392E0; --accent-soft:#2C2140; --energy:#E08A72; --energy-soft:#3A2823;
  --party:#DE86AF; --party-soft:#3C2432; --mp:#B392E0; --mf:#DE86AF;
}
/* --- Maré: azuis-esverdeados de água, neutros frios --- */
html[data-paleta="mare"]{
  --bg:#F1F5F5; --card:#FFFFFF; --ink:#1F2A2C; --mut:#5F6E70; --line:#DBE4E4;
  --accent:#0F6E78; --accent-soft:#E0F0F1; --energy:#A85426; --energy-soft:#F7ECE2;
  --party:#9A4E8C; --party-soft:#F3E7F1; --mp:#0F6E78;
}
html[data-paleta="mare"][data-modo="escuro"]{
  --bg:#101819; --card:#182123; --ink:#E3EBEC; --mut:#8FA1A3; --line:#263234;
  --accent:#5FC2CC; --accent-soft:#123336; --energy:#DE9560; --energy-soft:#372A1F;
  --party:#CE8CC2; --party-soft:#332431; --mp:#5FC2CC;
}
/* --- Brasa: laranjas e vermelhos quentes, neutros de barro --- */
html[data-paleta="brasa"]{
  --bg:#F7F3F0; --card:#FFFFFF; --ink:#2B2320; --mut:#75695F; --line:#E8DED6;
  --accent:#B04E1E; --accent-soft:#FAEAE0; --energy:#87681B; --energy-soft:#F5F0DE;
  --party:#B03F5C; --party-soft:#F9E7EA; --mp:#B04E1E; --mc:#8A6A1C;
}
html[data-paleta="brasa"][data-modo="escuro"]{
  --bg:#1A1512; --card:#241D19; --ink:#EDE6E1; --mut:#A6968A; --line:#352B25;
  --accent:#E8895A; --accent-soft:#3B2418; --energy:#D4B45E; --energy-soft:#332C18;
  --party:#DE8298; --party-soft:#3A242A; --mp:#E8895A; --mc:#D4B45E;
}
/* --- Tinta: monocromático de alto contraste, para quem quer sossego --- */
html[data-paleta="tinta"]{
  --bg:#F4F4F4; --card:#FFFFFF; --ink:#1A1A1A; --mut:#666666; --line:#DEDEDE;
  --accent:#2B2B2B; --accent-soft:#E6E6E6; --energy:#5C5C5C; --energy-soft:#EDEDED;
  --party:#6F6F6F; --party-soft:#F6F6F6; --mc:#707070; --mp:#2B2B2B; --mf:#5C5C5C;
}
html[data-paleta="tinta"][data-modo="escuro"]{
  --bg:#121212; --card:#1C1C1C; --ink:#F0F0F0; --mut:#9A9A9A; --line:#2E2E2E;
  --accent:#E4E4E4; --accent-soft:#2E2E2E; --energy:#B0B0B0; --energy-soft:#282828;
  --party:#9A9A9A; --party-soft:#262626; --mc:#9A9A9A; --mp:#E4E4E4; --mf:#B0B0B0;
}
/* --- Contraste: para quem vê mal ou vê pouca cor. Todos os pares de texto
       chegam a 7:1 (AAA), o traço dos ícones engrossa e as séries dos
       gráficos passam a distinguir-se por padrão, não só por cor. --- */
html[data-paleta="contraste"]{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --mut:#3A3A3A; --line:#6E6E6E;
  --accent:#0033A0; --accent-soft:#DCE4F7; --energy:#7A2E00; --energy-soft:#F6E6DC;
  --party:#6B004B; --party-soft:#F7DFEF;
  --ok:#00552B; --warn:#5F4200; --bad:#960000;
  --mc:#5F4200; --mp:#0033A0; --mf:#6B004B;
  --on-accent:#FFFFFF; --shadow:0 0 0 1px #6E6E6E;
}
html[data-paleta="contraste"][data-modo="escuro"]{
  --bg:#000000; --card:#0E0E0E; --ink:#FFFFFF; --mut:#CFCFCF; --line:#7A7A7A;
  --accent:#9CC4FF; --accent-soft:#141F31; --energy:#FFB870; --energy-soft:#2B1E12;
  --party:#FFA5C8; --party-soft:#2E1520;
  --ok:#71E8A4; --warn:#FFD75E; --bad:#FF9E8E;
  --mc:#FFD75E; --mp:#9CC4FF; --mf:#FFA5C8;
  --on-accent:#000000; --shadow:0 0 0 1px #7A7A7A;
}
html[data-paleta="contraste"] .ico,
html[data-paleta="contraste"] .svgfx{ stroke-width:2.4 }
html[data-paleta="contraste"] :focus-visible{outline-width:3px}
html[data-paleta="contraste"] .btn,
html[data-paleta="contraste"] .chip{min-height:44px}

/* ===== DENSIDADE =====
   No primeiro mês os espaços ensinam; ao sexto atrapalham. «Cerrado» aperta
   por variáveis e por umas quantas regras, sem tocar nos alvos de toque da
   barra do polegar — só o conteúdo compacta. */
html[data-densidade="cerrado"]{ --r:11px; --r-sm:8px }
html[data-densidade="cerrado"] body{font-size:14px;line-height:1.45}
html[data-densidade="cerrado"] .card{padding:12px 14px}
html[data-densidade="cerrado"] h2{font-size:18.5px}
html[data-densidade="cerrado"] h3{font-size:15px}
html[data-densidade="cerrado"] .stat{padding:6px 9px;min-width:82px}
html[data-densidade="cerrado"] .stat b{font-size:19px}
html[data-densidade="cerrado"] .card--capa .stat b{font-size:21px}
html[data-densidade="cerrado"] .reg-linha{padding:4px 0}
html[data-densidade="cerrado"] .val-item{padding:7px 9px;margin-top:6px}
html[data-densidade="cerrado"] .fita-dia{margin-bottom:9px}
html[data-densidade="cerrado"] .meal{padding:8px 10px}
html[data-densidade="cerrado"] .spline{padding:10px 12px}

/* ===== LÁPIS E TINTA =====
   O princípio que organiza os dados desta app — plano é intenção, registo é
   realidade — passa a ler-se sem uma palavra: o que está só planeado desenha-
   se a lápis sobre papel quadriculado; o que foi confirmado passa a tinta. */
.a-lapis{border-style:dashed !important;
  background-image:
    repeating-linear-gradient(0deg, color-mix(in srgb,var(--line) 55%,transparent) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(90deg, color-mix(in srgb,var(--line) 55%,transparent) 0 1px, transparent 1px 13px);
  background-size:13px 13px}
.a-lapis .mtitle{color:var(--mut)}
.a-tinta{border-style:solid;border-color:color-mix(in srgb,var(--ink) 26%,var(--line));
  background-image:none}
.a-tinta .mtitle{color:var(--ink)}
.a-tinta .kcal{font-family:var(--fonte-display)}
@supports not (background:color-mix(in srgb,red 50%,blue)){
  .a-lapis{background-image:none}
  .a-tinta{border-color:var(--ink)}
}
/* Fita-cola no canto das receitas da casa: um caderno tem coisas coladas. */
.fita-cola{position:absolute;top:-7px;right:14px;width:44px;height:16px;pointer-events:none;
  background:color-mix(in srgb,var(--energy) 22%,transparent);
  border-left:1px solid color-mix(in srgb,var(--energy) 34%,transparent);
  border-right:1px solid color-mix(in srgb,var(--energy) 34%,transparent);
  transform:rotate(-2deg)}

/* ===== O CARIMBO =====
   Validar é o gesto mais repetido: ganha meio segundo de tinta a assentar. */
.carimbo{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:26px;height:26px;color:var(--ok);transform:rotate(-7deg)}
.carimbo svg{width:100%;height:100%}
.carimbo.falhou{color:var(--bad)} .carimbo.adiado{color:var(--warn)}
@media (prefers-reduced-motion: no-preference){
  .carimbo-novo svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:carimbar .34s ease-out forwards}
  .carimbo-novo{animation:assentar .34s ease-out}
  @keyframes carimbar{ to{ stroke-dashoffset:0 } }
  @keyframes assentar{ from{ transform:rotate(-7deg) scale(1.5); opacity:.2 } }
}

/* ===== VIRAR DE FOLHA ===== */
@media (prefers-reduced-motion: no-preference){
  html[data-anim="on"] main.vira-frente{animation:folha-frente .18s ease-out}
  html[data-anim="on"] main.vira-tras{animation:folha-tras .18s ease-out}
  @keyframes folha-frente{ from{ opacity:.35; transform:translateX(14px) } }
  @keyframes folha-tras{ from{ opacity:.35; transform:translateX(-14px) } }
}

/* ===== MESA CHEIA ===== */
.mesa-cheia{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.mesa-cheia svg{width:30px;height:22px;flex:none}
.mesas-semana{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mesa-dia{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut)}
.mesa-dia svg{width:34px;height:24px}

/* ===== PROSA EDITORIAL ===== */
.capitular::first-letter{font-family:var(--fonte-display);font-size:3.1em;line-height:.84;
  float:left;margin:2px 8px 0 0;color:var(--accent);font-weight:700}
.spark{display:inline-block;vertical-align:-0.15em;width:34px;height:12px;margin:0 2px}
.ornamento{display:block;margin:10px auto 0;width:96px;height:14px;color:var(--sazonal,var(--accent));opacity:.85}

/* ===== CARIMBOS DE CONQUISTA ===== */
.selo{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:76px;height:76px;flex:none;color:var(--party);transform:rotate(-6deg)}
.selo svg{width:100%;height:100%}
.selo-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:var(--fonte-display);font-weight:700;font-size:11px;
  line-height:1.1;text-align:center;padding:0 10px;color:var(--party)}
.selo-txt small{font-size:8.5px;font-weight:600;letter-spacing:.04em;opacity:.9}

/* ===== BALANÇA ===== */
.balanca{width:100%;max-width:320px;height:118px;display:block;margin:6px auto 0}

/* ===== FOLHA INFERIOR =====
   A folha de mesa e o registo rápido vivem colados ao polegar, não no meio do
   ecrã: é com o telemóvel numa mão e a travessa na outra que se usam. */
.folha{position:fixed;inset:auto 0 0 0;z-index:62;background:var(--card);
  border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;box-shadow:var(--elev);
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;
  max-width:560px;margin:0 auto}
.folha-pega{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
@media (prefers-reduced-motion: no-preference){
  .folha{animation:folha-sobe .2s ease-out}
  @keyframes folha-sobe{ from{ transform:translateY(24px); opacity:0 } }
}
/* Lugares à mesa: um por comensal, do tamanho de um dedo. */
.lugares{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lugar{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;min-height:76px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);cursor:pointer;
  padding:8px 6px;font:600 12px/1.2 var(--fonte-ui);color:var(--mut)}
.lugar.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.lugar .lg-vst{height:14px;color:var(--ok)}
.lugar.off .lg-vst{visibility:hidden}

/* ===== BOTÃO DE REGISTO SEMPRE À MÃO ===== */
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));z-index:39;
  bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--accent);color:var(--on-accent);border:none;border-radius:999px;
  min-height:52px;padding:0 20px;font:700 15px/1 var(--fonte-ui);cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.22);display:inline-flex;align-items:center;gap:8px}
html[data-dispositivo="telefone"][data-orient="retrato"] .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.fab:hover{filter:brightness(1.06)}

/* ===== MODO SUPERMERCADO ===== */
.mercado{position:fixed;inset:0;z-index:64;background:var(--bg);overflow:auto;
  padding:0 0 calc(24px + env(safe-area-inset-bottom))}
.mercado-topo{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 16px calc(12px);display:flex;align-items:center;gap:10px}
.mercado-sec{position:sticky;top:56px;z-index:1;background:var(--bg);padding:12px 16px 6px;
  font:700 13px/1 var(--fonte-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.mercado ul{list-style:none;padding:0 12px;margin:0}
.mercado li{margin:0 0 6px}
.mercado label{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 14px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);cursor:pointer;font-size:17px}
.mercado li.done label{background:var(--bg);color:var(--mut);text-decoration:line-through;
  text-decoration-color:var(--ok);text-decoration-thickness:2px}
.mercado input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.mercado .q{margin-left:auto;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;flex:none}

/* ===== DESLIZAR PARA VALIDAR ===== */
.desliza{position:relative;touch-action:pan-y}
.desliza-fundo{position:absolute;inset:0;border-radius:var(--r-sm);display:flex;align-items:center;
  padding:0 16px;font-weight:700;font-size:13px;pointer-events:none;opacity:0}
.desliza-fundo.sim{background:color-mix(in srgb,var(--ok) 22%,var(--card));color:var(--ok);justify-content:flex-start}
.desliza-fundo.nao{background:color-mix(in srgb,var(--warn) 22%,var(--card));color:var(--warn);justify-content:flex-end}
.desliza-corpo{position:relative;background:var(--bg);border-radius:var(--r-sm)}
@media (prefers-reduced-motion: no-preference){ .desliza-corpo.volta{transition:transform .16s ease-out} }

/* ===== MODO COZINHA ===== */
.cozinha{position:fixed;inset:0;z-index:66;background:var(--bg);display:flex;flex-direction:column}
.cozinha-topo{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--line);flex:none}
.cozinha-corpo{flex:1;overflow:auto;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;
  max-width:640px;margin:0 auto;width:100%}
.coz-t{font-size:clamp(24px,6vw,34px);margin-bottom:10px}
.coz-d{font-size:clamp(17px,4.4vw,21px);line-height:1.5}
.coz-ing{list-style:none;padding:0;margin:0}
.coz-ing li{margin-bottom:8px}
.coz-ing label{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 14px;font-size:17px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);cursor:pointer}
.coz-ing li.done label{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--ok)}
.coz-ing input{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.cozinha-fundo{display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);flex:none}
.cozinha-fundo .btn{min-height:50px}
/* Um botão inativo diz-se com a cor, não com transparência: assim continua a
   ler-se, e o contraste do texto não depende do estado do botão. */
.btn.inativo{color:var(--mut);border-color:var(--line);cursor:default}
.btn.inativo:hover{color:var(--mut);border-color:var(--line)}

/* ===== TEMPORIZADORES ===== */
.timers{position:fixed;z-index:67;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;
  padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));pointer-events:none;flex-wrap:wrap}
html[data-dispositivo="telefone"][data-orient="retrato"] .timers{bottom:calc(70px + env(safe-area-inset-bottom))}
.timer{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:0;
  background:var(--elev);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;
  box-shadow:var(--shadow);min-height:44px;color:var(--ink)}
.timer b{font:700 15px/1.1 var(--fonte-display);font-variant-numeric:tabular-nums}
.timer span{font-size:10px;color:var(--mut)}
.timer.pronto{background:var(--ok);border-color:var(--ok);color:#fff}
.timer.pronto span{color:#fff;opacity:.85}
@media (prefers-reduced-motion: no-preference){ .timer.pronto{animation:pisca 1s ease-in-out infinite}
  @keyframes pisca{ 50%{ filter:brightness(1.25) } } }

/* ===== DA ÉPOCA E CONVIDADOS ===== */
.tag.epoca{border-color:var(--ok);color:var(--ok)}
.tag.genero-quente{border-color:var(--energy);color:var(--energy)}
.tag.genero-frio{border-color:var(--accent);color:var(--accent)}
.tag.cat-ent{border-color:var(--ok);color:var(--ok)}
.tag.cat-sob{border-color:var(--party);color:var(--party)}
.tag.cat-br,.tag.cat-sn{border-color:var(--mut);color:var(--mut)}
/* A ficha da receita: uma folha de caderno com os passos. */
.rc-tocavel{cursor:pointer}
.rc-tocavel:hover{border-color:var(--accent)}
.mcaixa.ficha{max-width:640px}
ol.passos{margin:8px 0 0;padding-left:22px}
ol.passos li{margin-bottom:12px;line-height:1.5}
ol.passos li::marker{font-family:var(--fonte-display);font-weight:700;color:var(--accent)}
ol.passos li b{font-family:var(--fonte-display);font-size:15.5px}
ol.passos li span{color:var(--mut);font-size:14px;margin-top:2px}
.preco{display:inline-flex;align-items:center;gap:5px;margin-left:auto;flex:none}
.preco input{width:76px;text-align:right;padding:4px 6px;font-size:13px}
.shop li:has(.preco){display:flex;align-items:center;gap:8px}
.conv-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.sobra-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ok);
  border-radius:999px;padding:4px 12px;background:color-mix(in srgb,var(--ok) 10%,var(--card));
  cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}

/* ===== CRACHÁS DE PENDENTES ===== */
nav button{position:relative}
.cracha{position:absolute;top:4px;right:8px;min-width:17px;height:17px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font:700 10.5px/17px var(--fonte-ui);
  text-align:center;padding:0 4px;pointer-events:none}
html[data-dispositivo="telefone"][data-orient="retrato"] .cracha{top:2px;right:calc(50% - 22px)}
nav button.on .cracha{background:var(--on-accent);color:var(--accent)}

*{box-sizing:border-box;margin:0}
/* overflow-x:clip (e não hidden) impede que uma bolha de explicação ponha a
   página a deslizar na horizontal, sem criar um contentor de scroll — o
   cabeçalho fixo continua a colar-se ao topo. */
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--fonte-ui);
  padding-bottom:60px;overflow-x:clip}
h1,h2,h3,.dhead b{font-family:var(--fonte-display);font-weight:600;text-wrap:balance}
h1{font-size:27px;font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;letter-spacing:-.006em;margin-bottom:4px}
h3{font-size:16.5px}
.brand h1 em{font-style:italic;color:var(--accent)}
button,input,select{font:inherit;color:inherit}
/* Os links da app são atalhos entre separadores, não hiperligações externas:
   vestem o acento da paleta em vez do azul do browser. */
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
  position:sticky;isolation:isolate}
/* Aura: as cores dos membros da família esbatidas no topo do cabeçalho, para
   a app ter a cara de quem a usa. O gradiente é montado em JS a partir das
   cores escolhidas; sem membros, não aparece nada. */
.aura{position:absolute;inset:0 0 auto 0;height:100%;pointer-events:none;z-index:-1;opacity:.5}
html[data-modo="escuro"] .aura{opacity:.34}
.hwrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand small{color:var(--mut);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
nav button:hover{color:var(--ink)}
/* O separador ativo é inconfundível: acento cheio, não um sublinhado tímido.
   O par accent/on-accent já está verificado nas catorze combinações. */
nav button.on{background:var(--accent);color:var(--on-accent)}
.ico{width:22px;height:22px;flex:none}
nav button .ico{width:20px;height:20px}

/* ===== BARRA INFERIOR (telemóvel ao alto) =====
   Os quatro separadores do dia a dia ficam ao alcance do polegar; o resto
   vive na folha «Mais». Tudo scoped: em paisagem, tablet e desktop nada muda. */
html[data-dispositivo="telefone"][data-orient="retrato"] nav{
  position:fixed;top:auto;bottom:0;left:0;right:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin:0;
  padding:6px max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
html[data-dispositivo="telefone"][data-orient="retrato"] nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;min-height:54px;border-radius:12px;padding:6px 2px}
html[data-dispositivo="telefone"][data-orient="retrato"] nav button .ico{width:22px;height:22px}
html[data-dispositivo="telefone"][data-orient="retrato"] body,
html[data-dispositivo="telefone"][data-orient="retrato"] main{scroll-margin-top:var(--hh,58px)}
#nav-mais{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));right:8px;z-index:41;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:8px;display:none;gap:2px;min-width:190px}
#nav-mais.aberta{display:grid}
#nav-mais button{background:none;border:none;cursor:pointer;color:var(--ink);font-weight:600;
  min-height:48px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;
  gap:10px;padding:8px 12px;border-radius:var(--r-sm);font-size:14px}
#nav-mais button.on{background:var(--accent);color:var(--on-accent)}
#nav-mais button .ico{width:20px;height:20px}
@media (prefers-reduced-motion: no-preference){
  #nav-mais.aberta{animation:folha-entra .18s ease-out}
  @keyframes folha-entra{ from{ opacity:0; transform:translateY(8px);} }
}
/* O que vive colado ao fundo sobe acima da barra. */
html[data-dispositivo="telefone"][data-orient="retrato"] body{
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
html[data-dispositivo="telefone"][data-orient="retrato"] #toast{
  bottom:calc(74px + max(14px,env(safe-area-inset-bottom)))}
html[data-dispositivo="telefone"][data-orient="retrato"] .tour-cartao{
  bottom:calc(74px + max(14px,env(safe-area-inset-bottom)))}
/* Cabeçalho magro no mesmo modo: a nav já não vive lá, sobra a marca e o
   desfazer. A aura ganha um pouco mais de presença no topo agora baixo. */
html[data-dispositivo="telefone"][data-orient="retrato"] .hwrap{
  padding-top:8px;padding-bottom:8px;flex-wrap:nowrap;gap:8px}
html[data-dispositivo="telefone"][data-orient="retrato"] .brand small{display:none}
html[data-dispositivo="telefone"][data-orient="retrato"] h1{font-size:18px}
html[data-dispositivo="telefone"][data-orient="retrato"] .hist{margin-left:auto}
/* No cabeçalho magro só cabe o led: o texto do estado de gravação saía do ecrã */
html[data-dispositivo="telefone"][data-orient="retrato"] .savest-txt{display:none}
html[data-dispositivo="telefone"][data-orient="retrato"] .savest{padding:8px}
html[data-dispositivo="telefone"][data-orient="retrato"] .aura{opacity:.6}
html[data-dispositivo="telefone"][data-orient="retrato"][data-modo="escuro"] .aura{opacity:.34}
main{max-width:1100px;margin:0 auto;padding:24px 20px}
/* Um único dialeto de hierarquia: o cartão normal fica quieto (sem sombra),
   a «capa» de cada separador flutua com sombra e um gradiente suave do
   acento, e o auxiliar recua para o fundo. É a diferença entre resumo e
   detalhe, dita pela superfície e não por mais uma moldura. */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card--capa{border-color:var(--line);box-shadow:var(--shadow)}
.card--capa{border-color:color-mix(in srgb,var(--accent) 22%,var(--line));
  background:linear-gradient(180deg,var(--accent-soft),var(--card) 46%)}
.card--capa>h2::after, .card--capa>.card-cab h2::after{content:"";display:block;width:28px;height:3px;
  border-radius:2px;background:var(--accent);margin-top:6px}
.card--capa .stat b{font-size:28px;font-family:var(--fonte-display);letter-spacing:-.01em}
.card--capa.energia{border-color:var(--line)}
.card--capa.energia{border-color:color-mix(in srgb,var(--energy) 22%,var(--line));
  background:linear-gradient(180deg,var(--energy-soft),var(--card) 46%)}
.card--capa.energia>h2::after, .card--capa.energia>.card-cab h2::after{background:var(--energy)}
.card--quieto{background:var(--bg)}
.card--quieto{background:color-mix(in srgb,var(--card) 60%,var(--bg))}
/* Cartão «Hoje»: linhas de agenda com fio tracejado, avatares à direita. */
.hoje-lista{margin-top:8px}
.hoje-linha{display:flex;gap:10px;align-items:center;min-height:44px;padding:7px 0;
  border-bottom:1px dashed var(--line)}
.hoje-linha:last-child{border-bottom:none}
.hoje-ico{font-size:17px;flex:none;width:24px;text-align:center}
.hoje-pend{cursor:pointer;border:none;font:inherit;font-size:12px;font-weight:700}
/* Régua de dias do plano: cola ao cabeçalho, um botão por dia com o estado
   do planeamento em ponto — e o dia de hoje vestido de acento. */
.dias-nav{position:sticky;top:var(--hh,58px);z-index:8;display:flex;gap:6px;background:var(--bg);
  padding:8px 0;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.dias-nav::-webkit-scrollbar{display:none}
.dia-salto{flex:1;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink);font-weight:700;font-size:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px 2px}
.dia-salto .dot{margin:0}
.dia-salto.hoje{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.day.hoje{border:2px solid var(--accent)}
.day.hoje .dhead{background:var(--accent-soft)}
.day.hoje .dhead b::after{content:" · hoje";font:700 11px/1 var(--fonte-ui);color:var(--accent);letter-spacing:.05em}
/* A segurança ganha à marcação de hoje: declarado depois, vence o empate. */
.day.tem-alerta{border-color:var(--bad)}
.dia-alerta{cursor:pointer;border:none;font:inherit}
.alerta.forte{border-left:4px solid var(--bad);border-radius:6px;font-size:13px}
/* Seletor de membro que acompanha o scroll em Atividade e Nutrição. */
.membros-fixos{position:sticky;top:var(--hh,58px);z-index:9;background:var(--bg);margin:0 0 14px;
  padding:8px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid transparent}
.membros-fixos::-webkit-scrollbar{display:none}
.membros-fixos .chip{flex:none}
.membros-fixos.colada{border-bottom-color:var(--line)}
.membros-fixos .chip.on{box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:640px){ .membros-fixos{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px} }
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sub{color:var(--mut);font-size:13.5px}
.lbl{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=search],select{
  width:100%;background:var(--inset);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:10px}
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--r-sm);padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.party{border-color:var(--party);color:var(--party)}
.chip.party.on{background:var(--party-soft)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--inset);border-radius:var(--r-sm);min-width:100px}
.stat b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
/* Uma régua única para todos os micro-rótulos: quatro variantes quase iguais
   de maiúsculas pequenas passam a uma só voz. Os valores dentro de .splabel
   são repostos pela regra própria de .splabel output, que vem depois. */
.lbl,.mtitle,.splabel,.stat span,.brand small{font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:700;color:var(--mut)}
/* Régua de caderno: o título de cada refeição prolonga-se num fio até à
   margem, como numa página pautada — separa sem acrescentar caixas. */
.mtitle{display:flex;align-items:center;gap:8px}
.mtitle::after{content:"";flex:1;height:1px;background:var(--line)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 6px}
.mbar div{height:100%}
.mleg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
table{border-collapse:collapse;width:100%}
.splist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.spline{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;background:var(--inset);
  display:flex;flex-direction:column;gap:10px}
.sptop{display:flex;gap:10px;align-items:center}
.sptop select{flex:1 1 auto;min-width:0}
.spgrid{display:flex;flex-direction:column;gap:11px}
/* O valor não encolhe nem parte: num ecrã estreito é o rótulo que cede a
   linha, em vez de o «50% dieta · 50% exercício» ficar com o último carácter
   cortado contra a margem. */
.splabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px;
  flex-wrap:wrap;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.splabel>span{min-width:0}
.splabel output{flex:0 0 auto;margin-left:auto}
.splabel output{font-size:14.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.spfoot{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-top:9px;border-top:1px solid var(--line)}
.spfoot select{width:auto;min-width:0;flex:0 1 auto}
.sphoras{display:flex;align-items:center;gap:5px}
.sphoras input{width:70px}
.spgasto{margin-left:auto;text-align:right;white-space:nowrap}
.spgasto .sub{display:block;font-size:11.5px}
.pill.nivel{background:var(--accent-soft);color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;padding:0;
  background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--accent);border:3px solid var(--card);margin-top:-7px;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:3px solid var(--card);border-radius:50%;
  background:var(--accent)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
/* Sliders de macros com a cor do próprio macro. */
.rgC::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mc) var(--pct,0%),var(--line) var(--pct,0%))}
.rgC::-webkit-slider-thumb{background:var(--mc)}
.rgC::-moz-range-progress{background:var(--mc)} .rgC::-moz-range-thumb{background:var(--mc)}
.rgP::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mp) var(--pct,0%),var(--line) var(--pct,0%))}
.rgP::-webkit-slider-thumb{background:var(--mp)}
.rgP::-moz-range-progress{background:var(--mp)} .rgP::-moz-range-thumb{background:var(--mp)}
.rgF::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mf) var(--pct,0%),var(--line) var(--pct,0%))}
.rgF::-webkit-slider-thumb{background:var(--mf)}
.rgF::-moz-range-progress{background:var(--mf)} .rgF::-moz-range-thumb{background:var(--mf)}
/* Gráficos: espelho, não controlo — nunca roubam o scroll nem o toque.
   Cores SEMPRE por classe (var() em atributos SVG não é fiável). */
/* Explicadores: bolha ancorada à esquerda do marcador (as dicas vivem sempre
   no lado esquerdo dos cartões, por isso crescer para a direita não transborda).
   Aparecem com o rato, com o teclado e — onde não há rato — ao toque. */
.dica{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;padding:0;margin-left:6px;border:1px solid var(--line);border-radius:50%;
  background:var(--bg);color:var(--mut);font:700 11px/1 inherit;cursor:help;vertical-align:middle;flex:none}
.dica:hover,.dica:focus-visible,.dica.on{border-color:var(--accent);color:var(--accent)}
.dica::after{content:attr(data-dica);position:absolute;left:calc(-4px + var(--dx,0px));top:calc(100% + 8px);
  width:max-content;max-width:min(270px,calc(100vw - 24px));
  background:var(--ink);color:var(--card);padding:9px 12px;border-radius:9px;
  font:400 12.5px/1.45 inherit;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;
  z-index:30;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
.dica::before{content:'';position:absolute;left:5px;top:calc(100% + 2px);
  border:6px solid transparent;border-bottom-color:var(--ink);z-index:31;display:none}
/* display em vez de visibility: uma bolha só escondida continuaria a contar
   para a largura do documento e punha a página a deslizar na horizontal. */
.dica:hover::after,.dica:hover::before,.dica:focus-visible::after,.dica:focus-visible::before,
.dica.on::after,.dica.on::before{display:block}

/* A quantidade distingue-se pelo peso da letra, não por opacidade: a 75% o

.restr{gap:6px;flex-wrap:wrap;margin-top:6px}

.fora-box{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}

.kcal{color:var(--energy);font-weight:700;font-variant-numeric:tabular-nums}

/* ============ TOQUE, TELEMÓVEL E TABLET ============ */

.pill.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.msg.ok{background:rgba(44,119,75,.13)}
.msg.warn-msg{background:rgba(134,97,15,.13);color:var(--warn);font-weight:400;line-height:1.5}
.msg.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.msg.bad{background:rgba(194,64,52,.13)}
.msg.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card))}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input,label,.chip{touch-action:manipulation}

button:active,.chip:active,.filebtn:active{opacity:.82}

@media (hover:none) and (pointer:coarse){
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
  .btn,nav button{min-height:44px}
  .chip{min-height:42px;padding:7px 14px}
  .btn.small{min-height:40px;padding:8px 13px}
  .savest{min-height:40px}
  .shop li{padding:12px 6px;min-height:48px}
  .shop input[type=checkbox]{width:24px;height:24px}
  /* As pastilhas que são botões (itens por comprar, alerta do dia) nasceram
     como etiquetas e ficaram com altura de etiqueta — no dedo precisam de
     alvo a sério. */
  .pill.hoje-pend,.pill.dia-alerta{min-height:40px;padding:9px 14px;font-size:13px;
    display:inline-flex;align-items:center}
  .toggle input{width:20px;height:20px}
  textarea{min-height:140px}
  .spline select,.spline input[type=number]{min-height:42px}
  /* Alvo maior para o dedo agarrar o slider sem falhar. */
  input[type=range]{height:44px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-10px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px}
  .spgrid{gap:14px}
  .splabel{margin-bottom:5px}
}
/* Tablet em vertical: duas colunas confortáveis em vez de três apertadas. */
@media (min-width:700px) and (max-width:1024px){
  .g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}

/* ============ ORIENTAÇÃO ============ */
/* Grelha dos dias do plano, para poder mudar com a orientação. */
.gdias{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* Reserva sem JavaScript: qualquer ecrã muito baixo é um telemóvel deitado. */
@media (orientation:landscape) and (max-height:460px){
  header{position:static}
  .brand small{display:none}
  .hwrap{padding-top:7px;padding-bottom:7px}
}

/* O detetor de orientação marca <html> com data-orient e data-dispositivo,
   o que permite distinguir um telemóvel deitado de um tablet deitado —
   coisa que as media queries de largura, por si só, não conseguem. */

/* Telemóvel deitado: a altura passa a ser o recurso escasso. O cabeçalho
   deixa de ser fixo e encolhe, para a lista não ficar a espiar por uma frincha. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .svg-linha{height:80px}
html[data-orient="paisagem"][data-dispositivo="telefone"] #pla-resumo{display:none}
html[data-orient="paisagem"][data-dispositivo="telefone"] header{position:static}
html[data-orient="paisagem"][data-dispositivo="telefone"] .hwrap{padding-top:6px;padding-bottom:6px;gap:8px}
html[data-orient="paisagem"][data-dispositivo="telefone"] .brand small{display:none}
html[data-orient="paisagem"][data-dispositivo="telefone"] h1{font-size:18px}
html[data-orient="paisagem"][data-dispositivo="telefone"] nav button{min-height:38px;padding:6px 11px}
html[data-orient="paisagem"][data-dispositivo="telefone"] main{padding-top:12px}
html[data-orient="paisagem"][data-dispositivo="telefone"] .secgap{margin-top:18px}
/* Ao deitar, a largura dá para duas colunas de cartões. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .g2,
html[data-orient="paisagem"][data-dispositivo="telefone"] .g3,
html[data-orient="paisagem"][data-dispositivo="telefone"] .gdias{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}

/* Telemóvel de pé: uma coluna, sem cartões a partir em duas metades estreitas. */
html[data-orient="retrato"][data-dispositivo="telefone"] .g2,
html[data-orient="retrato"][data-dispositivo="telefone"] .g3,
html[data-orient="retrato"][data-dispositivo="telefone"] .gdias{grid-template-columns:1fr}

/* Tablet de pé: duas colunas largas e mais respiro nas margens. */
html[data-orient="retrato"][data-dispositivo="tablet"] main{padding-left:24px;padding-right:24px}
html[data-orient="retrato"][data-dispositivo="tablet"] .g3,
html[data-orient="retrato"][data-dispositivo="tablet"] .gdias{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

/* Tablet deitado: aproveita a largura toda, mais dias e receitas por linha. */
html[data-orient="paisagem"][data-dispositivo="tablet"] main{max-width:1280px}
html[data-orient="paisagem"][data-dispositivo="tablet"] .g3{grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
html[data-orient="paisagem"][data-dispositivo="tablet"] .gdias{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
</style>

<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <h1>Família <em>Fit</em></h1>
      <small>alimentação &amp; movimento</small>
    </div>
    <nav id="nav"></nav>
    <div class="hist">
      <button id="btn-pesq" onclick="abrirPesquisa()" aria-label="Procurar em toda a app (tecla /)" title="Procurar — tecla /">⌕</button>
      <button id="btn-undo" onclick="desfazer()" aria-label="Desfazer" disabled>↶</button>
      <button id="btn-redo" onclick="refazer()" aria-label="Refazer" disabled>↷</button>
      <button type="button" class="dica dica-e" id="dica-desfazer" aria-label="Explicação">i</button>
    </div>
    <button class="savest" id="savest" onclick="go('dados')" title="Ver dados e cópias de segurança"></button>
  </div>
</header>
<main id="main"></main>

<script>
/* ================= DADOS BASE ================= */
/* Desportos com três níveis de intensidade. Os valores são METs (equivalentes
   metabólicos) do Compendium of Physical Activities, na ordem leve / moderado /
   intenso. Onde a velocidade ou o terreno mandam mais do que o esforço sentido
   — ciclismo, corrida, caminhada — a dica indica o que cada nível representa. */
const NIVEIS=[['leve','Leve'],['moderado','Moderado'],['intenso','Intenso']];

/* Nos desportos em que a velocidade é que manda no esforço, o MET não se
   escolhe por níveis: lê-se de uma curva velocidade → MET, interpolada entre
   os pontos tabelados do Compendium. É isso que permite trocar os três níveis
   fixos por um slider contínuo de distância e velocidade. */
const CURVAS={
  andar:      [[3,2.3],[4,2.9],[4.8,3.3],[5.6,4.3],[6.4,5.0],[7.2,7.0],[8,8.3]],
  correr:     [[6.4,6.0],[8,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8],[16.1,14.5],[17.5,16.0],[19.3,19.0]],
  trail:      [[5,6.5],[7,8.5],[9,10.5],[11,12.5],[13,14.0],[15,16.0]],
  estrada:    [[10,4.0],[16,6.8],[19,8.0],[22.5,10.0],[26,12.0],[31,15.8],[35,17.0]],
  subida:     [[6,6.0],[9,8.0],[12,10.0],[15,12.0],[18,14.0],[22,16.0]],
  btt:        [[8,5.5],[12,7.5],[16,9.0],[20,11.0],[24,13.0],[28,15.0]],
  passeio:    [[8,3.5],[12,4.5],[16,6.8],[19,8.0],[22,9.5]],
  nadar:      [[1.5,5.3],[2,6.5],[2.5,8.0],[3,9.5],[3.5,10.5],[4.5,11.8]],
  remar:      [[4,4.0],[6,6.0],[8,8.5],[10,11.0],[12,12.5],[14,13.5]],
  patinar:    [[6,4.8],[8,5.5],[12,7.0],[16,9.0],[20,11.0],[26,12.5]]
};
/* Interpolação linear, com os extremos fixos fora da tabela. */
function metPorVelocidade(nome,v){
  const c=CURVAS[nome]; if(!c) return 0;
  if(v<=c[0][0]) return c[0][1];
  if(v>=c[c.length-1][0]) return c[c.length-1][1];
  for(let i=1;i<c.length;i++){
    if(v<=c[i][0]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
      return m0+(m1-m0)*(v-v0)/(v1-v0); }
  }
  return c[c.length-1][1];
}
/* O inverso: a que velocidade se atinge um dado MET. Serve para converter os
   registos antigos (horas + nível) sem lhes mudar as calorias. */
function velocidadeParaMet(dist,met){
  const c=CURVAS[dist.curva];
  let v=c[0][0];
  if(met>=c[c.length-1][1]) v=c[c.length-1][0];
  else if(met>c[0][1]){
    for(let i=1;i<c.length;i++){
      if(met<=c[i][1]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
        v = m1===m0 ? v0 : v0+(v1-v0)*(met-m0)/(m1-m0); break; }
    }
  }
  return Math.min(Math.max(v,dist.vmin),dist.vmax);
}
/* Definição da parte de distância: curva, limites do slider de velocidade,
   distância máxima semanal de referência e a unidade em que se diz o ritmo. */
function D(curva,vmin,vmax,vdef,vStep,maxSemana,ritmo){
  return {curva,vmin,vmax,vdef,vStep,maxSemana,ritmo:ritmo||null}; }
const CATS_SPORT=[['corrida','Corrida e caminhada'],['ciclismo','Ciclismo'],['agua','Água'],
  ['forca','Força e ginásio'],['corpo','Corpo e mente'],['bola','Bola'],['raquete','Raquete'],
  ['combate','Combate'],['natureza','Ar livre'],['danca','Dança']];
/* Ícones por categoria, usados nos títulos de secção em toda a app. */
const ICO_SPORT={corrida:'🏃',ciclismo:'🚴',agua:'🏊',forca:'🏋️',corpo:'🧘',bola:'⚽',
  raquete:'🎾',combate:'🥊',natureza:'⛰️',danca:'💃'};
const ICO_CAT={'Peixe & Marisco':'🐟','Carne & Ovos':'🥩','Frutas & Legumes':'🥦',
  'Laticínios':'🥛','Mercearia & Outros':'🫙','Suplementos':'💊'};
const ICO_REF={p:'🌅',a:'🍽️',l:'🍎',j:'🌙',ac:'🍚'};
const ICO_COZ={portuguesa:'🇵🇹',italiana:'🍝',francesa:'🥐',mediterranica:'🫒',asiatica:'🍜',
  espanhola:'🥘',mexicana:'🌮',americana:'🍔',brasileira:'🇧🇷',africana:'🌍'};
const ICO_SUPL={proteico:'🥤',vitaminico:'💊',mineral:'🧂',composto:'🐟'};
const ICO_FASE={bebe:'🍼',crianca:'🧒',adolescente:'🧑',adulto:'🧑‍🦱'};
function SP(id,nome,cat,mets,dicas,dist){ return {id,nome,cat,mets,dicas:dicas||null,dist:dist||null}; }
const SPORTS=[
  SP('caminhada','Caminhada','corrida',[3.0,4.3,5.3],null, D('andar',3,8,5,0.1,100,'min/km')),
  SP('corrida','Corrida','corrida',[8.3,10.0,12.8],null, D('correr',6,20,10,0.5,150,'min/km')),
  SP('trail','Corrida em trilho (trail)','corrida',[9.0,11.0,13.0],null, D('trail',5,15,9,0.5,100,'min/km')),
  SP('intervalos','Treino por intervalos / séries','corrida',[9.0,12.0,15.0]),
  SP('escadas','Subir escadas / step','corrida',[4.0,8.8,11.0]),

  SP('ciclismo','Ciclismo de estrada','ciclismo',[5.8,8.0,10.0],null, D('estrada',12,40,22,0.5,400)),
  SP('ciclismoMontanha','Ciclismo de montanha (subida)','ciclismo',[7.0,9.5,12.0],null, D('subida',6,24,12,0.5,200)),
  SP('btt','BTT / trilhos','ciclismo',[6.8,8.5,11.0],null, D('btt',8,28,16,0.5,200)),
  SP('ciclismoPasseio','Bicicleta de passeio / cicloturismo','ciclismo',[4.0,5.8,7.0],null, D('passeio',8,22,14,0.5,200)),
  SP('spinning','Bicicleta estática / spinning','ciclismo',[5.5,8.5,11.0]),

  SP('natacao','Natação','agua',[5.3,7.0,9.8],null, D('nadar',1.5,4.5,2.5,0.1,25,'min/100m')),
  SP('hidroginastica','Hidroginástica','agua',[3.5,4.5,5.5]),
  SP('remo','Remo / canoagem','agua',[4.0,7.0,10.0],null, D('remar',4,14,8,0.5,80,'min/500m')),
  SP('surf','Surf','agua',[3.0,5.0,6.5]),

  SP('musculacao','Musculação (pesos)','forca',[3.5,5.0,6.0],['séries longas e leves','treino normal','cargas altas, pouco descanso']),
  SP('calistenia','Calistenia (peso do corpo)','forca',[3.8,5.5,8.0],['flexões e abdominais','circuito contínuo','barras e explosivo']),
  SP('funcional','Treino funcional / CrossFit','forca',[6.0,8.0,12.0]),
  SP('eliptica','Elíptica','forca',[4.5,5.5,7.0]),
  SP('ginasio','Ginásio — cardio geral','forca',[4.5,6.0,8.0]),

  SP('yoga','Ioga','corpo',[2.5,3.3,4.5],['hatha ou restaurativo','vinyasa','power ou ashtanga']),
  SP('pilates','Pilates','corpo',[2.8,3.5,4.5],['solo, iniciação','solo, ritmo normal','reformer ou avançado']),
  SP('taichi','Tai chi / qigong','corpo',[2.0,3.0,4.0]),
  SP('alongamentos','Alongamentos / mobilidade','corpo',[2.0,2.5,3.0]),

  SP('futebol','Futebol','bola',[6.0,8.0,10.0],['recreativo','jogo normal','competição']),
  SP('futsal','Futsal','bola',[7.0,9.0,10.5]),
  SP('basquete','Basquetebol','bola',[4.5,7.5,9.3],['lançamentos ao cesto','jogo normal','competição']),
  SP('volei','Voleibol','bola',[3.0,4.5,8.0],['recreativo','jogo normal','praia ou competição']),
  SP('andebol','Andebol','bola',[8.0,10.0,12.0]),

  SP('tenis','Ténis','raquete',[5.0,7.3,8.0],['duplas','singulares','competição']),
  SP('padel','Padel','raquete',[5.0,6.5,8.0]),
  SP('badminton','Badminton','raquete',[4.5,5.5,7.0]),
  SP('squash','Squash','raquete',[7.3,10.0,12.0]),
  SP('pingpong','Ténis de mesa','raquete',[3.0,4.0,5.0]),

  SP('artes','Artes marciais','combate',[5.3,8.0,10.3],['treino técnico','aula normal','combate']),
  SP('boxe','Boxe / kickboxing','combate',[5.5,7.8,12.8],['saco e técnica','aula normal','sparring']),

  SP('hiking','Caminhada de montanha','natureza',[5.3,6.5,8.0],['trilho plano','com subidas','com mochila e declive']),
  SP('escalada','Escalada','natureza',[5.8,7.5,11.0]),
  SP('esqui','Esqui / snowboard','natureza',[4.3,6.8,9.0]),
  SP('patinagem','Patinagem / skate','natureza',[5.0,7.0,9.0],null, D('patinar',6,26,15,0.5,150)),
  SP('jardinagem','Jardinagem / trabalho no quintal','natureza',[2.8,3.8,5.0]),

  SP('danca','Dança','danca',[3.5,5.0,7.8],['de salão','moderna','muito ritmada']),
  SP('zumba','Zumba / aeróbica','danca',[5.0,6.5,8.5]),
  SP('ballet','Ballet / dança contemporânea','danca',[4.8,6.0,7.5])
];
const SPORT={}; SPORTS.forEach(s=>{ SPORT[s.id]=s; });
function nivelIndice(i){ const n=NIVEIS.findIndex(x=>x[0]===i); return n<0? 1 : n; }
function velocidade(s){ const sp=SPORT[s.s]; if(!sp||!sp.dist) return 0;
  const v=parseFloat(s.v); return isFinite(v)&&v>0 ? Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax) : sp.dist.vdef; }
/* Horas dentro do período escolhido: nos desportos de distância vêm de km ÷ velocidade. */
function horasPeriodo(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  if(sp.dist){ const v=velocidade(s); return v>0? (parseFloat(s.km)||0)/v : 0; }
  return parseFloat(s.h)||0; }
function metDe(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  return sp.dist ? metPorVelocidade(sp.dist.curva, velocidade(s)) : sp.mets[nivelIndice(s.i)]; }
/* Nos desportos de distância o nível deixa de se escolher: lê-se do MET. */
function nivelPorMet(sp,met){ return met < (sp.mets[0]+sp.mets[1])/2 ? 0
  : met < (sp.mets[1]+sp.mets[2])/2 ? 1 : 2; }
function rotuloNivel(sp,idx){ return NIVEIS[idx][1]+(sp && sp.dicas? ' ('+sp.dicas[idx]+')' : ''); }
/* Um registo válido para cada tipo de desporto. Os registos antigos de um
   desporto de distância (horas + nível) convertem-se para a velocidade que dá
   exatamente o mesmo MET, de modo que as calorias já calculadas não mudem. */
function normalizaDesporto(s){
  if(!s) return null;
  if(!temChave(SPORT,s.s)) return null;
  const sp=SPORT[s.s];
  const per=['dia','semana','mes'].indexOf(s.per)>=0 ? s.per : 'semana';
  /* o id acompanha o desporto durante toda a vida do plano: é por ele que os
     registos sabem que treino do plano estão a cumprir */
  const id=/^[A-Za-z0-9_-]{1,32}$/.test(String(s.id||''))? s.id : 'p'+Math.random().toString(36).slice(2,9);
  const dias=Array.isArray(s.dias)
    ? s.dias.map(x=>parseInt(x,10)).filter(x=>x>=0&&x<=6).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b)
    : null;
  if(sp.dist){
    let v=parseFloat(s.v), km=parseFloat(s.km), converter=false;
    if(!(isFinite(v)&&v>0) || !isFinite(km)){ v=velocidadeParaMet(sp.dist, sp.mets[nivelIndice(s.i)]); converter=true; }
    v=Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax);
    /* A velocidade assenta num passo do slider antes de gerar a distância,
       para as horas do registo antigo se manterem exatas. */
    v=Math.round(Math.round(v/sp.dist.vStep)*sp.dist.vStep*100)/100;
    if(converter) km=(parseFloat(s.h)||0)*v;
    const out={id, s:sp.id, per, v, km:Math.max(0,Math.round(km*10)/10)};
    out.dias=(dias&&dias.length)? dias : diasSugeridos(out);
    return out;
  }
  const out={id, s:sp.id, per, h:Math.max(0,parseFloat(s.h)||0),
    i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'};
  out.dias=(dias&&dias.length)? dias : diasSugeridos(out);
  return out;
}
/* Data de nascimento: a idade deixa de ser um número que envelhece sozinho no
   perfil. Quando existe, é ela que manda — a idade e os meses passam a ser
   derivados, para todo o resto da app continuar a ler o que sempre leu. */
function anosDesde(nasc,ate){
  const a=new Date(nasc+'T12:00:00'), b=new Date((ate||hojeISO())+'T12:00:00');
  let anos=b.getFullYear()-a.getFullYear();
  const m=b.getMonth()-a.getMonth();
  if(m<0 || (m===0 && b.getDate()<a.getDate())) anos--;
  return anos;
}
function mesesDesde(nasc,ate){
  const a=new Date(nasc+'T12:00:00'), b=new Date((ate||hojeISO())+'T12:00:00');
  let meses=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate()) meses--;
  return Math.max(0,meses);
}
function nascValida(v){ return dataValida(v) && v<=hojeISO() && v>='1900-01-01'; }
function aplicaNascimento(m){
  if(!m || !nascValida(m.nasc)) return;
  const meses=mesesDesde(m.nasc);
  if(meses<24){ m.meses=meses; m.idade=meses/12; }
  else { delete m.meses; m.idade=anosDesde(m.nasc); }
}
function normalizaMembro(m){
  if(m && Array.isArray(m.desportos)) m.desportos=m.desportos.map(normalizaDesporto).filter(Boolean);
  /* migração: deriva o objetivo contínuo do antigo — o alvo kcal não muda */
  if(m && !Number.isFinite(m.objetivoPct)) m.objetivoPct=Math.round((GOALS[m.objetivo]?.[1]||0)*100);
  else if(m) sincronizaObjetivo(m);   /* e mantém o campo legado coerente */
  if(m && !nascValida(m.nasc)) delete m.nasc;
  if(m) aplicaNascimento(m);      /* com data de nascimento, a idade é derivada e envelhece sozinha */
  if(m) normalizaIdadeMeses(m);   /* corrige qualquer meses/idade que tenha ficado do lado errado da fronteira dos 2 anos */
  return m;
}
/* As estruturas novas podem não existir numa cópia antiga, e os registos
   podem apontar a membros ou receitas que já não estão cá. Isto corre uma vez
   ao carregar e deixa tudo coerente antes do primeiro render. */
function migraRegistos(s){
  if(!s.medicoes || typeof s.medicoes!=='object') s.medicoes={};
  const ids=s.members.map(m=>m.id);
  Object.keys(s.medicoes).forEach(mid=>{
    if(ids.indexOf(mid)<0){ delete s.medicoes[mid]; return; }
    const arr=Array.isArray(s.medicoes[mid])? s.medicoes[mid] : [];
    const vistos={}, limpo=[], hoje=iso(new Date());
    /* uma pesagem com data futura não é uma pesagem: ninguém se pesou ainda */
    arr.forEach(x=>{ if(!x||!dataValida(x.d)||x.d>hoje||vistos[x.d]) return;
      const p=parseFloat(x.p); if(!isFinite(p)||p<1||p>400) return;
      vistos[x.d]=1; limpo.push({d:x.d,p:Math.round(p*10)/10}); });
    limpo.sort((a,b)=> a.d<b.d? -1 : a.d>b.d? 1 : 0);
    s.medicoes[mid]=limpo;
  });

   tabela de unidades existir — e um dado derivável não deve ser gravado. */

  const out={};
  if(!o||typeof o!=='object') return out;
  Object.keys(o).slice(0,2000).forEach(k=>{
    if(!temChave(NUTRI,k)) return;
    const v=parseFloat(o[k]&&o[k].v!==undefined? o[k].v : o[k]);
    if(!isFinite(v)||v<=0||v>10000) return;
    out[k]={v:Math.round(v*100)/100};

    const n=String(f.n||'').trim().slice(0,40); if(!n) return null;

function limparPausas(a,ids){

function limparRegAtiv(r,ids){

  /* só o que está agendado pode ter data futura: um treino «feito» amanhã
     ainda não aconteceu, e entraria a somar num gasto que não existe */
  const estado = ESTADOS_REG.indexOf(r.estado)>=0? r.estado : 'feita';
  if(estado!=='agendada' && r.d>hojeISO()) return null;
  const out={id:limparId(r.id), mid:r.mid, d:r.d, s:r.s,
    min:clampNum(Math.round(parseFloat(r.min)||0),1,1440),

    plano: /^[A-Za-z0-9_-]{1,32}$/.test(String(r.plano||''))? r.plano : null,
    nota: String(r.nota||'').slice(0,120)};

   ficheiro ainda não estão na biblioteca — sem isto, um registo que aponte a
   uma delas seria descartado como se a receita não existisse. */
function limparRegRef(r,ids,lookup){
  lookup = lookup || (id=>RECIPES.find(x=>x.id===id));
  if(!r || typeof r!=='object') return null;
  if(!dataValida(r.d)) return null;
  if(MEALK.indexOf(r.mk)<0) return null;
  if(ids && ids.indexOf(r.mid)<0) return null;
  if(!lookup(r.r)) return null;
  const ac=[]; (Array.isArray(r.ac)? r.ac : []).forEach(id=>{
    const rec=lookup(id);
    if(rec && ehAcompanhamento(rec) && ac.indexOf(id)<0 && ac.length<MAX_AC) ac.push(id); });
  /* uma refeição não se come no futuro */
  if(r.d>hojeISO()) return null;
  return {id:limparId(r.id), mid:r.mid, d:r.d, mk:r.mk, r:r.r, ac,
    dose:clampNum(parseFloat(r.dose)||1,0.25,4),
    estado: ESTADOS_REG.indexOf(r.estado)>=0 && r.estado!=='agendada'? r.estado : 'feita',
    grupo: /^[A-Za-z0-9_-]{1,32}$/.test(String(r.grupo||''))? r.grupo : null,
    subst: !!r.subst,

/* Faixa do slider de distância: depende do período, para não haver 400 km/dia. */
function faixaDist(sp,per){
  const sem=sp.dist.maxSemana;
  const max = per==='dia'? Math.ceil(sem/3) : per==='mes'? Math.round(sem*4.5) : sem;
  const step = max<=10? 0.25 : max<=60? 0.5 : max<=200? 1 : 5;
  return {max,step};
}
function nPT(v,casas){ return (Math.round(v*Math.pow(10,casas))/Math.pow(10,casas))
  .toFixed(casas).replace('.',','); }
function mmss(min){ if(!isFinite(min)||min<=0) return '—';
  let m=Math.floor(min), s=Math.round((min-m)*60); if(s===60){ m++; s=0; }
  return m+':'+String(s).padStart(2,'0'); }
function hmm(h){ const t=Math.round(h*60); if(!t) return '0 min';
  const H=Math.floor(t/60), M=t%60; return H? H+' h'+(M? ' '+String(M).padStart(2,'0')+' min':'') : M+' min'; }

/* Velocidade com o ritmo correspondente, que é como corredores e nadadores pensam. */
function textoVelocidade(sp,v){
  const casas = sp.dist.vStep<0.5 ? 1 : 1;
  let t=nPT(v,casas)+' km/h';
  const r=sp.dist.ritmo;
  if(r && v>0){
    const porUnidade = r==='min/100m'? 60/v/10 : r==='min/500m'? 60/v/2 : 60/v;
    t+=' · '+mmss(porUnidade)+' '+r;
  }
  return t;
}

/* ================= COMPOSIÇÃO DOS INGREDIENTES =================
   Valores por 100 g ou 100 ml de parte edível. A fonte principal é a Tabela
   da Composição de Alimentos do Instituto Nacional de Saúde Doutor Ricardo
   Jorge (INSA/PortFIR, versão 7.1, 2026), descarregada da própria base e
   transcrita campo a campo — energia, hidratos de carbono, proteína, lípidos
   e fibra. Os ingredientes que a tabela portuguesa não cobre, por serem de
   uso recente ou importado (quinoa, couscous, tortilhas, granola, pesto,
   tahini, edamame, xarope de ácer, entre outros), ficam com valores do
   FoodData Central do USDA e estão assinalados.

   Uma convenção importa e é a portuguesa: os hidratos de carbono são os
   DISPONÍVEIS, sem a fibra, exatamente como num rótulo europeu, onde a fibra
   se declara à parte. Por isso o hidrato que conta para keto e low carb é o
   próprio valor, sem subtrair nada.

   Campos: k kcal, c hidratos, p proteína, f gordura, fib fibra, un gramas de
   uma unidade (um ovo, um dente de alho — 0 quando não se conta às unidades),
   s a secção do supermercado, u a unidade em que se mede.

   O s é um índice de CATS e tem de o ser: um valor fora da gama não dá erro
   nenhum — cai calado na classificação por nome, e o corredor do supermercado
   fica errado sem ninguém dar por isso. Já aconteceu aqui, em dezassete
   ingredientes. O −1 é o único valor especial e quer dizer «classifica pelo
   nome»: usa-se onde não há uma secção do INSA e o nome chega para acertar.

   Duas limitações ditas em voz alta: são ingredientes crus, e cozinhar muda o
   peso (a massa absorve água, a carne perde-a); e não há aqui perdas nem
   ganhos de confeção. Para planear uma semana chega bem; para uma prescrição
   clínica, não. */
const NUTRI={};
function NI(nome,k,c,p,f,fib,un,sec,u){
  NUTRI[nome]={k,c,p,f,fib:fib||0,un:un||0,s:(sec===undefined?-1:sec),u:u||'g'};
}

/* Parte edível. Compram-se 350 g de mexilhões e comem-se cerca de 100: o
   resto é concha. A lista de compras precisa do peso que se paga na peixaria,
   os macros precisam do peso que entra no prato, e é só aqui que os dois se
   separam. Fatias na linha do que as tabelas de composição publicam como
   parte edível — peixe inteiro pouco mais de metade, bivalves um terço,
   frango com osso três quartos. Tudo o que não está aqui vale 1. */
const PC_EDIVEL={
  'Mexilhões':0.30, 'Amêijoas':0.30, 'Camarão':0.55,
  'Sardinhas':0.55, 'Carapau':0.55, 'Cavala':0.55, 'Truta':0.58,
  'Dourada':0.52, 'Robalo':0.52,
  'Coxas de frango':0.75, 'Asas de frango':0.65, 'Costeletas de borrego':0.68
};
/* Converte uma linha de receita em gramas comestíveis. Devolve null quando não
   sabe — e quem chama tem de dizer isso a quem está a escrever a receita, em
   vez de somar zero e apresentar um total que parece completo. */
function gramasDe(nome,q,u){
  const n=NUTRI[nome]; if(!n) return null;
  const quant=parseFloat(q)||0;
  const pc=temChave(PC_EDIVEL,nome)? PC_EDIVEL[nome] : 1;
  if(u==='g'||u==='ml') return quant*pc;
  return n.un? quant*n.un*pc : null;
}
function macrosDeIngredientes(lista,doses){
  const d=Math.max(1,parseFloat(doses)||1);
  let k=0,c=0,p=0,f=0,fib=0; const semDados=[];
  (lista||[]).forEach(x=>{
    const nome=x[0], g=gramasDe(nome,x[1],x[2]), n=NUTRI[nome];
    if(g===null||!n){ semDados.push(nome); return; }
    k+=n.k*g/100; c+=n.c*g/100; p+=n.p*g/100; f+=n.f*g/100; fib+=n.fib*g/100;
  });
  const r1=v=>Math.round(v/d*10)/10;
  return {k:Math.round(k/d), c:r1(c), p:r1(p), f:r1(f), fib:r1(fib), semDados};
}
