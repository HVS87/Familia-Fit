<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestão de alimentação e fitness para toda a família — perfis, calorias, macros por dieta, receitas, plano semanal com cheat days e lista de compras.">
<meta name="color-scheme" content="light dark">
<meta name="author" content="Família Fit">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Família Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Família Fit — Alimentação & Movimento</title>
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#232930; --mut:#6A737D; --line:#E4E1D8;
  --accent:#2456A6; --accent-soft:#E8EEF8; --energy:#C8641E; --energy-soft:#F8EDE2;
  --party:#C2477C; --party-soft:#F9E9F1;
  --ok:#2E7D4F; --warn:#B07F14; --bad:#C24034;
  --mc:#C8862A; --mp:#2456A6; --mf:#7C5CB0;
  --shadow:0 1px 3px rgba(35,41,48,.07),0 4px 14px rgba(35,41,48,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181D; --card:#1C2229; --ink:#E8EAED; --mut:#96A0AA; --line:#2A323B;
    --accent:#7BA7E8; --accent-soft:#22304A; --energy:#E09550; --energy-soft:#3A2C1D;
    --party:#E38AA8; --party-soft:#3D2430;
    --ok:#5FBF8A; --warn:#D9B04A; --bad:#E07A6B;
    --mc:#DCA84F; --mp:#7BA7E8; --mf:#A98BD8;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#232930; --mut:#6A737D; --line:#E4E1D8;
  --accent:#2456A6; --accent-soft:#E8EEF8; --energy:#C8641E; --energy-soft:#F8EDE2;
  --party:#C2477C; --party-soft:#F9E9F1;
  --ok:#2E7D4F; --warn:#B07F14; --bad:#C24034;
  --mc:#C8862A; --mp:#2456A6; --mf:#7C5CB0;
  --shadow:0 1px 3px rgba(35,41,48,.07),0 4px 14px rgba(35,41,48,.05);
}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2229; --ink:#E8EAED; --mut:#96A0AA; --line:#2A323B;
  --accent:#7BA7E8; --accent-soft:#22304A; --energy:#E09550; --energy-soft:#3A2C1D;
  --party:#E38AA8; --party-soft:#3D2430;
  --ok:#5FBF8A; --warn:#D9B04A; --bad:#E07A6B;
  --mc:#DCA84F; --mp:#7BA7E8; --mf:#A98BD8;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;padding-bottom:60px}
h1,h2,h3,.display{font-family:Georgia,"Times New Roman",serif;font-weight:600;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px;margin-bottom:4px} h3{font-size:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand small{color:var(--mut);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:24px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sub{color:var(--mut);font-size:13.5px}
.lbl{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:10px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10151b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10151b}}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.party{border-color:var(--party);color:var(--party)}
.chip.party.on{background:var(--party-soft)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--bg);border-radius:10px;min-width:100px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 6px}
.mbar div{height:100%}
.mleg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
table{border-collapse:collapse;width:100%}
.splist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.spline{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg);
  display:flex;flex-direction:column;gap:10px}
.sptop{display:flex;gap:10px;align-items:center}
.sptop select{flex:1 1 auto;min-width:0}
.spgrid{display:flex;flex-direction:column;gap:11px}
.splabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.splabel output{font-size:14.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.spfoot{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-top:9px;border-top:1px solid var(--line)}
.spfoot select{width:auto;min-width:0;flex:0 1 auto}
.sphoras{display:flex;align-items:center;gap:5px}
.sphoras input{width:70px}
.spgasto{margin-left:auto;text-align:right;white-space:nowrap}
.spgasto .sub{display:block;font-size:11.5px}
.pill.nivel{background:var(--accent-soft);color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;padding:0;
  background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--accent);border:3px solid var(--card);margin-top:-7px;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:3px solid var(--card);border-radius:50%;
  background:var(--accent)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
/* Sliders de macros com a cor do próprio macro. */
.rgC::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mc) var(--pct,0%),var(--line) var(--pct,0%))}
.rgC::-webkit-slider-thumb{background:var(--mc)}
.rgC::-moz-range-progress{background:var(--mc)} .rgC::-moz-range-thumb{background:var(--mc)}
.rgP::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mp) var(--pct,0%),var(--line) var(--pct,0%))}
.rgP::-webkit-slider-thumb{background:var(--mp)}
.rgP::-moz-range-progress{background:var(--mp)} .rgP::-moz-range-thumb{background:var(--mp)}
.rgF::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mf) var(--pct,0%),var(--line) var(--pct,0%))}
.rgF::-webkit-slider-thumb{background:var(--mf)}
.rgF::-moz-range-progress{background:var(--mf)} .rgF::-moz-range-thumb{background:var(--mf)}
/* Gráficos: espelho, não controlo — nunca roubam o scroll nem o toque.
   Cores SEMPRE por classe (var() em atributos SVG não é fiável). */
.svgfx{display:block;width:100%;height:auto;pointer-events:none}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-bad{fill:var(--bad)}
.f-mut{fill:var(--mut)} .f-line{fill:var(--line)} .f-ink{fill:var(--ink)}
.f-acc{fill:var(--accent)} .f-energy{fill:var(--energy)} .f-party{fill:var(--party)}
.f-card{fill:var(--card)} .f-mc{fill:var(--mc)} .f-mp{fill:var(--mp)} .f-mf{fill:var(--mf)}
.s-ok{stroke:var(--ok)} .s-line{stroke:var(--line)} .s-ink{stroke:var(--ink)}
.s-acc{stroke:var(--accent)} .s-energy{stroke:var(--energy)} .s-mut{stroke:var(--mut)}
.f-ok-txt{color:var(--ok)}
.dt-ok{background:var(--ok)} .dt-warn{background:var(--warn)} .dt-bad{background:var(--bad)}
.dt-line{background:var(--line)} .dt-party{background:var(--party)}
.day{scroll-margin-top:130px}
.shop label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
@media (prefers-reduced-motion: no-preference){ #co-bar{transition:width .2s,background-color .2s} }
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.rc h3{font-size:15.5px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--mut);margin:1px 2px 1px 0}
.kcal{color:var(--energy);font-weight:700;font-variant-numeric:tabular-nums}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.day.cheat-any{border-color:var(--party)}
.dhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;background:var(--bg)}
.dhead b{font-family:Georgia,serif;font-size:16px}
.meal{padding:10px 14px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.mtitle{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:5px}
.shop li{list-style:none;display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--line)}
.shop li.done span{text-decoration:line-through;color:var(--mut)}
.shop .q{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.cat-h{margin:18px 0 4px;font-family:Georgia,serif;font-size:15px;color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--mut)}
.notice{background:var(--party-soft);border:1px solid var(--party);color:var(--party);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px}
.secgap{margin-top:28px}
.savest{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap;
  background:none;border:none;cursor:pointer;padding:4px 2px;font-family:inherit}
.savest:hover{color:var(--ink)}
.savest .led{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.savest.pend .led{background:var(--warn)}
.savest.err{color:var(--bad)} .savest.err .led{background:var(--bad)}
.savest.none .led{background:var(--line)}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:inherit;resize:vertical}
.toggle{display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:4px 0}
.toggle input{margin-top:4px;flex:none}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.msg{border-radius:9px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.msg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.msg.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
@media (prefers-reduced-motion: no-preference){ .card,.day,.rc{transition:box-shadow .15s} }

/* ============ TOQUE, TELEMÓVEL E TABLET ============ */
/* Reservas para Safari anterior ao 16.4, que não conhece color-mix():
   a declaração simples fica antes e é usada quando a seguinte é ignorada. */
.pill.ok{background:rgba(46,125,79,.14)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{background:rgba(176,127,20,.16)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{background:rgba(194,64,52,.14)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.msg.ok{background:rgba(46,125,79,.13)}
.msg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.msg.bad{background:rgba(194,64,52,.13)}
.msg.bad{background:color-mix(in srgb,var(--bad) 13%,transparent)}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input,label,.chip{touch-action:manipulation}
button,.chip,.filebtn{-webkit-tap-highlight-color:transparent}
button:active,.chip:active,.filebtn:active{opacity:.82}
input[type=checkbox]{accent-color:var(--accent)}
/* O select nativo do iOS ignora o desenho da página; uniformiza-se a seta. */
select{-webkit-appearance:none;appearance:none;padding-right:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.6 6 6.4 11 1.6' fill='none' stroke='%238A929B' stroke-width='1.7' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:11px 8px}
/* Margens seguras do notch e da barra inferior do iPhone (viewport-fit=cover). */
.hwrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
body{padding-bottom:max(60px,calc(env(safe-area-inset-bottom) + 44px))}

@media (max-width:760px){
  /* Seis separadores não cabem em linha: passam a faixa que desliza na horizontal. */
  nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none}
  .hwrap{gap:10px}
  .savest{margin-left:auto}
}
@media (max-width:640px){
  .hwrap{padding:10px 14px}
  main{padding:16px 12px}
  .hwrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  h1{font-size:22px} h2{font-size:19px}
  .card{padding:15px 16px}
  .stat{flex:1 1 92px}
  .frow{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
}
@media (max-width:560px){
  /* Sem min-width:0 um select impõe a largura da opção mais comprida
     ("Ciclismo de montanha (subida)") e nada mais cabe na linha. */
  .spline select{min-width:0}
  .spfoot{gap:8px}
  .spfoot select{flex:1 1 130px}
  .spgasto{flex:1 1 100%;margin-left:0;text-align:left;padding-top:2px}
  .spgasto .sub{display:inline;margin-left:6px}
}
/* Ecrãs de toque: alvos de 44 px e campos a 16 px, que é o mínimo para o
   iOS não fazer zoom automático ao tocar num campo. */
@media (hover:none) and (pointer:coarse){
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
  .btn,nav button{min-height:44px}
  .chip{min-height:42px;padding:7px 14px}
  .btn.small{min-height:40px;padding:8px 13px}
  .savest{min-height:40px}
  .shop li{padding:11px 4px}
  .shop input[type=checkbox]{width:22px;height:22px}
  .toggle input{width:20px;height:20px}
  textarea{min-height:140px}
  .spline select,.spline input[type=number]{min-height:42px}
  /* Alvo maior para o dedo agarrar o slider sem falhar. */
  input[type=range]{height:44px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-10px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px}
  .spgrid{gap:14px}
  .splabel{margin-bottom:5px}
}
/* Tablet em vertical: duas colunas confortáveis em vez de três apertadas. */
@media (min-width:700px) and (max-width:1024px){
  .g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}

/* ============ ORIENTAÇÃO ============ */
/* Grelha dos dias do plano, para poder mudar com a orientação. */
.gdias{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* Reserva sem JavaScript: qualquer ecrã muito baixo é um telemóvel deitado. */
@media (orientation:landscape) and (max-height:460px){
  header{position:static}
  .brand small{display:none}
  .hwrap{padding-top:7px;padding-bottom:7px}
}

/* O detetor de orientação marca <html> com data-orient e data-dispositivo,
   o que permite distinguir um telemóvel deitado de um tablet deitado —
   coisa que as media queries de largura, por si só, não conseguem. */

/* Telemóvel deitado: a altura passa a ser o recurso escasso. O cabeçalho
   deixa de ser fixo e encolhe, para a lista não ficar a espiar por uma frincha. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .svg-linha{height:80px}
html[data-orient="paisagem"][data-dispositivo="telefone"] #pla-resumo{display:none}
html[data-orient="paisagem"][data-dispositivo="telefone"] header{position:static}
html[data-orient="paisagem"][data-dispositivo="telefone"] .hwrap{padding-top:6px;padding-bottom:6px;gap:8px}
html[data-orient="paisagem"][data-dispositivo="telefone"] .brand small{display:none}
html[data-orient="paisagem"][data-dispositivo="telefone"] h1{font-size:18px}
html[data-orient="paisagem"][data-dispositivo="telefone"] nav button{min-height:38px;padding:6px 11px}
html[data-orient="paisagem"][data-dispositivo="telefone"] main{padding-top:12px}
html[data-orient="paisagem"][data-dispositivo="telefone"] .secgap{margin-top:18px}
/* Ao deitar, a largura dá para duas colunas de cartões. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .g2,
html[data-orient="paisagem"][data-dispositivo="telefone"] .g3,

/* ================= DADOS BASE ================= */
/* Desportos com três níveis de intensidade. Os valores são METs (equivalentes
   metabólicos) do Compendium of Physical Activities, na ordem leve / moderado /
   intenso. Onde a velocidade ou o terreno mandam mais do que o esforço sentido
   — ciclismo, corrida, caminhada — a dica indica o que cada nível representa. */
const NIVEIS=[['leve','Leve'],['moderado','Moderado'],['intenso','Intenso']];

/* Nos desportos em que a velocidade é que manda no esforço, o MET não se
   escolhe por níveis: lê-se de uma curva velocidade → MET, interpolada entre

const CURVAS={
  andar:      [[3,2.3],[4,2.9],[4.8,3.3],[5.6,4.3],[6.4,5.0],[7.2,7.0],[8,8.3]],
  correr:     [[6.4,6.0],[8,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8],[16.1,14.5],[17.5,16.0],[19.3,19.0]],
  trail:      [[5,6.5],[7,8.5],[9,10.5],[11,12.5],[13,14.0],[15,16.0]],
  estrada:    [[10,4.0],[16,6.8],[19,8.0],[22.5,10.0],[26,12.0],[31,15.8],[35,17.0]],
  subida:     [[6,6.0],[9,8.0],[12,10.0],[15,12.0],[18,14.0],[22,16.0]],
  btt:        [[8,5.5],[12,7.5],[16,9.0],[20,11.0],[24,13.0],[28,15.0]],
  passeio:    [[8,3.5],[12,4.5],[16,6.8],[19,8.0],[22,9.5]],
  nadar:      [[1.5,5.3],[2,6.5],[2.5,8.0],[3,9.5],[3.5,10.5],[4.5,11.8]],
  remar:      [[4,4.0],[6,6.0],[8,8.5],[10,11.0],[12,12.5],[14,13.5]],
  patinar:    [[6,4.8],[8,5.5],[12,7.0],[16,9.0],[20,11.0],[26,12.5]]

/* Interpolação linear, com os extremos fixos fora da tabela. */
function metPorVelocidade(nome,v){
  const c=CURVAS[nome]; if(!c) return 0;
  if(v<=c[0][0]) return c[0][1];
  if(v>=c[c.length-1][0]) return c[c.length-1][1];
  for(let i=1;i<c.length;i++){
    if(v<=c[i][0]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
      return m0+(m1-m0)*(v-v0)/(v1-v0); }
  }
  return c[c.length-1][1];
}
/* O inverso: a que velocidade se atinge um dado MET. Serve para converter os
   registos antigos (horas + nível) sem lhes mudar as calorias. */
function velocidadeParaMet(dist,met){
  const c=CURVAS[dist.curva];
  let v=c[0][0];
  if(met>=c[c.length-1][1]) v=c[c.length-1][0];
  else if(met>c[0][1]){
    for(let i=1;i<c.length;i++){
      if(met<=c[i][1]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
        v = m1===m0 ? v0 : v0+(v1-v0)*(met-m0)/(m1-m0); break; }
    }
  }
  return Math.min(Math.max(v,dist.vmin),dist.vmax);
}

const SPORT={}; SPORTS.forEach(s=>{ SPORT[s.id]=s; });
function nivelIndice(i){ const n=NIVEIS.findIndex(x=>x[0]===i); return n<0? 1 : n; }
function velocidade(s){ const sp=SPORT[s.s]; if(!sp||!sp.dist) return 0;
  const v=parseFloat(s.v); return isFinite(v)&&v>0 ? Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax) : sp.dist.vdef; }
/* Horas dentro do período escolhido: nos desportos de distância vêm de km ÷ velocidade. */
function horasPeriodo(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  if(sp.dist){ const v=velocidade(s); return v>0? (parseFloat(s.km)||0)/v : 0; }
  return parseFloat(s.h)||0; }
function metDe(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  return sp.dist ? metPorVelocidade(sp.dist.curva, velocidade(s)) : sp.mets[nivelIndice(s.i)]; }
/* Nos desportos de distância o nível deixa de se escolher: lê-se do MET. */
function nivelPorMet(sp,met){ return met < (sp.mets[0]+sp.mets[1])/2 ? 0
  : met < (sp.mets[1]+sp.mets[2])/2 ? 1 : 2; }
function rotuloNivel(sp,idx){ return NIVEIS[idx][1]+(sp && sp.dicas? ' ('+sp.dicas[idx]+')' : ''); }
/* Um registo válido para cada tipo de desporto. Os registos antigos de um
   desporto de distância (horas + nível) convertem-se para a velocidade que dá
   exatamente o mesmo MET, de modo que as calorias já calculadas não mudem. */
function normalizaDesporto(s){
  if(!s) return null;
  if(!temChave(SPORT,s.s)) return null;
  const sp=SPORT[s.s];
  const per=['dia','semana','mes'].indexOf(s.per)>=0 ? s.per : 'semana';
  if(sp.dist){
    let v=parseFloat(s.v), km=parseFloat(s.km), converter=false;
    if(!(isFinite(v)&&v>0) || !isFinite(km)){ v=velocidadeParaMet(sp.dist, sp.mets[nivelIndice(s.i)]); converter=true; }
    v=Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax);
    /* A velocidade assenta num passo do slider antes de gerar a distância,
       para as horas do registo antigo se manterem exatas. */
    v=Math.round(Math.round(v/sp.dist.vStep)*sp.dist.vStep*100)/100;
    if(converter) km=(parseFloat(s.h)||0)*v;
    return {s:sp.id, per, v, km:Math.max(0,Math.round(km*10)/10)};
  }
  return {s:sp.id, per, h:Math.max(0,parseFloat(s.h)||0),
    i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'};
}
function normalizaMembro(m){
  if(m && Array.isArray(m.desportos)) m.desportos=m.desportos.map(normalizaDesporto).filter(Boolean);

  if(m && !Number.isFinite(m.objetivoPct)) m.objetivoPct=Math.round((GOALS[m.objetivo]?.[1]||0)*100);

function faixaDist(sp,per){
  const sem=sp.dist.maxSemana;

  const step = max<=10? 0.25 : max<=60? 0.5 : max<=200? 1 : 5;
  return {max,step};
}
function nPT(v,casas){ return (Math.round(v*Math.pow(10,casas))/Math.pow(10,casas))

function mmss(min){ if(!isFinite(min)||min<=0) return '—';

/* ================= ESTADO ================= */
const KEY='familiaFitV1', APPID='familia-fit', FORMATO=1;
let saveErr='', msg=null;
function blank(){ return {members:[],cheats:{},plans:{},bought:{},prefCuisine:'todas',
  ui:{tab:'familia',mid:null,cuis:'todas',soComp:false,mealF:'todas'}, week:mondayISO(new Date()),
  meta:{gravadoEm:null,exportadoEm:null,semCopia:false,avisarAoSair:true}}; }
let S = load();
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || !Array.isArray(s.members)) return blank();
  const b=blank();
  if(!dataValida(s.week)) s.week=mondayISO(new Date());   /* semana corrompida não prende a app */
  s.members.forEach(normalizaMembro);
  return Object.assign(b, s, {ui:Object.assign(b.ui,s.ui||{}), meta:Object.assign(b.meta,s.meta||{})});
}
function writeLS(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); saveErr=''; }
  catch(e){ saveErr = e.name==='QuotaExceededError'
    ? 'Não há espaço para gravar mais dados neste browser. Exporta uma cópia e apaga semanas antigas.'
    : 'O browser está a bloquear a gravação local. Em janela privada os dados perdem-se ao fechar — exporta uma cópia.'; }
  paintSave();
}
/* save() = alteração de dados: grava e marca que ainda não há cópia exportada.
   saveMeta() = alteração só de definições: grava sem mexer nesse estado. */
function save(){ S.meta.gravadoEm=new Date().toISOString(); S.meta.semCopia=true; writeLS(); }
function saveMeta(){ S.meta.gravadoEm=new Date().toISOString(); writeLS(); }
function hhmm(isoS){ if(!isoS) return '—'; const d=new Date(isoS);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dataHora(isoS){ if(!isoS) return 'nunca'; const d=new Date(isoS);
  return fmtShort(iso(d))+' às '+hhmm(isoS); }
function paintSave(){
  const el=document.getElementById('savest'); if(!el) return;
  if(saveErr){ el.className='savest err'; el.innerHTML='<i class="led"></i> gravação bloqueada'; return; }
  if(!S.members.length){ el.className='savest none'; el.innerHTML='<i class="led"></i> sem dados'; return; }
  if(S.meta.semCopia){ el.className='savest pend'; el.innerHTML='<i class="led"></i> guardado '+hhmm(S.meta.gravadoEm)+' · sem cópia'; return; }
  el.className='savest'; el.innerHTML='<i class="led"></i> guardado '+hhmm(S.meta.gravadoEm)+' · cópia feita';
}

function uid(){ return 'm'+Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= CÁLCULOS ================= */
function bmi(m){ const h=m.altura/100; return h>0? m.peso/(h*h) : 0; }
function bmiClass(v){ return v<18.5?['Abaixo do peso','warn']: v<25?['Peso normal','ok']: v<30?['Excesso de peso','warn']:['Obesidade','bad']; }
function bmr(m){ return m.sexo==='f' ? 10*m.peso+6.25*m.altura-5*m.idade-161 : 10*m.peso+6.25*m.altura-5*m.idade+5; }
function sportWeeklyH(s){ const h=horasPeriodo(s);
  return s.per==='dia'? h*7 : s.per==='mes'? h/4.345 : h; }
function sportsKcalDay(m){ return (m.desportos||[]).reduce((t,s)=> t + metDe(s)*m.peso*sportWeeklyH(s), 0)/7; }
function commuteKcalDay(m){ return (COMMUTE[m.desloc]?.[1]||0)*m.peso*(5/7); }
function tdee(m){ return bmr(m)*(BASE_ACT[m.atividade]?.[1]||1.2) + sportsKcalDay(m) + commuteKcalDay(m); }
function clampNum(v,a,b){ return Math.min(Math.max(v,a),b); }
/* Validar com OBJ[chave] deixava passar nomes herdados do Object.prototype:
   uma dieta chamada "constructor" passava a lista branca e dava macros NaN. */
function temChave(o,k){ return typeof k==='string' && Object.prototype.hasOwnProperty.call(o,k); }
/* E o regex de data aceitava 2026-99-99, que gerava uma semana «NaN-NaN-NaN»
   de onde não se saía. Só passa uma data que exista mesmo. */
function dataValida(s){
  if(typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d=new Date(s+'T12:00:00');
  return !isNaN(d.getTime()) && iso(d)===s;
}
/* Objetivo em percentagem contínua do gasto (−25…+20). Para dados antigos,
   deriva-se dos fatores de GOALS — perder=−15, manter=0, ganhar=+10 — pelo
   que o alvo calórico migrado fica bit a bit igual ao anterior. */
function objetivoPct(m){ return Number.isFinite(m.objetivoPct)? clampNum(Math.round(m.objetivoPct),-25,20)
  : Math.round((GOALS[m.objetivo]?.[1]||0)*100); }
function rotuloObjetivo(m){ const p=objetivoPct(m);
  if(p===0) return 'Manter peso';
  const sinal=(p>0?'+':'−')+Math.abs(p)+' %';
  return (p<=-8? 'Perder peso (' : p>=5? 'Ganhar massa (' : 'Manter peso (')+sinal+')'; }
function targetKcal(m){ return tdee(m)*(1+objetivoPct(m)/100); }
/* A dieta lida SEMPRE por aqui: para presets devolve o objeto de DIETS
   (gramas inalteradas); «personalizada» usa os macros do próprio membro. */
function dietaDe(m){
  if(m.dieta==='personalizada'){ const mc=m.macros;
    const ok=mc && [mc.c,mc.p,mc.f].every(v=>Number.isFinite(v)&&v>=0) && Math.round(mc.c+mc.p+mc.f)===100;
    return Object.assign({n:'Personalizada'}, ok? {c:mc.c,p:mc.p,f:mc.f} : {c:50,p:20,f:30}); }
  return temChave(DIETS,m.dieta)? DIETS[m.dieta] : DIETS.equilibrada; }
function macros(m){ const d=dietaDe(m), k=targetKcal(m);
  return {c:Math.round(k*d.c/100/4), p:Math.round(k*d.p/100/4), f:Math.round(k*d.f/100/9), pct:d}; }
function compat(r,dieta){ return dieta==='equilibrada' || dieta==='personalizada' || r.d.includes(dieta); }
function compatAll(r,ms){ return ms.every(m=>compat(r,m.dieta)); }
function gastoPartes(m){ const b=bmr(m);
  return {basal:b, dia:b*((BASE_ACT[m.atividade]?.[1]||1.2)-1), desloc:commuteKcalDay(m), desp:sportsKcalDay(m), total:tdee(m)}; }
/* kg por semana implicados pelo objetivo (positivo = a perder), a 7700 kcal/kg. */
function ritmoSemanal(m){ return (tdee(m)-targetKcal(m))*7/7700; }
/* Projeção iterativa: o gasto recalcula-se com o peso de cada semana, pelo que
   a curva achata à medida que o corpo muda — mais honesta do que uma reta. */
function projecaoPeso(m,sem){ sem=sem||12; const out=[Math.round(m.peso*10)/10]; const c=Object.assign({},m);
  for(let i=0;i<sem;i++){ c.peso=Math.max(30, c.peso+(targetKcal(c)-tdee(c))*7/7700); out.push(Math.round(c.peso*10)/10); }
  return out; }
/* Escala linear com clamp — o utilitário de todos os gráficos. */
function sx(v,d0,d1,x0,x1){ if(d1===d0) return x0; const t=clampNum((v-d0)/(d1-d0),0,1); return x0+t*(x1-x0); }
/* Reparte {c,p,f} por 100 inteiros pelo método do maior resto — determinístico,
   a soma nunca dá 99 nem 101. */
function normaliza100(o){
  const brutos=['c','p','f'].map(k=>Math.max(0,parseFloat(o&&o[k])||0));
  const soma=brutos[0]+brutos[1]+brutos[2]||1;
  const exatos=brutos.map(v=>v/soma*100), base=exatos.map(v=>Math.floor(v));
  let falta=100-(base[0]+base[1]+base[2]);
  const ordem=[0,1,2].sort((a,b)=>(exatos[b]-base[b])-(exatos[a]-base[a]));
  for(let i=0;i<falta;i++) base[ordem[i%3]]++;
  return {c:base[0],p:base[1],f:base[2]};
}

function mondayISO(d){ d=new Date(d); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekDates(wk){ const out=[]; const d=new Date(wk+'T12:00:00'); for(let i=0;i<7;i++){ out.push(iso(d)); d.setDate(d.getDate()+1);} return out; }

/* kcal planeadas de um membro num dia da semana atual + estado qualitativo.
   A MESMA função alimenta o gráfico do resumo e os pontos dos cartões-dia,
   para os dois nunca divergirem. Dias incompletos nunca são julgados. */
function kcalPlaneadasDia(m,di,dates){
  if(isCheat(m.id,dates[di])) return {cheat:true,kcal:0,refs:0};
  const w=S.plans[S.week]||{}; let kcal=0,refs=0;
  MEALK.forEach(mk=>{ const meal=w[di]&&w[di][mk]; if(!meal||!meal.r||meal.m.indexOf(m.id)<0) return;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) return; kcal+=r.k; refs++; });
  return {cheat:false,kcal,refs};
}
function estadoDia(m,di,dates){
  const d=kcalPlaneadasDia(m,di,dates);
  if(d.cheat) return Object.assign({st:'cheat'},d);
  if(!d.refs) return Object.assign({st:'vazio'},d);
  if(d.refs<MEALK.length) return Object.assign({st:'incompleto'},d);
  const alvo=targetKcal(m), dv=alvo>0? Math.abs(d.kcal-alvo)/alvo : 1;
  return Object.assign({st: dv<=0.10?'ok': dv<=0.25?'warn':'bad'},d);
}

function updSport(mid,i,f,val){

/* Contrato tátil de toda a app: oninput muta o estado e reescreve SÓ os alvos
   com id (nunca render), onchange grava. O coalescedor prende as escritas de
   DOM ao ritmo dos frames — em aparelhos lentos o input dispara mais depressa. */
/* Coalesce por chave: com dois dedos em cartões diferentes, guardar só o
   último callback deixava um deles por pintar — aqui cada alvo tem a sua
   entrada e todos correm no mesmo frame. */
let _raf=0; const _pend={};
function aoVivo(chave,fn){
  _pend[chave]=fn;
  if(_raf) return;
  _raf=requestAnimationFrame(()=>{ _raf=0;
    const fns=Object.keys(_pend).map(k=>{ const f=_pend[k]; delete _pend[k]; return f; });
    fns.forEach(f=>f());
  });
}

function põeAttr(id,attr,val){ const el=document.getElementById(id); if(el) el.setAttribute(attr,val); }
function slideSport(mid,i,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m||!m.desportos[i]) return;
  m.desportos[i][campo]=parseFloat(el.value)||0;
  pintaRange(el);
  aoVivo('atv', atualizarAtividade);
}
function atualizarAtividade(){
  const m=curM(); if(!m) return;
  (m.desportos||[]).forEach((s,i)=>{
    const sp=SPORT[s.s]; if(!sp) return;
    const met=metDe(s), kd=met*m.peso*sportWeeklyH(s)/7;
    if(sp.dist){
      põe('sp'+i+'-km', nPT(parseFloat(s.km)||0, faixaDist(sp,s.per).step<1?1:0)+' km');
      põe('sp'+i+'-v', textoVelocidade(sp, velocidade(s)));
      põe('sp'+i+'-t', hmm(horasPeriodo(s))+' por '+porLabel(s.per));
      põe('sp'+i+'-nivel', NIVEIS[nivelPorMet(sp,met)][1]);
      /* o ponto na curva move-se só com a velocidade (o MET não depende da distância) */
      const d=sp.dist, y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
      const cx=sx(velocidade(s),d.vmin,d.vmax,36,330).toFixed(1);
      const cy=sx(met,y0,y1,104,10).toFixed(1);
      põeAttr('sp'+i+'-dot','cx',cx); põeAttr('sp'+i+'-dot','cy',cy);
      const drop=document.getElementById('sp'+i+'-drop');
      if(drop){ drop.setAttribute('x1',cx); drop.setAttribute('x2',cx);
        drop.setAttribute('y1',cy); drop.setAttribute('y2','104'); }
    }
    põe('sp'+i+'-kcal','~'+Math.round(kd)+' kcal/dia');
    põe('sp'+i+'-met', nPT(met,1)+' MET · '+Math.round(met*m.peso)+' kcal/h');
  });
  põe('tot-desporto','+'+Math.round(sportsKcalDay(m)));
  põe('tot-total', Math.round(tdee(m)));
  /* barra empilhada do gasto + linha do alvo — a mesma assinatura da Nutrição e do Plano */
  const gp=gastoPartes(m), alvo=targetKcal(m);
  const barra=document.getElementById('ga-basal');
  if(barra){
    const K=Math.max(gp.total,alvo)*1.05||1, w=x=>Math.max(0,x/K*100);
    barra.style.width=w(gp.basal)+'%';
    document.getElementById('ga-dia').style.width=w(gp.dia)+'%';
    document.getElementById('ga-desloc').style.width=w(gp.desloc)+'%';
    document.getElementById('ga-desp').style.width=w(gp.desp)+'%';
    const X=w(alvo), linha=document.getElementById('ga-alvo'), txt=document.getElementById('ga-alvo-txt');
    if(linha) linha.style.left=X+'%';
    if(txt){ txt.style.left=X+'%'; txt.style.transform=X>78?'translateX(-100%)':'none';
      txt.textContent='alvo '+Math.round(alvo); }
    põe('ga-alvostat', Math.round(alvo));
  }
}
function delSport(mid,i){ const m=S.members.find(x=>x.id===mid); m.desportos.splice(i,1); save(); render(); }

/* Curva velocidade→MET com o ponto do slider. A interpolação da app é linear,
   por isso a polyline pelos pontos tabelados É a curva exata, não uma amostra. */
function curvaMetSvg(sp,s,i){
  const d=sp.dist, c=CURVAS[d.curva];
  const y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
  const X=v=>sx(v,d.vmin,d.vmax,36,330), Y=met=>sx(met,y0,y1,104,10);
  const pts=[[d.vmin,metPorVelocidade(d.curva,d.vmin)]]
    .concat(c.filter(p=>p[0]>d.vmin&&p[0]<d.vmax))
    .concat([[d.vmax,metPorVelocidade(d.curva,d.vmax)]]);
  const poly=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const area=poly+' '+X(d.vmax).toFixed(1)+',104 '+X(d.vmin).toFixed(1)+',104';
  /* divisórias de nível derivadas dos mesmos limiares de nivelPorMet */
  const v1=velocidadeParaMet(d,(sp.mets[0]+sp.mets[1])/2), v2=velocidadeParaMet(d,(sp.mets[1]+sp.mets[2])/2);
  const zonas=[[d.vmin,v1,'leve'],[v1,v2,'moderado'],[v2,d.vmax,'intenso']];
  const rotZonas=zonas.map(z=>{ const w=X(z[1])-X(z[0]);
    return w>=44? `<text x="${((X(z[0])+X(z[1]))/2).toFixed(1)}" y="20" font-size="9.5" text-anchor="middle" class="f-mut">${z[2]}</text>`:''; }).join('');
  const divisorias=[v1,v2].map(v=>`<line x1="${X(v).toFixed(1)}" y1="10" x2="${X(v).toFixed(1)}" y2="104" class="s-line" stroke-dasharray="2 4"/>`).join('');
  const meio=Math.round((d.vmin+d.vmax)/2);
  /* a natação vai de 1,5 a 4,5 km/h: arredondar o rótulo a inteiro punha «2» e
     «5» por baixo dos extremos reais */
  const rotV=v=>nPT(v, Number.isInteger(v)?0:1);
  const ticksX=[d.vmin,meio,d.vmax].map(v=>`<text x="${X(v).toFixed(1)}" y="118" font-size="10" text-anchor="middle" class="f-mut" style="font-variant-numeric:tabular-nums">${rotV(v)}</text>`).join('');
  const m1=Math.ceil(y0), m2=Math.floor(y1);
  const ticksY=`<text x="30" y="${(Y(m1)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m1}</text>
    <text x="30" y="${(Y(m2)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m2}</text>`;
  const vA=velocidade(s), cx=X(vA).toFixed(1), cy=Y(metDe(s)).toFixed(1);
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 132" preserveAspectRatio="none" aria-hidden="true">
    <line x1="36" y1="104" x2="330" y2="104" class="s-line"/>
    <polygon points="${area}" class="f-acc" fill-opacity=".07"/>
    <polyline points="${poly}" class="s-acc" fill="none" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${divisorias}${rotZonas}${ticksX}${ticksY}
    <text x="330" y="130" font-size="9.5" text-anchor="end" class="f-mut">km/h</text>
    <text x="30" y="14" font-size="9.5" text-anchor="end" class="f-mut">MET</text>
    <line id="sp${i}-drop" x1="${cx}" y1="${cy}" x2="${cx}" y2="104" class="s-energy" stroke-dasharray="3 3" opacity=".5"/>
    <circle id="sp${i}-dot" cx="${cx}" cy="${cy}" r="5.5" style="fill:var(--energy);stroke:var(--card);stroke-width:2"/>
  </svg>`;
}
/* Desportos por níveis: escala fixa 2–16 MET, comparável entre desportos —
   vê-se que o «intenso» do ténis de mesa fica abaixo do «leve» da corrida. */
function escalaMet3(sp,s){
  const x=met=>sx(clampNum(met,2,16),2,16,12,328);
  const ni=nivelIndice(s.i);
  return `<svg class="svgfx" viewBox="0 0 340 40" aria-hidden="true">
    <line x1="12" y1="22" x2="328" y2="22" class="s-line"/>
    ${sp.mets.map((met,idx)=>`
      <circle cx="${x(met).toFixed(1)}" cy="22" r="${idx===ni?6:4}" style="${idx===ni?'fill:var(--accent);stroke:var(--card);stroke-width:2':'fill:var(--card);stroke:var(--mut);stroke-width:1.5'}"/>
      <text x="${x(met).toFixed(1)}" y="38" font-size="9.5" text-anchor="middle" class="${idx===ni?'f-ink':'f-mut'}" style="font-variant-numeric:tabular-nums"${idx===ni?' font-weight="700"':''}>${nPT(met,1)}</text>`).join('')}
    <text x="328" y="10" font-size="9.5" text-anchor="end" class="f-mut">escala 2–16 MET</text>
  </svg>`;
}
function blocoDesporto(m,s,i){
  const sp=SPORT[s.s], met=metDe(s);
  const kd=Math.round(met*m.peso*sportWeeklyH(s)/7), kh=Math.round(met*m.peso);
  const periodo=`<select onchange="updSport('${m.id}',${i},'per',this.value)" aria-label="Período">
      <option value="dia" ${s.per==='dia'?'selected':''}>por dia</option>
      <option value="semana" ${s.per==='semana'?'selected':''}>por semana</option>
      <option value="mes" ${s.per==='mes'?'selected':''}>por mês</option></select>`;
  const gasto=`<span class="kcal" id="sp${i}-kcal">~${kd} kcal/dia</span>
    <span class="sub" id="sp${i}-met">${nPT(met,1)} MET · ${kh} kcal/h</span>`;
  let miolo;
  if(sp.dist){
    const f=faixaDist(sp,s.per), km=parseFloat(s.km)||0, v=velocidade(s);
    const pctKm=f.max>0? Math.round(km/f.max*100):0;
    const pctV=Math.round((v-sp.dist.vmin)/(sp.dist.vmax-sp.dist.vmin)*100);
    miolo=`<div class="spgrid">
      <div>
        <div class="splabel"><span>Distância por ${porLabel(s.per)}</span>
          <output id="sp${i}-km">${nPT(km,f.step<1?1:0)} km</output></div>
        <input type="range" min="0" max="${f.max}" step="${f.step}" value="${km}" style="--pct:${pctKm}%"
          aria-label="Distância por ${porLabel(s.per)}, em quilómetros"
          oninput="slideSport('${m.id}',${i},'km',this)" onchange="save()">
      </div>
      ${curvaMetSvg(sp,s,i)}
      <div>
        <div class="splabel"><span>Velocidade</span>
          <output id="sp${i}-v">${textoVelocidade(sp,v)}</output></div>
        <input type="range" min="${sp.dist.vmin}" max="${sp.dist.vmax}" step="${sp.dist.vStep}" value="${v}" style="--pct:${pctV}%"
          aria-label="Velocidade média em quilómetros por hora"
          oninput="slideSport('${m.id}',${i},'v',this)" onchange="save()">
      </div>
    </div>
    <div class="spfoot">${periodo}
      <span class="pill nivel" id="sp${i}-nivel">${NIVEIS[nivelPorMet(sp,met)][1]}</span>
      <span class="sub" id="sp${i}-t">${hmm(horasPeriodo(s))} por ${porLabel(s.per)}</span>
      <span class="spgasto">${gasto}</span></div>`;
  } else {
    miolo=`${escalaMet3(sp,s)}<div class="spfoot">
      <select onchange="updSport('${m.id}',${i},'i',this.value)" aria-label="Intensidade">${NIVEIS.map(([k],ni)=>
        `<option value="${k}" ${nivelIndice(s.i)===ni?'selected':''}>${rotuloNivel(sp,ni)}</option>`).join('')}</select>
      <span class="sphoras"><input type="number" min="0" step="0.5" inputmode="decimal" value="${s.h}"
        aria-label="Horas" onchange="updSport('${m.id}',${i},'h',this.value)"> <span class="sub">h</span></span>
      ${periodo}<span class="spgasto">${gasto}</span></div>`;
  }
  return `<div class="spline">
    <div class="sptop">
      <select onchange="updSport('${m.id}',${i},'s',this.value)" aria-label="Desporto">${opcoesDesporto(s.s)}</select>
      <button class="btn danger small" onclick="delSport('${m.id}',${i})" aria-label="Remover desporto">✕</button>
    </div>${miolo}</div>`;
}

  <div class="grid" style="grid-template-columns:1fr;max-width:760px">
    <div class="card">
      <h2>Dia-a-dia de ${esc(m.nome)}</h2>
      <div class="frow" style="grid-template-columns:1fr 1fr">
        <div><label class="lbl">Nível de atividade diária</label>
          <select onchange="upd('${m.id}','atividade',this.value)">${Object.entries(BASE_ACT).map(([k,v])=>
            `<option value="${k}" ${m.atividade===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
        <div><label class="lbl">Deslocação para o trabalho/escola</label>

      ${m.desportos.length? `<div class="splist">${m.desportos.map((s,i)=>blocoDesporto(m,s,i)).join('')}</div>`
        : `<p class="sub" style="margin-top:8px">Sem desportos registados — adiciona os treinos para contarem no gasto calórico.</p>`}
      <p class="sub" style="margin-top:12px">Na corrida, no ciclismo, na natação, no remo e na patinagem é a velocidade
        que manda no esforço: indica-se a distância e o ritmo nos sliders, e as horas saem daí. Nos restantes escolhe-se
        o nível pelo teste da conversa — <b>leve</b> se falas à vontade, <b>moderado</b> se falas com a respiração

        <div class="mbar" style="height:20px;margin:0">
          <div id="ga-basal" style="background:var(--mut);opacity:.5;width:${w(gp.basal)}%"></div>
          <div id="ga-dia" style="background:var(--accent);width:${w(gp.dia)}%"></div>
          <div id="ga-desloc" style="background:var(--ok);width:${w(gp.desloc)}%"></div>
          <div id="ga-desp" style="background:var(--energy);width:${w(gp.desp)}%"></div>
        </div>
        <div id="ga-alvo" style="position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink);left:${X}%"></div>
      </div>
      <div class="mleg"><span><i class="dot" style="background:var(--mut);opacity:.5"></i>Basal</span>
        <span><i class="dot" style="background:var(--accent)"></i>Dia-a-dia</span>
        <span><i class="dot" style="background:var(--ok)"></i>Deslocações</span>
        <span><i class="dot" style="background:var(--energy)"></i>Desporto</span></div>
      <div class="row" style="margin-top:12px">
        <div class="stat"><b>${Math.round(gp.basal)}</b><span>Basal</span></div>
        <div class="stat"><b>+${Math.round(gp.dia)}</b><span>Dia-a-dia</span></div>
        <div class="stat"><b>+${cK}</b><span>Deslocações</span></div>
        <div class="stat"><b id="tot-desporto">+${sK}</b><span>Desporto</span></div>
        <div class="stat" style="background:var(--energy-soft)"><b id="tot-total" style="color:var(--energy)">${Math.round(gp.total)}</b><span>Total kcal/dia</span></div>
        <div class="stat" style="background:var(--accent-soft)"><b id="ga-alvostat" style="color:var(--accent)">${Math.round(alvo)}</b><span>Alvo kcal/dia</span></div>
      </div>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <p class="sub" style="margin:0">A distância entre o fim da barra e a linha tracejada é o défice (ou superavit) do plano alimentar. Estimativa por METs sobre a fórmula de Mifflin-St Jeor.</p>
        <button class="chip" onclick="go('nutricao')">Ajustar alvo na Nutrição →</button>
      </div>
    </div>`; })()}
  </div>`;
}

function textoObjetivo(m){
  const p=objetivoPct(m), delta=Math.round(Math.abs(targetKcal(m)-tdee(m)));
  const sinal=(p>0?'+':p<0?'−':'')+Math.abs(p)+'%';   /* menos tipográfico, como no resto da app */
  return sinal+' · '+(p<0? 'défice de '+delta+' kcal/dia' : p>0? 'superavit de '+delta+' kcal/dia' : 'manutenção');
}
function sincronizaObjetivo(m){ const p=objetivoPct(m);
  m.objetivo = p<=-8? 'perder' : p>=5? 'ganhar' : 'manter'; }
function slideObjetivo(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.objetivoPct=clampNum(Math.round(parseFloat(el.value)||0),-25,20);
  pintaRange(el);
  aoVivo('nut', atualizarNutricao);
}
function commitObjetivo(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  sincronizaObjetivo(m); save();
  const p=objetivoPct(m);
  el.setAttribute('aria-valuetext',(p<0?'défice de ':p>0?'superavit de ':'')+Math.abs(p)
    +' por cento, alvo '+Math.round(targetKcal(m))+' quilocalorias por dia');
}
function presetObjetivo(mid,p){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.objetivoPct=p; sincronizaObjetivo(m); save(); render();
}
/* Sliders C/P/F interligados: floats durante o gesto, maior-resto na pintura e
   no commit — a soma é sempre 100 e os polegares irmãos não tremem ±1. */
let macroLive=null;
function slideMacro(mid,k,el){
  const m=S.members.find(x=>x.id===mid); if(!m||m.dieta!=='personalizada') return;
  /* O estado do gesto é carimbado com o membro: um arrasto que acaba no mesmo
     valor não dispara change, e sem isto os macros desse membro contaminavam
     o gesto seguinte noutro perfil. */
  if(!macroLive || macroLive.mid!==mid){ const d=dietaDe(m); macroLive={mid,c:d.c,p:d.p,f:d.f}; }
  const v=clampNum(parseFloat(el.value)||0,0,100);
  const outros=['c','p','f'].filter(x=>x!==k);
  const resto=100-v, a=macroLive[outros[0]], b=macroLive[outros[1]];
  if(a+b<0.5){ macroLive[outros[0]]=resto/2; macroLive[outros[1]]=resto/2; }
  else { macroLive[outros[0]]=resto*a/(a+b); macroLive[outros[1]]=resto-macroLive[outros[0]]; }
  macroLive[k]=v;
  m.macros=normaliza100(macroLive);
  pintaRange(el);
  outros.forEach(x=>{ const s=document.getElementById('nu-sl-'+x);
    if(s){ s.value=m.macros[x]; pintaRange(s); } });   /* atribuir .value não dispara eventos — sem cascata */
  aoVivo('nut', atualizarNutricao);
}
function commitMacro(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  macroLive=null; save();
  if(el&&m.macros) el.setAttribute('aria-valuetext',
    m.macros.c+' por cento de hidratos, '+m.macros.p+' de proteína, '+m.macros.f+' de gordura');
}
function presetMacro(mid,c,p,f){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.macros={c,p,f}; macroLive=null; save();
  ['c','p','f'].forEach(k=>{ const s=document.getElementById('nu-sl-'+k);
    if(s){ s.value=m.macros[k]; pintaRange(s); } });
  atualizarNutricao();
}
const ABREV_REF={p:'PA',a:'Almoço',l:'Lanche',j:'Jantar'};
function barraRefeicoes(k){
  let x=4;
  const segs=MEALS.map(([kk,rot,fr],idx)=>{
    const w=fr*332;
    const s=`<rect x="${x.toFixed(1)}" y="4" width="${(w-2).toFixed(1)}" height="14" rx="2" class="f-acc" fill-opacity="${[.85,.6,.4,.72][idx]}"/>
      <text id="nu-meal-${kk}" x="${(x+w/2).toFixed(1)}" y="35" font-size="10" text-anchor="middle" class="f-mut" style="font-variant-numeric:tabular-nums">${ABREV_REF[kk]} ${Math.round(k*fr)}</text>`;
    x+=w; return s;
  }).join('');
  return `<svg class="svgfx" viewBox="0 0 340 44" aria-hidden="true" style="margin-top:10px">${segs}</svg>`;
}
/* Projeção iterativa a 12 semanas. O domínio Y é fixo por render e dimensionado
   para o pior caso do slider (−25%) — o eixo nunca reescala durante o arrasto. */
function geomProjecao(m){
  const meia=Math.max(2.5, Math.ceil(tdee(m)*0.25*7*12/7700));
  const yMin=m.peso-meia, yMax=m.peso+meia;
  return {yMin,yMax, X:i=>sx(i,0,12,40,330), Y:v=>sx(v,yMin,yMax,130,12)};
}
function cartaoProjecao(m){
  const g=geomProjecao(m), proj=projecaoPeso(m,12), fim=proj[proj.length-1];
  const h2=(m.altura/100)*(m.altura/100);
  const zTop=clampNum(g.Y(25*h2),12,130), zBot=clampNum(g.Y(18.5*h2),12,130);
  const pts=proj.map((v,i)=>g.X(i).toFixed(1)+','+clampNum(g.Y(v),12,130).toFixed(1)).join(' ');
  const dentro=fim>=18.5*h2*1&&fim<=25*h2;
  const sobe=fim>m.peso;
  const yFim=clampNum(clampNum(g.Y(fim),12,130)+(sobe?16:-8),12,126);
  const delta=Math.round((fim-m.peso)*10)/10;
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 160" preserveAspectRatio="none" role="img" style="margin-top:8px">
    <title>Projeção de peso a doze semanas</title>
    ${zBot>zTop+1? `<rect x="40" y="${zTop.toFixed(1)}" width="290" height="${(zBot-zTop).toFixed(1)}" class="f-ok" fill-opacity=".08"/>
    <text x="44" y="${(zTop+11).toFixed(1)}" font-size="9.5" class="f-mut">zona de IMC saudável</text>`:''}
    <line x1="40" y1="${g.Y(m.peso).toFixed(1)}" x2="330" y2="${g.Y(m.peso).toFixed(1)}" class="s-mut" stroke-dasharray="2 3"/>
    <text x="40" y="${(g.Y(m.peso)-5).toFixed(1)}" font-size="10" class="f-mut" style="font-variant-numeric:tabular-nums">hoje ${nPT(m.peso,1)}</text>
    ${[0,4,8,12].map(i=>`<text x="${g.X(i).toFixed(1)}" y="146" font-size="10" text-anchor="middle" class="f-mut">${i}</text>`).join('')}
    <text x="330" y="158" font-size="9.5" text-anchor="end" class="f-mut">semanas</text>
    <polyline id="nu-plinha" points="${pts}" class="s-acc" stroke-width="2.5" fill="none" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle id="nu-pdot" cx="330" cy="${clampNum(g.Y(fim),12,130).toFixed(1)}" r="4.5" class="${dentro?'f-ok':'f-acc'}"/>
    <text id="nu-pfim" x="326" y="${yFim.toFixed(1)}" font-size="13" font-weight="700" text-anchor="end" class="f-ink" style="font-variant-numeric:tabular-nums">${nPT(fim,1)} kg</text>
  </svg>
  <div class="row" style="justify-content:space-between;margin-top:6px">
    <b id="nu-pdelta" style="font-variant-numeric:tabular-nums">${delta===0?'peso estável':(delta>0?'+':'−')+nPT(Math.abs(delta),1)+' kg em 12 semanas'}</b>
  </div>
  <p class="sub" style="margin-top:6px">Estimativa: 7 700 kcal ≈ 1 kg, com o gasto recalculado semana a semana — não substitui aconselhamento médico ou nutricional.</p>`;
}
function atualizarProjecao(m){
  const pl=document.getElementById('nu-plinha'); if(!pl) return;
  const g=geomProjecao(m), proj=projecaoPeso(m,12), fim=proj[proj.length-1];
  pl.setAttribute('points', proj.map((v,i)=>g.X(i).toFixed(1)+','+clampNum(g.Y(v),12,130).toFixed(1)).join(' '));
  const h2=(m.altura/100)*(m.altura/100);
  const dentro=fim>=18.5*h2&&fim<=25*h2, sobe=fim>m.peso;
  const dot=document.getElementById('nu-pdot');
  if(dot){ dot.setAttribute('cy',clampNum(g.Y(fim),12,130).toFixed(1));
    dot.setAttribute('class',dentro?'f-ok':'f-acc'); }
  const lbl=document.getElementById('nu-pfim');
  if(lbl){ lbl.textContent=nPT(fim,1)+' kg';
    lbl.setAttribute('y',clampNum(clampNum(g.Y(fim),12,130)+(sobe?16:-8),12,126).toFixed(1)); }
  const delta=Math.round((fim-m.peso)*10)/10;
  põe('nu-pdelta', delta===0?'peso estável':(delta>0?'+':'−')+nPT(Math.abs(delta),1)+' kg em 12 semanas');
}
function atualizarNutricao(){
  const m=curM(); if(!m) return;
  const alvo=targetKcal(m), gasto=tdee(m), p=objetivoPct(m), mk=macros(m);
  põe('nu-obj', textoObjetivo(m));
  põe('nu-alvo', Math.round(alvo)); põe('nu-gasto', Math.round(gasto));
  const rp=document.getElementById('nu-ritmo');
  if(rp){
    if(alvo<bmr(m)){ rp.textContent='abaixo do basal — não recomendado'; rp.setAttribute('class','pill bad'); }
    else { const kg=ritmoSemanal(m), a=Math.abs(kg);
      rp.textContent=(a<0.005?'peso estável':(kg>0?'−':'+')+nPT(a,2)+' kg/semana');

  atualizarProjecao(m);
}

/* ================= PLANO SEMANAL ================= */
function shiftWeek(n){ const d=new Date(S.week+'T12:00:00'); d.setDate(d.getDate()+7*n); S.week=mondayISO(d); saveMeta(); render(); }
function planWeek(){ if(!S.plans[S.week]) S.plans[S.week]={}; return S.plans[S.week]; }
function planMeal(di,mk){ const w=planWeek(); if(!w[di]) w[di]={}; if(!w[di][mk]) w[di][mk]={r:'',m:S.members.map(x=>x.id)}; return w[di][mk]; }
function setMeal(di,mk,rid){ planMeal(di,mk).r=rid; save(); render(); }
function toggleEater(di,mk,mid){ const meal=planMeal(di,mk);
  meal.m = meal.m.includes(mid)? meal.m.filter(x=>x!==mid) : [...meal.m,mid]; save(); render(); }
function toggleCheat(mid,date){ if(!S.cheats[mid]) S.cheats[mid]=[];
  const i=S.cheats[mid].indexOf(date); i>=0? S.cheats[mid].splice(i,1) : S.cheats[mid].push(date); save(); render(); }
function clearWeek(){ if(confirm('Limpar todas as refeições desta semana?')){ delete S.plans[S.week]; delete S.bought[S.week]; save(); render(); } }
function receitasDe(mk){ return RECIPES.filter(r=>r.mt.indexOf(mk)>=0); }
function autoFill(){
  const dates=weekDates(S.week); const used=new Set();
  Object.values(planWeek()).forEach(d=>MEALK.forEach(k=>d[k]?.r&&used.add(d[k].r)));
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=planMeal(di,mk); if(meal.r) continue;
    const eaters=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di]));
    if(!eaters.length) continue;
    const doTipo=receitasDe(mk);
    /* Estreita-se o mais possível e vai-se alargando: cozinha preferida e dieta
       de todos os comensais, depois só a dieta, depois qualquer coisa do tipo. */
    let pool=doTipo.filter(r=>(S.prefCuisine==='todas'||r.coz===S.prefCuisine)&&compatAll(r,eaters));
    if(!pool.length) pool=doTipo.filter(r=>compatAll(r,eaters));
    if(!pool.length) pool=doTipo;
    if(!pool.length) continue;
    const fresh=pool.filter(r=>!used.has(r.id));
    const alvo=fresh.length? fresh : pool;
    meal.r=alvo[Math.floor(Math.random()*alvo.length)].id; used.add(meal.r);
  }
  save(); render();
}
function mealBlock(di,mk,label,date){
  const meal=planWeek()[di]?.[mk]; const r=meal&&RECIPES.find(x=>x.id===meal.r);
  const members=S.members;
  return `<div class="meal">
    <div class="mtitle">${label}</div>
    <select onchange="setMeal(${di},'${mk}',this.value)">
      <option value="">— escolher receita —</option>
      ${receitasDe(mk).map(x=>`<option value="${x.id}" ${r&&r.id===x.id?'selected':''}>${x.n} · ${x.k} kcal (${CUIS[x.coz]})</option>`).join('')}
    </select>
    ${r?`<div class="sub" style="margin-top:4px">H ${r.c} · P ${r.p} · G ${r.f} g/pessoa
      ${!compatAll(r,members.filter(m=>(meal.m||[]).includes(m.id)&&!isCheat(m.id,date)))?' · <b style="color:var(--warn)">⚠ nem todos compatíveis</b>':''}</div>`:''}
    <div class="row" style="margin-top:7px">${members.map(m=>{
      const on=meal? meal.m.includes(m.id) : true, cheat=isCheat(m.id,date);
      return `<button class="chip ${on&&!cheat?'on':''}" ${cheat?'style="opacity:.45" title="Cheat day"':''}
        onclick="toggleEater(${di},'${mk}','${m.id}')">${avatar(m,20)} ${esc(m.nome.split(' ')[0])}${cheat?' 🎉':''}</button>`;}).join('')}
    </div>
  </div>`;
}
function irParaDia(di){ const el=document.getElementById('dia-'+di);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
/* Resumo «semana em números»: uma linha por membro, kcal planeadas por dia vs
   a linha do alvo — a mesma assinatura tracejada da barra da Atividade. */
function cartaoSemana(dates){
  const INICIAIS=['S','T','Q','Q','S','S','D'];
  return `<div class="card" id="pla-resumo" style="margin-bottom:16px">
    <h2>Semana em números</h2>
    ${S.members.map(m=>{
      const alvo=targetKcal(m);
      const dias=dates.map((_,di)=>estadoDia(m,di,dates));
      const teto=Math.max(alvo*1.3, 1, ...dias.map(x=>x.kcal));
      const yDe=k=>48-sx(k,0,teto,0,40);
      const yAlvo=yDe(alvo);
      const barras=dias.map((x,di)=>{
        const bx=30+di*44;
        if(x.st==='cheat') return `<rect x="${bx}" y="20" width="30" height="28" rx="3" class="f-party" fill-opacity=".35"/><circle cx="${bx+15}" cy="15" r="2.5" class="f-party"/>`;
        if(x.st==='vazio') return `<rect x="${bx}" y="46" width="30" height="2" class="f-line"/>`;
        const h=Math.max(2,sx(x.kcal,0,teto,0,40)), by=48-h;
        if(x.st==='incompleto') return `<rect x="${bx}" y="${by.toFixed(1)}" width="30" height="${h.toFixed(1)}" rx="3" class="f-line" opacity=".6"/>
          <text x="${bx+15}" y="${Math.max(8,by-4).toFixed(1)}" font-size="9.5" text-anchor="middle" class="f-mut">${x.refs}/4</text>`;
        const cls=x.st==='ok'?'f-ok':x.st==='warn'?'f-warn':'f-bad';
        const val=h>=18? `<text x="${bx+15}" y="${Math.max(8,by-4).toFixed(1)}" font-size="9.5" text-anchor="middle" class="f-ink" style="font-variant-numeric:tabular-nums">${x.kcal}</text>`:'';
        return `<rect x="${bx}" y="${by.toFixed(1)}" width="30" height="${h.toFixed(1)}" rx="3" class="${cls}"/>`+val;
      }).join('');
      const taps=dates.map((_,di)=>`<rect x="${23+di*44}" y="0" width="44" height="64" fill="transparent"
        style="pointer-events:all;touch-action:manipulation;cursor:pointer" onclick="irParaDia(${di})"><title>Ir para ${DAYN[di]}</title></rect>`).join('');
      const iniciais=INICIAIS.map((c,di)=>`<text x="${45+di*44}" y="62" font-size="9.5" text-anchor="middle" class="f-mut">${c}</text>`).join('');
      const completos=dias.filter(x=>x.st==='ok'||x.st==='warn'||x.st==='bad');
      const media=completos.length? Math.round(completos.reduce((t,x)=>t+x.kcal,0)/completos.length):0;
      const dvm=completos.length&&alvo>0? Math.abs(media-alvo)/alvo:0;
      const tone=dvm<=0.10?'ok':dvm<=0.25?'warn':'bad';
      const cheats=dates.map((_,di)=>dias[di].st==='cheat'? DAYN[di].slice(0,3)+'. 🎉':null).filter(Boolean);
      return `<div style="margin-top:12px">
        <div class="row" style="gap:8px">${avatar(m,22)}<b>${esc(m.nome.split(' ')[0])}</b>
          ${completos.length? `<span class="pill ${tone}">média ${media} / alvo ${Math.round(alvo)}</span>`
            : '<span class="sub">ainda sem dias completos</span>'}
          ${cheats.length? `<span class="sub">${cheats.join(' · ')}</span>`:''}</div>
        <svg class="svgfx" viewBox="0 0 340 64" role="img" aria-label="Calorias planeadas por dia para ${esc(m.nome)}" style="margin-top:4px;max-width:560px">
          ${barras}
          <line x1="24" y1="${yAlvo.toFixed(1)}" x2="330" y2="${yAlvo.toFixed(1)}" class="s-ink" stroke-dasharray="4 3" stroke-width="1.5" opacity=".8"/>
          <text x="330" y="${(yAlvo-4).toFixed(1)}" font-size="10" text-anchor="end" class="f-ink" style="font-variant-numeric:tabular-nums">alvo ${Math.round(alvo)}</text>
          ${iniciais}${taps}
        </svg>

    }).join('')}

/* ================= COMPRAS ================= */
function shoppingItems(){
  const dates=weekDates(S.week), w=S.plans[S.week]||{}, agg={};
  let meals=0;
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=w[di]?.[mk]; if(!meal||!meal.r) continue;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) continue;
    const n=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di])).length;
    if(!n) continue; meals++;
    r.i.forEach(([nome,q,u])=>{ const key=nome+'|'+u;
      if(!agg[key]) agg[key]={n:nome,u,q:0}; agg[key].q+=q*n; });
  }
  return {items:Object.values(agg),meals};
}
/* Marcar um item não redesenha a lista: no supermercado, com o telemóvel numa
   mão, o scroll e o foco ficam onde estavam. Se faltar algum id, cai no render
   completo — nunca dessincroniza. */
function toggleBought(key,el){ if(!S.bought[S.week]) S.bought[S.week]={};
  S.bought[S.week][key]=!S.bought[S.week][key]; save();
  const li=el&&el.closest? el.closest('li'):null;
  if(!li||!document.getElementById('co-bar')){ render(); return; }
  li.classList.toggle('done',!!S.bought[S.week][key]);
  atualizarCompras();
}
function atualizarCompras(){
  const bar=document.getElementById('co-bar'); if(!bar) return;
  const {items}=shoppingItems(); const bought=S.bought[S.week]||{};
  const done=items.filter(i=>bought[i.n+'|'+i.u]).length, total=items.length;
  bar.style.width=(total? done/total*100:0)+'%';
  bar.style.background=(done===total&&total)? 'var(--ok)':'var(--accent)';
  const num=document.getElementById('co-num');
  if(num){ if(done===total&&total){ num.textContent='tudo comprado ✓'; num.setAttribute('class','f-ok-txt'); }
    else { num.textContent=done+'/'+total+' comprados'; num.removeAttribute('class'); } }
  CATS.forEach((c,i)=>{ const el=document.getElementById('co-sec-'+i); if(!el) return;
    const lis=[].slice.call(document.querySelectorAll('li[data-sec="'+i+'"]'));
    const dn=lis.filter(li=>li.classList.contains('done')).length;
    const completo=lis.length&&dn===lis.length;
    el.textContent=(completo?'✓ ':'')+dn+'/'+lis.length;
    el.setAttribute('class', completo?'sub f-ok-txt':'sub');
  });
}
function fmtQ(it){ const q=Math.round(it.q*100)/100;
  if(it.u==='g'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' kg';
  if(it.u==='ml'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' L';
  return nPT(q, Number.isInteger(q)?0:(Number.isInteger(q*10)?1:2))+' '+it.u; }
/* Sem a guarda, em http simples (rede local) navigator.clipboard é undefined e
   o botão atirava um TypeError sem dizer nada a ninguém. */
function copyList(){

}

      <ul class="shop">${arr.sort((a,b)=>a.n.localeCompare(b.n)).map(it=>{

        return `<li class="${ok?'done':''}" data-sec="${iSec}"><label><input type="checkbox" ${ok?'checked':''} onchange="toggleBought('${esc(key).replace(/'/g,"\\'")}',this)">
          <span>${esc(it.n)}</span><span class="q">${fmtQ(it)}</span></label></li>`;}).join('')}</ul>`;}).join('')}
  </div>
  <textarea id="co-txt" style="display:none;max-width:640px;margin-top:12px" readonly aria-label="Lista de compras em texto"></textarea>

/* ================= ORIENTAÇÃO E TIPO DE ECRÃ =================
   Marca <html> com data-orient (retrato/paisagem) e data-dispositivo
   (telefone/tablet/desktop). O CSS agarra-se a estes atributos para
   distinguir um telemóvel deitado de um tablet deitado, que têm larguras
   parecidas mas necessidades opostas. */
let ecra={orient:null,disp:null};
function ehToque(){
  try{ return matchMedia('(hover:none) and (pointer:coarse)').matches; }
  catch(e){ return 'ontouchstart' in window || navigator.maxTouchPoints>0; }
}
function orientacao(){
  try{
    if(matchMedia('(orientation:portrait)').matches) return 'retrato';
    if(matchMedia('(orientation:landscape)').matches) return 'paisagem';
  }catch(e){}
  return innerHeight>=innerWidth ? 'retrato' : 'paisagem';   // reserva para Safari antigo
}
function tipoDispositivo(){
  if(!ehToque()) return 'desktop';
  /* O lado menor não muda quando se roda, por isso classifica melhor do que a
     largura: um iPhone deitado continua a ser um telemóvel. */
  const menor=Math.min(innerWidth,innerHeight), maior=Math.max(innerWidth,innerHeight);
  return (menor>=600 || maior>=1000) ? 'tablet' : 'telefone';
}
function nomeEcra(){
  const d={telefone:'Telemóvel',tablet:'Tablet',desktop:'Computador'}[ecra.disp]||'—';
  return ecra.disp==='desktop' ? d : d+' · '+(ecra.orient==='retrato'?'vertical':'horizontal');
}
function aplicarEcra(){
  const o=orientacao(), d=tipoDispositivo();
  const mudou = (o!==ecra.orient || d!==ecra.disp);
  ecra={orient:o,disp:d};
  const r=document.documentElement;
  r.setAttribute('data-orient',o);
  r.setAttribute('data-dispositivo',d);
  const info=document.getElementById('ecraInfo');
  if(info) info.textContent=nomeEcra();
  return mudou;
}
/* Ao rodar, o iOS mantém a posição de scroll em pixéis: como a página fica com
   outra altura, o utilizador aterra num ponto diferente do que estava a ler.
   Guarda-se a posição relativa antes do reflow e repõe-se depois. */
function aoRodar(prop){
  if(!aplicarEcra()) return;
  if(typeof prop!=='number') return;
  requestAnimationFrame(()=>{
    const alt=Math.max(1, document.documentElement.scrollHeight - innerHeight);
    if(alt>1) window.scrollTo(0, Math.round(prop*alt));
  });
}
function ligarOrientacao(){
  const reagir=()=>{
    const alt=Math.max(1, document.documentElement.scrollHeight - innerHeight);
    const prop=alt>1 ? Math.min(1, scrollY/alt) : 0;
    /* Duas passagens: o Safari só publica as medidas certas depois do reflow. */
    requestAnimationFrame(()=>requestAnimationFrame(()=>aoRodar(prop)));
    setTimeout(()=>aoRodar(prop), 320);
  };
  try{
    const mq=matchMedia('(orientation:portrait)');
    if(mq.addEventListener) mq.addEventListener('change',reagir);
    else if(mq.addListener) mq.addListener(reagir);              // Safari 13 e anteriores
  }catch(e){}
  if(screen.orientation && screen.orientation.addEventListener)
    screen.orientation.addEventListener('change',reagir);         // Android / Chrome
  window.addEventListener('orientationchange',reagir);            // iOS Safari
  let t=null;
  const adiado=()=>{ clearTimeout(t); t=setTimeout(()=>aoRodar(),150); };
  window.addEventListener('resize',adiado);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',adiado);
}

/* ================= DADOS: CÓPIA E RESTAURO ================= */
function flash(kind,text){ msg={kind,text}; render(); }
function pacote(){
  /* Um arrasto do objetivo que acabe onde começou não dispara change, e o
     m.objetivo legado ficaria dessincronizado do objetivoPct. Sincroniza-se
     aqui, para uma cópia nunca sair incoerente. */
  S.members.forEach(sincronizaObjetivo);
  return {app:APPID, formato:FORMATO, exportadoEm:new Date().toISOString(),
  dados:{members:S.members, cheats:S.cheats, plans:S.plans, bought:S.bought,
         prefCuisine:S.prefCuisine, week:S.week}}; }
