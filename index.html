<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestão de alimentação e fitness para toda a família — perfis, calorias, macros por dieta, receitas, plano semanal com cheat days e lista de compras.">
<meta name="color-scheme" content="light dark">
<meta name="author" content="Família Fit">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Família Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Família Fit — Alimentação & Movimento</title>
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#232930; --mut:#6A737D; --line:#E4E1D8;
  --accent:#2456A6; --accent-soft:#E8EEF8; --energy:#C8641E; --energy-soft:#F8EDE2;
  --party:#C2477C; --party-soft:#F9E9F1;
  --ok:#2E7D4F; --warn:#B07F14; --bad:#C24034;
  --mc:#C8862A; --mp:#2456A6; --mf:#7C5CB0;
  --shadow:0 1px 3px rgba(35,41,48,.07),0 4px 14px rgba(35,41,48,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181D; --card:#1C2229; --ink:#E8EAED; --mut:#96A0AA; --line:#2A323B;
    --accent:#7BA7E8; --accent-soft:#22304A; --energy:#E09550; --energy-soft:#3A2C1D;
    --party:#E38AA8; --party-soft:#3D2430;
    --ok:#5FBF8A; --warn:#D9B04A; --bad:#E07A6B;
    --mc:#DCA84F; --mp:#7BA7E8; --mf:#A98BD8;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#232930; --mut:#6A737D; --line:#E4E1D8;
  --accent:#2456A6; --accent-soft:#E8EEF8; --energy:#C8641E; --energy-soft:#F8EDE2;
  --party:#C2477C; --party-soft:#F9E9F1;
  --ok:#2E7D4F; --warn:#B07F14; --bad:#C24034;
  --mc:#C8862A; --mp:#2456A6; --mf:#7C5CB0;
  --shadow:0 1px 3px rgba(35,41,48,.07),0 4px 14px rgba(35,41,48,.05);
}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2229; --ink:#E8EAED; --mut:#96A0AA; --line:#2A323B;
  --accent:#7BA7E8; --accent-soft:#22304A; --energy:#E09550; --energy-soft:#3A2C1D;
  --party:#E38AA8; --party-soft:#3D2430;
  --ok:#5FBF8A; --warn:#D9B04A; --bad:#E07A6B;
  --mc:#DCA84F; --mp:#7BA7E8; --mf:#A98BD8;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
/* overflow-x:clip (e não hidden) impede que uma bolha de explicação ponha a
   página a deslizar na horizontal, sem criar um contentor de scroll — o
   cabeçalho fixo continua a colar-se ao topo. */
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;
  padding-bottom:60px;overflow-x:clip}
h1,h2,h3,.display{font-family:Georgia,"Times New Roman",serif;font-weight:600;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px;margin-bottom:4px} h3{font-size:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand small{color:var(--mut);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:24px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sub{color:var(--mut);font-size:13.5px}
.lbl{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:10px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10151b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10151b}}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.party{border-color:var(--party);color:var(--party)}
.chip.party.on{background:var(--party-soft)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--bg);border-radius:10px;min-width:100px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 6px}
.mbar div{height:100%}
.mleg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
table{border-collapse:collapse;width:100%}
.splist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.spline{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg);
  display:flex;flex-direction:column;gap:10px}
.sptop{display:flex;gap:10px;align-items:center}
.sptop select{flex:1 1 auto;min-width:0}
.spgrid{display:flex;flex-direction:column;gap:11px}
.splabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.splabel output{font-size:14.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.spfoot{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-top:9px;border-top:1px solid var(--line)}
.spfoot select{width:auto;min-width:0;flex:0 1 auto}
.sphoras{display:flex;align-items:center;gap:5px}
.sphoras input{width:70px}
.spgasto{margin-left:auto;text-align:right;white-space:nowrap}
.spgasto .sub{display:block;font-size:11.5px}
.pill.nivel{background:var(--accent-soft);color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;padding:0;
  background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--accent);border:3px solid var(--card);margin-top:-7px;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:3px solid var(--card);border-radius:50%;
  background:var(--accent)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--accent-soft)}
/* Sliders de macros com a cor do próprio macro. */
.rgC::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mc) var(--pct,0%),var(--line) var(--pct,0%))}
.rgC::-webkit-slider-thumb{background:var(--mc)}
.rgC::-moz-range-progress{background:var(--mc)} .rgC::-moz-range-thumb{background:var(--mc)}
.rgP::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mp) var(--pct,0%),var(--line) var(--pct,0%))}
.rgP::-webkit-slider-thumb{background:var(--mp)}
.rgP::-moz-range-progress{background:var(--mp)} .rgP::-moz-range-thumb{background:var(--mp)}
.rgF::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--mf) var(--pct,0%),var(--line) var(--pct,0%))}
.rgF::-webkit-slider-thumb{background:var(--mf)}
.rgF::-moz-range-progress{background:var(--mf)} .rgF::-moz-range-thumb{background:var(--mf)}
/* Gráficos: espelho, não controlo — nunca roubam o scroll nem o toque.
   Cores SEMPRE por classe (var() em atributos SVG não é fiável). */
/* Explicadores: bolha ancorada à esquerda do marcador (as dicas vivem sempre
   no lado esquerdo dos cartões, por isso crescer para a direita não transborda).
   Aparecem com o rato, com o teclado e — onde não há rato — ao toque. */
.dica{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;padding:0;margin-left:6px;border:1px solid var(--line);border-radius:50%;
  background:var(--bg);color:var(--mut);font:700 11px/1 inherit;cursor:help;vertical-align:middle;flex:none}
.dica:hover,.dica:focus-visible,.dica.on{border-color:var(--accent);color:var(--accent)}
.dica::after{content:attr(data-dica);position:absolute;left:calc(-4px + var(--dx,0px));top:calc(100% + 8px);
  width:max-content;max-width:min(270px,calc(100vw - 24px));
  background:var(--ink);color:var(--card);padding:9px 12px;border-radius:9px;
  font:400 12.5px/1.45 inherit;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;
  z-index:30;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
.dica::before{content:'';position:absolute;left:5px;top:calc(100% + 2px);
  border:6px solid transparent;border-bottom-color:var(--ink);z-index:31;display:none}
/* display em vez de visibility: uma bolha só escondida continuaria a contar
   para a largura do documento e punha a página a deslizar na horizontal. */
.dica:hover::after,.dica:hover::before,.dica:focus-visible::after,.dica:focus-visible::before,
.dica.on::after,.dica.on::before{display:block}
@media (hover:none) and (pointer:coarse){ .dica{width:30px;height:30px;font-size:14px;margin-left:8px} }
/* Barra de desfazer */
.hist{display:flex;gap:4px}
.hist button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);
  cursor:pointer;padding:5px 9px;font-size:14px;line-height:1;min-width:34px}
.hist button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.hist button:disabled{opacity:.35;cursor:default}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));
  background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13.5px;
  font-weight:600;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.28);max-width:90vw;text-align:center}
@media (prefers-reduced-motion: no-preference){ #toast{transition:opacity .18s} }
.svgfx{display:block;width:100%;height:auto;pointer-events:none}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-bad{fill:var(--bad)}
.f-mut{fill:var(--mut)} .f-line{fill:var(--line)} .f-ink{fill:var(--ink)}
.f-acc{fill:var(--accent)} .f-energy{fill:var(--energy)} .f-party{fill:var(--party)}
.f-card{fill:var(--card)} .f-mc{fill:var(--mc)} .f-mp{fill:var(--mp)} .f-mf{fill:var(--mf)}
.s-ok{stroke:var(--ok)} .s-line{stroke:var(--line)} .s-ink{stroke:var(--ink)}
.s-acc{stroke:var(--accent)} .s-energy{stroke:var(--energy)} .s-mut{stroke:var(--mut)}
.s-warn{stroke:var(--warn)} .s-bad{stroke:var(--bad)}
.f-ok-txt{color:var(--ok)}
.dt-ok{background:var(--ok)} .dt-warn{background:var(--warn)} .dt-bad{background:var(--bad)}
.dt-line{background:var(--line)} .dt-party{background:var(--party)}
.day{scroll-margin-top:130px}
.shop label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  #co-bar{transition:width .2s,background-color .2s}
  .anel-arco{transition:stroke-dashoffset .6s ease, stroke .3s ease}
}
/* Objetivos: anel de progresso e celebração de conquista. */
.anel{overflow:visible}
.celebracao{position:relative;overflow:hidden;border-color:var(--party);background:var(--party-soft)}
.celebracao h2{color:var(--party)}
.confete{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confete span{position:absolute;left:calc(6% + (var(--i) * 16%));top:-24px;font-size:22px;opacity:.95}
@media (prefers-reduced-motion: no-preference){
  .confete span{animation:obj-cair 1.6s ease-in forwards;animation-delay:calc(var(--i) * .1s)}
  @keyframes obj-cair{ to{ transform:translateY(150px) rotate(220deg); opacity:0; } }
}
.rc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.rc h3{font-size:15.5px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--mut);margin:1px 2px 1px 0}
.kcal{color:var(--energy);font-weight:700;font-variant-numeric:tabular-nums}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.day.cheat-any{border-color:var(--party)}
.dhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;background:var(--bg)}
.dhead b{font-family:Georgia,serif;font-size:16px}
.meal{padding:10px 14px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.mtitle{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:5px}
.shop li{list-style:none;display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--line)}
.shop li.done span{text-decoration:line-through;color:var(--mut)}
.shop .q{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.cat-h{margin:18px 0 4px;font-family:Georgia,serif;font-size:15px;color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--mut)}
.notice{background:var(--party-soft);border:1px solid var(--party);color:var(--party);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px}
.secgap{margin-top:28px}
.savest{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap;
  background:none;border:none;cursor:pointer;padding:4px 2px;font-family:inherit}
.savest:hover{color:var(--ink)}
.savest .led{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.savest.pend .led{background:var(--warn)}
.savest.err{color:var(--bad)} .savest.err .led{background:var(--bad)}
.savest.none .led{background:var(--line)}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:inherit;resize:vertical}
.toggle{display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:4px 0}
.toggle input{margin-top:4px;flex:none}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.msg{border-radius:9px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.msg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.msg.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
@media (prefers-reduced-motion: no-preference){ .card,.day,.rc{transition:box-shadow .15s} }

/* ============ TOQUE, TELEMÓVEL E TABLET ============ */
/* Reservas para Safari anterior ao 16.4, que não conhece color-mix():
   a declaração simples fica antes e é usada quando a seguinte é ignorada. */
.pill.ok{background:rgba(46,125,79,.14)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{background:rgba(176,127,20,.16)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{background:rgba(194,64,52,.14)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.msg.ok{background:rgba(46,125,79,.13)}
.msg.warn-msg{background:rgba(176,127,20,.13);color:var(--warn);font-weight:400;line-height:1.5}
.msg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.msg.bad{background:rgba(194,64,52,.13)}
.msg.bad{background:color-mix(in srgb,var(--bad) 13%,transparent)}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input,label,.chip{touch-action:manipulation}
button,.chip,.filebtn{-webkit-tap-highlight-color:transparent}
button:active,.chip:active,.filebtn:active{opacity:.82}
input[type=checkbox]{accent-color:var(--accent)}
/* O select nativo do iOS ignora o desenho da página; uniformiza-se a seta. */
select{-webkit-appearance:none;appearance:none;padding-right:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.6 6 6.4 11 1.6' fill='none' stroke='%238A929B' stroke-width='1.7' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:11px 8px}
/* Margens seguras do notch e da barra inferior do iPhone (viewport-fit=cover). */
.hwrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
body{padding-bottom:max(60px,calc(env(safe-area-inset-bottom) + 44px))}

@media (max-width:760px){
  /* Seis separadores não cabem em linha: passam a faixa que desliza na horizontal. */
  nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none}
  .hwrap{gap:10px}
  .savest{margin-left:auto}
}
@media (max-width:640px){
  .hwrap{padding:10px 14px}
  main{padding:16px 12px}
  .hwrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  h1{font-size:22px} h2{font-size:19px}
  .card{padding:15px 16px}
  .stat{flex:1 1 92px}
  .frow{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
}

}

/* Grelha dos dias do plano, para poder mudar com a orientação. */
.gdias{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

@media (orientation:landscape) and (max-height:460px){
  header{position:static}

/* O detetor de orientação marca <html> com data-orient e data-dispositivo,
   o que permite distinguir um telemóvel deitado de um tablet deitado —
   coisa que as media queries de largura, por si só, não conseguem. */

/* Telemóvel deitado: a altura passa a ser o recurso escasso. O cabeçalho
   deixa de ser fixo e encolhe, para a lista não ficar a espiar por uma frincha. */
html[data-orient="paisagem"][data-dispositivo="telefone"] .svg-linha{height:80px}

html[data-orient="paisagem"][data-dispositivo="telefone"] .secgap{margin-top:18px}

html[data-orient="paisagem"][data-dispositivo="telefone"] .g2,
html[data-orient="paisagem"][data-dispositivo="telefone"] .g3,
html[data-orient="paisagem"][data-dispositivo="telefone"] .gdias{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}

html[data-orient="retrato"][data-dispositivo="telefone"] .g2,
html[data-orient="retrato"][data-dispositivo="telefone"] .g3,
html[data-orient="retrato"][data-dispositivo="telefone"] .gdias{grid-template-columns:1fr}

html[data-orient="paisagem"][data-dispositivo="tablet"] main{max-width:1280px}

html[data-orient="paisagem"][data-dispositivo="tablet"] .gdias{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}

<main id="main"></main>

<script>
/* ================= DADOS BASE ================= */
/* Desportos com três níveis de intensidade. Os valores são METs (equivalentes
   metabólicos) do Compendium of Physical Activities, na ordem leve / moderado /
   intenso. Onde a velocidade ou o terreno mandam mais do que o esforço sentido
   — ciclismo, corrida, caminhada — a dica indica o que cada nível representa. */
const NIVEIS=[['leve','Leve'],['moderado','Moderado'],['intenso','Intenso']];

/* Nos desportos em que a velocidade é que manda no esforço, o MET não se
   escolhe por níveis: lê-se de uma curva velocidade → MET, interpolada entre
   os pontos tabelados do Compendium. É isso que permite trocar os três níveis
   fixos por um slider contínuo de distância e velocidade. */
const CURVAS={
  andar:      [[3,2.3],[4,2.9],[4.8,3.3],[5.6,4.3],[6.4,5.0],[7.2,7.0],[8,8.3]],
  correr:     [[6.4,6.0],[8,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8],[16.1,14.5],[17.5,16.0],[19.3,19.0]],
  trail:      [[5,6.5],[7,8.5],[9,10.5],[11,12.5],[13,14.0],[15,16.0]],
  estrada:    [[10,4.0],[16,6.8],[19,8.0],[22.5,10.0],[26,12.0],[31,15.8],[35,17.0]],
  subida:     [[6,6.0],[9,8.0],[12,10.0],[15,12.0],[18,14.0],[22,16.0]],
  btt:        [[8,5.5],[12,7.5],[16,9.0],[20,11.0],[24,13.0],[28,15.0]],
  passeio:    [[8,3.5],[12,4.5],[16,6.8],[19,8.0],[22,9.5]],
  nadar:      [[1.5,5.3],[2,6.5],[2.5,8.0],[3,9.5],[3.5,10.5],[4.5,11.8]],
  remar:      [[4,4.0],[6,6.0],[8,8.5],[10,11.0],[12,12.5],[14,13.5]],
  patinar:    [[6,4.8],[8,5.5],[12,7.0],[16,9.0],[20,11.0],[26,12.5]]
};
/* Interpolação linear, com os extremos fixos fora da tabela. */
function metPorVelocidade(nome,v){
  const c=CURVAS[nome]; if(!c) return 0;
  if(v<=c[0][0]) return c[0][1];
  if(v>=c[c.length-1][0]) return c[c.length-1][1];
  for(let i=1;i<c.length;i++){
    if(v<=c[i][0]){ const [v0,m0]=c[i-1], [v1,m1]=c[i];
      return m0+(m1-m0)*(v-v0)/(v1-v0); }
  }
  return c[c.length-1][1];

/* O inverso: a que velocidade se atinge um dado MET. Serve para converter os
   registos antigos (horas + nível) sem lhes mudar as calorias. */
function velocidadeParaMet(dist,met){
  const c=CURVAS[dist.curva];

  else if(met>c[0][1]){
    for(let i=1;i<c.length;i++){

    }
  }
  return Math.min(Math.max(v,dist.vmin),dist.vmax);

/* Definição da parte de distância: curva, limites do slider de velocidade,

function D(curva,vmin,vmax,vdef,vStep,maxSemana,ritmo){

const CATS_SPORT=[['corrida','Corrida e caminhada'],['ciclismo','Ciclismo'],['agua','Água'],

  SP('pingpong','Ténis de mesa','raquete',[3.0,4.0,5.0]),

  SP('artes','Artes marciais','combate',[5.3,8.0,10.3],['treino técnico','aula normal','combate']),
  SP('boxe','Boxe / kickboxing','combate',[5.5,7.8,12.8],['saco e técnica','aula normal','sparring']),

  SP('hiking','Caminhada de montanha','natureza',[5.3,6.5,8.0],['trilho plano','com subidas','com mochila e declive']),
  SP('escalada','Escalada','natureza',[5.8,7.5,11.0]),

  SP('patinagem','Patinagem / skate','natureza',[5.0,7.0,9.0],null, D('patinar',6,26,15,0.5,150)),
  SP('jardinagem','Jardinagem / trabalho no quintal','natureza',[2.8,3.8,5.0]),

  SP('danca','Dança','danca',[3.5,5.0,7.8],['de salão','moderna','muito ritmada']),
  SP('zumba','Zumba / aeróbica','danca',[5.0,6.5,8.5]),
  SP('ballet','Ballet / dança contemporânea','danca',[4.8,6.0,7.5])
];
const SPORT={}; SPORTS.forEach(s=>{ SPORT[s.id]=s; });
function nivelIndice(i){ const n=NIVEIS.findIndex(x=>x[0]===i); return n<0? 1 : n; }
function velocidade(s){ const sp=SPORT[s.s]; if(!sp||!sp.dist) return 0;
  const v=parseFloat(s.v); return isFinite(v)&&v>0 ? Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax) : sp.dist.vdef; }
/* Horas dentro do período escolhido: nos desportos de distância vêm de km ÷ velocidade. */
function horasPeriodo(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  if(sp.dist){ const v=velocidade(s); return v>0? (parseFloat(s.km)||0)/v : 0; }
  return parseFloat(s.h)||0; }
function metDe(s){ const sp=SPORT[s.s]; if(!sp) return 0;
  return sp.dist ? metPorVelocidade(sp.dist.curva, velocidade(s)) : sp.mets[nivelIndice(s.i)]; }
/* Nos desportos de distância o nível deixa de se escolher: lê-se do MET. */
function nivelPorMet(sp,met){ return met < (sp.mets[0]+sp.mets[1])/2 ? 0
  : met < (sp.mets[1]+sp.mets[2])/2 ? 1 : 2; }
function rotuloNivel(sp,idx){ return NIVEIS[idx][1]+(sp && sp.dicas? ' ('+sp.dicas[idx]+')' : ''); }
/* Um registo válido para cada tipo de desporto. Os registos antigos de um
   desporto de distância (horas + nível) convertem-se para a velocidade que dá
   exatamente o mesmo MET, de modo que as calorias já calculadas não mudem. */
function normalizaDesporto(s){
  if(!s) return null;
  if(!temChave(SPORT,s.s)) return null;
  const sp=SPORT[s.s];
  const per=['dia','semana','mes'].indexOf(s.per)>=0 ? s.per : 'semana';
  if(sp.dist){
    let v=parseFloat(s.v), km=parseFloat(s.km), converter=false;
    if(!(isFinite(v)&&v>0) || !isFinite(km)){ v=velocidadeParaMet(sp.dist, sp.mets[nivelIndice(s.i)]); converter=true; }
    v=Math.min(Math.max(v,sp.dist.vmin),sp.dist.vmax);
    /* A velocidade assenta num passo do slider antes de gerar a distância,
       para as horas do registo antigo se manterem exatas. */
    v=Math.round(Math.round(v/sp.dist.vStep)*sp.dist.vStep*100)/100;
    if(converter) km=(parseFloat(s.h)||0)*v;
    return {s:sp.id, per, v, km:Math.max(0,Math.round(km*10)/10)};
  }
  return {s:sp.id, per, h:Math.max(0,parseFloat(s.h)||0),
    i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'};
}
function normalizaMembro(m){
  if(m && Array.isArray(m.desportos)) m.desportos=m.desportos.map(normalizaDesporto).filter(Boolean);
  /* migração: deriva o objetivo contínuo do antigo — o alvo kcal não muda */
  if(m && !Number.isFinite(m.objetivoPct)) m.objetivoPct=Math.round((GOALS[m.objetivo]?.[1]||0)*100);
  else if(m) sincronizaObjetivo(m);   /* e mantém o campo legado coerente */
  if(m) normalizaIdadeMeses(m);   /* corrige qualquer meses/idade que tenha ficado do lado errado da fronteira dos 2 anos */

/* Faixa do slider de distância: depende do período, para não haver 400 km/dia. */
function faixaDist(sp,per){
  const sem=sp.dist.maxSemana;

  const step = max<=10? 0.25 : max<=60? 0.5 : max<=200? 1 : 5;
  return {max,step};

function nPT(v,casas){ return (Math.round(v*Math.pow(10,casas))/Math.pow(10,casas))

  let m=Math.floor(min), s=Math.round((min-m)*60); if(s===60){ m++; s=0; }

function textoVelocidade(sp,v){
  const casas = sp.dist.vStep<0.5 ? 1 : 1;

    const porUnidade = r==='min/100m'? 60/v/10 : r==='min/500m'? 60/v/2 : 60/v;

const DIETS = {
  equilibrada:{n:'Equilibrada',c:50,p:20,f:30},
  mediterranica:{n:'Mediterrânica',c:45,p:20,f:35},
  keto:{n:'Keto',c:5,p:25,f:70},
  lowcarb:{n:'Low carb',c:20,p:35,f:45},
  lowfat:{n:'Low fat',c:55,p:25,f:20},

const CUIS = {portuguesa:'Portuguesa',italiana:'Italiana',francesa:'Francesa',mediterranica:'Mediterrânica',asiatica:'Asiática'};
const BASE_ACT = {sedentario:['Sedentário (escritório, pouco movimento)',1.2],leve:['Leve (em pé parte do dia)',1.35],moderado:['Moderado (trabalho ativo)',1.5],intenso:['Intenso (trabalho físico pesado)',1.65]};
const COMMUTE = {nenhum:['Carro / transportes',0],pe30:['A pé (~30 min/dia)',1.75],pe60:['A pé (~1 h/dia)',3.5],bici:['Bicicleta (~30 min/dia)',3.4]}; // valor = MET·h efetivos/dia útil

/* Refeições do dia, com a fatia sugerida do total calórico. */

function nomeRefeicao(k){ const m=MEALS.find(x=>x[0]===k); return m? m[1] : k; }

function R(id,n,coz,d,k,c,p,f,i,mt){return {id,n,coz,d,k,c,p,f,i,mt:mt||['a','j']}}
const RECIPES = [

const KEY='familiaFitV1', APPID='familia-fit', FORMATO=1;
let saveErr='', msg=null;
function blank(){ return {members:[],cheats:{},plans:{},bought:{},prefCuisine:'todas',objetivos:[],
  ui:{tab:'familia',mid:null,cuis:'todas',soComp:false,mealF:'todas',
      objForm:{membros:[],tipo:'perder',delta:5,semanas:12,split:50,desporto:null,banda:2},
      objExpandido:null, objAdj:null, celebrando:null},
  week:mondayISO(new Date()),
  meta:{gravadoEm:null,exportadoEm:null,semCopia:false,avisarAoSair:true}}; }
let S = load();
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || !Array.isArray(s.members)) return blank();
  const b=blank();
  if(!dataValida(s.week)) s.week=mondayISO(new Date());   /* semana corrompida não prende a app */
  s.members.forEach(normalizaMembro);
  return Object.assign(b, s, {ui:Object.assign(b.ui,s.ui||{}), meta:Object.assign(b.meta,s.meta||{})});
}
function writeLS(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); saveErr=''; }
  catch(e){ saveErr = e.name==='QuotaExceededError'
    ? 'Não há espaço para gravar mais dados neste browser. Exporta uma cópia e apaga semanas antigas.'
    : 'O browser está a bloquear a gravação local. Em janela privada os dados perdem-se ao fechar — exporta uma cópia.'; }
  paintSave();
}
/* save() = alteração de dados: grava e marca que ainda não há cópia exportada.
   saveMeta() = alteração só de definições: grava sem mexer nesse estado. */
/* ===== DESFAZER =====
   O instantâneo guarda só os dados; a navegação e as preferências de ecrã
   ficam de fora, para desfazer nunca saltar de separador sozinho. Como o
   save() corre depois da alteração, o que se empilha é o estado anterior —
   e num arrasto de slider isso é o estado de antes do gesto começar. */
const UNDO_MAX=30;
let pilhaUndo=[], pilhaRedo=[], estadoAnterior=null, ultimaDesc=null;
function instantaneo(){ return JSON.stringify({members:S.members, cheats:S.cheats, plans:S.plans,
  bought:S.bought, week:S.week, prefCuisine:S.prefCuisine, objetivos:S.objetivos}); }
function aplicaInstantaneo(js){
  const d=JSON.parse(js);
  S.members=d.members; S.cheats=d.cheats; S.plans=d.plans; S.bought=d.bought;
  S.week=d.week; S.prefCuisine=d.prefCuisine; S.objetivos=d.objetivos||[];
  S.members.forEach(normalizaMembro);
  if(!S.members.some(m=>m.id===S.ui.mid)) S.ui.mid=S.members[0]? S.members[0].id : null;
  macroLive=null;
  estadoAnterior=instantaneo();
  S.meta.gravadoEm=new Date().toISOString(); S.meta.semCopia=true; writeLS(); render();
}
function desfazer(){
  if(!pilhaUndo.length) return;
  const e=pilhaUndo.pop();
  pilhaRedo.push({js:instantaneo(), desc:e.desc});
  const d=e.desc; aplicaInstantaneo(e.js);
  toast('Desfeito'+(d? ': '+d : ''));
}
function refazer(){
  if(!pilhaRedo.length) return;
  const e=pilhaRedo.pop();
  pilhaUndo.push({js:instantaneo(), desc:e.desc});
  const d=e.desc; aplicaInstantaneo(e.js);
  toast('Refeito'+(d? ': '+d : ''));
}
let _toastT=null;
function toast(txt){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=txt; el.style.opacity='1';
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>{ el.style.opacity='0';
    _toastT=setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },250); }, 2600);
}
function pintaHist(){
  const u=document.getElementById('btn-undo'), r=document.getElementById('btn-redo');
  if(u){ u.disabled=!pilhaUndo.length;
    u.title=pilhaUndo.length? 'Desfazer'+(pilhaUndo[pilhaUndo.length-1].desc? ': '+pilhaUndo[pilhaUndo.length-1].desc:'')+' (Ctrl+Z)' : 'Nada para desfazer'; }
  if(r){ r.disabled=!pilhaRedo.length;
    r.title=pilhaRedo.length? 'Refazer (Ctrl+Shift+Z)' : 'Nada para refazer'; }
}
function save(desc){
  const agora=instantaneo();
  if(estadoAnterior!==null && estadoAnterior!==agora){
    pilhaUndo.push({js:estadoAnterior, desc:desc||ultimaDesc||null});
    if(pilhaUndo.length>UNDO_MAX) pilhaUndo.shift();
    pilhaRedo=[];
  }
  ultimaDesc=null;
  estadoAnterior=agora;
  S.meta.gravadoEm=new Date().toISOString(); S.meta.semCopia=true; writeLS(); pintaHist();
}
function saveMeta(){ S.meta.gravadoEm=new Date().toISOString(); writeLS(); }
function hhmm(isoS){ if(!isoS) return '—'; const d=new Date(isoS);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dataHora(isoS){ if(!isoS) return 'nunca'; const d=new Date(isoS);
  return fmtShort(iso(d))+' às '+hhmm(isoS); }
function paintSave(){
  const el=document.getElementById('savest'); if(!el) return;
  if(saveErr){ el.className='savest err'; el.innerHTML='<i class="led"></i> gravação bloqueada'; return; }
  if(!S.members.length){ el.className='savest none'; el.innerHTML='<i class="led"></i> sem dados'; return; }
  if(S.meta.semCopia){ el.className='savest pend'; el.innerHTML='<i class="led"></i> guardado '+hhmm(S.meta.gravadoEm)+' · sem cópia'; return; }
  el.className='savest'; el.innerHTML='<i class="led"></i> guardado '+hhmm(S.meta.gravadoEm)+' · cópia feita';
}

function uid(){ return 'm'+Math.random().toString(36).slice(2,9); }

/* ================= CÁLCULOS ================= */
function bmi(m){ const h=m.altura/100; return h>0? m.peso/(h*h) : 0; }
function bmiClass(v){ return v<18.5?['Abaixo do peso','warn']: v<25?['Peso normal','ok']: v<30?['Excesso de peso','warn']:['Obesidade','bad']; }

/* ===== FASES DA VIDA =====
   As fórmulas de adulto não servem para crianças nem para a gravidez. Cada
   fase traz a sua equação, a sua faixa de macros e os seus limites de esforço.
   Referências: IOM/DRI (2002/2005), Schofield (1985), IOM/NRC (2009),
   OMS (2020) e ACOG (Practice Bulletin 804/231). São valores de referência
   populacional, não prescrição — a app di-lo em cada ecrã onde importa. */
function idadeMeses(m){ return Number.isFinite(m.meses)? m.meses : (parseFloat(m.idade)||0)*12; }
function idadeAnos(m){ return idadeMeses(m)/12; }
/* Dois anos é o valor mínimo medido em anos; abaixo disso mede-se sempre em
   meses (0-24). Esta função é o único sítio que decide a fronteira e mantém
   m.meses/m.idade coerentes entre si — chamada em qualquer caminho que mude
   a idade (edição direta, sliders, escolha de fase, importação), para a
   representação nunca ficar presa no lado errado da fronteira. */
function normalizaIdadeMeses(m){
  if(Number.isFinite(m.meses)){
    m.meses=clampNum(Math.round(m.meses),0,24);
    if(m.meses>=24){ m.idade=2; delete m.meses; }
    else m.idade=m.meses/12;
  } else if((parseFloat(m.idade)||0)<2){
    m.meses=clampNum(Math.round((parseFloat(m.idade)||0)*12),0,24);
    m.idade=m.meses/12;
  }
}
function gravida(m){ return m.sexo==='f' && !!m.gravida && idadeAnos(m)>=12; }
function fetos(m){ return clampNum(Math.round(parseFloat(m.fetos)||1),1,3); }
function trimestre(m){ return clampNum(Math.round(parseFloat(m.trimestre)||1),1,3); }
function faseDe(m){
  const a=idadeAnos(m);
  if(a<2) return 'bebe';
  if(a<13) return 'crianca';
  if(a<19) return 'adolescente';
  return 'adulto';
}
const FASES={bebe:'Bebé',crianca:'Criança',adolescente:'Adolescente',adulto:'Adulto'};
function nomeFase(m){ return gravida(m)? (FASES[faseDe(m)]+' · grávida') : FASES[faseDe(m)]; }
/* O peso de referência da grávida é o pré-gestacional: é sobre ele que as
   recomendações são construídas. O peso atual serve para acompanhar o ganho. */
function pesoRef(m){ const p=parseFloat(m.pesoPre);
  return gravida(m) && isFinite(p) && p>0 ? p : m.peso; }
/* Metabolismo basal: Schofield abaixo dos 19 anos, Mifflin-St Jeor a partir
   daí — os perfis adultos que já existiam mantêm o valor exato. */
function bmr(m){
  const a=idadeAnos(m), p=pesoRef(m), f=m.sexo==='f';
  if(a<19){
    if(a<3)  return f? 58.317*p-31.1 : 59.512*p-30.4;
    if(a<10) return f? 20.315*p+485.9 : 22.706*p+504.3;
    return   f? 13.384*p+692.6 : 17.686*p+658.2;
  }
  /* pesoRef é o peso do próprio, exceto na gravidez, onde é o pré-gestacional */
  return f ? 10*p+6.25*m.altura-5*m.idade-161 : 10*p+6.25*m.altura-5*m.idade+5;
}
/* Energia de crescimento, que só existe enquanto o corpo está a crescer. */
function crescimentoKcal(m){
  const meses=idadeMeses(m), a=meses/12;
  if(meses<4) return 175;
  if(meses<7) return 56;
  if(meses<13) return 22;
  if(a<3) return 20;
  if(a<9) return 20;
  if(a<19) return 25;
  return 0;
}
/* Incremento da gravidez (IOM/DRI): nada no 1.º trimestre, +340 no 2.º,
   +452 no 3.º. Para gémeos não há DRI — usa-se um acréscimo declarado como
   aproximação. Para trigémeos não existe valor defensável e a app recusa-se
   a inventar um. */
function gravidezKcal(m){
  if(!gravida(m)) return 0;
  const t=trimestre(m), n=fetos(m);
  const base = t===1? 0 : t===2? 340 : 452;
  if(n===1) return base;
  if(n===2) return base===0? 0 : base+350;
  return 0;   /* trigémeos: sem estimativa — ver avisoGravidez() */
}
function semEstimativa(m){ return gravida(m) && fetos(m)>=3; }
function tdee(m){ return bmr(m)*(temChave(BASE_ACT,m.atividade)?BASE_ACT[m.atividade][1]:1.2)
  + sportsKcalDay(m) + commuteKcalDay(m) + crescimentoKcal(m) + gravidezKcal(m); }
/* Faixas de distribuição de macronutrientes aceitáveis (AMDR, IOM/DRI).
   Abaixo dos 12 meses não estão definidas — não se aplicam percentagens. */
function amdrDe(m){
  const a=idadeAnos(m);
  if(a<1) return null;
  if(a<4)  return {c:[45,65],p:[5,20], f:[30,40]};
  if(a<19) return {c:[45,65],p:[10,30],f:[25,35]};
  return {c:[45,65],p:[10,35],f:[20,35]};
}
/* Proteína de referência em g por kg de peso e por dia. */
function proteinaKg(m){
  if(gravida(m)) return 1.1;
  const meses=idadeMeses(m), a=meses/12;
  if(meses<7) return 1.52;
  if(meses<13) return 1.2;
  if(a<4) return 1.05;
  if(a<14) return 0.95;
  if(a<19) return 0.85;
  return 0.8;
}
/* Piso absoluto de hidratos (RDA), que manda acima da percentagem. */
function hidratosMin(m){ if(idadeAnos(m)<1) return 0; return gravida(m)? 175 : 130; }
/* Um défice calórico não é para crianças, adolescentes em crescimento nem
   grávidas — o slider de objetivo fica limitado a manutenção ou acima. */
function permiteDefice(m){ return faseDe(m)==='adulto' && !gravida(m); }
function permiteProjecao(m){ return permiteDefice(m); }
/* Abaixo dos 6 meses a alimentação é leite materno ou fórmula: a app não
   gera plano de receitas. Entre os 6 e os 24 meses é apoio, não prescrição. */
function semPlanoAlimentar(m){ return idadeMeses(m)<6; }

/* ===== NUTRIÇÃO DO BEBÉ =====
   Peso para a idade, percentis 3/15/50/85/97, em quilogramas. Valores
   transcritos das "Simplified field tables — Weight-for-age" oficiais da
   OMS (WHO Child Growth Standards, 2006) — cdn.who.int/.../sft-wfa-boys-p-0-5.pdf
   e .../sft-wfa-girls-p-0-5.pdf. Entre os meses tabelados interpola-se. */
const WHO_MESES=[0,3,6,9,12,15,18,21,24];
const WHO_PESO={
  m:[[2.5,2.9,3.3,3.9,4.3],[5.1,5.6,6.4,7.2,7.9],[6.4,7.1,7.9,8.9,9.7],[7.2,7.9,8.9,10.0,10.9],
     [7.8,8.6,9.6,10.8,11.8],[8.4,9.2,10.3,11.6,12.7],[8.9,9.7,10.9,12.3,13.5],
     [9.3,10.3,11.5,13.0,14.3],[9.8,10.8,12.2,13.7,15.1]],
  f:[[2.4,2.8,3.2,3.7,4.2],[4.6,5.1,5.8,6.7,7.4],[5.8,6.4,7.3,8.3,9.2],[6.6,7.3,8.2,9.3,10.4],
     [7.1,7.9,8.9,10.2,11.3],[7.7,8.5,9.6,10.9,12.2],[8.2,9.0,10.2,11.6,13.0],
     [8.7,9.6,10.9,12.4,13.8],[9.2,10.1,11.5,13.1,14.6]]
};
const PERCENTIS=[3,15,50,85,97];
function pesosPercentis(sexo,meses){
  const t=WHO_PESO[sexo==='f'?'f':'m'], x=clampNum(meses,0,24);
  let i=0; while(i<WHO_MESES.length-2 && x>WHO_MESES[i+1]) i++;
  const a=WHO_MESES[i], b=WHO_MESES[i+1], r=(b>a)?(x-a)/(b-a):0;
  return t[i].map((v,k)=>v+(t[i+1][k]-v)*r);
}
function pesoNoPercentil(sexo,meses,p){
  const v=pesosPercentis(sexo,meses);
  if(p<=PERCENTIS[0]) return v[0];
  if(p>=PERCENTIS[4]) return v[4];
  for(let i=1;i<PERCENTIS.length;i++) if(p<=PERCENTIS[i]){
    const r=(p-PERCENTIS[i-1])/(PERCENTIS[i]-PERCENTIS[i-1]);
    return v[i-1]+(v[i]-v[i-1])*r; }
  return v[4];
}
/* Percentil aproximado do peso atual, por interpolação entre as curvas. */
function percentilDe(m){
  const v=pesosPercentis(m.sexo,idadeMeses(m)), p=m.peso;
  if(p<=v[0]) return {p:3,abaixo:true};
  if(p>=v[4]) return {p:97,acima:true};
  for(let i=1;i<v.length;i++) if(p<=v[i]){
    const r=(v[i]-v[i-1])>0? (p-v[i-1])/(v[i]-v[i-1]) : 0;
    return {p: PERCENTIS[i-1]+(PERCENTIS[i]-PERCENTIS[i-1])*r}; }
  return {p:97};
}
function textoPercentil(m){
  const q=percentilDe(m);
  if(q.abaixo) return 'abaixo do percentil 3';
  if(q.acima) return 'acima do percentil 97';
  return 'percentil '+Math.round(q.p);
}
/* Doses diárias de referência para bebés e crianças pequenas. Fontes:
   energia — IOM, "Dietary Reference Intakes for Energy, Carbohydrate,
   Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino Acids" (2002/
   2005), equação de EER para lactentes/1-3 anos; proteína, hidratos,
   gordura e água — mesmo relatório; ferro — IOM (2001), "...Iron...";
   cálcio e vitamina D — IOM, "Dietary Reference Intakes for Calcium and
   Vitamin D" (2011). A vitamina D SOBE de 10 para 15 µg (400→600 UI)
   exatamente na transição de lactente (AI, 0-12 meses) para 1-3 anos
   (RDA) — não é um valor único para toda a primeira infância. */
function ddrBebe(m){
  const meses=idadeMeses(m), p=m.peso;
  const kcal=(89*p-100)+crescimentoKcal(m);
  let prot,hc,gord,agua,ferro,calcio,vitD;
  if(meses<7){ prot=1.52*p; hc=60; gord=31; agua=700; ferro=0.27; calcio=200; vitD=10; }
  else if(meses<13){ prot=1.2*p; hc=95; gord=30; agua=800; ferro=11; calcio=260; vitD=10; }
  else { prot=1.05*p; hc=130; gord=kcal*0.35/9; agua=1300; ferro=7; calcio=700; vitD=15; }
  return {kcal:Math.round(kcal), prot:Math.round(prot*10)/10, hc:Math.round(hc),
    gord:Math.round(gord), agua, ferro, calcio, vitD};
}
/* Leite: 67 kcal por 100 mL — o padrão clássico de 20 kcal/oz (AAP), dentro
   do intervalo regulatório do Codex Alimentarius CXS 72-1981 e do consenso
   ESPGHAN (Koletzko et al., 2005) de 60-70 kcal/100 mL para fórmulas de
   início; valor médio de referência, não um número exato — a composição
   real varia por marca e, no leite materno, por fase da lactação. */
const KCAL_100ML=67;
/* Volume de referência em ml por kg e por dia: não é um patamar único, e
   decresce com a idade à medida que entram os sólidos. Âncoras a partir de
   HealthyChildren.org/AAP (150-180 ml/kg/dia nos primeiros 2 meses,
   decrescendo) e de dados de ingestão real de leite materno (IABLE/
   lacted.org: ~135 ml/kg/dia ao 1.º mês, ~126 aos 3, ~107 aos 6 meses).
   Interpola-se entre âncoras; o aviso soa a 35% de desvio do valor central,
   para não gerar falsos alarmes numa referência que já é aproximada. */
const ANCORAS_MLKG=[[0,160],[1,150],[3,125],[6,108],[9,98],[12,90],[24,90]];
function volumeRefMlKg(meses){
  const a=ANCORAS_MLKG; let i=0; while(i<a.length-2 && meses>a[i+1][0]) i++;
  const [m0,v0]=a[i], [m1,v1]=a[i+1], r=(m1>m0)?(meses-m0)/(m1-m0):0;
  return v0+(v1-v0)*r;
}
const MODOS_LEITE={materno:'Leite materno',formula:'Fórmula',misto:'Misto',solidos:'Leite + sólidos'};
function bebeCfg(m){
  const meses=idadeMeses(m);
  const d=m.bebe||{};
  const modo = MODOS_LEITE[d.modo]? d.modo : (meses<6?'materno':'solidos');
  const tomadasPad = meses<1?8 : meses<3?7 : meses<6?6 : meses<9?5 : 4;
  const pctPad = meses<6?100 : meses<9?70 : meses<13?55 : 35;
  return {
    modo,
    tomadas: clampNum(Math.round(parseFloat(d.tomadas)||tomadasPad),1,12),
    intervalo: clampNum(parseFloat(d.intervalo)||3,2,6),
    inicio: clampNum(parseFloat(d.inicio)||7,0,11.5),
    pctLeite: clampNum(Math.round(parseFloat(d.pctLeite)||pctPad),0,100),
    ml: Number.isFinite(parseFloat(d.ml))? clampNum(Math.round(parseFloat(d.ml)),20,300) : null
  };
}
/* Volume de leite: por omissão parte das 150 mL por kg e por dia, referência
   habitual para lactentes de termo, ajustada pela fatia de energia que ainda
   vem do leite quando já há sólidos. */
function leiteBebe(m){
  const c=bebeCfg(m), ddr=ddrBebe(m);
  const kcalLeite=ddr.kcal*c.pctLeite/100;
  const mlAlvo=Math.round(kcalLeite/KCAL_100ML*100);
  const mlPorTomada = c.ml!=null? c.ml : Math.round(mlAlvo/c.tomadas/5)*5;
  const mlTotal=mlPorTomada*c.tomadas;
  return {cfg:c, ddr, mlAlvo, mlPorTomada, mlTotal,

function temChave(o,k){ return typeof k==='string' && Object.prototype.hasOwnProperty.call(o,k); }

/* Objetivo em percentagem contínua do gasto (−25…+20). Para dados antigos,
   deriva-se dos fatores de GOALS — perder=−15, manter=0, ganhar=+10 — pelo

function objetivoPct(m){ return Number.isFinite(m.objetivoPct)? clampNum(Math.round(m.objetivoPct),-25,20)

function rotuloObjetivo(m){ const p=objetivoPct(m);
  if(p===0) return 'Manter peso';

function exigeAmdr(m){ return faseDe(m)!=='adulto' || gravida(m); }
function macrosAjustados(m){
  const d=dietaDe(m), faixa=amdrDe(m);
  /* Num adulto que não está grávido, a faixa é informação e a escolha é dele —
     uma dieta cetogénica continua a ser cetogénica. Só se encosta à faixa onde
     o plano é para outra pessoa em crescimento, ou para uma gravidez. */
  if(!faixa || !exigeAmdr(m)) return {c:d.c,p:d.p,f:d.f,n:d.n,ajustado:false};
  const c0=clampNum(d.c,faixa.c[0],faixa.c[1]);
  const p0=clampNum(d.p,faixa.p[0],faixa.p[1]);
  const f0=clampNum(d.f,faixa.f[0],faixa.f[1]);
  const ajustado = c0!==d.c || p0!==d.p || f0!==d.f;
  if(!ajustado) return {c:d.c,p:d.p,f:d.f,n:d.n,ajustado:false};
  /* Encostar cada macro à faixa deixa a soma fora dos 100; a diferença é
     distribuída pelos macros que ainda têm folga dentro da própria faixa,
     em vez de reescalar tudo — assim o resultado continua dentro da faixa. */
  const v={c:c0,p:p0,f:f0};
  for(let it=0; it<12; it++){
    const dif=100-(v.c+v.p+v.f);
    if(Math.abs(dif)<0.005) break;
    const folga=k=> dif>0 ? faixa[k][1]-v[k] : v[k]-faixa[k][0];
    const total=['c','p','f'].reduce((t,k)=>t+Math.max(0,folga(k)),0);
    if(total<=0) break;
    ['c','p','f'].forEach(k=>{ const fl=Math.max(0,folga(k)); if(fl>0) v[k]+=dif*fl/total; });

function projecaoPeso(m,sem){ sem=sem||12; const out=[Math.round(m.peso*10)/10]; const c=Object.assign({},m);

function normaliza100(o){
  const brutos=['c','p','f'].map(k=>Math.max(0,parseFloat(o&&o[k])||0));

  const exatos=brutos.map(v=>v/soma*100), base=exatos.map(v=>Math.floor(v));

  const ordem=[0,1,2].sort((a,b)=>(exatos[b]-base[b])-(exatos[a]-base[a]));
  for(let i=0;i<falta;i++) base[ordem[i%3]]++;

function kcalPlaneadasDia(m,di,dates){
  if(isCheat(m.id,dates[di])) return {cheat:true,kcal:0,refs:0};

  if(field==='dieta' && val==='personalizada' && m.dieta!=='personalizada' && !m.macros){
    const d=dietaDe(m); m.macros={c:d.c,p:d.p,f:d.f};
  }
  m[field]=num?parseFloat(val)||0:val;
  if(field==='idade'||field==='meses'){
    normalizaIdadeMeses(m);   /* decide meses vs anos e ajusta a fronteira dos 2 anos */
    /* mudar de idade repõe a fatia de leite e o volume nos padrões do escalão */
    if(m.bebe){ delete m.bebe.pctLeite; m.bebe.ml=null; }
  }
  const rot={peso:'peso',altura:'altura',idade:'idade',dieta:'dieta',sexo:'sexo',nome:'nome',
    atividade:'nível de atividade',desloc:'deslocação',gravida:'gravidez',meses:'idade'}[field];
  save(rot? rot+' de '+m.nome : null); render(); }

/* A escolha da fase acerta a idade para dentro do escalão, para os cálculos
   e os limites de esforço passarem logo a ser os certos. */
function setFase(mid,f){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(f==='bebe'){ if(!Number.isFinite(m.meses)) m.meses=12; m.idade=m.meses/12; m.gravida=false; }
  else { delete m.meses;
    const a=idadeAnos(m);
    if(f==='crianca' && !(a>=2&&a<13)) m.idade=8;
    if(f==='adolescente' && !(a>=13&&a<19)) m.idade=15;
    if(f==='adulto' && a<19) m.idade=30;
  }
  normalizaIdadeMeses(m);
  save(); render();
}
/* O aviso que acompanha cada fase. Não impede nada, mas também não deixa a
   app fingir autoridade clínica que não tem. */
function avisoFase(m){
  const meses=idadeMeses(m), fase=faseDe(m), av=[];
  if(gravida(m)){
    av.push(fetos(m)>=3
      ? '<b>Gestação de trigémeos ou mais:</b> não há valores de referência publicados para as necessidades energéticas, por isso a app não apresenta uma estimativa. O acompanhamento tem de ser da equipa de obstetrícia e nutrição.'
      : fetos(m)===2
        ? 'Numa gestação gemelar não existe recomendação oficial de energia: o acréscimo mostrado é uma aproximação e as necessidades reais costumam ser maiores. Confirma com quem te segue.'
        : 'Os valores seguem as referências para gravidez de feto único e usam o peso pré-gestacional. Não substituem o acompanhamento obstétrico e nutricional.');
  }
  if(meses<6) av.push('<b>Até aos 6 meses</b> a alimentação é leite materno ou fórmula. A app não gera plano alimentar nesta idade — a orientação é do pediatra.');
  else if(meses<24) av.push('Entre os 6 e os 24 meses o plano serve de apoio à diversificação alimentar, não de prescrição. Segue as indicações do pediatra ou do enfermeiro de família.');
  else if(fase==='crianca'||fase==='adolescente') av.push('Em idade de crescimento os valores são referências populacionais e não dispensam o acompanhamento em consulta. Restringir calorias nesta fase pode comprometer o crescimento.');
  if(!av.length) return '';
  return `<div class="msg warn-msg" style="margin:12px 0 0">${av.join('<br><br>')}</div>`;
}
/* Arrasto dos sliders de perfil: estado + espelho no campo numérico (nunca o
   focado) + atualização ao vivo de IMC, banda, basal, gasto e alvo do cartão. */
function slidePerfil(mid,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m[campo]=parseFloat(el.value)||0; pintaRange(el);
  const inp=document.getElementById('in-'+mid+'-'+campo);
  if(inp && document.activeElement!==inp) inp.value=el.value;
  aoVivo('fam:'+mid, ()=>atualizarFamilia(mid));
}
/* Slider de idade em meses (0-24): durante o gesto só se mexe em m.meses —
   a troca de controlo (para o slider em anos) só acontece no commit, para o
   dedo nunca perder o slider a meio do arrasto. */
function slideIdadeMeses(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  m.meses=clampNum(Math.round(parseFloat(el.value)||0),0,24);
  m.idade=m.meses/12;
  pintaRange(el);
  const inp=document.getElementById('in-'+mid+'-idade');
  if(inp && document.activeElement!==inp) inp.value=m.meses;
  aoVivo('fam:'+mid, ()=>atualizarFamilia(mid));
}
/* Ao soltar, se o valor chegou aos 24 meses (dois anos), converte-se para a
   representação em anos — dois anos é o valor mínimo medido em anos. */
function commitIdadeMeses(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  normalizaIdadeMeses(m);
  if(m.bebe){ delete m.bebe.pctLeite; m.bebe.ml=null; }
  save('idade de '+m.nome); render();
}
function atualizarFamilia(mid){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const v=bmi(m), [cls,tone]=bmiClass(v);
  põe('f-'+mid+'-o-peso', nPT(m.peso,1)+' kg');
  põe('f-'+mid+'-o-altura', Math.round(m.altura)+' cm');
  põe('f-'+mid+'-o-idade', idadeAnos(m)<2? Math.round(idadeMeses(m))+' meses' : Math.round(m.idade)+' anos');
  põe('f-'+mid+'-imc', nPT(v,1)); põe('f-'+mid+'-imcv', nPT(v,1));
  põe('f-'+mid+'-bmr', Math.round(bmr(m)));
  põe('f-'+mid+'-tdee', Math.round(tdee(m)));
  põeAttr('f-'+mid+'-mk','transform','translate('+sx(v,15,40,8,332).toFixed(1)+',0)');
  /* o texto anda à parte do triângulo, preso dentro do viewBox para não ser
     cortado nos extremos da escala */
  põeAttr('f-'+mid+'-imcv','x', clampNum(sx(v,15,40,8,332),22,318).toFixed(1));
  const adulto=faseDe(m)==='adulto';
  const pill=document.getElementById('f-'+mid+'-cls');
  /* As classes de IMC do adulto não se aplicam a crianças, cuja leitura é
     por percentil para a idade e o sexo — mostra-se a fase em vez disso. */
  if(pill){ pill.textContent=adulto?cls:nomeFase(m); pill.setAttribute('class','pill '+(adulto?tone:'')); }
  põe('f-'+mid+'-alvo', semEstimativa(m)?'—':Math.round(targetKcal(m)));
  const h2=(m.altura/100)*(m.altura/100);
  const zmin=Math.round(18.5*h2), zmax=Math.round(25*h2), dentro=m.peso>=zmin&&m.peso<=zmax;
  const zel=document.getElementById('f-'+mid+'-zona');
  if(zel && adulto){ zel.textContent=(dentro?'✓ ':'')+'Peso saudável para '+Math.round(m.altura)+' cm: '+zmin+'–'+zmax+' kg';
    zel.setAttribute('class', dentro?'sub f-ok-txt':'sub'); }
}

/* ================= ATIVIDADE ================= */
function addSport(mid){ const m=S.members.find(x=>x.id===mid);
  m.desportos.push(normalizaDesporto({s:'caminhada',h:2,per:'semana',i:'moderado'})); save(); render(); }
function opcoesDesporto(sel){
  return CATS_SPORT.map(([c,rot])=>{
    const lista=SPORTS.filter(s=>s.cat===c);
    if(!lista.length) return '';
    return `<optgroup label="${rot}">`+lista.map(s=>
      `<option value="${s.id}" ${sel===s.id?'selected':''}>${s.nome}</option>`).join('')+`</optgroup>`;
  }).join('');
}
function updSport(mid,i,f,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  const s=m.desportos[i]; if(!s) return;
  if(f==='s'){
    /* Ao trocar de desporto guardam-se as horas e convertem-se para a forma
       que o novo desporto usa, para não se perder o que já estava escrito. */
    const horas=horasPeriodo(s), novo=SPORT[val];
    if(novo && novo.dist){ m.desportos[i]={s:val, per:s.per, v:novo.dist.vdef,
      km:Math.round(Math.max(horas,0.25)*novo.dist.vdef*10)/10}; }
    else { m.desportos[i]={s:val, per:s.per, h:Math.round(Math.max(horas,0.25)*10)/10,
      i:NIVEIS.some(n=>n[0]===s.i)? s.i : 'moderado'}; }
  } else if(f==='per'){
    s.per=val;
    const sp=SPORT[s.s];
    if(sp && sp.dist) s.km=Math.min(parseFloat(s.km)||0, faixaDist(sp,val).max);
  } else if(f==='h'||f==='km'||f==='v'){ s[f]=parseFloat(val)||0; }
  else { s[f]=val; }
  save(); render();
}
function pintaRange(el){ const mn=parseFloat(el.min), mx=parseFloat(el.max), v=parseFloat(el.value);
  el.style.setProperty('--pct', (mx>mn? Math.round((clampNum(v,mn,mx)-mn)/(mx-mn)*100):0)+'%'); }
/* Contrato tátil de toda a app: oninput muta o estado e reescreve SÓ os alvos
   com id (nunca render), onchange grava. O coalescedor prende as escritas de
   DOM ao ritmo dos frames — em aparelhos lentos o input dispara mais depressa. */
/* Coalesce por chave: com dois dedos em cartões diferentes, guardar só o
   último callback deixava um deles por pintar — aqui cada alvo tem a sua
   entrada e todos correm no mesmo frame. */
let _raf=0; const _pend={};
function aoVivo(chave,fn){
  _pend[chave]=fn;
  if(_raf) return;
  _raf=requestAnimationFrame(()=>{ _raf=0;
    const fns=Object.keys(_pend).map(k=>{ const f=_pend[k]; delete _pend[k]; return f; });
    fns.forEach(f=>f());
  });
}
function põe(id,txt){ const el=document.getElementById(id); if(el) el.textContent=txt; }
function põeAttr(id,attr,val){ const el=document.getElementById(id); if(el) el.setAttribute(attr,val); }
function slideSport(mid,i,campo,el){
  const m=S.members.find(x=>x.id===mid); if(!m||!m.desportos[i]) return;
  m.desportos[i][campo]=parseFloat(el.value)||0;
  pintaRange(el);
  aoVivo('atv', atualizarAtividade);
}
function atualizarAtividade(){
  const m=curM(); if(!m) return;
  (m.desportos||[]).forEach((s,i)=>{
    const sp=SPORT[s.s]; if(!sp) return;
    const met=metDe(s), kd=met*m.peso*sportWeeklyH(s)/7;
    if(sp.dist){
      põe('sp'+i+'-km', nPT(parseFloat(s.km)||0, faixaDist(sp,s.per).step<1?1:0)+' km');
      põe('sp'+i+'-v', textoVelocidade(sp, velocidade(s)));
      põe('sp'+i+'-t', hmm(horasPeriodo(s))+' por '+porLabel(s.per));
      põe('sp'+i+'-nivel', NIVEIS[nivelPorMet(sp,met)][1]);
      /* o ponto na curva move-se só com a velocidade (o MET não depende da distância) */
      const d=sp.dist, y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
      const cx=sx(velocidade(s),d.vmin,d.vmax,36,330).toFixed(1);
      const cy=sx(met,y0,y1,104,10).toFixed(1);
      põeAttr('sp'+i+'-dot','cx',cx); põeAttr('sp'+i+'-dot','cy',cy);
      const drop=document.getElementById('sp'+i+'-drop');
      if(drop){ drop.setAttribute('x1',cx); drop.setAttribute('x2',cx);
        drop.setAttribute('y1',cy); drop.setAttribute('y2','104'); }
    }
    põe('sp'+i+'-kcal','~'+Math.round(kd)+' kcal/dia');
    põe('sp'+i+'-met', nPT(met,1)+' MET · '+Math.round(met*m.peso)+' kcal/h');
  });
  põe('tot-desporto','+'+Math.round(sportsKcalDay(m)));
  põe('tot-total', Math.round(tdee(m)));
  /* barra empilhada do gasto + linha do alvo — a mesma assinatura da Nutrição e do Plano */
  const gp=gastoPartes(m), alvo=targetKcal(m);
  const barra=document.getElementById('ga-basal');
  if(barra){
    const K=Math.max(gp.total,alvo)*1.05||1, w=x=>Math.max(0,x/K*100);
    barra.style.width=w(gp.basal)+'%';
    document.getElementById('ga-dia').style.width=w(gp.dia)+'%';
    document.getElementById('ga-desloc').style.width=w(gp.desloc)+'%';
    document.getElementById('ga-desp').style.width=w(gp.desp)+'%';
    const X=w(alvo), linha=document.getElementById('ga-alvo'), txt=document.getElementById('ga-alvo-txt');
    if(linha) linha.style.left=X+'%';

  }
}
function delSport(mid,i){ const m=S.members.find(x=>x.id===mid); m.desportos.splice(i,1); save(); render(); }

/* Curva velocidade→MET com o ponto do slider. A interpolação da app é linear,
   por isso a polyline pelos pontos tabelados É a curva exata, não uma amostra. */
function curvaMetSvg(sp,s,i){
  const d=sp.dist, c=CURVAS[d.curva];
  const y0=Math.floor(metPorVelocidade(d.curva,d.vmin))-0.5, y1=Math.ceil(metPorVelocidade(d.curva,d.vmax))+0.5;
  const X=v=>sx(v,d.vmin,d.vmax,36,330), Y=met=>sx(met,y0,y1,104,10);
  const pts=[[d.vmin,metPorVelocidade(d.curva,d.vmin)]]
    .concat(c.filter(p=>p[0]>d.vmin&&p[0]<d.vmax))
    .concat([[d.vmax,metPorVelocidade(d.curva,d.vmax)]]);
  const poly=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const area=poly+' '+X(d.vmax).toFixed(1)+',104 '+X(d.vmin).toFixed(1)+',104';
  /* divisórias de nível derivadas dos mesmos limiares de nivelPorMet */
  const v1=velocidadeParaMet(d,(sp.mets[0]+sp.mets[1])/2), v2=velocidadeParaMet(d,(sp.mets[1]+sp.mets[2])/2);
  const zonas=[[d.vmin,v1,'leve'],[v1,v2,'moderado'],[v2,d.vmax,'intenso']];
  const rotZonas=zonas.map(z=>{ const w=X(z[1])-X(z[0]);
    return w>=44? `<text x="${((X(z[0])+X(z[1]))/2).toFixed(1)}" y="20" font-size="9.5" text-anchor="middle" class="f-mut">${z[2]}</text>`:''; }).join('');
  const divisorias=[v1,v2].map(v=>`<line x1="${X(v).toFixed(1)}" y1="10" x2="${X(v).toFixed(1)}" y2="104" class="s-line" stroke-dasharray="2 4"/>`).join('');
  const meio=Math.round((d.vmin+d.vmax)/2);
  /* a natação vai de 1,5 a 4,5 km/h: arredondar o rótulo a inteiro punha «2» e
     «5» por baixo dos extremos reais */
  const rotV=v=>nPT(v, Number.isInteger(v)?0:1);
  const ticksX=[d.vmin,meio,d.vmax].map(v=>`<text x="${X(v).toFixed(1)}" y="118" font-size="10" text-anchor="middle" class="f-mut" style="font-variant-numeric:tabular-nums">${rotV(v)}</text>`).join('');
  const m1=Math.ceil(y0), m2=Math.floor(y1);
  const ticksY=`<text x="30" y="${(Y(m1)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m1}</text>
    <text x="30" y="${(Y(m2)+3.5).toFixed(1)}" font-size="10" text-anchor="end" class="f-mut">${m2}</text>`;
  const vA=velocidade(s), cx=X(vA).toFixed(1), cy=Y(metDe(s)).toFixed(1);
  return `<svg class="svgfx svg-linha" viewBox="0 0 340 132" preserveAspectRatio="none" aria-hidden="true">
    <line x1="36" y1="104" x2="330" y2="104" class="s-line"/>
    <polygon points="${area}" class="f-acc" fill-opacity=".07"/>
    <polyline points="${poly}" class="s-acc" fill="none" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${divisorias}${rotZonas}${ticksX}${ticksY}
    <text x="330" y="130" font-size="9.5" text-anchor="end" class="f-mut">km/h</text>
    <text x="30" y="14" font-size="9.5" text-anchor="end" class="f-mut">MET</text>
    <line id="sp${i}-drop" x1="${cx}" y1="${cy}" x2="${cx}" y2="104" class="s-energy" stroke-dasharray="3 3" opacity=".5"/>
    <circle id="sp${i}-dot" cx="${cx}" cy="${cy}" r="5.5" style="fill:var(--energy);stroke:var(--card);stroke-width:2"/>
  </svg>`;
}
/* Desportos por níveis: escala fixa 2–16 MET, comparável entre desportos —
   vê-se que o «intenso» do ténis de mesa fica abaixo do «leve» da corrida. */
function escalaMet3(sp,s){
  const x=met=>sx(clampNum(met,2,16),2,16,12,328);
  const ni=nivelIndice(s.i);
  return `<svg class="svgfx" viewBox="0 0 340 40" aria-hidden="true">
    <line x1="12" y1="22" x2="328" y2="22" class="s-line"/>
    ${sp.mets.map((met,idx)=>`
      <circle cx="${x(met).toFixed(1)}" cy="22" r="${idx===ni?6:4}" style="${idx===ni?'fill:var(--accent);stroke:var(--card);stroke-width:2':'fill:var(--card);stroke:var(--mut);stroke-width:1.5'}"/>
      <text x="${x(met).toFixed(1)}" y="38" font-size="9.5" text-anchor="middle" class="${idx===ni?'f-ink':'f-mut'}" style="font-variant-numeric:tabular-nums"${idx===ni?' font-weight="700"':''}>${nPT(met,1)}</text>`).join('')}
    <text x="328" y="10" font-size="9.5" text-anchor="end" class="f-mut">escala 2–16 MET</text>
  </svg>`;
}
function blocoDesporto(m,s,i){
  const sp=SPORT[s.s], met=metDe(s);
  const kd=Math.round(met*m.peso*sportWeeklyH(s)/7), kh=Math.round(met*m.peso);
  const periodo=`<select onchange="updSport('${m.id}',${i},'per',this.value)" aria-label="Período">

  const gasto=`<span class="kcal" id="sp${i}-kcal">~${kd} kcal/dia</span>
    <span class="sub" id="sp${i}-met">${nPT(met,1)} MET · ${kh} kcal/h</span>`;
  let miolo;
  if(sp.dist){
    const f=faixaDist(sp,s.per), km=parseFloat(s.km)||0, v=velocidade(s);
    const pctKm=f.max>0? Math.round(km/f.max*100):0;

        <input type="range" min="0" max="${f.max}" step="${f.step}" value="${km}" style="--pct:${pctKm}%"
          aria-label="Distância por ${porLabel(s.per)}, em quilómetros"
          oninput="slideSport('${m.id}',${i},'km',this)" onchange="save()">
      </div>
      <div class="splabel" style="margin:2px 0 0"><span>Esforço em função da velocidade ${dica('curvaMet')}</span></div>
      ${curvaMetSvg(sp,s,i)}
      <div>
        <div class="splabel"><span>Velocidade</span>
          <output id="sp${i}-v">${textoVelocidade(sp,v)}</output></div>
        <input type="range" min="${sp.dist.vmin}" max="${sp.dist.vmax}" step="${sp.dist.vStep}" value="${v}" style="--pct:${pctV}%"
          aria-label="Velocidade média em quilómetros por hora"
          oninput="slideSport('${m.id}',${i},'v',this)" onchange="save()">
      </div>
    </div>
    <div class="spfoot">${periodo}
      <span class="pill nivel" id="sp${i}-nivel">${NIVEIS[nivelPorMet(sp,met)][1]}</span>
      <span class="sub" id="sp${i}-t">${hmm(horasPeriodo(s))} por ${porLabel(s.per)}</span>
      <span class="spgasto">${gasto}</span></div>`;
  } else {
    miolo=`<div class="splabel" style="margin:2px 0 0"><span>Intensidade ${dica('intensidade')}</span></div>
      ${escalaMet3(sp,s)}<div class="spfoot">
      <select onchange="updSport('${m.id}',${i},'i',this.value)" aria-label="Intensidade">${NIVEIS.map(([k],ni)=>
        `<option value="${k}" ${nivelIndice(s.i)===ni?'selected':''}>${rotuloNivel(sp,ni)}</option>`).join('')}</select>
      <span class="sphoras"><input type="number" min="0" step="0.5" inputmode="decimal" value="${s.h}"
        aria-label="Horas" onchange="updSport('${m.id}',${i},'h',this.value)"> <span class="sub">h</span></span>
      ${periodo}<span class="spgasto">${gasto}</span></div>`;
  }
  return `<div class="spline">
    <div class="sptop">
      <select onchange="updSport('${m.id}',${i},'s',this.value)" aria-label="Desporto">${opcoesDesporto(s.s)}</select>
      <button class="btn danger small" onclick="delSport('${m.id}',${i})" aria-label="Remover desporto">✕</button>
    </div>${miolo}</div>`;
}
/* Recomendação e limites de esforço da fase, com o que está registado a ser
   comparado com o que é recomendado — e a lista concreta do que evitar. */
function cartaoEsforco(m){
  const L=limitesEsforco(m), min=Math.round(minutosSemana(m));
  const registados=(m.desportos||[]).map(s=>s.s);
  const conflitos=registados.filter(id=>L.evitar.indexOf(id)>=0)
    .map(id=>SPORT[id]&&SPORT[id].nome).filter(Boolean);
  const acimaNivel=L.nivelMax? (m.desportos||[]).filter(s=>{
    const sp=SPORT[s.s]; if(!sp) return false;
    const idx=sp.dist? nivelPorMet(sp,metDe(s)) : nivelIndice(s.i);
    return idx>NIVEIS.findIndex(n=>n[0]===L.nivelMax);
  }).map(s=>SPORT[s.s].nome) : [];
  const alvoSemana = L.fase==='adulto'&&!gravida(m)? 150 : gravida(m)? 150 : 420;
  const pctA=Math.min(100, alvoSemana? min/alvoSemana*100 : 0);
  return `<div class="card" style="margin-top:16px;border-left:4px solid var(--accent)">
    <h3>Esforço recomendado — ${nomeFase(m)} ${dica('esforco')}</h3>
    <p class="sub" style="margin-top:6px">${L.recomendacao}</p>
    <div style="margin:12px 0 6px">
      <div class="splabel"><span>Registado por semana</span><output style="min-width:12ch;text-align:right">${hmm(min/60)}</output></div>
      <div class="mbar" style="height:10px"><div style="width:${pctA.toFixed(1)}%;background:var(--accent)"></div></div>
      <p class="sub" style="margin-top:4px">Referência para esta fase: cerca de ${hmm(alvoSemana/60)} por semana de atividade moderada${L.fase!=='adulto'&&!gravida(m)?' a vigorosa':''}.</p>
    </div>
    ${L.horasMax&&min/60>L.horasMax? `<div class="msg warn-msg" style="margin:8px 0 0">O desporto organizado ultrapassa as ${L.horasMax} h por semana que se costumam apontar como teto nesta idade. Em crescimento, o excesso de volume está associado a lesões por sobreuso.</div>`:''}
    ${gravida(m)&&min>300? `<div class="msg warn-msg" style="margin:8px 0 0">Mais de 300 minutos por semana na gravidez merece confirmação com quem te segue.</div>`:''}
    ${conflitos.length? `<div class="msg warn-msg" style="margin:8px 0 0">Modalidades registadas desaconselhadas nesta fase: <b>${conflitos.join(', ')}</b>. ${gravida(m)?'Na gravidez evitam-se desportos de contacto, com risco de queda ou de trauma abdominal.':'Nesta idade estas modalidades não são as indicadas.'}</div>`:''}
    ${acimaNivel.length? `<div class="msg warn-msg" style="margin:8px 0 0">Intensidade acima do recomendado em: <b>${acimaNivel.join(', ')}</b>. O limite sugerido nesta fase é «${L.nivelMax}».</div>`:''}
    ${L.notas.length? `<ul class="sub" style="margin:10px 0 0;padding-left:18px">${L.notas.map(n=>`<li style="margin-bottom:4px">${n}</li>`).join('')}</ul>`:''}
    ${idadeAnos(m)<19? `<p class="sub" style="margin-top:10px">Nota de cálculo: as calorias por METs foram medidas em adultos. Em crianças o custo relativo do mesmo movimento é diferente, pelo que estes valores servem de ordem de grandeza e não de medição.</p>`:''}
  </div>`;
}

        <button class="chip" onclick="go('nutricao')">Ajustar alvo na Nutrição →</button>

function textoObjetivo(m){
  const p=objetivoPct(m), delta=Math.round(Math.abs(targetKcal(m)-tdee(m)));
  const sinal=(p>0?'+':p<0?'−':'')+Math.abs(p)+'%';   /* menos tipográfico, como no resto da app */
  return sinal+' · '+(p<0? 'défice de '+delta+' kcal/dia' : p>0? 'superavit de '+delta+' kcal/dia' : 'manutenção');
}
function sincronizaObjetivo(m){ const p=objetivoPct(m);
  m.objetivo = p<=-8? 'perder' : p>=5? 'ganhar' : 'manter'; }
function slideObjetivo(mid,el){

/* Sliders C/P/F interligados: floats durante o gesto, maior-resto na pintura e
   no commit — a soma é sempre 100 e os polegares irmãos não tremem ±1. */
let macroLive=null;
function slideMacro(mid,k,el){
  const m=S.members.find(x=>x.id===mid); if(!m||m.dieta!=='personalizada') return;
  /* O estado do gesto é carimbado com o membro: um arrasto que acaba no mesmo
     valor não dispara change, e sem isto os macros desse membro contaminavam
     o gesto seguinte noutro perfil. */
  if(!macroLive || macroLive.mid!==mid){ const d=dietaDe(m); macroLive={mid,c:d.c,p:d.p,f:d.f}; }
  const v=clampNum(parseFloat(el.value)||0,0,100);
  const outros=['c','p','f'].filter(x=>x!==k);
  const resto=100-v, a=macroLive[outros[0]], b=macroLive[outros[1]];
  if(a+b<0.5){ macroLive[outros[0]]=resto/2; macroLive[outros[1]]=resto/2; }
  else { macroLive[outros[0]]=resto*a/(a+b); macroLive[outros[1]]=resto-macroLive[outros[0]]; }
  macroLive[k]=v;
  m.macros=normaliza100(macroLive);
  pintaRange(el);
  outros.forEach(x=>{ const s=document.getElementById('nu-sl-'+x);
    if(s){ s.value=m.macros[x]; pintaRange(s); } });   /* atribuir .value não dispara eventos — sem cascata */
  aoVivo('nut', atualizarNutricao);
}
function commitMacro(mid,el){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  macroLive=null; save();
