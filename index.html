/* ================= MODO COZINHA =================
   O momento em que a app está mesmo na bancada: mãos ocupadas, telemóvel
   apoiado no escorredor. Um passo por vista, em letra grande, quantidades já
   escaladas aos comensais, e o ecrã que não se apaga a meio do refogado. */
/* Os passos escritos à mão ganham sempre ao motor de derivação. Quando não os
   há, deriva-se — e diz-se que se derivou, em vez de fazer passar por receita
   de livro o que é uma sugestão a partir dos ingredientes. */
function temPassosEscritos(r){ return !!(r && PASSOS[r.id] && PASSOS[r.id].length); }
function passosDaReceita(r,n){
  if(temPassosEscritos(r)) return PASSOS[r.id].map(p=>({t:p[0], d:p[1], min:p[2]||0}));
  return passosDerivados(r,n);
}
function passosDerivados(r,n){
  /* sem passos escritos, derivam-se dos ingredientes e do género do prato */
  const ing=escalaIngredientes(r,n);
  const passos=[];
  passos.push({t:'Reunir', d:'Põe tudo à mão antes de acender o lume: '+ing.map(x=>esc(x.n)+' '+fmtQtd(x.q,x.u)).join(', ')+'.'});
  const temAlho=ing.some(x=>/alho|cebola/i.test(x.n));
  const temForno=/assad|forno|gratin|tarte|bolo/i.test(r.n);
  const temGrelha=/grelhad|brasa|bife|posta|picanha|secretos|plumas|costelet/i.test(r.n);
  const temArroz=ing.some(x=>/arroz/i.test(x.n));
  const temMassa=ing.some(x=>/massa|esparguete|talharim|penne/i.test(x.n));
  if(temForno) passos.push({t:'Aquecer o forno', d:'Liga o forno a 200 °C e deixa-o chegar lá enquanto preparas o resto.', min:15});
  if(temAlho) passos.push({t:'Refogado', d:'Alourar o alho e a cebola em azeite, em lume brando, até ficarem translúcidos.', min:6});
  if(temArroz) passos.push({t:'Arroz', d:'Junta o arroz, envolve no refogado e acrescenta o dobro do volume em água a ferver. Tapa.', min:18});
  if(temMassa) passos.push({t:'Massa', d:'Água a ferver com sal; a massa cozinha até estar al dente.', min:9});
  if(temGrelha) passos.push({t:'Grelhar', d:'Grelha bem quente. Não mexer antes de descolar sozinho; virar uma vez só.', min:8});
  if(temForno) passos.push({t:'No forno', d:'Leva ao forno já quente até corar.', min:35});
  passos.push({t:'Temperar e servir', d:'Prova, acerta o sal, e serve '+plural(n,'dose','doses')+'.'});
  return passos;
}
function abrirCozinha(rid,n,ctx){
  const r=RECIPES.find(x=>x.id===rid); if(!r) return;
  S.ui.cozinha={r:rid, n:clampNum(n||1,1,20), passo:0, feitos:[], ctx:ctx||null};
  saveMeta(); render(); pedirEcraAceso();
}
function fecharCozinha(){
  const c=S.ui.cozinha;
  S.ui.cozinha=null; largarEcraAceso(); saveMeta(); render();
  if(c && c.ctx){ /* ao sair da cozinha, a refeição fica a um toque de ser validada */
    flash('ok','Bom proveito. A refeição está pronta a confirmar no cartão «Hoje».'); }
}
function passoCozinha(n){
  const c=S.ui.cozinha; if(!c) return;
  const total=passosDaReceita(RECIPES.find(x=>x.id===c.r),c.n).length;
  c.passo=clampNum(c.passo+n,0,total-1); saveMeta(); render();
}
function toggleIngredienteCozinha(i){
  const c=S.ui.cozinha; if(!c) return;
  const j=c.feitos.indexOf(i); j>=0? c.feitos.splice(j,1) : c.feitos.push(i);
  saveMeta(); render();
}
function descontarDespensa(){
  const c=S.ui.cozinha; if(!c) return;
  const r=RECIPES.find(x=>x.id===c.r); if(!r) return;
  let n=0;
  r.i.forEach(l=>{ if(S.despensa[l[0]]){ delete S.despensa[l[0]]; n++; } });
  save('despensa depois de cozinhar');
  flash('ok', n? plural(n,'ingrediente saiu da despensa','ingredientes saíram da despensa')+' — marca-os outra vez quando os repuseres.'
    : 'Nenhum destes ingredientes estava marcado na despensa.');
  render();
}
function cozinhaHtml(){
  const c=S.ui.cozinha; const r=RECIPES.find(x=>x.id===c.r); if(!r) return '';
  const passos=passosDaReceita(r,c.n), p=passos[c.passo]||passos[0];
  const ing=escalaIngredientes(r,c.n);
  const custo=custoReceita(r,c.n);
  return `<div class="cozinha" role="dialog" aria-modal="true" aria-label="Modo cozinha">
    <div class="cozinha-topo">
      <button class="btn ghost small" onclick="fecharCozinha()">← Sair</button>
      <div style="flex:1;min-width:0"><b>${esc(r.n)}</b> ${dica('cozinha')}
        <span class="sub" style="display:block">${plural(c.n,'dose','doses')} · ${r.k*c.n} kcal${custo.com? ' · ~'+textoCusto(custo):''}</span></div>
      <span class="pill">${c.passo+1}/${passos.length}</span>
    </div>
    <div class="cozinha-corpo">
      ${c.passo===0? `<ul class="coz-ing">${ing.map((x,i)=>`<li class="${c.feitos.indexOf(i)>=0?'done':''}">
        <label><input type="checkbox" ${c.feitos.indexOf(i)>=0?'checked':''} onchange="toggleIngredienteCozinha(${i})">
        <span>${esc(x.n)} <b>${fmtQtd(x.q,x.u)}</b></span></label></li>`).join('')}</ul>`
      : `<h2 class="coz-t">${esc(p.t)}</h2><p class="coz-d">${esc(p.d)}</p>
         ${p.min? `<button class="btn" style="margin-top:16px" onclick="novoTemporizador('${esc(p.t)}',${p.min})">⏲ ${p.min} min — pôr a contar</button>`:''}`}
    </div>
    <div class="cozinha-fundo">
      <button class="btn ghost ${c.passo===0?'inativo':''}" onclick="passoCozinha(-1)" ${c.passo===0?'disabled':''}>← Anterior</button>
      <span class="sub" style="flex:1;text-align:center">${c.passo===0? 'Ingredientes' : esc(p.t)}</span>
      ${c.passo>=passos.length-1
        ? `<button class="btn" onclick="descontarDespensa();fecharCozinha()">Terminei</button>`
        : `<button class="btn" onclick="passoCozinha(1)">Seguinte →</button>`}
    </div>
  </div>`;
}

/* ================= TEMPORIZADORES DE TACHO =================
   Um jantar são três tachos ao mesmo tempo. Cada temporizador guarda o
   instante-alvo, não uma contagem: sobrevive a navegar, a recarregar e a
   fechar a app, porque ao voltar recalcula-se pelo relógio. Sem servidor não
   há push — o alarme toca com a app aberta, e isso diz-se em vez de se fingir. */
let temporizadores=[], tickTimer=null;
function novoTemporizador(nome,min){
  const t={id:uid(), n:String(nome||'Tacho').slice(0,24), fim:Date.now()+Math.max(1,min)*60000, tocou:false};
  temporizadores.push(t);
  try{ localStorage.setItem('ff-timers', JSON.stringify(temporizadores)); }catch(e){}
  arrancaTick(); pintaTemporizadores();
  toast(t.n+': '+min+' min a contar');
}
function lerTemporizadores(){
  try{ const a=JSON.parse(localStorage.getItem('ff-timers')); if(Array.isArray(a)) temporizadores=a.filter(x=>x&&x.fim>Date.now()-3600000); }catch(e){}
  if(temporizadores.length) arrancaTick();
  pintaTemporizadores();
}
function pararTemporizador(id){
  temporizadores=temporizadores.filter(t=>t.id!==id);
  try{ localStorage.setItem('ff-timers', JSON.stringify(temporizadores)); }catch(e){}
  pintaTemporizadores();
}
function arrancaTick(){ if(tickTimer) return; tickTimer=setInterval(()=>{
  const agora=Date.now();
  temporizadores.forEach(t=>{ if(!t.tocou && t.fim<=agora){ t.tocou=true; alarme(); toast('⏲ '+t.n+' — está pronto'); } });
  if(!temporizadores.length){ clearInterval(tickTimer); tickTimer=null; }
  pintaTemporizadores();
},1000); }
/* Alarme gerado, sem ficheiros externos: o CSP não deixa e o offline agradece. */
function alarme(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    const ctx=new Ctx();
    [0,0.28,0.56].forEach(t0=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(0.22,ctx.currentTime+t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t0+0.2);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+0.24);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 1500);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
}
function pintaTemporizadores(){
  let cx=document.getElementById('timers');
  if(!temporizadores.length){ if(cx) cx.remove(); return; }
  if(!cx){ cx=document.createElement('div'); cx.id='timers'; cx.className='timers'; document.body.appendChild(cx); }
  const agora=Date.now();
  cx.innerHTML=temporizadores.map(t=>{
    const falta=Math.max(0,Math.round((t.fim-agora)/1000));
    const mm=Math.floor(falta/60), ss=falta%60;
    const total=Math.max(1,(t.fim-(t.inicio||t.fim-1))/1000);
    return `<button class="timer ${t.tocou?'pronto':''}" onclick="pararTemporizador('${t.id}')"
      aria-label="${esc(t.n)}: ${t.tocou?'pronto':mm+' minutos e '+ss+' segundos'}. Tocar para parar.">
      <b>${t.tocou? 'pronto' : mm+':'+String(ss).padStart(2,'0')}</b><span>${esc(t.n)}</span></button>`;
  }).join('');
}

/* ================= DOMINGO DE LOTE =================
   Famílias com dois empregos cozinham ao domingo. A app agrupa as preparações-
   base que se repetem na semana e propõe uma sessão única — sem adivinhar:
   as bases são uma lista curta e explícita, não uma heurística sobre nomes. */
const BASES_LOTE=[
  {k:'arroz',   n:'Arroz cozido',        re:/^arroz/i,                      un:'g'},
  {k:'grao',    n:'Grão cozido',         re:/gr[aã]o(-de-bico)?/i,          un:'g'},
  {k:'feijao',  n:'Feijão cozido',       re:/^feij[aã]o (?!verde)/i,        un:'g'},
  {k:'lentilha',n:'Lentilhas cozidas',   re:/lentilha/i,                    un:'g'},
  {k:'batata',  n:'Batatas cozidas',     re:/^batata(?!-doce)/i,            un:'g'},
  {k:'massa',   n:'Massa cozida',        re:/^(massa|esparguete|penne|talharim|macarr)/i, un:'g'},
  {k:'refogado',n:'Refogado base',       re:/^cebola$/i,                    un:'g'},
  {k:'legumes', n:'Legumes assados',     re:/^(cenoura|abóbora|curgete|beringela|pimento)/i, un:'g'},
  {k:'frango',  n:'Frango cozido/assado',re:/^(peito de frango|frango)/i,   un:'g'},
];
function planoDeLote(){
  const dates=weekDates(S.week), w=S.plans[S.week]||{};
  const bases={};
  for(let di=0;di<7;di++) MEALK.forEach(mk=>{
    const meal=(w[di]||{})[mk]; if(!meal||!meal.r) return;
    const rec=RECIPES.find(x=>x.id===meal.r); if(!rec) return;
    const n=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di])).length + nConvidados(meal);
    if(!n) return;
    const acs=acompsDe(meal), q=acs.length?1/acs.length:0;
    const junta=(lista,fator)=>lista.forEach(([nome,quant,un])=>{
      const b=BASES_LOTE.find(x=>x.re.test(nome)); if(!b) return;
      if(!bases[b.k]) bases[b.k]={base:b, g:0, dias:[], receitas:[]};
      bases[b.k].g+=quant*n*fator;
      if(bases[b.k].dias.indexOf(di)<0) bases[b.k].dias.push(di);
      if(bases[b.k].receitas.indexOf(rec.n)<0) bases[b.k].receitas.push(rec.n);
    });
    junta(rec.i,1); acs.forEach(x=>junta(x.i,q));
  });
  /* só vale a pena cozinhar em lote o que serve dois dias ou mais */
  return Object.values(bases).filter(b=>b.dias.length>=2)
    .sort((a,b)=>b.dias.length-a.dias.length || b.g-a.g);
}

/* ================= A CAPA DO CADERNO =================
   Nome, lema e um monograma desenhado das iniciais: a app deixa de ser «uma
   app» e passa a ser o caderno desta família. Tudo local, tudo opcional. */
function nomeDaCasa(){
  const c=S.casa||{};
  if(c.nome) return c.nome;
  /* sem nome escrito, tenta-se o apelido comum a mais de um perfil */
  const apelidos={};
  S.members.forEach(m=>{ const p=String(m.nome||'').trim().split(/\s+/);
    if(p.length>1){ const a=p[p.length-1]; apelidos[a]=(apelidos[a]||0)+1; } });
  const top=Object.entries(apelidos).sort((a,b)=>b[1]-a[1])[0];
  return (top&&top[1]>1)? top[0] : '';
}
function iniciaisCasa(){
  const n=nomeDaCasa();
  if(n) return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return S.members.slice(0,2).map(m=>(m.nome||'?')[0]).join('').toUpperCase() || 'FF';
}
function monogramaSvg(tam){
  const t=tam||64, ini=iniciaisCasa();
  return `<svg viewBox="0 0 64 64" width="${t}" height="${t}" fill="none" stroke="currentColor"
      stroke-width="1.8" role="img" aria-label="Monograma da casa: ${esc(ini)}">
    <circle cx="32" cy="32" r="28"/><circle cx="32" cy="32" r="23" opacity=".45"/>
    <text x="32" y="32" text-anchor="middle" dominant-baseline="central" stroke="none" fill="currentColor"
      style="font-family:var(--fonte-display);font-weight:700;font-size:22px;letter-spacing:.02em">${esc(ini)}</text>
  </svg>`;
}
function setCasa(campo,v){
  if(!S.casa||typeof S.casa!=='object') S.casa={nome:'',lema:''};
  S.casa[campo]=String(v||'').slice(campo==='nome'?0:0, campo==='nome'?40:90);
  save('capa do caderno'); render();
}
function primeiroRegisto(){
  const datas=[];
  (S.regAtiv||[]).forEach(r=>datas.push(r.d));
  (S.regRef||[]).forEach(r=>datas.push(r.d));
  Object.keys(S.medicoes||{}).forEach(k=>medicoesDe(k).forEach(x=>datas.push(x.d)));
  Object.keys(S.plans||{}).forEach(wk=>{ if(dataValida(wk)) datas.push(wk); });
  if(S.meta.desdeRegisto) datas.push(S.meta.desdeRegisto);
  datas.sort();
  return datas[0]||null;
}
function cartaoCapa(){
  if(!S.members.length) return '';
  const nome=nomeDaCasa(), lema=(S.casa||{}).lema, ini=primeiroRegisto();
  const aberto=S.ui.capaAberta;
  return `<section class="card card--capa capa" id="capa" style="margin-bottom:16px">
    <div class="row" style="gap:16px;align-items:center">
      <span style="color:var(--sazonal,var(--accent));flex:none">${monogramaSvg(64)}</span>
      <div style="flex:1;min-width:0">
        <h2 style="margin:0">${nome? esc(nome) : 'O caderno da família'}</h2>
        ${lema? `<p style="font-family:var(--fonte-display);font-style:italic;font-size:16px;margin-top:2px">«${esc(lema)}»</p>`:''}
        <span class="sub" style="display:block">${ini? 'caderno iniciado em '+fmtLongo(ini) : 'caderno acabado de abrir'}
          · ${plural(S.members.length,'pessoa','pessoas')}</span>
        <div class="row" style="margin-top:8px">${S.members.map(m=>avatar(m,26)).join('')}</div>
      </div>
      <button class="chip" style="flex:none" onclick="toggleCapa()" aria-expanded="${!!aberto}">${aberto?'Fechar':'✎ Personalizar'}</button>
    </div>
    ${aberto? `<div class="frow" style="margin-top:12px">
      <div><label class="lbl">Nome da casa</label>
        <input type="text" maxlength="40" value="${esc(nome)}" placeholder="Os Silva"
          aria-label="Nome da casa" onchange="setCasa('nome',this.value)"></div>
      <div><label class="lbl">Lema</label>
        <input type="text" maxlength="90" value="${esc(lema||'')}" placeholder="Devagar se vai ao longe"
          aria-label="Lema da casa" onchange="setCasa('lema',this.value)"></div>
    </div>
    <p class="sub" style="margin-top:6px">O monograma sai das iniciais e repete-se no plano impresso. Fica tudo neste dispositivo, como o resto.</p>`:''}
    ${ornamentoSazonal()}
  </section>`;
}
function toggleCapa(){ S.ui.capaAberta=!S.ui.capaAberta; saveMeta(); render(); }

/* ================= DIAS DE FESTA =================
   As datas de nascimento já estão nos perfis; as outras datas da casa
   escrevem-se à mão. Um aniversário deixa de ser uma falha ao plano e passa a
   fazer parte dele. */
function festasDoDia(d){
  const md=d.slice(5), out=[];
  S.members.forEach(m=>{ if(!m.nasc) return;
    if(m.nasc.slice(5)===md) out.push({tipo:'anos', m, anos:anosDesde(m.nasc,d)}); });
  (S.festas||[]).forEach(f=>{ if(f.md===md) out.push({tipo:'festa', n:f.n}); });
  return out;
}
function addFesta(){
  const el=document.getElementById('festa-data'), nl=document.getElementById('festa-nome');
  if(!el||!nl) return;
  const v=el.value, n=(nl.value||'').trim();
  if(!dataValida(v)||!n) return flash('bad','Escolhe a data e escreve o nome da ocasião.');
  if(!Array.isArray(S.festas)) S.festas=[];
  if(S.festas.length>=40) return flash('warn','Já há muitas datas guardadas.');
  S.festas.push({id:uid(), md:v.slice(5), n:n.slice(0,40)});
  save('data da casa'); render();
}
function delFesta(id){ S.festas=(S.festas||[]).filter(f=>f.id!==id); save('data da casa'); render(); }
/* Receitas que esta pessoa mais confirmou no último ano: é o que se cozinha
   a quem faz anos. */
function pratosFavoritos(mid,n){
  const ini=addDias(hojeISO(),-365), conta={};
  regRefDe(mid).filter(r=>r.estado==='feita'&&r.d>=ini).forEach(r=>{ conta[r.r]=(conta[r.r]||0)+1; });
  return Object.entries(conta).sort((a,b)=>b[1]-a[1]).slice(0,n||3)
    .map(([id,c])=>({r:RECIPES.find(x=>x.id===id), n:c})).filter(x=>x.r);
}
function blocoFestas(){
  const hoje=festasDoDia(hojeISO());
  const proximos=[];
  for(let k=1;k<=7;k++){ const d=addDias(hojeISO(),k);
    festasDoDia(d).forEach(f=>proximos.push({d, f})); }
  if(!hoje.length && !proximos.length) return '';
  return `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
    ${hoje.map(f=>{
      if(f.tipo==='festa') return `<p style="font-family:var(--fonte-display);font-size:17px">🎈 Hoje é ${esc(f.n)}.</p>`;
      const favs=pratosFavoritos(f.m.id,2);
      return `<div class="row" style="gap:10px;align-items:center">
        ${avatar(f.m,34)}
        <div style="flex:1;min-width:0">
          <p style="font-family:var(--fonte-display);font-size:17px;margin:0">🎂 Hoje ${esc(f.m.nome.split(' ')[0])} faz ${plural(f.anos,'ano','anos')}.</p>
          ${favs.length? `<span class="sub">o que mais comeu este ano: ${favs.map(x=>esc(x.r.n)).join(', ')}</span>`:''}
        </div>
        ${isCheat(f.m.id,hojeISO())? '<span class="pill" style="background:var(--party-soft);color:var(--party)">dia livre ✓</span>'
          : `<button class="chip" onclick="toggleCheat('${f.m.id}','${hojeISO()}')">🎉 Marcar dia livre</button>`}
      </div>`;}).join('')}
    ${proximos.length? `<p class="sub" style="margin-top:6px">${proximos.slice(0,3).map(x=>
      (x.f.tipo==='anos'? esc(x.f.m.nome.split(' ')[0])+' faz anos' : esc(x.f.n))+' '+rotuloData(x.d)).join(' · ')}</p>`:''}
  </div>`;
}

/* ================= FECHO DA SEMANA =================
   Um ritual curto ao domingo: resolver o que ficou por confirmar, olhar a
   semana, escolher o jantar especial, preencher a próxima e escrever uma
   frase no caderno. Qualquer adulto o pode fazer, e fica assinado. */
function fechoDaSemana(){ return S.ui.fecho&&typeof S.ui.fecho==='object'? S.ui.fecho : null; }
function abrirFecho(){
  S.ui.fecho={passo:0, autor:(curM()||S.members[0]||{}).id, especial:null, frase:''};
  saveMeta(); render();
}
function fecharFecho(){ S.ui.fecho=null; saveMeta(); render(); }
function passoFecho(n){
  const f=fechoDaSemana(); if(!f) return;
  f.passo=clampNum(f.passo+n,0,4); saveMeta(); render();
}
function setFechoCampo(c,v){ const f=fechoDaSemana(); if(!f) return; f[c]=v; saveMeta(); }
function concluirFecho(){
  const f=fechoDaSemana(); if(!f) return;
  if(!Array.isArray(S.diario)) S.diario=[];
  const frase=String(f.frase||'').trim().slice(0,240);
  if(frase) S.diario.push({wk:mondayISO(hojeISO()), autor:f.autor, t:frase, d:hojeISO()});
  if(f.especial){
    /* o jantar especial vai para o sábado da semana que vem */
    const wk=mondayISO(addDias(hojeISO(),7)), guarda=S.week;
    S.week=wk; const meal=planMeal(5,'j'); meal.r=f.especial; meal.m=S.members.map(m=>m.id); S.week=guarda;
  }
  S.ui.fecho=null;
  save('fecho da semana');
  flash('ok','Semana fechada'+(frase?' e escrita no caderno':'')+'. Boa semana.');
  render();
}
function ehDomingo(){ return new Date().getDay()===0; }
function cartaoFecho(){
  if(!S.members.length) return '';
  const f=fechoDaSemana();
  if(!f){
    if(!ehDomingo()) return '';
    const jaFez=(S.diario||[]).some(x=>x.wk===mondayISO(hojeISO()));
    if(jaFez) return '';
    return `<div class="card card--capa" id="fecho" style="margin-bottom:16px">
      <span class="lbl">Domingo</span>
      <h2 style="margin-top:2px">Fechar a semana ${dica('fecho')}</h2>
      <p class="sub" style="margin-top:4px">Cinco passos curtos para pôr a casa em ordem: confirmar o que ficou por confirmar, olhar a semana, escolher o jantar especial, preencher a próxima e escrever uma frase no caderno.</p>
      <button class="btn" style="margin-top:12px" onclick="abrirFecho()">Começar</button>
    </div>`;
  }
  const autor=S.members.find(m=>m.id===f.autor)||S.members[0];
  const passos=['Confirmar o que ficou','A semana em números','O jantar especial','A semana que vem','Uma frase no caderno'];
  const pend=S.members.reduce((t,m)=>t+pendentesAtiv(m).length+pendentesRef(m).length,0);
  const favs=S.members.flatMap(m=>pratosFavoritos(m.id,2)).map(x=>x.r);
  const casa=RECIPES.filter(r=>r.u).concat(favs).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8);
  return `<div class="card card--capa" id="fecho" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between">
      <div><span class="lbl">Fecho da semana · ${f.passo+1} de 5</span>
        <h2 style="margin-top:2px">${esc(passos[f.passo])}</h2></div>
      <div class="row" style="flex:none">${avatar(autor,26)}
        <button class="chip" onclick="fecharFecho()">Sair</button></div>
    </div>
    <div class="mbar" style="height:6px;margin-top:8px"><div style="width:${((f.passo+1)/5*100).toFixed(0)}%;background:var(--accent)"></div></div>
    <div style="margin-top:12px">
      ${f.passo===0? (pend
        ? `<p class="sub">${plural(pend,'coisa ficou por confirmar','coisas ficaram por confirmar')} esta semana. Vale a pena resolvê-las antes de olhar para os números — senão a semana parece pior do que foi.</p>
           <div class="row" style="margin-top:10px">
             <button class="btn small" onclick="go('atividade')">Ir aos treinos</button>
             <button class="btn small" onclick="go('nutricao')">Ir às refeições</button></div>`
        : `<p class="sub">Nada por confirmar — a semana está fechada nos registos. ✓</p>`)
      : f.passo===1? `<p class="sub">${(function(){
          const linhas=S.members.map(m=>{ const r=resumoRef(m,7), a=resumoAtiv(m,7);
            return nomeCurto(m)+': '+(r.dias? r.media+' kcal/dia em '+plural(r.dias,'dia','dias') : 'sem refeições registadas')
              +(a.sessoes? ' · '+plural(a.sessoes,'treino','treinos') : '');
          });
          return linhas.join('<br>'); })()}</p>
         <div class="row" style="margin-top:10px"><button class="btn small" onclick="abrirPesagens()">⚖ Registar pesagens</button></div>`
      : f.passo===2? `<p class="sub">Um jantar que apeteça, para sábado da semana que vem. Sai das receitas da casa e do que mais se comeu.</p>
         <div class="row" style="margin-top:10px">${casa.map(r=>`<button class="chip ${f.especial===r.id?'on':''}"
           onclick="setFechoCampo('especial','${r.id}');render()">${esc(r.n)}</button>`).join('')||'<span class="sub">Ainda sem histórico para sugerir.</span>'}</div>`
      : f.passo===3? `<p class="sub">Preencher a semana que vem com sugestões que servem toda a gente — dietas, alergias e teto de calorias já contam.</p>
         <div class="row" style="margin-top:10px">
           <button class="btn small" onclick="shiftWeek(1);autoFill()">✨ Preencher a semana seguinte</button>
           <button class="btn ghost small" onclick="go('plano')">Ver o plano</button></div>`
      : `<p class="sub">Como correu, em uma frase. Fica no caderno, com o teu avatar e a data.</p>
         <textarea maxlength="240" style="margin-top:8px" placeholder="Correu bem: a Rita provou espinafres."
           aria-label="Frase do caderno" onchange="setFechoCampo('frase',this.value)">${esc(f.frase||'')}</textarea>
         <div class="row" style="margin-top:8px">${S.members.map(m=>`<button class="chip ${f.autor===m.id?'on':''}"
           onclick="setFechoCampo('autor','${m.id}');render()">${avatar(m,20)} ${esc(m.nome.split(' ')[0])}</button>`).join('')}</div>`}
    </div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="btn ghost small ${f.passo===0?'inativo':''}" onclick="passoFecho(-1)" ${f.passo===0?'disabled':''}>← Anterior</button>
      ${f.passo>=4? `<button class="btn" onclick="concluirFecho()">Fechar a semana</button>`
        : `<button class="btn" onclick="passoFecho(1)">Seguinte →</button>`}
    </div>
  </div>`;
}
function cartaoDiario(){
  const d=(S.diario||[]).slice().reverse().slice(0,8);
  if(!d.length) return '';
  return `<div class="card" data-col="fam-diario">
    <h3>O caderno da semana</h3>
    <div class="fita" style="margin-top:8px">${d.map(x=>{
      const m=S.members.find(y=>y.id===x.autor);
      return `<div class="fita-dia">
        <div class="fita-data">${fmtLongo(x.d)} ${m? '<span class="sub">· '+esc(m.nome.split(' ')[0])+'</span>':''}</div>
        <p style="font-family:var(--fonte-display);font-size:15.5px;margin-top:2px">«${esc(x.t)}»</p>
      </div>`;}).join('')}</div>
  </div>`;
}

/* ================= PRIMEIROS PASSOS =================
   Trinta e um passos de visita guiada é peso a mais para uma família ao
   jantar. Cinco marcos, com o visto verificado pelos próprios dados. */
function marcosIniciais(){
  const m=S.members[0];
  return [
    {k:'perfis', t:'Criar os perfis da casa', ok:S.members.length>0, fn:"go('familia')",
     d:'Cada pessoa com a sua fase da vida — as fórmulas mudam com ela.'},
    {k:'alergias', t:'Marcar alergias e exclusões', ok:S.members.some(x=>(x.restricoes||[]).length), fn:"go('familia')",
     d:'As catorze categorias de declaração obrigatória na UE. Uma receita com um alergénio marcado deixa de ser sugerida.'},
    {k:'objetivo', t:'Escolher um objetivo', ok:(S.objetivos||[]).length>0 || S.members.some(x=>objetivoPct(x)!==0), fn:"go('objetivos')",
     d:'Quantos quilos e em quanto tempo; a app reparte o esforço entre a mesa e o movimento.'},
    {k:'plano', t:'Planear a semana', ok:Object.keys(S.plans||{}).length>0, fn:"go('plano')",
     d:'Quatro refeições por dia, com quem come cada uma. A lista de compras sai daqui.'},
    {k:'despensa', t:'Encher a despensa', ok:Object.keys(S.despensa||{}).length>0, fn:"go('mercearia')",
     d:'O que já tens em casa deixa de aparecer no que falta comprar.'},
  ];
}
function cartaoPrimeirosPassos(){
  if(S.ui.passosFeitos) return '';
  const m=marcosIniciais(), feitos=m.filter(x=>x.ok).length;
  if(feitos===m.length){ return `<div class="card" style="margin-bottom:16px;border-left:4px solid var(--ok)">
    <div class="row" style="justify-content:space-between">
      <div><b>✓ Primeiros passos completos</b>
        <span class="sub" style="display:block">A casa está montada. A visita guiada fica sempre em Dados, se quiseres ver o resto.</span></div>
      <button class="chip" onclick="arrumarPrimeirosPassos()">Arrumar</button></div></div>`; }
  return `<div class="card card--capa" id="primeiros" style="margin-bottom:16px" data-col="fam-primeiros">
    <span class="lbl">Primeiros passos · ${feitos} de ${m.length}</span>
    <h2 style="margin-top:2px">Montar a casa</h2>

  </div>`;
}

function indiceGlobal(){

   ['Registar atividade','atividade'],['Macros e dieta','nutricao'],['Suplementos','nutricao'],
   ['Registar refeição','nutricao'],['Descobertas','nutricao'],['Passaporte de sabores','nutricao'],
   ['Objetivos','objetivos'],['Plano de refeições','plano'],['Cheat days','plano'],

   .forEach(([t,tab])=>ix.push({t, o:'Onde fica', fn:"go('"+tab+"')"}));
  return ix;
}
let _ixGlobal=null;
function pesquisaGlobal(q){
  const s=semAcentos(q||'').trim().toLowerCase();
  if(s.length<2) return [];
  /* Cada palavra procura por si, por qualquer ordem: «esparguete requeijão»
     tem de encontrar «Esparguete com requeijão…» — quem pesquisa não sabe
     as preposições do nome, nem tem de saber. */
  const termos=s.split(/\s+/).filter(Boolean);
  if(!_ixGlobal) _ixGlobal=indiceGlobal();
  const out=[];
  for(const x of _ixGlobal){
    const n=semAcentos(x.t).toLowerCase();
    let pos=null;
    for(const t of termos){ const i=n.indexOf(t); if(i<0){ pos=null; break; } if(pos===null) pos=i; }
    if(pos===null) continue;
    out.push({x, p: pos===0? 0 : 1});
    if(out.length>400) break;
  }
  return out.sort((a,b)=>a.p-b.p || a.x.t.length-b.x.t.length).slice(0,12).map(o=>o.x);
}

/* ================= DESCOBERTAS =================
   Meses de registo transformados em duas ou três frases úteis por semana. Cada
   detetor tem um mínimo de amostra e só fala se o passar; os números vão à
   vista e cada sinal traz o gesto para agir. Sem sinais, diz-se que não há —
   um horóscopo estatístico seria pior do que o silêncio. */
const MIN_SEMANAS=4, MIN_OCORRENCIAS=6;
function janelaRegistos(mid,dias){
  const h=hojeISO(), ini=addDias(h,-(dias||56));
  return {ini, h,
    ref:regRefDe(mid).filter(r=>r.d>=ini),
    ativ:regAtivDe(mid).filter(r=>r.d>=ini)};
}
function descobertas(m){
  if(!m) return [];
  const j=janelaRegistos(m.id,56), out=[];
  const semanas=new Set(j.ref.concat(j.ativ).map(r=>mondayISO(r.d))).size;
  if(semanas<MIN_SEMANAS) return [{tipo:'poucos', semanas, faltam:MIN_SEMANAS-semanas}];
  /* 1. a refeição planeada que raramente se cumpre */
  const porDiaRef={};
  j.ref.forEach(r=>{ const k=diaSemana(r.d)+'|'+r.mk;
    if(!porDiaRef[k]) porDiaRef[k]={n:0, feitas:0};
    porDiaRef[k].n++; if(r.estado==='feita') porDiaRef[k].feitas++; });
  Object.keys(porDiaRef).forEach(k=>{
    const x=porDiaRef[k]; if(x.n<MIN_OCORRENCIAS) return;
    const pct=x.feitas/x.n;
    if(pct>0.5) return;
    const [d,mk]=k.split('|');
    out.push({tipo:'refFalha', peso:1-pct, dia:+d, mk,
      texto:'O '+nomeRefeicao(mk).toLowerCase()+' de '+NOME_DIAS[+d]+' cumpre-se '+x.feitas+' vezes em '+x.n+'.',
      accao:'Rever a '+NOME_DIAS[+d]+' no plano', fn:"go('plano')"});
  });
  /* 2. o dia da semana com mais treinos por fazer */
  const porDiaAtiv={};
  j.ativ.forEach(r=>{ const d=diaSemana(r.d);
    if(!porDiaAtiv[d]) porDiaAtiv[d]={n:0, feitos:0};
    porDiaAtiv[d].n++; if(r.estado==='feita') porDiaAtiv[d].feitos++; });
  Object.keys(porDiaAtiv).forEach(d=>{
    const x=porDiaAtiv[d]; if(x.n<MIN_OCORRENCIAS) return;
    const pct=x.feitos/x.n; if(pct>0.5) return;
    out.push({tipo:'ativFalha', peso:1-pct, dia:+d,
      texto:'Os treinos de '+NOME_DIAS[+d]+' fazem-se '+x.feitos+' vezes em '+x.n+'.',
      accao:'Mudar os dias no plano', fn:"go('atividade')"});
  });
  /* 3. o prato que domina */
  const porReceita={};
  j.ref.filter(r=>r.estado==='feita').forEach(r=>{ porReceita[r.r]=(porReceita[r.r]||0)+1; });
  const totalRef=j.ref.filter(r=>r.estado==='feita').length;
  if(totalRef>=12){
    const top=Object.entries(porReceita).sort((a,b)=>b[1]-a[1])[0];
    if(top && top[1]/totalRef>=0.25){
      const rec=RECIPES.find(x=>x.id===top[0]);
      out.push({tipo:'monotonia', peso:top[1]/totalRef,
        texto:(rec?rec.n:'Um prato')+' foi '+top[1]+' das '+totalRef+' refeições registadas.',
        accao:'Ver sugestões novas', fn:"go('plano')"});
    }
  }
  /* 4. a hora do dia em que o alvo se perde */
  const dias={};
  j.ref.filter(r=>r.estado==='feita').forEach(r=>{ dias[r.d]=(dias[r.d]||0)+kcalRegRef(r); });
  const chaves=Object.keys(dias);
  if(chaves.length>=14){
    const acima=chaves.filter(d=>dias[d]>alvoDoDia(m,d)*1.15).length;
    if(acima/chaves.length>=0.4)
      out.push({tipo:'acima', peso:acima/chaves.length,
        texto:'Em '+acima+' dos '+chaves.length+' dias com registo comeu-se mais de 15% acima do alvo.',
        accao:'Rever o alvo na Nutrição', fn:"go('nutricao')"});
  }
  /* 5. cumprir mais está a mexer no peso? — só como associação */
  const cmp=comparaSemanas(m);
  if(cmp) out.push({tipo:'compara', peso:0.4, texto:cmp.texto, accao:'Ver o histórico', fn:"abrirHistRef('"+m.id+"')", nota:cmp.nota});
  return out.sort((a,b)=>b.peso-a.peso).slice(0,4);
}
/* Semanas lado a lado: divide as últimas semanas pela mediana de aderência e
   compara. É uma associação, não uma causa — e isso vai impresso no cartão. */
function comparaSemanas(m){
  const h=hojeISO(), sem=[];
  for(let k=1;k<=10;k++){
    const wk=mondayISO(addDias(h,-7*k)), dates=weekDates(wk);
    const ref=regRefDe(m.id).filter(r=>dates.indexOf(r.d)>=0);
    const ativ=regAtivDe(m.id).filter(r=>dates.indexOf(r.d)>=0);
    if(ref.length+ativ.length<4) continue;
    const feitas=ref.filter(r=>r.estado==='feita').length+ativ.filter(r=>r.estado==='feita').length;
    const ader=feitas/(ref.length+ativ.length);
    const pesos=medicoesDe(m.id).filter(x=>dates.indexOf(x.d)>=0);
    sem.push({wk, ader, peso: pesos.length? pesos[pesos.length-1].p : null,
      kcal: ref.filter(r=>r.estado==='feita').reduce((t,r)=>t+kcalRegRef(r),0)});
  }
  if(sem.length<6) return null;
  const ords=sem.map(x=>x.ader).sort((a,b)=>a-b);
  const mediana=ords[Math.floor(ords.length/2)];
  const altas=sem.filter(x=>x.ader>=mediana), baixas=sem.filter(x=>x.ader<mediana);
  if(altas.length<2 || baixas.length<2) return null;
  const dPeso=g=>{ const p=g.map(x=>x.peso).filter(x=>x!==null);
    return p.length>=2? p[p.length-1]-p[0] : null; };
  const a=dPeso(altas), b=dPeso(baixas);
  if(a===null||b===null) return null;
  return {texto:'Nas '+altas.length+' semanas em que se cumpriu mais, o peso variou '+nPT(a,1)
      +' kg; nas '+baixas.length+' em que se cumpriu menos, '+nPT(b,1)+' kg.',
    nota:'Isto é uma associação, não uma causa: com tão poucas semanas, muita coisa mexe um número destes.'};
}

    <p class="sub" style="margin-top:10px">Cada sinal só aparece com um mínimo de amostra — ${MIN_OCORRENCIAS} ocorrências e ${MIN_SEMANAS} semanas — e traz os números à vista. O que não passar esse mínimo fica em silêncio.</p>
  </div>`;
}

/* ================= PROJEÇÃO EM LEQUE =================
   «Quando é que lá chego?» respondido sem fingir precisão: a tendência das
   pesagens prolongada num leque que alarga com a distância, calibrado pela
   dispersão real dos resíduos. Nunca uma data única. Nunca em bebés, crianças
   ou gravidez, onde o peso muda porque o corpo está a crescer. */
const MIN_PESAGENS_PROJ=6, MIN_SEMANAS_PROJ=4;
function tendenciaPeso(mid,dias){
  const ini=addDias(hojeISO(),-(dias||56));
  const pts=medicoesDe(mid).filter(x=>x.d>=ini);
  if(pts.length<MIN_PESAGENS_PROJ) return null;
  const t0=pts[0].d;
  if(diasEntre(t0,pts[pts.length-1].d) < MIN_SEMANAS_PROJ*7) return null;
  const xs=pts.map(p=>diasEntre(t0,p.d)), ys=pts.map(p=>p.p);
  const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
  const sxx=xs.reduce((a,b)=>a+b*b,0), sxy=xs.reduce((a,b,i)=>a+b*ys[i],0);
  const den=n*sxx-sx*sx; if(!den) return null;
  const m=(n*sxy-sx*sy)/den, b=(sy-m*sx)/n;
  /* a largura do leque é o desvio-padrão dos resíduos: quanto mais dispersa a
     balança, mais largo o intervalo — é isso que torna a projeção honesta */
  const res=ys.map((y,i)=>y-(m*xs[i]+b));
  const sd=Math.sqrt(res.reduce((a,r)=>a+r*r,0)/Math.max(1,n-2));
  return {m, b, t0, sd, n, dias:diasEntre(t0,pts[pts.length-1].d), ultimo:ys[ys.length-1]};
}
function projecaoObjetivo(o,m){
  if(!permiteProjecao(m)) return null;
  const t=tendenciaPeso(m.id); if(!t) return null;
  if(Math.abs(t.m)<0.0005) return {parado:true};
  const alvo=o.pesoAlvo, hojeX=diasEntre(t.t0,hojeISO());
  const y0=t.m*hojeX+t.b;
  const dias=(alvo-y0)/t.m;
  if(dias<0 || dias>365*3) return {longe:true, sentido:t.m<0?'a descer':'a subir'};
  /* o leque a essa distância dá o intervalo de datas */
  const larg=t.sd*1.96*Math.sqrt(1+dias/Math.max(1,t.dias));
  const diasMin=(alvo-y0+ (t.m<0? larg : -larg))/t.m;
  const diasMax=(alvo-y0+ (t.m<0? -larg : larg))/t.m;
  const a=Math.round(Math.min(diasMin,diasMax)), b=Math.round(Math.max(diasMin,diasMax));
  return {de:addDias(hojeISO(),Math.max(0,a)), ate:addDias(hojeISO(),Math.max(1,b)), t};
}
function textoProjecao(o,m){
  const p=projecaoObjetivo(o,m);
  if(!p) return {txt:'Faltam pesagens para projetar: são precisas '+MIN_PESAGENS_PROJ
    +' medições ao longo de pelo menos '+MIN_SEMANAS_PROJ+' semanas.', fraco:true};
  if(p.parado) return {txt:'A tendência das últimas semanas está praticamente plana — ao ritmo atual, não há data a apontar.', fraco:true};
  if(p.longe) return {txt:'A tendência vai '+p.sentido+', mas devagar demais para apontar uma data dentro de três anos.', fraco:true};
  const mesmoMes=p.de.slice(0,7)===p.ate.slice(0,7);
  return {txt:'Ao ritmo atual, chegaria '+(mesmoMes? 'em '+fmtLongo(p.de).replace(/^\d+ de /,'') : 'entre '+fmtShort(p.de)+' e '+fmtShort(p.ate))+'.',
    de:p.de, ate:p.ate};
}

/* ================= PASSAPORTE DE SABORES =================
   A neofobia alimentar vira jogo de descoberta em vez de guerra à mesa: cada
   refeição confirmada acrescenta ao passaporte da criança os ingredientes que
   ela nunca tinha provado. Marcar «provou mas não gostou» faz a app
   reapresentá-lo mais tarde noutra receita, em vez de o riscar para sempre. */
function passaporteDe(mid){
  const provados={}, ordem=[];
  regRefDe(mid).filter(r=>r.estado==='feita').sort((a,b)=>a.d<b.d?-1:1).forEach(r=>{
    const rec=RECIPES.find(x=>x.id===r.r); if(!rec) return;
    const listas=[rec].concat((r.ac||[]).map(id=>RECIPES.find(y=>y.id===id)).filter(Boolean));
    listas.forEach(x=>x.i.forEach(l=>{
      if(provados[l[0]]) return;
      provados[l[0]]={d:r.d, r:rec.n};
      ordem.push(l[0]);
    }));
  });
  return {provados, ordem};
}
function naoGostou(mid){ const m=S.members.find(x=>x.id===mid);
  return (m&&Array.isArray(m.naoGosta))? m.naoGosta : []; }
function toggleNaoGosta(mid,nome){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(!Array.isArray(m.naoGosta)) m.naoGosta=[];
  const i=m.naoGosta.indexOf(nome);
  i>=0? m.naoGosta.splice(i,1) : m.naoGosta.push(nome);
  save('sabores de '+m.nome); render();
}
/* Ingredientes que esta pessoa nunca provou e que a receita traz. */
function saboresNovos(r,mid){
  const p=passaporteDe(mid).provados;
  return (r.i||[]).map(l=>l[0]).filter(n=>!p[n]);
}
function seloSaborNovo(r,membros){
  const quem=(membros||[]).filter(m=>faseDe(m)==='crianca'||faseDe(m)==='adolescente')
    .filter(m=>saboresNovos(r,m.id).length);
  if(!quem.length) return '';
  return `<span class="tag" style="border-color:var(--party);color:var(--party)"
    title="Traz sabores novos para ${esc(quem.map(m=>m.nome.split(' ')[0]).join(', '))}">✨ sabor novo</span>`;
}
function cartaoPassaporte(m){
  if(faseDe(m)==='bebe') return '';
  const p=passaporteDe(m.id);

  if(!total) return '';
  /* agrupa por secção do supermercado, que é a classificação do próprio INSA */
  const grupos={};
  p.ordem.forEach(n=>{ const g=gruposCompras()[grupoDoItem({n, u:unidadeDe(n)})]||'Outros';
    (grupos[g]=grupos[g]||[]).push(n); });
  const cat=catalogoIngredientes().length;
  return `<div class="card" data-col="nu-passaporte">
    <div class="row" style="justify-content:space-between">
      <h3>Passaporte de sabores ${dica('passaporte')}</h3>
      <span class="pill">${total} de ${cat}</span></div>
    <p class="sub" style="margin-top:4px">Os ingredientes que ${esc(m.nome.split(' ')[0])} já provou, contados das refeições confirmadas. Toca num para marcar «provou mas não gostou» — a app volta a propô-lo mais tarde noutra receita, em vez de o riscar para sempre.</p>
    <div class="mbar" style="height:8px;margin-top:10px"><div style="width:${(total/cat*100).toFixed(1)}%;background:var(--party)"></div></div>
    ${Object.keys(grupos).slice(0,8).map(g=>`<div style="margin-top:10px">
      <div class="lbl">${ICO_CAT[g]||''} ${esc(g)} · ${grupos[g].length}</div>
      <div class="row" style="margin-top:4px">${grupos[g].slice(0,14).map(n=>
        `<button class="chip ${nao.indexOf(n)>=0?'':'on'}" onclick="toggleNaoGosta('${m.id}','${esc(n).replace(/'/g,'&#39;')}')"
          title="${nao.indexOf(n)>=0? 'provou e não gostou' : 'provado em '+fmtShort(p.provados[n].d)+', em '+esc(p.provados[n].r)}">${
          nao.indexOf(n)>=0? '😖 ':''}${esc(n)}</button>`).join('')}
        ${grupos[g].length>14? `<span class="sub">e mais ${grupos[g].length-14}</span>`:''}</div>
    </div>`).join('')}
  </div>`;
}

/* ================= RITMO DA DESPENSA =================
   A lista deixa de depender só da memória: da cadência das compras sai um
   palpite do que vai faltar. É apresentado como palpite, visualmente distinto
   do inventário real — a app não se arma em oráculo. */
function historicoCompras(nome){
  const datas=[];
  Object.keys(S.bought||{}).forEach(wk=>{
    if(!dataValida(wk)) return;
    Object.keys(S.bought[wk]||{}).forEach(k=>{
      if(!S.bought[wk][k]) return;
      if(k.split('|')[0]!==nome) return;
      datas.push(wk);
    });
  });
  return [...new Set(datas)].sort();
}
function cadenciaDe(nome){
  const d=historicoCompras(nome);
  if(d.length<3) return null;
  const gaps=[]; for(let i=1;i<d.length;i++) gaps.push(diasEntre(d[i-1],d[i]));
  gaps.sort((a,b)=>a-b);
  const med=gaps[Math.floor(gaps.length/2)];
  if(!(med>0)) return null;
  const desvio=Math.round(Math.sqrt(gaps.reduce((t,g)=>t+(g-med)*(g-med),0)/gaps.length));
  return {med, desvio, ultima:d[d.length-1], n:d.length};
}
function palpitesDespensa(){
  const h=hojeISO(), out=[];
  const nomes=new Set();
  Object.keys(S.bought||{}).forEach(wk=>Object.keys(S.bought[wk]||{}).forEach(k=>{
    if(S.bought[wk][k]) nomes.add(k.split('|')[0]); }));
  nomes.forEach(n=>{
    if((S.ui.semPalpite||[]).indexOf(n)>=0) return;
    if(temNaDespensa(n)) return;
    const c=cadenciaDe(n); if(!c) return;
    const passou=diasEntre(c.ultima,h);
    if(passou<c.med) return;
    out.push({n, c, passou});
  });
  return out.sort((a,b)=>(b.passou-b.c.med)-(a.passou-a.c.med)).slice(0,8);
}
function silenciarPalpite(n){
  if(!Array.isArray(S.ui.semPalpite)) S.ui.semPalpite=[];
  if(S.ui.semPalpite.indexOf(n)<0) S.ui.semPalpite.push(n);
  saveMeta(); render();
}
function aceitarPalpite(n){ S.despensa[n]=false; delete S.despensa[n]; save('palpite aceite'); go('compras'); }
function cartaoPalpites(){
  const p=palpitesDespensa(); if(!p.length) return '';
  return `<div class="card" data-col="co-palpites" style="margin-top:14px;border-left:4px solid var(--warn)">
    <h3>Se calhar está a faltar ${dica('palpite')}</h3>
    <p class="sub" style="margin-top:4px">Palpites da cadência das tuas compras — não é inventário, é um padrão. O que não estiver certo, silencia-se.</p>
    ${p.map(x=>`<div class="row" style="justify-content:space-between;margin-top:8px;gap:8px">
      <div style="min-width:0"><b>${esc(x.n)}</b>
        <span class="sub" style="display:block">costuma comprar-se a cada ${x.c.med}${x.c.desvio? '±'+x.c.desvio:''} dias · última há ${plural(x.passou,'dia','dias')}</span></div>
      <div class="row" style="flex:none">
        <button class="chip" onclick="aceitarPalpite('${esc(x.n).replace(/'/g,'&#39;')}')">Juntar à lista</button>
        <button class="chip" onclick="silenciarPalpite('${esc(x.n).replace(/'/g,'&#39;')}')">Já não usamos</button>
      </div></div>`).join('')}
  </div>`;
}

/* ================= SEQUÊNCIAS HONESTAS =================
   Semanas cumpridas contadas só de validações reais. Doença, férias ou lesão
   marcam-se como pausa: a sequência congela em vez de partir — uma gripe não
   pode apagar dois meses de esforço. */
const LIMIAR_SEMANA=0.8;
function semanaCumprida(m,wk){
  if((S.pausas||[]).some(p=>p.wk===wk && (p.mid===m.id||p.mid==='casa'))) return 'pausa';
  const dates=weekDates(wk);
  const ref=regRefDe(m.id).filter(r=>dates.indexOf(r.d)>=0);
  const ativ=regAtivDe(m.id).filter(r=>dates.indexOf(r.d)>=0);
  const tot=ref.length+ativ.length;
  if(tot<3) return null;
  const feitos=ref.filter(r=>r.estado==='feita').length+ativ.filter(r=>r.estado==='feita').length;
  return feitos/tot>=LIMIAR_SEMANA? 'sim' : 'nao';
}
function sequenciaDe(m){
  let n=0, wk=mondayISO(addDias(hojeISO(),-7));   /* a semana em curso ainda não fechou */
  for(let k=0;k<52;k++){
    const r=semanaCumprida(m,wk);
    if(r==='sim'){ n++; }
    else if(r==='pausa'){ /* congela: não conta nem parte */ }
    else break;
    wk=mondayISO(addDias(wk,-7));
  }
  return n;
}
function sequenciaCasa(){
  if(!S.members.length) return 0;
  let n=0, wk=mondayISO(addDias(hojeISO(),-7));
  for(let k=0;k<52;k++){
    const r=S.members.map(m=>semanaCumprida(m,wk));
    if(r.every(x=>x==='sim'||x==='pausa') && r.some(x=>x==='sim')) n++;
    else break;
    wk=mondayISO(addDias(wk,-7));
  }
  return n;
}
function pausaDeclarada(mid,wk){
  if(!Array.isArray(S.pausas)) S.pausas=[];
  const i=S.pausas.findIndex(p=>p.wk===wk && p.mid===mid);
  if(i>=0) S.pausas.splice(i,1); else S.pausas.push({wk, mid});
  save('pausa declarada'); render();
}
const NUM_EXT=['zero','uma','duas','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze'];
function textoSequencia(n){
  if(!n) return '';
  return (NUM_EXT[n]||n)+' '+(n===1?'semana seguida':'semanas seguidas');
}

/* ================= HÁ UM ANO =================
   Memória afetiva tirada dos próprios registos, sem inventar nada e sem tocar
   em perfis onde o peso não se comenta. Uma por dia, no máximo. */
function memoriaDoDia(){
  const h=hojeISO(), cand=[];
  S.members.forEach(m=>{
    /* primeiro treino de uma modalidade */
    const porSp={};
    regAtivDe(m.id).filter(r=>r.estado==='feita').forEach(r=>{
      if(!porSp[r.s]||r.d<porSp[r.s].d) porSp[r.s]={d:r.d, n:0};
      porSp[r.s].n++; });
    Object.keys(porSp).forEach(s=>{
      const dif=diasEntre(porSp[s].d,h);
      if(dif===365||dif===182||dif===90)
        cand.push({p:2, t:(dif===365?'Há um ano':dif===182?'Há seis meses':'Há três meses')+', '
          +nomeCurto(m)+' começou '+(SPORT[s]?SPORT[s].nome.toLowerCase():'a treinar')
          +' — leva '+plural(porSp[s].n,'treino','treinos')+'.'});
    });
    /* primeira vez que se cozinhou um prato */
    const porRec={};
    regRefDe(m.id).filter(r=>r.estado==='feita').forEach(r=>{
      if(!porRec[r.r]||r.d<porRec[r.r]) porRec[r.r]=r.d; });
    Object.keys(porRec).forEach(rid=>{
      const dif=diasEntre(porRec[rid],h);
      if(dif===365||dif===182){ const rec=RECIPES.find(x=>x.id===rid);
        if(rec) cand.push({p:1, t:(dif===365?'Há um ano':'Há seis meses')+' comeram '+rec.n+' pela primeira vez.'}); }
    });
    /* variação de peso — só onde o peso se comenta, e sempre com o objetivo à frente */
    if(permiteProjecao(m)){
      const pts=medicoesDe(m.id);
      if(pts.length>=2){
        const alvoD=addDias(h,-182);
        const antigo=pts.filter(x=>x.d<=alvoD).pop();
        if(antigo && diasEntre(antigo.d,h)>=175 && diasEntre(antigo.d,h)<=190){
          const dif=pts[pts.length-1].p-antigo.p;
          if(Math.abs(dif)>=1) cand.push({p:3, t:nomeCurto(m)+' pesa '+(dif<0?'menos ':'mais ')
            +nPT(Math.abs(dif),1)+' kg do que há seis meses.'});
        }
      }
    }
  });
  if(!cand.length) return '';
  cand.sort((a,b)=>b.p-a.p);
  return cand[0].t;
}

/* ================= FOOD PREP FAMILIAR =================
   O que se pode adiantar ao domingo para a semana correr sozinha. Ao contrário
   do lote (que cozinha o prato), isto é preparação de ingredientes: descascar,
   picar, demolhar, marinar, lavar. As tarefas são uma lista explícita ligada a
   famílias de ingredientes — a app não inventa técnica de cozinha. */
const PREPS=[
  {k:'demolhar', re:/^(gr[aã]o|feij[aã]o (?!verde)|lentilha|favas)/i, t:'Demolhar de véspera',
   d:'Ficam de molho na noite anterior; cozem em metade do tempo e ficam mais macios.', h:12, ordem:1},
  {k:'cozer',    re:/^(gr[aã]o|feij[aã]o (?!verde)|lentilha)/i, t:'Cozer e guardar em porções',
   d:'Cozidos e divididos por saquinhos, guardam quatro dias no frigorífico ou três meses no congelador.', h:1.5, ordem:2},
  {k:'picar',    re:/^(cebola|alho(?!-franc)|alho-franc[eê]s|pimento|salsa|coentros|cenoura)/i, t:'Picar e guardar',
   d:'Picados em caixa fechada aguentam três dias; o refogado da semana passa a ser um gesto.', h:0.5, ordem:3},
  {k:'lavar',    re:/^(alface|r[uú]cula|espinafres|couve|grelos|br[oó]colos|agri[aã]o)/i, t:'Lavar e secar as folhas',
   d:'Lavadas, bem secas e em caixa com papel, duram quatro a cinco dias e a salada deixa de dar trabalho.', h:0.5, ordem:4},
  {k:'assar',    re:/^(ab[oó]bora|batata-doce|beringela|curgete|pimento|cenoura)/i, t:'Assar em tabuleiro',
   d:'Um tabuleiro grande no domingo serve de acompanhamento a três jantares.', h:1, ordem:5},
  {k:'marinar',  re:/^(peito de frango|frango|porco|secretos|plumas|lombo|novilho|bife)/i, t:'Temperar e marinar',
   d:'Temperada de véspera, a carne cozinha mais depressa e sabe melhor; separa-se já por refeição.', h:0.5, ordem:6},
  {k:'porcionar',re:/^(peixe|bacalhau|salm[aã]o|sardinha|carapau|robalo|dourada|pescada)/i, t:'Porcionar e congelar',
   d:'Separado por refeição e congelado, descongela na véspera dentro do frigorífico — nunca à temperatura ambiente.', h:0.5, ordem:7},
  {k:'ovos',     re:/^ovo/i, t:'Cozer ovos',
   d:'Cozidos com casca guardam uma semana no frigorífico; resolvem lanches e saladas.', h:0.3, ordem:8},
];
function planoFoodPrep(wk){
  const semana=wk||S.week, dates=weekDates(semana), w=S.plans[semana]||{};
  const tarefas={};
  for(let di=0;di<7;di++) MEALK.forEach(mk=>{
    const meal=(w[di]||{})[mk]; if(!meal||!meal.r) return;
    const rec=RECIPES.find(x=>x.id===meal.r); if(!rec) return;
    const n=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di])).length + nConvidados(meal);
    if(!n) return;
    const acs=acompsDe(meal), q=acs.length?1/acs.length:0, dob=fatorDobro(meal);
    const junta=(lista,fator)=>lista.forEach(([nome,quant,un])=>{
      PREPS.forEach(p=>{ if(!p.re.test(nome)) return;
        const k=p.k+'|'+nome;
        if(!tarefas[k]) tarefas[k]={p, nome, q:0, un, dias:[], receitas:[]};
        tarefas[k].q+=quant*n*fator*dob;
        if(tarefas[k].dias.indexOf(di)<0) tarefas[k].dias.push(di);
        if(tarefas[k].receitas.indexOf(rec.n)<0) tarefas[k].receitas.push(rec.n);
      });
    });
    junta(rec.i,1); acs.forEach(x=>junta(x.i,q));
  });
  return Object.values(tarefas)
    .filter(t=>t.dias.length>=1 && t.q>0)
    .sort((a,b)=>a.p.ordem-b.p.ordem || b.dias.length-a.dias.length);
}
function horasFoodPrep(l){ return l.reduce((t,x)=>t+x.p.h,0); }
/* Quantas tarefas de preparação esta receita partilha com o que já está
   planeado na semana: é o que faz uma sugestão «encaixar» no food prep. */
function encaixaNoPrep(r,tarefas){
  if(!tarefas.length) return 0;
  const chaves=new Set(tarefas.map(t=>t.p.k+'|'+t.nome));
  let n=0;
  (r.i||[]).forEach(l=>PREPS.forEach(p=>{ if(p.re.test(l[0]) && chaves.has(p.k+'|'+l[0])) n++; }));
  return n;
}

/* ================= REPETIR RECEITAS NA SEMANA =================
   Cozinhar uma vez e comer duas é como muitas casas funcionam. Quando a opção
   está ligada, o preenchimento automático repete pratos em vez de os evitar —
   e marca a segunda vez como «aquecer», não «cozinhar». */
function querRepetir(){ return !!(S.cozPref||{}).repetir; }
function querSazonal(){ return !!(S.cozPref||{}).sazonal; }
function querDobro(){ return !!(S.cozPref||{}).dobro; }
function querPrep(){ return (S.cozPref||{}).prep!==false; }
function setCozPref(k,v){
  if(!S.cozPref||typeof S.cozPref!=='object') S.cozPref={};
  S.cozPref[k]=!!v; save('preferências de cozinha'); render();
}
/* Uma refeição é «aquecer» quando o mesmo prato já foi cozinhado num dia
   anterior da semana e essa refeição foi marcada para dobrar. */
function ehAquecer(di,mk){
  const w=planWeek(), meal=(w[di]||{})[mk];
  if(!meal||!meal.r) return null;
  for(let d=0;d<di;d++) for(const k of MEALK){
    const ant=(w[d]||{})[k];
    if(ant && ant.r===meal.r && fatorDobro(ant)>1) return {di:d, mk:k};
  }
  return null;
}
/* Quantas vezes o PRATO desta refeição entra na lista de compras: a dobrar
   quando se cozinha para dois dias, zero quando é só aquecer o que já foi
   cozinhado. Os acompanhamentos não passam por aqui — fazem-se frescos. */
function fatorCompras(di,mk){
  const meal=(planWeek()[di]||{})[mk];
  if(!meal||!meal.r) return 0;
  return ehAquecer(di,mk)? 0 : fatorDobro(meal);
}

/* ================= PENDÊNCIAS DO DIA =================
   O que a casa tem por despachar, contado uma vez e reutilizado no crachá do
   ícone da PWA, nos pontos da barra e no «Correu como planeado». */
function pendenciasHoje(){
  const d=hojeISO(), out={ref:[], ativ:[], compras:0, pesagens:0};
  S.members.forEach(m=>{
    planeadasHojeSemRegisto(m).forEach(p=>out.ref.push({mid:m.id, mk:p.mk, meal:p.meal}));
    planeadasNoDia(m,d).forEach(p=>{
      if((S.regAtiv||[]).some(r=>r.mid===m.id&&r.d===d&&r.plano===p.s.id&&r.estado!=='agendada')) return;
      out.ativ.push({mid:m.id, sid:p.s.id, s:p.s, min:p.min}); });
    if(precisaPesagem(m)) out.pesagens++;
  });
  const wk=mondayISO(d), guarda=S.week; S.week=wk;
  out.compras=itensEmFalta(shoppingItems().items).filter(i=>!((S.bought[wk]||{})[i.n+'|'+i.u])).length;
  S.week=guarda;
  out.total=out.ref.length+out.ativ.length;
  return out;
}
/* Sem servidor não há notificações — mas há o número no ícone da PWA, que
   lembra sem interromper. Onde a API não exista, ficam só os pontos na barra. */
function pintaCracha(){
  if(!('setAppBadge' in navigator)) return;
  try{
    const p=S.members.length? pendenciasHoje() : {total:0, compras:0};
    const n=p.total+p.compras;
    if(n>0) navigator.setAppBadge(n).catch(()=>{});
    else navigator.clearAppBadge && navigator.clearAppBadge().catch(()=>{});
  }catch(e){}
}
function pendentesPorSeparador(){
  if(!S.members.length) return {};
  const p=pendenciasHoje();
  const out={};
  if(p.ref.length) out.nutricao=p.ref.length;
  if(p.ativ.length) out.atividade=p.ativ.length;
  if(p.compras) out.mercearia=p.compras;
  if(p.pesagens) out.familia=p.pesagens;
  return out;
}

/* ================= «CORREU COMO PLANEADO» =================
   Um toque fecha o dia inteiro — mas só depois da hora da última refeição
   planeada. Aparecer de manhã seria convidar a registar o que ainda não
   aconteceu, e a fronteira entre plano e registo é o que sustenta esta app. */
const HORA_REFEICAO={p:10, a:15, l:18, j:22};
function podeFecharDia(){
  const p=pendenciasHoje();
  if(!p.total) return null;
  const agora=new Date().getHours();
  const ultima=Math.max(0,...p.ref.map(x=>HORA_REFEICAO[x.mk]||22), p.ativ.length? 21:0);
  return agora>=ultima? p : null;
}
function fecharDiaComoPlaneado(){
  const p=podeFecharDia(); if(!p) return;
  const d=hojeISO();
  let nR=0, nA=0;
  p.ref.forEach(x=>{
    if((S.regRef||[]).some(r=>r.mid===x.mid&&r.d===d&&r.mk===x.mk)) return;
    const m=S.members.find(y=>y.id===x.mid), rec=RECIPES.find(y=>y.id===x.meal.r);
    registarRefeicao({d, mk:x.mk, r:x.meal.r, ac:acIds(x.meal),
      dose: m&&rec? doseSugerida(m,rec,x.mk) : 1}, [x.mid], 'feita'); nR++;
  });
  p.ativ.forEach(x=>{
    if((S.regAtiv||[]).some(r=>r.mid===x.mid&&r.d===d&&r.plano===x.sid&&r.estado!=='agendada')) return;
    registarAtividade({d, s:x.s.s, min:x.min, i:x.s.i, v:x.s.v, plano:x.sid}, [x.mid], 'feita'); nA++;
  });
  if(!nR && !nA) return;
  carimboAlvo='dia:'+d;
  save('dia fechado como planeado');
  flash('ok', [nR? plural(nR,'refeição registada','refeições registadas'):'',
    nA? plural(nA,'treino registado','treinos registados'):''].filter(Boolean).join(' e ')
    +'. Se alguma coisa não foi bem assim, desfaz num toque.');
  render();
}

/* ================= FOLHA DE MESA =================
   Registar o jantar de quatro em cinco segundos: os avatares dos comensais
   previstos, um toque em cada um que comeu, e nada para preencher — o prato,
   a dose e os acompanhamentos vêm do plano. */
function folhaMesa(){ return S.ui.folha&&typeof S.ui.folha==='object'? S.ui.folha : null; }
function abrirFolhaMesa(d,mk){
  const dia=(S.plans[mondayISO(d)]||{})[diaSemana(d)]||{};
  const meal=dia[mk]; if(!meal||!meal.r) return;
  const comem=S.members.filter(m=>meal.m.indexOf(m.id)>=0 && !isCheat(m.id,d));
  if(!comem.length) return flash('warn','Ninguém estava previsto para esta refeição.');
  /* já validados entram desligados: confirmar duas vezes seria duplicar */
  const jaFeitos=(S.regRef||[]).filter(r=>r.d===d&&r.mk===mk).map(r=>r.mid);
  S.ui.folha={tipo:'mesa', d, mk,
    sel:comem.filter(m=>jaFeitos.indexOf(m.id)<0).map(m=>m.id)};
  saveMeta(); render();
}
function fecharFolha(){ S.ui.folha=null; saveMeta(); render(); }
function toggleLugar(mid){
  const f=folhaMesa(); if(!f) return;
  const i=f.sel.indexOf(mid);
  i>=0? f.sel.splice(i,1) : f.sel.push(mid);
  saveMeta(); render();
}
function guardarFolhaMesa(){
  const f=folhaMesa(); if(!f) return;
  if(!f.sel.length){ return flash('warn','Toca em quem comeu — ou fecha a folha.'); }
  const dia=(S.plans[mondayISO(f.d)]||{})[diaSemana(f.d)]||{};
  const meal=dia[f.mk]; if(!meal) return fecharFolha();
  const rec=RECIPES.find(x=>x.id===meal.r);
  const porMembro={};
  f.sel.forEach(mid=>{ const m=S.members.find(x=>x.id===mid);
    porMembro[mid]={dose: m&&rec? doseSugerida(m,rec,f.mk) : 1}; });
  const mids=f.sel.filter(mid=>!(S.regRef||[]).some(r=>r.mid===mid&&r.d===f.d&&r.mk===f.mk));
  if(!mids.length){ S.ui.folha=null; saveMeta(); return render(); }
  registarRefeicao({d:f.d, mk:f.mk, r:meal.r, ac:acIds(meal), dose:1, porMembro}, mids, 'feita');
  carimboAlvo='ref:'+f.d+':'+f.mk;
  save('refeição registada à mesa');
  /* o passo seguinte natural é o tacho: pergunta-se se sobrou, em vez de
     obrigar a ir procurar onde se aponta isso */
  const podeSobrar=(f.mk==='a'||f.mk==='j') && !(S.sobras||[]).some(s=>s.d===f.d && s.r===meal.r);
  if(podeSobrar) perguntarSobra(f.d, f.mk, meal.r, acIds(meal));
  else { S.ui.folha=null; render(); }
  flash('ok', plural(mids.length,'pessoa registada','pessoas registadas')+' — '+esc(rec?rec.n:'refeição')+'.');
}
function outraCoisaNaFolha(mid){
  const f=folhaMesa(); if(!f) return;
  const d=f.d, mk=f.mk;
  S.ui.folha=null;
  registarRefeicao({d, mk, r:((S.plans[mondayISO(d)]||{})[diaSemana(d)]||{})[mk]?.r, ac:[], dose:1},[mid],'falhada');
  save('refeição substituída');
  abrirFormRef(mid,{d, mk, subst:true});
}
function folhaMesaHtml(f){
  const dia=(S.plans[mondayISO(f.d)]||{})[diaSemana(f.d)]||{};
  const meal=dia[f.mk]; if(!meal||!meal.r) return '';
  const rec=RECIPES.find(x=>x.id===meal.r);
  const acs=acompsDe(meal);
  const comem=S.members.filter(m=>meal.m.indexOf(m.id)>=0 && !isCheat(m.id,f.d));
  const jaFeitos=(S.regRef||[]).filter(r=>r.d===f.d&&r.mk===f.mk&&r.estado==='feita').map(r=>r.mid);
  return `<div class="mfundo" onclick="fundoFolha(event)" style="align-items:flex-end;padding:0">

/* ================= MODO SUPERMERCADO =================
   A lista comporta-se como papel pendurado no carrinho: letra grande, alvos a
   toda a largura, secção sempre à vista e o ecrã que não se apaga. */
let wakeLock=null;
async function pedirEcraAceso(){
  try{ if('wakeLock' in navigator && !wakeLock) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
}
function largarEcraAceso(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }

function fecharMercado(){

/* ================= DESLIZAR PARA VALIDAR =================
   Direita confirma a opção principal, esquerda abre as alternativas. O
   desfazer de 30 passos é a rede para o dedo que escorrega. */
function ligaDeslize(){
  document.querySelectorAll('#main .desliza:not([data-liga])').forEach(el=>{
    el.setAttribute('data-liga','1');
    const corpo=el.querySelector('.desliza-corpo');
    const sim=el.querySelector('.desliza-fundo.sim'), nao=el.querySelector('.desliza-fundo.nao');
    if(!corpo) return;
    let x0=null, dx=0, larg=1;
    const fim=()=>{
      corpo.classList.add('volta'); corpo.style.transform='';
      if(sim) sim.style.opacity=0; if(nao) nao.style.opacity=0;
      setTimeout(()=>corpo.classList.remove('volta'),180);
      x0=null; dx=0;
    };
    corpo.addEventListener('pointerdown',e=>{
      if(e.target.closest('button,select,input,a')) return;
      x0=e.clientX; larg=el.getBoundingClientRect().width||1; corpo.setPointerCapture(e.pointerId);
    });
    corpo.addEventListener('pointermove',e=>{
      if(x0===null) return;
      dx=e.clientX-x0;
      if(Math.abs(dx)<6) return;
      corpo.style.transform='translateX('+dx.toFixed(0)+'px)';
      const p=Math.min(1,Math.abs(dx)/(larg*0.4));
      if(sim) sim.style.opacity = dx>0? p : 0;
      if(nao) nao.style.opacity = dx<0? p : 0;
    });
    corpo.addEventListener('pointerup',()=>{
      if(x0===null) return;
      const limiar=larg*0.4, d=dx;
      fim();
      if(d>limiar && el.dataset.sim) { const f=new Function(el.dataset.sim); f(); }
      else if(d<-limiar && el.dataset.nao){ const f=new Function(el.dataset.nao); f(); }
    });
    corpo.addEventListener('pointercancel',fim);
  });
}

/* ================= REGISTAR SEMPRE À MÃO =================
   Um botão que sabe a hora: às 13h propõe o almoço, em dia de treino propõe o
   treino, de manhã propõe a pesagem se a última já tem uma semana. A ordem é
   uma função pura sobre dados locais — nada de heurísticas opacas. */
function acoesRegisto(){
  if(!S.members.length) return [];
  const h=new Date().getHours(), d=hojeISO(), out=[];
  const p=pendenciasHoje();
  /* a refeição da hora vem primeiro */
  const janela = h<11? 'p' : h<16? 'a' : h<19? 'l' : 'j';
  const ordemRef=[janela].concat(MEALK.filter(k=>k!==janela));
  ordemRef.forEach(mk=>{ const x=p.ref.find(y=>y.mk===mk); if(!x) return;
    if(out.some(o=>o.mk===mk)) return;
    const rec=RECIPES.find(y=>y.id===x.meal.r);
    out.push({tipo:'ref', mk, rot:nomeRefeicao(mk)+' de hoje', sub:rec? rec.n : '',
      fn:"abrirFolhaMesa('"+d+"','"+mk+"')"});
  });
  p.ativ.slice(0,2).forEach(x=>{
    const m=S.members.find(y=>y.id===x.mid);
    out.push({tipo:'ativ', rot:'Treino de '+(m?m.nome.split(' ')[0]:''), sub:SPORT[x.s.s].nome+' · '+x.min+' min',
      fn:"validarAtivFeita('"+x.mid+"','"+d+"','"+x.sid+"')"});
  });
  if(h<12 && p.pesagens) out.push({tipo:'peso', rot:'Pesagem', sub:plural(p.pesagens,'perfil sem pesagem recente','perfis sem pesagem recente'), fn:"abrirPesagens()"});
  out.push({tipo:'ref', rot:'Registar refeição', sub:'escolher à mão', fn:"abrirFormRef(S.ui.mid||S.members[0].id)"});
  out.push({tipo:'ativ', rot:'Registar atividade', sub:'escolher à mão', fn:"abrirFormAtiv(S.ui.mid||S.members[0].id)"});
  if(!(h<12 && p.pesagens)) out.push({tipo:'peso', rot:'Registar pesagem', sub:'com data', fn:"abrirPesagens()"});
  return out.slice(0,5);
}
function abrirFolhaRegisto(){ S.ui.folha={tipo:'registo'}; saveMeta(); render(); }
function folhaRegistoHtml(){
  const acoes=acoesRegisto();
  const ico={ref:'🍽️', ativ:'🏃', peso:'⚖'};
  return `<div class="mfundo" onclick="fundoFolha(event)" style="align-items:flex-end;padding:0">

/* ================= CAIXAS DE DIÁLOGO =================
   A app pergunta pouco, e quando pergunta é porque a resposta muda os dados:
   pesagens novas e compras por confirmar. Uma de cada vez, e nunca duas vezes
   na mesma sessão — perguntar outra vez o que já foi respondido é ruído. */
let jaPerguntouPeso=false, jaPerguntouCompras=false;
function abrirModal(tipo,dados){ S.ui.modal=Object.assign({tipo},dados||{}); saveMeta(); render(); }
function fecharModal(){ S.ui.modal=null; saveMeta(); render(); }
function fundoModal(e){ if(e && e.target && e.target.classList.contains('mfundo')) fecharModal(); }
function modalAberto(){ return S.ui.modal&&typeof S.ui.modal==='object'? S.ui.modal : null; }
/* Quem já não se pesa há uma semana. Não é um alarme: é só a pergunta que
   qualquer pessoa que segue o peso faz a si própria de vez em quando. */
const DIAS_ENTRE_PESAGENS=7;
function precisaPesagem(m){
  if(faseDe(m)==='bebe') return false;
  const u=ultimaMedicao(m.id);
  return !u || diasEntre(u.d,hojeISO())>=DIAS_ENTRE_PESAGENS;
}
function talvezPerguntarPeso(){
  if(jaPerguntouPeso || modalAberto() || tourAtivo()) return;
  jaPerguntouPeso=true;
  const quem=S.members.filter(precisaPesagem);
  if(!quem.length) return;
  abrirModal('peso',{mids:quem.map(m=>m.id), d:hojeISO(), vals:{}});
}
function abrirPesagens(mid){
  jaPerguntouPeso=true;
  const quem=mid? S.members.filter(m=>m.id===mid) : S.members.filter(m=>faseDe(m)!=='bebe');
  if(!quem.length) return flash('warn','Não há perfis para pesar.');
  abrirModal('peso',{mids:quem.map(m=>m.id), d:hojeISO(), vals:{}});
}
function setModalCampo(campo,val){ const mo=modalAberto(); if(!mo) return; mo[campo]=val; }
function setPesagem(mid,val){ const mo=modalAberto(); if(!mo) return; mo.vals[mid]=val; }
function guardarPesagens(){
  const mo=modalAberto(); if(!mo) return;
  const d=dataValida(mo.d)&&mo.d<=hojeISO()? mo.d : hojeISO();
  let n=0, recusados=[];
  mo.mids.forEach(mid=>{
    const v=mo.vals[mid];
    if(v===undefined || v==='' || v===null) return;
    const m=S.members.find(x=>x.id===mid);
    if(registarMedicao(mid,d,v)) n++; else recusados.push(m? m.nome : mid);
  });
  S.ui.modal=null;
  if(!n && !recusados.length){ saveMeta(); return render(); }
  if(n) save(plural(n,'pesagem registada','pesagens registadas'));
  render();
  if(recusados.length) flash('bad','Peso fora do que é possível para '+recusados.join(', ')+' — entre 1 e 400 kg.');
  else flash('ok', plural(n,'pesagem registada','pesagens registadas')+' em '+rotuloData(d)+'.');
}

/* ================= EVOLUÇÃO DO PESO =================
   O peso ao longo do tempo, com a atividade e as calorias por cima quando se
   quer perceber porquê. Sem inventar pontos: entre duas pesagens a linha liga
   o que foi medido, e onde não há medição não há linha. */
const JANELAS={dias:[14,'14 dias'], semanas:[56,'8 semanas'], mes:[182,'6 meses'], ano:[730,'2 anos']};
function setJanelaPeso(k){ if(temChave(JANELAS,k)) S.ui.janelaPeso=k; saveMeta(); render(); }
function toggleLinhaPeso(k){
  if(!S.ui.linhasPeso||typeof S.ui.linhasPeso!=='object') S.ui.linhasPeso={ativ:false,kcal:false};
  S.ui.linhasPeso[k]=!S.ui.linhasPeso[k]; saveMeta(); render();
}
function janelaPeso(){ return temChave(JANELAS,S.ui.janelaPeso)? S.ui.janelaPeso : 'mes'; }
function graficoPesoSvg(m){
  const jan=janelaPeso(), dias=JANELAS[jan][0], h=hojeISO(), ini=addDias(h,-dias+1);
  const pts=medicoesDe(m.id).filter(x=>x.d>=ini);
  const W=340, H=132, X0=34, X1=332, Y0=14, Y1=H-20;
  if(pts.length<1) return {svg:'', pts:0};
  const pesos=pts.map(x=>x.p);
  let pmin=Math.min(...pesos), pmax=Math.max(...pesos);
  if(pmax-pmin<2){ const c=(pmax+pmin)/2; pmin=c-1; pmax=c+1; }
  const marg=(pmax-pmin)*0.15; pmin-=marg; pmax+=marg;
  const X=d=>X0+(X1-X0)*clampNum(diasEntre(ini,d)/(dias-1||1),0,1);
  const Y=p=>Y1-(Y1-Y0)*clampNum((p-pmin)/(pmax-pmin||1),0,1);
  const linha=pts.map(x=>X(x.d).toFixed(1)+','+Y(x.p).toFixed(1)).join(' ');
  const L=S.ui.linhasPeso||{};
  /* as sobreposições usam a sua própria escala: o que interessa é a forma da
     curva ao lado da do peso, não comparar quilos com calorias */
  const serie=fn=>{ const out=[]; for(let i=0;i<dias;i++){ const d=addDias(ini,i); out.push({d, v:fn(d)}); } return out; };
  const desenhaSerie=(dados,classe)=>{
    const max=Math.max(1,...dados.map(x=>x.v));
    const p=dados.filter(x=>x.v>0).map(x=>X(x.d).toFixed(1)+','+(Y1-(Y1-Y0)*0.55*(x.v/max)).toFixed(1));
    if(p.length<2) return '';
    return `<polyline points="${p.join(' ')}" fill="none" class="${classe}" stroke-width="1.3" opacity=".65"/>`;
  };
  const svgAtiv=L.ativ? desenhaSerie(serie(d=>regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita').reduce((t,r)=>t+kcalRegAtiv(r),0)),'s-energy') : '';
  const svgKcal=L.kcal? desenhaSerie(serie(d=>ingeridoRealDia(m.id,d).k),'s-acc') : '';
  const grelha=[0,0.5,1].map(t=>{ const p=pmin+(pmax-pmin)*t;
    return `<line x1="${X0}" y1="${Y(p).toFixed(1)}" x2="${X1}" y2="${Y(p).toFixed(1)}" class="s-line" opacity=".55"/>
      <text x="${X0-4}" y="${(Y(p)+3).toFixed(1)}" font-size="9.5" text-anchor="end" class="f-mut" style="font-variant-numeric:tabular-nums">${nPT(p,1)}</text>`;}).join('');
  return {pts:pts.length, svg:`<svg class="svgfx" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Evolução do peso de ${esc(m.nome)} em ${JANELAS[jan][1]}">
    ${grelha}${svgAtiv}${svgKcal}
    ${pts.length>1? `<polyline points="${linha}" fill="none" class="s-ink" stroke-width="2"/>`:''}
    ${pts.map(x=>`<circle cx="${X(x.d).toFixed(1)}" cy="${Y(x.p).toFixed(1)}" r="${pts.length>40?1.8:3}" class="f-ink"
      ><title>${fmtLongo(x.d)}: ${nPT(x.p,1)} kg</title></circle>`).join('')}
    <text x="${X0}" y="${H-5}" font-size="9.5" class="f-mut">${fmtShort(ini)}</text>
    <text x="${X1}" y="${H-5}" font-size="9.5" text-anchor="end" class="f-mut">hoje</text>
  </svg>`};
}
function cartaoPeso(){
  if(!S.members.length) return '';
  const m=curM(); if(!m) return '';
  const g=graficoPesoSvg(m);
  const pts=medicoesDe(m.id);
  const jan=janelaPeso(), ini=addDias(hojeISO(),-JANELAS[jan][0]+1);
  const naJanela=pts.filter(x=>x.d>=ini);
  const dif=naJanela.length>1? naJanela[naJanela.length-1].p-naJanela[0].p : null;
  const L=S.ui.linhasPeso||{};
  return `<div class="card" id="peso-hist" data-col="fam-peso" style="margin-top:16px">
    <div class="row" style="justify-content:space-between">
      <div><span class="lbl">Peso</span><h2 style="margin-top:2px">Evolução de ${esc(m.nome.split(' ')[0])} ${dica('pesoHist')}</h2></div>
      <button class="btn small" onclick="abrirPesagens('${m.id}')">+ Registar pesagem</button></div>
    <div class="row" style="margin-top:10px">${S.members.map(x=>`<button class="chip ${x.id===m.id?'on':''}"
      onclick="pickM('${x.id}')">${avatar(x,20)} ${esc(x.nome.split(' ')[0])}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px">
      ${Object.entries(JANELAS).map(([k,v])=>`<button class="chip ${jan===k?'on':''}" onclick="setJanelaPeso('${k}')">${v[1]}</button>`).join('')}
    </div>
    ${!pts.length? estadoVazio('balanca','Ainda sem pesagens',
        'Regista o peso de hoje e, se tiveres medições antigas anotadas, também essas — a linha só liga o que foi mesmo medido.',
        `<button class="btn" onclick="abrirPesagens('${m.id}')">+ Registar pesagem</button>`)
    : `${g.svg}
      <div class="row" style="margin-top:8px">
        <button class="chip ${L.ativ?'on':''}" onclick="toggleLinhaPeso('ativ')" aria-pressed="${!!L.ativ}">🏃 Atividade registada</button>
        <button class="chip ${L.kcal?'on':''}" onclick="toggleLinhaPeso('kcal')" aria-pressed="${!!L.kcal}">🍽️ Calorias ingeridas</button>
      </div>
      ${(L.ativ||L.kcal)? `<p class="sub" style="margin-top:6px">As linhas sobrepostas têm escala própria: servem para ver a <i>forma</i> ao lado da do peso, não para comparar quilos com calorias.</p>`:''}
      <div class="row" style="margin-top:12px">
        <div class="stat"><b>${nPT(pts[pts.length-1].p,1)} kg</b><span>Última · ${fmtShort(pts[pts.length-1].d)}</span></div>
        <div class="stat"><b>${pts.length}</b><span>Pesagens</span></div>
        ${dif!==null? `<div class="stat" style="background:${Math.abs(dif)<0.3?'var(--bg)':'var(--accent-soft)'}"><b style="color:${Math.abs(dif)<0.3?'var(--ink)':dif<0?'var(--ok)':'var(--warn)'}">${dif>0?'+':''}${nPT(dif,1)} kg</b><span>Em ${JANELAS[jan][1]}</span></div>`:''}
        ${naJanela.length? `<div class="stat"><b>${naJanela.length}</b><span>Nesta janela</span></div>`:''}
      </div>
      ${naJanela.length<2? `<p class="sub" style="margin-top:8px">Com uma pesagem só não há linha para traçar. A segunda medição já desenha a tendência.</p>`:''}
      <details class="quant" style="margin-top:10px"><summary>Todas as pesagens (${pts.length})</summary>
        <div style="margin-top:6px">${pts.slice().reverse().map(x=>`<div class="reg-linha">
          <div class="rl-corpo"><b>${nPT(x.p,1)} kg</b> <span class="sub">· ${fmtLongo(x.d)}</span></div>
          <div class="reg-acoes"><button class="btn danger small" aria-label="Apagar pesagem de ${fmtShort(x.d)}"
            onclick="removerMedicao('${m.id}','${x.d}')">✕</button></div></div>`).join('')}</div>
      </details>`}
  </div>`;
}
