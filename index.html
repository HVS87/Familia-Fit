     pode causar reação em quem é alérgico a crustáceos, moluscos e ácaros.
     Não é invenção nossa: é a própria autorização que o manda declarar. */
  'Grilo doméstico, pó':['crustaceos','moluscos'],
  /* Enchidos onde o cereal é ingrediente e não contaminação: a alheira leva
     pão na massa e a farinheira leva farinha de trigo — é o que lhes dá o
     nome. Ambas levam gordura de porco. Nenhum dos dois nomes é apanhado
     pelas expressões, e as duas ficavam sem etiqueta nenhuma. */
  'Alheira':['carne','porco','gluten','cereal'],
  'Farinheira':['carne','porco','gluten','cereal'],
  'Pasta de aves (paté), caseira':['carne'],
  'Bolacha Maria':['gluten','cereal'], 'Muffin inglês':['gluten','cereal'],
  'Burrata':['lacticinio'],
  'Molho para francesinha':['gluten','lacticinio','alcool','carne','porco'],
  'Molho branco com caldo de carne de vaca':['gluten','cereal','lacticinio','carne','aipo'],
  'Óleo "Becel"':[], 'Óleo alimentar':[], 'Óleo de girassol':[], 'Óleo de milho':[],
  'Óleo de palma':[], 'Óleo de linhaça':[], 'Óleo de amendoim':['amendoim','leguminosa'],
  'Óleo de soja':['soja','leguminosa'], 'Soja, farinha com baixo teor de gordura':['soja','leguminosa'],
  'Soja, grão seco, cru':['soja','leguminosa'], 'Proteína texturizada de soja':['soja','leguminosa'],
  'Wasabi, raiz crua':['picante'], 'Caseína':['lacticinio'],
  'Túbera (trufa) crua':[], 'Salicórnia fresca':[], 'Sementes de coentro':[],
  'Sementes de girassol, cruas, secas, miolo':[], 'Sementes de papoila':[],
  'Sementes de cânhamo secas':[], 'Sementes de melão':[],
  'Pimenta branca':[], 'Pimenta moída':[]
};
/* AVISO A QUEM EDITAR ESTA TABELA: uma chave repetida num literal de objeto
   não dá erro — a última cala a primeira, e um alergénio desaparece em
   silêncio. Já aconteceu aqui: 'Picles de pepino' ficou declarado duas vezes
   e os sulfitos evaporaram-se. A bateria de testes verifica as repetições
   sobre o próprio ficheiro; ao acrescentar um nome, procura-o primeiro. */
const _atribIng=Object.create(null);
function atributosIng(nome){
  if(nome in _atribIng) return _atribIng[nome];
  let t;
  if(temChave(ING_EXCECAO,nome)) t=ING_EXCECAO[nome].slice();
  else { t=[]; ING_REGRAS.forEach(([tag,re])=>{ if(re.test(nome)) t.push(tag); }); }
  _atribIng[nome]=t; return t;
}

/* ================= DIETAS DE CADA RECEITA =================
   Keto, low carb e low fat não se etiquetam à mão: são contas, e uma conta
   feita à mão desalinha-se do prato mais cedo ou mais tarde. Derivam-se dos
   próprios números da receita, e por isso não podem mentir. Mediterrânica,
   paleo e vegetariana continuam declaradas — são critérios de composição, não
   de aritmética — mas a vegetariana é verificada contra os ingredientes: uma
   receita com carne perde a etiqueta mesmo que a tenha escrita. */
const GORD_TETO_LOWFAT=0.30;
const DIETA_VETA={ vegetariana:['carne','peixe','crustaceos','moluscos'],
                   vegan:['carne','peixe','crustaceos','moluscos','lacticinio','ovo','mel'],
                   paleo:['gluten','lacticinio','leguminosa','cereal'] };
const DIETAS_NUM=['keto','lowcarb','lowfat'];
function dietasDaReceita(r){
  /* Vegetariana, vegan e paleo derivam-se SÓ dos ingredientes — nem sequer se
     aceita a declaração, porque a declaração pode mentir e os ingredientes
     não. Sobra a mediterrânica, que é um estilo e não uma exclusão, e por
     isso continua a ser declarada em cada receita. */
  const DERIVADAS=['vegetariana','vegan','paleo'];
  const d=r.d.filter(x=>DIETAS_NUM.indexOf(x)<0 && DERIVADAS.indexOf(x)<0
    && !(DIETA_VETA[x]||[]).some(t=>r.at.indexOf(t)>=0));
  DERIVADAS.forEach(x=>{ if(!DIETA_VETA[x].some(t=>r.at.indexOf(t)>=0)) d.push(x); });
  if(hcLiq(r)<=HC_TETO.keto) d.push('keto');
  if(hcLiq(r)<=HC_TETO.lowcarb) d.push('lowcarb');
  if(r.f*9<=r.k*GORD_TETO_LOWFAT) d.push('lowfat');
  return d;
}
/* Os macros de cada receita são recalculados a partir dos ingredientes, com a
   mesma função que serve as receitas escritas por quem usa a app. Os números
   que estão escritos em cada R() eram estimativas à mão, e estavam
   sistematicamente baixos — uma quiche com 80 g de massa quebrada e 80 ml de
   natas não são 510 kcal, são perto do dobro. Ficam como recurso: se algum
   ingrediente perder a composição, é melhor um valor aproximado do que um
   total incompleto que parece exato. */
RECIPES.forEach(r=>{
  const m=macrosDeIngredientes(r.i,1);
  if(!m.semDados.length){
    r.k=m.k; r.c=Math.round(m.c); r.p=Math.round(m.p); r.f=Math.round(m.f); r.fib=Math.round(m.fib);
  }
  const s=[]; r.i.forEach(x=>atributosIng(x[0]).forEach(t=>{ if(s.indexOf(t)<0) s.push(t); }));
  r.at=s;
});
RECIPES.forEach(r=>{ r.dc=dietasDaReceita(r); });

/* ================= O QUE UM MEMBRO NÃO COME =================
   Duas origens, uma lista: o que a pessoa declarou (alergia, intolerância,
   escolha) e o que a dieta implica — quem come vegetariano não come carne
   nem peixe, esteja isso escrito ou não. */
/* dietaDe() devolve o objeto com as percentagens; para procurar por chave é
   preciso a chave, saneada — um valor estragado numa cópia importada não pode
   fazer com que nada seja compatível com ninguém. */
function chaveDieta(m){
  if(!m) return 'equilibrada';
  return m.dieta==='personalizada'? 'personalizada' : (temChave(DIETS,m.dieta)? m.dieta : 'equilibrada');
}
/* Chamada milhares de vezes por render (cada receita × cada membro), e o
   resultado só depende da dieta e das exclusões da pessoa. A chave da cache
   guarda exatamente essas entradas, por isso nunca fica velha — não é preciso
   invalidar nada quando o estado muda. */
const _restrCache=Object.create(null);
function restricoesDe(m){
  const chave=(m&&m.id||'')+'|'+chaveDieta(m)+'|'+((m&&Array.isArray(m.restricoes))? m.restricoes.join(','):'');
  const guardado=_restrCache[chave];
  if(guardado) return guardado;
  const base=Array.isArray(m.restricoes)? m.restricoes.filter(k=>temChave(RESTR,k)) : [];
  const dieta=DIETA_VETA[chaveDieta(m)]||[];
  return _restrCache[chave]=base.concat(dieta.filter(t=>base.indexOf(t)<0));
}
function ingredientesVetados(r,m){
  const veta=restricoesDe(m); if(!veta.length) return [];
  return r.i.filter(x=>atributosIng(x[0]).some(t=>veta.indexOf(t)>=0)).map(x=>x[0]);
}
/* Separa o que é alergia do que é escolha: a mensagem, a cor e a insistência
   não podem ser as mesmas. Devolve, por alergénio, os ingredientes que o
   trazem — dizer «contém glúten: Pão rústico» é mais útil, e mais verificável,
   do que dizer «não compatível». */
function alergenicosDe(r,m){
  const veta=restricoesDe(m).filter(ehAlergenio);
  const out=[];
  veta.forEach(t=>{
    const itens=r.i.filter(x=>atributosIng(x[0]).indexOf(t)>=0).map(x=>x[0]);
    if(itens.length) out.push({tag:t, nome:RESTR[t].n, itens});
  });
  return out;
}
function avisoAlergia(r,membros,forte){
  const linhas=[];
  (membros||[]).forEach(m=>{
    const al=alergenicosDe(r,m);
    if(al.length) linhas.push(esc(m.nome.split(' ')[0])+': '+al.map(a=>a.nome.toLowerCase()+' ('+a.itens.map(esc).join(', ')+')').join('; '));
  });
  if(!linhas.length) return '';
  return `<div class="alerta${forte?' forte':''}"><span aria-hidden="true">🚨</span><span>Alergénio — ${linhas.join(' · ')}</span></div>`;
}
/* Os alertas de um dia do plano: por refeição, quem come o quê que não pode. */
function alertasDoDia(di,date){
  const w=planWeek(), out=[];
  MEALK.forEach(mk=>{
    const meal=w[di]&&w[di][mk]; if(!meal||!meal.r) return;
    const comem=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,date));
    [meal.r].concat(acIds(meal)).filter(Boolean).forEach(rid=>{
      const r=RECIPES.find(x=>x.id===rid); if(!r) return;
      if(comem.some(m=>alergenicosDe(r,m).length)) out.push(mk);
    });
  });
  return [...new Set(out)];
}
function toggleRestricao(mid,k){
  const m=S.members.find(x=>x.id===mid); if(!m||!temChave(RESTR,k)) return;
  if(!Array.isArray(m.restricoes)) m.restricoes=[];
  const i=m.restricoes.indexOf(k);
  i>=0? m.restricoes.splice(i,1) : m.restricoes.push(k);
  save('restrições de '+m.nome); render();
}

/* ================= ESCALA DAS QUANTIDADES =================
   A receita é escrita para uma pessoa. Tudo o que a mostra a uma mesa —
   sugestão, plano, lista de compras — multiplica pelo número de comensais,
   e este é o único sítio onde essa multiplicação acontece. */
function escalaIngredientes(r,n,fator){
  const q=Math.max(1,n||1)*(fator===undefined? 1 : fator);
  return r.i.map(([nome,quant,un])=>({n:nome, q:quant*q, u:un}));
}
function fmtQtd(quant,un){
  const q=Math.round(quant*100)/100;
  if(un==='g'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' kg';
  if(un==='ml'&&q>=1000) return nPT(q/1000, q%1000?1:0)+' L';
  return nPT(q, Number.isInteger(q)?0:(Number.isInteger(q*10)?1:2))+' '+un;
}
function textoEscala(r,n,fator){
  return escalaIngredientes(r,n,fator).map(x=>esc(x.n)+' '+fmtQtd(x.q,x.u)).join(' · ');
}

/* ================= TETO CALÓRICO POR REFEIÇÃO =================
   Cada refeição tem a sua fatia do dia (25% ao pequeno-almoço, 35% ao almoço,
   e por aí). Uma receita que sozinha ultrapasse essa fatia com folga não serve
   àquela pessoa naquele lugar do dia — é comida a mais, não é uma questão de
   gosto. A folga de 10% existe porque uma dose não é um instrumento de
   medida. Bebés não entram: comem do módulo de alimentação infantil. */
const FOLGA_TETO=1.10;
function fatiaRefeicao(mk){ const m=MEALS.find(x=>x[0]===mk); return m? m[2] : 0.30; }
function tetoRefeicao(m,mk){ return targetKcal(m)*fatiaRefeicao(mk)*FOLGA_TETO; }
function contaTeto(m){ return faseDe(m)!=='bebe' && !semEstimativa(m); }
/* Dose sugerida para quem tem um teto abaixo da receita: a criança não come a
   mesma quantidade que o pai, e dizer isso é mais honesto do que esconder a
   receita toda. */
function doseSugerida(m,r,mk){
  if(!contaTeto(m)||!r.k) return 1;
  return clampNum(Math.round(tetoRefeicao(m,mk)/r.k*10)/10, 0.3, 1.5);
}

/* ================= AVALIAÇÃO DE UMA RECEITA PARA UMA MESA =================
   Devolve sempre o porquê, nunca só um sim ou não: a lista de sugestões
   mostra quantas receitas caíram por cada motivo, e sem isso ninguém percebe
   porque é que uma família de quatro só tem três jantares possíveis. */
function avaliaReceita(r,membros,mk,comTeto){
  const fora={dieta:[],ingredientes:[],calorias:[]};
  membros.forEach(m=>{
    if(!compat(r,chaveDieta(m))) fora.dieta.push(m);
    const veto=ingredientesVetados(r,m);
    if(veto.length) fora.ingredientes.push({m,itens:veto});
    if(comTeto && contaTeto(m) && r.k>tetoRefeicao(m,mk)) fora.calorias.push({m,teto:Math.round(tetoRefeicao(m,mk))});
  });
  const motivo = fora.dieta.length? 'dieta' : fora.ingredientes.length? 'ingredientes'
    : fora.calorias.length? 'calorias' : null;
  return {ok:!motivo, motivo, fora};
}


/* ================= DESPENSA =================
   O catálogo é a tabela de composição inteira — nunca texto livre. É isso que
   garante que um nome na despensa bate sempre certo, byte a byte, com o nome
   de um ingrediente de receita: sem correspondência aproximada, sem "Azeite"
   a não bater com "azeite". E é a tabela toda, não só o que as receitas da
   biblioteca usam, porque quem escreve uma receita em casa precisa de
   escolher entre tudo o que existe — e tudo o que existe tem composição para
   se calcular. */
let _catalogo=null;
function catalogoIngredientes(){
  if(!_catalogo) _catalogo=Object.keys(NUTRI).sort((a,b)=>a.localeCompare(b,'pt'));
  return _catalogo;
}
/* A despensa guarda ingredientes e suplementos com a mesma chave — o nome —
   por isso o catálogo que a valida tem de conhecer os dois. Os suplementos
   são declarados depois, daí a leitura preguiçosa. */
function catalogoDespensa(){
  const s=typeof SUPLEMENTOS!=='undefined'? SUPLEMENTOS.map(x=>x.nome) : [];
  return catalogoIngredientes().concat(s);
}
function temNaDespensa(nome){ return !!S.despensa[nome]; }
function disponibilidadeReceita(r){
  const total=r.i.length, tem=r.i.filter(x=>temNaDespensa(x[0])).length;
  return {tem, total, pronta: total>0 && tem===total};
}
/* Lista de ingredientes com o estado da despensa — usada em qualquer sítio
   que mostre uma receita, não só no separador Receitas. */
function listaIngredientesComEstado(r,n){
  const q=Math.max(1,parseInt(n,10)||1);
  return r.i.map(([nome,quant,u])=>{
    const tem=temNaDespensa(nome);
    return `<span class="ingr ${tem?'tem':'falta'}"><i aria-hidden="true">${tem?'✓':'✗'}</i>${esc(nome)}
      <b>${fmtQtd(quant*q,u)}</b></span>`;
  }).join('');
}

/* ================= ESTADO ================= */
const KEY='familiaFitV1', APPID='familia-fit', FORMATO=1;
let saveErr='', msg=null;
function blank(){ return {members:[],cheats:{},plans:{},bought:{},prefCuisine:'todas',objetivos:[],despensa:{},
  receitas:[],
  /* medicoes: {membro:[{d,p}]} por ordem de data — o peso deixa de ser um
     número solto e passa a ter história. regAtiv/regRef: o que foi mesmo
     feito e comido, por oposição ao plano, que é o que se tenciona fazer. */
  medicoes:{}, regAtiv:[], regRef:[],
  /* sobras: o tacho que dá para dois dias. precos: o que o talão disse, para
     a app estimar custos sem inventar um único cêntimo. festas: as datas da
     casa que não são aniversários. */
  sobras:[], precos:{}, festas:[], casa:{nome:'',lema:''}, pausas:[], diario:[],
  /* preferências de cozinha da casa: repetir pratos na semana, cozinhar em
     dobro, seguir a época e preparar de véspera — o que muda como se sugere */
  cozPref:{repetir:false, dobro:false, sazonal:false, prep:true, cartaoEpoca:true},
  ui:{tab:'familia',mid:null,cuis:'todas',soComp:false,mealF:'todas',dietaF:'todas',busca:'',editor:null,
      objForm:{membros:[],tipo:'perder',delta:5,semanas:12,split:50,desporto:null,banda:2},
      objExpandido:null, objAdj:null, celebrando:null, tourPasso:null, tourVisto:false,
      tema:'auto', paleta:'azulejo', colapsados:{}, alergF:'', alergDesp:'',
      recLimite:48, recTodas:false,
      sug:{membros:null,ref:'a',teto:true,cuis:'todas',verFora:false}, porcoes:null,
      histAtiv:null, histRef:null, janelaPeso:'mes', linhasPeso:{ativ:false,kcal:false},
      formAtiv:null, formRef:null, medForm:null, comprasConf:null,
      densidade:'folgado', sazonal:false, anim:true, folha:null, mercado:false, modal:null,
      cozinha:null, precos:false, soEpoca:false, convAberto:null,
      mercVista:'compras', capaAberta:false, fecho:null, passosFeitos:false,
      pesqAberta:false, pesqQ:'', semPalpite:[], ficha:null, catF:''},
  week:mondayISO(new Date()),
  meta:{gravadoEm:null,exportadoEm:null,semCopia:false,avisarAoSair:true,desdeRegisto:null}}; }
let S = load();
sincronizaReceitas();   /* as receitas da casa entram na biblioteca antes do primeiro render */
migraRegistos(S);       /* e só depois se validam os registos, que podem apontar a elas */
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || !Array.isArray(s.members)) return blank();
  const b=blank();
  if(!dataValida(s.week)) s.week=mondayISO(new Date());   /* semana corrompida não prende a app */
  s.members.forEach(normalizaMembro);
  s.receitas=Array.isArray(s.receitas)? s.receitas.map(limparReceita).filter(Boolean) : [];
  return Object.assign(b, s, {ui:Object.assign(b.ui,s.ui||{}), meta:Object.assign(b.meta,s.meta||{})});
}
function writeLS(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); saveErr=''; }
  catch(e){ saveErr = e.name==='QuotaExceededError'
    ? 'Não há espaço para gravar mais dados neste browser. Exporta uma cópia e apaga semanas antigas.'
    : 'O browser está a bloquear a gravação local. Em janela privada os dados perdem-se ao fechar — exporta uma cópia.'; }
  paintSave();
}
/* save() = alteração de dados: grava e marca que ainda não há cópia exportada.
   saveMeta() = alteração só de definições: grava sem mexer nesse estado. */
/* ===== DESFAZER =====
   O instantâneo guarda só os dados; a navegação e as preferências de ecrã
   ficam de fora, para desfazer nunca saltar de separador sozinho. Como o
   save() corre depois da alteração, o que se empilha é o estado anterior —
   e num arrasto de slider isso é o estado de antes do gesto começar. */
const UNDO_MAX=30;
let pilhaUndo=[], pilhaRedo=[], estadoAnterior=null, ultimaDesc=null;
function instantaneo(){ return JSON.stringify({members:S.members, cheats:S.cheats, plans:S.plans,
  bought:S.bought, week:S.week, prefCuisine:S.prefCuisine, objetivos:S.objetivos, despensa:S.despensa,
  receitas:S.receitas, medicoes:S.medicoes, regAtiv:S.regAtiv, regRef:S.regRef,
  sobras:S.sobras, precos:S.precos, festas:S.festas, casa:S.casa, pausas:S.pausas, diario:S.diario, cozPref:S.cozPref}); }
function aplicaInstantaneo(js){
  const d=JSON.parse(js);
  S.members=d.members; S.cheats=d.cheats; S.plans=d.plans; S.bought=d.bought;
  S.week=d.week; S.prefCuisine=d.prefCuisine; S.objetivos=d.objetivos||[]; S.despensa=d.despensa||{};
  S.receitas=Array.isArray(d.receitas)? d.receitas : [];
  S.medicoes=d.medicoes&&typeof d.medicoes==='object'? d.medicoes : {};
  S.regAtiv=Array.isArray(d.regAtiv)? d.regAtiv : [];
  S.regRef=Array.isArray(d.regRef)? d.regRef : [];
  S.sobras=Array.isArray(d.sobras)? d.sobras : [];
  S.precos=d.precos&&typeof d.precos==='object'? d.precos : {};
  S.festas=Array.isArray(d.festas)? d.festas : [];
  S.casa=d.casa&&typeof d.casa==='object'? d.casa : {nome:'',lema:''};
  S.pausas=Array.isArray(d.pausas)? d.pausas : [];
  S.diario=Array.isArray(d.diario)? d.diario : [];
  S.cozPref=limparCozPref(d.cozPref);
  sincronizaReceitas();
  S.members.forEach(normalizaMembro);
  if(!S.members.some(m=>m.id===S.ui.mid)) S.ui.mid=S.members[0]? S.members[0].id : null;
  macroLive=null;
  estadoAnterior=instantaneo();
  S.meta.gravadoEm=new Date().toISOString(); S.meta.semCopia=true; writeLS(); render();
}
function desfazer(){
  if(!pilhaUndo.length) return;
  const e=pilhaUndo.pop();
  pilhaRedo.push({js:instantaneo(), desc:e.desc});
  const d=e.desc; aplicaInstantaneo(e.js);
  toast('Desfeito'+(d? ': '+d : ''));
}
function refazer(){
  if(!pilhaRedo.length) return;
  const e=pilhaRedo.pop();
  pilhaUndo.push({js:instantaneo(), desc:e.desc});
  const d=e.desc; aplicaInstantaneo(e.js);
  toast('Refeito'+(d? ': '+d : ''));
}
let _toastT=null;
function toast(txt){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=txt; el.style.opacity='1';
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>{ el.style.opacity='0';
    _toastT=setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },250); }, 2600);
}
function pintaHist(){
  const u=document.getElementById('btn-undo'), r=document.getElementById('btn-redo');
  if(u){ u.disabled=!pilhaUndo.length;
    u.title=pilhaUndo.length? 'Desfazer'+(pilhaUndo[pilhaUndo.length-1].desc? ': '+pilhaUndo[pilhaUndo.length-1].desc:'')+' (Ctrl+Z)' : 'Nada para desfazer'; }
  if(r){ r.disabled=!pilhaRedo.length;
    r.title=pilhaRedo.length? 'Refazer (Ctrl+Shift+Z)' : 'Nada para refazer'; }
}
function save(desc){
  const agora=instantaneo();
  if(estadoAnterior!==null && estadoAnterior!==agora){
    pilhaUndo.push({js:estadoAnterior, desc:desc||ultimaDesc||null});
    if(pilhaUndo.length>UNDO_MAX) pilhaUndo.shift();
    pilhaRedo=[];
  }
  ultimaDesc=null;
  estadoAnterior=agora;

function uid(){ return 'm'+Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= CÁLCULOS ================= */
function bmi(m){ const h=m.altura/100; return h>0? m.peso/(h*h) : 0; }
function bmiClass(v){ return v<18.5?['Abaixo do peso','warn']: v<25?['Peso normal','ok']: v<30?['Excesso de peso','warn']:['Obesidade','bad']; }

/* ===== FASES DA VIDA =====
   As fórmulas de adulto não servem para crianças nem para a gravidez. Cada
   fase traz a sua equação, a sua faixa de macros e os seus limites de esforço.
   Referências: IOM/DRI (2002/2005), Schofield (1985), IOM/NRC (2009),
   OMS (2020) e ACOG (Practice Bulletin 804/231). São valores de referência
   populacional, não prescrição — a app di-lo em cada ecrã onde importa. */
function idadeMeses(m){ return Number.isFinite(m.meses)? m.meses : (parseFloat(m.idade)||0)*12; }
function idadeAnos(m){ return idadeMeses(m)/12; }
/* Dois anos é o valor mínimo medido em anos; abaixo disso mede-se sempre em
   meses (0-24). Esta função é o único sítio que decide a fronteira e mantém
   m.meses/m.idade coerentes entre si — chamada em qualquer caminho que mude
   a idade (edição direta, sliders, escolha de fase, importação), para a
   representação nunca ficar presa no lado errado da fronteira. */
function normalizaIdadeMeses(m){
  if(Number.isFinite(m.meses)){
    m.meses=clampNum(Math.round(m.meses),0,24);
    if(m.meses>=24){ m.idade=2; delete m.meses; }
    else m.idade=m.meses/12;
  } else if((parseFloat(m.idade)||0)<2){
    m.meses=clampNum(Math.round((parseFloat(m.idade)||0)*12),0,24);
    m.idade=m.meses/12;
  }
}
function gravida(m){ return m.sexo==='f' && !!m.gravida && idadeAnos(m)>=12; }
function fetos(m){ return clampNum(Math.round(parseFloat(m.fetos)||1),1,3); }
function trimestre(m){ return clampNum(Math.round(parseFloat(m.trimestre)||1),1,3); }
function faseDe(m){
  const a=idadeAnos(m);
  if(a<2) return 'bebe';
  if(a<13) return 'crianca';
  if(a<19) return 'adolescente';
  return 'adulto';
}
const FASES={bebe:'Bebé',crianca:'Criança',adolescente:'Adolescente',adulto:'Adulto'};
function nomeFase(m){ return gravida(m)? (FASES[faseDe(m)]+' · grávida') : FASES[faseDe(m)]; }
/* O peso de referência da grávida é o pré-gestacional: é sobre ele que as
   recomendações são construídas. O peso atual serve para acompanhar o ganho. */
function pesoRef(m){ const p=parseFloat(m.pesoPre);
  return gravida(m) && isFinite(p) && p>0 ? p : m.peso; }
/* Metabolismo basal: Schofield abaixo dos 19 anos, Mifflin-St Jeor a partir
   daí — os perfis adultos que já existiam mantêm o valor exato. */
function bmr(m){
  const a=idadeAnos(m), p=pesoRef(m), f=m.sexo==='f';
  if(a<19){
    if(a<3)  return f? 58.317*p-31.1 : 59.512*p-30.4;
    if(a<10) return f? 20.315*p+485.9 : 22.706*p+504.3;
    return   f? 13.384*p+692.6 : 17.686*p+658.2;
  }
  /* pesoRef é o peso do próprio, exceto na gravidez, onde é o pré-gestacional */
  return f ? 10*p+6.25*m.altura-5*m.idade-161 : 10*p+6.25*m.altura-5*m.idade+5;
}
/* Energia de crescimento, que só existe enquanto o corpo está a crescer. */
function crescimentoKcal(m){
  const meses=idadeMeses(m), a=meses/12;
  if(meses<4) return 175;
  if(meses<7) return 56;
  if(meses<13) return 22;
  if(a<3) return 20;
  if(a<9) return 20;
  if(a<19) return 25;
  return 0;
}
/* Incremento da gravidez (IOM/DRI): nada no 1.º trimestre, +340 no 2.º,
   +452 no 3.º. Para gémeos não há DRI — usa-se um acréscimo declarado como
   aproximação. Para trigémeos não existe valor defensável e a app recusa-se
   a inventar um. */
function gravidezKcal(m){
  if(!gravida(m)) return 0;
  const t=trimestre(m), n=fetos(m);
  const base = t===1? 0 : t===2? 340 : 452;
  if(n===1) return base;
  if(n===2) return base===0? 0 : base+350;
  return 0;   /* trigémeos: sem estimativa — ver avisoGravidez() */
}
function semEstimativa(m){ return gravida(m) && fetos(m)>=3; }
function tdee(m){ return bmr(m)*(temChave(BASE_ACT,m.atividade)?BASE_ACT[m.atividade][1]:1.2)
  + sportsKcalDay(m) + commuteKcalDay(m) + crescimentoKcal(m) + gravidezKcal(m); }
/* Faixas de distribuição de macronutrientes aceitáveis (AMDR, IOM/DRI).
   Abaixo dos 12 meses não estão definidas — não se aplicam percentagens. */
function amdrDe(m){
  const a=idadeAnos(m);
  if(a<1) return null;
  if(a<4)  return {c:[45,65],p:[5,20], f:[30,40]};
  if(a<19) return {c:[45,65],p:[10,30],f:[25,35]};
  return {c:[45,65],p:[10,35],f:[20,35]};
}
/* Proteína de referência em g por kg de peso e por dia. */
function proteinaKg(m){
  if(gravida(m)) return 1.1;
  const meses=idadeMeses(m), a=meses/12;
  if(meses<7) return 1.52;
  if(meses<13) return 1.2;
  if(a<4) return 1.05;
  if(a<14) return 0.95;
  if(a<19) return 0.85;
  return 0.8;
}
/* Piso absoluto de hidratos (RDA), que manda acima da percentagem. */
function hidratosMin(m){ if(idadeAnos(m)<1) return 0; return gravida(m)? 175 : 130; }
/* Um défice calórico não é para crianças, adolescentes em crescimento nem
   grávidas — o slider de objetivo fica limitado a manutenção ou acima. */
function permiteDefice(m){ return faseDe(m)==='adulto' && !gravida(m); }
function permiteProjecao(m){ return permiteDefice(m); }

const CAT_SUPL={proteico:'Proteicos',vitaminico:'Vitaminas',mineral:'Minerais',composto:'Compostos e outros'};

const SUPLEMENTOS=[

const SUPL={}; SUPLEMENTOS.forEach(s=>{ SUPL[s.id]=s; });
const MICROS=[['vitD','Vitamina D','µg'],['ferro','Ferro','mg'],['calcio','Cálcio','mg'],

/* Doses de referência (RDA/AI) por fase, e limites superiores toleráveis (UL)
   do Institute of Medicine. O UL é o que importa aqui: suplementar acima
   dele deixa de ser inócuo, sobretudo em crianças e na gravidez. */
function ddrMicro(m){
  const a=idadeAnos(m), meses=idadeMeses(m), f=m.sexo==='f';
  if(gravida(m)) return {vitD:15,ferro:27,calcio:1000,magnesio:350,b12:2.6,folato:600,vitC:85,zinco:11,omega3:null};

  if(meses<13) return {vitD:10,ferro:11,calcio:260,magnesio:75,b12:0.5,folato:80,vitC:50,zinco:3,omega3:null};
  if(a<4)  return {vitD:15,ferro:7,calcio:700,magnesio:80,b12:0.9,folato:150,vitC:15,zinco:3,omega3:null};

function ulMicro(m){

  if(meses<7)  return {vitD:25,ferro:40,calcio:1000,magnesio:null,folato:null,vitC:null,zinco:4,b12:null,omega3:null};
  if(meses<13) return {vitD:38,ferro:40,calcio:1500,magnesio:null,folato:null,vitC:null,zinco:5,b12:null,omega3:null};
  if(a<4)  return {vitD:63,ferro:40,calcio:2500,magnesio:65,folato:300,vitC:400,zinco:7,b12:null,omega3:null};

function suplementosDe(m){
  return (m.suplementos||[]).filter(s=>s&&temChave(SUPL,s.s)&&(parseFloat(s.doses)||0)>0);
}
/* O que os suplementos acrescentam por dia — macros e micronutrientes. */
function totalSuplementos(m){
  const t={kcal:0,c:0,p:0,f:0,micros:{}};
  suplementosDe(m).forEach(s=>{
    const sp=SUPL[s.s], d=parseFloat(s.doses)||0;
    t.kcal+=sp.kcal*d; t.c+=sp.c*d; t.p+=sp.p*d; t.f+=sp.f*d;
    Object.keys(sp.micros).forEach(k=>{ t.micros[k]=(t.micros[k]||0)+sp.micros[k]*d; });
  });
  return t;
}
/* Quanto de cada macro fica a cargo da comida, depois de descontar os
   suplementos: é este o número que interessa a quem vai cozinhar. */
function macrosRestantes(m){
  const alvo=macros(m), sup=totalSuplementos(m);
  return {c:Math.max(0,Math.round(alvo.c-sup.c)), p:Math.max(0,Math.round(alvo.p-sup.p)),
    f:Math.max(0,Math.round(alvo.f-sup.f)), kcal:Math.max(0,Math.round(targetKcal(m)-sup.kcal))};
}
/* Micronutrientes acima do limite superior tolerável — o aviso que justifica
   a existência desta tabela. */
function excessosMicro(m){
  const t=totalSuplementos(m).micros, ul=ulMicro(m), fora=[];
  MICROS.forEach(([k,nome,un])=>{
    if(ul[k]!=null && t[k]!=null && t[k]>ul[k]) fora.push({k,nome,un,valor:t[k],ul:ul[k]});
  });
  return fora;
}

/* ===== NUTRIÇÃO DO BEBÉ =====
   Peso para a idade, percentis 3/15/50/85/97, em quilogramas. Valores
   transcritos das "Simplified field tables — Weight-for-age" oficiais da
   OMS (WHO Child Growth Standards, 2006) — cdn.who.int/.../sft-wfa-boys-p-0-5.pdf
   e .../sft-wfa-girls-p-0-5.pdf. Entre os meses tabelados interpola-se. */
const WHO_MESES=[0,3,6,9,12,15,18,21,24];
const WHO_PESO={
  m:[[2.5,2.9,3.3,3.9,4.3],[5.1,5.6,6.4,7.2,7.9],[6.4,7.1,7.9,8.9,9.7],[7.2,7.9,8.9,10.0,10.9],
     [7.8,8.6,9.6,10.8,11.8],[8.4,9.2,10.3,11.6,12.7],[8.9,9.7,10.9,12.3,13.5],
     [9.3,10.3,11.5,13.0,14.3],[9.8,10.8,12.2,13.7,15.1]],
  f:[[2.4,2.8,3.2,3.7,4.2],[4.6,5.1,5.8,6.7,7.4],[5.8,6.4,7.3,8.3,9.2],[6.6,7.3,8.2,9.3,10.4],
     [7.1,7.9,8.9,10.2,11.3],[7.7,8.5,9.6,10.9,12.2],[8.2,9.0,10.2,11.6,13.0],
     [8.7,9.6,10.9,12.4,13.8],[9.2,10.1,11.5,13.1,14.6]]
};
const PERCENTIS=[3,15,50,85,97];
function pesosPercentis(sexo,meses){
  const t=WHO_PESO[sexo==='f'?'f':'m'], x=clampNum(meses,0,24);
  let i=0; while(i<WHO_MESES.length-2 && x>WHO_MESES[i+1]) i++;
  const a=WHO_MESES[i], b=WHO_MESES[i+1], r=(b>a)?(x-a)/(b-a):0;
  return t[i].map((v,k)=>v+(t[i+1][k]-v)*r);
}
/* Percentil aproximado do peso atual, por interpolação entre as curvas. */
function percentilDe(m){
  const v=pesosPercentis(m.sexo,idadeMeses(m)), p=m.peso;
  if(p<=v[0]) return {p:3,abaixo:true};
  if(p>=v[4]) return {p:97,acima:true};
  for(let i=1;i<v.length;i++) if(p<=v[i]){
    const r=(v[i]-v[i-1])>0? (p-v[i-1])/(v[i]-v[i-1]) : 0;
    return {p: PERCENTIS[i-1]+(PERCENTIS[i]-PERCENTIS[i-1])*r}; }
  return {p:97};
}
function textoPercentil(m){
  const q=percentilDe(m);
  if(q.abaixo) return 'abaixo do percentil 3';
  if(q.acima) return 'acima do percentil 97';
  return 'percentil '+Math.round(q.p);
}
/* Doses diárias de referência para bebés e crianças pequenas. Fontes:
   energia — IOM, "Dietary Reference Intakes for Energy, Carbohydrate,
   Fiber, Fat, Fatty Acids, Cholesterol, Protein, and Amino Acids" (2002/
   2005), equação de EER para lactentes/1-3 anos; proteína, hidratos,
   gordura e água — mesmo relatório; ferro — IOM (2001), "...Iron...";
   cálcio e vitamina D — IOM, "Dietary Reference Intakes for Calcium and
   Vitamin D" (2011). A vitamina D SOBE de 10 para 15 µg (400→600 UI)
   exatamente na transição de lactente (AI, 0-12 meses) para 1-3 anos
   (RDA) — não é um valor único para toda a primeira infância. */
function ddrBebe(m){
  const meses=idadeMeses(m), p=m.peso;
  const kcal=(89*p-100)+crescimentoKcal(m);
  let prot,hc,gord,agua,ferro,calcio,vitD;
  if(meses<7){ prot=1.52*p; hc=60; gord=31; agua=700; ferro=0.27; calcio=200; vitD=10; }
  else if(meses<13){ prot=1.2*p; hc=95; gord=30; agua=800; ferro=11; calcio=260; vitD=10; }
  else { prot=1.05*p; hc=130; gord=kcal*0.35/9; agua=1300; ferro=7; calcio=700; vitD=15; }
  return {kcal:Math.round(kcal), prot:Math.round(prot*10)/10, hc:Math.round(hc),
    gord:Math.round(gord), agua, ferro, calcio, vitD};
}
/* Leite: 67 kcal por 100 mL — o padrão clássico de 20 kcal/oz (AAP), dentro
   do intervalo regulatório do Codex Alimentarius CXS 72-1981 e do consenso
   ESPGHAN (Koletzko et al., 2005) de 60-70 kcal/100 mL para fórmulas de
   início; valor médio de referência, não um número exato — a composição
   real varia por marca e, no leite materno, por fase da lactação. */
const KCAL_100ML=67;
/* Volume de referência em ml por kg e por dia: não é um patamar único, e
   decresce com a idade à medida que entram os sólidos. Âncoras a partir de
   HealthyChildren.org/AAP (150-180 ml/kg/dia nos primeiros 2 meses,
   decrescendo) e de dados de ingestão real de leite materno (IABLE/
   lacted.org: ~135 ml/kg/dia ao 1.º mês, ~126 aos 3, ~107 aos 6 meses).
   Interpola-se entre âncoras; o aviso soa a 35% de desvio do valor central,
   para não gerar falsos alarmes numa referência que já é aproximada. */
const ANCORAS_MLKG=[[0,160],[1,150],[3,125],[6,108],[9,98],[12,90],[24,90]];
function volumeRefMlKg(meses){
  const a=ANCORAS_MLKG; let i=0; while(i<a.length-2 && meses>a[i+1][0]) i++;
  const [m0,v0]=a[i], [m1,v1]=a[i+1], r=(m1>m0)?(meses-m0)/(m1-m0):0;
  return v0+(v1-v0)*r;

function fmtShort(isoD){ const d=new Date(isoD+'T12:00:00'); return d.getDate()+' '+['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()]; }

/* ================= MEDIÇÕES DE PESO =================
   O peso deixou de ser um número que se corrige e passou a ter história: cada
   pesagem fica com a sua data. O campo do perfil continua a existir e continua
   a mandar nos cálculos, mas agora é apenas o espelho da medição mais recente
   que já aconteceu — os dois nunca podem contar histórias diferentes. */
function medicoesDe(mid){ const a=S.medicoes&&S.medicoes[mid]; return Array.isArray(a)? a : []; }

   Antes da primeira pesagem devolve a primeira conhecida, porque extrapolar
   para trás um peso que ninguém mediu seria inventar. */
function pesoNaData(mid,d){
  const m=S.members.find(x=>x.id===mid);
  const a=medicoesDe(mid);
  if(!a.length) return m? m.peso : 0;
  let out=a[0].p;
  for(let i=0;i<a.length;i++){ if(a[i].d<=d) out=a[i].p; else break; }
  return out;
}
function sincronizaPeso(m){
  const a=medicoesDe(m.id); if(!a.length) return;

/* Registar uma pesagem antiga em quem ainda não tem nenhuma guardaria o peso

function registarMedicao(mid,d,p){
  const m=S.members.find(x=>x.id===mid); if(!m) return false;
  /* uma pesagem fora do que um corpo humano pesa é um engano de escrita, não
     um valor a aparar: aparar guardaria uma medição que ninguém fez */
  const kg=Math.round((parseFloat(p)||0)*10)/10;
  if(!isFinite(kg) || kg<1 || kg>400) return false;
  if(!dataValida(d) || d>hojeISO()) return false;

  if(!Array.isArray(S.medicoes[mid])) S.medicoes[mid]=[];

function apagarMedicao(mid,d){
  const arr=medicoesDe(mid); const i=arr.findIndex(x=>x.d===d);

  const m=S.members.find(x=>x.id===mid); if(m) sincronizaPeso(m);

/* ================= AGENDA DO PLANO DE ATIVIDADE =================

  const rec=RECIPES.find(x=>x.id===r.r); if(!rec) return {k:0,c:0,p:0,f:0};
  const acs=(r.ac||[]).map(id=>RECIPES.find(x=>x.id===id)).filter(Boolean);
  const dose=parseFloat(r.dose)||1;
  return {k:(rec.k+somaAc(acs,'k'))*dose, c:(rec.c+somaAc(acs,'c'))*dose,
          p:(rec.p+somaAc(acs,'p'))*dose, f:(rec.f+somaAc(acs,'f'))*dose};
}
/* Gasto real de um dia: o basal e o dia-a-dia não se registam (são o que o
   corpo faz de qualquer maneira), o desporto é o que ficou registado — não o
   que estava planeado. É esta a diferença entre plano e realidade. */
function gastoRealDia(m,d){
  const base=bmr(m)*(temChave(BASE_ACT,m.atividade)?BASE_ACT[m.atividade][1]:1.2)+commuteKcalDay(m);
  const desp=regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita').reduce((t,r)=>t+kcalRegAtiv(r),0);
  return {base, desp, total:base+desp};
}
function ingeridoRealDia(mid,d){
  return regRefDe(mid).filter(r=>r.d===d&&r.estado==='feita')
    .reduce((t,r)=>{ const x=macrosRegRef(r); return {k:t.k+x.k,c:t.c+x.c,p:t.p+x.p,f:t.f+x.f}; },{k:0,c:0,p:0,f:0});
}
/* Alvo do dia: o plano ajustado ao que se gastou a mais (ou a menos) do que o
   plano previa para aquele dia. Quem corre 10 km que não estavam marcados
   precisa de comer esse gasto para manter o mesmo défice — e dizer-lhe para
   comer o mesmo seria transformar um treino extra num défice a dobrar. */
function extraAtivDia(m,d){
  const feito=regAtivDe(m.id).filter(r=>r.d===d&&r.estado==='feita').reduce((t,r)=>t+kcalRegAtiv(r),0);
  const previsto=planeadasNoDia(m,d).reduce((t,p)=>t+p.kcal,0);
  return feito-previsto;
}
function alvoDoDia(m,d){
  if(semEstimativa(m)) return 0;
  return Math.max(bmr(m)*0.8, targetKcal(m)+extraAtivDia(m,d));
}

/* ================= VALIDAÇÃO DO QUE FICOU POR CONFIRMAR =================
   Ao entrar no perfil, o que estava marcado para trás e nunca foi confirmado
   aparece para validar. Só se olha para trás até ao dia em que esta app passou
   a guardar registos: perguntar por treinos de antes disso seria perguntar por
   uma coisa que nunca chegou a estar marcada. */
const JANELA_VALIDACAO=21;
function desdeRegisto(){
  if(!S.meta.desdeRegisto || !dataValida(S.meta.desdeRegisto)) S.meta.desdeRegisto=hojeISO();
  return S.meta.desdeRegisto;
}
function inicioValidacao(){
  const h=hojeISO(), limite=addDias(h,-JANELA_VALIDACAO), desde=desdeRegisto();
  return desde>limite? desde : limite;
}
function pendentesAtiv(m){
  if(!m) return [];
  const ini=inicioValidacao(), h=hojeISO(), out=[];
  for(let d=addDias(h,-1); d>=ini; d=addDias(d,-1)){
    planeadasNoDia(m,d).forEach(p=>{
      /* uma remarcação não fecha o dia de origem: é a falhada que o fecha */
      if((S.regAtiv||[]).some(r=>r.mid===m.id && r.d===d && r.plano===p.s.id && r.estado!=='agendada')) return;
      out.push({d, sid:p.s.id, s:p.s, min:p.min, kcal:p.kcal, reg:null});
    });
  }
  /* e o que foi remarcado para um dia que entretanto também já passou */
  (S.regAtiv||[]).filter(r=>r.mid===m.id && r.estado==='agendada' && r.d<h && r.d>=ini).forEach(r=>{
    out.push({d:r.d, sid:r.plano, s:(m.desportos||[]).find(x=>x.id===r.plano)||{s:r.s},
      min:r.min, kcal:Math.round(kcalRegAtiv(r)), reg:r});
  });
  return out.sort((a,b)=> a.d<b.d? 1 : a.d>b.d? -1 : 0);
}
function agendadasFuturas(mid){
  const h=hojeISO();
  return (S.regAtiv||[]).filter(r=>r.mid===mid && r.estado==='agendada' && r.d>=h).sort((a,b)=>a.d<b.d?-1:1);
}
function pendentesRef(m){
  if(!m) return [];
  const ini=inicioValidacao(), out=[];
  for(let d=addDias(hojeISO(),-1); d>=ini; d=addDias(d,-1)){
    if(isCheat(m.id,d)) continue;
    const dia=(S.plans[mondayISO(d)]||{})[diaSemana(d)];
    if(!dia) continue;
    MEALK.forEach(mk=>{
      const meal=dia[mk];
      if(!meal || !meal.r || !Array.isArray(meal.m) || meal.m.indexOf(m.id)<0) return;
      if(!RECIPES.some(x=>x.id===meal.r)) return;
      if((S.regRef||[]).some(r=>r.mid===m.id && r.d===d && r.mk===mk)) return;
      out.push({d, mk, meal});
    });
  }
  return out;
}

/* ---- Escrever registos ----
   Uma atividade ou refeição partilhada é um registo por pessoa ligado pelo
   mesmo grupo. Assim cada um tem o seu tempo, a sua dose e os seus
   acompanhamentos, e o grupo continua a saber que aquilo aconteceu à mesma
   mesa ou no mesmo passeio. */
function novoGrupo(){ return 'g'+Math.random().toString(36).slice(2,9); }
function registarAtividade(base,mids,estado){
  const grupo=mids.length>1? novoGrupo() : null;
  const criados=[];
  mids.forEach(mid=>{
    const m=S.members.find(x=>x.id===mid); if(!m) return;
    const ajuste=(base.porMembro&&base.porMembro[mid])||{};
    const r=limparRegAtiv(Object.assign({}, base, ajuste,
      {id:uid(), mid, grupo, estado:estado||'feita'}), S.members.map(x=>x.id));
    if(r){ S.regAtiv.push(r); criados.push(r); }
  });
  return criados;
}
function registarRefeicao(base,mids,estado){
  const grupo=mids.length>1? novoGrupo() : null;
  const criados=[];
  mids.forEach(mid=>{
    const ajuste=(base.porMembro&&base.porMembro[mid])||{};
    const r=limparRegRef(Object.assign({}, base, ajuste,
      {id:uid(), mid, grupo, estado:estado||'feita'}), S.members.map(x=>x.id));
    if(r){ S.regRef.push(r); criados.push(r); }
  });
  return criados;
}
function irmaosDe(lista,r){ return r.grupo? lista.filter(x=>x.grupo===r.grupo && x.id!==r.id) : []; }
/* Editar ou apagar um registo partilhado pergunta pelos outros: quem correu
   contigo pode ter corrido menos, mas se o passeio não aconteceu, não
   aconteceu para ninguém. */
function confirmaPartilha(irmaos,verbo){
  if(!irmaos.length) return false;
  const nomes=irmaos.map(x=>{ const m=S.members.find(y=>y.id===x.mid); return m? m.nome.split(' ')[0] : '?'; });
  return confirm('Esta era partilhada com '+nomes.join(', ')+'.\n\nQueres '+verbo+' também no registo '
    +(nomes.length===1? 'dessa pessoa' : 'dessas pessoas')+'?');
}

/* No telemóvel ao alto, a navegação desce para junto do polegar: os quatro
   separadores do dia a dia numa barra fixa em baixo, e o resto numa folha
   «Mais». Em paisagem, tablet e desktop fica tudo como está — pills no topo. */
const NAV_PRINCIPAL=['familia','nutricao','plano','mercearia'];
function modoBarraInferior(){
  const r=document.documentElement;
  return r.getAttribute('data-dispositivo')==='telefone' && r.getAttribute('data-orient')==='retrato';
}
/* Na barra do polegar não cabem nomes compridos: «Atividade Física» e «Plano
   de Refeições» encurtam-se, e o nome inteiro fica no separador de cima. */
function rotuloCurto(k){ const t=TABS.find(x=>x[0]===k);
  return t? t[1].replace(' Física','').replace(' de Refeições','') : k; }
function pintaNav(){
  const nav=document.getElementById('nav'); if(!nav) return;
  /* o crachá conta o que está por despachar naquele separador; o acento, que
     nesta app significa sempre «agora», diz onde é preciso ir sem abrir nada */
  const pend=pendentesPorSeparador();
  const btn=k=>`<button class="${S.ui.tab===k?'on':''}" onclick="go('${k}')">${icoNav(k)}<span>${rotuloCurto(k)}</span>${
    pend[k]? `<span class="cracha" aria-label="${pend[k]} por despachar">${pend[k]>99?'99+':pend[k]}</span>`:''}</button>`;
  let folha=document.getElementById('nav-mais');
  if(modoBarraInferior()){
    const resto=TABS.map(t=>t[0]).filter(k=>NAV_PRINCIPAL.indexOf(k)<0);
    nav.innerHTML=NAV_PRINCIPAL.map(btn).join('')
      +`<button id="nav-btn-mais" class="${resto.indexOf(S.ui.tab)>=0?'on':''}" aria-expanded="false"
         aria-controls="nav-mais" onclick="alternarNavMais(event)">${icoNav('mais')}<span>Mais</span></button>`;
    if(!folha){ folha=document.createElement('div'); folha.id='nav-mais'; document.body.appendChild(folha); }
    folha.innerHTML=resto.map(btn).join('');
    folha.classList.remove('aberta');
  } else {
    nav.innerHTML=TABS.map(t=>btn(t[0])).join('');
    if(folha) folha.remove();
  }
}
function alternarNavMais(e){
  if(e) e.stopPropagation();
  const f=document.getElementById('nav-mais'), b=document.getElementById('nav-btn-mais');
  if(!f) return;
  const aberta=f.classList.toggle('aberta');
  if(b) b.setAttribute('aria-expanded',String(aberta));
}
document.addEventListener('click',e=>{
  const f=document.getElementById('nav-mais');
  if(!f || !f.classList.contains('aberta')) return;
  if(f.contains(e.target) || (e.target.closest && e.target.closest('#nav-btn-mais'))) return;
  f.classList.remove('aberta');
  const b=document.getElementById('nav-btn-mais'); if(b) b.setAttribute('aria-expanded','false');
});
/* «/» abre a pesquisa global em teclado, como em qualquer sítio onde se
   procura — desde que não se esteja a escrever num campo. */
document.addEventListener('keydown',e=>{
  if(e.key!=='/'||e.ctrlKey||e.metaKey||e.altKey) return;
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable)) return;
  if(S.ui.pesqAberta||S.ui.cozinha||S.ui.mercado||tourAtivo()) return;
  e.preventDefault(); abrirPesquisa();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  /* o que está por cima fecha primeiro */
  if(S.ui.pesqAberta){ fecharPesquisa(); return; }
  if(S.ui.cozinha){ fecharCozinha(); return; }
  if(fichaAberta()){ fecharFicha(); return; }
  if(S.ui.mercado){ fecharMercado(); return; }
  if(folhaMesa()){ fecharFolha(); return; }
  if(modalAberto()){ fecharModal(); return; }
  const f=document.getElementById('nav-mais');
  if(f && f.classList.contains('aberta')){ f.classList.remove('aberta');
    const b=document.getElementById('nav-btn-mais'); if(b){ b.setAttribute('aria-expanded','false'); b.focus(); } }
});

}

function modoEfetivo(){
  const t=S.ui.tema||'auto';
  if(t==='claro'||t==='escuro') return t;
  try{ return matchMedia('(prefers-color-scheme: dark)').matches? 'escuro':'claro'; }catch(e){ return 'claro'; }
}
function aplicarTema(){
  const r=document.documentElement, modo=modoEfetivo();
  const pal=temChave(PALETAS,S.ui.paleta)? S.ui.paleta : 'azulejo';
  r.setAttribute('data-modo',modo);
  r.setAttribute('data-paleta',pal);
  r.setAttribute('data-densidade', S.ui.densidade==='cerrado'? 'cerrado':'folgado');
  r.setAttribute('data-anim', S.ui.anim===false? 'off':'on');
  /* a cor da estação só veste apontamentos e ilustrações — nunca um texto,
     porque a legibilidade não muda com o calendário */
  if(S.ui.sazonal){ const e=estacaoAgora();
    r.setAttribute('data-estacao', e.k);
    r.style.setProperty('--sazonal', modo==='escuro'? e.c2 : e.c);
  } else { r.removeAttribute('data-estacao'); r.style.removeProperty('--sazonal'); }
  /* a barra do browser no telemóvel acompanha o fundo real, e como o modo já
     não vem da media query, as metas estáticas deixariam de bater certo */
  const bg=getComputedStyle(r).getPropertyValue('--bg').trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',bg));
}
function setTema(t){ S.ui.tema=temChave(MODOS,t)? t:'auto'; saveMeta(); aplicarTema(); render(); }

function setDensidade(d){ S.ui.densidade= d==='cerrado'? 'cerrado':'folgado'; saveMeta(); aplicarTema(); render(); }

/* Aura do cabeçalho a partir das cores dos membros. */
function pintaAura(){
  let a=document.getElementById('aura');
  const cores=S.members.slice(0,5).map(avColor);
  if(!a){ a=document.createElement('div'); a.id='aura'; a.className='aura'; a.setAttribute('aria-hidden','true');
    const h=document.querySelector('header'); if(h) h.insertBefore(a,h.firstChild); }
  if(!cores.length){ a.style.background='none'; return; }
  const paradas=cores.map((c,i)=>{
    const x=cores.length===1? 50 : Math.round(i/(cores.length-1)*100);
    return `radial-gradient(circle at ${x}% 0%, ${c}55, transparent 62%)`;
  });
  a.style.background=paradas.join(',');
}
/* Cartões colapsáveis: o template só marca data-col="chave"; a estrutura do
   cabeçalho e o corpo dobrável são montados aqui, depois de cada render. */
function montaColapsaveis(){
  document.querySelectorAll('#main .card[data-col]').forEach(card=>{
    const chave=card.getAttribute('data-col');
    if(card.querySelector(':scope > .card-cab')) return;
    /* O título é normalmente filho direto, mas há cartões em que ele vive
       numa linha com um botão ao lado («ver histórico», «registar pesagem»).
       Nesses, a linha inteira é que passa a ser o cabeçalho — sem isto, o
       data-col prometia um cartão dobrável que nunca dobrava. */
    let tit=card.querySelector(':scope > h2, :scope > h3'), cabeca=tit;
    if(!tit){
      const linha=[...card.children].slice(0,3).find(c=>c.nodeType===1 && c.querySelector('h2,h3'));
      if(linha){ tit=linha.querySelector('h2,h3'); cabeca=linha; }
    }
    if(!tit) return;
    const cab=document.createElement('div'); cab.className='card-cab';
    card.insertBefore(cab,cabeca); cab.appendChild(cabeca);
    const corpo=document.createElement('div'); corpo.className='card-corpo';
    while(cab.nextSibling) corpo.appendChild(cab.nextSibling);
    card.appendChild(corpo);
    const fechado=!!(S.ui.colapsados||{})[chave];
    const b=document.createElement('button');
    b.type='button'; b.className='col-btn';
    b.setAttribute('aria-expanded', String(!fechado));
    b.setAttribute('aria-label', fechado?'Abrir secção':'Fechar secção');
    b.innerHTML='<span class="chev">▾</span>';
    cab.appendChild(b);
    if(fechado) card.classList.add('col-fechado');
    const alterna=e=>{ e.preventDefault(); e.stopPropagation();
      if(!S.ui.colapsados) S.ui.colapsados={};
      const agora=!card.classList.contains('col-fechado');
      card.classList.toggle('col-fechado',agora);
      if(agora) S.ui.colapsados[chave]=true; else delete S.ui.colapsados[chave];
      b.setAttribute('aria-expanded',String(!agora));
      b.setAttribute('aria-label', agora?'Abrir secção':'Fechar secção');
      saveMeta();
    };
    b.addEventListener('click',alterna);
    /* clicar no título também dobra, mas não se o clique foi num explicador */
    cab.addEventListener('click',e=>{ if(e.target.closest('.dica')||e.target.closest('.col-btn')) return; alterna(e); });
  });
}

  balanca:`<rect x="18" y="34" width="72" height="48" rx="8" fill="none"/>
    <path d="M54 34V20" fill="none"/><circle cx="54" cy="58" r="15" fill="none"/>
    <path d="M54 58l9-8" fill="none"/>`,
  lupa:`<circle cx="46" cy="42" r="24" fill="none"/><path d="M64 60l22 22" fill="none"/>
    <path d="M36 42h20" fill="none" opacity=".5"/>`
};
/* ================= DESENHOS DA CASA =================
   Tudo no mesmo traço dos ícones (24×24, 1.8) e sem imagens externas. */
/* O carimbo que assenta ao validar. `novo` só é verdade no render logo a
   seguir ao gesto — a animação corre uma vez e não volta a correr a cada
   redesenho da página. */
let carimboAlvo=null;
function carimbo(chave,tipo){
  const novo=carimboAlvo===chave;
  const d = tipo==='falhou'? 'M6 6l12 12M18 6L6 18'
    : tipo==='adiado'? 'M5 14a7 7 0 1 1 3 5.7M5 9v5h5'
    : 'M4.5 12.8l4.6 4.6L19.5 7';
  return `<span class="carimbo ${tipo||''} ${novo?'carimbo-novo':''}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg></span>`;
}
/* Mesa vista de cima com um lugar por pessoa: ocupados a acento, vazios a
   tracejado. Sem números — é o retrato de quem se sentou. */
function mesaSvg(total,ocupados,larg){
  const n=Math.max(1,Math.min(8,total||1)), W=larg||34, H=Math.round(W*0.7);
  const cx=W/2, cy=H/2, rx=W*0.26, ry=H*0.26, rp=Math.max(1.6,W*0.075);
  const lugares=[];
  for(let i=0;i<n;i++){
    const a=(-Math.PI/2)+(i*2*Math.PI/n);
    const x=cx+Math.cos(a)*(rx+rp*1.9), y=cy+Math.sin(a)*(ry+rp*1.9);
    const cheio=i<ocupados;
    lugares.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rp.toFixed(1)}"
      ${cheio? 'fill="currentColor" stroke="none"' : 'fill="none" stroke="currentColor" stroke-dasharray="1.6 1.6"'}/>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
    <ellipse cx="${cx}" cy="${cy}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}"/>${lugares.join('')}</svg>`;
}
/* Selo de conquista: círculo denteado com tinta falhada, como um passaporte. */
function seloSvg(){
  const dentes=[]; const R=44, r=40;
  for(let i=0;i<36;i++){ const a=i*Math.PI/18;
    dentes.push((50+Math.cos(a)*(i%2?R:r)).toFixed(1)+','+(50+Math.sin(a)*(i%2?R:r)).toFixed(1)); }
  return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
    <defs><filter id="tinta-falhada"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></defs>
    <g filter="url(#tinta-falhada)">
      <polygon points="${dentes.join(' ')}"/>
      <circle cx="50" cy="50" r="32" stroke-width="1.3"/>
    </g></svg>`;
}
/* Sparkline do tamanho de uma palavra, para viver dentro da frase. */
function sparkSvg(vals,rot){
  const v=(vals||[]).filter(x=>isFinite(x));
  if(v.length<2) return '';
  const mn=Math.min(...v), mx=Math.max(...v), amp=(mx-mn)||1;
  const pts=v.map((x,i)=>(i/(v.length-1)*32+1).toFixed(1)+','+(11-((x-mn)/amp)*9).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 34 12" fill="none" stroke="currentColor" stroke-width="1.3"
    stroke-linecap="round" stroke-linejoin="round" role="img"><title>${esc(rot||'')}</title>
    <polyline points="${pts}"/><circle cx="33" cy="${(11-((v[v.length-1]-mn)/amp)*9).toFixed(1)}" r="1.5" fill="currentColor" stroke="none"/></svg>`;
}
function ilustracao(nome){
  const d=ILUS[nome]||ILUS.lupa;
  return `<svg viewBox="0 0 108 96" aria-hidden="true" fill="none" stroke="var(--accent)" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
}
function estadoVazio(ilus,titulo,texto,botoes){
  return `<div class="card"><div class="vazio">${ilustracao(ilus)}
    <h3>${titulo}</h3><p>${texto}</p>
    ${botoes? `<div class="row">${botoes}</div>`:''}</div></div>`;
}
/* Virar de folha: a direção vem da ordem dos separadores na barra, para a
   navegação ganhar um mapa mental em vez de piscar. */
let viraFolha=null;
function go(t){
  /* «despensa» e «compras» eram separadores e passaram a vistas: quem lá chega
     por um atalho antigo, pelo endereço ou pela visita guiada aterra na vista
     certa da Mercearia em vez de num destino que já não existe */
  if(t==='despensa'||t==='compras'){ S.ui.mercVista=t; t='mercearia'; }
  const de=TABS.findIndex(x=>x[0]===S.ui.tab), para=TABS.findIndex(x=>x[0]===t);
  viraFolha = (de<0||para<0||de===para)? null : (para>de? 'vira-frente':'vira-tras');
  S.ui.tab=t; msg=null;
  /* histórico é uma vista dentro do separador, não um sítio onde se fica ao
     mudar de separador */
  if(t!=='atividade') S.ui.histAtiv=null;
  if(t!=='nutricao') S.ui.histRef=null;
  saveMeta(); render();
  if(t==='mercearia') talvezPerguntarCompras();
}
function pickM(id){ S.ui.mid=id; macroLive=null; saveMeta(); render(); }
function curM(){ return S.members.find(m=>m.id===S.ui.mid) || S.members[0]; }
/* Cor do membro: a escolhida, ou uma da paleta pela ordem de entrada. */
function avColor(m){
  if(m && typeof m.cor==='string' && /^#[0-9A-Fa-f]{6}$/.test(m.cor)) return m.cor;
  const i=S.members.indexOf(m);
  return AVCOLORS[(i<0?0:i)%AVCOLORS.length];
}
/* As iniciais escolhem a tinta pela luminância do fundo: branco nas cores
   escuras, tinta escura nas claras. A cor é do utilizador — a legibilidade
   não pode depender do gosto dele. */
function tintaSobre(hex){
  const h=String(hex||'').replace('#',''); if(h.length<6) return '#fff';
  const f=v=>{ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  const L=0.2126*f(parseInt(h.slice(0,2),16))+0.7152*f(parseInt(h.slice(2,4),16))+0.0722*f(parseInt(h.slice(4,6),16));
  /* contraste contra branco vs. contra tinta escura: ganha o maior */
  return (1.05/(L+0.05)) >= ((L+0.05)/0.055)? '#fff' : '#10151B';
}
function avatar(m,sz){
  const tam=sz||26;
  if(m && m.emoji) return `<span class="av av-emoji" style="background:${avColor(m)}22;border:1.5px solid ${avColor(m)};width:${tam}px;height:${tam}px;font-size:${Math.round(tam*0.58)}px">${esc(m.emoji)}</span>`;
  const ini=(m.nome||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return `<span class="av" style="background:${avColor(m)};color:${tintaSobre(avColor(m))};width:${tam}px;height:${tam}px">${esc(ini)}</span>`;
}
/* O seletor de membro acompanha o scroll: em páginas compridas (Nutrição,
   Atividade) nunca se perde de vista de quem são os números. O sentinela de
   1px diz ao observer quando a fila está colada, para lhe dar uma linha. */
function memberPicker(){ if(!S.members.length) return '';
  const cur=curM();
  return `<div class="mf-sentinela" aria-hidden="true"></div><div class="membros-fixos">${S.members.map(m=>
    `<button class="chip ${m.id===cur.id?'on':''}" onclick="pickM('${m.id}')">${avatar(m)} ${esc(m.nome)}</button>`).join('')}</div>`; }
function montaMembrosFixos(){
  if(!('IntersectionObserver' in window)) return;
  document.querySelectorAll('#main .mf-sentinela').forEach(s=>{
    const fila=s.nextElementSibling; if(!fila||!fila.classList.contains('membros-fixos')) return;
    new IntersectionObserver(es=>{ fila.classList.toggle('colada', !es[0].isIntersecting); },
      {rootMargin:`-${parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'))||58}px 0px 0px 0px`}).observe(s);
  });
}

/* ================= SOBRAS =================
   O jantar de hoje é o almoço de amanhã em quase todas as casas portuguesas.
   Uma sobra é meia dose ou duas doses do que se cozinhou, guardada com a data
   e com os macros que já se sabiam — não é um ingrediente novo, é a mesma
   receita a viver mais dois dias. */
const DIAS_SOBRA=3;
/* O prazo não é igual para todos os pratos: o arroz é o que tem menos folga, a
   sopa é o que tem mais. Cada sobra vive o prazo do seu prato. */
function sobrasVivas(){
  const h=hojeISO();
  return (S.sobras||[]).filter(s=>s.doses>0 && s.d<=h && diasEntre(s.d,h)<=prazoSobra(s.r))
    .sort((a,b)=> (prazoSobra(a.r)-diasEntre(a.d,h))-(prazoSobra(b.r)-diasEntre(b.d,h)));
}
function limparSobra(x,lookup){
  lookup = lookup || (id=>RECIPES.find(r=>r.id===id));
  if(!x||typeof x!=='object') return null;
  if(!dataValida(x.d) || x.d>iso(new Date())) return null;
  if(!lookup(x.r)) return null;
  const ac=[]; (Array.isArray(x.ac)? x.ac:[]).forEach(id=>{ const r=lookup(id);
    if(r && ehAcompanhamento(r) && ac.indexOf(id)<0 && ac.length<MAX_AC) ac.push(id); });
  return {id:limparId(x.id), d:x.d, r:x.r, ac, doses:clampNum(parseFloat(x.doses)||0,0,12),
    mk: MEALK.indexOf(x.mk)>=0? x.mk : 'j'};
}
function limparSobraCru(x){ return limparSobra(x); }
function guardarSobra(d,mk,rid,ac,doses){
  const s=limparSobra({id:uid(), d, mk, r:rid, ac, doses});
  if(!s || !(s.doses>0)) return null;
  if(!Array.isArray(S.sobras)) S.sobras=[];
  /* a mesma receita no mesmo dia junta-se, em vez de criar duas entradas */
  const igual=S.sobras.find(x=>x.d===d && x.r===rid);
  if(igual){ igual.doses=Math.min(12, igual.doses+s.doses); return igual; }
  S.sobras.push(s); return s;
}
function consumirSobra(id,doses){
  const s=(S.sobras||[]).find(x=>x.id===id); if(!s) return false;
  s.doses=Math.max(0, Math.round((s.doses-(doses||1))*100)/100);
  if(s.doses<=0.01) S.sobras=S.sobras.filter(x=>x.id!==s.id);
  return true;
}
function macrosSobra(s){
  const rec=RECIPES.find(r=>r.id===s.r); if(!rec) return {k:0,c:0,p:0,f:0};
  const acs=(s.ac||[]).map(id=>RECIPES.find(x=>x.id===id)).filter(Boolean);
  return {k:rec.k+somaAc(acs,'k'), c:rec.c+somaAc(acs,'c'), p:rec.p+somaAc(acs,'p'), f:rec.f+somaAc(acs,'f')};
}
function comerSobra(mid,id){
  const s=(S.sobras||[]).find(x=>x.id===id); if(!s) return;
  const h=hojeISO();
  /* a sobra come-se na refeição do dia que ainda não tem registo */
  const jaTem=(S.regRef||[]).filter(r=>r.mid===mid&&r.d===h).map(r=>r.mk);
  const mk=MEALK.find(k=>jaTem.indexOf(k)<0) || 'a';
  registarRefeicao({d:h, mk, r:s.r, ac:s.ac, dose:1, sobra:true}, [mid], 'feita');
  consumirSobra(id,1);
  carimboAlvo='ref:'+h+':'+mk;
  save('sobra comida');
  const rec=RECIPES.find(x=>x.id===s.r);
  flash('ok',(rec?rec.n:'Sobra')+' registada ao '+nomeRefeicao(mk).toLowerCase()+' — sem cozinhar nem comprar nada.');
  render();
}
function perguntarSobra(d,mk,rid,ac){
  S.ui.folha={tipo:'sobra', d, mk, r:rid, ac:ac||[], doses:1};
  saveMeta(); render();
}
function setSobraDoses(v){ const f=folhaMesa(); if(!f) return; f.doses=clampNum(parseFloat(v)||0,0,12); saveMeta(); render(); }
function guardarFolhaSobra(){
  const f=folhaMesa(); if(!f) return;
  if(f.doses>0){ guardarSobra(f.d,f.mk,f.r,f.ac,f.doses);
    S.ui.folha=null; save('sobra guardada');
    flash('ok', nPT(f.doses,2).replace(',00','')+' dose'+(f.doses===1?'':'s')+' no frigorífico — a app lembra-se durante '+DIAS_SOBRA+' dias.');
  } else { S.ui.folha=null; saveMeta(); }
  render();
}
function folhaSobraHtml(f){
  const rec=RECIPES.find(x=>x.id===f.r);
  const m=macrosSobra(f);
  return `<div class="mfundo" onclick="fundoFolha(event)" style="align-items:flex-end;padding:0">
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="fs-t">
      <div class="folha-pega" aria-hidden="true"></div>
      <span class="lbl">${nomeRefeicao(f.mk)} · ${rotuloData(f.d)}</span>
      <h2 id="fs-t" style="margin-top:2px">Sobrou?</h2>
      <p class="sub" style="margin-top:4px">${esc(rec?rec.n:'')} — o que sobrar fica no frigorífico durante ${DIAS_SOBRA} dias, com os macros já sabidos, e aparece nas sugestões de amanhã.</p>
      <div class="row" style="margin-top:12px">
        ${[0,0.5,1,2].map(x=>`<button class="chip ${f.doses===x?'on':''}" onclick="setSobraDoses(${x})">${x===0?'Não sobrou':x===0.5?'Meia dose':plural(x,'dose','doses')}</button>`).join('')}
      </div>
      ${f.doses>0? `<p class="sub" style="margin-top:10px">${Math.round(m.k*f.doses)} kcal guardadas · come-se com um toque no cartão «Hoje».</p>`:''}
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button class="btn ghost small" onclick="fecharFolha()">Agora não</button>
        <button class="btn" onclick="guardarFolhaSobra()">${f.doses>0?'Guardar no frigorífico':'Não sobrou'}</button>
      </div>
    </div></div>`;
}

/* ================= QUENTE OU FRIO =================
   Ao almoço de agosto ninguém quer uma feijoada. A app deixa de tratar todos
   os pratos como iguais: o género lê-se do nome e dos ingredientes, e pesa nas
   sugestões conforme a estação e a refeição. */
const RE_FRIO=/salada|gaspacho|ceviche|carpaccio|tártaro|tartar|iogurte|smoothie|batido|papaia|melancia|melão|fruta|wrap|sandes|sanduíche|tost|hummus|guacamole|salmorejo|vichyssoise|panna|gelado|sorvete|overnight|poke/i;
const RE_QUENTE=/sopa|caldo|caldeirada|cozid|assad|estufad|guisad|forno|grelhad|frit|refoga|risoto|risott|feijoada|açorda|migas|arroz de|bacalhau à|carne de|bife|costelet|posta|picanha|frango|omelet|ovos mexidos|panquec|gratin|lasanha|massa|esparguete|curry|chili|tagine|sauté|salteado|brasa|espetada|hambúrguer|almôndega|rancho|jardineira|escondidinho/i;
function generoPrato(r){
  if(!r) return 'neutro';
  const n=r.n||'';
  if(RE_FRIO.test(n)) return 'frio';
  if(RE_QUENTE.test(n)) return 'quente';
  /* sem sinal no nome, decide-se pelos ingredientes: legumes crus e fruta
     puxam para frio; o que precisa de lume puxa para quente */
  const ing=(r.i||[]).map(x=>x[0]).join(' ');
  if(/alface|rúcula|pepino|tomate|iogurte|queijo fresco|atum|fruta|melão|manga/i.test(ing)
     && !/arroz|massa|batata|carne|feijão|grão/i.test(ing)) return 'frio';
  return 'neutro';
}
const ICO_GENERO={quente:'🔥', frio:'❄️', neutro:''};
/* Verão português: junho a setembro. Ao almoço é quando o prato frio mais
   apetece — ao jantar já refrescou. */
function estacaoQuente(){ const m=new Date().getMonth()+1; return m>=6 && m<=9; }
function pesoGenero(r,mk){
  const g=generoPrato(r);
  if(g==='neutro') return 0;
  if(estacaoQuente()) return g==='frio'? (mk==='a'? 2 : 1) : (mk==='a'? -2 : -1);
  return g==='quente'? 1 : -1;
}
function seloGenero(r){
  const g=generoPrato(r); if(g==='neutro') return '';
  return `<span class="tag genero-${g}" title="${g==='quente'?'Prato quente':'Prato frio — apetece mais no verão, sobretudo ao almoço'}">${ICO_GENERO[g]} ${g}</span>`;
}

/* ================= CONSERVAR E REAQUECER =================
   Cozinhar em dobro só serve se a comida chegar inteira ao dia seguinte. Os
   prazos são os que as autoridades de segurança alimentar recomendam para
   sobras refrigeradas — genéricos e conservadores, e a app diz que o são. */
const CONSERVA=[
  {k:'peixe',    re:/peixe|bacalhau|sardinha|carapau|robalo|dourada|salmão|atum|pescada|cavala|polvo|lula|choco|marisco|amêijoa|camarão|gamba/i,
   frigo:2, cong:60, nota:'Peixe e marisco cozinhados aguentam menos: dois dias no frigorífico.',
   reaq:'Reaquecer devagar, tapado, para não secar; no forno a 150 °C ou na frigideira com um fio de água.'},
  {k:'arroz',    re:/arroz|risoto|risott/i,
   frigo:1, cong:30, nota:'Arroz cozinhado arrefece-se depressa e come-se no dia seguinte — é o alimento com menos folga.',
   reaq:'Reaquecer bem quente, uma vez só, com uma colher de água para soltar o grão.'},
  {k:'carne',    re:/carne|frango|peru|porco|vaca|novilho|borrego|bife|costelet|picanha|posta|almôndega|hambúrguer/i,
   frigo:3, cong:90, nota:'Carne cozinhada: até três dias no frigorífico.',
   reaq:'Fatiar antes de reaquecer e tapar; no forno a 160 °C ou em lume brando com um pouco de molho.'},
  {k:'sopa',     re:/sopa|caldo|creme de|caldeirada|feijoada|estufad|guisad|cozid|jardineira|rancho/i,
   frigo:4, cong:90, nota:'Sopas e cozidos são os que melhor guardam — até quatro dias, e congelam bem.',
   reaq:'Levantar fervura ao reaquecer; mexer para aquecer por igual.'},
  {k:'ovo',      re:/ovo|omelet|fritata|frittata|quiche/i,
   frigo:2, cong:0, nota:'Pratos de ovo: dois dias, e não congelam bem.',
   reaq:'Reaquecer em lume muito brando ou no forno a 150 °C — o ovo endurece com calor forte.'},
  {k:'legumes',  re:/legume|brócolo|espinafre|couve|grelos|espargos|feijão-verde|salteado|assad/i,
   frigo:3, cong:60, nota:'Legumes cozinhados: até três dias.',
   reaq:'Saltear rapidamente em lume forte, para não ficarem moles.'},
  {k:'massa',    re:/massa|esparguete|lasanha|penne|talharim|macarr/i,
   frigo:3, cong:60, nota:'Massa cozinhada: até três dias, melhor se já vier com molho.',
   reaq:'Reaquecer com um pouco do molho ou de água, tapada.'},
  {k:'leguminosa',re:/feijão|grão|lentilha|favas/i,
   frigo:4, cong:90, nota:'Leguminosas cozinhadas guardam bem — até quatro dias.',
   reaq:'Reaquecer em lume brando com o próprio caldo.'},
];
function conservacaoDe(r){
  if(!r) return null;
  const g=generoPrato(r);
  const texto=(r.n||'')+' '+(r.i||[]).map(x=>x[0]).join(' ');
  const c=CONSERVA.find(x=>x.re.test(texto));
  const base=c || {frigo:3, cong:60, nota:'Sobras cozinhadas em geral: até três dias no frigorífico.',
    reaq:'Reaquecer bem quente, uma vez só.'};
  return Object.assign({}, base, {genero:g,
    reaq: g==='frio'? 'Prato frio: serve-se direto do frigorífico, sem reaquecer.' : base.reaq});
}
function textoConservacao(r){
  const c=conservacaoDe(r); if(!c) return '';
  return '🧊 '+plural(c.frigo,'dia no frigorífico','dias no frigorífico')
    +(c.cong? ' · '+c.cong+' dias no congelador' : ' · não congela bem')
    +'. '+c.nota+' '+c.reaq;
}
function prazoSobra(rid){
  const r=RECIPES.find(x=>x.id===rid); const c=conservacaoDe(r);
  return c? c.frigo : DIAS_SOBRA;
}

/* ================= COZINHAR EM DOBRO =================
   Uma receita cozinhada a dobrar dá para dois dias. A despensa e a lista de
   compras têm de saber disso: as quantidades sobem já, e o segundo dia deixa
   de precisar de cozinhar. */
function fatorDobro(meal){ const f=parseFloat(meal&&meal.dobro); return f>1? Math.min(4,f) : 1; }
function setDobro(di,mk,f){
  const meal=planMeal(di,mk);
  const v=clampNum(parseFloat(f)||1,1,4);
  if(v<=1) delete meal.dobro; else meal.dobro=v;
  save('porção em dobro'); render();
}

/* ================= DA ÉPOCA =================
   Tabela local: que ingredientes estão na época em Portugal, mês a mês.
   Comprar na época é mais barato, mais fresco e mais saboroso — e dá à app
   critério de mercado sem precisar de rede nenhuma. */

function daEpoca(nome,mes){
  const m=mes||(new Date().getMonth()+1);
  /* o nome do INSA costuma ser mais comprido do que a chave («Sardinha,
     grelhada») — basta que comece por ela */
  const chave=Object.keys(EPOCA).find(k=>{
    const n=semAcentos(nome).toLowerCase(), c=semAcentos(k).toLowerCase();
    return n===c || n.indexOf(c+',')===0 || n.indexOf(c+' ')===0;
  });
  return chave? EPOCA[chave].indexOf(m)>=0 : false;
}
function ingredientesDaEpoca(r,mes){ return (r.i||[]).filter(l=>daEpoca(l[0],mes)).map(l=>l[0]); }
function selosEpoca(r){
  const l=ingredientesDaEpoca(r);
  if(!l.length) return '';
  return `<span class="tag epoca" title="Da época agora: ${esc(l.join(', '))}">🌱 da época</span>`;
}
function receitaDaEpoca(r){ return ingredientesDaEpoca(r).length>0; }

/* ================= CUSTO =================
   Os preços são do talão de quem usa a app; a app não inventa um cêntimo, e
   diz sempre quantos itens ficaram por preço. */
function precoDe(nome){ const p=(S.precos||{})[nome];
  return p&&p.v>0? {v:p.v, u:unidadeDe(nome)} : null; }
function setPreco(nome,v){
  if(!S.precos||typeof S.precos!=='object') S.precos={};
  const val=parseFloat(String(v).replace(',','.'));
  if(!isFinite(val)||val<=0||val>10000){ delete S.precos[nome]; return; }
  S.precos[nome]={v:Math.round(val*100)/100};
}
/* Custo de uma lista de ingredientes escalada. Devolve o que sabe e quantos
   itens não têm preço — um total sem essa nota seria uma mentira arredondada. */
function custoDe(linhas,n,fator){
  let total=0, sem=0, com=0;
  escalaIngredientes({i:linhas},n,fator).forEach(x=>{
    const p=precoDe(x.n);
    if(!p){ sem++; return; }
    com++;
    /* €/kg e €/L contam por grama e por mililitro; a unidade conta à peça */
    const div = (x.u==='g'||x.u==='ml')? 1000 : 1;
    total+=p.v*x.q/div;
  });
  return {total:Math.round(total*100)/100, sem, com};
}
function custoReceita(r,n){ return custoDe(r.i, n||1); }
function textoCusto(c){
  if(!c.com) return 'sem preços';
  return nPT(c.total,2)+' €'+(c.sem? ' · faltam '+c.sem : '');
}

/* ================= MARMITAS =================
   A refeição mais planeada e menos apoiada: faz-se à pressa, à noite. */
function acIdsMarmita(meal){ return (meal&&Array.isArray(meal.marmita))? meal.marmita.slice() : []; }
function toggleMarmita(di,mk,mid){
  const meal=planMeal(di,mk);
  if(!Array.isArray(meal.marmita)) meal.marmita=[];
  const i=meal.marmita.indexOf(mid);
  i>=0? meal.marmita.splice(i,1) : meal.marmita.push(mid);
  meal.marmita=meal.marmita.filter(id=>meal.m.indexOf(id)>=0);
  save('marmita'); render();
}
/* As marmitas de amanhã preparam-se hoje à noite: é essa a tarefa útil. */
function marmitasDeAmanha(){
  const amanha=addDias(hojeISO(),1), wk=mondayISO(amanha), di=diaSemana(amanha);
  const dia=(S.plans[wk]||{})[di]||{}, out=[];
  MEALK.forEach(mk=>{ const meal=dia[mk];
    if(!meal||!meal.r||!Array.isArray(meal.marmita)||!meal.marmita.length) return;
    const quem=meal.marmita.filter(id=>S.members.some(m=>m.id===id) && !isCheat(id,amanha));
    if(quem.length) out.push({d:amanha, mk, meal, quem});
  });
  return out;
}

/* ================= CONVIDADOS =================
   O almoço de domingo com os avós é a mesa portuguesa por excelência. Entram
   como comensais temporários — doses, acompanhamentos e compras escalam — e
   saem sozinhos quando a data passa, sem poluir a família com perfis fantasma. */
function convidadosDe(meal){ return (meal&&Array.isArray(meal.conv))? meal.conv : []; }
function nConvidados(meal){ return convidadosDe(meal).reduce((t,c)=>t+(parseInt(c.n,10)||0),0); }
function addConvidado(di,mk,tipo){
  const meal=planMeal(di,mk);
  if(!Array.isArray(meal.conv)) meal.conv=[];
  const ex=meal.conv.find(c=>c.t===tipo && !(c.al||[]).length);
  if(ex) ex.n=Math.min(12,(parseInt(ex.n,10)||0)+1);
  else meal.conv.push({id:uid(), t: tipo==='crianca'?'crianca':'adulto', n:1, al:[]});
  save('convidados'); render();
}
function delConvidado(di,mk,cid){
  const meal=planMeal(di,mk); if(!Array.isArray(meal.conv)) return;
  const c=meal.conv.find(x=>x.id===cid); if(!c) return;
  c.n=(parseInt(c.n,10)||0)-1;
  if(c.n<=0) meal.conv=meal.conv.filter(x=>x.id!==cid);
  save('convidados'); render();
}
function toggleAlergiaConvidado(di,mk,cid,k){
  if(!temChave(RESTR,k)) return;
  const meal=planMeal(di,mk); const c=(meal.conv||[]).find(x=>x.id===cid); if(!c) return;
  if(!Array.isArray(c.al)) c.al=[];
  const i=c.al.indexOf(k); i>=0? c.al.splice(i,1) : c.al.push(k);
  save('alergia de convidado'); render();
}
/* Um convidado com alergias comporta-se como um membro para efeito de
   sugestões e alertas — mas só naquela refeição. */
function membrosVirtuais(meal){
  return convidadosDe(meal).filter(c=>(c.al||[]).length).map(c=>({
    id:'conv_'+c.id, nome: c.t==='crianca'? 'Convidada' : 'Convidado',
    sexo:'f', idade: c.t==='crianca'? 8:40, altura:170, peso:70,
    atividade:'sedentario', desloc:'nenhum', desportos:[], dieta:'equilibrada',
    objetivoPct:0, restricoes:(c.al||[]).slice(), convidado:true}));
}
