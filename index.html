function renderObjetivos(){
  if(!S.members.length) return noMembers();
  S.objetivos.forEach(o=>{
    if(o.concluido) return;
    const p=progressoObjetivo(o);
    if(p.atingido){ o.concluido=true; o.dataConclusao=new Date().toISOString();
      if(!S.ui.celebrando) S.ui.celebrando=o.id; writeLS(); }
  });
  const ativos=S.objetivos.filter(o=>!o.concluido && S.members.some(m=>m.id===o.membroId));
  const concluidos=S.objetivos.filter(o=>o.concluido).sort((a,b)=>new Date(b.dataConclusao||0)-new Date(a.dataConclusao||0));
  const celebrarObj = S.ui.celebrando? S.objetivos.find(x=>x.id===S.ui.celebrando) : null;
  return (celebrarObj? celebracaoHtml(celebrarObj) : '')
    + formCriacaoHtml()
    + `<div class="secgap"><h2>Objetivos ativos</h2>`
    + (ativos.length? `<div class="grid g2" style="margin-top:10px">${ativos.map(cartaoObjetivo).join('')}</div>`
       : estadoVazio('alvo','Nenhum objetivo a decorrer',
           'Um objetivo transforma «queria perder uns quilos» num plano com prazo: a app calcula o défice diário, reparte-o entre dieta e exercício, e mostra o progresso num anel.',''))
    + `</div>`
    + (concluidos.length? `<div class="secgap"><h2>🏆 Conquistas</h2>
        <div class="grid g2" style="margin-top:10px">${concluidos.map(cartaoConquista).join('')}</div></div>` : '');
}

/* ================= PLANO SEMANAL ================= */
function shiftWeek(n){ const d=new Date(S.week+'T12:00:00'); d.setDate(d.getDate()+7*n); S.week=mondayISO(d); saveMeta(); render(); }
function planWeek(){ if(!S.plans[S.week]) S.plans[S.week]={}; return S.plans[S.week]; }
function planMeal(di,mk){ const w=planWeek(); if(!w[di]) w[di]={}; if(!w[di][mk]) w[di][mk]={r:'',ac:'',m:S.members.map(x=>x.id)}; return w[di][mk]; }
function setMeal(di,mk,rid){ const meal=planMeal(di,mk); meal.r=rid;
  if(!rid) meal.ac='';   /* tirar o prato tira o acompanhamento: um arroz sozinho não é plano */
  save('escolha de refeição'); render(); }
function setAcomp(di,mk,rid){ planMeal(di,mk).ac=rid; save('acompanhamento'); render(); }
function toggleEater(di,mk,mid){ const meal=planMeal(di,mk);
  meal.m = meal.m.includes(mid)? meal.m.filter(x=>x!==mid) : [...meal.m,mid]; save(); render(); }
function toggleCheat(mid,date){ if(!S.cheats[mid]) S.cheats[mid]=[];
  const i=S.cheats[mid].indexOf(date); i>=0? S.cheats[mid].splice(i,1) : S.cheats[mid].push(date);
  save('cheat day'); render(); }
function clearWeek(){ if(confirm('Limpar todas as refeições desta semana?')){ delete S.plans[S.week]; delete S.bought[S.week]; save('limpeza da semana'); render(); } }
/* Os acompanhamentos vivem à parte: não aparecem nas listas de pratos nem nas
   sugestões de refeição, porque ninguém janta um arroz de coentros sozinho.
   Aparecem só na linha do acompanhamento, depois de haver prato escolhido. */
function receitasDe(mk){ return RECIPES.filter(r=>r.mt.indexOf(mk)>=0 && r.mt.indexOf('ac')<0); }
function acompanhamentos(){ return RECIPES.filter(r=>r.mt.indexOf('ac')>=0); }
function ehAcompanhamento(r){ return !!r && r.mt.indexOf('ac')>=0; }
function autoFill(){
  const dates=weekDates(S.week); const used=new Set(); let semSolucao=0;
  Object.values(planWeek()).forEach(d=>MEALK.forEach(k=>d[k]?.r&&used.add(d[k].r)));
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=planMeal(di,mk); if(meal.r) continue;
    const eaters=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di]));
    if(!eaters.length) continue;
    const doTipo=receitasDe(mk);
    /* Estreita-se o mais possível e vai-se alargando: cozinha preferida, teto
       de calorias, e por fim só o essencial. O que nunca cede é a dieta e os
       ingredientes vetados — servir a alguém o que essa pessoa não pode comer
       não é uma sugestão imperfeita, é um erro. O teto cede porque é uma
       questão de dose, e a dose ajusta-se no prato. */
    const seguras=doTipo.filter(r=>avaliaReceita(r,eaters,mk,false).ok);
    const cabem=seguras.filter(r=>avaliaReceita(r,eaters,mk,true).ok);
    const daCozinha=a=>a.filter(r=>S.prefCuisine==='todas'||r.coz===S.prefCuisine);
    let pool=daCozinha(cabem);
    if(!pool.length) pool=cabem;
    if(!pool.length) pool=daCozinha(seguras);
    if(!pool.length) pool=seguras;
    if(!pool.length){ semSolucao++; continue; }
    const fresh=pool.filter(r=>!used.has(r.id));
    const alvo=fresh.length? fresh : pool;
    meal.r=alvo[Math.floor(Math.random()*alvo.length)].id; used.add(meal.r);
    /* Almoços e jantares levam acompanhamento; um pequeno-almoço ou um lanche
       não. O acompanhamento respeita as mesmas dietas e vetos do prato. */
    if(mk==='a'||mk==='j'){
      const acs=acompanhamentos().filter(x=>avaliaReceita(x,eaters,mk,false).ok);
      const frescos=acs.filter(x=>!used.has(x.id));
      const escolha=(frescos.length? frescos : acs);
      if(escolha.length){ meal.ac=escolha[Math.floor(Math.random()*escolha.length)].id; used.add(meal.ac); }
    }
  }
  save('preenchimento automático da semana'); render();
  if(semSolucao) toast(semSolucao+' refeições sem solução: nenhuma receita serve toda a mesa');
}
/* ================= SUGESTÕES PARA A SEMANA =================
   O problema real de uma casa com várias dietas não é escolher uma receita —
   é encontrar a que serve toda a gente à mesma mesa. Este painel parte da
   biblioteca inteira e vai tirando: a dieta de cada um, o que cada um não
   come, e o que não cabe na fatia de calorias daquela refeição. O que fica é
   o que se pode cozinhar uma vez e servir a todos.

   Os motivos de exclusão são contados e mostráveis de propósito: sem isso,
   uma família de quatro vê três jantares possíveis e não percebe porquê. */
function sugCfg(){
  if(!S.ui.sug || typeof S.ui.sug!=='object') S.ui.sug={membros:null,ref:'a',teto:true,cuis:'todas',verFora:false};
  const s=S.ui.sug;
  if(MEALK.indexOf(s.ref)<0) s.ref='a';
  if(s.cuis!=='todas' && !temChave(CUIS,s.cuis)) s.cuis='todas';
  return s;
}
/* Sem escolha feita, a mesa é a família inteira. A partir do primeiro toque
   a lista passa a ser explícita — incluindo a lista vazia, que quer mesmo
   dizer «ninguém», e não «toda a gente». */
function selSug(){
  const s=sugCfg();
  if(!Array.isArray(s.membros)) return S.members.map(m=>m.id);
  return s.membros.filter(id=>S.members.some(m=>m.id===id));
}
function membrosSug(){ const ids=selSug(); return S.members.filter(m=>ids.indexOf(m.id)>=0); }
function toggleSugMembro(mid){
  const s=sugCfg();
  if(!Array.isArray(s.membros)) s.membros=S.members.map(m=>m.id);
  const i=s.membros.indexOf(mid);
  i>=0? s.membros.splice(i,1) : s.membros.push(mid);
  saveMeta(); render();
}
function setSugRef(mk){ const s=sugCfg(); if(MEALK.indexOf(mk)>=0) s.ref=mk; saveMeta(); render(); }
function setSugCuis(v){ const s=sugCfg(); s.cuis=(v==='todas'||temChave(CUIS,v))? v:'todas'; saveMeta(); render(); }
function toggleSugTeto(){ const s=sugCfg(); s.teto=!s.teto; saveMeta(); render(); }
function toggleSugFora(){ const s=sugCfg(); s.verFora=!s.verFora; saveMeta(); render(); }
function todosSug(){ const s=sugCfg(); s.membros=S.members.map(m=>m.id); saveMeta(); render(); }

function sugestoes(){
  const s=sugCfg(), mk=s.ref, membros=membrosSug();
  const base=RECIPES.filter(r=>r.mt.indexOf(mk)>=0 && (s.cuis==='todas'||r.coz===s.cuis));
  const ok=[], fora={dieta:[],ingredientes:[],calorias:[]};
  base.forEach(r=>{
    const a=avaliaReceita(r,membros,mk,!!s.teto);
    if(a.ok) ok.push(r); else fora[a.motivo].push({r,a});
  });
  /* Primeiro o que já está na despensa — a sugestão mais útil é a que se pode
     cozinhar hoje; depois a mais perto da média das fatias de quem vai comer. */
  const alvo=membros.filter(contaTeto).map(m=>targetKcal(m)*fatiaRefeicao(mk));
  const medio=alvo.length? alvo.reduce((t,x)=>t+x,0)/alvo.length : 0;
  ok.sort((a,b)=>{
    const da=disponibilidadeReceita(a), db=disponibilidadeReceita(b);
    if(da.pronta!==db.pronta) return da.pronta? -1:1;
    if(medio) return Math.abs(a.k-medio)-Math.abs(b.k-medio);
    return a.n.localeCompare(b.n,'pt');
  });
  return {mk,membros,ok,fora,base};
}
function nomeCurto(m){ return esc(m.nome.split(' ')[0]); }
function planearSugestao(rid,valor,el){
  if(!valor) return;
  const p=valor.split('|'), di=parseInt(p[0],10), mk=p[1];
  const r=RECIPES.find(x=>x.id===rid);
  if(!r || !(di>=0&&di<7) || MEALK.indexOf(mk)<0) return;
  const meal=planMeal(di,mk);
  if(ehAcompanhamento(r)){ meal.ac=rid; }
  else { meal.r=rid; }
  const ids=selSug(); if(ids.length) meal.m=ids.slice();
  if(el) el.value='';
  save('receita planeada');
  toast(r.n+' → '+DAYN[di]+', '+nomeRefeicao(mk).toLowerCase());
  render();
}
function seletorSlot(r,mk){
  const w=S.plans[S.week]||{};
  return `<select class="slot" onchange="planearSugestao('${r.id}',this.value,this)">
    <option value="">📅 Planear em…</option>
    ${DAYN.map((d,di)=>{ const ocupado=w[di]&&w[di][mk]&&w[di][mk].r;
      return `<option value="${di}|${mk}">${d}${ocupado?' (ocupado)':''}</option>`; }).join('')}
  </select>`;
}
/* Quem tem um teto abaixo da receita não fica de fora da mesa: come menos.
   Dizê-lo é mais honesto do que esconder a receita — e é o que acontece em
   qualquer casa onde um adulto e uma criança comem o mesmo prato. */
function notaDoses(r,membros,mk){
  const menores=membros.filter(m=>contaTeto(m)&&doseSugerida(m,r,mk)<0.95);
  if(!menores.length) return '';
  return `<div class="sub">Dose sugerida: ${menores.map(m=>nomeCurto(m)+' '+nPT(doseSugerida(m,r,mk),1)+'×').join(' · ')}
    ${membros.length>menores.length? '· os restantes 1×':''}</div>`;
}
function cartaoSugestao(r,membros,mk){
  const n=membros.length||1, disp=disponibilidadeReceita(r), falta=disp.total-disp.tem;
  return `<div class="rc">
    <div class="row" style="justify-content:space-between"><h3>${esc(r.n)}</h3><span class="kcal">${r.k} kcal</span></div>
    <div><span class="tag">${ICO_COZ[r.coz]||''} ${CUIS[r.coz]}</span>${r.dc.filter(d=>d!==r.coz).map(d=>`<span class="tag">${DIETS[d].n}</span>`).join('')}</div>
    <div class="sub" style="font-variant-numeric:tabular-nums">H ${r.c} g · P ${r.p} g · G ${r.f} g por dose</div>
    ${notaDoses(r,membros,mk)}
    <span class="pill ${disp.pronta?'ok':disp.tem?'warn':''}" style="align-self:flex-start">${disp.pronta?'Pronta a cozinhar':falta+' ingrediente'+(falta===1?'':'s')+' em falta'}</span>
    <details class="quant"><summary>Quantidades para ${n} pessoa${n===1?'':'s'}</summary>
      <div class="sub">${textoEscala(r,n)}</div></details>
    ${seletorSlot(r,mk)}
  </div>`;
}
function motivoTexto(e){
  const f=e.a.fora;
  if(f.dieta.length) return f.dieta.map(m=>nomeCurto(m)+' ('+dietaDe(m).n+')').join(' · ');
  if(f.ingredientes.length) return f.ingredientes.map(x=>nomeCurto(x.m)+': '+x.itens.map(esc).join(', ')).join(' · ');
  return f.calorias.map(x=>nomeCurto(x.m)+': teto '+x.teto+' kcal').join(' · ');
}
function listaFora(titulo,arr){
  if(!arr.length) return '';
  return `<div style="margin-top:10px"><b class="sub">${titulo} (${arr.length})</b>
    <ul class="fora">${arr.slice(0,12).map(e=>`<li>${esc(e.r.n)} <span class="sub">— ${motivoTexto(e)}</span></li>`).join('')}
    ${arr.length>12? `<li class="sub">… e mais ${arr.length-12}</li>`:''}</ul></div>`;
}
function cartaoSugestoes(){
  const s=sugCfg(), sel=selSug();
  const g=sugestoes(), membros=g.membros;
  const nFora=g.fora.dieta.length+g.fora.ingredientes.length+g.fora.calorias.length;
  return `<div class="card" id="sug" style="margin-bottom:16px" data-col="pla-sugestoes">
    <h2>✨ Sugestões para a semana ${dica('sugestoes')}</h2>
    <p class="sub">Receitas que servem <b>ao mesmo tempo</b> toda a gente que estiver ligada aqui em baixo — a mesma panela, sem exceções para ninguém.</p>
    <div class="row" style="margin-top:10px;align-items:center">
      <span class="sub">Para quem:</span>
      ${S.members.map(m=>`<button class="chip ${sel.indexOf(m.id)>=0?'on':''}" onclick="toggleSugMembro('${m.id}')">${avatar(m,20)} ${nomeCurto(m)}</button>`).join('')}
      ${sel.length<S.members.length? `<button class="chip" onclick="todosSug()">Todos</button>`:''}
    </div>
    <div class="row" style="margin-top:8px">
      ${MEALS.map(([kk,rot])=>`<button class="chip ${s.ref===kk?'on':''}" onclick="setSugRef('${kk}')">${ICO_REF[kk]||''} ${rot}</button>`).join('')}
    </div>
    <div class="row" style="margin-top:8px">
      <select style="width:auto" onchange="setSugCuis(this.value)"><option value="todas">Todas as cozinhas</option>
        ${Object.entries(CUIS).map(([kk,v])=>`<option value="${kk}" ${s.cuis===kk?'selected':''}>${(ICO_COZ[kk]||'')+' '+v}</option>`).join('')}</select>
      <button class="chip ${s.teto?'on':''}" onclick="toggleSugTeto()">🎯 Respeitar o teto de calorias</button>
    </div>
    ${!membros.length? `<p class="sub" style="margin-top:14px">Nenhum membro selecionado — liga pelo menos um para haver mesa.</p>`
     : !g.ok.length? estadoVazio('lupa','Nada serve esta mesa ao mesmo tempo',
        'Das '+g.base.length+' receitas para esta refeição, nenhuma passa em todos os critérios de '+membros.length+' pessoa'+(membros.length===1?'':'s')+'. Desliga alguém, alarga a cozinha ou dispensa o teto de calorias — ou planeia pratos diferentes para cada um.',
        `<button class="btn ghost" onclick="toggleSugTeto()">${s.teto?'Dispensar o teto':'Repor o teto'}</button>
         <button class="chip" onclick="toggleSugFora()">Ver o que ficou de fora</button>`)
     : `<p class="sub" style="margin-top:14px"><b style="color:var(--ok)">${g.ok.length}</b> de ${g.base.length} receitas servem ${membros.length===1? nomeCurto(membros[0]) : 'as '+membros.length+' pessoas'} ao ${nomeRefeicao(s.ref).toLowerCase()}.
        ${nFora? `Ficaram de fora ${nFora}: ${[g.fora.dieta.length?g.fora.dieta.length+' por dieta':'',g.fora.ingredientes.length?g.fora.ingredientes.length+' por ingrediente':'',g.fora.calorias.length?g.fora.calorias.length+' por calorias':''].filter(Boolean).join(' · ')}.
        <button class="chip" onclick="toggleSugFora()">${s.verFora?'Esconder motivos':'Ver motivos'}</button>`:''}</p>
        <div class="grid g3" style="margin-top:8px">${g.ok.slice(0,12).map(r=>cartaoSugestao(r,membros,s.ref)).join('')}</div>
        ${g.ok.length>12? `<p class="sub" style="margin-top:8px">A mostrar as 12 primeiras, por ordem do que já tens na despensa. As outras ${g.ok.length-12} estão na lista de cada refeição, em baixo.</p>`:''}`}
    ${s.verFora? `<div class="fora-box">${listaFora('Fora da dieta',g.fora.dieta)}${listaFora('Ingrediente que alguém não come',g.fora.ingredientes)}${listaFora('Acima do teto de calorias',g.fora.calorias)}</div>`:''}
  </div>`;
}

const MOTIVO_CURTO={dieta:'dieta',ingredientes:'ingrediente',calorias:'calorias'};
/* O que se mostra depois de a receita estar escolhida: o que falta na
   despensa, quem é que ela não serve e — o número que ninguém quer fazer de
   cabeça — as quantidades já multiplicadas por quem se senta à mesa. */
function blocoReceitaPlaneada(r,comem,mk,ac){
  const n=comem.length, disp=disponibilidadeReceita(r), falta=disp.total-disp.tem;
  const a=avaliaReceita(r,comem,mk,true);
  /* Com acompanhamento, o que interessa é o total do que vai para a mesa:
     um bife de 300 kcal com batatas fritas de 280 não é uma refeição de 300. */
  const kt=r.k+(ac? ac.k:0), ct=r.c+(ac? ac.c:0), pt=r.p+(ac? ac.p:0), ft=r.f+(ac? ac.f:0);
  const faltaAc=ac? disponibilidadeReceita(ac).total-disponibilidadeReceita(ac).tem : 0;
  const total=falta+faltaAc;
  return `<div class="sub" style="margin-top:4px">${ac? `<b>${kt} kcal</b> com o acompanhamento · `:''}H ${ct} · P ${pt} · G ${ft} g/dose
    ${total>0?' · <span style="color:var(--warn)">'+total+' ingrediente'+(total===1?'':'s')+' em falta</span>':' · <span style="color:var(--ok)">✓ tens tudo</span>'}</div>
    ${a.ok?'':`<div class="sub" style="color:var(--warn)">⚠ ${motivoTexto({r,a})}</div>`}
    ${notaDoses(r,comem,mk)}
    ${n? `<details class="quant"><summary>Quantidades para ${n} pessoa${n===1?'':'s'}</summary>
      <div class="sub">${textoEscala(r,n)}${ac? '<br><b>'+esc(ac.n)+':</b> '+textoEscala(ac,n) : ''}</div></details>`:''}`;
}
/* A lista não esconde nada: separa o que serve esta mesa do que não serve, e
   diz porquê em cada linha. Esconder seria decidir pela pessoa.

   Mas 28 refeições × 227 receitas são mais de seis mil elementos numa página
   que se redesenha inteira a cada toque — e num telemóvel isso sente-se. Por
   isso a lista só é construída quando alguém vai mesmo abrir aquele seletor:
   o fecho é preenchido no foco, antes de o menu nativo aparecer, e os três
   eventos cobrem rato, teclado e dedo. */
function opcoesRefeicao(di,mk,tipo){
  const meal=planWeek()[di]?.[mk], date=weekDates(S.week)[di];
  const acomp=tipo==='ac';
  const rid=meal&&(acomp? meal.ac : meal.r);
  const comem=S.members.filter(m=>(meal? meal.m.includes(m.id) : true) && !isCheat(m.id,date));
  const lista=acomp? acompanhamentos() : receitasDe(mk);
  const servem=[], outras=[];
  /* O acompanhamento não leva teto de calorias próprio: ele soma-se ao prato,
     e é o prato que já foi medido contra a fatia da refeição. Filtrá-lo pelo
     mesmo teto escondia quase tudo por uma conta feita duas vezes. */
  lista.forEach(x=>{ const a=avaliaReceita(x,comem,mk,!acomp); (a.ok?servem:outras).push({r:x,a}); });
  const op=e=>`<option value="${e.r.id}" ${rid===e.r.id?'selected':''}>${esc(e.r.n)} · ${e.r.k} kcal${e.a.ok?'':' — '+MOTIVO_CURTO[e.a.motivo]}</option>`;
  return `<option value="">${acomp?'— sem acompanhamento —':'— escolher receita —'}</option>`
    +(!comem.length? lista.map(x=>op({r:x,a:{ok:true}})).join('')
      : (servem.length? `<optgroup label="Servem ${comem.length===1? nomeCurto(comem[0]) : 'os '+comem.length+' à mesa'}">${servem.map(op).join('')}</optgroup>`:'')
        +(outras.length? `<optgroup label="Fora dos critérios">${outras.map(op).join('')}</optgroup>`:''));
}
function encheSelect(el){
  if(el.dataset.cheio) return;
  const di=parseInt(el.dataset.di,10), mk=el.dataset.mk, valor=el.value;
  el.innerHTML=opcoesRefeicao(di,mk,el.dataset.tipo);
  el.value=valor; el.dataset.cheio='1';
}
function mealBlock(di,mk,label,date){
  const meal=planWeek()[di]?.[mk]; const r=meal&&RECIPES.find(x=>x.id===meal.r);
  const ac=meal&&meal.ac&&RECIPES.find(x=>x.id===meal.ac);
  const members=S.members;
  const comem=members.filter(m=>(meal? meal.m.includes(m.id) : true) && !isCheat(m.id,date));
  return `<div class="meal">
    <div class="mtitle">${label}</div>
    <select data-di="${di}" data-mk="${mk}" data-tipo="r" onfocus="encheSelect(this)" onmousedown="encheSelect(this)"
      ontouchstart="encheSelect(this)" onchange="setMeal(${di},'${mk}',this.value)">
      <option value="">— escolher receita —</option>
      ${r? `<option value="${r.id}" selected>${esc(r.n)} · ${r.k} kcal</option>`:''}
    </select>
    ${r&&(mk==='a'||mk==='j')? `<select class="acomp" data-di="${di}" data-mk="${mk}" data-tipo="ac" onfocus="encheSelect(this)"
      onmousedown="encheSelect(this)" ontouchstart="encheSelect(this)" onchange="setAcomp(${di},'${mk}',this.value)"
      aria-label="Acompanhamento">
      <option value="">🍚 — sem acompanhamento —</option>
      ${ac? `<option value="${ac.id}" selected>🍚 ${esc(ac.n)} · ${ac.k} kcal</option>`:''}
    </select>`:''}
    ${r? blocoReceitaPlaneada(r,comem,mk,ac) : ''}
    <div class="row" style="margin-top:7px">${members.map(m=>{
      const on=meal? meal.m.includes(m.id) : true, cheat=isCheat(m.id,date);
      return `<button class="chip ${on&&!cheat?'on':''}" ${cheat?'style="opacity:.45" title="Cheat day"':''}
        onclick="toggleEater(${di},'${mk}','${m.id}')">${avatar(m,20)} ${esc(m.nome.split(' ')[0])}${cheat?' 🎉':''}</button>`;}).join('')}
    </div>
  </div>`;
}
function irParaDia(di){ const el=document.getElementById('dia-'+di);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
/* Resumo «semana em números»: uma linha por membro, kcal planeadas por dia vs
   a linha do alvo — a mesma assinatura tracejada da barra da Atividade. */
function cartaoSemana(dates){
  const INICIAIS=['S','T','Q','Q','S','S','D'];
  return `<div class="card" id="pla-resumo" style="margin-bottom:16px" data-col="pla-resumo-card">
    <h2>Semana em números ${dica('semana')}</h2>
    ${S.members.map(m=>{
      const alvo=targetKcal(m);
      const dias=dates.map((_,di)=>estadoDia(m,di,dates));
      const teto=Math.max(alvo*1.3, 1, ...dias.map(x=>x.kcal));
      const yDe=k=>48-sx(k,0,teto,0,40);
      const yAlvo=yDe(alvo);
      const barras=dias.map((x,di)=>{
        const bx=30+di*44;
        if(x.st==='cheat') return `<rect x="${bx}" y="20" width="30" height="28" rx="3" class="f-party" fill-opacity=".35"/><circle cx="${bx+15}" cy="15" r="2.5" class="f-party"/>`;
        if(x.st==='vazio') return `<rect x="${bx}" y="46" width="30" height="2" class="f-line"/>`;
        const h=Math.max(2,sx(x.kcal,0,teto,0,40)), by=48-h;
        if(x.st==='incompleto') return `<rect x="${bx}" y="${by.toFixed(1)}" width="30" height="${h.toFixed(1)}" rx="3" class="f-line" opacity=".6"/>
          <text x="${bx+15}" y="${Math.max(8,by-4).toFixed(1)}" font-size="9.5" text-anchor="middle" class="f-mut">${x.refs}/4</text>`;
        const cls=x.st==='ok'?'f-ok':x.st==='warn'?'f-warn':'f-bad';

/* ================= COMPRAS ================= */
/* Os grupos da lista: as secções de supermercado mais um grupo próprio para
   os suplementos, que não se compram no mesmo corredor. O índice é partilhado
   pelo render e pelo atualizador, para os contadores por secção baterem certo. */
function gruposCompras(){ return CATS.map(c=>c[0]).concat(['Suplementos']); }
function grupoDoItem(it){
  if(it.u==='dose') return CATS.length;
  /* A secção do supermercado vem da classificação do próprio INSA sempre que
     o ingrediente vem de lá: é mais fiável do que qualquer expressão sobre o
     nome, e não confunde gnocchi com batatas. */
  if(temChave(NUTRI,it.n) && NUTRI[it.n].s>=0 && NUTRI[it.n].s<CATS.length) return NUTRI[it.n].s;
  if(temChave(SEC_FIXA,it.n)){
    const i=CATS.findIndex(c=>c[0]===SEC_FIXA[it.n]);
    if(i>=0) return i;
  }
  for(const [i,[cat,re]] of CATS.entries()) if(re.test(it.n)) return i;
  return CATS.length-1;
}
function shoppingItems(){
  const dates=weekDates(S.week), w=S.plans[S.week]||{}, agg={};
  let meals=0;
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=w[di]?.[mk]; if(!meal||!meal.r) continue;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) continue;
    const n=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di])).length;
    if(!n) continue; meals++;
    /* o acompanhamento entra na lista pela mesma porta que o prato: quem come
       arroz de tomate ao jantar tem de comprar o arroz e o tomate */
    const ac=meal.ac && RECIPES.find(x=>x.id===meal.ac);
    (ac? r.i.concat(ac.i) : r.i).forEach(([nome,q,u])=>{ const key=nome+'|'+u;
      if(!agg[key]) agg[key]={n:nome,u,q:0}; agg[key].q+=q*n; });
  }
  /* Os suplementos consomem-se todos os dias, não por refeição planeada:
     entram na lista pelas doses de sete dias, para a compra da semana
     ficar completa. Um cheat day não suspende um multivitamínico. */
  S.members.forEach(m=>suplementosDe(m).forEach(s=>{
    const sp=SUPL[s.s], key=sp.nome+'|dose';
    if(!agg[key]) agg[key]={n:sp.nome,u:'dose',q:0};
    agg[key].q += (parseFloat(s.doses)||0)*7;
  }));
  return {items:Object.values(agg),meals};
}
/* Marcar um item não redesenha a lista: no supermercado, com o telemóvel numa
   mão, o scroll e o foco ficam onde estavam. Se faltar algum id, cai no render
   completo — nunca dessincroniza. */
function toggleBought(key,el){ if(!S.bought[S.week]) S.bought[S.week]={};
  const novoEstado=!S.bought[S.week][key];
  S.bought[S.week][key]=novoEstado;
  /* comprar um ingrediente é o sinal mais natural de que ele passa a estar
     em casa — a despensa atualiza-se sozinha. Desmarcar não o remove: pode
     ter sido só um engano, não significa que a prateleira ficou vazia. */
  if(novoEstado){ const nome=key.split('|')[0]; if(nome) S.despensa[nome]=true; }
  save();
  const li=el&&el.closest? el.closest('li'):null;
  if(!li||!document.getElementById('co-bar')){ render(); return; }
  li.classList.toggle('done',novoEstado);
  atualizarCompras();
  if(novoEstado) atualizarFaltaComprar();   /* comprar pode ter tirado este item do que falta */
}
function atualizarFaltaComprar(){
  const corpo=document.getElementById('falta-corpo'); if(!corpo) return;
  const {items}=shoppingItems();
  corpo.innerHTML=corpoFaltaComprar(items);
}
function atualizarCompras(){
  const bar=document.getElementById('co-bar'); if(!bar) return;
  const {items}=shoppingItems(); const bought=S.bought[S.week]||{};
  const done=items.filter(i=>bought[i.n+'|'+i.u]).length, total=items.length;
  bar.style.width=(total? done/total*100:0)+'%';
  bar.style.background=(done===total&&total)? 'var(--ok)':'var(--accent)';
  const num=document.getElementById('co-num');
  if(num){ if(done===total&&total){ num.textContent='tudo comprado ✓'; num.setAttribute('class','f-ok-txt'); }
    else { num.textContent=done+'/'+total+' comprados'; num.removeAttribute('class'); } }
  gruposCompras().forEach((c,i)=>{ const el=document.getElementById('co-sec-'+i); if(!el) return;
    const lis=[].slice.call(document.querySelectorAll('li[data-sec="'+i+'"]'));
    const dn=lis.filter(li=>li.classList.contains('done')).length;
    const completo=lis.length&&dn===lis.length;
    el.textContent=(completo?'✓ ':'')+dn+'/'+lis.length;
    el.setAttribute('class', completo?'sub f-ok-txt':'sub');
  });
}
function fmtQ(it){ return fmtQtd(it.q,it.u); }
/* Sem a guarda, em http simples (rede local) navigator.clipboard é undefined e
   o botão atirava um TypeError sem dizer nada a ninguém. */
function copyList(){
  const {items}=shoppingItems();
  const txt='Lista de compras — semana de '+fmtShort(S.week)+'\n'+items.map(i=>`• ${i.n}: ${fmtQ(i)}`).join('\n');
  const ok=()=>alert('Lista copiada! Cola-a numa mensagem ou nota.');
  const manual=()=>{ const ta=document.getElementById('co-txt');
    if(!ta){ alert('O browser não deixou copiar. Abre o separador Dados para exportares.'); return; }
    ta.style.display='block'; ta.value=txt; ta.focus(); ta.select();
    try{ ta.setSelectionRange(0,txt.length); }catch(e){}
    let feito=false; try{ feito=document.execCommand('copy'); }catch(e){}
    alert(feito? 'Lista copiada! Cola-a numa mensagem ou nota.'
      : 'Seleciona o texto da caixa abaixo e copia à mão (Ctrl+C).');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, manual);
  } else manual();
}

  <div class="mbar" style="height:10px;max-width:640px;margin:8px 0 14px">
    <div id="co-bar" style="background:${completo?'var(--ok)':'var(--accent)'};width:${items.length? done/items.length*100:0}%"></div></div>
  <div class="card" style="max-width:640px">
    ${grouped.filter(([,arr])=>arr.length).map(([cat,arr])=>{
      const iSec=grupos.indexOf(cat);

          <span>${esc(it.n)}</span><span class="q">${fmtQ(it)}</span></label></li>`;}).join('')}</ul>`;}).join('')}
  </div>
  <textarea id="co-txt" style="display:none;max-width:640px;margin-top:12px" readonly aria-label="Lista de compras em texto"></textarea>
  <p class="sub" style="margin-top:12px">Quantidades = receita por pessoa × nº de comensais em cada refeição (membros em cheat day não contam nesse dia).</p>

/* ================= DESPENSA =================
   Toggle sempre por ÍNDICE no catálogo (nunca pelo nome dentro de um
   onclick): o catálogo é uma função determinística das receitas, por isso
   o mesmo índice aponta sempre para o mesmo ingrediente entre o render e o
   clique — sem ter de escapar aspas nem confiar em nomes livres. */
function toggleDespensaIdx(i){
  const nome=catalogoDespensa()[i]; if(!nome) return;
  if(S.despensa[nome]) delete S.despensa[nome]; else S.despensa[nome]=true;
  save('despensa: '+nome); render();
}
function marcarTodaDespensa(){
  catalogoDespensa().forEach(n=>S.despensa[n]=true);
  save('despensa toda marcada'); render();
}
function limparDespensa(){
  if(!confirm('Esvaziar a despensa? Todas as receitas voltam a mostrar os ingredientes como em falta.')) return;
  S.despensa={}; save('despensa esvaziada'); render();
}
/* Filtro de texto sem re-render: mexer no #main destruiria a própria caixa
   de pesquisa a meio da escrita. Só se escondem/mostram as linhas. */
function filtrarDespensa(el){
  const q=(el.value||'').toLowerCase().trim();
  document.querySelectorAll('#despensa-lista li').forEach(li=>{
    li.style.display = !q || li.textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none';
  });
}
function setAlergDesp(v){ S.ui.alergDesp=ehAlergenio(v)? v:''; saveMeta(); render(); }
/* Os alergénios que os membros da casa têm marcados: são estes que valem a
   pena assinalar em cada ingrediente da despensa, e não os catorze todos. */
function alergiasDaCasa(){
  const s=[];
  S.members.forEach(m=>restricoesDe(m).filter(ehAlergenio).forEach(t=>{ if(s.indexOf(t)<0) s.push(t); }));
  return s;
}
function renderDespensa(){

  const tem=catalogo.filter(n=>S.despensa[n]).length;
  const filtro=S.ui.alergDesp, daCasa=alergiasDaCasa();
  /* os suplementos ficam num grupo próprio no fim, em vez de espalhados
     pelas secções de supermercado — não é lá que se compram */
  const grouped=CATS.map(([cat])=>[cat,[]]).concat([['Suplementos',[]]]);
  catalogo.forEach((nome,i)=>{
    if(filtro && atributosIng(nome).indexOf(filtro)<0) return;

    grouped[grupoDoItem({n:nome,u:unidadeDe(nome)})][1].push(i);
  });
  const nFiltrado=grouped.reduce((t,[,idx])=>t+idx.length,0);
  return `<div class="row" style="justify-content:space-between;margin-bottom:4px">
    <div><h2>A minha despensa ${dica('despensa')}</h2>

    <input type="text" placeholder="Procurar ingrediente ou suplemento…" class="busca" aria-label="Procurar na despensa" oninput="filtrarDespensa(this)">

    ${filtro? `<button class="chip" onclick="setAlergDesp('')">✕ ${esc(RESTR[filtro].n)}</button>`:''}
  </div>
  ${filtro? `<div class="alerta" style="max-width:640px;margin-bottom:12px"><span aria-hidden="true">🚨</span>
    <span>${nFiltrado} ingrediente${nFiltrado===1?'':'s'} do catálogo ${nFiltrado===1?'traz':'trazem'} ${esc(RESTR[filtro].n.toLowerCase())}. ${esc(RESTR[filtro].d||'')}</span></div>`:''}
  <div class="card" style="max-width:640px">
    <div id="despensa-lista">
    ${grouped.filter(([,idx])=>idx.length).map(([cat,idx])=>`
      <div class="cat-h">${ICO_CAT[cat]||''} ${cat}</div>
      <ul class="shop">${idx.map(i=>{
        const nome=catalogo[i], ok=!!S.despensa[nome];
        /* a etiqueta só aparece para os alergénios que alguém cá em casa tem:
           marcar os catorze em todos os ingredientes seria ruído */
        const al=atributosIng(nome).filter(t=>daCasa.indexOf(t)>=0);
        return `<li class="${ok?'done':''}"><label><input type="checkbox" ${ok?'checked':''} onchange="toggleDespensaIdx(${i})">
          <span>${esc(nome)}${al.length? ' '+al.map(t=>`<span class="tag alerg" title="${esc(RESTR[t].n)}">${RESTR[t].i}</span>`).join(''):''}</span></label></li>`;
      }).join('')}</ul>`).join('')}
    </div>
  </div>
  <p class="sub" style="margin-top:12px">Marca o que já tens em casa: as receitas e a lista de compras passam a saber
    o que falta comprar de verdade. Comprar um ingrediente na lista de compras marca-o aqui automaticamente.
    ${daCasa.length? 'Os símbolos assinalam os alergénios marcados nos perfis da família.':''}</p>`;
}

/* ================= ORIENTAÇÃO E TIPO DE ECRÃ =================
   Marca <html> com data-orient (retrato/paisagem) e data-dispositivo
   (telefone/tablet/desktop). O CSS agarra-se a estes atributos para
   distinguir um telemóvel deitado de um tablet deitado, que têm larguras
   parecidas mas necessidades opostas. */
let ecra={orient:null,disp:null};
function ehToque(){
  try{ return matchMedia('(hover:none) and (pointer:coarse)').matches; }
  catch(e){ return 'ontouchstart' in window || navigator.maxTouchPoints>0; }
}
function orientacao(){
  try{
    if(matchMedia('(orientation:portrait)').matches) return 'retrato';
    if(matchMedia('(orientation:landscape)').matches) return 'paisagem';
  }catch(e){}
  return innerHeight>=innerWidth ? 'retrato' : 'paisagem';   // reserva para Safari antigo
}
function tipoDispositivo(){
  if(!ehToque()) return 'desktop';
  /* O lado menor não muda quando se roda, por isso classifica melhor do que a
     largura: um iPhone deitado continua a ser um telemóvel. */
  const menor=Math.min(innerWidth,innerHeight), maior=Math.max(innerWidth,innerHeight);
  return (menor>=600 || maior>=1000) ? 'tablet' : 'telefone';
}
function nomeEcra(){
  const d={telefone:'Telemóvel',tablet:'Tablet',desktop:'Computador'}[ecra.disp]||'—';
  return ecra.disp==='desktop' ? d : d+' · '+(ecra.orient==='retrato'?'vertical':'horizontal');
}
function aplicarEcra(){
  const o=orientacao(), d=tipoDispositivo();
  const mudou = (o!==ecra.orient || d!==ecra.disp);
  ecra={orient:o,disp:d};
  const r=document.documentElement;
  r.setAttribute('data-orient',o);
  r.setAttribute('data-dispositivo',d);
  const info=document.getElementById('ecraInfo');
  if(info) info.textContent=nomeEcra();
  return mudou;
}
/* Ao rodar, o iOS mantém a posição de scroll em pixéis: como a página fica com
   outra altura, o utilizador aterra num ponto diferente do que estava a ler.
   Guarda-se a posição relativa antes do reflow e repõe-se depois. */
function aoRodar(prop){
  if(!aplicarEcra()) return;
  if(typeof prop!=='number') return;
  requestAnimationFrame(()=>{
    const alt=Math.max(1, document.documentElement.scrollHeight - innerHeight);
    if(alt>1) window.scrollTo(0, Math.round(prop*alt));
  });
}
function ligarOrientacao(){
  const reagir=()=>{
    const alt=Math.max(1, document.documentElement.scrollHeight - innerHeight);
    const prop=alt>1 ? Math.min(1, scrollY/alt) : 0;
    /* Duas passagens: o Safari só publica as medidas certas depois do reflow. */
    requestAnimationFrame(()=>requestAnimationFrame(()=>aoRodar(prop)));
    setTimeout(()=>aoRodar(prop), 320);
  };
  try{
    const mq=matchMedia('(orientation:portrait)');
    if(mq.addEventListener) mq.addEventListener('change',reagir);
    else if(mq.addListener) mq.addListener(reagir);              // Safari 13 e anteriores
  }catch(e){}
  if(screen.orientation && screen.orientation.addEventListener)
    screen.orientation.addEventListener('change',reagir);         // Android / Chrome
  window.addEventListener('orientationchange',reagir);            // iOS Safari
  let t=null;
  const adiado=()=>{ clearTimeout(t); t=setTimeout(()=>aoRodar(),150); };
  window.addEventListener('resize',adiado);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',adiado);
}

/* ================= DADOS: CÓPIA E RESTAURO ================= */
function flash(kind,text){ msg={kind,text}; render(); }
function pacote(){
  /* Um arrasto do objetivo que acabe onde começou não dispara change, e o
     m.objetivo legado ficaria dessincronizado do objetivoPct. Sincroniza-se
     aqui, para uma cópia nunca sair incoerente. */
  S.members.forEach(sincronizaObjetivo);
  return {app:APPID, formato:FORMATO, exportadoEm:new Date().toISOString(),
  dados:{members:S.members, cheats:S.cheats, plans:S.plans, bought:S.bought,
         prefCuisine:S.prefCuisine, week:S.week, objetivos:S.objetivos, despensa:S.despensa,
         receitas:S.receitas}}; }
function textoCopia(){ return JSON.stringify(pacote(),null,2); }
function marcarExportado(){ S.meta.exportadoEm=new Date().toISOString(); S.meta.semCopia=false; saveMeta(); }
function nomeFicheiro(){ return 'familia-fit-'+iso(new Date())+'.json'; }

function descarregar(){
  if(!S.members.length) return flash('bad','Ainda não há dados para exportar.');
  try{
    const blob=new Blob([textoCopia()],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=nomeFicheiro(); a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    marcarExportado();
    flash('ok','Ficheiro '+nomeFicheiro()+' criado — guarda-o na nuvem ou numa pasta de cópias, é com ele que '
      +'recuperas tudo. Se o browser não mostrar nenhuma transferência, usa «Mostrar e copiar dados».');
  }catch(e){
    flash('bad','O browser não deixou descarregar o ficheiro. Usa «Mostrar e copiar dados» e cola o texto num ficheiro à parte.');
  }
}
/* No iPhone e no Android a forma natural de guardar é a folha de partilha do
   sistema (Ficheiros, iCloud, Drive, WhatsApp), não uma transferência. */
function podePartilhar(){
  try{ return !!(navigator.canShare && navigator.share
    && navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]})); }
  catch(e){ return false; }
}
function partilhar(){
  if(!S.members.length) return flash('bad','Ainda não há dados para exportar.');
  const f=new File([textoCopia()], nomeFicheiro(), {type:'application/json'});
  navigator.share({files:[f], title:'Cópia do Família Fit'}).then(()=>{
    marcarExportado();
    flash('ok','Cópia enviada para a app que escolheste. Guarda-a nos Ficheiros ou na nuvem para a poderes restaurar.');
  }, e=>{
    if(e && (e.name==='AbortError' || e.name==='NotAllowedError')) return;   // o utilizador cancelou
    flash('bad','A partilha não ficou concluída. Usa «Transferir ficheiro» ou «Mostrar e copiar dados».');
  });
}
/* O Safari do iOS só copia de um campo editável e com seleção explícita. */
function copiarDaCaixa(ta){
  const eraReadonly=ta.hasAttribute('readonly');
  ta.removeAttribute('readonly');
  ta.focus(); ta.setSelectionRange(0, ta.value.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  if(eraReadonly) ta.setAttribute('readonly','');
  return ok;
}
function mostrarCopia(){
  if(!S.members.length) return flash('bad','Ainda não há dados para exportar.');
  const ta=document.getElementById('bkOut'); if(!ta) return;
  ta.value=textoCopia();
  const fim=()=>{ marcarExportado(); flash('ok','Dados copiados. Cola-os numa nota, email ou ficheiro de texto para os guardares.'); };
  const manual=()=>flash('ok','Dados prontos na caixa abaixo — seleciona tudo e copia à mão para os guardares.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(fim, ()=>{ copiarDaCaixa(ta)? fim() : manual(); });
  } else {
    copiarDaCaixa(ta)? fim() : manual();
  }
}
function num(v,d){ const n=parseFloat(v); return isFinite(n)&&n>0? n : d; }
function plural(n,um,muitos){ return n+' '+(n===1? um : muitos); }
/* Os ids são interpolados em atributos id= e em handlers inline, por isso um id
   vindo de um ficheiro de cópia tem de ser tão validado como tudo o resto: um
   apóstrofo partiria os onclick, e algo pior podia lá ser injetado. */
function limparId(v){ const s=String(v==null?'':v); return /^[A-Za-z0-9_-]{1,32}$/.test(s)? s : uid(); }
function limparMembro(m){
  m=m||{};
  const dieta = m.dieta==='personalizada' ? 'personalizada' : (temChave(DIETS,m.dieta)? m.dieta:'equilibrada');
  const objetivo = temChave(GOALS,m.objetivo)? m.objetivo:'manter';
  /* objetivoPct NUNCA passa por num(): 0 e negativos são valores legítimos */
  const pctBruto = parseFloat(m.objetivoPct);
  const out = {id:limparId(m.id), nome:String(m.nome||'Sem nome').slice(0,60),
    sexo: m.sexo==='f'?'f':'m', idade:num(m.idade,35), altura:num(m.altura,170), peso:num(m.peso,70),
    atividade: temChave(BASE_ACT,m.atividade)? m.atividade:'sedentario',
    desloc: temChave(COMMUTE,m.desloc)? m.desloc:'nenhum',
    dieta, objetivo,
    objetivoPct: Number.isFinite(pctBruto)? clampNum(Math.round(pctBruto),-25,20) : Math.round((GOALS[objetivo][1])*100),
    meses: Number.isFinite(parseFloat(m.meses))? clampNum(Math.round(parseFloat(m.meses)),0,24) : undefined,
    gravida: !!m.gravida && (m.sexo==='f'),
    trimestre: clampNum(Math.round(parseFloat(m.trimestre)||1),1,3),
    fetos: clampNum(Math.round(parseFloat(m.fetos)||1),1,3),
    pesoPre: num(m.pesoPre,0)||undefined,
    restricoes: Array.isArray(m.restricoes)
      ? m.restricoes.filter((k,i,a)=>temChave(RESTR,k)&&a.indexOf(k)===i) : [],
    emoji: (typeof m.emoji==='string' && m.emoji.length>0 && m.emoji.length<=4)? m.emoji : undefined,
    cor: (typeof m.cor==='string' && /^#[0-9A-Fa-f]{6}$/.test(m.cor))? m.cor : undefined,
    desportos: Array.isArray(m.desportos) ? m.desportos.map(normalizaDesporto).filter(Boolean) : [],
    suplementos: Array.isArray(m.suplementos)
      ? m.suplementos.filter(s=>s&&temChave(SUPL,s.s))
          .map(s=>({s:s.s, doses:clampNum(Math.round((parseFloat(s.doses)||0)*2)/2,0,20)}))
          .filter(s=>s.doses>0)
      : []};
  /* idade:num(m.idade,35) acima não sabe nada de meses — sem isto, um bebé
     importado com só "meses" ficava com idade=35 (o valor de recurso) em vez
     de derivada dos meses, e um meses fora de [0,24] não convertia para anos. */
  normalizaIdadeMeses(out);
  if(dieta==='personalizada'){
    const mc=m.macros||{};
    const s=(parseFloat(mc.c)||0)+(parseFloat(mc.p)||0)+(parseFloat(mc.f)||0);
    out.macros = s>0? normaliza100(mc) : {c:50,p:20,f:30};   /* validar pela soma: 0 g de hidratos é legítimo */
  }
  /* a configuração do bebé passa pelo mesmo saneamento que usa em runtime */
  if(m.bebe && typeof m.bebe==='object') out.bebe=bebeCfg(Object.assign({},out,{bebe:m.bebe}));
  return out;
}
function lerPacote(txt){
  let p; try{ p=JSON.parse(txt); }catch(e){ return {erro:'O texto não é uma cópia válida (não foi possível interpretar o JSON).'}; }
  if(p && p.app && p.app!==APPID) return {erro:'Este ficheiro é de outra aplicação, não do Família Fit.'};
  const d = p && p.dados ? p.dados : p;
  if(!d || !Array.isArray(d.members)) return {erro:'Este ficheiro não contém perfis do Família Fit.'};
  /* Os perfis eram validados à lupa mas os planos entravam em bruto: uma
     refeição sem a lista de comensais rebentava o Plano e as Compras depois
     de importar. Tudo o que vem do ficheiro é agora saneado em profundidade,
     e os ids saneados são remapeados nos cheats e nos planos. */
  /* As receitas da casa são saneadas antes dos planos: um plano que aponte
     para uma receita importada tem de a encontrar, senão a refeição entrava
     vazia sem ninguém perceber que a receita veio no ficheiro. */
  const receitas=[], vistosRec={};
  if(Array.isArray(d.receitas)) d.receitas.forEach(x=>{
    const lr=limparReceita(x); if(!lr) return;
    if(vistosRec[lr.id]) lr.id='u_'+uid();
    vistosRec[lr.id]=1; receitas.push(lr);
  });
  const receitaExiste=id=>vistosRec[id] || RECIPES.some(x=>x.id===id&&!x.u);
  const mapa={}, vistos={};
  const members=d.members.map(mm=>{
    const antigo=String(mm.id==null?'':mm.id);
    const lm=limparMembro(mm);
    if(vistos[lm.id]) lm.id=uid();
    vistos[lm.id]=1; mapa[antigo]=lm.id;
    return lm;
  });
  const idOk=x=>{ const n=mapa[String(x)]||String(x); return vistos[n]? n : null; };
  const cheats={};
  if(d.cheats && typeof d.cheats==='object') Object.keys(d.cheats).forEach(mid=>{
    const alvo=idOk(mid); const arr=d.cheats[mid];
    if(!alvo || !Array.isArray(arr)) return;
    const dias=arr.filter(dataValida);
    if(dias.length) cheats[alvo]=(cheats[alvo]||[]).concat(dias);
  });
  const plans={};
  if(d.plans && typeof d.plans==='object') Object.keys(d.plans).forEach(wk=>{
    if(!dataValida(wk)) return;
    const dias=d.plans[wk]; if(!dias || typeof dias!=='object') return;
    const od={};
    Object.keys(dias).forEach(di=>{
      if(!/^[0-6]$/.test(String(di))) return;
      const refs=dias[di]; if(!refs || typeof refs!=='object') return;
      const or={};
      MEALK.forEach(mk=>{ const r=refs[mk]; if(!r || typeof r!=='object') return;
        or[mk]={ r: receitaExiste(r.r)? String(r.r):'',
                 ac: receitaExiste(r.ac)? String(r.ac):'',
                 m: Array.isArray(r.m)? r.m.map(idOk).filter(Boolean) : [] }; });
      if(Object.keys(or).length) od[di]=or;
    });
    if(Object.keys(od).length) plans[wk]=od;
  });
  const bought={};
  if(d.bought && typeof d.bought==='object') Object.keys(d.bought).forEach(wk=>{
    const o=d.bought[wk]; if(!o || typeof o!=='object') return;
    const oo={}; Object.keys(o).forEach(kk=>{ if(o[kk]) oo[kk]=true; }); bought[wk]=oo;
  });
  const objetivos=[], vistosObj={};
  if(Array.isArray(d.objetivos)) d.objetivos.forEach(o=>{
    if(!o || typeof o!=='object') return;
    const mid=idOk(o.membroId); if(!mid) return;
    const pesoInicial=num(o.pesoInicial,0), pesoAlvo=num(o.pesoAlvo,0);
    if(!pesoInicial || !pesoAlvo) return;
    const dt=new Date(o.dataInicio);
    let id=limparId(o.id); if(vistosObj[id]) id=uid(); vistosObj[id]=1;
    objetivos.push({
      id, membroId:mid,
      tipo: ['perder','manter','ganhar'].indexOf(o.tipo)>=0? o.tipo : 'perder',
      pesoInicial, pesoAlvo,
      semanas: clampNum(Math.round(parseFloat(o.semanas)||12),1,104),
      dataInicio: !isNaN(dt.getTime())? o.dataInicio : new Date().toISOString(),
      splitDieta: Number.isFinite(parseFloat(o.splitDieta))? clampNum(Math.round(parseFloat(o.splitDieta)),0,100) : 50,
      desportoEscolhido: temChave(SPORT,o.desportoEscolhido)? o.desportoEscolhido : null,
      bandaManter: clampNum(parseFloat(o.bandaManter)||2,0.5,10),
      concluido: !!o.concluido, celebrado: !!o.celebrado,
      dataConclusao: (o.dataConclusao && !isNaN(new Date(o.dataConclusao).getTime()))? o.dataConclusao : null
    });
  });
  /* A despensa só aceita nomes que ainda existem no catálogo (ingredientes
     das receitas e suplementos) — um nome de uma versão antiga ou de outra
     fonte nunca corresponderia a nada, e ficaria ali como lixo sem função. */
  const despensa={};
  if(d.despensa && typeof d.despensa==='object'){
    const catalogo=new Set(catalogoDespensa());
    Object.keys(d.despensa).forEach(k=>{ if(d.despensa[k] && catalogo.has(k)) despensa[k]=true; });
  }
  return {d:{ members, cheats, plans, bought, objetivos, despensa, receitas,
              prefCuisine:temChave(CUIS,d.prefCuisine)?d.prefCuisine:'todas',
              week:dataValida(d.week)? mondayISO(new Date(d.week+'T12:00:00')) : mondayISO(new Date()) }};
}
function substituir(txt){
  const {d,erro}=lerPacote(txt); if(erro) return flash('bad',erro);
  if(S.members.length && !confirm('Substituir os dados atuais ('+S.members.length+' perfis) pelos da cópia ('
    +d.members.length+' perfis)?\n\nOs dados que estão neste dispositivo perdem-se.')) return;
  const antigo=S.meta;
  S=Object.assign(blank(), d);
  sincronizaReceitas();
  S.meta=Object.assign(S.meta,{avisarAoSair:antigo.avisarAoSair, exportadoEm:antigo.exportadoEm});
  S.ui.tab='dados'; S.ui.mid=S.members[0]? S.members[0].id : null;
  S.meta.semCopia=false; saveMeta();
  flash('ok','Dados restaurados: '+plural(d.members.length,'perfil','perfis')+' e '
    +plural(Object.keys(d.plans).length,'semana','semanas')+' de plano.');
}
function juntar(txt){
  const {d,erro}=lerPacote(txt); if(erro) return flash('bad',erro);
  const mapa={}; let novos=0, refeicoes=0;
  d.members.forEach(im=>{
    const igual=S.members.find(m=>m.id===im.id
      || m.nome.trim().toLowerCase()===im.nome.trim().toLowerCase());
    if(igual){ mapa[im.id]=igual.id; return; }
    const nid = S.members.some(m=>m.id===im.id)? uid() : im.id;
    mapa[im.id]=nid; S.members.push(Object.assign({},im,{id:nid})); novos++;
  });
  Object.keys(d.cheats).forEach(mid=>{
    const alvo=mapa[mid]||mid; if(!S.cheats[alvo]) S.cheats[alvo]=[];
    (d.cheats[mid]||[]).forEach(dia=>{ if(!S.cheats[alvo].includes(dia)) S.cheats[alvo].push(dia); });
  });
  Object.keys(d.plans).forEach(wk=>{
    if(!S.plans[wk]) S.plans[wk]={};
    Object.keys(d.plans[wk]).forEach(di=>{
      if(!S.plans[wk][di]) S.plans[wk][di]={};
      Object.keys(d.plans[wk][di]).forEach(mk=>{
        if(S.plans[wk][di][mk] && S.plans[wk][di][mk].r) return;   // não mexe no que já está marcado
        const ref=d.plans[wk][di][mk]||{};
        S.plans[wk][di][mk]={r:ref.r||'', ac:ref.ac||'', m:(ref.m||[]).map(x=>mapa[x]||x)};
        if(ref.r) refeicoes++;
      });
    });
  });
  Object.keys(d.bought).forEach(wk=>{ S.bought[wk]=Object.assign({}, d.bought[wk], S.bought[wk]||{}); });
  Object.keys(d.despensa||{}).forEach(k=>{ if(d.despensa[k]) S.despensa[k]=true; });   /* união: ter numa cópia chega */
  let objetivosNovos=0;
  (d.objetivos||[]).forEach(o=>{
    const mid=mapa[o.membroId]||o.membroId;
    if(!S.members.some(m=>m.id===mid)) return;   // o membro pode não ter sido trazido (nome repetido descartado, etc.)
    if(S.objetivos.some(x=>x.id===o.id)) return;   // já existe — não duplica
    S.objetivos.push(Object.assign({},o,{membroId:mid})); objetivosNovos++;
  });
  let receitasNovas=0;
  if(!Array.isArray(S.receitas)) S.receitas=[];
  (d.receitas||[]).forEach(r=>{
    if(S.receitas.some(x=>x.id===r.id || x.n.trim().toLowerCase()===r.n.trim().toLowerCase())) return;
    S.receitas.push(r); receitasNovas++;
  });
  if(receitasNovas) sincronizaReceitas();
  if(!S.ui.mid && S.members[0]) S.ui.mid=S.members[0].id;
  save();
  flash('ok','Cópia integrada: '+plural(novos,'perfil novo','perfis novos')+', '
    +plural(refeicoes,'refeição acrescentada','refeições acrescentadas')+', '
    +plural(receitasNovas,'receita nova','receitas novas')+' e '
    +plural(objetivosNovos,'objetivo novo','objetivos novos')+'. Perfis com o mesmo nome foram '
    +'tratados como a mesma pessoa e as refeições e objetivos já existentes ficaram intactos.');
}
function importarFicheiro(input,modo){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ modo==='juntar'? juntar(String(r.result)) : substituir(String(r.result)); };
  r.onerror=()=>flash('bad','Não foi possível ler o ficheiro «'+f.name+'».');
  r.readAsText(f); input.value='';
}
function importarCaixa(modo){
  const ta=document.getElementById('bkIn'); const txt=(ta&&ta.value||'').trim();
  if(!txt) return flash('bad','Cola primeiro o texto da cópia na caixa.');
  modo==='juntar'? juntar(txt) : substituir(txt);
}
function toggleAviso(v){ S.meta.avisarAoSair=v; saveMeta(); render(); }
function apagarTudo(){
  if(!confirm('Apagar TODOS os dados deste dispositivo — perfis, planos e compras?\n\nSó consegues recuperar se tiveres um ficheiro de cópia.')) return;
  if(!confirm('Confirmas mesmo? Esta ação não pode ser anulada.')) return;
  const avisar=S.meta.avisarAoSair;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=blank(); S.meta.avisarAoSair=avisar; S.ui.tab='dados'; saveMeta();
  flash('ok','Dados apagados. Podes recomeçar ou restaurar uma cópia.');
}
function tamanho(){
  const n=new Blob([JSON.stringify(S)]).size;
  return n<1024? n+' B' : (n/1024).toFixed(1)+' kB';
}
function cartaoAspeto(){
  const modo=S.ui.tema||'auto', pal=S.ui.paleta||'azulejo';
  const nFechados=Object.keys(S.ui.colapsados||{}).length;
  return `<div class="card" data-col="dados-aspeto">
    <h3>Aspeto ${dica('aspeto')}</h3>
    <div class="splabel" style="margin-top:10px"><span>Modo</span></div>
    <div class="row">${Object.entries(MODOS).map(([k,v])=>
      `<button class="chip ${modo===k?'on':''}" onclick="setTema('${k}')">${k==='claro'?'☀️':k==='escuro'?'🌙':'🖥️'} ${v}</button>`).join('')}</div>
    <div class="splabel" style="margin-top:14px"><span>Paleta</span></div>
    <div class="tema-grelha">${Object.entries(PALETAS).map(([k,p])=>
      `<button class="tema-op ${pal===k?'on':''}" onclick="setPaleta('${k}')" aria-pressed="${pal===k}">
        <span class="tema-amostra">${p.c.map(c=>`<i style="background:${c}"></i>`).join('')}</span>
        <span class="tema-nome">${p.n}${pal===k?' ✓':''}</span>
        <span class="sub" style="font-size:12px">${p.d}</span>
      </button>`).join('')}</div>
    <p class="sub" style="margin-top:12px">A paleta muda os acentos e o tom dos neutros; o modo claro ou escuro
      é independente e cada paleta tem os dois. «Segue o sistema» acompanha o que o telemóvel ou o computador
      estiverem a usar, e muda sozinho ao anoitecer se o aparelho o fizer.</p>
    ${nFechados? `<div class="row" style="margin-top:10px">
      <span class="sub">${plural(nFechados,'secção fechada','secções fechadas')} nesta app</span>
      <button class="btn ghost small" onclick="abrirTodasSeccoes()">Abrir todas</button></div>`:''}
  </div>`;
}
function abrirTodasSeccoes(){ S.ui.colapsados={}; saveMeta(); render(); }
function toggleAvatarEditor(mid){ S.ui.avatarAberto = S.ui.avatarAberto===mid? null : mid; saveMeta(); render(); }
function setAvatar(mid,campo,val){
  const m=S.members.find(x=>x.id===mid); if(!m) return;
  if(campo==='emoji'){ if(val) m.emoji=val; else delete m.emoji; }
  else if(/^#[0-9A-Fa-f]{6}$/.test(val)) m.cor=val;
  save('avatar de '+m.nome); render();
}

    <div class="card">

        <b>Juntar</b> acrescenta os perfis e refeições que faltam, sem apagar o que já tens — é a opção para

function tourAtivo(){ return Number.isFinite(S.ui.tourPasso); }
function iniciarTour(comExemplo){
  if(comExemplo && !S.members.length) semearFamiliaExemplo();
  S.ui.tourPasso=0; saveMeta(); irParaPassoTour();
}
function fecharTour(){
  S.ui.tourPasso=null; S.ui.tourVisto=true;
  limpaDestaqueTour();
  const c=document.getElementById('tour-cartao'); if(c) c.remove();
  saveMeta(); render();
}
function tourAnterior(){ if(S.ui.tourPasso>0){ S.ui.tourPasso--; saveMeta(); irParaPassoTour(); } }
function tourSeguinte(){
  if(S.ui.tourPasso>=TOUR.length-1) return fecharTour();
  S.ui.tourPasso++; saveMeta(); irParaPassoTour();
}
function irParaPassoTour(){
  const p=TOUR[S.ui.tourPasso]; if(!p) return fecharTour();
  S.ui.tab=p.tab; saveMeta(); render();   /* render repõe o cartão e o destaque */
}
function limpaDestaqueTour(){
  document.querySelectorAll('.tour-alvo').forEach(e=>e.classList.remove('tour-alvo'));
}
function pintaTour(){
  limpaDestaqueTour();
  let c=document.getElementById('tour-cartao');
  if(!tourAtivo()){ if(c) c.remove(); return; }
  const p=TOUR[S.ui.tourPasso];
  if(!c){ c=document.createElement('div'); c.id='tour-cartao'; c.className='tour-cartao';
    c.setAttribute('role','dialog'); c.setAttribute('aria-label','Visita guiada'); document.body.appendChild(c); }
  c.innerHTML=`<div class="row" style="justify-content:space-between;align-items:baseline">
      <h3>${esc(p.t)}</h3><span class="sub">${S.ui.tourPasso+1} de ${TOUR.length}</span></div>
    <p class="sub">${p.d}</p>
    <div class="tour-progresso" aria-hidden="true">${TOUR.map((_,i)=>`<i class="${i<=S.ui.tourPasso?'feito':''}"></i>`).join('')}</div>
    <div class="tour-acoes">
      <button class="btn ghost small" onclick="fecharTour()">Sair</button>
      <span style="flex:1"></span>
      ${S.ui.tourPasso>0? '<button class="btn ghost" onclick="tourAnterior()">← Anterior</button>':''}
      <button class="btn" onclick="tourSeguinte()">${S.ui.tourPasso>=TOUR.length-1?'Terminar':'Seguinte →'}</button>
    </div>`;
  /* o alvo pode não existir neste estado (sem membros, sem plano) — o passo
     continua a fazer sentido pelo texto, só não há halo */
  const alvo=p.sel? document.querySelector(p.sel) : null;
  if(alvo){ alvo.classList.add('tour-alvo');
    try{ alvo.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){ alvo.scrollIntoView(); } }
}
/* Família de exemplo para a visita ter conteúdo real por baixo. Só é oferecida
   quando não há dados nenhuns, por isso nunca escreve por cima de nada. */
function semearFamiliaExemplo(){
  addMember(); Object.assign(S.members[0],{nome:'Ana',sexo:'f',idade:38,altura:166,peso:68,
    atividade:'leve',desloc:'pe30',dieta:'mediterranica',objetivoPct:-12,
    desportos:[normalizaDesporto({s:'corrida',km:18,v:9.5,per:'semana'}),
               normalizaDesporto({s:'yoga',h:2,per:'semana',i:'leve'})]});
  addMember(); Object.assign(S.members[1],{nome:'Bruno',sexo:'m',idade:41,altura:179,peso:86,
    atividade:'sedentario',desloc:'nenhum',dieta:'lowcarb',objetivoPct:-15,
    desportos:[normalizaDesporto({s:'ciclismo',km:60,v:22,per:'semana'})]});
  addMember(); Object.assign(S.members[2],{nome:'Rita',sexo:'f',idade:9,altura:134,peso:30,
    atividade:'moderado',desloc:'pe30',dieta:'equilibrada',
    desportos:[normalizaDesporto({s:'natacao',km:2,v:2.2,per:'semana'})]});
  S.members.forEach(normalizaMembro);
  S.ui.mid=S.members[0].id;
  ['Ovo','Azeite','Cebola','Alho','Tomate','Arroz','Batata','Leite'].forEach(n=>{
    if(catalogoIngredientes().indexOf(n)>=0) S.despensa[n]=true; });
  autoFill();   /* já grava */
  S.objetivos.push({id:uid(), membroId:S.members[1].id, tipo:'perder',
    pesoInicial:88, pesoAlvo:82, semanas:12, dataInicio:new Date(Date.now()-21*24*3600*1000).toISOString(),
    splitDieta:60, desportoEscolhido:'ciclismo', bandaManter:2,
    concluido:false, celebrado:false, dataConclusao:null});
  save('família de exemplo');
}

function noMembers(){ return estadoVazio('familia','Ainda não há ninguém aqui',
  'Este separador precisa de pelo menos um perfil para ter o que mostrar. Cria o primeiro — leva menos de um minuto — ou faz a visita guiada com uma família de exemplo.',
  `<button class="btn" onclick="go('familia')">Ir para Família</button>
   <button class="btn ghost" onclick="iniciarTour(true)">✨ Visita guiada</button>`); }
function render(){
  /* Um arrasto muta o estado no oninput e só grava no change. Se esse change
     nunca chegar — mudou-se de separador a meio, o dedo saiu do slider — a
     alteração ficava por confirmar e o desfazer seguinte saltava por cima
     dela, repondo dois passos atrás. Redesenhar significa que o gesto
     acabou, por isso é aqui que se compromete o que ficou pendente. */
  if(estadoAnterior!==null && instantaneo()!==estadoAnterior) save();
  document.getElementById('nav').innerHTML = TABS.map(([k,v])=>
    `<button class="${S.ui.tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
  const el=document.getElementById('main');
  el.innerHTML = S.ui.tab==='atividade'? renderAtividade()
    : S.ui.tab==='nutricao'? renderNutricao()
    : S.ui.tab==='receitas'? renderReceitas()
    : S.ui.tab==='objetivos'? renderObjetivos()
    : S.ui.tab==='plano'? renderPlano()
    : S.ui.tab==='despensa'? renderDespensa()
    : S.ui.tab==='compras'? renderCompras()
    : S.ui.tab==='dados'? renderDados()
    : renderFamilia();
  /* semeia os valores que só o atualizador escreve (pill de ritmo, etc.) */
  if(S.ui.tab==='nutricao' && S.members.length) atualizarNutricao();
  montaColapsaveis(); pintaAura();
  paintSave(); pintaHist(); pintaTour();
}
/* Ctrl+Z / Ctrl+Shift+Z (ou ⌘ no Mac). Dentro de um campo de texto não se
   intercepta nada — aí o desfazer que faz sentido é o do próprio campo. */
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey) || e.altKey) return;
  const t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'&&['text','number','date'].indexOf(t.type)>=0) return;
  if(tag==='TEXTAREA') return;
  const k=(e.key||'').toLowerCase();
  if(k==='z' && !e.shiftKey){ e.preventDefault(); desfazer(); }
  else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); refazer(); }
});
/* A bolha nasce alinhada ao marcador; se isso a puser fora da janela, desliza
   o necessário para caber. A seta fica onde está, a apontar ao marcador. */
function posicionaDica(d){
  d.style.setProperty('--dx','0px');
  /* clientWidth e não innerWidth: este último inclui a barra de deslocação,
     e a bolha acabava 13 px fora do que a página realmente mostra. */
  const W=document.documentElement.clientWidth;
  const r=d.getBoundingClientRect();
  const larg=Math.min(270, W-24);
  const esq=r.left-4;
  let dx=0;
  if(esq+larg > W-12) dx=(W-12)-(esq+larg);
  if(esq+dx < 12) dx=12-esq;
  d.style.setProperty('--dx', Math.round(dx)+'px');
}
document.addEventListener('mouseover', e=>{ const d=e.target.closest&&e.target.closest('.dica'); if(d) posicionaDica(d); });
document.addEventListener('focusin', e=>{ const d=e.target.closest&&e.target.closest('.dica'); if(d) posicionaDica(d); });
/* Ao toque não há hover: o marcador de explicação alterna com um toque. */
document.addEventListener('click', e=>{
  const d=e.target.closest && e.target.closest('.dica');
  document.querySelectorAll('.dica.on').forEach(x=>{ if(x!==d) x.classList.remove('on'); });
  if(d){ e.preventDefault(); posicionaDica(d); d.classList.toggle('on'); }
});
aplicarEcra();
aplicarTema();
/* Em modo automático, seguir o sistema quando ele muda a meio da sessão. */
try{ const mq=matchMedia('(prefers-color-scheme: dark)');
  const reagir=()=>{ if((S.ui.tema||'auto')==='auto'){ aplicarTema(); render(); } };
  if(mq.addEventListener) mq.addEventListener('change',reagir); else if(mq.addListener) mq.addListener(reagir);
}catch(e){}
ligarOrientacao();
/* O explicador do cabeçalho vive em HTML estático, fora dos templates — o
   texto vem do mesmo registo que todos os outros, para não haver duas cópias. */
(function(){ const d=document.getElementById('dica-desfazer');
  if(d) d.setAttribute('data-dica', DICAS.desfazer); })();
estadoAnterior=instantaneo();   /* base do histórico: o estado tal como foi carregado */
render();

/* Instalável no ecrã principal e utilizável sem rede (útil para a lista de
   compras no supermercado). Só corre em http/https — via file:// é ignorado. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
