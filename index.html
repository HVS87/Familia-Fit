/* ================= PLANO SEMANAL ================= */
function shiftWeek(n){ const d=new Date(S.week+'T12:00:00'); d.setDate(d.getDate()+7*n); S.week=mondayISO(d); saveMeta(); render(); }
function planWeek(){ if(!S.plans[S.week]) S.plans[S.week]={}; return S.plans[S.week]; }
function planMeal(di,mk){ const w=planWeek(); if(!w[di]) w[di]={}; if(!w[di][mk]) w[di][mk]={r:'',ac:[],m:S.members.map(x=>x.id)}; return w[di][mk]; }
function setMeal(di,mk,rid){ const meal=planMeal(di,mk); meal.r=rid;
  if(!rid) meal.ac=[];   /* tirar o prato tira os acompanhamentos: um arroz sozinho não é plano */
  save('escolha de refeição'); render(); }
/* Trocar um acompanhamento por outro é mudar o seletor daquela linha; deixar
   o seletor vazio é tirar aquela linha, e as que ficam voltam a repartir o
   lugar entre si. */
function setAcomp(di,mk,i,rid){
  const meal=planMeal(di,mk), ids=acIds(meal);
  if(rid){
    if(ids.indexOf(rid)>=0 && ids[i]!==rid) return flash('warn','Esse acompanhamento já está nesta refeição.');
    if(i>=MAX_AC) return;
    ids[i]=rid;
  } else ids.splice(i,1);
  meal.ac=ids.filter(Boolean).slice(0,MAX_AC);
  save('acompanhamento'); render();
}
function toggleEater(di,mk,mid){ const meal=planMeal(di,mk);
  meal.m = meal.m.includes(mid)? meal.m.filter(x=>x!==mid) : [...meal.m,mid]; save(); render(); }
function toggleCheat(mid,date){ if(!S.cheats[mid]) S.cheats[mid]=[];
  const i=S.cheats[mid].indexOf(date); i>=0? S.cheats[mid].splice(i,1) : S.cheats[mid].push(date);
  save('cheat day'); render(); }
function clearWeek(){ if(confirm('Limpar todas as refeições desta semana?')){ delete S.plans[S.week]; delete S.bought[S.week]; save('limpeza da semana'); render(); } }
/* Os acompanhamentos vivem à parte: não aparecem nas listas de pratos nem nas
   sugestões de refeição, porque ninguém janta um arroz de coentros sozinho.
   Aparecem só na linha do acompanhamento, depois de haver prato escolhido. */
function receitasDe(mk){ return RECIPES.filter(r=>r.mt.indexOf(mk)>=0 && r.mt.indexOf('ac')<0); }
function acompanhamentos(){ return RECIPES.filter(r=>r.mt.indexOf('ac')>=0); }
function ehAcompanhamento(r){ return !!r && r.mt.indexOf('ac')>=0; }

/* ---- Acompanhamentos: um lugar no prato, repartido ----
   Ao lado do bife não cabe uma dose de batatas E uma dose de arroz — cabe uma
   dose de acompanhamento. Por isso o prato tem UM lugar ao lado, e quem quiser
   dois divide-o: meia dose de cada, ou um terço com três. As calorias, os
   macros e as quantidades da lista de compras contam sempre essa fatia, nunca
   a dose inteira — senão juntar uma salada a umas batatas inventava comida
   que ninguém pôs na mesa.

   Guardava-se um id só. Aceita-se ainda essa forma, porque há cópias
   exportadas e gravadas antes disto. (MAX_AC vive lá em cima, com as
   refeições: os registos precisam dele antes daqui.) */
function acIds(meal){
  if(!meal || !meal.ac) return [];
  const arr=Array.isArray(meal.ac)? meal.ac : [meal.ac];
  const out=[];
  arr.forEach(id=>{ if(id && out.indexOf(id)<0 && out.length<MAX_AC) out.push(id); });
  return out;
}
function acompsDe(meal){ return acIds(meal).map(id=>RECIPES.find(x=>x.id===id)).filter(Boolean); }
/* A fatia que cabe a cada acompanhamento. Zero sem nenhum, para as somas
   ficarem naturalmente a zero em vez de precisarem de um caso especial. */
function fatiaAc(acs){ return acs&&acs.length? 1/acs.length : 0; }
function somaAc(acs,campo){ return Math.round((acs||[]).reduce((t,x)=>t+(x[campo]||0),0)*fatiaAc(acs)); }
function notaDivisao(n){
  if(n<2) return '';
  return 'a dividir o lugar do acompanhamento: '
    +(n===2? 'meia dose' : n===3? 'um terço de dose' : '1/'+n+' de dose')+' de cada';
}
/* Os acompanhamentos que servem esta mesa, por ordem de utilidade: primeiro os
   que já se podem fazer com o que há em casa. Sem teto de calorias próprio —
   o acompanhamento soma-se ao prato, e é o prato que já foi medido. */
function poolAcomp(di,mk){
  const meal=planWeek()[di]?.[mk], date=weekDates(S.week)[di];
  const comem=S.members.filter(m=>(meal? meal.m.includes(m.id) : true) && !isCheat(m.id,date));
  return acompanhamentos().filter(x=>avaliaReceita(x,comem,mk,false).ok)
    .sort((a,b)=>{
      const da=disponibilidadeReceita(a).pronta, db=disponibilidadeReceita(b).pronta;
      if(da!==db) return da? -1 : 1;
      return a.n.localeCompare(b.n,'pt');
    });
}
/* Trocar anda para o seguinte da lista em vez de sortear: carregar duas vezes
   dá dois acompanhamentos diferentes, e dar a volta traz o primeiro de volta.
   Sortear fazia repetir a mesma sugestão e parecia avariado. */
function trocarAcomp(di,mk,i){
  const meal=planMeal(di,mk), ids=acIds(meal); if(!ids[i]) return;
  const pool=poolAcomp(di,mk).filter(x=>x.id===ids[i] || ids.indexOf(x.id)<0);
  const j=pool.findIndex(x=>x.id===ids[i]);
  const nova=pool.length? pool[(j+1)%pool.length] : null;
  if(!nova || nova.id===ids[i]) return flash('warn','Não há outro acompanhamento que sirva esta mesa.');
  ids[i]=nova.id; meal.ac=ids;
  save('acompanhamento trocado'); render();
  flash('ok','Agora com '+nova.n.toLowerCase()+'.');
}
function juntarAcomp(di,mk){
  const meal=planMeal(di,mk); if(!meal.r) return;
  const ids=acIds(meal);
  if(ids.length>=MAX_AC) return flash('warn','Mais do que '+MAX_AC+' acompanhamentos deixam de ser acompanhamento.');
  const nova=poolAcomp(di,mk).find(x=>ids.indexOf(x.id)<0);
  if(!nova) return flash('warn','Não há mais acompanhamentos que sirvam esta mesa.');
  meal.ac=ids.concat(nova.id);
  save('acompanhamento juntado'); render();
  flash('ok','Juntou-se '+nova.n.toLowerCase()+' — '+notaDivisao(meal.ac.length)+'.');
}
function autoFill(){
  const dates=weekDates(S.week); const used=new Set(); let semSolucao=0;
  Object.values(planWeek()).forEach(d=>MEALK.forEach(k=>d[k]?.r&&used.add(d[k].r)));
  /* o food prep já planeado pesa nas escolhas: uma receita que aproveita uma
     preparação que já se vai fazer poupa trabalho a quem cozinha */
  const prepAtual=querPrep()? planoFoodPrep(S.week) : [];
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=planMeal(di,mk); if(meal.r) continue;
    const eaters=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di]));
    if(!eaters.length) continue;
    const doTipo=receitasDe(mk);
    /* Estreita-se o mais possível e vai-se alargando: cozinha preferida, teto
       de calorias, e por fim só o essencial. O que nunca cede é a dieta e os
       ingredientes vetados — servir a alguém o que essa pessoa não pode comer
       não é uma sugestão imperfeita, é um erro. O teto cede porque é uma
       questão de dose, e a dose ajusta-se no prato. */
    const seguras=doTipo.filter(r=>avaliaReceita(r,eaters,mk,false).ok);
    const cabem=seguras.filter(r=>avaliaReceita(r,eaters,mk,true).ok);
    const daCozinha=a=>a.filter(r=>S.prefCuisine==='todas'||r.coz===S.prefCuisine);
    let pool=daCozinha(cabem);
    if(!pool.length) pool=cabem;
    if(!pool.length) pool=daCozinha(seguras);
    if(!pool.length) pool=seguras;
    /* «Só ingredientes de época» é um filtro que pode esvaziar a lista: se
       esvaziar, cede — mais vale um jantar fora de época do que nenhum. */
    if(querSazonal()){ const ep=pool.filter(receitaDaEpoca); if(ep.length) pool=ep; }
    if(!pool.length){ semSolucao++; continue; }
    /* Repetir é uma escolha da casa: quando está ligada, o que já entrou na
       semana ganha peso em vez de o perder — cozinha-se uma vez, come-se duas. */
    const fresh=pool.filter(r=>!used.has(r.id));
    let alvo = querRepetir()
      ? (pool.filter(r=>used.has(r.id)).length && Math.random()<0.55
          ? pool.filter(r=>used.has(r.id)) : (fresh.length? fresh : pool))
      : (fresh.length? fresh : pool);
    /* o género do prato pesa com a estação e a refeição: no verão, ao almoço,
       um gaspacho vale mais do que uma feijoada */
    const notas=alvo.map(r=>({r, p:pesoGenero(r,mk)+(querPrep()? Math.min(2,encaixaNoPrep(r,prepAtual)*0.5):0)}));
    const maxP=Math.max(...notas.map(x=>x.p));
    const melhores=notas.filter(x=>x.p>=maxP-0.5).map(x=>x.r);
    const escolhida=melhores[Math.floor(Math.random()*melhores.length)];
    meal.r=escolhida.id; used.add(meal.r);
    /* repetir só faz sentido se a primeira vez cozinhar a dobrar */
    if(querRepetir() && querDobro()){
      const anterior=ehAquecer(di,mk);
      if(anterior){ const m0=planMeal(anterior.di,anterior.mk); m0.dobro=Math.min(4,fatorDobro(m0)+1); }
      else if(!fatorDobro(meal)>1) { /* fica por marcar; marca-se quando a repetição aparecer */ }
    }
    /* Almoços e jantares levam acompanhamento; um pequeno-almoço ou um lanche
       não. O acompanhamento respeita as mesmas dietas e vetos do prato. */
    if(mk==='a'||mk==='j'){
      const acs=acompanhamentos().filter(x=>avaliaReceita(x,eaters,mk,false).ok);
      const frescos=acs.filter(x=>!used.has(x.id));
      const escolha=(frescos.length? frescos : acs);
      /* Um por refeição: quem quiser dois divide o lugar à mão, no botão de
         juntar. O automático não decide sozinho repartir a dose. */
      if(escolha.length){ const e=escolha[Math.floor(Math.random()*escolha.length)];
        meal.ac=[e.id]; used.add(e.id); }
    }
  }
  save('preenchimento automático da semana'); render();
  if(semSolucao) toast(semSolucao+' refeições sem solução: nenhuma receita serve toda a mesa');
}
/* ================= SUGESTÕES PARA A SEMANA =================
   O problema real de uma casa com várias dietas não é escolher uma receita —
   é encontrar a que serve toda a gente à mesma mesa. Este painel parte da
   biblioteca inteira e vai tirando: a dieta de cada um, o que cada um não
   come, e o que não cabe na fatia de calorias daquela refeição. O que fica é
   o que se pode cozinhar uma vez e servir a todos.

   Os motivos de exclusão são contados e mostráveis de propósito: sem isso,
   uma família de quatro vê três jantares possíveis e não percebe porquê. */
function sugCfg(){
  if(!S.ui.sug || typeof S.ui.sug!=='object') S.ui.sug={membros:null,ref:'a',teto:true,cuis:'todas',verFora:false,epoca:false};
  const s=S.ui.sug;
  if(MEALK.indexOf(s.ref)<0) s.ref='a';
  if(s.cuis!=='todas' && !temChave(CUIS,s.cuis)) s.cuis='todas';
  return s;
}
/* Sem escolha feita, a mesa é a família inteira. A partir do primeiro toque
   a lista passa a ser explícita — incluindo a lista vazia, que quer mesmo
   dizer «ninguém», e não «toda a gente». */
function selSug(){
  const s=sugCfg();
  if(!Array.isArray(s.membros)) return S.members.map(m=>m.id);
  return s.membros.filter(id=>S.members.some(m=>m.id===id));
}
function membrosSug(){ const ids=selSug(); return S.members.filter(m=>ids.indexOf(m.id)>=0); }
function toggleSugMembro(mid){
  const s=sugCfg();
  if(!Array.isArray(s.membros)) s.membros=S.members.map(m=>m.id);
  const i=s.membros.indexOf(mid);
  i>=0? s.membros.splice(i,1) : s.membros.push(mid);
  saveMeta(); render();
}
function setSugRef(mk){ const s=sugCfg(); if(MEALK.indexOf(mk)>=0) s.ref=mk; saveMeta(); render(); }
function setSugCuis(v){ const s=sugCfg(); s.cuis=(v==='todas'||temChave(CUIS,v))? v:'todas'; saveMeta(); render(); }
function toggleSugTeto(){ const s=sugCfg(); s.teto=!s.teto; saveMeta(); render(); }
function toggleSugEpoca(){ const s=sugCfg(); s.epoca=!s.epoca; saveMeta(); render(); }
function toggleSugFora(){ const s=sugCfg(); s.verFora=!s.verFora; saveMeta(); render(); }
function todosSug(){ const s=sugCfg(); s.membros=S.members.map(m=>m.id); saveMeta(); render(); }

function sugestoes(){
  const s=sugCfg(), mk=s.ref, membros=membrosSug();
  let base=RECIPES.filter(r=>r.mt.indexOf(mk)>=0 && (s.cuis==='todas'||r.coz===s.cuis));
  /* «Só ingredientes de época» é um filtro explícito das sugestões por mesa */
  if(s.epoca){ const ep=base.filter(receitaDaEpoca); if(ep.length) base=ep; }
  const ok=[], fora={dieta:[],ingredientes:[],calorias:[]};
  base.forEach(r=>{
    const a=avaliaReceita(r,membros,mk,!!s.teto);
    if(a.ok) ok.push(r); else fora[a.motivo].push({r,a});
  });
  /* Primeiro o que já está na despensa — a sugestão mais útil é a que se pode
     cozinhar hoje; depois a mais perto da média das fatias de quem vai comer.
     Por cima disso pesam a época, o género do prato para a estação e o encaixe
     no food prep já planeado: são as preferências desta casa. */
  const alvo=membros.filter(contaTeto).map(m=>targetKcal(m)*fatiaRefeicao(mk));
  const medio=alvo.length? alvo.reduce((t,x)=>t+x,0)/alvo.length : 0;
  const prep=querPrep()? planoFoodPrep() : [];
  const bonus=r=>(receitaDaEpoca(r)?2:0)+pesoGenero(r,mk)+Math.min(2,encaixaNoPrep(r,prep)*0.5);
  ok.sort((a,b)=>{
    const da=disponibilidadeReceita(a), db=disponibilidadeReceita(b);
    if(da.pronta!==db.pronta) return da.pronta? -1:1;
    const ba=bonus(a), bb=bonus(b);
    if(Math.abs(ba-bb)>0.4) return bb-ba;
    if(medio) return Math.abs(a.k-medio)-Math.abs(b.k-medio);
    return a.n.localeCompare(b.n,'pt');
  });
  return {mk,membros,ok,fora,base};
}
function nomeCurto(m){ return esc(m.nome.split(' ')[0]); }
function planearSugestao(rid,valor,el){
  if(!valor) return;
  const p=valor.split('|'), di=parseInt(p[0],10), mk=p[1];
  const r=RECIPES.find(x=>x.id===rid);
  if(!r || !(di>=0&&di<7) || MEALK.indexOf(mk)<0) return;
  const meal=planMeal(di,mk);
  if(ehAcompanhamento(r)){
    /* um acompanhamento sem prato não é uma refeição planeada — ficava
       guardado sem aparecer em lado nenhum */
    if(!meal.r) return flash('warn','Escolhe primeiro o prato desta refeição: o acompanhamento vai ao lado dele.');
    const jaLa=acIds(meal);
    if(jaLa.indexOf(rid)>=0) return flash('warn','Esse acompanhamento já está nesta refeição.');
    if(jaLa.length>=MAX_AC) return flash('warn','Mais do que '+MAX_AC+' acompanhamentos deixam de ser acompanhamento.');
    meal.ac=jaLa.concat(rid);
  }
  else { meal.r=rid; }
  const ids=selSug(); if(ids.length) meal.m=ids.slice();
  if(el) el.value='';
  save('receita planeada');
  const divide=ehAcompanhamento(r) && acIds(meal).length>1? ' · '+notaDivisao(acIds(meal).length) : '';
  toast(r.n+' → '+DAYN[di]+', '+nomeRefeicao(mk).toLowerCase()+divide);
  render();
}
function seletorSlot(r,mk){
  const w=S.plans[S.week]||{};
  return `<select class="slot" aria-label="Planear ${esc(r.n)} num dia da semana" onchange="planearSugestao('${r.id}',this.value,this)">
    <option value="">📅 Planear em…</option>
    ${DAYN.map((d,di)=>{ const ocupado=w[di]&&w[di][mk]&&w[di][mk].r;
      return `<option value="${di}|${mk}">${d}${ocupado?' (ocupado)':''}</option>`; }).join('')}
  </select>`;
}
/* Quem tem um teto abaixo da receita não fica de fora da mesa: come menos.
   Dizê-lo é mais honesto do que esconder a receita — e é o que acontece em
   qualquer casa onde um adulto e uma criança comem o mesmo prato. */
function notaDoses(r,membros,mk){
  const menores=membros.filter(m=>contaTeto(m)&&doseSugerida(m,r,mk)<0.95);
  if(!menores.length) return '';
  return `<div class="sub">Dose sugerida: ${menores.map(m=>nomeCurto(m)+' '+nPT(doseSugerida(m,r,mk),1)+'×').join(' · ')}
    ${membros.length>menores.length? '· os restantes 1×':''}</div>`;
}
function cartaoSugestao(r,membros,mk){
  const n=membros.length||1, disp=disponibilidadeReceita(r), falta=disp.total-disp.tem;
  return `<div class="rc">
    <div class="row" style="justify-content:space-between"><h3>${esc(r.n)}</h3><span class="kcal">${r.k} kcal</span></div>
    <div><span class="tag">${ICO_COZ[r.coz]||''} ${CUIS[r.coz]}</span>${r.dc.filter(d=>d!==r.coz).map(d=>`<span class="tag">${DIETS[d].n}</span>`).join('')}</div>
    <div class="sub" style="font-variant-numeric:tabular-nums">H ${r.c} g · P ${r.p} g · G ${r.f} g por dose</div>
    ${notaDoses(r,membros,mk)}
    <span class="pill ${disp.pronta?'ok':disp.tem?'warn':''}" style="align-self:flex-start">${disp.pronta?'Pronta a cozinhar':falta+' ingrediente'+(falta===1?'':'s')+' em falta'}</span>
    <details class="quant"><summary>Quantidades para ${n} pessoa${n===1?'':'s'}</summary>
      <div class="sub">${textoEscala(r,n)}</div></details>
    ${seletorSlot(r,mk)}
  </div>`;
}
function motivoTexto(e){
  const f=e.a.fora;
  if(f.dieta.length) return f.dieta.map(m=>nomeCurto(m)+' ('+dietaDe(m).n+')').join(' · ');
  if(f.ingredientes.length) return f.ingredientes.map(x=>nomeCurto(x.m)+': '+x.itens.map(esc).join(', ')).join(' · ');
  return f.calorias.map(x=>nomeCurto(x.m)+': teto '+x.teto+' kcal').join(' · ');
}
function listaFora(titulo,arr){
  if(!arr.length) return '';
  return `<div style="margin-top:10px"><b class="sub">${titulo} (${arr.length})</b>
    <ul class="fora">${arr.slice(0,12).map(e=>`<li>${esc(e.r.n)} <span class="sub">— ${motivoTexto(e)}</span></li>`).join('')}
    ${arr.length>12? `<li class="sub">… e mais ${arr.length-12}</li>`:''}</ul></div>`;
}
function cartaoSugestoes(){
  const s=sugCfg(), sel=selSug();
  const g=sugestoes(), membros=g.membros;
  const nFora=g.fora.dieta.length+g.fora.ingredientes.length+g.fora.calorias.length;
  return `<div class="card" id="sug" style="margin-bottom:16px" data-col="pla-sugestoes">
    <h2>Sugestões para a semana ${dica('sugestoes')}</h2>
    <p class="sub">Receitas que servem <b>ao mesmo tempo</b> toda a gente que estiver ligada aqui em baixo — a mesma panela, sem exceções para ninguém.</p>
    <div class="row" style="margin-top:10px;align-items:center">
      <span class="sub">Para quem:</span>
      ${S.members.map(m=>`<button class="chip ${sel.indexOf(m.id)>=0?'on':''}" onclick="toggleSugMembro('${m.id}')">${avatar(m,20)} ${nomeCurto(m)}</button>`).join('')}
      ${sel.length<S.members.length? `<button class="chip" onclick="todosSug()">Todos</button>`:''}
    </div>
    <div class="row" style="margin-top:8px">
      ${MEALS.map(([kk,rot])=>`<button class="chip ${s.ref===kk?'on':''}" onclick="setSugRef('${kk}')">${ICO_REF[kk]||''} ${rot}</button>`).join('')}
    </div>
    <div class="row" style="margin-top:8px">
      <select style="width:auto" aria-label="Cozinha das sugestões" onchange="setSugCuis(this.value)"><option value="todas">Todas as cozinhas</option>
        ${Object.entries(CUIS).map(([kk,v])=>`<option value="${kk}" ${s.cuis===kk?'selected':''}>${(ICO_COZ[kk]||'')+' '+v}</option>`).join('')}</select>
      <button class="chip ${s.teto?'on':''}" onclick="toggleSugTeto()">🎯 Respeitar o teto de calorias</button>
      <button class="chip ${s.epoca?'on':''}" onclick="toggleSugEpoca()" aria-pressed="${!!s.epoca}">🌱 Só ingredientes de época</button>
    </div>
    ${!membros.length? `<p class="sub" style="margin-top:14px">Nenhum membro selecionado — liga pelo menos um para haver mesa.</p>`
     : !g.ok.length? estadoVazio('lupa','Nada serve esta mesa ao mesmo tempo',
        'Das '+g.base.length+' receitas para esta refeição, nenhuma passa em todos os critérios de '+membros.length+' pessoa'+(membros.length===1?'':'s')+'. Desliga alguém, alarga a cozinha ou dispensa o teto de calorias — ou planeia pratos diferentes para cada um.',
        `<button class="btn ghost" onclick="toggleSugTeto()">${s.teto?'Dispensar o teto':'Repor o teto'}</button>
         <button class="chip" onclick="toggleSugFora()">Ver o que ficou de fora</button>`)
     : `<p class="sub" style="margin-top:14px"><b style="color:var(--ok)">${g.ok.length}</b> de ${g.base.length} receitas servem ${membros.length===1? nomeCurto(membros[0]) : 'as '+membros.length+' pessoas'} ao ${nomeRefeicao(s.ref).toLowerCase()}.
        ${nFora? `Ficaram de fora ${nFora}: ${[g.fora.dieta.length?g.fora.dieta.length+' por dieta':'',g.fora.ingredientes.length?g.fora.ingredientes.length+' por ingrediente':'',g.fora.calorias.length?g.fora.calorias.length+' por calorias':''].filter(Boolean).join(' · ')}.
        <button class="chip" onclick="toggleSugFora()">${s.verFora?'Esconder motivos':'Ver motivos'}</button>`:''}</p>
        <div class="grid g3" style="margin-top:8px">${g.ok.slice(0,12).map(r=>cartaoSugestao(r,membros,s.ref)).join('')}</div>
        ${g.ok.length>12? `<p class="sub" style="margin-top:8px">A mostrar as 12 primeiras, por ordem do que já tens na despensa. As outras ${g.ok.length-12} estão na lista de cada refeição, em baixo.</p>`:''}`}
    ${s.verFora? `<div class="fora-box">${listaFora('Fora da dieta',g.fora.dieta)}${listaFora('Ingrediente que alguém não come',g.fora.ingredientes)}${listaFora('Acima do teto de calorias',g.fora.calorias)}</div>`:''}
  </div>`;
}

const MOTIVO_CURTO={dieta:'dieta',ingredientes:'ingrediente',calorias:'calorias'};
/* O que se mostra depois de a receita estar escolhida: o que falta na
   despensa, quem é que ela não serve e — o número que ninguém quer fazer de
   cabeça — as quantidades já multiplicadas por quem se senta à mesa. */
function blocoReceitaPlaneada(r,comem,mk,acs,extra){
  const n=comem.length+(extra||0), disp=disponibilidadeReceita(r), falta=disp.total-disp.tem;
  const a=avaliaReceita(r,comem,mk,true);
  acs=acs||[];
  /* Com acompanhamento, o que interessa é o total do que vai para a mesa: um
     bife de 300 kcal com batatas fritas de 280 não é uma refeição de 300. Com
     mais do que um, cada um entra pela fatia que lhe cabe do mesmo lugar —
     meia dose de batatas e meia de salada, não uma dose de cada. */
  const q=fatiaAc(acs);
  const kt=r.k+somaAc(acs,'k'), ct=r.c+somaAc(acs,'c'), pt=r.p+somaAc(acs,'p'), ft=r.f+somaAc(acs,'f');
  const faltaAc=acs.reduce((t,x)=>{ const d=disponibilidadeReceita(x); return t+(d.total-d.tem); },0);
  const total=falta+faltaAc;
  return `<div class="sub" style="margin-top:4px">${acs.length? `<b>${kt} kcal</b> com ${acs.length===1?'o acompanhamento':'os acompanhamentos'} · `:''}H ${ct} · P ${pt} · G ${ft} g/dose
    ${total>0?' · <span style="color:var(--warn)">'+total+' ingrediente'+(total===1?'':'s')+' em falta</span>':' · <span style="color:var(--ok)">✓ tens tudo</span>'}</div>
    ${a.ok?'':`<div class="sub" style="color:var(--warn)">⚠ ${motivoTexto({r,a})}</div>`}
    ${notaDoses(r,comem,mk)}
    ${n? `<details class="quant"><summary>Quantidades para ${n} pessoa${n===1?'':'s'}</summary>
      <div class="sub">${textoEscala(r,n)}${acs.map(x=>'<br><b>'+esc(x.n)+(acs.length>1? ' ('+(acs.length===2?'meia dose':'1/'+acs.length)+')':'')
        +':</b> '+textoEscala(x,n,q)).join('')}</div></details>`:''}`;
}
/* A lista não esconde nada: separa o que serve esta mesa do que não serve, e
   diz porquê em cada linha. Esconder seria decidir pela pessoa.

   Mas 28 refeições × quase trezentas receitas são milhares de elementos numa página
   que se redesenha inteira a cada toque — e num telemóvel isso sente-se. Por
   isso a lista só é construída quando alguém vai mesmo abrir aquele seletor:
   o fecho é preenchido no foco, antes de o menu nativo aparecer, e os três
   eventos cobrem rato, teclado e dedo. */
function opcoesRefeicao(di,mk,tipo,i){
  const meal=planWeek()[di]?.[mk], date=weekDates(S.week)[di];
  const acomp=tipo==='ac';
  const ids=acIds(meal);
  const rid=acomp? (ids[i]||'') : (meal&&meal.r);
  const comem=S.members.filter(m=>(meal? meal.m.includes(m.id) : true) && !isCheat(m.id,date));
  /* os acompanhamentos já escolhidos nas outras linhas saem da lista: repetir
     o mesmo arroz duas vezes só dividia a dose dele ao meio */
  const lista=acomp? acompanhamentos().filter(x=>x.id===rid || ids.indexOf(x.id)<0) : receitasDe(mk);
  const servem=[], outras=[];
  /* O acompanhamento não leva teto de calorias próprio: ele soma-se ao prato,
     e é o prato que já foi medido contra a fatia da refeição. Filtrá-lo pelo
     mesmo teto escondia quase tudo por uma conta feita duas vezes. */
  lista.forEach(x=>{ const a=avaliaReceita(x,comem,mk,!acomp); (a.ok?servem:outras).push({r:x,a}); });
  const op=e=>`<option value="${e.r.id}" ${rid===e.r.id?'selected':''}>${esc(e.r.n)} · ${e.r.k} kcal${e.a.ok?'':' — '+MOTIVO_CURTO[e.a.motivo]}</option>`;
  return `<option value="">${acomp? (rid?'— tirar este acompanhamento —':'— sem acompanhamento —') : '— escolher receita —'}</option>`
    +(!comem.length? lista.map(x=>op({r:x,a:{ok:true}})).join('')
      : (servem.length? `<optgroup label="Servem ${comem.length===1? nomeCurto(comem[0]) : 'os '+comem.length+' à mesa'}">${servem.map(op).join('')}</optgroup>`:'')
        +(outras.length? `<optgroup label="Fora dos critérios">${outras.map(op).join('')}</optgroup>`:''));
}
function encheSelect(el){
  if(el.dataset.cheio) return;
  const di=parseInt(el.dataset.di,10), mk=el.dataset.mk, valor=el.value;
  el.innerHTML=opcoesRefeicao(di,mk,el.dataset.tipo,parseInt(el.dataset.i,10)||0);
  el.value=valor; el.dataset.cheio='1';
}
/* A linha de acompanhamento: um seletor por escolha, cada um com o seu botão
   de trocar, e o convite a juntar outro enquanto houver lugar. Com mais do que
   um, diz-se logo ali como fica repartida a dose — a conta que se segue é
   essa, e ninguém tem de a adivinhar. */
function blocoAcomp(di,mk,acs,label){
  const ref=label.toLowerCase(), dia=DAYN[di].toLowerCase();
  const sel=(i,x)=>`<select class="acomp ${x?'cheio':''}" data-di="${di}" data-mk="${mk}" data-tipo="ac" data-i="${i}"
      onfocus="encheSelect(this)" onmousedown="encheSelect(this)" ontouchstart="encheSelect(this)"
      onchange="setAcomp(${di},'${mk}',${i},this.value)"
      aria-label="${acs.length>1? 'Acompanhamento '+(i+1)+' do ' : 'Acompanhamento do '}${ref} de ${dia}">
      <option value="">🍚 ${x?'— tirar este acompanhamento —':'— sem acompanhamento —'}</option>
      ${x? `<option value="${x.id}" selected>🍚 ${esc(x.n)} · ${x.k} kcal</option>`:''}
    </select>`;
  const linhas=acs.length
    ? acs.map((x,i)=>`<div class="ac-linha">${sel(i,x)}
        <button class="btn ghost ac-troca" onclick="trocarAcomp(${di},'${mk}',${i})"
          title="Trocar por outro acompanhamento"
          aria-label="Trocar ${esc(x.n)} por outro acompanhamento do ${ref} de ${dia}">🔀</button>
      </div>`).join('')
    : `<div class="ac-linha">${sel(0,null)}</div>`;
  return linhas
    +(acs.length&&acs.length<MAX_AC? `<button class="chip" style="margin-top:6px"
        onclick="juntarAcomp(${di},'${mk}')"
        aria-label="Juntar outro acompanhamento ao ${ref} de ${dia}, a dividir a dose">＋ juntar acompanhamento</button>`:'')
    +(acs.length>1? `<span class="ac-divide">⚖ ${notaDivisao(acs.length)}</span>`:'');
}
/* Quem, dos que estavam à mesa, já confirmou esta refeição. É daqui que sai o
   lápis-ou-tinta do cartão e o desenho da mesa cheia. */
function estadoValidacaoRef(comem,date,mk){
  const ids=comem.map(m=>m.id);
  const feitas=(S.regRef||[]).filter(r=>r.d===date && r.mk===mk && r.estado==='feita' && ids.indexOf(r.mid)>=0);
  const falhadas=(S.regRef||[]).filter(r=>r.d===date && r.mk===mk && r.estado==='falhada' && ids.indexOf(r.mid)>=0);
  const n=new Set(feitas.map(r=>r.mid)).size;
  return {n, total:ids.length, cheia:ids.length>0 && n===ids.length,
    alguma:n>0, falhou:!n && falhadas.length>0};
}
function mealBlock(di,mk,label,date){
  const meal=planWeek()[di]?.[mk]; const r=meal&&RECIPES.find(x=>x.id===meal.r);

  const comem=members.filter(m=>(meal? meal.m.includes(m.id) : true) && !isCheat(m.id,date));
  const v=estadoValidacaoRef(comem,date,mk);
  /* a lápis enquanto é só intenção; a tinta quando alguém confirmou */
  const tinta=r? (v.alguma? 'a-tinta' : v.falhou? '' : 'a-lapis') : '';
  return `<div class="meal ${tinta}" id="meal-${di}-${mk}">
    <div class="row" style="justify-content:space-between;align-items:center;gap:6px">
      <div class="mtitle">${label}</div>
      ${v.alguma? carimbo('ref:'+date+':'+mk) : v.falhou? carimbo('ref:'+date+':'+mk,'falhou') : ''}
      ${r&&v.cheia&&comem.length>1? `<span class="mesa-cheia" title="Mesa cheia: comeram todos os que estavam previstos">${mesaSvg(comem.length,comem.length,30)}</span>`:''}
    </div>
    ${r? [r].concat(acs).map(x=>avisoAlergia(x,comem.concat(membrosVirtuais(meal)),true)).join('') : ''}
    <select class="sel-receita ${r?'cheio':''}" data-di="${di}" data-mk="${mk}" data-tipo="r"
      aria-label="Receita de ${label.toLowerCase()} de ${DAYN[di].toLowerCase()}"
      onfocus="encheSelect(this)" onmousedown="encheSelect(this)"
      ontouchstart="encheSelect(this)" onchange="setMeal(${di},'${mk}',this.value)">
      <option value="">— escolher receita —</option>
      ${r? `<option value="${r.id}" selected>${esc(r.n)} · ${r.k} kcal</option>`:''}
    </select>
    ${r&&(mk==='a'||mk==='j')? blocoAcomp(di,mk,acs,label) : ''}
    ${r? blocoReceitaPlaneada(r,comem,mk,acs,nConvidados(meal)) : ''}
    <div class="row" style="margin-top:7px">${members.map(m=>{
      const on=meal? meal.m.includes(m.id) : true, cheat=isCheat(m.id,date);
      return `<button class="chip ${on&&!cheat?'on':''}" ${cheat?'style="opacity:.45" title="Cheat day"':''}
        onclick="toggleEater(${di},'${mk}','${m.id}')">${avatar(m,20)} ${esc(m.nome.split(' ')[0])}${cheat?' 🎉':''}</button>`;}).join('')}
    </div>
    ${r? blocoConvidados(di,mk,meal) : ''}
    ${r? blocoPorcoes(di,mk,meal,r) : ''}
    ${r&&(mk==='a'||mk==='j')? blocoMarmita(di,mk,meal,comem) : ''}
    ${r? `<div class="row" style="margin-top:8px">
      <button class="btn ghost small" onclick="abrirCozinha('${r.id}',${comem.length+nConvidados(meal)},'${date}|${mk}')">👨‍🍳 Cozinhar</button>
      ${date<=hojeISO()? `<button class="btn ghost small" onclick="abrirFolhaMesa('${date}','${mk}')">✓ Quem comeu</button>`:''}
    </div>`:''}
  </div>`;
}
/* Convidados: mais dois à mesa sem criar perfis. As doses, os acompanhamentos
   e a lista de compras escalam já; as alergias entram no filtro só desta

function blocoConvidados(di,mk,meal){

/* As mesas da semana: uma por dia, com um lugar por pessoa prevista e os
   lugares ocupados por quem confirmou. Só aparece quando já há registos —
   sete mesas vazias não contam história nenhuma. */
function mesasDaSemana(dates){
  if(S.members.length<2) return '';
  const dias=dates.map((date,di)=>{
    let prev=0, ocup=0, cheias=0, refs=0;
    MEALK.forEach(mk=>{
      const meal=(planWeek()[di]||{})[mk]; if(!meal||!meal.r) return;
      const comem=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,date));
      if(!comem.length) return;
      const v=estadoValidacaoRef(comem,date,mk);
      prev+=v.total; ocup+=v.n; refs++;
      if(v.cheia) cheias++;
    });
    return {date, di, prev, ocup, cheias, refs};
  });
  if(!dias.some(x=>x.ocup>0)) return '';
  const total=dias.reduce((t,x)=>t+x.cheias,0);
  return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
    <div class="splabel"><span>Mesas cheias ${dica('mesaCheia')}</span>
      <output>${plural(total,'refeição com todos','refeições com todos')}</output></div>
    <div class="mesas-semana">${dias.map(x=>{
      const n=Math.max(1,Math.round(x.prev/Math.max(1,x.refs)));
      const o=Math.round(x.ocup/Math.max(1,x.refs));
      return `<span class="mesa-dia" style="color:${x.cheias?'var(--accent)':'var(--mut)'}"
        title="${DAYN[x.di]}: ${plural(x.cheias,'mesa cheia','mesas cheias')} em ${plural(x.refs,'refeição','refeições')}">
        ${mesaSvg(n, x.refs? o : 0, 34)}<span>${['S','T','Q','Q','S','S','D'][x.di]}</span></span>`;}).join('')}</div>
  </div>`;
}
/* ================= REFEIÇÕES PARA PARTILHAR =================
   Cozinhar duas coisas diferentes para a mesma mesa é o trabalho a dobrar que
   as casas com dietas diferentes fazem todos os dias. Quando duas pessoas
   gostam do mesmo e querem o peso a ir para o mesmo lado, o prato pode ser um
   só — e o que se ajusta é a dose de cada um e o que vai ao lado, não a
   receita. É assim que se come em conjunto sem comer o mesmo. */
function gostosDe(mid){
  /* o que a pessoa já comeu e o que tem planeado: o gosto lê-se do que se
     repete, não de uma preferência declarada que ninguém preenche */
  const conta={};
  regRefDe(mid).filter(r=>r.estado==='feita').forEach(r=>{ conta[r.r]=(conta[r.r]||0)+2; });
  Object.values(S.plans||{}).forEach(w=>Object.values(w).forEach(d=>MEALK.forEach(k=>{
    const meal=d[k];
    if(meal&&meal.r&&Array.isArray(meal.m)&&meal.m.indexOf(mid)>=0) conta[meal.r]=(conta[meal.r]||0)+1;
  })));
  return conta;
}
/* Como cada pessoa adapta o mesmo prato ao seu objetivo: a dose sai do teto
   de calorias que já é calculado para ela; o acompanhamento aligeira-se para
   quem está em défice, porque é aí que estão as calorias fáceis de tirar. */
const KCAL_AC_LEVE=140;
function ajusteRefMembro(r,m,mk,acs){
  const dose=doseSugerida(m,r,mk);
  const dir=direcaoObjetivo(m);
  let ac=acs.map(x=>x.id), nota='';
  if(dir==='perder' && acs.length){
    const pesados=acs.filter(x=>x.k>KCAL_AC_LEVE);
    if(pesados.length){
      const leve=acompanhamentos().filter(x=>x.k<=KCAL_AC_LEVE && avaliaReceita(x,[m],mk,false).ok
        && ac.indexOf(x.id)<0).sort((a,b)=>a.k-b.k)[0];
      ac=acs.filter(x=>x.k<=KCAL_AC_LEVE).map(x=>x.id);
      if(leve && !ac.length) ac=[leve.id];
      nota = ac.length? 'troca o acompanhamento por '+(leve&&ac.indexOf(leve.id)>=0? leve.n.toLowerCase() : 'o mais leve')
        : 'sem acompanhamento';
    }
  } else if(dir==='ganhar' && dose>=1){ nota='dose cheia'; }
  return {dose, ac, nota};
}
function sugestoesPartilhaRef(){
  const elegiveis=S.members.filter(m=>faseDe(m)!=='bebe');
  if(elegiveis.length<2) return [];
  const grupos={};
  elegiveis.forEach(m=>{ const k=direcaoObjetivo(m); (grupos[k]=grupos[k]||[]).push(m); });
  const out=[];
  Object.entries(grupos).forEach(([dir,membros])=>{
    if(membros.length<2) return;
    const gosto={};
    membros.forEach(m=>{ const g=gostosDe(m.id);
      Object.keys(g).forEach(rid=>{ gosto[rid]=(gosto[rid]||0)+g[rid]; }); });
    MEALK.forEach(mk=>{
      const candidatas=receitasDe(mk).filter(r=>compatAll(r,membros));
      if(!candidatas.length) return;
      candidatas.sort((a,b)=>{
        const ga=gosto[a.id]||0, gb=gosto[b.id]||0;
        if(ga!==gb) return gb-ga;
        const da=disponibilidadeReceita(a).pronta, db=disponibilidadeReceita(b).pronta;
        if(da!==db) return da? -1:1;
        return a.n.localeCompare(b.n,'pt');
      });
      const r=candidatas[0];
      if(!(gosto[r.id]>0)) return;   /* sem gosto comum, é só uma receita compatível — isso já existe nas sugestões */
      const acs=(mk==='a'||mk==='j')? poolAcompParaMesa(membros,mk).slice(0,1) : [];
      out.push({dir, mk, r, membros, acs,
        ajustes: membros.map(m=>({m, aj:ajusteRefMembro(r,m,mk,acs)}))});
    });
  });
  return out.sort((a,b)=> b.membros.length-a.membros.length || MEALK.indexOf(a.mk)-MEALK.indexOf(b.mk));
}
function poolAcompParaMesa(membros,mk){
  return acompanhamentos().filter(x=>avaliaReceita(x,membros,mk,false).ok)
    .sort((a,b)=>{ const da=disponibilidadeReceita(a).pronta, db=disponibilidadeReceita(b).pronta;
      if(da!==db) return da? -1:1; return a.n.localeCompare(b.n,'pt'); });
}

            · ${Math.round((g.r.k+somaAc(aj.ac.map(id=>RECIPES.find(x=>x.id===id)).filter(Boolean),'k'))*aj.dose)} kcal</div>`).join('')}</div>
        </div>
        <div class="row" style="flex:none;flex-direction:column;align-items:stretch">

function grupoPartilhaRef(rid,mk,dir){ return sugestoesPartilhaRef().find(g=>g.r.id===rid&&g.mk===mk&&g.dir===dir); }
function registarPartilhaRef(rid,mk,dir){
  const g=grupoPartilhaRef(rid,mk,dir); if(!g) return;

function planearPartilhaRef(rid,mk,dir){
  const g=grupoPartilhaRef(rid,mk,dir); if(!g) return;
  /* no primeiro dia da semana em que aquela refeição ainda está por escolher */
  let di=-1;
  for(let i=0;i<7;i++){ const meal=(planWeek()[i]||{})[mk]; if(!meal||!meal.r){ di=i; break; } }
  if(di<0) di=0;
  const meal=planMeal(di,mk);
  meal.r=rid; meal.ac=g.acs.map(x=>x.id); meal.m=g.membros.map(m=>m.id);
  save('refeição partilhada planeada');
  flash('ok',g.r.n+' → '+DAYN[di]+', '+nomeRefeicao(mk).toLowerCase()+', para '+g.membros.length+' pessoas.');

/* Sugestão de receita da época: uma receita por dia, das que estão na época e
   servem a casa, com o ingrediente sazonal à frente. */
function cartaoEpocaSugestao(){
  if((S.cozPref||{}).cartaoEpoca===false) return '';
  const mes=new Date().getMonth()+1;
  const membros=S.members.filter(m=>faseDe(m)!=='bebe');
  if(!membros.length) return '';
  const mk=new Date().getHours()<16? 'a':'j';
  let pool=receitasDe(mk).filter(receitaDaEpoca).filter(r=>compatAll(r,membros));
  if(!pool.length) pool=receitasDe(mk).filter(receitaDaEpoca);
  if(!pool.length) return '';
  /* pontua: mais ingredientes da época, o género certo para a estação, o que
     já está na despensa e o que encaixa no food prep já planeado */
  const prep=querPrep()? planoFoodPrep() : [];
  const notas=pool.map(r=>({r,
    p: ingredientesDaEpoca(r,mes).length*2 + pesoGenero(r,mk)
       + (disponibilidadeReceita(r).pronta? 2:0) + encaixaNoPrep(r,prep)*0.5}));
  notas.sort((a,b)=>b.p-a.p || a.r.n.localeCompare(b.r.n,'pt'));
  /* roda com o dia, para não ser sempre a mesma */
  const topo=notas.slice(0,6);

  const daEp=ingredientesDaEpoca(r,mes);

        <span class="sub" style="display:block">${nomeRefeicao(mk)} · ${r.k} kcal por dose · ${CUIS[r.coz]}
          ${disponibilidadeReceita(r).pronta? ' · <b style="color:var(--ok)">pronta a cozinhar</b>':''}</span>
        <span class="sub" style="display:block">${esc(textoConservacao(r))}</span>

  </div>`;
}

/* ================= COMPRAS ================= */
/* Os grupos da lista: as secções de supermercado mais um grupo próprio para
   os suplementos, que não se compram no mesmo corredor. O índice é partilhado
   pelo render e pelo atualizador, para os contadores por secção baterem certo. */
function gruposCompras(){ return CATS.map(c=>c[0]).concat(['Suplementos']); }
function grupoDoItem(it){
  if(it.u==='dose') return CATS.length;
  /* A secção do supermercado vem da classificação do próprio INSA sempre que
     o ingrediente vem de lá: é mais fiável do que qualquer expressão sobre o
     nome, e não confunde gnocchi com batatas. */
  if(temChave(NUTRI,it.n) && NUTRI[it.n].s>=0 && NUTRI[it.n].s<CATS.length) return NUTRI[it.n].s;
  if(temChave(SEC_FIXA,it.n)){
    const i=CATS.findIndex(c=>c[0]===SEC_FIXA[it.n]);
    if(i>=0) return i;
  }
  for(const [i,[cat,re]] of CATS.entries()) if(re.test(it.n)) return i;
  return CATS.length-1;
}
function shoppingItems(){
  const dates=weekDates(S.week), w=S.plans[S.week]||{}, agg={};
  let meals=0;
  for(let di=0;di<7;di++) for(const mk of MEALK){
    const meal=w[di]?.[mk]; if(!meal||!meal.r) continue;
    const r=RECIPES.find(x=>x.id===meal.r); if(!r) continue;
    /* os convidados comem do mesmo tacho: contam nas quantidades como qualquer
       pessoa à mesa, mesmo não tendo perfil */
    const n=S.members.filter(m=>meal.m.includes(m.id)&&!isCheat(m.id,dates[di])).length + nConvidados(meal);
    if(!n) continue; meals++;
    /* Dobrar dobra o PRATO; os acompanhamentos fazem-se frescos em cada dia —
       é assim na cozinha, e o lugar do acompanhamento já é um slot próprio.
       Por isso o dia que aquece não compra o prato, mas compra a salada. */
    const fPrato=fatorCompras(di,mk);
    /* o acompanhamento entra na lista pela mesma porta que o prato: quem come
       arroz de tomate ao jantar tem de comprar o arroz e o tomate. E entra
       pela fatia que lhe cabe do lugar: com meia dose de batatas e meia de
       salada compram-se meias quantidades das duas, senão a lista pedia comida
       a mais do que a que a conta das calorias contou. */
    const acs=acompsDe(meal), q=fatiaAc(acs);
    const junta=(lista,fator)=>lista.forEach(([nome,quant,u])=>{ const key=nome+'|'+u;
      if(!agg[key]) agg[key]={n:nome,u,q:0}; agg[key].q+=quant*n*fator; });
    junta(r.i,fPrato);
    acs.forEach(x=>junta(x.i,q));
  }
  /* Os suplementos consomem-se todos os dias, não por refeição planeada:
     entram na lista pelas doses de sete dias, para a compra da semana
     ficar completa. Um cheat day não suspende um multivitamínico. */
  S.members.forEach(m=>suplementosDe(m).forEach(s=>{
    const sp=SUPL[s.s], key=sp.nome+'|dose';
    if(!agg[key]) agg[key]={n:sp.nome,u:'dose',q:0};
    agg[key].q += (parseFloat(s.doses)||0)*7;
  }));
  return {items:Object.values(agg),meals};
}
/* Marcar um item não redesenha a lista: no supermercado, com o telemóvel numa
   mão, o scroll e o foco ficam onde estavam. Se faltar algum id, cai no render
   completo — nunca dessincroniza. */
function toggleBought(key,el){ if(!S.bought[S.week]) S.bought[S.week]={};
  const novoEstado=!S.bought[S.week][key];
  S.bought[S.week][key]=novoEstado;
  /* comprar um ingrediente é o sinal mais natural de que ele passa a estar
     em casa — a despensa atualiza-se sozinha. Desmarcar não o remove: pode
     ter sido só um engano, não significa que a prateleira ficou vazia. */
  if(novoEstado){ const nome=key.split('|')[0]; if(nome) S.despensa[nome]=true; }
  save();
  const li=el&&el.closest? el.closest('li'):null;
  if(!li||!document.getElementById('co-bar')){ render(); return; }
  li.classList.toggle('done',novoEstado);
  atualizarCompras();
  if(novoEstado) atualizarFaltaComprar();   /* comprar pode ter tirado este item do que falta */
}
function atualizarFaltaComprar(){
  const corpo=document.getElementById('falta-corpo'); if(!corpo) return;
  const {items}=shoppingItems();
  corpo.innerHTML=corpoFaltaComprar(items);
}
function atualizarCompras(){
  const bar=document.getElementById('co-bar'); if(!bar) return;
  const {items}=shoppingItems(); const bought=S.bought[S.week]||{};
  const done=items.filter(i=>bought[i.n+'|'+i.u]).length, total=items.length;
  bar.style.width=(total? done/total*100:0)+'%';
  bar.style.background=(done===total&&total)? 'var(--ok)':'var(--accent)';
  const num=document.getElementById('co-num');
  if(num){ if(done===total&&total){ num.textContent='tudo comprado ✓'; num.setAttribute('class','f-ok-txt'); }
    else { num.textContent=done+'/'+total+' comprados'; num.removeAttribute('class'); } }
  gruposCompras().forEach((c,i)=>{ const el=document.getElementById('co-sec-'+i); if(!el) return;
    const lis=[].slice.call(document.querySelectorAll('li[data-sec="'+i+'"]'));
    const dn=lis.filter(li=>li.classList.contains('done')).length;
    const completo=lis.length&&dn===lis.length;
    el.textContent=(completo?'✓ ':'')+dn+'/'+lis.length;
    el.setAttribute('class', completo?'sub cat-conta f-ok-txt':'sub cat-conta');
    if(el.parentElement) el.parentElement.classList.toggle('feita',!!completo);
  });
}
function fmtQ(it){ return fmtQtd(it.q,it.u); }
/* Sem a guarda, em http simples (rede local) navigator.clipboard é undefined e
   o botão atirava um TypeError sem dizer nada a ninguém. */
function copyList(){
  const {items}=shoppingItems();
  const txt='Lista de compras — semana de '+fmtShort(S.week)+'\n'+items.map(i=>`• ${i.n}: ${fmtQ(i)}`).join('\n');
  const ok=()=>alert('Lista copiada! Cola-a numa mensagem ou nota.');
  const manual=()=>{ const ta=document.getElementById('co-txt');
    if(!ta){ alert('O browser não deixou copiar. Abre o separador Dados para exportares.'); return; }
    ta.style.display='block'; ta.value=txt; ta.focus(); ta.select();
    try{ ta.setSelectionRange(0,txt.length); }catch(e){}
    let feito=false; try{ feito=document.execCommand('copy'); }catch(e){}
    alert(feito? 'Lista copiada! Cola-a numa mensagem ou nota.'
      : 'Seleciona o texto da caixa abaixo e copia à mão (Ctrl+C).');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, manual);
  } else manual();
}
function renderCompras(){
  if(!S.members.length) return noMembers();

          items.forEach(it=>{ const p=precoDe(it.n); if(!p){ sem++; return; } com++;
            t+=p.v*it.q/((it.u==='g'||it.u==='ml')?1000:1); });
          if(!com) return ' · <button class="chip" style="padding:1px 8px" onclick="irPorPrecos()">💶 pôr preços</button>';
          return ' · <b>talão previsto ~'+nPT(t,2)+' €</b>'+(sem? ' <span class="sub">(faltam '+sem+' preços)</span>':''); })()}</span></div>
    <div class="row">
      <button class="btn" onclick="abrirMercado()">🛒 Estou no supermercado</button>

  <div class="co-topo"><div class="mbar" style="height:10px;max-width:640px;margin:0">

  <div class="card" style="max-width:640px">
    ${grouped.filter(([,arr])=>arr.length).map(([cat,arr])=>{
      const iSec=grupos.indexOf(cat);

      <ul class="shop">${arr.sort((a,b)=>a.n.localeCompare(b.n)).map(it=>{
        const key=it.n+'|'+it.u, ok=bought[key];

/* O que falta comprar de facto: a lista completa acima, menos o que já está
   na despensa — é isto que se exporta, não a lista inteira. */

function copiarListaFalta(){
  const {items}=shoppingItems(); const em=itensEmFalta(items);
  if(!em.length) return flash('ok','Já tens em casa todos os ingredientes das receitas planeadas para esta semana.');
  const txt=textoListaFalta(items);
  const ok=()=>alert('Lista copiada! Cola-a no Keep, nos Lembretes ou onde precisares.');
  const manual=()=>{ const ta=document.getElementById('falta-txt');
    if(!ta){ alert('O browser não deixou copiar.'); return; }
    ta.style.display='block'; ta.value=txt; ta.focus(); ta.select();
    try{ ta.setSelectionRange(0,txt.length); }catch(e){}
    let feito=false; try{ feito=document.execCommand('copy'); }catch(e){}
    alert(feito? 'Lista copiada! Cola-a no Keep, nos Lembretes ou onde precisares.'
      : 'Seleciona o texto da caixa abaixo e copia à mão (Ctrl+C).');
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,manual);
  else manual();
}

   Toggle sempre por ÍNDICE no catálogo (nunca pelo nome dentro de um
   onclick): o catálogo é uma função determinística das receitas, por isso
   o mesmo índice aponta sempre para o mesmo ingrediente entre o render e o
   clique — sem ter de escapar aspas nem confiar em nomes livres. */
function toggleDespensaIdx(i){
  const nome=catalogoDespensa()[i]; if(!nome) return;
  if(S.despensa[nome]) delete S.despensa[nome]; else S.despensa[nome]=true;
  save('despensa: '+nome); render();
}
function marcarTodaDespensa(){
  catalogoDespensa().forEach(n=>S.despensa[n]=true);
  save('despensa toda marcada'); render();
}
function limparDespensa(){

/* Filtro de texto sem re-render: mexer no #main destruiria a própria caixa
   de pesquisa a meio da escrita. Só se escondem/mostram as linhas. */
function filtrarDespensa(el){
  const q=(el.value||'').toLowerCase().trim();
  document.querySelectorAll('#despensa-lista li').forEach(li=>{
    li.style.display = !q || li.textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none';
  });
}

/* Os alergénios que os membros da casa têm marcados: são estes que valem a
   pena assinalar em cada ingrediente da despensa, e não os catorze todos. */
function alergiasDaCasa(){
  const s=[];
  S.members.forEach(m=>restricoesDe(m).filter(ehAlergenio).forEach(t=>{ if(s.indexOf(t)<0) s.push(t); }));
  return s;

/* ================= COMPRAS POR CONFIRMAR =================
   Uma lista de compras que ficou por marcar significa uma de duas coisas: ou
   as compras não se fizeram, ou fizeram-se e ninguém as foi apontar. A segunda
   é de longe a mais frequente — daí a app perguntar, uma vez por sessão, ao
   entrar na despensa, e deixar validar item a item em vez de tudo ou nada. */
function listasPendentes(){
  const guarda=S.week, out=[];
  /* a semana atual e as duas anteriores: mais para trás é história, não uma
     compra por fazer */
  for(let k=0;k<3;k++){
    const wk=mondayISO(addDias(hojeISO(),-7*k));
    S.week=wk;
    const items=shoppingItems().items;
    const marcados=S.bought[wk]||{};
    const falta=items.filter(it=>!marcados[it.n+'|'+it.u] && !temNaDespensa(it.n));
    if(falta.length) out.push({wk, itens:falta});
  }
  S.week=guarda;
  return out;
}
function talvezPerguntarCompras(){
  if(jaPerguntouCompras || modalAberto() || tourAtivo()) return;
  jaPerguntouCompras=true;
  const listas=listasPendentes();
  if(!listas.length) return;
  const l=listas[0];
  abrirModal('compras',{wk:l.wk, marcados:l.itens.reduce((o,it)=>{ o[it.n+'|'+it.u]=true; return o; },{})});
}
